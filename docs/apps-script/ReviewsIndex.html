<!DOCTYPE html>
<!--
  경원영업팀 바이럴분석 대시보드 — Apps Script 가 서빙하는 화면 (2026-08-31)

  **Apps Script 편집기에서 파일 이름을 `ReviewsIndex` 로 만들 것**(확장자 없이).
  `Reviews.gs` 의 `doGet` 이 이 이름으로 찾는다.

  ## 왜 이 화면이 Apps Script 안에 있나
  *"vercel 앱은 전산PC에서 보안이슈로열리지않아"* (사장님, 2026-08-31).
  세일즈 코파일럿 본체는 매장 폰에서 열리지만 전산PC 에서는 막힌다. 이 화면은
  `script.google.com` 이라 전산PC 에서 열린다 — **그것이 존재 이유다.**

  ## 화면 규칙은 본체와 같다
  삼성 블루(#1428A0) 한 색 · 심플 · 시인성. 이모지를 쓰지 않는다(OS 마다 모양이 다르다).
  숫자는 **무엇을 센 것인지 함께 적는다** — 이 저장소가 대시보드에서 되풀이해 데인 자리다.
-->
<base target="_blank">
<style>
  :root {
    --blue: #1428A0; --ink: #15181E; --mute: #6B7280; --line: #E5E8EB;
    --bg: #F7F8FA; --card: #FFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 14px; line-height: 1.6; padding: 0 0 40px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  header { background: var(--blue); color: #fff; padding: 18px 0 20px; margin-bottom: 18px; }
  header h1 { font-size: 17px; font-weight: 800; letter-spacing: -.3px; }
  header p { font-size: 11.5px; color: rgba(255,255,255,.72); margin-top: 3px; }
  .hrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .btn {
    background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 8px;
    padding: 5px 11px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .stamp { font-size: 11px; color: rgba(255,255,255,.65); }

  /* 일일 수집한도 — 「지금 수집」 바로 옆이라 남색 바 위에 얹힌다 */
  .lim {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: rgba(255,255,255,.75);
    border-left: 1px solid rgba(255,255,255,.22); padding-left: 10px; margin-left: 2px;
  }
  .lim input {
    width: 68px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12);
    color: #fff; border-radius: 6px; padding: 4px 6px; font-size: 11.5px; font-family: inherit;
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .lim input:focus { outline: 2px solid rgba(255,255,255,.5); outline-offset: -1px; }
  .limuse { font-size: 10.5px; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
  /* 한도가 한 바퀴에 모자라면 눈에 띄게 — 매일 중간에서 끊긴다는 뜻이다 */
  .limuse.low { color: #FCD34D; font-weight: 700; }

  /* 네 칸 — 일간·주간·월간·누적. 사장님이 요청하신 그 넷이다. */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; }
  .kpi .n { font-size: 26px; font-weight: 800; color: var(--blue); letter-spacing: -1px; }
  .kpi .l { font-size: 11.5px; color: var(--mute); font-weight: 700; margin-top: 1px; }
  .kpi .s { font-size: 10px; color: #9AA1AC; margin-top: 2px; }
  /* 누적이 이 화면의 주인공이다 — 「오늘 0」이 첫 칸이라 사라진 것처럼 읽혔다 */
  .kpi.big { background: var(--blue); border-color: var(--blue); }
  .kpi.big .n { color: #fff; }
  .kpi.big .l { color: #BFC9F0; }
  .kpi.big .s { color: #8FA0E0; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; font-weight: 800; margin-bottom: 3px; }
  .card .sub { font-size: 11px; color: var(--mute); margin-bottom: 11px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .two { grid-template-columns: 1fr; }
  }

  /* 막대 — 매장별·카페별 */
  .bar { display: grid; grid-template-columns: 108px 1fr 40px; gap: 8px; align-items: center; margin-bottom: 5px; }
  .bar .nm { font-size: 11.5px; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .tr { background: #EEF1F6; border-radius: 999px; height: 9px; overflow: hidden; }
  .bar .fl { background: linear-gradient(90deg, #1428A0, #3B5BDB); height: 100%; border-radius: 999px; }
  .bar .vl { font-size: 11px; color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; }

  /* 링크 목록 */
  .item { padding: 9px 0; border-top: 1px solid #F1F3F5; }
  .item:first-child { border-top: 0; }
  .item a { color: var(--ink); text-decoration: none; font-size: 12.5px; font-weight: 600; }
  .item a:hover { color: var(--blue); text-decoration: underline; }
  .meta { font-size: 10.5px; color: var(--mute); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { background: #EEF2FF; color: var(--blue); border-radius: 5px; padding: 1px 6px; font-weight: 700; font-size: 10px; }
  .tag.c { background: #F0FDF4; color: #15803D; }

  .filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 3px 10px; font-size: 11px; cursor: pointer; font-family: inherit; color: #374151;
  }
  .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }

  .note { font-size: 11px; color: var(--mute); background: #F8FAFC; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .warn { background: #FFFBEB; border-color: #FDE68A; color: #92400E; }
  .empty { color: var(--mute); font-size: 12px; padding: 18px 0; text-align: center; }
  .more { font-size: 10.5px; color: var(--mute); text-align: right; padding-top: 6px; }

  /* 막대를 눌러 그 매장·카페의 링크만 보는 손잡이 — 누를 수 있다는 것이 보여야 한다 */
  .bar.pick { cursor: pointer; border-radius: 6px; padding: 1px 4px; margin-left: -4px; }
  .bar.pick:hover { background: #F4F6FB; }
  .bar.pick.on { background: #EEF2FF; }
  .bar.pick.on .nm { color: var(--blue); font-weight: 700; }

  .lhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .lhead .sub { margin-bottom: 0; }
  .dl {
    flex-shrink: 0; border: 1px solid var(--line); background: #fff; color: var(--blue);
    border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .dl:hover { background: #F4F6FB; }

  .picked { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .picked:empty { display: none; }
  .pill {
    background: var(--blue); color: #fff; border: 0; border-radius: 999px;
    padding: 3px 10px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .cntxt { font-size: 11px; color: var(--mute); }

  /* 유형 칩 — 8종뿐이라 막대로 그리면 자리만 먹는다. 누르면 그 유형만 본다
     (매장·카페 막대와 같은 규칙 — 건수만 있고 링크로 갈 길이 없으면 확인할 수가 없다). */
  .kinds { display: flex; gap: 6px; flex-wrap: wrap; }
  .kchip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
    color: #374151; display: flex; align-items: center; gap: 6px;
  }
  .kchip:hover { background: #F4F6FB; }
  .kchip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .kchip b { font-size: 13px; font-weight: 800; }
  .kchip .pc { font-size: 10px; opacity: .7; }

  /* 관심 카페 — 지목받은 곳은 건수가 적어도 늘 보인다 */
  .watch { display: flex; gap: 5px; flex-wrap: wrap; margin: 2px 0 10px; }
  .wchip {
    border: 1px solid var(--line); background: #F8FAFF; border-radius: 8px;
    padding: 4px 9px; font-size: 11px; cursor: pointer; font-family: inherit; color: #374151;
  }
  .wchip:hover { background: #EEF2FF; }
  .wchip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .wchip b { font-weight: 800; margin-left: 3px; }
  /* 못 닿는 곳 — 0 건이 아니라 「받을 수 없다」다. 누를 수도 없다 */
  .wchip.na { cursor: default; color: var(--mute); background: #fff; border-style: dashed; }
  .wchip.na:hover { background: #fff; }
</style>

<header>
  <div class="wrap">
    <h1>경원영업팀 바이럴분석</h1>
    <p>네이버 블로그 · 카페(다이렉트웨딩 · 메이크마이웨딩 · 레몬테라스 · 요즘웨딩 · 맘카페 · 입주카페)</p>
    <div class="hrow">
      <span class="stamp" id="stamp">불러오는 중…</span>
      <button class="btn" id="run">지금 수집</button>
      <!-- 일일 수집한도 (2026-08-31 사장님 요청) — **오늘 쓴 양을 함께 적는다.**
           한도만 있고 쓴 양이 없으면 남은 몫을 가늠할 수 없다. -->
      <span class="lim">
        <label for="lim">일일 한도</label>
        <input id="lim" type="number" min="100" max="50000" step="100" inputmode="numeric">
        <span>회</span>
        <button class="btn" id="lim-save">저장</button>
        <span class="limuse" id="lim-use">–</span>
      </span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="kpis">
    <div class="kpi big"><div class="n" id="k-total">–</div><div class="l">전체 누적</div><div class="s" id="k-sub">–</div></div>
    <div class="kpi"><div class="n" id="k-month">–</div><div class="l">최근 30일</div><div class="s">이 기간에 쓰인 글</div></div>
    <div class="kpi"><div class="n" id="k-week">–</div><div class="l">최근 7일</div><div class="s">이 기간에 쓰인 글</div></div>
    <div class="kpi"><div class="n" id="k-day">–</div><div class="l">오늘</div><div class="s">오늘 쓰인 글</div></div>
  </div>

  <div id="status"></div>

  <div class="card">
    <h2>후기 유형</h2>
    <div class="sub">제목의 말로 가른다 · 눌러서 그 유형 링크만 보기</div>
    <div class="kinds" id="kinds"></div>
  </div>

  <div class="two">
    <div class="card">
      <h2>매장별</h2>
      <div class="sub" id="store-sub">–</div>
      <div id="stores"></div>
    </div>
    <div class="card">
      <h2>어디에 올라오나</h2>
      <div class="sub">카페 이름 기준 · 블로그는 개인 블로그라 따로 세지 않는다</div>
      <!-- 관심 카페 — 사장님이 지목한 곳은 **건수가 적어도 늘 보여야 한다.**
           아래 막대는 상위 12곳뿐이라 2~3건짜리는 영영 안 올라온다. -->
      <div class="watch" id="watch"></div>

  <div class="card" id="list-card">

      <div>
        <h2>후기 링크</h2>
        <div class="sub">최근 순 · 눌러서 원문 열기 · 위 막대를 누르면 그 매장·카페만</div>
      </div>
      <button class="dl" id="csv">CSV 내려받기</button>
    </div>
    <div class="picked" id="picked"></div>

  <div class="note" id="basis"></div>
</div>

<script>
  var DATA = <?= data ?>;
  var srcFilter = '전체';
  var storeFilter = '';   /* 매장 막대를 눌러 걸린 값 */
  var cafeFilter = '';    /* 카페 막대를 눌러 걸린 값 */
  var kindFilter = '';    /* 유형 칩을 눌러 걸린 값 */
  var watchFilter = '';   /* 관심 카페 칩 — 부분일치라 cafeFilter 와 따로 둔다 */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function nf(n) { return Number(n || 0).toLocaleString('ko-KR'); }

  /* 막대 — 값이 0 이면 그리지 않는다(빈 막대가 줄지어 서면 진짜 신호가 묻힌다).
     **다만 0 건도 세어서 밝힌다** — 65개 매장을 전부 수집하므로(2026-08-31 사장님 지시)
     후기가 아직 없는 곳이 여럿이다. 안 적으면 *"우리 매장이 목록에 없다"* 로 읽힌다.
     감추는 것과 없는 것은 다른 말이다. */
  function bars(el, obj, limit, total, kind) {
    var all = Object.keys(obj).map(function (k) { return [k, obj[k]]; });
    var arr = all.filter(function (p) { return p[1] > 0; })
      .sort(function (a, b) { return b[1] - a[1]; });
    var zero = (total || all.length) - arr.length;
    var shown = arr.slice(0, limit);
    if (!shown.length) { el.innerHTML = '<div class="empty">아직 없습니다</div>'; return; }
    var max = shown[0][1];
    /* **막대를 누르면 그 건수의 링크만 본다**(2026-08-31 사장님 지시). 건수만 있고
       링크로 갈 길이 없으면 *"북수원 50건"* 을 보고도 그 50 개를 확인할 수가 없다. */
    var html = shown.map(function (p) {
      var on = (kind === 'store' ? storeFilter : cafeFilter) === p[0];
      return '<div class="bar pick' + (on ? ' on' : '') + '" data-k="' + esc(kind) + '" data-v="' + esc(p[0]) + '">' +
        '<div class="nm" title="' + esc(p[0]) + '">' + esc(p[0]) + '</div>' +
        '<div class="tr"><div class="fl" style="width:' + Math.max(3, p[1] / max * 100) + '%"></div></div>' +
        '<div class="vl">' + nf(p[1]) + '</div></div>';
    }).join('');
    var tail = [];
    if (arr.length > limit) tail.push('그 밖 ' + (arr.length - limit) + '곳');
    if (zero > 0) tail.push('아직 0건 ' + zero + '곳');
    tail.push('눌러서 링크 보기');
    html += '<div class="more">' + tail.join(' · ') + '</div>';
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('.pick'), function (b) {
      b.onclick = function () {
        var v = b.dataset.v;
        if (b.dataset.k === 'store') { storeFilter = storeFilter === v ? '' : v; cafeFilter = ''; }
        else { cafeFilter = cafeFilter === v ? '' : v; storeFilter = ''; watchFilter = ''; }
        render();
        document.getElementById('list-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
  }

  /* 지금 걸린 거름망을 지나는 줄 — 목록·CSV·건수가 **같은 함수를 본다.**
     따로 세면 화면이 "50건"이라 적고 CSV 에는 48건이 담기는 어긋남이 난다. */
  function filtered() {
    return (DATA.recent || []).filter(function (r) {
      if (srcFilter !== '전체' && r.src !== srcFilter) return false;
      if (storeFilter && r.storeName !== storeFilter) return false;
      if (cafeFilter && r.cafe !== cafeFilter) return false;
      if (kindFilter && r.kind !== kindFilter) return false;
      if (watchFilter && String(r.cafe || '').replace(/s+/g, '').indexOf(watchFilter.replace(/s+/g, '')) < 0) return false;
      return true;
    });
  }

  /* 유형 칩 — 많은 것부터. '기타'는 **감추지 않고 맨 뒤에 둔다**: 못 가른 것이
     얼마나 되는지 보여야 판정을 고칠지 판단할 수 있다(0건도 세어 밝히는 것과 같은 규칙). */
  function renderKinds() {
    var el = document.getElementById('kinds'); if (!el) return;
    var obj = DATA.byKind || {}, tot = 0, k;
    for (k in obj) tot += obj[k];
    var arr = Object.keys(obj).filter(function (x) { return obj[x] > 0; })
      .sort(function (a, b) {
        if (a === '기타') return 1; if (b === '기타') return -1;
        return obj[b] - obj[a];
      });
    if (!arr.length || !tot) { el.innerHTML = '<div class="empty">아직 없습니다</div>'; return; }
    el.innerHTML = arr.map(function (x) {
      return '<button class="kchip' + (kindFilter === x ? ' on' : '') + '" data-v="' + esc(x) + '">' +
        esc(x) + ' <b>' + nf(obj[x]) + '</b>' +
        '<span class="pc">' + Math.round(obj[x] / tot * 100) + '%</span></button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.kchip'), function (b) {
      b.onclick = function () {
        kindFilter = kindFilter === b.dataset.v ? '' : b.dataset.v;
        render();
        document.getElementById('list-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
  }

  /* 관심 카페 — 시트의 카페 이름은 전체 이름(`레몬테라스 [인테리어,리폼,…]`)이라
     **부분일치로 거른다.** 그래서 `cafeFilter`(정확 일치)와 별도 손잡이가 필요하다. */
  function renderWatch() {
    var el = document.getElementById('watch'); if (!el) return;
    var ws = DATA.watch || [];
    if (!ws.length) { el.innerHTML = ''; return; }
    el.innerHTML = ws.map(function (w) {
      /* **못 닿는 곳은 0 을 적지 않는다** — 「없다」와 「받을 수 없다」는 다른 말이다 */
      if (w.n === null || w.n === undefined) {
        return '<span class="wchip na" title="' + esc(w.why || '') + '">' +
          esc(w.name) + ' <b>' + esc(w.tag || '미포함') + '</b></span>';
      }
      return '<button class="wchip' + (watchFilter === w.name ? ' on' : '') + '" data-v="' +
        esc(w.name) + '">' + esc(w.name) + ' <b>' + nf(w.n) + '</b></button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.wchip[data-v]'), function (b) {
      b.onclick = function () {
        watchFilter = watchFilter === b.dataset.v ? '' : b.dataset.v;
        cafeFilter = '';
        render();
        document.getElementById('list-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
  }

  function renderList() {
    var rows = filtered();
    var el = document.getElementById('list');
    /* 무엇으로 걸렀는지 화면이 적는다 — 안 적으면 *"왜 몇 건뿐이지"* 가 된다 */
    var tags = [];
    if (storeFilter) tags.push(['매장', storeFilter, 'store']);
    if (cafeFilter) tags.push(['카페', cafeFilter, 'cafe']);
    if (kindFilter) tags.push(['유형', kindFilter, 'kind']);
    if (watchFilter) tags.push(['관심 카페', watchFilter, 'watch']);
    document.getElementById('picked').innerHTML = tags.length
      ? tags.map(function (t) {
          return '<button class="pill" data-k="' + t[2] + '">' + esc(t[0]) + ' <b>' + esc(t[1]) + '</b> ✕</button>';
        }).join('') + '<span class="cntxt">' + nf(rows.length) + '건</span>'
      : '';
    Array.prototype.forEach.call(document.querySelectorAll('#picked .pill'), function (b) {
      b.onclick = function () {
        if (b.dataset.k === 'store') storeFilter = '';
        else if (b.dataset.k === 'cafe') cafeFilter = '';
        else if (b.dataset.k === 'watch') watchFilter = '';
        else kindFilter = '';
        render();
      };
    });

    if (!rows.length) { el.innerHTML = '<div class="empty">아직 수집된 후기가 없습니다 — 위의 「지금 수집」을 눌러 보세요</div>'; return; }
    el.innerHTML = rows.map(function (r) {
      var m = ['<span class="tag' + (r.src === '카페' ? ' c' : '') + '">' + esc(r.src) + '</span>',
               '<b>' + esc(r.storeName) + '</b>'];
      if (r.kind) m.push('<b style="color:#0F766E">' + esc(r.kind) + '</b>');
      if (r.cafe) m.push(esc(r.cafe));
      m.push(esc(r.date) + (r.dated ? '' : ' <span class="tag c">추정</span>'));
      /* 블로그만 작성일이 있다 — 없는 것을 있는 척하지 않는다 */
      if (r.postdate && r.postdate.length === 8) {
        m.push('작성 ' + r.postdate.slice(0, 4) + '-' + r.postdate.slice(4, 6) + '-' + r.postdate.slice(6, 8));
      }
      return '<div class="item"><a href="' + esc(r.link) + '">' + esc(r.title) + '</a>' +
        '<div class="meta">' + m.join('<span style="color:#D1D5DB">·</span>') + '</div></div>';
    }).join('');
  }

  /* **모양이 아닌 것은 화면에 그리지 않는다.**
   *
   * 2026-08-31 사장님 신고: *"수집완료 후 새로고침을 하면 0 으로 숫자가 변경된다"*.
   * 배포본을 직접 받아 보니 서버는 멀쩡했다(`전체 1,459 · 오늘 761`). 범인은 이 줄이다 —
   * `nf(undefined)` 가 **"0"** 을 찍는다. 그래서 `getSummary()` 가 빈 값이나 오류 모양을
   * 한 번만 돌려줘도 **화면 전체가 0** 이 되고, 자료는 시트에 그대로 있는데 사라진 것처럼 보인다.
   *
   * `/api/viral` 라우트에는 *"못 받았으면 0 을 내밀지 않는다"* 를 이미 넣어 두고
   * **이 화면에는 안 넣었다.** 같은 규칙을 여기에도 둔다 — 옛 숫자를 지우지 않고
   * **무엇이 왔는지 적는다**(다음에 또 나면 원인을 짚을 수 있어야 한다).
   */
  function applySummary(d) {
    if (!d || typeof d.total !== 'number') {
      var what = d === null ? 'null'
        : d === undefined ? 'undefined'
        : (typeof d) + (typeof d === 'object' ? ' {' + Object.keys(d).slice(0, 6).join(',') + '}' : '');
      document.getElementById('status').innerHTML =
        '<div class="note warn"><b>화면을 새로 그리지 못했습니다</b> — 받은 값이 요약이 아닙니다 ('
        + esc(what) + ').<br><b>자료는 시트에 그대로 있습니다</b> — 위 숫자는 직전 값이고 '
        + '<a href="">이 쪽을 새로고침</a>하면 최신으로 보입니다.</div>';
      return false;
    }
    DATA = d; render(); return true;
  }

  /* 일일 수집한도 — **한도만 적지 않고 오늘 쓴 양을 함께 적는다.**
     남은 몫을 모르면 「지금 수집」을 눌러도 될지 판단할 수가 없다. */
  function renderLimit() {
    var box = document.getElementById('lim'), use = document.getElementById('lim-use');
    if (!box || !use) return;
    var lim = Number(DATA.dailyLimit) || 0, used = Number(DATA.dayUsed) || 0;
    var sweep = Number(DATA.sweep) || 0;
    if (document.activeElement !== box) box.value = lim || '';
    use.textContent = '오늘 ' + nf(used) + ' / ' + (lim ? nf(lim) : '–') + '회';
    /* **한 바퀴에 모자라면 그렇게 적는다** — 안 적으면 매일 중간에서 끊기는데
       화면에는 아무 표시도 안 난다(이 저장소가 되풀이해 경계하는 「조용한 실패」다). */
    var low = lim > 0 && sweep > 0 && lim < sweep;
    use.className = 'limuse' + (low ? ' low' : '');
    use.title = low
      ? '한 바퀴에 최대 ' + nf(sweep) + '회가 필요합니다 — 지금 한도로는 매번 중간에서 멈춥니다'
      : '한 바퀴에 최대 ' + nf(sweep) + '회';
  }

  function render() {
    renderLimit();
    document.getElementById('k-day').textContent = nf(DATA.day);
    document.getElementById('k-week').textContent = nf(DATA.week);
    document.getElementById('k-month').textContent = nf(DATA.month);
    document.getElementById('k-total').textContent = nf(DATA.total);
    var s = DATA.bySrc || {};
    document.getElementById('k-sub').textContent = '블로그 ' + nf(s['블로그']) + ' · 카페 ' + nf(s['카페']);

    var nStores = Object.keys(DATA.byStore || {}).filter(function (k) { return DATA.byStore[k] > 0; }).length;
    document.getElementById('store-sub').textContent =
      '후기가 잡힌 매장 ' + nStores + '곳 / 대상 ' + DATA.stores + '곳';

    renderKinds();
    renderWatch();
    bars(document.getElementById('stores'), DATA.byStore || {}, 20, DATA.stores, 'store');
    bars(document.getElementById('cafes'), DATA.byCafe || {}, 12, 0, 'cafe');

    /* **작성일을 아는 것과 모르는 것을 갈라 적는다.** 카페는 네이버가 작성일을 안 주므로
       그 줄은 우리가 처음 본 날이다 — 섞어 놓고 모른 척하면 화면이 거짓말을 한다. */
    var undated = (DATA.total || 0) - (DATA.dated || 0);
    document.getElementById('basis').innerHTML =
      '<b>세는 기준</b> — 일간·주간·월간·누적은 <b>「작성일」</b>입니다.'
      + ' 블로그는 네이버가 작성일을 주므로 그 날짜로 셉니다(<b>' + nf(DATA.dated) + '건</b>).'
      + (undated > 0
        ? ' <b>카페 ' + nf(undated) + '건은 네이버가 작성일을 주지 않아</b>(응답 필드에 아예 없습니다)'
          + ' 우리가 처음 본 날로 적습니다 — 목록에서 <span class="tag c">추정</span> 으로 표시됩니다.'
        : '')
      + ' 매일 새벽 3시에 자동으로 돌며 <b>같은 글은 링크로 걸러</b> 두 번 세지 않습니다.'
      + (DATA.newToday ? ' 오늘 새로 발견한 것은 <b>' + nf(DATA.newToday) + '건</b>입니다.' : '');

    document.getElementById('stamp').textContent =
      new Date(DATA.at).toLocaleString('ko-KR') + ' 기준';

    /* **마지막 수집이 실패했으면 그렇게 적는다** — 0 을 그냥 두면 "후기가 없다"로 읽힌다 */
    var st = document.getElementById('status'), L = DATA.lastRun;
    if (L && L.error) {
      /* **401 은 원인이 하나뿐이라 그것만 말한다.** "오류가 있었습니다" 로 뭉뚱그리면
         무엇을 고쳐야 하는지 알 수 없다(2026-08-31 실측으로 실제로 겪은 자리다). */
      var auth = /401|403|스크립트 속성/.test(L.error);
      st.innerHTML = '<div class="note warn">' + (auth
        ? '<b>네이버 API 키가 없거나 틀렸습니다</b> (' + esc(L.error) + ')<br>' +
          'Apps Script 편집기 → <b>⚙ 프로젝트 설정 → 스크립트 속성</b>에 아래 둘을 넣어 주세요.<br>' +
          '<b>NAVER_CLIENT_ID</b> · <b>NAVER_CLIENT_SECRET</b> ' +
          '(<a href="https://console.ncloud.com/naver-api-hub/application">NAVER API HUB</a> 에서 발급 · ' +
          '「사용자 속성」이 아니라 <b>「스크립트 속성」</b>입니다)<br>' +
          '<small>넣은 뒤 다시 배포할 필요 없이 「지금 수집」만 누르면 됩니다.</small>'
        : '<b>마지막 수집에서 오류가 있었습니다</b> — ' + esc(L.error)) + '</div>';
    } else if (!DATA.total) {
      st.innerHTML = '<div class="note">아직 한 번도 수집하지 않았습니다. 위의 <b>「지금 수집」</b>을 눌러 주세요(65개 매장 × 2소스라 1~2분 걸립니다).</div>';
    } else st.innerHTML = '';

    /* 출처 거르개 */
    var f = document.getElementById('filter');
    f.innerHTML = ['전체', '블로그', '카페'].map(function (k) {
      return '<button class="chip' + (k === srcFilter ? ' on' : '') + '" data-k="' + k + '">' + k + '</button>';
    }).join('');
    Array.prototype.forEach.call(f.querySelectorAll('.chip'), function (b) {
      b.onclick = function () { srcFilter = b.getAttribute('data-k'); render(); };
    });
    renderList();
  }

  /* **CSV 로 내려받는다** — 화면에서 훑는 것과 엑셀로 돌리는 것은 다른 일이다.
     지금 걸린 거름망 그대로 담으므로 *"북수원만"* 을 골라 그 링크만 받을 수 있다.
     화면 건수와 CSV 건수가 어긋나지 않게 **같은 `filtered()` 를 본다.** */
  document.getElementById('csv').onclick = function () {
    var rows = filtered();
    var head = ['날짜', '점코드', '지점명', '출처', '유형', '제목', 'URL', '카페', '작성일'];
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var body = rows.map(function (r) {
      return [r.date, r.store, r.storeName, r.src, r.kind, r.title, r.link, r.cafe, r.postdate].map(q).join(',');
    });
    /* **BOM 을 붙인다** — 없으면 엑셀이 UTF-8 을 못 알아보고 한글이 통째로 깨진다 */
    var blob = new Blob(['﻿' + head.map(q).join(',') + '\n' + body.join('\n')], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '바이럴분석_' + (storeFilter || cafeFilter || kindFilter || watchFilter || '전체') + '_'
      + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
  };

  /* 한도 저장 — **서버가 되돌려준 값으로 화면을 맞춘다.** 입력칸 값을 그대로 믿고
     그리면 서버가 거절했을 때 화면과 실제가 갈린다(100 미만·50,000 초과는 거절된다). */
  document.getElementById('lim-save').onclick = function () {
    var b = this, v = Number(document.getElementById('lim').value);
    b.disabled = true; b.textContent = '저장 중…';
    google.script.run
      .withSuccessHandler(function (r) {
        b.disabled = false; b.textContent = '저장';
        if (!r || !r.ok) {
          document.getElementById('status').innerHTML =
            '<div class="note warn"><b>한도를 바꾸지 못했습니다</b> — ' + esc((r && r.error) || '알 수 없는 오류') + '</div>';
          renderLimit();   /* 입력칸을 실제 값으로 되돌린다 */
          return;
        }
        DATA.dailyLimit = r.limit; DATA.dayUsed = r.used; DATA.sweep = r.sweep;
        renderLimit();
        document.getElementById('status').innerHTML =
          '<div class="note"><b>일일 한도를 ' + nf(r.limit) + '회로 정했습니다</b> — 오늘 '
          + nf(r.used) + '회 썼습니다.'
          + (r.sweep && r.limit < r.sweep
            ? ' <b style="color:#B45309">한 바퀴에 최대 ' + nf(r.sweep)
              + '회가 필요해 매번 중간에서 멈춥니다</b> — 다음 실행이 멈춘 매장부터 이어 갑니다.'
            : '') + '</div>';
      })
      .withFailureHandler(function (e) {
        b.disabled = false; b.textContent = '저장';
        document.getElementById('status').innerHTML =
          '<div class="note warn"><b>한도를 바꾸지 못했습니다</b> — ' + esc(e && e.message) + '</div>';
      })
      .setDailyLimit(v);
  };

  document.getElementById('run').onclick = function () {
    var b = this;
    b.disabled = true; b.textContent = '수집 중… (1~2분)';
    google.script.run
      .withSuccessHandler(function (r) {
        /* **수집 결과를 그대로 말한다.** `added:0` 은 실패가 아니라 *"새 글이 없었다"* 다 —
           이미 있는 글은 링크로 걸러지므로 두 번째부터는 대개 0~몇 건이다.
           이걸 안 밝히면 사장님처럼 *"수집했는데 0 이 됐다"* 로 읽힌다(2026-08-31 실제 신고). */
        document.getElementById('status').innerHTML =
          '<div class="note"><b>수집을 마쳤습니다</b> — ' + nf(r.got) + '건을 받아 '
          + nf(r.kept) + '건이 판정을 지났고, 그중 <b>새 글 ' + nf(r.added) + '건</b>을 더했습니다.'
          + (r.added === 0 ? ' <b>이미 모은 글은 다시 세지 않습니다</b> — 누적은 그대로입니다.' : '')
          + (r.error ? ' <span style="color:#B45309">오류: ' + esc(r.error) + '</span>' : '') + '</div>';
        b.textContent = '새로 ' + r.added + '건';

        /* **밑줄로 끝나는 이름은 부를 수 없다** — Apps Script 가 `summary_` 같은 이름을
           비공개로 취급해 `google.script.run` 에서 막는다. 그래서 공개 이름을 따로 둔다.
           **`withFailureHandler` 를 반드시 붙인다** — 없으면 이쪽이 실패했을 때 아무 일도
           안 일어나고 버튼이 「수집 중…」에 멈춘 채 화면이 옛 상태로 남는다(실제로 그랬다). */
        google.script.run
          .withSuccessHandler(function (d) {
            b.disabled = false; b.textContent = '지금 수집';
            /* **성공 처리기에 왔다고 값이 온 것은 아니다** — 빈 값이면 화면이 0 이 된다.
               `applySummary` 가 걸러 내고, 못 그렸으면 위에 적어 둔 안내가 남는다. */
            var okd = applySummary(d);
            if (okd) {
              /* 새 글이 있었으면 상태 줄이 방금 덮였다 — 다시 적어 준다 */
              if (r.added > 0) {
                document.getElementById('status').innerHTML =
                  '<div class="note"><b>새 글 ' + nf(r.added) + '건을 더했습니다</b> — 위 숫자가 갱신됐습니다.</div>';
              }
            }
          })
          .withFailureHandler(function (e) {
            b.disabled = false; b.textContent = '지금 수집';
            document.getElementById('status').innerHTML =
              '<div class="note warn"><b>수집은 끝났지만 화면을 새로 그리지 못했습니다</b> — '
              + esc(e && e.message) + '<br><b>자료는 시트에 그대로 있습니다.</b> '
              + '<a href="">이 쪽을 새로고침</a>하면 보입니다.</div>';
          })
          .getSummary();
      })
      .withFailureHandler(function (e) {
        b.disabled = false; b.textContent = '지금 수집';
        /* **「자료가 사라진 것이 아니다」를 분명히 적는다.** 수집이 실패해도 이미 모은
           것은 시트에 그대로 있는데, 화면이 그 말을 안 하면 없어진 줄 안다. */
        document.getElementById('status').innerHTML =
          '<div class="note warn"><b>수집에 실패했습니다</b> — ' + esc(e && e.message)
          + '<br>Apps Script 는 한 번에 6분까지만 돌 수 있어 시간이 오래 걸리면 끊깁니다. '
          + '<b>이미 모은 자료는 시트에 그대로 있습니다</b> — 다시 눌러도 중복은 쌓이지 않습니다.</div>';
      })
      .collectReviews();
  };

  render();
</script>
