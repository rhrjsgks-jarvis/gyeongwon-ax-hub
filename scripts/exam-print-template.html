<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시험지 출력기 — SAMSUNG STORE 레벨업 챌린지</title>
<style>
/*
 * **A4 인쇄 전용 화면** (2026-08-19 사용자 요청)
 *
 * 요구사항 그대로다 — 20문항을 **순수 랜덤**으로 뽑고(모든 품목이 나올 필요 없다),
 * **시험지와 정답지를 세트로** 내며, **누를 때마다 다른 시험지**가 나온다.
 *
 * ## 문항 옆에 품목 이름을 적지 않는다
 * 2026-08-19 사용자 요청 — 오른쪽 카테고리 칩(김치냉장고·청소기…)을 뺐다.
 * **품목 이름이 곧 답을 좁혀 주는 힌트**라 시험지에 있으면 안 된다.
 * 갈래(정책/제품) 비율은 조작 막대가 밝히므로 화면에서 확인할 수 있다.
 *
 * ## 시험지 코드가 핵심이다
 * 매번 다른 문제가 나오므로 여러 장 인쇄하면 시험지와 정답지가 섞인다.
 * 그래서 네 글자 코드를 **시드로** 쓰고 두 장 머리에 같은 코드를 찍는다 —
 * 코드를 넣으면 **같은 시험지를 다시 뽑을 수 있다**(재인쇄·채점 대조).
 *
 * ## 이 파일은 **빌드 결과물의 틀**이다 — 직접 배포하지 않는다
 * 사용자에게 가는 것은 `npm run build:examtool` 이 만드는 `tools/시험지출력기.html` 이고,
 * 그 파일은 문제은행을 **안에 통째로 담고 있어 더블클릭만으로 열린다**(인터넷·서버 불필요).
 * 여기 `__QUIZ_BANK__` 자리에 은행이 들어간다.
 *
 * **세일즈 코파일럿 앱에 붙이지 않는다**(2026-08-19 사용자 결정 —
 * *"오로지 시험문제 출력용 별도로 필요합니다 … 기존 세일즈코파일럿에 업데이트하는
 * 형식이 아닙니다"*). 한 번 `/exam-print` 라우트로 붙였다가 되돌렸다.
 * 그래서 `fetch` 를 쓸 수 없다 — `file://` 는 CORS 로 막힌다.
 *
 * ## 문제은행은 사본이 아니라 파생물이다
 * 단일 출처는 `public/test-app.html` 의 `QB` 다. 여기에 사본을 적어 두면 문항을
 * 늘렸을 때 조용히 어긋나므로, 빌드가 매번 원본에서 새로 읽어 넣고
 * `test-examtool` 이 "커밋된 것 == 재생성한 것"을 검사한다.
 */
:root{ --navy:#1428A0; --ink:#111; --sub:#555; --line:#d5d8e0; --bg:#f4f5f8; }
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
     color:var(--ink);background:var(--bg);line-height:1.5;-webkit-text-size-adjust:100%}

/* 조작 막대 — 인쇄에는 나오지 않는다 */
.bar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:12px 16px;
     display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bar h1{font-size:16px;margin:0 12px 0 0;font-weight:700;letter-spacing:-.02em}
.bar label{font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.bar input[type=number],.bar input[type=text]{width:64px;padding:5px 7px;border:0;border-radius:6px;
     font-size:13px;font-family:inherit;text-align:center}
.bar input[type=text]{width:82px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.btn{border:0;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;
     font-family:inherit;background:#fff;color:var(--navy)}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn:active{transform:translateY(1px)}
.hint{font-size:12px;opacity:.9;flex-basis:100%;margin-top:-2px}

/* 종이 */
#paper > .sheet:first-child{margin-top:16px}
.bar{scroll-margin-top:0}
#paper{padding-top:4px}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:14px auto;padding:12mm 13mm;
       box-shadow:0 2px 12px rgba(0,0,0,.12)}
.head{border-bottom:2.5px solid var(--navy);padding-bottom:7px;margin-bottom:10px;
      display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.head .t{font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}
.head .s{font-size:11.5px;color:var(--sub);margin-top:3px}
.head .code{font-size:12px;font-weight:800;letter-spacing:.1em;border:1.5px solid var(--navy);
            color:var(--navy);border-radius:5px;padding:4px 9px;white-space:nowrap}
.meta{display:flex;gap:18px;font-size:13px;color:var(--sub);margin-bottom:14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.fill{display:inline-block;border-bottom:1px solid #999;min-width:76px}

/* **글자 크기는 상담사가 시험장에서 읽는 크기다** — 2026-08-19 사용자 요청으로 키웠다
   ("A4 로 출력하면 너무 작게 나옵니다"). 시험지 2장 → 3장이 되는 대신 읽힌다.
   줄이려거든 쪽수부터 재 볼 것(.scratch/exam-pages.mjs). */
.q{margin:0 0 13px;page-break-inside:avoid;break-inside:avoid}
.qh{display:flex;gap:7px;align-items:baseline;font-size:18px;font-weight:700;margin-bottom:5px;line-height:1.4}
.qn{color:var(--navy);min-width:30px}
.qt{font-weight:600;flex:1}
.opts{list-style:none;margin:0;padding:0 0 0 37px}
.opts li{font-size:16px;margin:0 0 2px;display:flex;gap:7px;line-height:1.45}
.opts .no{color:var(--sub);flex-shrink:0}

/* 정답지 */
.akey{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:12px}
.akey div{border:1px solid var(--line);border-radius:4px;padding:4px 2px;text-align:center}
.akey b{display:block;font-size:10.5px;color:var(--sub);font-weight:600}
.akey span{font-size:14px;font-weight:800;color:var(--navy)}
/* 정답지는 채점용이라 한 장에 다 보이는 쪽이 낫다(사용자 요청). 2단으로 세운다 —
   글자를 더 줄이는 것보다 단을 나누는 편이 읽힌다. */
.exwrap{columns:2;column-gap:7mm}
.ex{font-size:10px;margin:0 0 4px;padding-bottom:3px;line-height:1.38;border-bottom:1px dotted var(--line);
    page-break-inside:avoid;break-inside:avoid}
.ex b{color:var(--navy)}
.ex .a{color:#166534;font-weight:700}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .bar,.noprint{display:none !important}
  .sheet{width:auto;min-height:0;margin:0;padding:11mm 12mm;box-shadow:none;page-break-after:always}
  .sheet:last-child{page-break-after:auto}
}
@media (max-width:820px){ .sheet{width:auto;min-height:0;padding:14px} }
</style>
</head>
<body>

<div class="bar noprint">
  <h1>시험지 출력기</h1>
  <label>문항 <input type="number" id="n" value="20" min="5" max="50"></label>
  <label>정책 <input type="number" id="pol" value="40" min="0" max="100">%</label>
  <label>코드 <input type="text" id="code" maxlength="4" placeholder="자동"></label>
  <button class="btn" id="gen">새 시험지</button>
  <button class="btn ghost" id="prt">인쇄</button>
  <div class="hint" id="hint">문제은행을 불러오는 중…</div>
  <div class="hint">인쇄창에서 <b>대상</b>을 <b>“PDF로 저장”</b>으로 고르면 파일로 남습니다 — 파일 이름은 시험지 코드가 붙습니다.</div>
</div>

<noscript><div class="sheet"><div class="head"><div><div class="t">자바스크립트를 켜 주세요</div>
<div class="s">시험지는 열 때마다 새로 뽑으므로 자바스크립트가 필요합니다. 브라우저 설정에서 켠 뒤 새로고침하세요.</div></div></div></div></noscript>

<div id="paper"></div>

<script>
/* 문제은행 — 빌드가 test-app.html 의 QB 에서 읽어 여기에 넣는다(사본이 아니라 파생물).
   **자립형 파일이라 fetch 를 쓸 수 없다** — file:// 는 CORS 로 막힌다. */
var BANK = /*__QUIZ_BANK__*/null;

/* ── 시드 난수 ──
   **왜 시드를 쓰나** — 시험지 코드로 같은 시험지를 다시 뽑을 수 있어야 한다.
   여러 장 인쇄하면 시험지와 정답지가 섞이는데, 코드가 있으면 짝을 되찾는다.
   Math.random 을 쓰면 그 순간 결과가 사라져 재인쇄가 불가능하다. */
function seedFrom(code){
  var h = 2166136261;
  for (var i = 0; i < code.length; i++){ h ^= code.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed){
  var s = seed || 1;
  return function(){ s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
/* I·O·0·1 은 뺀다 — 손으로 옮겨 적을 때 헷갈린다 */
var LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){
  var c = '';
  for (var i = 0; i < 4; i++) c += LETTERS.charAt(Math.floor(Math.random() * LETTERS.length));
  return c;
}
function shuffle(arr, rnd){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ── 문항 뽑기 ──
   사용자 요청 그대로 **순수 랜덤**이다 — 카테고리마다 반드시 나오게 하지 않는다
   (그건 /test 앱이 하는 일이고 여기는 성격이 다르다).
   정책 비율만 맞추고, 정책 문항이 모자라면 **모자란 만큼 제품으로 채우고 그 사실을 밝힌다.** */
function pick(n, polPct, rnd){
  var pol = [], pro = [];
  for (var i = 0; i < BANK.items.length; i++)
    (BANK.items[i].type === 'policy' ? pol : pro).push(BANK.items[i]);
  var wantPol = Math.round(n * polPct / 100);
  var gotPol = Math.min(wantPol, pol.length);
  var picked = shuffle(pol, rnd).slice(0, gotPol).concat(shuffle(pro, rnd).slice(0, n - gotPol));
  return { list: shuffle(picked, rnd), wantPol: wantPol, gotPol: gotPol };
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
var NO = ['①','②','③','④','⑤'];

function render(code, n, polPct){
  var rnd = rng(seedFrom(code));
  var r = pick(n, polPct, rnd);

  /* 보기 순서도 섞는다 — 같은 문항이라도 시험지마다 답 위치가 달라야 한다 */
  var qs = r.list.map(function(q){
    var order = shuffle([0,1,2,3], rnd);
    return { q:q.q, cat:q.cat, type:q.type, exp:q.exp,
             opts: order.map(function(i){ return q.opts[i]; }),
             ans: order.indexOf(q.ans) };
  });

  var d = new Date();
  var ymd = d.getFullYear() + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + ('0'+d.getDate()).slice(-2);

  function head(title, sub){
    return '<div class="head"><div><div class="t">' + title + '</div>' +
           '<div class="s">' + sub + '</div></div>' +
           '<div class="code">시험지 ' + code + '</div></div>';
  }

  var h = '<div class="sheet">' +
    head('SAMSUNG STORE 레벨업 챌린지', '2026 삼성 제품 전문가 성장 프로그램 · ' + ymd) +
    '<div class="meta"><span>이름 <span class="fill"></span></span>' +
    '<span>사번 <span class="fill"></span></span>' +
    '<span>매장 <span class="fill"></span></span>' +
    '<span><b>' + qs.length + '문항</b> · 각 ' + (100/qs.length).toFixed(qs.length===20?0:1) +
    '점 · 100점 만점</span></div>';
  qs.forEach(function(q, k){
    h += '<div class="q"><div class="qh"><span class="qn">' + (k+1) + '.</span>' +
         '<span class="qt">' + esc(q.q) + '</span></div><ul class="opts">';
    q.opts.forEach(function(o, i){
      h += '<li><span class="no">' + NO[i] + '</span><span>' + esc(o) + '</span></li>';
    });
    h += '</ul></div>';
  });
  h += '</div>';

  h += '<div class="sheet">' +
       head('정답 및 해설', '시험지 ' + code + ' 전용 — 시험지 코드가 같은지 확인하세요') +
       '<div class="akey">';
  qs.forEach(function(q, k){ h += '<div><b>' + (k+1) + '번</b><span>' + NO[q.ans] + '</span></div>'; });
  h += '</div>';
  h += '<div class="exwrap">';
  qs.forEach(function(q, k){
    h += '<div class="ex"><b>' + (k+1) + '.</b> ' + esc(q.q) +
         '<br><span class="a">정답 ' + NO[q.ans] + ' ' + esc(q.opts[q.ans]) + '</span>' +
         (q.exp ? '<br>' + esc(q.exp) : '') + '</div>';
  });
  h += '</div></div>';

  document.getElementById('paper').innerHTML = h;

  /* 모자란 것은 조용히 넘기지 않고 밝힌다 */
  var msg = '시험지 ' + code + ' · ' + qs.length + '문항 (은행 ' + BANK.total + '문항에서 추첨)';
  if (r.gotPol < r.wantPol)
    msg += ' — 정책 문항이 은행에 ' + (BANK.byType.policy || 0) + '개뿐이라 ' +
           r.wantPol + '개 중 ' + r.gotPol + '개만 넣고 나머지는 제품으로 채웠습니다.';
  document.getElementById('hint').textContent = msg;
  document.getElementById('code').value = code;
  /* 인쇄창 "PDF로 저장"의 기본 파일명이 여기서 온다 — 여러 장 뽑아도 파일이 안 섞인다 */
  document.title = '시험지_' + code;
  try { history.replaceState(null, '', '?code=' + code + '&n=' + n + '&pol=' + polPct); } catch (e) {}
}

function go(useTyped){
  var n = Math.max(5, Math.min(50, parseInt(document.getElementById('n').value, 10) || 20));
  var pol = Math.max(0, Math.min(100, parseInt(document.getElementById('pol').value, 10) || 0));
  var typed = (document.getElementById('code').value || '').trim().toUpperCase();
  render(useTyped && /^[A-Z0-9]{4}$/.test(typed) ? typed : newCode(), n, pol);
}

if (!BANK || !BANK.items || !BANK.items.length) {
  /* 틀 파일을 그대로 열었을 때다. 조용히 빈 화면을 보이지 않고 무엇을 해야 하는지 적는다 */
  document.getElementById('hint').textContent =
    '문제은행이 비어 있습니다 — 이 파일은 틀입니다. npm run build:examtool 로 만든 tools/시험지출력기.html 을 여세요.';
} else {
  var p = new URLSearchParams(location.search);
  if (p.get('n')) document.getElementById('n').value = p.get('n');
  if (p.get('pol')) document.getElementById('pol').value = p.get('pol');
  if (p.get('code')) document.getElementById('code').value = p.get('code');
  go(true);
}

document.getElementById('gen').addEventListener('click', function(){
  document.getElementById('code').value = '';   /* 새로 뽑을 때는 코드도 새로 */
  go(false);
});
document.getElementById('prt').addEventListener('click', function(){ window.print(); });
document.getElementById('code').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(true); });
</script>
</body>
</html>
