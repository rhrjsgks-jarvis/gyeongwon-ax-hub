<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시험지 출력기 — SAMSUNG STORE 레벨업 챌린지</title>
<style>
/*
 * **A4 인쇄 전용 화면** (2026-08-19 사용자 요청)
 *
 * 요구사항 그대로다 — 20문항을 **순수 랜덤**으로 뽑고(모든 품목이 나올 필요 없다),
 * **시험지와 정답지를 세트로** 내며, **누를 때마다 다른 시험지**가 나온다.
 *
 * ## 문항 옆에 품목 이름을 적지 않는다
 * 2026-08-19 사용자 요청 — 오른쪽 카테고리 칩(김치냉장고·청소기…)을 뺐다.
 * **품목 이름이 곧 답을 좁혀 주는 힌트**라 시험지에 있으면 안 된다.
 * CE / MX 비중은 조작 막대와 안내문이 밝히므로 화면에서 확인할 수 있다.
 *
 * ## 시험지 코드가 핵심이다
 * 매번 다른 문제가 나오므로 여러 장 인쇄하면 시험지와 정답지가 섞인다.
 * 그래서 네 글자 코드를 **시드로** 쓰고 두 장 머리에 같은 코드를 찍는다 —
 * 코드를 넣으면 **같은 시험지를 다시 뽑을 수 있다**(재인쇄·채점 대조).
 *
 * ## 이 파일은 **빌드 결과물의 틀**이다 — 직접 배포하지 않는다
 * 사용자에게 가는 것은 `npm run build:examtool` 이 만드는 `tools/시험지출력기.html` 이고,
 * 그 파일은 문제은행을 **안에 통째로 담고 있어 더블클릭만으로 열린다**(인터넷·서버 불필요).
 * 여기 `__QUIZ_BANK__` 자리에 은행이 들어간다.
 *
 * **세일즈 코파일럿 앱에 붙이지 않는다**(2026-08-19 사용자 결정 —
 * *"오로지 시험문제 출력용 별도로 필요합니다 … 기존 세일즈코파일럿에 업데이트하는
 * 형식이 아닙니다"*). 한 번 `/exam-print` 라우트로 붙였다가 되돌렸다.
 * 그래서 `fetch` 를 쓸 수 없다 — `file://` 는 CORS 로 막힌다.
 *
 * ## 문제은행은 사본이 아니라 파생물이다
 * 단일 출처는 `public/test-app.html` 의 `QB` 다. 여기에 사본을 적어 두면 문항을
 * 늘렸을 때 조용히 어긋나므로, 빌드가 매번 원본에서 새로 읽어 넣고
 * `test-examtool` 이 "커밋된 것 == 재생성한 것"을 검사한다.
 */
:root{ --navy:#1428A0; --ink:#111; --sub:#555; --line:#d5d8e0; --bg:#f4f5f8; }
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
     color:var(--ink);background:var(--bg);line-height:1.5;-webkit-text-size-adjust:100%}

/* 조작 막대 — 인쇄에는 나오지 않는다 */
.bar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:12px 16px;
     display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bar h1{font-size:16px;margin:0 12px 0 0;font-weight:700;letter-spacing:-.02em}
.bar label{font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.bar input[type=number],.bar input[type=text]{width:64px;padding:5px 7px;border:0;border-radius:6px;
     font-size:13px;font-family:inherit;text-align:center}
.bar input[type=text]{width:82px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.btn{border:0;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;
     font-family:inherit;background:#fff;color:var(--navy)}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn:active{transform:translateY(1px)}
.hint{font-size:12px;opacity:.9;flex-basis:100%;margin-top:-2px}
/* 인쇄 설정 경고 — 크롬에서 여백을 "없음" 으로 고르면 @page 여백이 통째로 무시돼
   프린터가 가장자리를 잘라 낸다. CSS 로는 막을 수 없어 화면으로 알린다.
   작은 hint 줄로 두었더니 두 번 놓쳤다(2026-08-24 현장 잘림 신고 2회). */
.warn{flex-basis:100%;background:#FEF3C7;color:#7C2D12;border:1.5px solid #F59E0B;
      border-radius:7px;padding:8px 11px;font-size:13px;font-weight:600;line-height:1.5;margin-top:4px}
.warn b{color:#9A3412}

/* 종이 */
#paper > .sheet:first-child{margin-top:16px}
.bar{scroll-margin-top:0}
#paper{padding-top:4px}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:14px auto;padding:18mm 10mm;
       box-shadow:0 2px 12px rgba(0,0,0,.12)}
.head{border-bottom:2.5px solid var(--navy);padding-bottom:7px;margin-bottom:10px;
      display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.head .brand{display:flex;align-items:center;gap:6px;color:var(--navy);margin-bottom:3px}
.head .brand .wm{height:13px;width:auto;display:block}
.head .brand .store{font-size:12.5px;font-weight:700;letter-spacing:.14em}
.head .t{font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}
.head .s{font-size:11.5px;color:var(--sub);margin-top:3px}
.head .pg{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.75;margin-top:2px}
.head .code{font-size:12px;font-weight:800;letter-spacing:.1em;border:1.5px solid var(--navy);
            color:var(--navy);border-radius:5px;padding:4px 9px;white-space:nowrap}
.meta{display:flex;gap:18px;font-size:13px;color:var(--sub);margin-bottom:14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.fill{display:inline-block;border-bottom:1px solid #999;min-width:76px}

/* **글자 크기는 상담사가 시험장에서 읽는 크기다** — 2026-08-19 사용자 요청으로 키웠다
   ("A4 로 출력하면 너무 작게 나옵니다"). 시험지 2장 → 3장이 되는 대신 읽힌다.
   줄이려거든 쪽수부터 재 볼 것(.scratch/exam-pages.mjs). */
/* 문항 간격 10px — **글꼴을 줄이는 대신 여기를 줄인다.**
   @page 에 실제 여백(11/12mm)을 주면서 쪽마다 22mm 를 잃어 시험지가 4장이 됐는데,
   실측해 보니 간격만 13px → 10px 로 줄여도 8종 전부 3장으로 돌아온다(글꼴·행간은 그대로).
   2026-08-24 에 문항 18 → 17px · 보기 16 → 15px · 간격 10 → 9px 로 한 단계 내렸다
   (사용자 허락: "폰트크기를 줄여도 됩니다"). 진짜 인쇄 여백(26/15mm)이 걸리자 쪽 높이가
   281.9mm 가 되어 인쇄창 "기본" 여백에서 쪽이 쪼개졌기 때문이다 — 264.7mm 로 들어왔다.
   **더 내리지 말 것.** 원래 요구가 "A4 로 출력하면 너무 작다" 였고, 검사 하한이
   문항 16px · 보기 14px 이라 한 단계밖에 안 남았다. */
.q{margin:0 0 8px;page-break-inside:avoid;break-inside:avoid}
.qh{display:flex;gap:7px;align-items:baseline;font-size:17px;font-weight:700;margin-bottom:5px;line-height:1.4}
.qn{color:var(--navy);min-width:30px}
.qt{font-weight:600;flex:1}
.opts{list-style:none;margin:0;padding:0 0 0 37px}
.opts li{font-size:15px;margin:0 0 2px;display:flex;gap:7px;line-height:1.45}
.opts .no{color:var(--sub);flex-shrink:0}

/* 정답지 */
.akey{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:12px}
.akey div{border:1px solid var(--line);border-radius:4px;padding:4px 2px;text-align:center}
.akey b{display:block;font-size:10.5px;color:var(--sub);font-weight:600}
.akey span{font-size:14px;font-weight:800;color:var(--navy)}
/* ## 정답지는 2쪽이고, 해설은 12px 다 (2026-08-24 사장님 지시)
   "답안지2페이지로설정(답안지2페이지가 되면서 해설글씨 크기 보강)" — 2쪽을 쓰기로 한 만큼
   자리가 남아 10 → 11px 로 키웠다. 2단(columns:2)은 그대로다.
   **12px 은 못 쓴다** — LG 문항을 68개로 늘리자 해설이 길어져 인쇄창 "기본"(10mm) 여백에서
   30종 중 2종이 정답지 3쪽으로 흘렀다. 여백을 14mm 까지 줄여도 같은 2종이 넘쳤고
   간격을 조여도(margin 3px·line-height 1.35) 안 됐다 — **상한을 정하는 것은 여백이 아니라
   해설 글꼴**이다. "답안지 2페이지"가 사장님 지시라 글꼴을 한 단계 내주는 쪽을 골랐다.
   **재려면 `.scratch/_exam-pages.mjs` 로 쪽수를 셀 것** — 블록 높이로 재면 인쇄창 여백이
   만드는 줄바꿈을 못 본다(아래 여백 주석 참조). 현재 설정으로 40종 × 여백 0·10mm 전부
   정답지 2쪽이다. 더 키우려면 그 하네스로 다시 잴 것. */
.exwrap{columns:2;column-gap:7mm}
.ex{font-size:11px;margin:0 0 5px;padding-bottom:4px;line-height:1.45;border-bottom:1px dotted var(--line);
    page-break-inside:avoid;break-inside:avoid}
.ex b{color:var(--navy)}
.ex .a{color:#166534;font-weight:700}
/* 난이도·LG 표식 — **정답지에만** 붙는다(시험지에는 안 나간다).
   인쇄가 흑백일 수 있어 색에만 기대지 않고 글자로 적는다. */
.lv{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 4px;
    font-size:9px;font-weight:800;line-height:1.5;vertical-align:1px;color:var(--sub)}
.lv-하{border-color:#86efac;color:#166534}
.lv-중{border-color:#fcd34d;color:#92400e}
.lv-상{border-color:#fca5a5;color:#991b1b}
.lv-LG{border-color:var(--navy);color:var(--navy)}

@media print{
  /* ## 여백은 @page 가 아니라 .sheet 의 padding 이 만든다
   * @page 여백만 믿으면 **인쇄창에서 여백을 “없음”으로 고르는 순간 통째로 무시돼** 다시 잘린다
   * (2026-08-24 현장에서 11mm · 31mm 두 번 다 잘렸다는 신고를 받았다).
   * 지금은 쪽당 5문항으로 **한 블록 = 한 쪽**이 되도록 직접 끊으므로, 블록의 padding 이
   * 그 쪽의 위아래 모두에 걸린다 — 즉 여백이 **인쇄 설정과 무관하게** 지켜진다.
   * @page 의 5mm 는 덤이다(프린터 인쇄 불가 영역용). 이 둘을 바꿔 달지 말 것. */
  @page{size:A4;margin:5mm}
  body{background:#fff}
  .bar,.noprint{display:none !important}
  /* ## 18mm / 10mm — **블록 높이가 아니라 실제 쪽수로 재서 정했다** (2026-08-24)
   *
   * **블록 높이로 재면 틀린다.** 인쇄창에서 여백을 주면 지면 폭이 줄어 **줄바꿈이 늘고
   * 세로가 자라는데**, 블록 높이는 그 여백을 안 준 상태에서 재게 된다. 실제로 코드 60종을
   * 재니 시험지 블록이 **전부 257.0mm 로 똑같이** 나왔다 — 내용이 다른데 같은 값이 나오면
   * 그건 내용을 안 재고 있다는 뜻이다. 그 숫자를 믿고 26mm 로 올렸다가 무작위 추첨에서
   * **쪽이 6 → 8 로 늘었다.**
   *
   * 그래서 `.scratch/_exam-pages.mjs` 가 **PDF 쪽수를 직접 센다**(인쇄창 "없음(0)"과
   * "기본(10mm)" 둘 다). 실측 —
   *
   *   여백 22·24·26mm : 여백 0 에서는 전부 6쪽인데 **10mm 에서 20종 중 7~15종이 넘친다**
   *   여백 18mm · 좌우 10mm : **40종 × (0 / 10mm) 전부 6쪽**
   *
   * 즉 **넘침은 26mm 가 만든 것이 아니라 원래 있던 것**이고 표본이 좁아 안 보였을 뿐이다
   * (고정 12종은 지금도 전부 통과한다 — 꼬리를 봐야 한다).
   *
   * **글꼴은 지켰다.** 16/14px 로 한 단계 내려도 10mm 에서 3종이 남았고, 여백을 줄이면
   * 글꼴 그대로 0종이 된다. 원래 요구가 "A4 로 출력하면 너무 작다" 였으므로 글꼴이 아니라
   * 여백을 내주는 쪽이 맞다.
   *
   * **좌우가 세로를 정한다** — 좌우를 좁히면 한 줄에 더 들어가 세로가 준다. 상하만
   * 만지면 안 되는 이유다. 여백·글꼴·좌우는 같은 예산을 나눠 쓰므로 **하나만 고치지 말고
   * 반드시 쪽수로 다시 잴 것.**
   *
   * 옛 기록: `@media (max-width:820px)` 가 인쇄에도 걸리던 시절 실제 인쇄 여백이
   * 14px(3.7mm)였고, 검사는 여백을 **화면(1200px)** 에서 재고 쪽수는 **PDF** 에서 세는
   * 바람에 둘 다 통과했다 — 서로 다른 레이아웃을 보고 있었던 것이다. 그때 매장에 나간
   * 시험지는 좌측 상단 워드마크가 잘렸다. */
  .sheet{width:auto;min-height:0;margin:0;padding:18mm 10mm;box-shadow:none;page-break-after:always}
  .sheet:last-child{page-break-after:auto}
}
/* **반드시 `screen and` 를 붙일 것.** 이 규칙은 폰에서 "화면으로 볼 때" 쓰라고 만든 것인데
   미디어 종류를 안 밝히면 인쇄에도 걸리고, @media print 와 명시도가 같아 **뒤에 있는 이쪽이 이긴다.**
   그러면 폰에서 인쇄할 때 쪽 여백이 14px(3.7mm)로 무너져 프린터가 못 찍는 가장자리 안으로 들어가
   **좌측 상단 워드마크가 잘린다**(2026-08-24 매장 보고). 순서를 바꿔 고치지 말 것 — 규칙 하나만
   옮겨도 조용히 재발한다. */
@media screen and (max-width:820px){ .sheet{width:auto;min-height:0;padding:14px} }
</style>
</head>
<body>

<div class="bar noprint">
  <h1>시험지 출력기</h1>
  <label>문항 <input type="number" id="n" value="20" min="5" max="50"></label>
  <label>MX <input type="number" id="mx" value="50" min="0" max="100">%</label>
  <label>난이도 <select id="lv">
    <option value="3,7,10" selected>기본 (하3·중7·상10)</option>
    <option value="8,7,5">쉽게 (하8·중7·상5)</option>
    <option value="4,8,8">보통 (하4·중8·상8)</option>
    <option value="1,6,13">어렵게 (하1·중6·상13)</option>
    <option value="0,6,14">매우 어렵게 (중6·상14)</option>
    <option value="manual">직접 지정…</option>
  </select></label>
  <span id="lvman" hidden>
    <label>하 <input type="number" id="lvL" value="3" min="0" max="50"></label>
    <label>중 <input type="number" id="lvM" value="7" min="0" max="50"></label>
    <label>상 <input type="number" id="lvH" value="10" min="0" max="50"></label>
  </span>
  <label>코드 <input type="text" id="code" maxlength="4" placeholder="자동"></label>
  <button class="btn" id="gen">새 시험지</button>
  <button class="btn ghost" id="prt">인쇄</button>
  <div class="hint" id="hint">문제은행을 불러오는 중…</div>
  <div class="hint">인쇄창에서 <b>대상</b>을 <b>“PDF로 저장”</b>으로 고르면 파일로 남습니다 — 파일 이름은 시험지 코드가 붙습니다.</div>
  <div class="warn">🖨 인쇄창에서 <b>여백 = “없음”</b> · <b>배율 = “기본”</b> 으로 두세요.
  이 시험지는 <b>여백을 스스로 갖고 있습니다</b>(상하 18mm · 좌우 10mm) — 인쇄창에서 여백을 또 주면
  쪽수만 늘어납니다. <b>“기본값”도 괜찮지만 “넓게”는 쓰지 마세요.</b></div>
</div>

<noscript><div class="sheet"><div class="head"><div><div class="t">자바스크립트를 켜 주세요</div>
<div class="s">시험지는 열 때마다 새로 뽑으므로 자바스크립트가 필요합니다. 브라우저 설정에서 켠 뒤 새로고침하세요.</div></div></div></div></noscript>

<div id="paper"></div>

<script>

"lv":"상","lg":0,"q":"Galaxy S26 시리즈의 IP 등급으로 올바른 것은?","opts":["IP67","IP68","IP69","IP69K"],"ans":1,"exp":"갤럭시 S26 시리즈는 IP68 등급입니다. 삼성 공식 시험 조건은 IEC 60529 기준 담수 1.5m에서 30분이며, 방수 성능은 사용 환경과 시간 경과에 따라 약해질 수 있다고 안내합니다.","i":95},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy S26+ (플러스)의 특징으로 올바른 것은?","opts":["S26 Ultra와 동일한 200MP 카메라를 탑재했다","S펜을 본체에 기본 내장하고 있다","S26보다 큰 6.7\" 화면과 큰 배터리","S26 Ultra와 동일한 프라이버시 디스플레이 탑재"],"ans":2,"exp":"갤럭시 S26+는 S26(6.3형) 대비 더 큰 6.7형 화면과 더 큰 배터리를 제공합니다. 울트라의 200MP 카메라·S펜·100배 줌은 없지만, 큰 화면을 원하면서 울트라보다 가벼운 제품을 찾는 고객에게 적합합니다.","i":96},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Z Fold8의 폴딩 방식의 특징으로 올바른 것은?","opts":["좌우로 접히는 클램셸(조개) 방식","위아래로 접히는 플립 방식","안쪽으로 접히는 인폴딩 방식","세 번 접히는 트라이폴드 방식"],"ans":2,"exp":"Galaxy Z Fold8은 화면이 안쪽으로 접히는 인폴딩 방식을 사용합니다. 펼치면 태블릿처럼 사용 가능하고(7.6인치), 접으면 커버 화면(5.5인치, 이전 세대인 Fold6는 6.3인치)으로 스마트폰처럼 사용할 수 있습니다. 이 수치는 기본형 Fold8 기준이며, 상위 세그먼트인 Z Fold8 Ultra는 커버 6.5인치·메인 8인치로 더 큽니다.","i":97},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Z Flip8의 커버 화면(플렉스 창) 크기로 올바른 것은?","opts":["1.9인치","3.4인치","3.9인치","4.1인치"],"ans":3,"exp":"Galaxy Z Flip8은 4.1인치 플렉스 창을 탑재해 기기를 열지 않고도 앱 실행, 메시지 확인, 카메라 사용 등을 할 수 있습니다. 이전 세대인 Flip6의 커버 화면은 3.9인치였습니다.","i":98},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy S26 Ultra의 Quad Camera 구성으로 올바른 것은?","opts":["200MP 광각 + 10MP 망원 + 50MP 초광각 + ToF 센서","200MP 광각 + 50MP 초광각 + 10MP 망원(3x) + 50MP 망원(5x)","200MP 광각 + 12MP 초광각 + 10MP 망원(3x) + 10MP 망원(10x)","200MP 광각 + 10MP 망원(3x) + 10MP 망원(10x) + 50MP 초광각"],"ans":1,"exp":"갤럭시 S26 울트라의 후면 카메라는 200MP F1.4 광각 + 50MP F1.9 초광각 + 10MP F2.4 망원(3배 광학) + 50MP F2.9 망원(5배 광학) 구성입니다(삼성닷컴 제품 지면 기준). 여기에 AI 기반 100배 스페이스 줌이 더해집니다.","i":99},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 Galaxy AI의 'Generative Edit(생성형 편집)' 기능의 특징으로 올바른 것은?","opts":["사진 속 특정 인물을 AI가 자동으로 삭제한다","피사체를 옮기고 AI가 배경을 채운다","사진을 흑백으로 바꿔 주는 필터 기능","AI가 여러 사진을 하나로 합성해 준다"],"ans":1,"exp":"생성형 편집은 사진 속 피사체를 이동하거나 원치 않는 객체를 삭제했을 때 비어있는 배경을 AI가 자연스럽게 채워줍니다.","i":100},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy S26 시리즈가 지원하는 S펜의 최소 지연 시간(latency)으로 올바른 것은?","opts":["9.0ms","5.0ms","2.8ms","1.0ms"],"ans":2,"exp":"Galaxy S26 Ultra의 S펜은 약 2.8ms의 초저지연 응답속도를 제공합니다. 거의 실제 펜으로 쓰는 것처럼 자연스럽게 필기할 수 있습니다.","i":101},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 S26 Ultra의 S펜 수납 방식은?","opts":["본체 하단 슬롯에 내장 수납","별도 케이스 필요","자석 부착","블루투스 페어링 후 사용"],"ans":0,"exp":"S26 Ultra는 S펜을 본체 하단 슬롯에 내장해 별도 액세서리 없이 항상 함께 사용할 수 있다.","i":102},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"삼성 갤럭시 S26 울트라의 카메라 최고 줌 배율은?","opts":["100배 스페이스 줌","50배 광학 줌","200배 디지털 줌","30배 하이브리드 줌"],"ans":0,"exp":"갤럭시 S26 Ultra는 100배 스페이스 줌을 지원해 멀리 있는 피사체를 망원경처럼 촬영할 수 있다.","i":103},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시의 '갤럭시 AI' 기능 중 통화 실시간 번역의 명칭은?","opts":["Live Translate","Circle to Search","Generative Edit","Chat Assist"],"ans":0,"exp":"Live Translate는 전화 통화 중 실시간으로 대화를 번역해 서로 다른 언어를 사용하는 사람끼리도 대화할 수 있게 한다.","i":104},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 S26의 'ProVisual Engine(프로비주얼 엔진)'의 역할은?","opts":["AI 기반 카메라 화질 향상 엔진","프로세서 성능 관리","배터리 절약","디스플레이 색상 처리"],"ans":0,"exp":"ProVisual Engine은 촬영, 처리, 출력 전 과정에 AI를 적용해 색상, 밝기, 노이즈 등 화질을 통합 최적화한다.","i":105},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 폴더블폰 'Z Fold8'의 힌지·내구성 기술 특징은?","opts":["플렉스 티타늄 힌지","5G 안테나 내장 힌지","충전 단자 내장 힌지","카메라 탑재 힌지"],"ans":0,"exp":"Z Fold8은 티타늄 합금 필름과 티타늄 플레이트를 결합한 '플렉스 티타늄(Flex Titanium)' 기술로 힌지·디스플레이 내구성과 주름 개선을 강화했다. 방진·방수 등급은 IP48(방진 IP4X + 방수 IPX8)이다.","i":106},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 'Circle to Search(서클 투 서치)'의 사용 방법은?","opts":["길게 누른 뒤 원을 그려 검색","홈 버튼을 두 번 눌러서 실행한다","S펜을 꺼내야만 쓸 수 있는 기능","전용 앱을 따로 깔아야 쓸 수 있다"],"ans":0,"exp":"Circle to Search는 화면 하단을 길게 누른 후 검색하고 싶은 대상에 원을 그리면 즉시 구글 검색 결과를 보여준다.","i":107},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 S26 시리즈의 'Armor Aluminum(아머 알루미늄)' 프레임의 특징은?","opts":["기존 대비 강도가 높은 항공우주급 알루미늄 합금","탄소 섬유를 여러 겹 겹쳐 굳힌 가볍고 단단한 소재","티타늄을 통째로 깎아 만든 고급 금속 소재","탄소 섬유를 겹쳐 굳힌 가볍고 단단한 소재"],"ans":0,"exp":"Armor Aluminum은 항공우주 등급의 알루미늄 합금으로 기존 스마트폰 프레임 대비 뛰어난 강도와 경량성을 제공한다.","i":108},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 'Generative Edit(생성형 편집)'로 할 수 있는 것은?","opts":["AI로 사진 속 객체를 이동·제거·배경 생성","찍어 둔 영상을 알아서 잘라 붙여 편집해 준다","분위기에 맞는 배경 음악을 만들어 준다","저장된 연락처를 그룹별로 정리해 준다"],"ans":0,"exp":"Generative Edit는 사진 속 객체를 AI로 이동시키거나 삭제하고 빈 배경을 자연스럽게 채우는 생성형 AI 편집 기능이다.","i":109},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시의 'DeX 모드' 사용 시 필요한 것은?","opts":["USB-C to HDMI 또는 DeX 스테이션","따로 준비해 둔 데스크탑 PC 한 대가 있어야 한다","달마다 결제해야 하는 전용 앱 구독권이 필요하다","Wi-Fi 6 이상을 지원하는 공유기가 있어야 한다"],"ans":0,"exp":"DeX는 USB-C to HDMI 케이블이나 DeX 스테이션으로 모니터에 연결하면 스마트폰이 데스크톱처럼 작동하는 모드다.","i":110},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 폰의 '위성 긴급 통신' 기능이 필요한 상황은?","opts":["통신 인프라가 없는 오지에서 긴급 연락","배터리가 떨어졌을 때 충전해야 하는 상황","해외에서 로밍을 대신 써야 하는 상황","가족에게 내 위치를 알려 주어야 하는 상황"],"ans":0,"exp":"위성 통신은 기지국과 Wi-Fi가 전혀 없는 지역에서 위성으로 긴급 구조 메시지와 위치를 전송할 수 있다.","i":111},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 'Now Brief(나우 브리프)'의 기능은?","opts":["하루 일정과 상황에 맞는 정보를 AI가 요약 제공","실시간 뉴스만 골라서 소리로 읽어 주는 브리핑 기능","오늘과 내일의 날씨만 간추려 알려 준다","보유한 주식의 시세만 정리해서 보여 준다"],"ans":0,"exp":"Now Brief는 갤럭시 AI가 사용자의 일정, 위치, 시간대를 파악해 맥락에 맞는 정보를 자동으로 정리해 보여준다.","i":112},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"삼성 갤럭시 S26 Ultra 배터리 용량은?","opts":["5000mAh","3000mAh","6000mAh","4000mAh"],"ans":0,"exp":"갤럭시 S26 Ultra는 5000mAh 배터리를 탑재해 하루 이상의 사용을 지원한다.","i":113},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시의 '노이즈 캔슬링 통화(Voice Focus)'의 원리는?","opts":["AI 가 소음을 걸러 목소리만 전달","이어폰을 반드시 끼고 있어야 켜진다","마이크를 물리적으로 막아 소리를 줄인다","음질 향상 앱을 따로 깔아야 동작한다"],"ans":0,"exp":"Voice Focus는 AI가 통화 중 주변 소음 패턴을 분석해 제거하고 사용자의 목소리만 선명하게 전달한다.","i":114},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 Z Flip8의 커버 화면(플렉스 윈도우) 관련 설명으로 올바른 것은?","opts":["네이티브 앱 드로어를 지원해 펼치지 않고도 서드파티 앱을 그대로 실행할 수 있다","이전 세대(Flip6)와 동일하게 위젯과 일부 지정 앱만 사용 가능하다","카메라 미리보기는 지원하지 않는다","문자 빠른 답장은 이용할 수 없다"],"ans":0,"exp":"Z Flip8은 커버 화면에 네이티브 앱 드로어가 추가되어 스와이프로 앱 트레이·알림창을 열 수 있고, 폰을 펼치지 않고도 서드파티 앱을 포함한 다양한 앱을 그대로 실행할 수 있다. 위젯과 일부 지정 앱만 지원하던 Flip6 대비 크게 개선된 부분이다.","i":115},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시의 '통역사(Interpreter) 기능' 사용 방법은?","opts":["실시간 통역을 화면 분할로 표시","네이버 통역 앱을 불러와 연동한다","전화 통화 중에만 쓸 수 있는 기능","글로 쓴 문장만 번역할 수 있다"],"ans":0,"exp":"인터프리터는 화면을 분할해 두 언어 사용자가 마주보며 대화할 때 각자의 언어로 자동 통역 텍스트를 보여준다.","i":116},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 S26의 나이트로그래피 기능에 사용되는 기술은?","opts":["멀티프레임 합성 + AI 노이즈 제거","광학 줌 배율을 크게 끌어올리는 기술","물리 조리개를 더 넓게 여는 기술","손떨림 보정을 빼서 얻는 기술"],"ans":0,"exp":"나이트로그래피는 여러 장의 노출 사진을 합성하고 AI로 노이즈를 제거해 어두운 환경에서도 밝고 선명한 사진을 만든다.","i":117},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 폰의 'IP68' 등급이 의미하는 것은?","opts":["수심 1.5m에서 30분 방수","완전 방수 (모든 깊이)","방수 없음","생활방수만 (물 튀김 정도)"],"ans":0,"exp":"IP68은 수심 1.5m(제조사 따라 최대 2m)에서 30분간 방수 성능을 보장하며 일상적 물 접촉에서 안전하다.","i":118},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성월렛(삼성페이)의 결제 방식 설명으로 올바른 것은?","opts":["오프라인은 MST·NFC, QR은 해외 결제만","국내 오프라인 매장에서도 QR코드를 스캔해 결제할 수 있다","MST는 지원하지 않고 NFC만 지원한다","국내 기본 결제 방식은 바코드 제시다"],"ans":0,"exp":"국내 오프라인 결제는 MST(마그네틱 보안 전송)와 NFC 두 가지로, 단말기에 휴대폰을 갖다 대는 방식입니다(삼성 뉴스룸 \"MST·NFC 동시 지원\" · 삼성월렛 공식 지면 · 고객지원 「삼성월렛으로 결제하는 방법」). **QR 결제가 아예 안 되는 것은 아니지만 조건이 붙습니다** — 삼성월렛 GLN 해외 QR 결제(제휴)나 일본 월렛의 페이페이 QR처럼 해외·제휴 서비스에서만 쓰입니다. PC 온라인 결제 화면의 QR은 결제 수단이 아니라 본인 인증용이고, 바코드는 국내에서 티켓·멤버십 제시 용도입니다. 앱 이름은 삼성월렛이며 삼성페이는 그 안의 결제 기능입니다.","i":119},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 S26의 AP(Application Processor)는?","opts":["스냅드래곤 8 Elite for Galaxy (Qualcomm)","엑시노스 2600","미디어텍 디멘시티","Apple A18"],"ans":1,"exp":"갤럭시 S26과 S26+는 엑시노스 2600을, 최상위 S26 울트라는 갤럭시용 스냅드래곤 8 Elite 5세대를 탑재합니다. 삼성닷컴 사양표에서도 S26은 데카코어(10코어), S26 울트라는 옥타코어(8코어)로 갈립니다. 시리즈 전체가 스냅드래곤인 것으로 안내하면 안 됩니다.","i":120},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시의 'One UI(원 UI)'가 안드로이드 순정 대비 차별화하는 주요 기능은?","opts":["한 손 조작·갤럭시 AI·DeX·생태계 연동","아이폰과 똑같은 화면 배치를 그대로 가져온 것","구글이 넣어 둔 기본 앱을 모두 지워 주는 것","같은 배터리로 사용 시간을 늘려 주는 것"],"ans":0,"exp":"One UI는 한 손 조작, 대화면 분할, 갤럭시 AI, 삼성 기기 간 생태계 연동 등 삼성 고유 사용 경험을 제공한다.","i":121},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 스마트폰의 '보안 폴더' 기능의 목적은?","opts":["Knox 기반 암호화 공간에 개인 파일·앱 별도 저장","촬영한 사진의 화질을 자동으로 끌어올려 따로 저장해 준다","자주 안 쓰는 앱의 배터리 사용을 묶어서 절약","홈 화면 폴더를 종류별로 자동 정리해 준다"],"ans":0,"exp":"보안 폴더는 Knox 보안 플랫폼 기반으로 별도 암호화된 공간에 앱과 파일을 격리해 개인정보를 보호한다.","i":122},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 폰의 '빠른 충전' 방식으로 올바른 것은?","opts":["25W~60W 유선 급속충전","무선 충전 방식만 지원한다","USB-A 단자에서만 동작한다","충전 속도가 늘 일정하다"],"ans":0,"exp":"갤럭시 S26 울트라는 갤럭시 최초로 초고속 충전 3.0(최대 60W)을 지원해 약 30분에 75%까지 충전됩니다. 그 아래 모델은 25W~45W 급속충전이며, 충전기는 별매입니다.","i":123},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 S26 울트라의 디스플레이 패널 방식으로 올바른 것은?","opts":["Dynamic AMOLED 2X","Mini LED 백라이트 방식","IPS 방식을 쓴 LCD 패널","Micro RGB 백라이트 방식"],"ans":0,"exp":"S26 울트라는 Dynamic AMOLED 2X 패널에 120Hz 가변 주사율을 씁니다. Mini LED · Micro RGB 는 TV 에 쓰는 방식이고 IPS LCD 는 다른 제조사 노트북 · 모니터에서 흔한 방식입니다. 피크 밝기 수치는 국내 공식 스펙시트로 확정되지 않아 상담에서 숫자로 말하지 않습니다.","i":124},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 폰에서 '에너지 절약 모드' 활성화 시 제한되는 기능은?","opts":["5G 통신·고주사율·배경 앱 제한","Wi-Fi 완전 차단","카메라 촬영 불가","전화 수신 불가"],"ans":0,"exp":"에너지 절약 모드는 5G를 4G로 전환, 120Hz를 60Hz로 낮추고, 백그라운드 앱 활동을 제한해 배터리를 절약한다.","i":125},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"삼성 갤럭시 Z Fold8 펼쳤을 때 화면 크기는?","opts":["약 7.6인치","약 5.5인치","약 9인치","약 6.1인치"],"ans":0,"exp":"Z Fold8은 펼치면 약 7.6인치의 태블릿급 대형 화면으로 변환되어 생산성과 미디어 사용에 최적화된다(참고로 '약 5.5인치'는 접었을 때 커버 화면 크기). 상위 세그먼트인 Z Fold8 Ultra는 펼쳤을 때 약 8인치로 더 크다.","i":126},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 Z Fold8과 Z Fold8 Ultra의 차이로 올바른 것은?","opts":["Fold8 Ultra만 200MP 메인 + 10MP 3배 망원, Fold8은 없다","Fold8과 Fold8 Ultra는 화면 크기와 무게가 완전히 동일하다","Fold8 Ultra에서만 S펜을 쓸 수 있고 Fold8에서는 전혀 쓸 수가 없다","배터리 용량은 Fold8 쪽이 Fold8 Ultra보다 더 크다"],"ans":0,"exp":"Z Fold8 Ultra는 메인 8인치·커버 6.5인치 디스플레이, 200MP 메인 카메라 + 10MP 3배 광학 망원, 5,000mAh 배터리를 갖춘 최상위 모델이다. 기본형 Z Fold8은 메인 7.6인치·커버 5.5인치, 50MP 메인 + 50MP 초광각(망원 없음), 4,800mAh 배터리로 더 가볍고 합리적인 포지션이다. 두 모델 모두 S펜은 지원하지 않는다(Fold6까지는 지원했음).","i":127},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"삼성 Galaxy S26 시리즈의 공식 보증 무게(S26 Ultra 기준)로 올바른 것은?","opts":["195g","214g","228g","245g"],"ans":1,"exp":"Galaxy S26 Ultra의 무게는 214g으로 S24 Ultra(232g) 대비 18g 가벼워졌습니다.","i":128},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 절전 모드 최대 배터리 사용 시간으로 올바른 것은?","opts":["최대 60시간","최대 80시간","최대 100시간","최대 120시간"],"ans":2,"exp":"갤럭시 워치 울트라2는 절전 모드 최대 100시간, 운동 중 절전 모드 최대 48시간 배터리를 제공합니다(전작 울트라(2025)와 동일). 일반 모드에서는 상시표시화면(AOD) 켠 상태 최대 60시간, 끈 상태 최대 80시간까지 늘어났습니다.","i":129},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 방수 등급으로 올바른 것은?","opts":["5 ATM / IP67","10 ATM / IP68","10 ATM / IP69K","5 ATM / IP68"],"ans":2,"exp":"갤럭시 워치 울트라2는 10 ATM / IP69K 등급에 EN13319 다이빙 인증까지 더해져 수영장·바다에서 수심 40m까지 다이빙 중 착용이 가능합니다. 전작 울트라(2025)는 10 ATM / IP68(수심 100m 10분 방수) 등급이었습니다.","i":130},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2가 견딜 수 있는 최대 고도와 작동 온도 범위로 올바른 것은?","opts":["5,000m / -10°C ~ 45°C","7,000m / -15°C ~ 50°C","9,000m / -20°C ~ 55°C","9,000m / -10°C ~ 60°C"],"ans":2,"exp":"갤럭시 워치 울트라2는 최대 9,000m 고도에서 저항 가능하며 -20°C ~ 55°C의 작동 온도 범위를 지원합니다(전작과 동일).","i":131},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch Ultra2에서 수면 중 착용해 측정하는 삼성 고유의 건강 지표는?","opts":["혈당 지수(GI)","최종당화산물 지수","혈중 케톤 지수","체내 염증 지수"],"ans":1,"exp":"갤럭시 워치 울트라2는 수면 중 착용 시 최종당화산물 지수(AGEs)를 측정합니다. 식단과 생활 습관을 반영하는 건강 지표로 Apple Watch Ultra 3에는 없는 삼성만의 기능입니다.","i":132},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch Ultra2에서 수면 중 심혈관 건강을 추적하는 삼성 고유의 기능은?","opts":["혈압 연속 모니터링","혈관 스트레스 모니터링","동맥 경화도 측정","심혈관 나이 측정"],"ans":1,"exp":"갤럭시 워치 울트라2는 밤새 PPG(광학 심박) 센서로 수면 중 혈관에 가해지는 스트레스 변화를 추적하는 '혈관 스트레스 모니터링' 기능을 제공합니다.","i":133},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 퀵 버튼을 5초간 길게 누르면 작동하는 긴급 사이렌의 최대 음량과 전달 거리는?","opts":["80dB / 최대 100m","86dB / 최대 180m","90dB / 최대 200m","86dB / 최대 150m"],"ans":1,"exp":"갤럭시 워치 울트라2는 최대 86dB의 강력한 사이렌이 작동하여 최대 180m 떨어진 곳까지 소리가 전달됩니다.","i":134},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 내부 저장 공간 용량으로 올바른 것은?","opts":["16GB","32GB","64GB","128GB"],"ans":2,"exp":"갤럭시 워치 울트라2는 64GB 내부 저장 공간을 제공하여 GPX 경로 데이터, 음악 등을 넉넉하게 저장할 수 있습니다.","i":135},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 듀얼 GPS가 활용하는 이중 주파수 대역으로 올바른 것은?","opts":["L1과 L2","L1과 L5","L2와 L5","L1과 L3"],"ans":1,"exp":"갤럭시 워치 울트라2는 L1과 L5의 이중 주파수 대역을 활용하여 핀포인트 GPS 정확도를 제공합니다.","i":136},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch Ultra2의 바이오 액티브 센서로 지원하지 않는 기능은?","opts":["체성분(BIA) 측정","심전도(ECG) 측정","혈당 직접 측정","혈압 측정"],"ans":2,"exp":"갤럭시 워치 울트라2는 체성분(BIA), 심전도(ECG), 혈압 측정을 지원합니다. 단, 혈당을 직접 측정하는 기능은 없습니다.","i":137},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2 vs Apple Watch Ultra 3 배터리 비교로 올바른 것은?","opts":["삼성 80시간 / 애플 60시간","삼성 100시간 / 애플 72시간","삼성 72시간 / 애플 100시간","삼성 100시간 / 애플 80시간"],"ans":1,"exp":"갤럭시 워치 울트라2는 절전 모드에서 최대 100시간, Apple Watch Ultra 3는 저전력 모드에서 최대 72시간 배터리를 지원합니다.","i":138},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch9 시리즈(일반 모델)에서 강화된 수면무호흡 감지 기능의 특징으로 올바른 것은?","opts":["혈당을 재는 기능이 새로 붙었다","무호흡 위험도를 3단계로 분류","혈중 산소 측정 기능이 새로 붙었다","심전도를 재는 기능이 새로 붙었다"],"ans":1,"exp":"Galaxy Watch9는 새로운 FDA 허가와 AI 알고리즘을 통해 수면 중 시간당 호흡 정지 횟수를 분석해 무호흡 위험도를 3단계로 분류하는 기능으로 강화되었습니다. 수면 무호흡증 감지 자체는 Watch8에서 처음 도입됐고, Watch9는 그 정밀도를 높인 버전입니다.","i":139},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch의 '심전도(ECG)' 측정 방법으로 올바른 것은?","opts":["워치를 차고 있으면 24시간 자동으로 측정된다","크라운이나 홈 버튼을 30초간 누른다","NFC로 병원 기기와 연동해야만 측정된다","손목에 가볍게 터치하면 자동으로 측정된다"],"ans":1,"exp":"갤럭시 워치의 ECG 측정은 디지털 왕관(베젤 버튼)을 반대편 손가락으로 가볍게 30초간 누르면 측정됩니다. 완전한 ECG 파형을 기록해 심방세동(AFib) 등 불규칙한 심장 리듬을 감지합니다.","i":140},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch9의 'Energy Score(에너지 스코어)' 기능의 설명으로 올바른 것은?","opts":["하루 동안 태운 칼로리를 모아 점수로 바꿔 표시","수면·심박·활동량으로 회복 상태를 0~100점","시계에 남아 있는 배터리 양을 점수로 바꿔 표시","한 번의 운동이 얼마나 셌는지를 점수로 매김"],"ans":1,"exp":"Energy Score는 전날 밤 수면 품질, 심박수 변이도(HRV), 활동량 등을 종합 분석해 오늘 하루 몸 상태와 회복 수준을 0~100점으로 표현합니다. 운동 강도를 조절하는 데 참고할 수 있습니다.","i":141},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch의 혈압 측정 기능의 제한 사항으로 올바른 것은?","opts":["세계 어느 나라에서나 제한 없이 그대로 쓸 수 있다","일부 국가만 지원하며 보정 후에 쓸 수 있다","혈압계 없이도 완전히 정확한 절대 수치를 재 준다","하루 24시간 내내 자동으로 쉬지 않고 재 준다"],"ans":1,"exp":"갤럭시 워치의 혈압 측정은 의료 기기 허가 국가(한국 포함 일부 국가)에서만 사용 가능합니다. 또한 표준 혈압계로 먼저 보정(calibration)을 완료해야 하며, 절대 수치보다는 변화 추이를 모니터링하는 용도입니다.","i":142},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch8 Classic(클래식)의 특징으로 올바른 것은?","opts":["터치 베젤만 지원","물리적 회전 베젤 탑재","스포츠 에디션으로 배터리 강화","일반 Watch8과 동일한 디자인에 색상만 다름"],"ans":1,"exp":"Galaxy Watch8 Classic은 물리적 회전 베젤을 탑재해 클래식한 시계 느낌을 주면서도 스크롤, 메뉴 탐색 등을 베젤을 돌려 조작할 수 있습니다. 고급스러운 스테인리스 소재를 사용합니다. 참고: 2026년 Watch9 세대에는 별도의 Classic 모델이 출시되지 않아, Watch8 Classic이 현재 판매 중인 가장 최신 회전 베젤 모델입니다.","i":143},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch의 'Sleep Coaching(수면 코칭)' 기능에 대한 설명으로 올바른 것은?","opts":["매일 밤 코치가 전화해 기상을 알려 준다","수면 데이터로 4~5주 개선 프로그램","침대에 눕는 순간 자동으로 수면 모드로 바뀐다","수면 코칭은 의사의 처방이 있어야 쓸 수 있다"],"ans":1,"exp":"Sleep Coaching은 수면 패턴(수면 시간, 단계, 심박수 등)을 분석해 개인화된 4~5주 수면 개선 프로그램을 제공합니다. 수면 습관 개선 팁과 목표를 단계별로 안내합니다.","i":144},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"현행 Galaxy Watch(Watch4 이후)와 iPhone의 호환성에 대한 설명으로 올바른 것은?","opts":["iPhone에서도 모든 기능을 그대로 쓸 수 있다","Google Play 서비스를 쓰기 때문에 iOS에서는 사용할 수 없다","iPhone에서 삼성 헬스 앱으로 모든 기능을 쓸 수 있다","전용 어댑터를 사면 iPhone에서도 연동된다"],"ans":1,"exp":"삼성 공식 지원문서 원문 — \"Galaxy Watch4, Watch5, Watch6, Watch7, Watch Ultra, and Watch FE: These watches rely on Google Play services which is not supported on iOS.\" 즉 Wear OS 로 바뀐 Watch4 이후는 iPhone 을 지원하지 않습니다. 다만 구형 Tizen 모델(2018년형 Galaxy Watch · Watch Active · Active2 · Gear 시리즈)은 iOS 9 이상에서 호환된다고 같은 문서가 밝히므로, \"갤럭시 워치는 무조건 안 된다\"고 말하면 안 됩니다.","i":145},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch9 Series의 체성분 분석(BIA) 측정 방법으로 올바른 것은?","opts":["워치를 차기만 하면 자동으로 측정","워치 뒷면 센서에 반대편 손가락을 대고 약 15~20초간 측정","SmartThings 앱의 분석 기능으로만 측정 가능","삼성 체중계와 반드시 연동해야 측정 가능"],"ans":1,"exp":"체성분(BIA) 측정은 워치 뒷면 센서에 반대편 손가락을 가볍게 대고 약 15~20초간 유지하면 됩니다. 골격근량, 체지방률, 체수분 등을 측정합니다.","i":146},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch의 'Irregular Heart Rhythm Notification(불규칙 심장리듬 알림)' 기능에 대한 설명으로 올바른 것은?","opts":["심방세동을 24시간 자동 감지해 알림","사용자가 직접 ECG를 측정했을 때만 분석","혈압이 높아지면 자동으로 감지해 알린다","심박수가 100bpm을 넘으면 항상 알린다"],"ans":0,"exp":"불규칙 심장리듬 알림은 PPG 광학 센서로 24시간 연속 심박 패턴을 분석해 심방세동(AFib) 의심 징후가 감지되면 사용자에게 알림을 보냅니다. FDA·식약처 허가를 받은 기능입니다.","i":147},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 Galaxy Watch와 Apple Watch의 운동 추적 기능 비교로 올바른 것은?","opts":["Galaxy Watch는 GPS가 없어 운동 경로를 추적하지 못한다","Galaxy Watch는 100가지 이상 종목 자동 감지","Galaxy Watch에는 골프 코스 지원 기능이 없다","Apple Watch에서만 AGEs 측정이 가능하다"],"ans":1,"exp":"Galaxy Watch와 Apple Watch 모두 100가지 이상의 운동 종목을 자동으로 감지하고 추적하는 수준입니다. 다만 AGEs 측정, 혈관 스트레스 모니터링 등 일부 기능은 Galaxy Watch만의 차별점입니다.","i":148},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 워치 울트라2의 'BioActive Sensor(바이오액티브 센서)'가 측정하는 것이 아닌 것은?","opts":["혈당 수치","심박수","혈중산소","체지방"],"ans":0,"exp":"BioActive Sensor는 심박수, 혈중산소, 체성분(체지방 등)을 측정하지만 혈당 직접 측정은 현재 지원하지 않는다.","i":149},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 워치의 '수면 코칭' 기능이 분석하는 요소는?","opts":["수면 단계·심박·움직임·혈중산소","잠든 시각과 깬 시각만 기록한다","손목 피부 온도 변화만 살펴본다","마이크로 잡은 코골이 소리만 센다"],"ans":0,"exp":"수면 코칭은 수면 단계(REM, 깊은 수면 등), 심박수, 움직임, 혈중산소를 분석해 수면 품질 점수와 개선 방법을 제공한다.","i":150},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 워치 'ECG 측정'의 의미와 한계는?","opts":["심전도 참고 자료 · 진단은 불가","의학적 진단까지 그대로 쓸 수 있다","의사 처방을 받아야 켤 수 있다","한국에서는 아예 쓸 수 없는 기능"],"ans":0,"exp":"ECG(심전도) 측정은 심방세동 등을 감지하는 참고 자료로 활용되나, 의료기기가 아니므로 의학적 진단을 대체할 수 없다.","i":151},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 버즈4 Pro의 'Adaptive ANC(어댑티브 ANC)'의 작동 원리는?","opts":["외부 소음에 따라 ANC 강도 자동 조절","쓰는 사람의 귀 모양을 인식해서 맞춰 준다","남아 있는 배터리 양에 따라 세기를 조절한다","듣고 있는 음악 장르에 따라 세기를 조절한다"],"ans":0,"exp":"Adaptive ANC는 주변 소음의 종류와 크기를 분석해 최적의 노이즈 캔슬링 강도를 자동으로 조정한다.","i":152},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 워치 '낙상 감지' 기능의 작동 방식은?","opts":["가속도·자이로로 낙상 감지 후 연락","카메라로 넘어지는 장면을 잡아낸다","GPS 로 정해진 곳을 벗어나면 알린다","혈압이 갑자기 변하는 것을 잡아낸다"],"ans":0,"exp":"낙상 감지는 가속도계와 자이로스코프로 낙상 특유의 급격한 동작 패턴을 인식해 자동으로 긴급 연락처에 알린다.","i":153},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 워치의 '운동 자동 감지' 기능이 인식하는 운동 종류는?","opts":["걷기·달리기·자전거·수영 등 주요 운동","세상에 있는 모든 운동 종류를 인식한다","심장박동 하나만으로 운동을 가려낸다","GPS 위치 이동만 보고 운동을 판단한다"],"ans":0,"exp":"갤럭시 워치는 센서 데이터 분석으로 걷기, 달리기, 자전거, 수영, 로잉 등 주요 운동을 자동으로 인식하고 기록한다.","i":154},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 워치 Ultra의 '티타늄 케이스' 선택 이유는?","opts":["가볍고 강도가 높다","값이 훨씬 저렴하다","자석에 붙지 않는다","충전이 빨라진다"],"ans":0,"exp":"티타늄은 스테인리스스틸 대비 강도가 높으면서도 무게는 가벼워 스포츠·아웃도어 착용에 최적화된다.","i":155},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 버즈의 '360 오디오' 기능의 효과는?","opts":["머리를 회전해도 음향이 고정된 방향에서 들리는 입체 효과","듣고 있는 음악 장르에 맞춰 이퀄라이저를 자동으로 설정해 준다","통화할 때 마이크가 잡는 목소리를 또렷하게","듣는 음악에 맞춰 이퀄라이저를   for (var i = 0; i < 4; i++) c += LETTERS.charAt(Math.floor(Math.random() * LETTERS.length));
  return c;
}
function shuffle(arr, rnd){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ── 문항 뽑기 ──
   사용자 요청 그대로 **순수 랜덤**이다 — 카테고리마다 반드시 나오게 하지 않는다
   (그건 /test 앱이 하는 일이고 여기는 성격이 다르다).
   **맞추는 것은 CE / MX 비중 하나뿐이다**(2026-08-24 사장님 지시: 50% / 50%).
   한쪽이 모자라면 **모자란 만큼 반대쪽으로 채우고 그 사실을 밝힌다** — 조용히 넘기지 않는다. */
/* ## 한 시험지가 동시에 지켜야 하는 것이 셋이다 (2026-08-24 사장님 지시)
 *   ① CE 50% / MX 50%
 *   ② 난이도 **상·중·하를 섞는다** — 난이도별로 시험지를 따로 내지 않는다
 *   ③ **LG 비교 문항 4개 고정** — "시험문제 LG비교문항 필요"
 *
 * 셋이 서로 물린다. LG 문항은 전부 CE 라 ③을 채우면 ①의 CE 자리가 줄고, 그 문항들의
 * 난이도가 ②의 칸을 먹는다. 그래서 **가장 빡빡한 것부터 채운다** — LG(9개 카테고리에서
 * 37문항뿐) → 난이도×갈래 → 남는 자리.
 *
 * **모자라면 조용히 넘기지 않고 화면에 적는다.** 이 저장소의 규칙이고, 여기서 특히 중요하다 —
 * "LG 4문항"은 사장님과 한 약속이라 안 지켜졌으면 그 사실이 보여야 한다. */
var LV_ORDER = ['하', '중', '상'];
/* ## 난이도 비중은 출력할 때마다 고른다 (2026-08-25 사장님 요청)
 * *"문제난이도 비중을 선택해서 출력할수있게"* · *"상담매니저들 실력향상과 전문성을 위한
 * 시험문제이기때문에 조금 더 문제 난이도가 높아도 됩니다"* → 기본을 **하4·중8·상8** 로
 * 올렸다(상 30% → 40%). 옛 기본은 하6·중8·상6 이었고 '쉽게' 가 그 자리를 대신한다.
 *
 * **`중` 은 8 아래로 내리지 않는다.** LG 비교 문항 74개가 **전부 '중'** 이라
 * `중 < LG_WANT(6)` 이면 "LG 6문항 고정" 이 그 자리에서 깨진다. 프리셋 넷이 모두
 * 중 7~8 인 이유이고, '직접 지정' 에서 낮추면 화면이 그 사실을 적는다(아래 `render`). */
/* 2026-08-25 사장님 지시로 **웹 시험과 같은 기준**이 됐다 — 방향성 문서
   (`urlquizgenerator_SKILL.md`)의 **상 50 · 중 35 · 하 15**. 20문항이면 10·7·3 으로
   정확히 떨어진다. 옛 값 하4·중8·상8(상 40%)은 프리셋 '쉽게' 쪽으로 내려갔다.
   *"이 시험은 붙는 시험이 아니다 … 목표는 평균 60점대"* 가 그 근거이고,
   A4 를 매장 교육용이라 다르게 둘지 물었으나 **맞추라**는 답을 받았다.
   **중은 6 아래로 내리지 않는다** — LG 비교 문항이 전부 '중' 이라 약속이 깨진다. */
var LV_MIX = { '하': 3, '중': 7, '상': 10 };
var LG_WANT = 6;   /* 2026-08-24 사장님 요청으로 4 → 6. 은행 68문항이라 두 시험지 기대 겹침 0.5개 */

/** 고른 비중을 문항 수 n 에 맞춰 나눈다. mix 는 **비율**이라 합이 20 이 아니어도 된다
 *  (직접 지정에서 3·3·4 처럼 쳐도 그대로 돌아간다). */
function lvQuota(n, mix){
  mix = mix || LV_MIX;
  var tot = 0, q = {}, sum = 0, i, L;
  for (i = 0; i < LV_ORDER.length; i++) tot += Math.max(0, mix[LV_ORDER[i]] || 0);
  if (!tot) return lvQuota(n, LV_MIX);           /* 셋 다 0 이면 기본값으로 되돌린다 */
  for (i = 0; i < LV_ORDER.length; i++){
    q[LV_ORDER[i]] = Math.round(n * Math.max(0, mix[LV_ORDER[i]] || 0) / tot);
    sum += q[LV_ORDER[i]];
  }
  /* 반올림으로 어긋난 만큼을 어디서 맞추는가 — **모자라면 큰 칸에 얹고, 넘치면 작은 칸에서 뺀다.**
     예전에는 '중' 에 몰아줬는데, 비중을 고를 수 있게 되면서 '중' 이 0 인 배분이 생겨
     **고르지도 않은 난이도가 시험지에 들어갔다.** 그래서 큰 칸으로 바꿨는데, 이번엔
     넘칠 때도 큰 칸에서 깎아 **강조한 난이도가 되레 줄었다** — 25문항 상 50% 가
     12.5 라 13 이어야 하는데 12 가 됐다(사장님 방향성 문서의 점검표가
     *"난이도 '상'이 절반 이상인가"* 다). 강조한 칸은 지키고 얇은 칸을 양보시킨다. */
  var over = sum - n;
  if (over < 0) {
    var big = LV_ORDER[0];
    for (i = 1; i < LV_ORDER.length; i++) if (q[LV_ORDER[i]] > q[big]) big = LV_ORDER[i];
    q[big] += -over;
  } else {
    while (over > 0) {
      var small = null;
      for (i = 0; i < LV_ORDER.length; i++) {
        var L = LV_ORDER[i];
        if (q[L] > 0 && (small === null || q[L] < q[small])) small = L;
      }
      if (small === null) break;
      q[small]--; over--;
    }
  }
  return q;
}

function pick(n, mxPct, rnd, mix){
  var wantMx = Math.round(n * mxPct / 100);
  var wantLv = lvQuota(n, mix);
  var need = { lv: lvQuota(n, mix), div: { MX: wantMx, CE: n - wantMx } };
  var all = BANK.items, used = {}, out = [];

  /* 조건에 맞는 것 하나를 무작위로 집는다. 없으면 null — 부르는 쪽이 조건을 늦춘다. */
  function take(ok){
    var pool = [], i;
    for (i = 0; i < all.length; i++) if (!used[all[i].i] && ok(all[i])) pool.push(all[i]);
    if (!pool.length) return null;
    var q = pool[Math.floor(rnd() * pool.length)];
    used[q.i] = 1; out.push(q);
    if (need.lv[q.lv] > 0) need.lv[q.lv]--;
    if (need.div[q.div] > 0) need.div[q.div]--;
    return q;
  }

  /* ① LG 문항 먼저 — 가장 얇아서 나중에 채우면 자리가 남지 않는다 */
  var gotLg = 0;
  while (gotLg < LG_WANT && out.length < n) {
    /* **난이도 칸을 넘어서까지 LG 를 밀어 넣지 않는다** (2026-08-25).
       난이도 비중이 사장님이 그 자리에서 고른 값이 된 뒤로, 갈래(CE/MX)만 늦추고
       난이도는 지킨다 — 안 그러면 `상 20` 을 골랐는데 LG 6개가 '중' 이라 **상 14** 가
       나온다(실측). 못 넣은 만큼은 `render` 가 원인과 함께 화면에 적는다. */
    var q = take(function(x){ return x.lg && need.lv[x.lv] > 0 && need.div[x.div] > 0; })
         || take(function(x){ return x.lg && need.lv[x.lv] > 0; });
    if (!q) break;                       /* 은행에 LG 문항이 모자란다 */
    gotLg++;
  }

  /* ② 난이도 × 갈래를 함께 맞추고, 안 되면 한 조건씩 늦춘다.
   *
   * **채우면서 LG 를 또 뽑지 않는다.** LG 문항도 일반 풀에 들어 있어 그냥 채우면 우연히
   * 더 뽑히고, 그러면 "LG 4문항 고정"이 약속이 아니라 하한이 된다(실측으로 6개가 나왔다).
   * 정말 채울 것이 없을 때만 마지막 폴백에서 받아들인다 — 문항 수를 못 채우는 쪽이 더 나쁘다. */
  var noLg = function(x){ return !x.lg || gotLg < LG_WANT; };
  while (out.length < n) {
    var q2 = take(function(x){ return noLg(x) && need.lv[x.lv] > 0 && need.div[x.div] > 0; })
          || take(function(x){ return noLg(x) && need.lv[x.lv] > 0; })
          || take(function(x){ return noLg(x) && need.div[x.div] > 0; })
          || take(function(x){ return noLg(x); })
          || take(function(){ return true; });
    if (!q2) break;                      /* 은행이 바닥났다 */
    if (q2.lg) gotLg++;
  }

  var got = { lv: {}, div: { CE: 0, MX: 0 }, lg: 0 };
  for (var k = 0; k < out.length; k++){
    got.lv[out[k].lv] = (got.lv[out[k].lv] || 0) + 1;
    got.div[out[k].div]++;
    if (out[k].lg) got.lg++;
  }
  return { list: shuffle(out, rnd), wantMx: wantMx, wantLv: wantLv, wantLg: LG_WANT,
           gotMx: got.div.MX, gotCe: got.div.CE, gotLv: got.lv, gotLg: got.lg };
}


function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
var NO = ['①','②','③','④','⑤'];

function render(code, n, mxPct, mix){
  var rnd = rng(seedFrom(code));
  var r = pick(n, mxPct, rnd, mix);

  /* 보기 순서도 섞는다 — 같은 문항이라도 시험지마다 답 위치가 달라야 한다 */
  var qs = r.list.map(function(q){
    var order = shuffle([0,1,2,3], rnd);
    return { q:q.q, cat:q.cat, type:q.type, div:q.div, lv:q.lv, lg:q.lg, exp:q.exp,
             opts: order.map(function(i){ return q.opts[i]; }),
             ans: order.indexOf(q.ans) };
  });

  var d = new Date();
  var ymd = d.getFullYear() + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + ('0'+d.getDate()).slice(-2);

  var WORDMARK = "<svg class=\"wm\" viewBox=\"0 0 7051.4024 1080\" role=\"img\" aria-label=\"SAMSUNG\" fill=\"currentColor\"><defs><clipPath id=\"exam-samsung-clip\" clipPathUnits=\"userSpaceOnUse\"><path d=\"M 0,166.885 H 628.238 V 0 H 0 Z\"/></clipPath></defs><g transform=\"matrix(12.944053,0,0,-12.944053,-540.03625,1620.0233)\"><g clip-path=\"url(#exam-samsung-clip)\"><g transform=\"translate(558.9328,88.5098)\"><path d=\"m 0,0 v -11.358 h 7.982 v -11.269 c 0.025,-1.007 -0.03,-2.093 -0.203,-2.962 -0.317,-2.102 -2.314,-5.681 -7.98,-5.681 -5.632,0 -7.593,3.579 -7.933,5.681 -0.143,0.869 -0.204,1.955 -0.204,2.962 v 35.593 c 0,1.259 0.085,2.637 0.352,3.68 0.387,1.897 2.068,5.638 7.743,5.638 5.957,0 7.444,-3.944 7.785,-5.638 0.224,-1.122 0.237,-3.004 0.237,-3.004 V 9.32 h 19.613 v 2.555 c 0,0 0.089,2.666 -0.149,5.154 C 25.769,31.638 13.732,36.26 -0.07,36.26 c -13.827,0 -25.62,-4.665 -27.338,-19.231 -0.155,-1.332 -0.392,-3.728 -0.392,-5.154 v -32.742 c 0,-1.426 0.046,-2.53 0.31,-5.136 1.28,-14.207 13.593,-19.243 27.365,-19.243 13.857,0 26.085,5.036 27.387,19.243 0.231,2.606 0.255,3.71 0.286,5.136 V 0 Z m -135.235,34.165 h -19.696 v -57.613 c 0.031,-1.004 0,-2.132 -0.173,-2.959 -0.411,-1.934 -2.05,-5.656 -7.484,-5.656 -5.364,0 -7.046,3.722 -7.426,5.656 -0.197,0.827 -0.222,1.955 -0.197,2.959 v 57.613 h -19.69 V -21.66 c -0.025,-1.439 0.088,-4.379 0.173,-5.149 1.359,-14.547 12.824,-19.27 27.14,-19.27 14.344,0 25.802,4.723 27.186,19.27 0.109,0.77 0.252,3.71 0.167,5.149 z m -180.97,0 -9.825,-60.876 -9.819,60.876 h -31.771 l -1.685,-77.878 h 19.464 l 0.527,72.094 13.392,-72.094 h 19.748 l 13.404,72.094 0.529,-72.094 h 19.513 l -1.742,77.878 z m -117.631,0 -14.426,-77.878 h 21.037 l 10.871,72.094 10.61,-72.094 h 20.891 l -14.366,77.878 z m 367.435,-62.701 -18.34,62.701 h -28.9 v -77.066 h 19.118 l -1.11,64.707 19.696,-64.707 h 27.717 v 77.066 h -19.243 z m -176.838,42.433 c -0.346,1.538 -0.246,3.172 -0.067,4.026 0.557,2.493 2.232,5.212 7.058,5.212 4.498,0 7.135,-2.804 7.135,-7.012 v -4.762 h 19.2 v 5.428 c 0,16.78 -15.044,19.416 -25.936,19.416 -13.718,0 -24.921,-4.522 -26.967,-17.148 -0.541,-3.436 -0.675,-6.486 0.186,-10.378 3.336,-15.743 30.743,-20.31 34.721,-30.266 0.702,-1.886 0.501,-4.291 0.143,-5.708 -0.596,-2.591 -2.339,-5.197 -7.506,-5.197 -4.846,0 -7.763,2.786 -7.763,6.985 l -0.006,7.474 h -20.666 v -5.941 c 0,-17.215 13.484,-22.409 28.007,-22.409 13.909,0 25.397,4.753 27.24,17.637 0.879,6.657 0.216,10.993 -0.137,12.626 -3.22,16.147 -32.431,21.004 -34.642,30.017 m -253.273,0.191 c -0.377,1.57 -0.289,3.227 -0.079,4.091 0.532,2.481 2.217,5.248 7.128,5.248 4.555,0 7.237,-2.831 7.237,-7.073 v -4.82 h 19.425 v 5.471 c 0,16.941 -15.274,19.641 -26.285,19.641 -13.833,0 -25.136,-4.592 -27.204,-17.309 -0.566,-3.491 -0.663,-6.562 0.155,-10.497 3.372,-15.922 31.05,-20.526 35.077,-30.601 0.754,-1.873 0.526,-4.278 0.152,-5.75 -0.639,-2.618 -2.396,-5.261 -7.606,-5.261 -4.865,0 -7.775,2.834 -7.775,7.091 l -0.027,7.494 h -20.898 v -5.955 c 0,-17.412 13.675,-22.648 28.311,-22.648 14.071,0 25.626,4.795 27.511,17.828 0.937,6.718 0.234,11.09 -0.082,12.748 -3.287,16.345 -32.823,21.186 -35.04,30.302\"/></g></g></g></svg>";
  /* 머리는 **모든 장에** 넣는다 — 여러 장으로 나뉘므로 장마다 워드마크·시험지 코드·쪽번호가 있어야
     섞이지 않는다(2026-08-24 현장: 로고가 잘려 안 보인다는 신고도 여기서 함께 해소된다). */
  function head(title, sub, pg){
    return '<div class="head"><div>' +
           '<div class="brand">' + WORDMARK + '<span class="store">STORE</span></div>' +
           '<div class="t">' + title + '</div>' +
           '<div class="s">' + sub + '</div></div>' +
           '<div class="code">시험지 ' + code + '<br><span class="pg">' + pg + '</span></div></div>';
  }

  /* ## 쪽당 5문항으로 **직접 끊는다** (2026-08-24 사장님 지시)
   * 브라우저가 알아서 흘리게 두면 한 .sheet 블록이 여러 쪽에 걸치는데, 그러면 그 블록의
   * padding 이 **첫 쪽 위와 마지막 쪽 아래에만** 걸려 가운데 쪽은 여백이 0이 된다.
   * 여기서 잘림이 났다. **한 블록 = 한 쪽**으로 끊으면 padding 이 그 쪽의 위아래 모두에
   * 걸리므로, 인쇄창의 여백 설정과 **무관하게** 여백이 지켜진다. */
  var PER_PAGE = 5;
  var pages = Math.ceil(qs.length / PER_PAGE);
  var h = '';
  for (var pi = 0; pi < pages; pi++) {
    var from = pi * PER_PAGE, part = qs.slice(from, from + PER_PAGE);
    h += '<div class="sheet">' +
         head('레벨업 챌린지', '2026 삼성 제품 전문가 성장 프로그램 · ' + ymd, (pi+1) + ' / ' + pages);
    if (pi === 0)
      h += '<div class="meta"><span>이름 <span class="fill"></span></span>' +
           '<span>사번 <span class="fill"></span></span>' +
           '<span>매장 <span class="fill"></span></span>' +
           '<span><b>' + qs.length + '문항</b> · 각 ' + (100/qs.length).toFixed(qs.length===20?0:1) +
           '점 · 100점 만점</span></div>';
    part.forEach(function(q, k){
      /* `data-lv` 는 **화면에도 인쇄에도 안 나오는 표식**이다 — 사장님 지시가
         "시험지에 난이도표시X" 라 응시자에게는 보이지 않아야 하고, 검사는 구성을 확인해야 한다.
         `data-div`(CE/MX)를 같은 이유로 이미 이렇게 두고 있다. */
      h += '<div class="q" data-div="' + esc(q.div) + '" data-lv="' + esc(q.lv) + '"' +
           (q.lg ? ' data-lg="1"' : '') + '><div class="qh"><span class="qn">' + (from+k+1) + '.</span>' +
           '<span class="qt">' + esc(q.q) + '</span></div><ul class="opts">';
      q.opts.forEach(function(o, i){
        h += '<li><span class="no">' + NO[i] + '</span><span>' + esc(o) + '</span></li>';
      });
      h += '</ul></div>';
    });
    h += '</div>';
  }

  /* 정답지도 같은 이유로 직접 끊는다 — 해설 10개씩. 첫 장에만 정답표를 얹는다. */
  var A_PER = 10;
  var apages = Math.ceil(qs.length / A_PER);
  for (var ai = 0; ai < apages; ai++) {
    var afrom = ai * A_PER, apart = qs.slice(afrom, afrom + A_PER);
    h += '<div class="sheet ans">' +
         head('정답 및 해설', '시험지 ' + code + ' 전용 — 시험지 코드가 같은지 확인하세요', (ai+1) + ' / ' + apages);
    if (ai === 0) {
      h += '<div class="akey">';
      qs.forEach(function(q, k){ h += '<div><b>' + (k+1) + '번</b><span>' + NO[q.ans] + '</span></div>'; });
      h += '</div>';
    }
    h += '<div class="exwrap">';
    apart.forEach(function(q, k){
      /* **난이도는 정답지에만 적는다**(2026-08-24 사장님 결정) — 채점·복기할 때
         "어느 난이도에서 틀렸는지"가 보인다. 시험지에는 안 나가므로 힌트가 되지 않는다. */
      h += '<div class="ex"><b>' + (afrom+k+1) + '.</b> ' +
           '<span class="lv lv-' + esc(q.lv) + '">' + esc(q.lv) + '</span> ' +
           (q.lg ? '<span class="lv lv-LG">LG</span> ' : '') + esc(q.q) +
           '<br><span class="a">정답 ' + NO[q.ans] + ' ' + esc(q.opts[q.ans]) + '</span>' +
           (q.exp ? '<br>' + esc(q.exp) : '') + '</div>';
    });
    h += '</div></div>';
  }

  document.getElementById('paper').innerHTML = h;

  /* 모자란 것은 조용히 넘기지 않고 밝힌다 */
  var msg = '시험지 ' + code + ' · ' + qs.length + '문항 (은행 ' + BANK.total + '문항에서 추첨)';
  msg += ' · CE ' + r.gotCe + ' / MX ' + r.gotMx;
  msg += ' · 난이도 하 ' + (r.gotLv['하'] || 0) + ' / 중 ' + (r.gotLv['중'] || 0) +
         ' / 상 ' + (r.gotLv['상'] || 0);
  msg += ' · LG 비교 ' + r.gotLg + '문항';
  if (r.gotMx < r.wantMx)
    msg += ' — MX 문항이 은행에 ' + ((BANK.byDiv && BANK.byDiv.MX) || 0) + '개뿐이라 ' +
           r.wantMx + '개 중 ' + r.gotMx + '개만 넣고 나머지는 CE 로 채웠습니다.';
  /* 약속한 구성이 안 지켜졌으면 반드시 적는다 — 조용히 넘기면 화면이 거짓말을 한다 */
  if (r.gotLg < r.wantLg) {
    /* **원인을 갈라 적는다.** 난이도를 고를 수 있게 되면서 부족한 이유가 둘이 됐다 —
       은행이 얇아서인지, 고른 배분에 LG 가 들어갈 칸이 없어서인지. 뭉뚱그리면
       "은행에 6개뿐" 같은 **틀린 원인**을 화면이 말하게 된다. */
    if (r.wantLv['중'] < r.wantLg)
      msg += ' — LG 비교 문항은 전부 난이도 “중” 인데 중 배정이 ' + r.wantLv['중'] +
             '개뿐이라 ' + r.wantLg + '개 중 ' + r.gotLg + '개만 넣었습니다. 중을 ' +
             r.wantLg + '개 이상으로 두시면 다 들어갑니다.';
    else
      msg += ' — LG 비교 문항은 은행에 ' + ((BANK.lgTotal) || 0) + '개뿐이라 ' +
             r.wantLg + '개 중 ' + r.gotLg + '개만 넣었습니다.';
  }
  var lvOff = LV_ORDER.filter(function(L){ return (r.gotLv[L] || 0) !== r.wantLv[L]; });
  if (lvOff.length)
    msg += ' — 난이도 배분이 목표(하 ' + r.wantLv['하'] + '/중 ' + r.wantLv['중'] +
           '/상 ' + r.wantLv['상'] + ')와 다릅니다: ' + lvOff.join('·');
  document.getElementById('hint').textContent = msg;
  document.getElementById('code').value = code;
  /* 인쇄창 "PDF로 저장"의 기본 파일명이 여기서 온다 — 여러 장 뽑아도 파일이 안 섞인다 */
  document.title = '시험지_' + code;
  /* 난이도도 주소에 싣는다 — **코드만으로는 같은 시험지가 안 나온다.**
     문항 수·MX% 와 마찬가지로 추첨 결과를 바꾸는 값이라, 링크를 넘겨야 그대로 재현된다. */
  try {
    history.replaceState(null, '', '?code=' + code + '&n=' + n + '&mx=' + mxPct +
      '&lv=' + LV_ORDER.map(function(L){ return r.wantLv[L]; }).join(','));
  } catch (e) {}
}

/** 화면에서 고른 난이도 비중. '직접 지정' 이면 세 칸을 읽는다. */
function curMix(){
  var sel = document.getElementById('lv'), man = document.getElementById('lvman');
  var manual = sel.value === 'manual';
  man.hidden = !manual;
  if (manual) return {
    '하': Math.max(0, parseInt(document.getElementById('lvL').value, 10) || 0),
    '중': Math.max(0, parseInt(document.getElementById('lvM').value, 10) || 0),
    '상': Math.max(0, parseInt(document.getElementById('lvH').value, 10) || 0),
  };
  var v = sel.value.split(',');
  /* 프리셋을 고르면 세 칸도 따라 움직인다 — '직접 지정' 으로 넘어갈 때 그 값에서 이어 고친다 */
  document.getElementById('lvL').value = v[0];
  document.getElementById('lvM').value = v[1];
  document.getElementById('lvH').value = v[2];
  return { '하': +v[0], '중': +v[1], '상': +v[2] };
}

function go(useTyped){
  var n = Math.max(5, Math.min(50, parseInt(document.getElementById('n').value, 10) || 20));
  var mx = Math.max(0, Math.min(100, parseInt(document.getElementById('mx').value, 10) || 0));
  var typed = (document.getElementById('code').value || '').trim().toUpperCase();
  render(useTyped && /^[A-Z0-9]{4}$/.test(typed) ? typed : newCode(), n, mx, curMix());
}

if (!BANK || !BANK.items || !BANK.items.length) {
  /* 틀 파일을 그대로 열었을 때다. 조용히 빈 화면을 보이지 않고 무엇을 해야 하는지 적는다 */
  document.getElementById('hint').textContent =
    '문제은행이 비어 있습니다 — 이 파일은 틀입니다. npm run build:examtool 로 만든 tools/시험지출력기.html 을 여세요.';
} else {
  var p = new URLSearchParams(location.search);
  if (p.get('n')) document.getElementById('n').value = p.get('n');
  if (p.get('mx')) document.getElementById('mx').value = p.get('mx');
  if (p.get('code')) document.getElementById('code').value = p.get('code');
  /* 주소로 받은 난이도는 프리셋에 있으면 그것을 고르고, 없으면 '직접 지정' 으로 연다 —
     받은 링크가 조용히 다른 배분으로 바뀌면 시험지가 재현되지 않는다 */
  if (p.get('lv') && /^\d+,\d+,\d+$/.test(p.get('lv'))) {
    var want = p.get('lv'), sel = document.getElementById('lv'), hit = false, i;
    for (i = 0; i < sel.options.length; i++) if (sel.options[i].value === want) { sel.value = want; hit = true; }
    if (!hit) {
      var v = want.split(',');
      document.getElementById('lvL').value = v[0];
      document.getElementById('lvM').value = v[1];
      document.getElementById('lvH').value = v[2];
      sel.value = 'manual';
    }
  }
  go(true);
}

/* 난이도를 바꾸면 곧바로 다시 뽑는다 — 코드는 그대로 두어 **배분만 바뀐 차이**를 볼 수 있다 */
document.getElementById('lv').addEventListener('change', function(){ go(true); });
['lvL', 'lvM', 'lvH'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){ go(true); });
});

document.getElementById('gen').addEventListener('click', function(){
  document.getElementById('code').value = '';   /* 새로 뽑을 때는 코드도 새로 */
  go(false);
});
document.getElementById('prt').addEventListener('click', function(){ window.print(); });
document.getElementById('code').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(true); });
</script>
</body>
</html>
