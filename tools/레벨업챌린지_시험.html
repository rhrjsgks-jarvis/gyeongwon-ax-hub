<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMSUNG STORE 레벨업 챌린지</title>
<style>
/*
 * **인터랙티브 웹 시험** (2026-08-25 사장님 지시 — `urlquizgenerator_SKILL.md` 의 최종 목표)
 *
 * A4 출력기(`시험지출력기.html`)와 **한 문제은행·한 출제 로직**을 쓴다.
 * 다른 것은 출구뿐이다 — 저쪽은 종이, 이쪽은 타이머 달린 화면이다.
 *
 * ## 자립형이어야 한다
 * 메일·링크로 받은 사람의 PC 에는 우리 서버가 없다. 문제은행을 파일 안에 담고
 * 바깥을 부르지 않는다(`fetch`·CDN 금지). A4 출력기와 같은 규칙이고 검사가 지킨다.
 *
 * ## 사번을 받는 이유
 * 누가 몇 점인지 남아야 교육이 된다. 8자리 숫자만 받고 이름은 받지 않는다 —
 * 이 파일은 링크로 퍼질 수 있어 개인정보를 최소로 둔다.
 *
 * ## 채점 결과를 시트로 보낼 수 있다
 * `SCRIPT_URL` 이 비어 있으면 화면에만 보여주고 아무 데도 안 보낸다(기본값).
 */
:root{ --navy:#1428A0; --ink:#111; --sub:#5b6070; --line:#e2e5ec; --bg:#f5f6f9;
       --ok:#166534; --no:#991b1b; --warn:#b45309; }
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
     'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;
     -webkit-text-size-adjust:100%}
.wrap{max-width:700px;margin:0 auto;padding:0 16px 80px}

/* ── 머리 ── 타이머가 늘 보여야 하므로 붙여 둔다 */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
       box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hd{max-width:700px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.hd .ttl{font-size:15px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .who{font-size:12px;opacity:.85;white-space:nowrap}
#timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;letter-spacing:.04em;
       padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.16);white-space:nowrap}
#timer.warn{background:#F59E0B;color:#3b2500}
#timer.danger{background:#DC2626;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}

.prog{max-width:700px;margin:0 auto;padding:7px 16px;display:flex;align-items:center;gap:10px;
      font-size:12.5px;background:#0f1f7a;color:#fff}
.prog .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.prog .bar i{display:block;height:100%;background:#fff;width:0;transition:width .25s}

/* ── 인트로 ── 전체를 덮어 시험 전에는 문항이 보이지 않게 한다 */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
       display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:#fff;border-radius:14px;box-shadow:0 6px 30px rgba(20,40,160,.10);
      padding:28px 24px;max-width:520px;width:100%}
.card h1{font-size:22px;margin:0 0 4px;color:var(--navy);letter-spacing:-.03em}
.card .sub{font-size:13px;color:var(--sub);margin:0 0 18px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 18px;font-size:13.5px}
.card dt{color:var(--sub)}
.card dd{margin:0;font-weight:600}
.card label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
.card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;
            font-size:16px;font-family:inherit;letter-spacing:.14em;text-align:center}
.card input:focus{outline:0;border-color:var(--navy)}
.err{color:var(--no);font-size:12.5px;min-height:18px;margin:6px 0 0}
.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:9px;background:var(--navy);
    color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.6}

/* ── 문항 ── */
.q{background:#fff;border-radius:12px;padding:18px 18px 14px;margin:14px 0;
   box-shadow:0 1px 4px rgba(20,40,160,.06)}
.q .qh{display:flex;gap:9px;font-size:16px;font-weight:700;line-height:1.5;margin-bottom:12px}
.q .qn{color:var(--navy);min-width:26px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);
     border-radius:9px;margin:0 0 7px;cursor:pointer;font-size:14.5px;background:#fff}
.opt:hover{border-color:#b9c0d8}
.opt.sel{border-color:var(--navy);background:#eef1ff}
.opt .no{color:var(--sub);font-weight:700;flex-shrink:0}
.opt.right{border-color:var(--ok);background:#f0fdf4}
.opt.wrong{border-color:var(--no);background:#fef2f2}
.exp{margin-top:10px;padding:11px 12px;background:#f8f9fc;border-radius:8px;font-size:13px;
     color:var(--sub);line-height:1.6}
.exp b{color:var(--navy)}

.submit{width:100%;padding:15px;border:0;border-radius:11px;background:var(--navy);color:#fff;
        font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;margin:18px 0}
.submit:disabled{opacity:.4;cursor:not-allowed}

/* ── 결과 ── */
.result{background:#fff;border-radius:14px;padding:26px 22px;margin:18px 0;text-align:center;
        box-shadow:0 3px 16px rgba(20,40,160,.08)}
.result .score{font-size:44px;font-weight:900;color:var(--navy);letter-spacing:-.04em;line-height:1.1}
.result .grade{font-size:16px;font-weight:800;margin:6px 0 14px}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;text-align:left;
           max-width:280px;margin:0 auto}
.result dt{color:var(--sub)}
.result dd{margin:0;font-weight:600}
.again{margin-top:18px;padding:11px 22px;border:1.5px solid var(--navy);border-radius:9px;
       background:#fff;color:var(--navy);font-weight:800;font-family:inherit;font-size:14px;cursor:pointer}
h2.sec{font-size:15px;margin:26px 0 4px;color:var(--navy)}
</style>
</head>

 (물 튀김 정도)"],"ans":0,"exp":"IP68은 수심 1.5m(제조사 따라 최대 2m)에서 30분간 방수 성능을 보장하며 일상적 물 접촉에서 안전하다.","b2b":0,"nm":0,"i":678},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성월렛(삼성페이)의 결제 방식 설명으로 올바른 것은?","opts":["오프라인은 MST·NFC, QR은 해외 결제만","국내 오프라인 매장에서도 QR코드를 스캔해 결제할 수 있다","MST는 지원하지 않고 NFC만 지원한다","국내 기본 결제 방식은 바코드 제시다"],"ans":0,"exp":"국내 오프라인 결제는 MST(마그네틱 보안 전송)와 NFC 두 가지로, 단말기에 휴대폰을 갖다 대는 방식입니다(삼성 뉴스룸 \"MST·NFC 동시 지원\" · 삼성월렛 공식 지면 · 고객지원 「삼성월렛으로 결제하는 방법」). **QR 결제가 아예 안 되는 것은 아니지만 조건이 붙습니다** — 삼성월렛 GLN 해외 QR 결제(제휴)나 일본 월렛의 페이페이 QR처럼 해외·제휴 서비스에서만 쓰입니다. PC 온라인 결제 화면의 QR은 결제 수단이 아니라 본인 인증용이고, 바코드는 국내에서 티켓·멤버십 제시 용도입니다. 앱 이름은 삼성월렛이며 삼성페이는 그 안의 결제 기능입니다.","b2b":0,"nm":0,"i":679},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 S26의 AP(Application Processor)는?","opts":["스냅드래곤 8 Elite for Galaxy (Qualcomm)","엑시노스 2600","미디어텍 디멘시티","Apple A18"],"ans":1,"exp":"갤럭시 S26과 S26+는 엑시노스 2600을, 최상위 S26 울트라는 갤럭시용 스냅드래곤 8 Elite 5세대를 탑재합니다. 삼성닷컴 사양표에서도 S26은 데카코어(10코어), S26 울트라는 옥타코어(8코어)로 갈립니다. 시리즈 전체가 스냅드래곤인 것으로 안내하면 안 됩니다.","b2b":0,"nm":0,"i":680},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시의 'One UI(원 UI)'가 안드로이드 순정 대비 차별화하는 주요 기능은?","opts":["한 손 조작·갤럭시 AI·DeX·생태계 연동","아이폰과 똑같은 화면 배치를 그대로 가져온 것","구글이 넣어 둔 기본 앱을 모두 지워 주는 것","같은 배터리로 사용 시간을 늘려 주는 것"],"ans":0,"exp":"One UI는 한 손 조작, 대화면 분할, 갤럭시 AI, 삼성 기기 간 생태계 연동 등 삼성 고유 사용 경험을 제공한다.","b2b":0,"nm":0,"i":681},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 스마트폰의 '보안 폴더' 기능의 목적은?","opts":["Knox 기반 암호화 공간에 개인 파일·앱 별도 저장","촬영한 사진의 화질을 자동으로 끌어올려 따로 저장해 준다","자주 안 쓰는 앱의 배터리 사용을 묶어서 절약","홈 화면 폴더를 종류별로 자동 정리해 준다"],"ans":0,"exp":"보안 폴더는 Knox 보안 플랫폼 기반으로 별도 암호화된 공간에 앱과 파일을 격리해 개인정보를 보호한다.","b2b":0,"nm":0,"i":682},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 폰의 '빠른 충전' 방식으로 올바른 것은?","opts":["25W~60W 유선 급속충전","무선 충전 방식만 지원한다","USB-A 단자에서만 동작한다","충전 속도가 늘 일정하다"],"ans":0,"exp":"갤럭시 S26 울트라는 갤럭시 최초로 초고속 충전 3.0(최대 60W)을 지원해 약 30분에 75%까지 충전됩니다. 그 아래 모델은 25W~45W 급속충전이며, 충전기는 별매입니다.","b2b":0,"nm":0,"i":683},{"cat":"휴대폰","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 S26 울트라의 디스플레이 패널 방식으로 올바른 것은?","opts":["Dynamic AMOLED 2X","Mini LED 백라이트 방식","IPS 방식을 쓴 LCD 패널","Micro RGB 백라이트 방식"],"ans":0,"exp":"S26 울트라는 Dynamic AMOLED 2X 패널에 120Hz 가변 주사율을 씁니다. Mini LED · Micro RGB 는 TV 에 쓰는 방식이고 IPS LCD 는 다른 제조사 노트북 · 모니터에서 흔한 방식입니다. 피크 밝기 수치는 국내 공식 스펙시트로 확정되지 않아 상담에서 숫자로 말하지 않습니다.","b2b":0,"nm":0,"i":684},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 폰에서 '에너지 절약 모드' 활성화 시 제한되는 기능은?","opts":["5G 통신·고주사율·배경 앱 제한","Wi-Fi 완전 차단","카메라 촬영 불가","전화 수신 불가"],"ans":0,"exp":"에너지 절약 모드는 5G를 4G로 전환, 120Hz를 60Hz로 낮추고, 백그라운드 앱 활동을 제한해 배터리를 절약한다.","b2b":0,"nm":0,"i":685},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"삼성 갤럭시 Z Fold8 펼쳤을 때 화면 크기는?","opts":["약 7.6인치","약 5.5인치","약 9인치","약 6.1인치"],"ans":0,"exp":"Z Fold8은 펼치면 약 7.6인치의 태블릿급 대형 화면으로 변환되어 생산성과 미디어 사용에 최적화된다(참고로 '약 5.5인치'는 접었을 때 커버 화면 크기). 상위 세그먼트인 Z Fold8 Ultra는 펼쳤을 때 약 8인치로 더 크다.","b2b":0,"nm":0,"i":686},{"cat":"휴대폰","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 Z Fold8과 Z Fold8 Ultra의 차이로 올바른 것은?","opts":["Fold8 Ultra만 200MP 메인 + 10MP 3배 망원, Fold8은 없다","Fold8과 Fold8 Ultra는 화면 크기와 무게가 완전히 동일하다","Fold8 Ultra에서만 S펜을 쓸 수 있고 Fold8에서는 전혀 쓸 수가 없다","배터리 용량은 Fold8 쪽이 Fold8 Ultra보다 더 크다"],"ans":0,"exp":"Z Fold8 Ultra는 메인 8인치·커버 6.5인치 디스플레이, 200MP 메인 카메라 + 10MP 3배 광학 망원, 5,000mAh 배터리를 갖춘 최상위 모델이다. 기본형 Z Fold8은 메인 7.6인치·커버 5.5인치, 50MP 메인 + 50MP 초광각(망원 없음), 4,800mAh 배터리로 더 가볍고 합리적인 포지션이다. 두 모델 모두 S펜은 지원하지 않는다(Fold6까지는 지원했음).","b2b":0,"nm":0,"i":687},{"cat":"휴대폰","type":"product","div":"MX","lv":"상","lg":0,"q":"삼성 Galaxy S26 시리즈의 공식 보증 무게(S26 Ultra 기준)로 올바른 것은?","opts":["195g","214g","228g","245g"],"ans":1,"exp":"Galaxy S26 Ultra의 무게는 214g으로 S24 Ultra(232g) 대비 18g 가벼워졌습니다.","b2b":0,"nm":0,"i":688},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 절전 모드 최대 배터리 사용 시간으로 올바른 것은?","opts":["최대 60시간","최대 80시간","최대 100시간","최대 120시간"],"ans":2,"exp":"갤럭시 워치 울트라2는 절전 모드 최대 100시간, 운동 중 절전 모드 최대 48시간 배터리를 제공합니다(전작 울트라(2025)와 동일). 일반 모드에서는 상시표시화면(AOD) 켠 상태 최대 60시간, 끈 상태 최대 80시간까지 늘어났습니다.","b2b":0,"nm":0,"i":689},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 방수 등급으로 올바른 것은?","opts":["5 ATM / IP67","10 ATM / IP68","10 ATM / IP69K","5 ATM / IP68"],"ans":2,"exp":"갤럭시 워치 울트라2는 10 ATM / IP69K 등급에 EN13319 다이빙 인증까지 더해져 수영장·바다에서 수심 40m까지 다이빙 중 착용이 가능합니다. 전작 울트라(2025)는 10 ATM / IP68(수심 100m 10분 방수) 등급이었습니다.","b2b":0,"nm":0,"i":690},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2가 견딜 수 있는 최대 고도와 작동 온도 범위로 올바른 것은?","opts":["5,000m / -10°C ~ 45°C","7,000m / -15°C ~ 50°C","9,000m / -20°C ~ 55°C","9,000m / -10°C ~ 60°C"],"ans":2,"exp":"갤럭시 워치 울트라2는 최대 9,000m 고도에서 저항 가능하며 -20°C ~ 55°C의 작동 온도 범위를 지원합니다(전작과 동일).","b2b":0,"nm":0,"i":691},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch Ultra2에서 수면 중 착용해 측정하는 삼성 고유의 건강 지표는?","opts":["혈당 지수(GI)","최종당화산물 지수","혈중 케톤 지수","체내 염증 지수"],"ans":1,"exp":"갤럭시 워치 울트라2는 수면 중 착용 시 최종당화산물 지수(AGEs)를 측정합니다. 식단과 생활 습관을 반영하는 건강 지표로 Apple Watch Ultra 3에는 없는 삼성만의 기능입니다.","b2b":0,"nm":0,"i":692},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch Ultra2에서 수면 중 심혈관 건강을 추적하는 삼성 고유의 기능은?","opts":["혈압 연속 모니터링","혈관 스트레스 모니터링","동맥 경화도 측정","심혈관 나이 측정"],"ans":1,"exp":"갤럭시 워치 울트라2는 밤새 PPG(광학 심박) 센서로 수면 중 혈관에 가해지는 스트레스 변화를 추적하는 '혈관 스트레스 모니터링' 기능을 제공합니다.","b2b":0,"nm":0,"i":693},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 퀵 버튼을 5초간 길게 누르면 작동하는 긴급 사이렌의 최대 음량과 전달 거리는?","opts":["80dB / 최대 100m","86dB / 최대 180m","90dB / 최대 200m","86dB / 최대 150m"],"ans":1,"exp":"갤럭시 워치 울트라2는 최대 86dB의 강력한 사이렌이 작동하여 최대 180m 떨어진 곳까지 소리가 전달됩니다.","b2b":0,"nm":0,"i":694},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 내부 저장 공간 용량으로 올바른 것은?","opts":["16GB","32GB","64GB","128GB"],"ans":2,"exp":"갤럭시 워치 울트라2는 64GB 내부 저장 공간을 제공하여 GPX 경로 데이터, 음악 등을 넉넉하게 저장할 수 있습니다.","b2b":0,"nm":0,"i":695},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2의 듀얼 GPS가 활용하는 이중 주파수 대역으로 올바른 것은?","opts":["L1과 L2","L1과 L5","L2와 L5","L1과 L3"],"ans":1,"exp":"갤럭시 워치 울트라2는 L1과 L5의 이중 주파수 대역을 활용하여 핀포인트 GPS 정확도를 제공합니다.","b2b":0,"nm":0,"i":696},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch Ultra2의 바이오 액티브 센서로 지원하지 않는 기능은?","opts":["체성분(BIA) 측정","심전도(ECG) 측정","혈당 직접 측정","혈압 측정"],"ans":2,"exp":"갤럭시 워치 울트라2는 체성분(BIA), 심전도(ECG), 혈압 측정을 지원합니다. 단, 혈당을 직접 측정하는 기능은 없습니다.","b2b":0,"nm":0,"i":697},{"cat":"웨어러블","type":"product","div":"MX","lv":"상","lg":0,"q":"Galaxy Watch Ultra2 vs Apple Watch Ultra 3 배터리 비교로 올바른 것은?","opts":["삼성 80시간 / 애플 60시간","삼성 100시간 / 애플 72시간","삼성 72시간 / 애플 100시간","삼성 100시간 / 애플 80시간"],"ans":1,"exp":"갤럭시 워치 울트라2는 절전 모드에서 최대 100시간, Apple Watch Ultra 3는 저전력 모드에서 최대 72시간 배터리를 지원합니다.","b2b":0,"nm":0,"i":698},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch9 시리즈(일반 모델)에서 강화된 수면무호흡 감지 기능의 특징으로 올바른 것은?","opts":["혈당을 재는 기능이 새로 붙었다","무호흡 위험도를 3단계로 분류","혈중 산소 측정 기능이 새로 붙었다","심전도를 재는 기능이 새로 붙었다"],"ans":1,"exp":"Galaxy Watch9는 새로운 FDA 허가와 AI 알고리즘을 통해 수면 중 시간당 호흡 정지 횟수를 분석해 무호흡 위험도를 3단계로 분류하는 기능으로 강화되었습니다. 수면 무호흡증 감지 자체는 Watch8에서 처음 도입됐고, Watch9는 그 정밀도를 높인 버전입니다.","b2b":0,"nm":0,"i":699},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch의 '심전도(ECG)' 측정 방법으로 올바른 것은?","opts":["워치를 차고 있으면 24시간 자동으로 측정된다","크라운이나 홈 버튼을 30초간 누른다","NFC로 병원 기기와 연동해야만 측정된다","손목에 가볍게 터치하면 자동으로 측정된다"],"ans":1,"exp":"갤럭시 워치의 ECG 측정은 디지털 왕관(베젤 버튼)을 반대편 손가락으로 가볍게 30초간 누르면 측정됩니다. 완전한 ECG 파형을 기록해 심방세동(AFib) 등 불규칙한 심장 리듬을 감지합니다.","b2b":0,"nm":0,"i":700},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch9의 'Energy Score(에너지 스코어)' 기능의 설명으로 올바른 것은?","opts":["하루 동안 태운 칼로리를 모아 점수로 바꿔 표시","수면·심박·활동량으로 회복 상태를 0~100점","시계에 남아 있는 배터리 양을 점수로 바꿔 표시","한 번의 운동이 얼마나 셌는지를 점수로 매김"],"ans":1,"exp":"Energy Score는 전날 밤 수면 품질, 심박수 변이도(HRV), 활동량 등을 종합 분석해 오늘 하루 몸 상태와 회복 수준을 0~100점으로 표현합니다. 운동 강도를 조절하는 데 참고할 수 있습니다.","b2b":0,"nm":0,"i":701},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch의 혈압 측정 기능의 제한 사항으로 올바른 것은?","opts":["세계 어느 나라에서나 제한 없이 그대로 쓸 수 있다","일부 국가만 지원하며 보정 후에 쓸 수 있다","혈압계 없이도 완전히 정확한 절대 수치를 재 준다","하루 24시간 내내 자동으로 쉬지 않고 재 준다"],"ans":1,"exp":"갤럭시 워치의 혈압 측정은 의료 기기 허가 국가(한국 포함 일부 국가)에서만 사용 가능합니다. 또한 표준 혈압계로 먼저 보정(calibration)을 완료해야 하며, 절대 수치보다는 변화 추이를 모니터링하는 용도입니다.","b2b":0,"nm":0,"i":702},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch8 Classic(클래식)의 특징으로 올바른 것은?","opts":["터치 베젤만 지원","물리적 회전 베젤 탑재","스포츠 에디션으로 배터리 강화","일반 Watch8과 동일한 디자인에 색상만 다름"],"ans":1,"exp":"Galaxy Watch8 Classic은 물리적 회전 베젤을 탑재해 클래식한 시계 느낌을 주면서도 스크롤, 메뉴 탐색 등을 베젤을 돌려 조작할 수 있습니다. 고급스러운 스테인리스 소재를 사용합니다. 참고: 2026년 Watch9 세대에는 별도의 Classic 모델이 출시되지 않아, Watch8 Classic이 현재 판매 중인 가장 최신 회전 베젤 모델입니다.","b2b":0,"nm":0,"i":703},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"Galaxy Watch의 'Sleep Coaching(수면 코칭)' 기능에 대한 설명으로 올바른 것은?","opts":["매일 밤 코치가 전화해 기상을 알려 준다","수면 데이터로 4~5주 개선 프로그램","침대에 눕는 순간 자동으로 수면 모드로 바뀐다","수면 코칭은 의사의 처방이 있어야 쓸 수 있다"],"ans":1,"exp":"Sleep Coaching은 수면 패턴(수면 시간, 단계, 심박수 등)을 분석해 개인화된 4~5주 수면 개선 프로그램을 제공합니다. 수면 습관 개선 팁과 목표를 단계별로 안내합니다.","b2b":0,"nm":0,"i":704},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"현행 Galaxy Watch(Watch4 이후)와 iPhone의 호환성에 대한 설명으로 올바른 것은?","opts":["iPhone에서도 모든 기능을 그대로 쓸 수 있다","Google Play 서비스를 쓰기 때문에 iOS에서는 사용할 수 없다","iPhone에서 삼성 헬스 앱으로 모든 기능을 쓸 수 있다","전용 어댑터를 사면 iPhone에서도 연동된다"],"ans":1,"exp":"삼성 공식 지원문서 원문 — \"Galaxy Watch4, Watch5, Watch6, Watch7, Watch Ultra, and Watch FE: These watches rely on Google Play services which is not supported on iOS.\" 즉 Wear OS 로 바뀐 Watch4 이후는 iPhone 을 지원하지 않습니다. 다만 구형 Tizen 모델(2018년형 Galaxy Watch · Watch Active · Active2 · Gear 시리즈)은 iOS 9 이상에서 호환된다고 같은 문서가 밝히므로, \"갤럭시 워치는 무조건 안 된다\"고 말하면 안 됩니다.","b2b":0,"nm":0,"i":705},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch9 Series의 체성분 분석(BIA) 측정 방법으로 올바른 것은?","opts":["워치를 차기만 하면 자동으로 측정","워치 뒷면 센서에 반대편 손가락을 대고 약 15~20초간 측정","SmartThings 앱의 분석 기능으로만 측정 가능","삼성 체중계와 반드시 연동해야 측정 가능"],"ans":1,"exp":"체성분(BIA) 측정은 워치 뒷면 센서에 반대편 손가락을 가볍게 대고 약 15~20초간 유지하면 됩니다. 골격근량, 체지방률, 체수분 등을 측정합니다.","b2b":0,"nm":0,"i":706},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"Galaxy Watch의 'Irregular Heart Rhythm Notification(불규칙 심장리듬 알림)' 기능에 대한 설명으로 올바른 것은?","opts":["심방세동을 24시간 자동 감지해 알림","사용자가 직접 ECG를 측정했을 때만 분석","혈압이 높아지면 자동으로 감지해 알린다","심박수가 100bpm을 넘으면 항상 알린다"],"ans":0,"exp":"불규칙 심장리듬 알림은 PPG 광학 센서로 24시간 연속 심박 패턴을 분석해 심방세동(AFib) 의심 징후가 감지되면 사용자에게 알림을 보냅니다. FDA·식약처 허가를 받은 기능입니다.","b2b":0,"nm":0,"i":707},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 Galaxy Watch와 Apple Watch의 운동 추적 기능 비교로 올바른 것은?","opts":["Galaxy Watch는 GPS가 없어 운동 경로를 추적하지 못한다","Galaxy Watch는 100가지 이상 종목 자동 감지","Galaxy Watch에는 골프 코스 지원 기능이 없다","Apple Watch에서만 AGEs 측정이 가능하다"],"ans":1,"exp":"Galaxy Watch와 Apple Watch 모두 100가지 이상의 운동 종목을 자동으로 감지하고 추적하는 수준입니다. 다만 AGEs 측정, 혈관 스트레스 모니터링 등 일부 기능은 Galaxy Watch만의 차별점입니다.","b2b":0,"nm":0,"i":708},{"cat":"웨어러블","type":"product","div":"MX","lv":"중","lg":0,"q":"삼성 갤럭시 워치 울트라2의 'BioActive Sensor(바이오액티브 센서)'가 측정하는 것이 아닌 것은?","opts":["혈당 수치","심박수","혈중산소","체지방"],"ans":0,"exp":"BioActive Sensor는 심박수, 혈중산소, 체성분(체지방 등)을 측정하지만 혈당 직접 측정은 현재 지원하지 않는다.","b2b":0,"nm":0,"i":709},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 워치의 '수면 코칭' 기능이 분석하는 요소는?","opts":["수면 단계·심박·움직임·혈중산소","잠든 시각과 깬 시각만 기록한다","손목 피부 온도 변화만 살펴본다","마이크로 잡은 코골이 소리만 센다"],"ans":0,"exp":"수면 코칭은 수면 단계(REM, 깊은 수면 등), 심박수, 움직임, 혈중산소를 분석해 수면 품질 점수와 개선 방법을 제공한다.","b2b":0,"nm":0,"i":710},{"cat":"웨어러블","type":"product","div":"MX","lv":"하","lg":0,"q":"삼성 갤럭시 워치 'ECG 측정'의 의미와 한계는?","opts":["심전도 참고 자료 · 진단은 불가","의학적 진단까지 그대로 쓸 수 있다","의사 처방을 받아야 켤 수 있다","한국에서는 아예 쓸 수 없는 기능"],"ans":0,"exp":"ECG(심전도) 측정은 심방세동 등을 감지하는 참고 자료로 활용되나, 의료기기가 아니므로 의학적 진단을 대체할 수 없다.","b2b":0,"nm":0,"   if (!tot) return lvQuota(n, LV_MIX);           /* 셋 다 0 이면 기본값으로 되돌린다 */
  for (i = 0; i < LV_ORDER.length; i++){
    q[LV_ORDER[i]] = Math.round(n * Math.max(0, mix[LV_ORDER[i]] || 0) / tot);
    sum += q[LV_ORDER[i]];
  }
  /* 반올림으로 어긋난 만큼을 어디서 맞추는가 — **모자라면 큰 칸에 얹고, 넘치면 작은 칸에서 뺀다.**
     예전에는 '중' 에 몰아줬는데, 비중을 고를 수 있게 되면서 '중' 이 0 인 배분이 생겨
     **고르지도 않은 난이도가 시험지에 들어갔다.** 그래서 큰 칸으로 바꿨는데, 이번엔
     넘칠 때도 큰 칸에서 깎아 **강조한 난이도가 되레 줄었다** — 25문항 상 50% 가
     12.5 라 13 이어야 하는데 12 가 됐다(사장님 방향성 문서의 점검표가
     *"난이도 '상'이 절반 이상인가"* 다). 강조한 칸은 지키고 얇은 칸을 양보시킨다. */
  var over = sum - n;
  if (over < 0) {
    var big = LV_ORDER[0];
    for (i = 1; i < LV_ORDER.length; i++) if (q[LV_ORDER[i]] > q[big]) big = LV_ORDER[i];
    q[big] += -over;
  } else {
    while (over > 0) {
      var small = null;
      for (i = 0; i < LV_ORDER.length; i++) {
        var L = LV_ORDER[i];
        if (q[L] > 0 && (small === null || q[L] < q[small])) small = L;
      }
      if (small === null) break;
      q[small]--; over--;
    }
  }
  return q;
}

function pick(n, mxPct, rnd, mix){
  var wantMx = Math.round(n * mxPct / 100);
  var wantLv = lvQuota(n, mix);
  var need = { lv: lvQuota(n, mix), div: { MX: wantMx, CE: n - wantMx } };
  var all = BANK.items, used = {}, out = [];

  /* 조건에 맞는 것 하나를 무작위로 집는다. 없으면 null — 부르는 쪽이 조건을 늦춘다. */
  function take(ok){
    var pool = [], i;
    for (i = 0; i < all.length; i++) if (!used[all[i].i] && ok(all[i])) pool.push(all[i]);
    if (!pool.length) return null;
    var q = pool[Math.floor(rnd() * pool.length)];
    used[q.i] = 1; out.push(q);
    if (need.lv[q.lv] > 0) need.lv[q.lv]--;
    if (need.div[q.div] > 0) need.div[q.div]--;
    return q;
  }

  /* ① LG 문항 먼저 — 가장 얇아서 나중에 채우면 자리가 남지 않는다 */
  var gotLg = 0;
  while (gotLg < LG_WANT && out.length < n) {
    /* **난이도 칸을 넘어서까지 LG 를 밀어 넣지 않는다** (2026-08-25).
       난이도 비중이 사장님이 그 자리에서 고른 값이 된 뒤로, 갈래(CE/MX)만 늦추고
       난이도는 지킨다 — 안 그러면 `상 20` 을 골랐는데 LG 6개가 '중' 이라 **상 14** 가
       나온다(실측). 못 넣은 만큼은 `render` 가 원인과 함께 화면에 적는다. */
    var q = take(function(x){ return x.lg && need.lv[x.lv] > 0 && need.div[x.div] > 0; })
         || take(function(x){ return x.lg && need.lv[x.lv] > 0; });
    if (!q) break;                       /* 은행에 LG 문항이 모자란다 */
    gotLg++;
  }

  /* ② 난이도 × 갈래를 함께 맞추고, 안 되면 한 조건씩 늦춘다.
   *
   * **채우면서 LG 를 또 뽑지 않는다.** LG 문항도 일반 풀에 들어 있어 그냥 채우면 우연히
   * 더 뽑히고, 그러면 "LG 4문항 고정"이 약속이 아니라 하한이 된다(실측으로 6개가 나왔다).
   * 정말 채울 것이 없을 때만 마지막 폴백에서 받아들인다 — 문항 수를 못 채우는 쪽이 더 나쁘다. */
  var noLg = function(x){ return !x.lg || gotLg < LG_WANT; };
  while (out.length < n) {
    var q2 = take(function(x){ return noLg(x) && need.lv[x.lv] > 0 && need.div[x.div] > 0; })
          || take(function(x){ return noLg(x) && need.lv[x.lv] > 0; })
          || take(function(x){ return noLg(x) && need.div[x.div] > 0; })
          || take(function(x){ return noLg(x); })
          || take(function(){ return true; });
    if (!q2) break;                      /* 은행이 바닥났다 */
    if (q2.lg) gotLg++;
  }

  var got = { lv: {}, div: { CE: 0, MX: 0 }, lg: 0 };
  for (var k = 0; k < out.length; k++){
    got.lv[out[k].lv] = (got.lv[out[k].lv] || 0) + 1;
    got.div[out[k].div]++;
    if (out[k].lg) got.lg++;
  }
  return { list: shuffle(out, rnd), wantMx: wantMx, wantLv: wantLv, wantLg: LG_WANT,
           gotMx: got.div.MX, gotCe: got.div.CE, gotLv: got.lv, gotLg: got.lg };
}



/* ── 시험 설정 ──
   난이도는 `urlquizgenerator_SKILL.md` 가 정한 **상 50 · 중 35 · 하 15** 다.
   *"이 시험은 붙는 시험이 아니다 … 목표는 평균 60점대"* 라는 것이 그 근거이고,
   A4 출력기(하4·중8·상8)와 값이 다른 것은 **의도한 것**이다 —
   저쪽은 매장 교육용이고 이쪽은 평가용이다. */
var EXAM_COUNT = 25;
var EXAM_MIN = 30;
var EXAM_MIX = { '하': 15, '중': 35, '상': 50 };
var MX_PCT = 50;
var SCRIPT_URL = '';   /* Google Apps Script 주소. 비어 있으면 아무 데도 안 보낸다 */

/* ── 채점 결과 보내기 ── (2026-08-26)
 * 화면에만 남기면 응시자가 창을 닫는 순간 점수가 사라진다. 그래서 시트로 보내되
 * **성공 여부를 읽는다.** 예전에는 mode:'no-cors' 로 던지고 끝이라 실패해도 아무도
 * 몰랐다 — 이 저장소가 사용 로그 파이프라인에서 이미 데인 그 고장이고, 시험에서는
 * 더 나쁘다(응시자는 다시 풀 수도 없다).
 *
 * POST 가 아니라 GET 인 이유는 이 파일이 file:// 로 열리기 때문이다. origin 이 null 이라
 * POST 에는 프리플라이트(OPTIONS)가 붙는데 Apps Script 는 그것을 받지 않는다.
 *
 * 못 보낸 것은 **브라우저에 남겨 두었다가 다음에 열 때 다시 보낸다.** 매장 전파가
 * 끊긴 채로 응시하는 일이 실제로 있고, 그때 점수가 통째로 빠지면 안 된다.
 * 같은 줄이 두 번 가는 것은 받는 쪽(docs/apps-script/Exam.gs)이 사번+코드+응시시각으로 거른다. */
var OUTBOX = 'exam_outbox', PEND = null;
/* **메모리가 1차, localStorage 는 덤이다.** 파일로 연 HTML 에서는 브라우저에 따라
   localStorage 가 막히는데(사파리는 file:// 에서 던진다), 예전처럼 예외를 삼키고
   빈 배열을 돌려주면 **보낼 것이 없다고 보고 화면에 "기록됨"이라 적는다** —
   한 줄도 안 보내 놓고 성공이라 말하는 셈이라 이 기능에서 가장 나쁜 고장이다.
   localStorage 는 "다음에 열 때 다시 보내기"에만 쓰이고, 없으면 그것만 못 한다. */
function box(v){
  if (v){
    PEND = v.slice(-50);
    try { localStorage.setItem(OUTBOX, JSON.stringify(PEND)); } catch (e) {}
    return PEND;
  }
  if (PEND) return PEND;
  try { PEND = JSON.parse(localStorage.getItem(OUTBOX) || '[]'); } catch (e) { PEND = []; }
  return PEND;
}
function rec(msg, bad){
  var el = $('rec'); if (!el) return;
  el.textContent = msg;
  el.style.color = bad ? 'var(--no)' : '';
}
/** 밀린 것을 앞에서부터 하나씩 보낸다. 한 건이라도 실패하면 거기서 멈춘다 —
 *  실패는 대개 네트워크·배포 문제라 나머지를 밀어붙여도 똑같이 실패한다. */
function send(){
  var q = box();
  if (!q.length){ rec('기록됨'); return; }
  fetch(SCRIPT_URL + '?' + new URLSearchParams(q[0])).then(function(r){
    return r.ok ? r.text() : Promise.reject(r.status);
  }).then(function(t){
    if (t.indexOf('"ok":true') < 0) return Promise.reject(t.slice(0, 60));
    box(box().slice(1));
    send();
  }).catch(function(){
    rec('기록 실패 — 결과 화면을 캡처해 전달하세요', true);
  });
}

var code = newCode(), picked = null, chosen = {}, submitted = false;
var left = EXAM_MIN * 60, tick = null, startedAt = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
var NO = ['①','②','③','④','⑤'];
var $ = function(id){ return document.getElementById(id); };

/* ── 인트로 ── */
function setup(){
  if (!BANK || !BANK.items || !BANK.items.length){
    $('i-n').textContent = '문제은행이 비어 있습니다 — 이 파일은 틀입니다.';
    return;
  }
  var rnd = rng(seedFrom(code));
  picked = pick(EXAM_COUNT, MX_PCT, rnd, EXAM_MIX);
  /* 보기 순서도 응시자마다 섞는다 — 같은 문항이라도 답 위치가 달라야 한다 */
  picked.list = picked.list.map(function(q){
    var idx = shuffle(q.opts.map(function(_, i){ return i; }), rnd);
    return { q:q.q, exp:q.exp, lv:q.lv, lg:q.lg, cat:q.cat,
             opts: idx.map(function(i){ return q.opts[i]; }),
             ans: idx.indexOf(q.ans) };
  });
  $('i-n').textContent = picked.list.length + '문항 (은행 ' + BANK.total + '문항에서 추첨)';
  $('i-t').textContent = EXAM_MIN + '분';
  $('i-c').textContent = 'CE ' + picked.gotCe + ' / MX ' + picked.gotMx +
    ' · 난이도 하 ' + (picked.gotLv['하']||0) + ' / 중 ' + (picked.gotLv['중']||0) +
    ' / 상 ' + (picked.gotLv['상']||0) + ' · 타사비교 ' + picked.gotLg;
  $('i-code').textContent = code;
}

$('emp').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g, '').slice(0, 8);
  var ok = this.value.length === 8;
  $('start').disabled = !ok;
  $('emperr').textContent = this.value.length && !ok ? '사번은 숫자 8자리입니다.' : '';
});
$('emp').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !$('start').disabled) start();
});
$('start').addEventListener('click', start);

function start(){
  if (!picked) return;
  startedAt = new Date();
  $('who').textContent = $('emp').value;
  $('intro').hidden = true; $('intro').style.display = 'none';
  $('prog').hidden = false;
  render();
  tick = setInterval(step, 1000);
  step();
}

/* ── 타이머 ── 0 이 되면 자동 제출한다(문서 요구) */
function step(){
  var m = Math.floor(left / 60), s = left % 60;
  var el = $('timer');
  el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  el.className = left <= 300 ? 'danger' : (left <= 600 ? 'warn' : '');
  if (left <= 0){ clearInterval(tick); submit(true); return; }
  left--;
}

/* ── 문항 ── 한 페이지 스크롤(페이지네이션 없음) */
function render(){
  var h = '';
  picked.list.forEach(function(q, i){
    h += '<div class="q" data-i="' + i + '" data-lv="' + esc(q.lv) + '"' +
         (q.lg ? ' data-lg="1"' : '') + '>' +
         '<div class="qh"><span class="qn">' + (i + 1) + '.</span><span>' + esc(q.q) + '</span></div>';
    q.opts.forEach(function(o, j){
      h += '<div class="opt" data-i="' + i + '" data-j="' + j + '">' +
           '<span class="no">' + NO[j] + '</span><span>' + esc(o) + '</span></div>';
    });
    h += '</div>';
  });
  h += '<button class="submit" id="sub" disabled>제출하기</button>';
  $('paper').innerHTML = h;
  $('sub').addEventListener('click', function(){ submit(false); });
  progress();
}

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('.opt') : null;
  if (!el || submitted) return;
  var i = el.getAttribute('data-i');
  [].forEach.call(document.querySelectorAll('.opt[data-i="' + i + '"]'),
    function(x){ x.classList.remove('sel'); });
  el.classList.add('sel');
  chosen[i] = +el.getAttribute('data-j');
  progress();
});

function progress(){
  var n = Object.keys(chosen).length, t = picked.list.length;
  $('progtxt').textContent = '답변 ' + n + ' / ' + t;
  $('progbar').style.width = (n / t * 100) + '%';
  var b = $('sub'); if (b) b.disabled = n < t;    /* 다 풀어야 제출된다 */
}

/* ── 채점 ── */
function submit(auto){
  if (submitted) return;
  submitted = true;
  clearInterval(tick);
  var correct = 0;
  picked.list.forEach(function(q, i){
    var mine = chosen[i];
    if (mine === q.ans) correct++;
    var box = document.querySelector('.q[data-i="' + i + '"]');
    [].forEach.call(box.querySelectorAll('.opt'), function(o){
      var j = +o.getAttribute('data-j');
      o.classList.remove('sel');
      if (j === q.ans) o.classList.add('right');
      else if (j === mine) o.classList.add('wrong');
    });
    /* 틀린 문항에만 해설을 붙인다 — 다 맞은 문항까지 펴면 결과가 안 읽힌다 */
    if (mine !== q.ans && q.exp){
      var d = document.createElement('div');
      d.className = 'exp';
      d.innerHTML = '<b>정답 ' + NO[q.ans] + '</b> · ' + esc(q.exp);
      box.appendChild(d);
    }
  });
  var total = picked.list.length, pctv = Math.round(correct / total * 100);
  var grade = pctv >= 90 ? '완벽합니다' : pctv >= 75 ? '우수합니다'
            : pctv >= 60 ? '양호합니다' : '더 노력이 필요합니다';
  var used = Math.max(0, Math.round((new Date() - startedAt) / 1000));
  var um = Math.floor(used / 60), us = used % 60;

  var r = document.createElement('div');
  r.className = 'result';
  r.id = 'result';
  r.innerHTML = '<div class="score">' + pctv + '점</div>' +
    '<div class="grade">' + grade + '</div>' +
    '<dl><dt>사번</dt><dd>' + esc($('emp').value) + '</dd>' +
    '<dt>정답</dt><dd>' + correct + ' / ' + total + '</dd>' +
    '<dt>소요 시간</dt><dd>' + um + '분 ' + us + '초' + (auto ? ' (시간 종료)' : '') + '</dd>' +
    '<dt>응시 일시</dt><dd>' + startedAt.toLocaleString('ko-KR') + '</dd>' +
    '<dt>시험지 코드</dt><dd>' + code + '</dd>' +
    (SCRIPT_URL ? '<dt>기록</dt><dd id="rec">…</dd>' : '') + '</dl>' +
    '<button class="again" id="again">다시 풀기</button>';
  $('paper').insertBefore(r, $('paper').firstChild);
  var sb = $('sub'); if (sb) sb.remove();
  $('again').addEventListener('click', function(){ location.reload(); });
  var h2 = document.createElement('h2');
  h2.className = 'sec'; h2.textContent = '문항별 결과';
  $('paper').insertBefore(h2, r.nextSibling);
  $('timer').textContent = '종료';
  $('timer').className = '';
  window.scrollTo(0, 0);

  /* 시트 기록 — 주소가 없으면 아무 데도 보내지 않는다(기본값) */
  if (SCRIPT_URL){
    box(box().concat([{
      empId: $('emp').value, score: pctv, correct: correct, total: total,
      code: code, startedAt: startedAt.toISOString(), elapsed: used
    }]));
    rec('보내는 중…');
    send();
  }
}

setup();
if (SCRIPT_URL) send();   /* 지난번에 못 보낸 것이 있으면 먼저 털어낸다 */
</script>
</body>
</html>
