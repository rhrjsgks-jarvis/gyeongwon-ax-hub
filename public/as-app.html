<title>AS기간 확인</title>
<style>

    font-weight:600;text-align:center;cursor:pointer;transition:.12s;color:#374151}

  .cat .ci{display:block;margin-bottom:4px;line-height:1}
  .cat .ci .psym{width:22px;height:22px;margin:0 auto}

    font-size:10.5px;font-weight:800;line-height:1.5}

  .rl.need{background:#E0F2FE;color:#0D1B7A}
  .rl.warn{background:#FEF3C7;color:#B45309}

  .ctg{font-size:11px;font-weight:800;color:#6b7280;margin:12px 0 5px;letter-spacing:.02em}
  .ctg:first-of-type{margin-top:4px}
  .ct{display:flex;align-items:center;gap:10px;justify-content:space-between;

  .ct-b b{font-size:12.5px;font-weight:700}
  .ct-d{font-size:11px;color:#6b7280;margin-top:1px}

  .ct.lg .ct-d{white-space:normal;word-break:keep-all;line-height:1.5;margin-top:3px}
  .ct-tag{font-size:10px;font-weight:700;color:#6b7280;background:#f1f3f6;
    border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}

function catIcon(k){ return (typeof prodSymbol === 'function' ? prodSymbol(k, '') : '') || ''; }

function renderCats(){
  document.getElementById('cats').innerHTML = keys.map(k=>
    `<div class="cat${k===cur?' on':''}" data-k="${esc(k)}"><span class="ci">${catIcon(k)}</span>${esc(k)}</div>`).join('');
  document.querySelectorAll('.cat').forEach(el=>el.onclick=()=>{ cur = el.dataset.k; renderCats(); renderBody(); revealBody(); });
}

  h += '<div class="card"><h2>핵심부품 무상기간</h2>';
  if (d.core && d.core.length) {
    h += d.core.map(([nm,yr,why])=>`<div class="row"><div class="n">${esc(nm)}
      <div class="d">${esc(why)}</div></div><div class="v">${esc(yr)}</div></div>`).join('');
  } else {
    h += '<div class="why">이 품목은 원문의 핵심부품 표에 없습니다 — 본체 무상보증기간을 따릅니다.</div>';
  }
  h += '</div>';

  h += '<div class="card' + (d.hold?'':' warn') + '"><h2>부품보유기간 <span class="pill">내용연수 동일</span></h2>';
  if (d.hold) h += `<div class="big">${d.hold}년</div><div class="why">원문 표기: <b>${esc(d.holdAs)}</b></div>`;
  else h += '<div class="unk">원문 표에 이 품목이 없습니다 — 고객센터 1588-3366 확인 필요</div>';
  h += '</div>';

  if (d.note) h += `<div class="card warn"><h2>⚠ 주의</h2><div class="why">${esc(d.note)}</div></div>`;

  h += `<div class="card"><h2>멤버십 ${esc(ROYAL.grade)} 혜택</h2>
    <div class="row"><div class="n">${esc(ROYAL.benefit)}</div></div>
    <div class="note">선정 조건: ${esc(ROYAL.cond)}<br>유지: ${esc(ROYAL.keep)}<br>
      <span class="unk">${esc(ROYAL.unknown)}</span></div></div>`;

  h += `<div class="card"><h2>보증 적용 기준 <span class="pill">전 품목 공통</span></h2>
    ${RULES.map(r=>`<div class="rule"><span class="rl ${r.c}">${esc(r.l)}</span><span class="rv">${esc(r.t)}</span></div>`).join('')}
    <div class="note">위 문구는 원문 그대로다. 유상수리 사유·출장비·교환환불 기준은 이 문서에 없어 싣지 않았다.</div></div>`;


  h += `<div class="src">출처 — 삼성전자서비스 <a href="${AS_SRC}" target="_blank" rel="noopener">보증기간 산정기준</a>
    · 삼성전자 <a href="${ROYAL.src}" target="_blank" rel="noopener">멤버십 등급별 혜택</a><br>
    2026-08-10 확인. 실제 적용은 구입 시점·제조일자에 따라 달라질 수 있으니 확정 안내 전 고객센터(1588-3366)로 확인하세요.</div>`;

  document.getElementById('body').innerHTML = h;

}


/* 고객에게 보낼 카드 — 지금 고른 품목의 보증 내용을 이미지 한 장으로 만든다.
 * 화면 그대로가 아니라 **상담에 필요한 것만** 담는다: 기간·근거·출처.
 * 확인 못 한 값은 카드에도 그대로 "확인 필요"로 나간다 — 화면과 다른 말을 하면 안 된다. */
function shareBuild(){
  const d = DB[cur]; if(!d) return null;
  const sec = [{ h:"무상보증기간", rows:[[d.base, "", "원문 구분: " + d.baseWhy + (d.baseNote ? " · " + d.baseNote : "")]] }];
  if((d.core||[]).length) sec.push({ h:"핵심부품 무상기간", rows:d.core.map(c=>[c[0], c[1], c[2]]) });
  sec.push({ h:"부품보유기간 (내용연수)", rows:[[ d.hold ? d.hold + "년" : "확인 필요", "",
    d.hold ? "원문 표기: " + d.holdAs : "원문 표에 이 품목이 없습니다 — 고객센터 1588-3366 확인 필요" ]] });
  if(d.note) sec.push({ h:"주의", rows:[[d.note, ""]] });
  return { app:"세일즈 코파일럿 · AS기간 확인", title:cur, subtitle:"", sections:sec,
    note:"출처 — 삼성전자서비스 보증기간 산정기준(2026-08-10 확인). 실제 적용은 구입 시점·제조일자에 따라 달라질 수 있으니 확정 안내 전 고객센터(1588-3366)로 확인하세요.",
    filename:"AS기간_" + cur.replace(/[\/:*?"<>|]/g,"") };
}

/*
 * 연락처는 **별도 탭**이다(2026-08-11 사용자 요청). AS 기간 결과 아래에 붙여 두면
 * 품목을 고른 뒤 한참 내려야 나오는데, 상담 중에 "어디로 전화하죠"는 품목과 무관하게
 * 아무 때나 나온다. 탭으로 빼면 한 번 눌러 바로 닿는다.
 */
function renderContacts(){
  const pane = document.getElementById('contactPane');
  let h = `<div class="sub">AS·구매 상담 연락처입니다. <b>번호를 누르면 걸기·복사를 고를 수 있습니다.</b></div>`;
  h += `<div class="card"><h2>연락처 모음 <span class="pill">눌러서 걸기·복사</span></h2>
    ${CONTACTS.map(g=>`<div class="ctg">${esc(g.g)}</div>
      ${g.items.map(c=>`<button type="button" class="ct" data-tel="${esc(c.n)}" data-tel-name="${esc(c.t)}">
        <span class="ct-b"><b>${esc(c.t)}</b><span class="ct-d">${esc(c.d)}</span></span>
        <span class="ct-n">${esc(c.n)}</span></button>`).join('')}`).join('')}
    </div>`;
  h += `<div class="card"><h2>물류센터 배송 · 설치 <span class="pill">21개 센터</span></h2>
    <div class="why" style="margin-bottom:9px">고객 댁 주소로 담당 센터를 찾습니다.
      <b>지역을 치면 그 센터만 남습니다</b> — 예: 수원, 안산, 강릉.</div>
    <input class="lgq" id="lgq" placeholder="지역 · 센터명 · 번호로 찾기" autocomplete="off">
    <div class="chips" id="lgchips">${CBRANCH.map((b,i)=>
      `<button type="button" class="chip${i?'':' on'}" data-br="${esc(b)}">${esc(b)}</button>`).join('')}</div>
    <div id="lglist"></div></div>`;
  /* 아직 못 채운 것은 **채운 것 아래**에 적는다. 물류센터 카드 위에 두면 바로 밑의
     채워진 표까지 "미등록"으로 읽힌다(2026-08-11 화면 확인에서 실제로 그렇게 보였다). */
  h += `<div class="card"><h2>아직 등록되지 않은 연락처</h2>
    <div class="unk">${CONTACTS_TODO.map(esc).join(' · ')}</div>
    <div class="why" style="margin-top:5px">공개 자료로 확인할 수 없는 내부 연락처라 지어내지 않았습니다.
      번호를 알려주시면 넣겠습니다.</div></div>`;
  h += `<div class="src">AS·구매 연락처 — 삼성전자서비스(samsungsvc.co.kr) · 삼성닷컴(samsung.com/sec) 공식 표기 · 2026-08-11 확인<br>
    물류센터 — 사내 배포본 '센터별 배송 서비스지역'(2026.1.02 시행) 원문 그대로</div>`;
  pane.innerHTML = h;

  const q = pane.querySelector('#lgq');
  q.addEventListener('input', renderCenters);
  pane.querySelectorAll('#lgchips .chip').forEach(el=>el.onclick=()=>{
    pane.querySelectorAll('#lgchips .chip').forEach(x=>x.classList.toggle('on', x===el));
    renderCenters();
  });
  renderCenters();
  if (typeof wireContacts === 'function') wireContacts(pane, '.ct');
}

/*
 * 물류센터 목록 — 검색·지사 필터를 걸어 다시 그린다.
 * 그릴 때마다 wireContacts 를 다시 부른다(이미 붙은 것은 `skWired` 로 걸러지므로 중복되지 않는다).
 * 검색은 관할 원문(`a`)까지 훑는다 — 원문에만 있는 읍·면(합평읍·엄다면)으로도 찾을 수 있어야 한다.
 */
function renderCenters(){
  const pane = document.getElementById('contactPane');
  const list = pane.querySelector('#lglist'); if (!list) return;
  const s = (pane.querySelector('#lgq').value || '').trim().toLowerCase();
  const onChip = pane.querySelector('#lgchips .chip.on');
  const br = onChip ? onChip.dataset.br : '전체';
  const hit = CENTERS.filter(c =>
    (br === '전체' || c.b === br) &&
    (!s || (c.t + c.code + c.n + c.a + c.kw.join(' ')).toLowerCase().includes(s)));

  /* 찾은 글자를 표시해 준다 — 왜 이 센터가 나왔는지 눈으로 확인돼야 신뢰가 된다 */
  const hl = t => { const e = esc(t); if (!s) return e;
    return e.replace(new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), m=>`<mark>${m}</mark>`); };

  list.innerHTML = hit.length ? hit.map(c=>
    `<button type="button" class="ct lg" data-tel="${esc(c.n)}" data-tel-name="${esc(c.t)}">
      <span class="ct-b"><b>${hl(c.t)}<span class="ct-tag">${esc(c.b)} · ${esc(c.code)}</span></b>
      <span class="ct-d">${hl(c.a)}</span></span>
      <span class="ct-n">${hl(c.n)}</span></button>`).join('')
    : `<div class="unk">해당하는 센터가 없습니다 — 지역명(시·군·구)으로 찾아보세요.</div>`;
  list.insertAdjacentHTML('beforeend', `<div class="cnt">${hit.length}개 센터</div>`);
  if (typeof wireContacts === 'function') wireContacts(list, '.ct');
}

/*
 * 품목을 고르면 결과로 데려간다(2026-08-11 사용자 지적).
 * 품목 타일이 26개라 결과가 화면 밖에 그려지는데, 그러면 눌러도 아무 일이 없어 보여
 * **클릭이 됐나 싶어 여러 번 누르게 된다.** 스크롤은 사용자가 할 일이 아니다.
 *
 * 첫 렌더에서는 부르지 않는다 — 열자마자 화면이 튀면 그게 더 어리둥절하다.
 * 가려지지 않도록 #body 에 scroll-margin-top 을 줘 sticky 탭 아래에 붙게 했다.
 */
function revealBody(){
  const el = document.getElementById('body');
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

let curTab = 'as';
function setTab(t){
  curTab = t;
  document.querySelectorAll('.mode-tab').forEach(el=>el.classList.toggle('on', el.dataset.tab === t));
  document.getElementById('asPane').style.display = t === 'as' ? '' : 'none';
  document.getElementById('contactPane').style.display = t === 'contact' ? '' : 'none';
  if (t === 'contact') renderContacts();
  /* 공유 카드는 AS 기간 내용이라 연락처 탭에서는 감춘다 — 엉뚱한 것이 나가면 안 된다 */
  const sb = document.getElementById('sk-share');
  if (sb) sb.style.display = t === 'as' ? '' : 'none';
}

renderCats(); renderBody();
/* 공유 버튼은 한 번만 붙인다 — 렌더 안에서 부르면 품목을 눌러야 생긴다 */
if (typeof mountShareButton === 'function') mountShareButton(shareBuild);
window.__as = { DB, ROYAL, CONTACTS, CENTERS, get cur(){ return cur; }, set cur(v){ cur=v; renderCats(); renderBody(); },
  get tab(){ return curTab; }, set tab(v){ setTab(v); } };
</script>
</body>
</html>
