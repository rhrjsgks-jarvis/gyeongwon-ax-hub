<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AS 관련 정보</title>
<link rel="stylesheet" href="/vendor/fonts/pretendard-variable.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/vendor/fonts/pretendard-variable.css"></noscript>
<style>
  *{box-sizing:border-box}
  /*
   * **한글은 어절 단위로 끊는다**(2026-08-13 사용자 지적 — "문맥이 이상합니다").
   * 브라우저 기본값은 글자 아무 데서나 끊어서 *"리폼이 먼저입/니다"* ·
   * *"AS · 수리 모/음"* 처럼 말이 반토막 난다. 좁은 칸(2열 타일·목록)에서 특히 심하다.
   * `keep-all` 은 어절을 안 쪼개고, 어절 하나가 칸보다 길 때만 `overflow-wrap` 이
   * 받아 준다 — 전화번호·모델코드가 칸을 뚫고 나가지 않게 하는 안전망이다.
   */
  body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#f6f7fb;color:#16181b;-webkit-text-size-adjust:100%;
    word-break:keep-all;overflow-wrap:break-word}
  /* 헤더는 다른 미니앱과 같은 남색 바다 — 앱을 넘겨 볼 때 머리가 같아야 한 제품으로 읽힌다 */
  .topbar{background:#1428A0;color:#fff;padding:14px 16px}
  .topbar-in{max-width:840px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .hd-ico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .hd-t{font-size:17px;font-weight:700;line-height:1.25}
  .hd-s{font-size:11.5px;color:#c7d2fe;margin-top:2px;line-height:1.4}
  .wrap{max-width:840px;margin:0 auto;padding:16px 14px 60px}
  /* 오른쪽 위 공유 버튼(share-kit)이 이 안내문 위에 떠서 첫 줄을 덮고 있었다(실측 확인).
     버튼 폭 + 여백만큼 자리를 비워 글자가 그 앞에서 접히게 한다. */
  .sub{font-size:12.5px;color:#6b7280;line-height:1.55;margin-bottom:14px;padding-right:82px}
  #contactPane .sub{padding-right:0}   /* 이 탭에서는 공유 버튼이 숨으므로 폭을 다 쓴다 */
  #body{scroll-margin-top:56px}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;margin-bottom:16px}
  .cat{border:1px solid #e5e7eb;background:#fff;border-radius:11px;padding:9px 6px;font-size:12.5px;
    font-weight:700;text-align:center;cursor:pointer;transition:.12s;color:#374151}
  /* 아이콘 크기는 AI구독 케어와 같은 값(22px)으로 맞춘다 — 앱을 넘겨 볼 때 같은 무게로 읽힌다 */
  .cat .ci{display:block;margin-bottom:4px;line-height:1}
  .cat .ci .psym{width:22px;height:22px;margin:0 auto}
  /* 보증 적용 기준 — 라벨로 갈라 적는다. 한 줄로 뭉치면 상담 중에 답을 다시 찾아야 한다
     (AI구독 케어의 조건 라벨과 같은 방식이다) */
  .rule{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid #f1f3f6}
  .rule:first-of-type{border-top:0}
  .rl{flex:0 0 auto;min-width:56px;text-align:center;border-radius:6px;padding:2px 6px;
    font-size:10.5px;font-weight:700;line-height:1.5}
  .rl.ok{background:#EEF2FF;color:#1428A0}
  .rl.need{background:#E0F2FE;color:#0D1B7A}
  .rl.warn{background:#FEF3C7;color:#B45309}
  .rv{font-size:12px;line-height:1.6;color:#374151;min-width:0}
  /* 연락처 — 누르면 걸기/복사를 고르는 시트가 뜬다(share-kit.js).
     바로 걸리게 두면 번호만 원할 때 곤란하고, PC 에서는 tel: 이 동작하지 않는다 */
  /* **탭 수가 곧 열 수다**(2026-08-27) — 2열로 박아 두었더니 탭이 셋이 되며 두 줄로 접혀
     '연락처·협력사' 가 아래로 밀렸다. 숫자를 박지 말고 자동으로 나눈다. */
  .mode-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#fff;
    border-bottom:1px solid #ecedf1;position:sticky;top:0;z-index:55}
  /* 셋이 되며 좁아졌다 — 폰(390px)에서 한 줄에 들어가게 글자와 여백을 줄인다(실측) */
  .mode-tab{padding:10px 2px 9px;text-align:center;cursor:pointer;font-size:10.5px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:#9aa0a6;border-bottom:2px solid transparent;transition:all .15s}
  .mode-tab.on{color:#1428A0;border-bottom-color:#1428A0}
  .mode-tab .mt-x{display:none}
  @media (min-width:720px){ .mode-tab{font-size:12px} .mode-tab .mt-x{display:inline} }
  .mt-ico{display:block;font-size:15px;margin-bottom:2px;line-height:1}
  .ctg{font-size:11px;font-weight:700;color:#6b7280;margin:12px 0 5px;letter-spacing:.02em}
  .ctg:first-of-type{margin-top:4px}
  .ct{display:flex;align-items:center;gap:10px;justify-content:space-between;
    padding:9px 11px;margin-bottom:5px;border:1px solid #e5e7eb;border-radius:10px;
    background:#fff;text-decoration:none;color:inherit;width:100%;font-family:inherit;
    text-align:left;cursor:pointer}
  .ct:active{background:#EEF2FF}
  .ct-b{display:flex;flex-direction:column;min-width:0}
  .ct-b b{font-size:12.5px;font-weight:700}
  .ct-d{font-size:11px;color:#6b7280;margin-top:1px}
  .ct-n{flex:0 0 auto;font-size:13px;font-weight:700;color:#1428A0;letter-spacing:-.01em}
  /* 번호 하나 = 누를 수 있는 조각. 한 줄에 번호가 여럿인 곳(상황실·운영·VOC·물류)에서
     대표번호 하나만 눌리던 것을 고쳤다 — 걸 수 없는 번호를 적어 두면 받아적게 된다 */
  button.telx{border:0;background:transparent;padding:1px 5px;margin:0 -5px;border-radius:6px;
    font-family:inherit;font-size:11.5px;font-weight:700;color:#1428A0;letter-spacing:-.01em;
    cursor:pointer;text-align:left;white-space:nowrap}
  button.telx:active{background:#EEF2FF}
  button.telx.big{font-size:13px}
  /* 라벨 칸을 고정해 번호를 세로로 세운다 — ' · ' 로 이어 붙이면 좁은 화면에서
     아무 데서나 줄이 바뀌어 어느 번호가 무엇인지 알 수 없다(사용자 지적) */
  .opsrow{display:flex;gap:6px;align-items:flex-start;margin-top:2px}
  .opsl{flex:0 0 42px;font-size:10.5px;font-weight:700;color:#9aa0a6;line-height:1.75;padding-top:1px}
  .opsv{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
  .opsv .nm{font-size:11px;color:#374151;font-weight:700;line-height:1.75}
  /* 물류센터는 관할 지역이 길어 여러 줄이 된다 — 번호를 위에 맞춰야 줄이 늘어도 흐트러지지 않는다 */
  .ct.lg{align-items:flex-start}
  .ct.lg .ct-d{white-space:normal;word-break:keep-all;line-height:1.5;margin-top:3px}
  /* 관할 — 시·도마다 한 줄. 라벨 폭을 고정해 시·도가 세로로 정렬돼 눈으로 훑인다 */
  .ar{display:block;margin-top:2px}
  .ar b{display:inline-block;min-width:30px;margin-right:5px;font-weight:700;color:#6b7280}
  .ar-x{display:block;margin-top:2px}
  .ct-tag{font-size:10px;font-weight:700;color:#6b7280;background:#f1f3f6;
    border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}
  /* 지역 검색 — 상담 중엔 "고객 댁이 수원인데"로 시작한다. 목록을 훑는 것이 아니라 쳐서 찾는다 */
  .lgq{width:100%;padding:11px 13px;border:1px solid #d7dae1;border-radius:10px;
    font-size:16px;font-family:inherit;background:#fff;margin-bottom:8px}
  .lgq:focus{outline:none;border-color:#1428A0}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .chip{padding:5px 11px;border:1px solid #e5e7eb;border-radius:99px;background:#fff;
    font-size:11.5px;font-weight:700;color:#6b7280;cursor:pointer;font-family:inherit}
  .chip.on{background:#EEF2FF;border-color:#1428A0;color:#1428A0;box-shadow:inset 0 0 0 1px #1428A0}   /* 고른 칸 = 파란 테두리(2026-10-23) */
  .cnt{font-size:11px;color:#9aa0a6;margin-top:8px}
  /*
   * AS센터 — **AS기간의 품목 칸과 같은 규격이다**(2026-08-27 사장님 지시:
   * *"작은 칸에 00센터 이런 식으로 약식으로 나오면 되고 그걸 클릭했을 때 상세정보가
   * 열리는 방식"*). 그리드·간격·모서리·선택색을 `.cats`/`.cat` 에서 그대로 가져온다 —
   * 두 탭에서 "고르는 자리"가 같은 모양이어야 앱을 넘겨 볼 때 눈이 헤매지 않는다.
   *
   * **아이콘은 넣지 않는다**(같은 지시: *"서비스센터 위치를 보는데 무슨 심벌을 사용하나요"*).
   * 품목은 그림으로 구분되지만 센터는 이름·지역으로 구분되므로 심벌이 뜻하는 바가 없다.
   */
  .svcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;margin-bottom:14px}
  .svcc{border:1px solid #e5e7eb;background:#fff;border-radius:11px;padding:9px 6px;
    font-family:inherit;text-align:center;cursor:pointer;transition:.12s;color:#374151;width:100%}
  .svcc:hover{border-color:#c7d2fe}
  /* **짧은 이름을 쓰지 말 것** — `.sn` 은 이 앱이 접수 순서의 **단계 번호 원**
     (19px 원 + 남색 배경)으로 이미 쓰고 있어, 그대로 두면 센터 이름이 그 원 안에 갇혀
     첫 글자만 보인다(실제로 그렇게 났다). 이름에 자기 자리를 박는다. */
  .svcc .svcc-n{display:block;font-size:12.5px;font-weight:700;line-height:1.35;word-break:keep-all}
  .svcc .svcc-g{display:block;font-size:10.5px;color:#9aa0a6;margin-top:3px}
  /* 가전 접수 여부는 칸에 남긴다 — 모바일 전용 센터로 TV 고객을 보내면 그대로 헛걸음이다 */
  .svcc .svcc-h{display:block;font-size:10px;font-weight:700;color:#1428A0;margin-top:2px}
  .svcc .svcc-h.m{color:#9aa0a6;font-weight:700}
  .svcc.on .svcc-g{color:#3B4A8C}
  /* **안내문에 규칙이 아예 없었다** — 그래서 본문 기본 글씨(16px 검정)로 떠 AS기간 탭의
     `.sub`(12.5px 회색)와 무게가 달랐다. 헛걸음을 막는 문장이라 지우지 않고, 옅은 파란
     상자로 눈에 남기되 글씨 크기는 이 앱의 안내 글씨에 맞춘다. */
  .notice{font-size:12px;line-height:1.55;color:#0D1B7A;background:#EEF2FF;
    border:1px solid #dbe2ff;border-radius:10px;padding:9px 11px;margin-bottom:10px;word-break:keep-all}
  mark{background:#FEF3C7;color:inherit;border-radius:3px;padding:0 1px}
  .cat:hover{border-color:#c7d2fe}
  /* **고른 칸은 파란 테두리다**(2026-10-23 사장님 지시 — *"버튼선택은 파란테두리형태로 방식통일"*).
     남색으로 칠하던 것을 옅은 파랑 바탕 + 삼성 블루 테두리로 바꿨다. 테두리 굵기를 바꾸면 칸이
     1px 밀리므로 안쪽 그림자로 두 겹을 만든다. 심벌은 파랑 그대로 둔다(바탕이 옅어 보인다). */
  .cat.on,.svcc.on{background:#EEF2FF;border-color:#1428A0;color:#1428A0;box-shadow:inset 0 0 0 1px #1428A0}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px 16px;margin-bottom:11px}
  .card h2{font-size:14px;font-weight:700;margin:0 0 3px;display:flex;align-items:center;gap:6px}
  .big{font-size:27px;font-weight:700;color:#1428A0;line-height:1.15;margin:4px 0 2px}
  .why{font-size:12px;color:#6b7280;line-height:1.5}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:9px 0;border-bottom:1px solid #f1f2f4}
  .row:last-child{border-bottom:0}
  .row .n{font-size:13px;font-weight:700;flex:1}
  .row .v{font-size:14px;font-weight:700;color:#1428A0;white-space:nowrap}
  .row .d{font-size:11.5px;color:#6b7280;line-height:1.5;margin-top:2px;font-weight:400}
  .warn{background:#FFFBEB;border-color:#FDE68A}
  .warn h2{color:#B45309}
  .unk{font-size:12.5px;color:#B45309;font-weight:700}
  .note{font-size:11.5px;color:#6b7280;line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px dashed #e5e7eb}
  .src{font-size:11px;color:#9aa0a6;line-height:1.6;margin-top:14px}
  .src a{color:#1428A0}
  /* 지도 링크 — `.pill` 과 같은 알약 모양이되 남색 글자로 눌리는 것임을 밝힌다.
     주소 줄 안에 들어가므로 `white-space:nowrap` 으로 두 줄로 접히지 않게 한다. */
  .maplink{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;
    color:#1428A0;background:#EEF2FF;border-radius:99px;padding:2px 8px;margin-top:3px;
    text-decoration:none;white-space:nowrap;line-height:1.5}
  .maplink:hover{background:#E0E7FF}
  /* 지도 링크 둘을 나란히 — `.opsv` 가 세로 플렉스라 감싸지 않으면 위아래로 쌓인다 */
  .maplinks{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
  .maplinks .maplink{margin-top:0}
  /* 「어디로 가면 되나」 경로 — 하만은 접수처와 수리센터가 갈려 있어 경로가 셋이다.
     이름이 짧지만 `.way`·`.wn` 은 이 파일에 **0건**임을 확인하고 붙였다(`.sn` 이 접수
     순서 원과 겹쳐 센터 이름이 원에 갇혔던 사고가 있어 새 클래스는 반드시 세어 본다). */
  .ways{display:flex;flex-direction:column;gap:5px;margin-top:9px}
  .way{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.5;
    padding:7px 9px;border-radius:9px;background:#F9FAFB;border:1px solid #f1f2f4}
  .way.hot{background:#EEF2FF;border-color:#c7d2fe}
  .way .wn{flex:0 0 auto;width:17px;height:17px;border-radius:99px;background:#e5e7eb;
    color:#6b7280;font-size:10px;font-weight:700;display:flex;align-items:center;
    justify-content:center;margin-top:1px}
  .way.hot .wn{background:#1428A0;color:#fff}
  .way b{font-weight:700;color:#111827}
  .way.hot b{color:#1428A0}
  .way i{font-style:normal;color:#6b7280;display:block;margin-top:1px;word-break:keep-all}
  .wsub{font-size:10.5px;color:#9aa0a6;line-height:1.5;margin-top:2px;word-break:keep-all}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
    background:#EEF2FF;color:#1428A0;margin-left:5px;vertical-align:2px}
  .pill.ok{background:#ECFDF5;color:#047857}
  .pill.no{background:#FEF2F2;color:#B42318}
  @media(max-width:520px){.cats{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
    .big{font-size:24px}}

  /* 상단 통합 검색 — 남색 바 바로 아래에 붙여 앱을 열자마자 보이게 한다.
     탭보다 위에 두는 이유는, 찾는 것이 어느 탭에 있는지 상담사가 알 이유가 없기 때문이다. */
  .sbar{background:#1428A0;padding:0 16px 12px}
  .sbar-in{max-width:840px;margin:0 auto;position:relative}
  .sq{width:100%;padding:11px 34px 11px 13px;border:0;border-radius:10px;
    font-size:16px;font-family:inherit;background:#fff;color:#16181b}
  .sq:focus{outline:2px solid #93c5fd;outline-offset:1px}
  .sx{position:absolute;right:6px;top:6px;width:26px;height:26px;border:0;border-radius:99px;
    background:#eef0f4;color:#6b7280;font-size:12px;cursor:pointer;font-family:inherit;line-height:1}
  /* 결과는 도면 위 막대와 같은 생각이다 — 화면을 가리지 않게 검색창 바로 아래에 겹쳐 띄운다 */
  .sres{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;
    border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 12px 28px rgba(16,24,40,.16);
    max-height:min(58vh,420px);overflow:auto;z-index:200;padding:5px}
  /* 공유 버튼(share-kit)이 오른쪽 위에 떠 있어 결과 줄을 덮었다 — 결과가 위로 와야 한다 */
  .sres-open #sk-share{visibility:hidden}
  .sr{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-radius:9px;
    background:transparent;text-align:left;cursor:pointer;font-family:inherit}
  .sr:hover,.sr:focus{background:#EEF2FF;outline:none}
  .sr-k{flex:0 0 auto;font-size:10px;font-weight:700;color:#1428A0;background:#EEF2FF;
    border-radius:5px;padding:2px 6px}
  .sr-b{min-width:0;flex:1}
  .sr-b b{display:block;font-size:12.5px;font-weight:700}
  .sr-b span{display:block;font-size:11px;color:#6b7280;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sr-none{padding:14px 10px;font-size:12px;color:#6b7280;text-align:center}
  /* 뺀 말을 밝히는 줄 — 조용히 빼면 왜 이 결과인지 알 수 없다 */
  .sr-note{padding:8px 10px;font-size:11.5px;color:#B45309;background:#FFFBEB;
    border-bottom:1px solid #FDE68A;line-height:1.45}

  /* 이전설치·빌트인 — 협력사 한 곳이 여러 센터를 맡아 관할이 길다. 물류센터 카드와 같은 모양 */
  /* 연락처는 세 묶음으로 접어 둔다 — 다 펼쳐 두면 목록이 예순 줄이라 상담 중에 못 읽는다.
     찾는 것은 위 검색창이 하므로, 여기서는 눌러 펼치는 것으로 충분하다. */
  .grp{background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:11px;overflow:hidden}
  .grp>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:9px;
    font-size:14px;font-weight:700}
  .grp>summary::-webkit-details-marker{display:none}
  .grp>summary .gi{font-size:17px;line-height:1;flex:0 0 auto}
  /*
   * **묶음은 2열로 늘어놓는다**(2026-08-13 사용자 요청). 아홉 개를 세로로 쌓으면
   * 한 화면에 안 들어와 *무엇이 있는지* 훑을 수가 없다 — 찾는 것이 정해져 있으면
   * 위 검색창을 쓰면 되고, 이 목록은 "어디에 무엇이 있나"를 보여주는 것이 일이다.
   * **펼친 것만 전폭을 쓴다**(`grid-column:1/-1`) — 안 그러면 열린 내용이 반쪽 폭에 눌린다.
   */
  .grps{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
  .grps>.grp{margin-bottom:0}
  .grps>.grp[open]{grid-column:1/-1}
  .grps>.grp>summary{padding:11px 12px;gap:7px;font-size:12.5px}
  /* 아이콘이 컸다 — 2열에서는 글자를 밀어낸다. 담는 자리와 무관하게 못 박는다 */
  .grps>.grp>summary .gi svg.psym{width:16px;height:16px}
  /* 접혀 있을 때 부제는 감춘다. 2열에 세 줄이 들어가면 타일이 도로 길어진다 */
  .grps>.grp:not([open])>summary .gt span{display:none}
  .grps>.grp>summary .gc{padding:1px 6px;font-size:10px}
  .grps>.grp>summary .gv{font-size:10px;margin-left:-2px}
  /*
   * **한글은 어절 단위로 끊는다.** 기본값은 글자 아무 데서나 끊어서 좁은 칸에서
   * "AS · 수리 모/음" · "시스템에어/컨 천장형" 처럼 읽히지 않는 줄바꿈이 났다.
   */
  .grps>.grp>summary .gt b{word-break:keep-all;line-height:1.32}
  /* 아주 좁은 기기에서는 두 열이 글자를 자른다 — 한 열로 돌아간다 */
  @media (max-width:359px){ .grps{grid-template-columns:1fr} }
  /* 제목과 부제는 줄을 나눈다 — 한 줄로 붙으면 "AS·수리 모음AS 접수…" 로 읽힌다 */
  .grp>summary .gt{min-width:0;flex:1}
  .grp>summary .gt b{display:block;font-weight:700}
  .grp>summary .gt span{display:block;font-size:11px;font-weight:400;color:#6b7280;margin-top:2px}
  .grp>summary .gc{flex:0 0 auto;font-size:11px;font-weight:700;color:#6b7280;white-space:nowrap;
    background:#f1f3f6;border-radius:99px;padding:2px 9px}
  .grp>summary .gv{font-size:13px;color:#9aa0a6;transition:transform .15s}

  .grp[open]>summary{border-bottom:1px solid #f1f2f4}
  .grp-b{padding:13px 16px 16px}
  .grp-b .card{border:0;padding:0;margin:0 0 14px;border-radius:0}

  .pt{font-size:12.5px;font-weight:700;color:#1428A0}
  /* 원문에 따로 적힌 번호(물류전화 등) — 대표번호와 헷갈리지 않게 한 단 작게 적는다 */

     (2026-08-11 사용자 지적). 좁은 화면 값은 그대로 두고 넓은 화면에서만 늘린다. */

/* ── 수리비 탭 ── (2026-10-21: 이 규칙들이 @media print 안에 들어가 있어 화면에서는 하나도 안 먹었다 — 표·칩·목록이 맨 글자로 겹쳐 보였다) */

  .fee-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#E5E7EB;border-radius:11px;padding:3px;margin-bottom:9px}

/* ── 인쇄 (A4) — 공유 버튼 → 「인쇄」. 머리·꼬리는 share-kit 이 붙인다 ──
   고르는 손잡이(검색·탭·품목 칸·지역 칩)는 빼고 **고른 결과만** 싣는다.
   센터는 하나를 골랐으면 그 센터만, 연락처는 **펼쳐 둔 묶음만** 싣는다(다 실으면 10쪽이 넘는다). */
/*
 * ── 태블릿 화면 (2026-10-23 사장님 지시 — *"삼성스토어 요금계산기 참고해서 태블릿용 UX로"*) ──
 *
 * 요금계산기가 720px 부터 쓰는 방식을 따른다 — 번호 붙은 칸(①②)과 여러 단.
 * 폰(719px 이하)은 지금 그대로다 — 매장 기기가 폰인 경우도 있다.
 *
 *   · **고르는 것은 왼쪽, 결과는 오른쪽**(AS기간 · 수리비). 위아래로 쌓으면 품목 35칸이
 *     화면 절반을 먹어 결과를 보려면 내려야 하고, 다른 품목을 고르려면 다시 올라와야 했다.
 *   · **센터 상세 · 연락처 묶음은 팝업**이다. 하나를 골라 자세히 보고 닫고 돌아오는 정보라
 *     목록 아래에 펼치면 목록에서 멀어진다(센터 목록 44곳 아래로 상세가 내려갔다).
 */
@media screen and (min-width:720px){

     탭마다 따로 서던 메뉴(AS기간 · 수리비 · 케어플러스)와 위쪽 탭 줄(56px)을 없앤다. 폰은 탭 그대로 */

  /* ☰ 로 접힘(2026-10-24 사장님 승인 시안) — 메뉴는 서랍(share-kit.js AxNav), 내용이 폭을 다 쓴다 */
  html.ax-navc .wrap{grid-template-columns:minmax(0,1fr)}

    width:min(760px,calc(100vw - 48px));max-height:calc(100vh - 80px);overflow:auto;margin:0;

  body.grp-pop .grps>details.grp[open]>summary{position:sticky;top:0;background:#fff;z-index:1;border-bottom:1px solid #eef0f4}
  .pop-x{position:fixed;z-index:92;width:40px;height:40px;border-radius:99px;border:1.5px solid #1428A0;
    background:#fff;color:#1428A0;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
}

/* 원문에 따로 적힌 번호(물류전화·후드 등)를 라벨과 함께 한 줄로 붙인다.
 * 번호만 나열하면 어디로 걸어야 하는지 모른다 — 라벨이 곧 용도다. */
function xtext(o){ return (o.x||[]).map(([l,n])=>`${l} ${n}`).join(' '); }

/*
 * 번호 하나 = 누를 수 있는 조각(걸기·복사 시트가 뜬다).
 *
 * 예전에는 줄의 **대표번호 하나만** 눌렸다 — 서서울TC 처럼 번호가 셋인 곳에서 나머지 둘은
 * 눈으로 읽고 받아적어야 했다(2026-08-11 사용자 지적). 화면에 적힌 번호는 전부 눌려야 한다.
 *
 * **거는 번호는 범위 꼬리를 뗀다.** `031-922-8546~7` 을 그대로 넘기면 숫자만 남겨
 * `03192285467` 로 잘못 걸린다. 화면에는 원문 그대로 적고 거는 것만 앞 번호로 한다.
 */
function telx(n, name, h, big, dialOverride){
  const dial = dialOverride || String(n).replace(/[~∼]\s*\d+$/, '').trim();
  return `<button type="button" class="telx${big ? ' big' : ''}" data-tel="${esc(dial)}"`
    + ` data-tel-name="${esc(name)}">${(h || esc)(n)}</button>`;
}
/*
 * 한 칸에 번호가 둘 이상 적힌 값을 조각낸다 — `031-377-9136 · 9137` 을 통째로 넘기면
 * 걸 수 없는 tel 값이 된다. **뒷자리만 적힌 번호는 앞 번호의 국번을 물려받는다**
 * (원문이 `031-377-9135~7` 이므로 9136·9137 이 실제 번호다).
 */
function telsplit(v, name, h, big){
  const parts = String(v).split(/\s*[·,]\s*/).map(x=>x.trim()).filter(Boolean);
  let head = '';
  return parts.map(raw => {
    const m = raw.match(/^(\d{2,3}-\d{3,4})-\d{4}/);
    if (m) head = m[1];
    const full = /^\d{4}$/.test(raw) && head ? `${head}-${raw}` : null;
    return telx(raw, name, h, big, full);
  }).join('');
}

/*
 * 안내문에 박힌 번호도 눌리게 한다 — "화면에 보이는 번호는 전부 눌린다"는 규칙은
 * 목록이든 안내문이든 같다. 우리 저장소의 우리 문구라 정규식 치환이 안전하다.
 * 이름은 아는 번호면 그 담당을 쓰고, 모르면 문맥 이름을 쓴다.
 */
function telNameOf(n){
  for (const g of CONTACTS) for (const c of g.items) if (c.n === n) return c.t;
  for (const x of SINK) { if (x.n === n) return `${x.p} 싱크장 리폼`; if (x.n2 === n) return `${x.p} 이전설치 문의`; }
  for (const x of B2B_NATION) if (x.n === n) return `${x.t} — ${x.p}`;
  return null;
}
function telify(html, fallback){
  return String(html).replace(/<b>(1[5-9]\d{2}-\d{4}|0\d{1,2}-\d{3,4}-\d{4})<\/b>/g,
    (_, n) => telx(n, telNameOf(n) || fallback || '연락처'));
}

/* 라벨 칸 + 번호를 세로로 — ' · ' 로 이어 붙이면 좁은 화면에서 아무 데서나 줄이 바뀐다 */
/*
 * 지도 링크 — **카카오맵 · 구글맵 둘 다** (2026-08-27 사장님 결정).
 *
 * 매장마다·고객마다 쓰는 지도가 달라 하나만 두면 절반은 주소를 손으로 옮겨 적는다.
 * **둘 다 좌표로 간다** — 그래야 두 링크가 같은 지점을 가리킨다.
 *
 *   · 카카오 `map.kakao.com/link/map/{이름},{위도},{경도}` — 실물로 눌러 확인했다
 *     (이름표가 붙은 핀 + 「길찾기」, 프로덕션에서도 확인).
 *   · 구글  `google.com/maps/search/?api=1&query={위도},{경도}` — 실물로 눌러 확인했다
 *     (좌표 정확히 반영 · 「경로」 버튼 · 지도 데이터는 TMap Mobility).
 *     형식은 구글 공식 **Maps URLs** 스펙이라 흔들릴 걱정이 적다.
 *   · 좌표가 없으면 카카오는 주소 검색(`?q=`), 구글은 같은 `query=` 에 주소를 넣는다.
 *
 * **구글맵 핀에는 이름표가 안 붙는다** — 제목이 `37°15'59.3"N 127°03'34.0"E` 로 뜬다.
 * `?api=1&query={좌표}` 에 이름 자리가 없어서다. 그래서 **버튼 글자로 어느 지도인지
 * 밝히고**, 이름이 필요한 안내(「삼성테크노파크로 찾으세요」)는 화면 글로 따로 적는다.
 *
 * **네이버지도는 넣지 못했다 — 되살리기 전에 이 문단을 읽을 것**(2026-08-27 실측).
 * 세 갈래를 전부 두드렸고 셋 다 막혔다:
 *
 *   ① 공식 URL Scheme 문서는 **`nmap://` 모바일 앱 전용**이다 — PC 에서는 아무 일도
 *      안 일어나고 앱이 없는 폰에서도 마찬가지다. 매장 기기가 PC 인 곳이 있다.
 *   ② 네이버 클라우드 **공식 포럼의 네이버 측 답변**(2024-04-01)이 안내하는
 *      `map.naver.com/?lng=&lat=&title=` 는 **지금은 동작하지 않는다.** 눌러 보니
 *      `map.naver.com/p?c=15.00,0,0,0,dh` 로 리다이렉트되며 **좌표가 통째로 사라졌다**
 *      (정상은 `c={x},{y},{줌},0,0,0,dh` 7개 필드인데 앞 두 자리가 빠진다).
 *   ③ `c=` 는 **WGS84 위경도가 아니라 네이버 자체 투영좌표(x,y)** 를 받는다 —
 *      우리가 가진 위경도로는 만들 수 없고 변환식을 검증할 방법도 없다.
 *
 * **그리고 더 확인할 수 없다** — `map.naver.com/robots.txt` 가
 * `User-agent: ClaudeBot → Disallow: /` 이고(`*` 그룹도 `/$`·`/p/$` 만 허용),
 * 브라우저 도구에서도 그 도메인이 막힌다. 남은 후보(`/p/search/{검색어}`)는
 * **사람이 직접 눌러 봐야** 확인된다.
 *
 * **robots 가 링크 자체를 막는 것은 아니다** — 그것은 자동 수집을 규율하고, 화면의
 * 링크는 상담사가 손으로 누르면 그 사람의 브라우저가 여는 것이다. 걸림돌은 "걸어도
 * 되는가"가 아니라 **"우리가 동작을 확인할 수 없다"** 쪽이다.
 *
 * 확인되지 않은 링크를 화면에 두지 않는 이유는 늘 같다 — 안 열리면 상담이 그 자리에서
 * 막히고 **화면에는 아무 표시도 안 난다.** `test-as [15]` 의 `UNVERIFIED` 가 그 경계를 지킨다.
 */
function mapLink(name, la, ln, addr){
  var out = [];
  if (la != null && ln != null){
    out.push(['카카오맵', 'https://map.kakao.com/link/map/'
      + encodeURIComponent(name) + ',' + la + ',' + ln]);
    out.push(['구글맵', 'https://www.google.com/maps/search/?api=1&query='
      + encodeURIComponent(la + ',' + ln)]);
  } else {
    out.push(['카카오맵', 'https://map.kakao.com/?q=' + encodeURIComponent(addr || name)]);
    out.push(['구글맵', 'https://www.google.com/maps/search/?api=1&query='
      + encodeURIComponent(addr || name)]);
  }
  var inner = out.map(function(x){
    return '<a class="maplink" href="' + esc(x[1]) + '" target="_blank" rel="noopener">'
      + esc(x[0]) + '</a>';
  }).join('');
  return '<span class="maplinks">' + inner + '</span>';
}
/*
 * 「어디로 가면 되나」 — `HARMAN.ways` 를 번호 붙은 줄로 그린다.
 *
 * **비어 있으면 아무것도 그리지 않는다.** 경로를 정하지 못한 채 빈 상자를 띄우면
 * 상담사가 *"여기 뭐가 있어야 하는데"* 로 읽는다. 그동안은 바로 위 경고 카드
 * (「삼성전자서비스는 접수만 받습니다」)가 같은 일을 한다.
 *
 * `hot` 은 **하나만** 붙인다 — 둘 이상이면 강조가 강조가 아니게 된다.
 */
function harmanWays(){
  var w = HARMAN.ways || [];
  if (!w.length) return '';
  return '<div class="ways">' + w.map(function(x, i){
    return '<div class="way' + (x.hot ? ' hot' : '') + '">'
      + '<span class="wn">' + (i + 1) + '</span>'
      + '<span><b>' + esc(x.t) + '</b><i>' + esc(x.d) + '</i></span></div>';
  }).join('') + '</div>';
}
function opsRow(label, inner){
  return `<div class="opsrow"><span class="opsl">${esc(label)}</span><span class="opsv">${inner}</span></div>`;
}
function xline(o, name, hl){
  if (!(o.x||[]).length) return '';

  return (o.x||[]).map(([l,n]) =>
    opsRow(l || '번호', telx(n, `${who}${l ? ' ' + l : ''}`.trim(), hl))).join('');

/*
 * 센터 줄에 붙는 상황실·운영·VOC 한 줄. 상황실 번호는 **물류 대표번호와 다를 때만** 적는다 —
 * 21곳 중 19곳이 같아서, 같은 번호를 한 줄에 두 번 적으면 어느 쪽으로 걸어야 하는지 헷갈린다.
 */
/*
 * 관할을 **시·도마다 줄을 내려** 보여준다(2026-08-13 사용자 요청 — "내려쓰기가 이상합니다").
 *
 * 원문은 `서울 : 강서구, … 송파구  경기 : 고양시, …` 처럼 한 덩어리라, 그대로 흘리면
 * *"…송파구 경기 : 고양시…"* 로 **시·도 구분이 문장 중간에 묻힌다.** 상담사는 고객 주소의
 * 시·도부터 찾는데 그 머리가 안 보인다.
 *
 * **원문(`a`)은 손대지 않는다** — 관할이 틀리면 배송이 통째로 어긋나므로 요약하지도
 * 다듬지도 않는다는 것이 이 자료의 규칙이다. 여기서는 **표시할 때만** 나눈다.
 * 시·도가 하나뿐이면 그냥 한 줄로 둔다 — 굳이 라벨을 세울 이유가 없다.
 */
const SIDO_RE = /(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)\s*:/g;
function areaLines(text, mark){
  const t = String(text == null ? '' : text);
  const m = (mark || esc);
  const at = [];
  SIDO_RE.lastIndex = 0;
  let x; while ((x = SIDO_RE.exec(t))) at.push([x.index, x[1]]);
  if (at.length < 2) return m(t);
  let out = '';
  const head = t.slice(0, at[0][0]).trim();
  if (head) out += `<span class="ar-x">${m(head)}</span>`;
  for (let i = 0; i < at.length; i++){
    const seg = t.slice(at[i][0], i + 1 < at.length ? at[i + 1][0] : t.length).trim();
    out += `<span class="ar"><b>${m(at[i][1])}</b>${m(seg.replace(/^[^:]*:\s*/, ''))}</span>`;
  }
  return out;
}

function opsLine(c, hl){
  const o = OPS[c.code]; if (!o) return '';
  const h = hl || esc;
  let s = opsRow('상황실', `<span class="nm">${h(o.sit)}</span>`
    + (o.sitN ? telx(o.sitN, `${c.t} 상황실`, h) : ''));
  if ((o.op||[]).length)  s += opsRow('운영', o.op.map(n=>telx(n, `${c.t} 운영`, h)).join(''));
  if ((o.voc||[]).length) s += opsRow('VOC',  o.voc.map(n=>telx(n, `${c.t} VOC`, h)).join(''));
  return s + (o.note ? `<div class="xn" style="color:#B45309">${esc(o.note)}</div>` : '');
}
/* 검색은 상황실·운영·VOC 번호까지 훑는다 — 번호를 보고 어느 센터인지 되짚는 일이 실제로 있다 */
function opsText(c){
  const o = OPS[c.code]; if (!o) return '';
  return [o.job, o.sit, o.sitN, ...(o.op||[]), ...(o.voc||[]), o.note].filter(Boolean).join(' ');
}

       <span class="ct-n">${telx(x.n, `${x.p} 싱크장 리폼`, null, true)}</span></div>`).join('')}`)
    /* 인덕션 · 정수기 · 후드 — 담당은 같지만 번호가 갈리고, 상담사는 품목으로 찾는다 */
    + ['ind', 'wat', 'hood'].map(key => mvp(key, `<div class="card">${natCard(nat(key))}</div>${midTable(key)}`)).join('')
    + mvp('sac', `<div class="why" style="margin-bottom:9px">천장형 <b>이전설치 문의를 받으면 이 번호를 안내</b>해야 합니다.</div>
     <div class="card">${natCard(nat('sac'))}</div>`));

  /* ⑧-2 신규 설치 협력사 — 설치비용 앱(install-cost.json)의 「어디로 접수하나」 연락처 절을 그대로 읽는다 */
  h += grp(g['g-new'],
    `<div class="why" style="margin-bottom:9px"><b>새로 산 제품</b>을 다는 곳입니다. 쓰던 제품을 옮기는 것은 위 「이전설치」 묶음입니다 —

  /* ⑨ B2B IT — "이게 뭔지 모르겠다"는 말을 들었으므로 무엇인지부터 적는다 */
  h += grp(g['g-it'],
    `<div class="why" style="margin-bottom:9px"><b>노트북 · 모니터 · 프린터 등 IT 제품</b>의
       B2B 이전설치 관할입니다. <b>가전과 담당 협력사가 다릅니다</b> — 같은 안동이라도
       가전은 성광티시엠, IT 는 다존텍입니다.</div>
     <input class="lgq" id="itq" placeholder="지역 · 협력사 · 센터명으로 찾기" autocomplete="off">
     <div id="itlist"></div>`);

  h += '</div>';   /* .grps 닫기 */

  h += `<div class="src">AS·구매 연락처 — 삼성전자서비스(samsungsvc.co.kr) · 삼성닷컴(samsung.com/sec) 공식 표기 · 2026-08-11 확인<br>
    물류센터 — 사내 배포본 '센터별 배송 서비스지역'(2026.1.02 시행) 원문 그대로<br>
    상황실·운영·VOC — 사내 배포본 'B2B 이전설치 센터 권역현황·연락처'(2025.02)의 운영업무 협조(B2C)·VOC 연락처(B2C) 표<br>
    하만 오디오 — 하만 오디오 전문 서비스센터(harmansvc.co.kr) 공식 안내 · 2026-08-27 확인<br>
    이전설치·리폼·중앙에너지·IT — 같은 배포본 원문 그대로.
    협력사명 · 관할지역 · 전화번호만 옮겼습니다 — 담당자 이름·이메일과 010 번호는 싣지 않습니다.</div>`;
  pane.innerHTML = h;

  const wire = (id, fn) => { const el = pane.querySelector(id); if (el) el.addEventListener('input', fn); };
  wire('#lgq', renderCenters);

  pane.querySelectorAll('[data-mid]').forEach(el =>

  pane.querySelectorAll('#mvchips .chip').forEach(el => el.onclick = () => setMv(el.dataset.mvk));
  pane.querySelectorAll('#lgchips .chip').forEach(el=>el.onclick=()=>{

  fillNewInst();
  if (typeof wireContacts === 'function') wireContacts(pane, '[data-tel]');

  /*
   * **누르면 그 내용으로 데려간다**(2026-08-13 사용자 요청 — 인터페이스 통일감).
   * `<details>` 는 제자리에서 펼쳐질 뿐이라, 아래쪽 묶음을 누르면 펼쳐진 내용이
   * 화면 밖에 남아 **아무 일도 안 일어난 것처럼 보인다**. 상단 검색에서 온 경우
   * `openGroup()` 이 이미 하던 일을, 손으로 누를 때도 똑같이 한다 —
   * 같은 동작이 경로에 따라 달라지면 안 된다.

  pane.querySelectorAll('details.grp').forEach((d) => {

/* 이전설치 · 리폼 묶음 안의 품목 칸 — 칸 이름은 여기 한 곳 */
const MV_TABS = [['mv', '빌트인 가전'], ['ind', '인덕션'], ['wat', '정수기'], ['hood', '후드'], ['sac', '시스템에어컨'], ['sink', '식기세척기 싱크장 리폼']];
/* 합치기 전 묶음 id → 합친 묶음의 칸. 옛 링크(?grp=g-ind)와 상단 검색이 그대로 그 자리로 간다 */
const MV_OLD = { 'g-sink':'sink', 'g-ind':'ind', 'g-wat':'wat', 'g-hood':'hood', 'g-sac':'sac' };
let mvKey = 'mv';
function setMv(k){

function openGroup(id){

/*
 * 물류센터 목록 — 검색·지사 필터를 걸어 다시 그린다.
 * 그릴 때마다 wireContacts 를 다시 부른다(이미 붙은 것은 `skWired` 로 걸러지므로 중복되지 않는다).
 * 검색은 관할 원문(`a`)까지 훑는다 — 원문에만 있는 읍·면(합평읍·엄다면)으로도 찾을 수 있어야 한다.

function renderCenters(){
  const pane = document.getElementById('contactPane');
  const list = pane.querySelector('#lglist'); if (!list) return;
  const s = (pane.querySelector('#lgq').value || '').trim().toLowerCase();
  const onChip = pane.querySelector('#lgchips .chip.on');
  const br = onChip ? onChip.dataset.br : '전체';
  const hit = CENTERS.filter(c =>
    (br === '전체' || c.b === br) &&
    (!s || (c.t + c.code + c.n + c.a + c.kw.join(' ') + opsText(c)).toLowerCase().includes(s)));

  /* 찾은 글자를 표시해 준다 — 왜 이 센터가 나왔는지 눈으로 확인돼야 신뢰가 된다 */
  const hl = hlOf(s);

  list.innerHTML = hit.length ? hit.map(c=>
    `<div class="ct lg">
      <span class="ct-b"><b>${hl(c.t)}<span class="ct-tag">${esc(c.b)} · ${esc(c.code)}</span>${
        OPS[c.code] ? `<span class="ct-tag">${esc(OPS[c.code].job)}</span>` : ''}</b>
      <span class="ct-d">${areaLines(c.a, hl)}${opsLine(c, hl)}</span></span>
      <span class="ct-n">${telx(c.n, c.t, hl, true)}</span></div>`).join('')
    : `<div class="unk">해당하는 센터가 없습니다 — 지역명(시·군·구)으로 찾아보세요.</div>`;
  list.insertAdjacentHTML('beforeend', `<div class="cnt">${hit.length}개 센터</div>`);
  if (typeof wireContacts === 'function') wireContacts(list, '[data-tel]');
}

/* ─────────────────────────────────────────────────────────────────────────
 * AS센터 위치찾기 (2026-08-27 사장님 요청)
 *
 * *"세일즈코파일럿 내 AS 관련 부분에 전국에 있는 고객센터 위치정보를 넣을 수 있습니까?"*
 * *"고객센터 위치와 고객센터 유형(가전 AS 도 함께하는지 등)"*
 * *"연락처·협력사 오른쪽 탭"* → *"AS센터 위치찾기를 중앙에 만들어 주시는 게 나을 것 같습니다."*
 *
 * 자료는 `public/svc-centers.json`(`npm run build:svc` 가 만든다). **178곳.**
 *
 * **화면이 반드시 밝혀야 하는 것 둘** — 안 적으면 상담사가 헛걸음을 시킨다:
 *   ① **대형 가전은 센터 방문이 아니라 출장 수리다.** 센터 「수리 제품 선택」 목록에
 *      냉장고·세탁기·에어컨이 아예 없다(실측). 받는 가전은 소형가전이다.
 *   ② **178곳 중 66곳은 모바일만 받는다.** 스마트폰·태블릿·웨어러블 셋뿐이다.
 *      그 주소를 TV 고객에게 알려주면 그대로 헛걸음이다.
 *
 * **시·도 칩으로 먼저 좁힌다** — 178곳을 한 줄로 늘어놓으면 폰에서 못 읽는다
 * (배치 시뮬레이터가 단지 목록을 시·도로 거르는 것과 같은 이유).
 *
 * **센터장 이름·사진·`010` 직통번호는 담지 않았다** — 이 저장소는 public repo 이고
 * 이 앱은 이미 *"`010` 을 제외한 나머지 번호만"* 을 지키고 있다(수집 단계에서 뺐다).
 * ───────────────────────────────────────────────────────────────────────── */
let SVC = null, svcSido = '경기', svcHomeOnly = false;
/* 고른 센터의 id — AS기간의 `cur`(고른 품목)과 같은 자리다. 목록에서 빠지면 놓는다 */
let svcPick = null;

/*
 * **이름에서 `삼성전자 ` 를 뗀다 — 표시 계층에서만.** 178곳이 전부 그 접두로 시작해
 * (전수 확인) 화면에서는 군더더기다. `svc-centers.json` 은 원문 대조용이라 손대지 않는다
 * (배치 시뮬레이터가 `65형` 을 `65인치` 로 적으면서 데이터는 그대로 둔 것과 같은 규칙).
 *
 * **`nm`(`강릉센터`)을 쓰면 안 된다** — `모바일`/`바로서비스` 구분이 사라진다.
 * `full` 에서 접두만 떼면 `모바일 강릉센터` · `삼송 바로서비스` 로 그 구분이 남는다.
 * 떼고도 178개 이름이 전부 유일하다(확인함). 접두가 없는 이름은 그대로 둔다.
 */
function svcName(x){ return String(x.full || '').replace(/^삼성전자\s+/, ''); }

/*
 * 화면을 **껍데기와 목록으로 가른다** (2026-08-27).
 *
 * **한글이 자모로 쪼개지던 버그가 여기서 났다** — 예전에는 `oninput` 이
 * `renderSvcCenters()` 를 불러 `pane.innerHTML` 을 통째로 다시 썼다. 그러면 입력칸이
 * **새 DOM 요소로 바뀌어 IME 조합 버퍼가 끊긴다.** `ㅅ` → `서` → `성` 으로 합쳐지지
 * 못하고 자모가 그대로 확정돼 *"성남"* 이 **"ㅅㅓㅇㄴㅏㅁ"** 이 됐다(사장님 보고).
 * `focus()` + `setSelectionRange()` 는 **커서만** 되살릴 뿐 조합 상태는 못 되살린다.
 *
 * **이 앱은 이미 답을 갖고 있었다** — `renderB2B()` 의 `draw()` 는 입력칸을 그대로 두고
 * 목록만 갈아 끼운다. 그래서 `#lgq`·`#b2bq`·`#itq` 에는 같은 문제가 없다. 그 패턴을 따른다:
 *   · `renderSvcCenters()` — 껍데기(안내문·입력칸·칩). 탭 진입·칩 클릭에서만 부른다
 *   · `renderSvcList()`    — 목록과 건수 줄만. **입력할 때 부르는 것은 이쪽뿐이다**
 * **입력 핸들러에서 껍데기를 다시 그리지 말 것.** 그 한 줄이 이 버그다.
 */
function renderSvcCenters(){
  const pane = document.getElementById('centerPane');
  if (!SVC){
    pane.innerHTML = '<div class="sub">센터 자료를 불러오는 중입니다…</div>';
    if (typeof fetch !== 'function'){ pane.innerHTML = '<div class="sub">이 환경에서는 센터 자료를 받을 수 없습니다.</div>'; return; }
    fetch('svc-centers.json').then(r=>r.json()).then(j=>{ SVC = j; renderSvcCenters(); })
      .catch(()=>{ pane.innerHTML = '<div class="sub">센터 자료를 불러오지 못했습니다. 새로고침해 주세요.</div>'; });
    return;
  }
  const sidos = [...new Set(SVC.items.map(x=>x.sd))]
    .sort((a,b)=>SVC.items.filter(x=>x.sd===b).length - SVC.items.filter(x=>x.sd===a).length);
  if (!sidos.includes(svcSido)) svcSido = sidos[0];
  const q = (document.getElementById('svcq') || {}).value || '';

  pane.innerHTML =
    `<div class="sub">전국 <b>${SVC.n}곳</b> · 가전 접수 <b>${SVC.items.filter(x=>x.home).length}곳</b>
       <span style="opacity:.7">(${esc(SVC.at)} 기준 · 삼성전자서비스)</span></div>
     <div class="notice">${esc(SVC.notice)}</div>
     <input id="svcq" class="lgq" placeholder="센터 이름 · 지역 · 취급 품목으로 찾기 (예: 수원, 청소기)" value="${esc(q)}">
     <div class="chips" id="svcchips">${sidos.map(sd=>
       `<button type="button" class="chip" data-sd="${esc(sd)}">${esc(sd)} ${SVC.items.filter(x=>x.sd===sd).length}</button>`).join('')}</div>
     <div class="chips"><button type="button" class="chip${svcHomeOnly?' on':''}" id="svchome">가전 접수만</button></div>
     <div class="sub" id="svccnt" style="margin-bottom:8px"></div>
     <div class="svcg" id="svclist"></div>
     <div id="svcbody"></div>`;

  pane.querySelectorAll('#svcchips .chip').forEach(el=>el.onclick=()=>{
    svcSido = el.dataset.sd;
    const box = document.getElementById('svcq'); if (box) box.value = '';
    /* 칩을 누를 때는 조합 중이 아니므로 껍데기를 다시 그려도 안전하다(칩의 `on` 이 바뀐다) */
    renderSvcCenters();
  });
  const hb = document.getElementById('svchome');
  if (hb) hb.onclick = ()=>{ svcHomeOnly = !svcHomeOnly; renderSvcCenters(); };
  const box = document.getElementById('svcq');
  /* **목록만 다시 그린다.** `focus()`·`setSelectionRange()` 는 없앴다 —
     입력칸을 건드리지 않으니 커서도 조합도 그대로 남는다. */
  if (box) box.oninput = renderSvcList;
  renderSvcList();
  renderNav();                  // 센터 자료가 오면 시·도가 사이드바에 생긴다 · 칩으로 바꾼 시·도도 따라간다
}

/*
 * 목록 — **AS기간 탭과 같은 구조다** (2026-08-27 사장님 지시: *"AS기간 인터페이스와
 * AS센터찾기 인터페이스를 통일해주세요"* · *"작은 칸에 00센터 이런 식으로 약식으로
 * 나오면 되고 그걸 클릭했을 때 상세정보가 열리는 방식으로 하면 됩니다"*).
 *
 * 그래서 **작은 칸 그리드 → 누르면 아래에 상세 카드**다 — 품목을 고르면 아래에
 * 보증기간 카드가 뜨는 그 흐름과 똑같다(`renderCats` → `renderBody` → `revealBody`).
 *
 * **접이식(`<details>`)에서 옮겨 왔다.** 접이식도 "눌러야 세부가 보인다"는 같았지만
 * 한 줄이 화면 폭을 다 먹어 한 화면에 8곳이었다 — 칸으로 바꾸니 3열이라 훨씬 많이 들어가고,
 * 무엇보다 **두 탭이 같은 모양**이 된다. 접이식 시절의 실측(펼치면 1곳)은 아래 절에 남긴다.
 *
 * **칸에 적는 것은 이름 · 시·군·구 · 가전 접수 여부 셋이다.** 고르려면 그만큼은 있어야
 * 한다 — 어느 동네인지 모르면 못 고르고(시·도 칩만으로는 경기 42곳 안에서 못 가른다),
 * 가전 접수 여부를 모르면 **TV 고객을 모바일 전용 센터로 보내 헛걸음시킨다**(178곳 중 66곳).
 *
 * **결과가 1곳이면 자동으로 고른다.** 상단 통합검색에서 특정 센터로 들어오면 `go()` 가
 * 그 이름을 통째로 `svcq` 에 넣어 결과가 1곳이 되는데, 그때 아무것도 안 골라져 있으면
 * *"아무 일도 안 일어난 것처럼 보여"* 찾아 준 뜻이 없어진다(연락처 탭이 묶음을 펼치는 것과 같다).
 *
 * **고른 센터가 목록에서 사라지면 선택을 놓는다.** 안 그러면 검색을 바꿨는데 화면 아래에
 * 그 결과에 없는 센터의 상세가 남아 있어 화면이 거짓말을 한다.
 */
function renderSvcList(){
  if (!SVC) return;
  const listEl = document.getElementById('svclist');
  const cntEl  = document.getElementById('svccnt');
  const bodyEl = document.getElementById('svcbody');
  if (!listEl) return;

  const s = ((document.getElementById('svcq') || {}).value || '').trim().toLowerCase();
  /* 검색어를 치면 **시·도 칩을 넘어 전국에서** 찾는다 — 상담사는 어느 시도인지 모르고 이름만 안다 */
  let list = s ? SVC.items : SVC.items.filter(x=>x.sd === svcSido);
  if (svcHomeOnly) list = list.filter(x=>x.home);
  if (s) list = list.filter(x=>(x.full+x.sd+x.sg+x.ad+x.it.join(' ')).toLowerCase().includes(s));

  /* 검색 중에는 시·도 칩의 `on` 을 끈다 — 전국에서 찾고 있으므로 그 칩이 켜져 있으면 거짓말이다 */
  const chips = document.querySelectorAll('#svcchips .chip');
  chips.forEach(c=>c.classList.toggle('on', !s && c.dataset.sd === svcSido));

  /* 찾은 글자를 표시한다. **정규식 이스케이프를 쓰지 않는다** — 검색어에 특수문자가 섞이면
     정규식이 깨지는데, 그러면 이 앱 전체 스크립트가 죽는다(실제로 죽었다).
     대소문자 무시로 자리를 찾아 잘라 붙인다. */
  const hl = (t)=>{
    const raw = String(t == null ? '' : t);
    if (!s) return esc(raw);
    const low = raw.toLowerCase();
    let out = '', i = 0;
    for(;;){
      const at = low.indexOf(s, i);
      if (at < 0){ out += esc(raw.slice(i)); break; }
      out += esc(raw.slice(i, at)) + '<mark>' + esc(raw.substr(at, s.length)) + '</mark>';
      i = at + s.length;
    }
    return out;
  };
  const hours = (x)=>[x.wd&&`평일 ${x.wd}`, x.sa&&`토 ${x.sa}`, x.ho&&`공휴일 ${x.ho}`].filter(Boolean).join(' · ');

  /* 결과가 1곳이면 그 곳을, 고른 센터가 목록에서 빠졌으면 아무것도 고르지 않는다 */
  if (list.length === 1) svcPick = list[0].id;
  else if (!list.some(x=>x.id === svcPick)) svcPick = null;

  if (cntEl) cntEl.innerHTML = s ? `전국에서 <b>${list.length}곳</b>` : `${esc(svcSido)} <b>${list.length}곳</b>`;

  listEl.innerHTML = list.length ? list.map(x=>
    `<button type="button" class="svcc${x.id===svcPick?' on':''}" data-id="${x.id}">
      <span class="svcc-n">${hl(svcName(x))}</span>
      <span class="svcc-g">${hl(x.sg)}</span>
      <span class="svcc-h${x.home?'':' m'}">${x.home?'가전 접수':'모바일만'}</span>
    </button>`).join('') : '<div class="sub">찾는 센터가 없습니다.</div>';

  listEl.querySelectorAll('.svcc').forEach(el=>el.onclick=()=>{
    /* 고른 것을 다시 누르면 접는다 — 상세가 화면을 먹고 있을 때 목록으로 돌아갈 길이 있어야 한다 */
    svcPick = (+el.dataset.id === svcPick) ? null : +el.dataset.id;
    renderSvcList();
    if (svcPick != null) revealSvcBody();
    /* 센터당 1회 — 상담에서 실제로 어느 센터를 봤는지가 남는다(품목 로그와 같은 규칙) */
    if (svcPick != null && window.AX_LOG) AX_LOG('as', 'result_open', 'AS센터', true);
  });

  const p = svcPick == null ? null : SVC.items.find(x=>x.id === svcPick);
  if (bodyEl) bodyEl.innerHTML = !p ? '' :
    `<div class="card">
      <h2>${esc(svcName(p))} <span class="pill">${p.home?'가전 접수':'모바일만'}</span></h2>
      <span class="ct-d">
        ${opsRow('주소', `<span>${esc(p.sd+' '+p.sg+' '+p.ad)}</span>${mapLink(svcName(p), p.la, p.ln, p.sd+' '+p.sg+' '+p.ad)}`)}
        ${hours(p)?`${opsRow('영업', `<span>${esc(hours(p))}</span>`)}`:''}
        ${p.tel?`${opsRow('대표', p.dial
          ? `<span data-tel="${esc(p.dial)}">${esc(p.tel)}</span>`
          /* **`dial` 이 null 이면 버튼으로 만들지 않는다.** 그런 센터는 대표번호가
             `031-8061-내선검색` 처럼 걸 수 있는 번호가 아니다(6곳). 예전에는 여기서 숫자만
             추려 `0318061` 을 만들어 걸었는데 — 그건 없는 번호다. 자료가 비워 둔 것을
             화면이 지어내면 안 된다(이 앱이 부품보유기간을 "확인 필요"로 두는 것과 같은 규칙). */
          : `<span>${esc(p.tel)}</span>`)}`:''}
        ${p.park?`${opsRow('주차', `<span>${esc(p.park)}</span>`)}`:''}
        ${p.taxi?`${opsRow('찾아가기', `<span>${esc(p.taxi)}</span>`)}`:''}
        ${opsRow('취급', `<span>${p.it.length?esc(p.it.join(' · ')):'접수 품목 정보 없음'}</span>`)}
      </span></div>`;

  if (typeof wireContacts === 'function' && bodyEl) wireContacts(bodyEl, '[data-tel]');
}

/* 고른 센터의 상세로 데려간다 — AS기간이 품목을 고르면 `revealBody()` 로 본문을 보여주는 것과 같다 */
function revealSvcBody(){
  const el = document.getElementById('svcbody');
  if (isTablet()) { openPop('svc-pop', closeSvcPop); return; }
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
/*
 * ── 태블릿 팝업 (2026-10-23) ── 화면에 하나만 뜬다. 닫는 길은 넷 —
 * ✕ · 바깥 · Esc · 뒤로가기(back-kit). 하나뿐이면 그 하나가 막혔을 때 갇힌다.
 */
function isTablet(){ return window.matchMedia && matchMedia('(min-width:720px)').matches; }
let popClose = null;
function openPop(cls, onClose){
  closePop(true);
  document.body.classList.add(cls);
  const dim = document.createElement('div'); dim.className = 'pop-dim sk-noprint'; dim.id = 'popDim';
  /* 바깥에서 왼쪽 메뉴를 누르면 닫고 그 항목까지 누른 것으로 넘긴다 — 한 번 더 누르게 하지 않는다(2026-10-23) */
  dim.addEventListener('click', e => {
    closePop();
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const hit = t && t.closest && t.closest('.dmenu .dm-it');
    if (hit) hit.click();
  });
  const x = document.createElement('button'); x.type = 'button'; x.className = 'pop-x sk-noprint'; x.id = 'popX';
  x.setAttribute('aria-label', '닫기'); x.textContent = '✕';
  x.addEventListener('click', () => closePop());
  document.body.append(dim, x);
  popClose = () => { document.body.classList.remove(cls); dim.remove(); x.remove(); onClose && onClose(); };
  requestAnimationFrame(placePopX);
  if (window.Back) Back.open(() => closePop(true), () => !!popClose);
}
function placePopX(){
  const x = document.getElementById('popX');
  const box = document.querySelector('body.svc-pop #svcbody, body.grp-pop .grps>details.grp[open]');
  if (!x || !box) return;
  const r = box.getBoundingClientRect();
  x.style.left = (r.right - 20) + 'px'; x.style.top = (r.top - 20) + 'px';
}
function closePop(silent){
  if (!popClose) return;
  const f = popClose; popClose = null; f();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && popClose) closePop(); });
window.addEventListener('resize', () => { if (popClose && !isTablet()) closePop(); else placePopX(); });
function closeSvcPop(){ svcPick = null; renderB2B(); }
/* 연락처 묶음 — 태블릿에서는 펼치는 대신 팝업으로 띄운다. 한 번에 하나만 열린다 */
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.classList.contains('grp') || !d.closest('.grps')) return;
  if (!isTablet()) return;
  if (d.open) {
    document.querySelectorAll('.grps>details.grp[open]').forEach(o => { if (o !== d) o.open = false; });
    openPop('grp-pop', () => { d.open = false; });
  } else if (popClose && document.body.classList.contains('grp-pop') && !document.querySelector('.grps>details.grp[open]')) {
    closePop();
  }
}, true);

/*
 * 관할 검색 — 물류센터와 같은 방식이다(원문 `a` 까지 훑고, 찾은 글자를 표시한다).
 * 가전(`#b2bq`→`#b2blist`)과 IT(`#itq`→`#itlist`)는 **묶음이 갈렸으므로 검색칸도 각자 쓴다.**
 * 한 칸으로 둘을 거르던 때는 같은 묶음 안에 나란히 있어서 가능했던 것이다.
 */
function renderB2B(){
  const pane = document.getElementById('contactPane');

  const draw = (qid, id, rows, what) => {
    const box = pane.querySelector(qid), list = pane.querySelector(id);
    if (!box || !list) return;
    const s = (box.value || '').trim().toLowerCase();
    const hl = hlOf(s);
    const hit = rows.filter(c => !s || (c.p + c.c + c.code + c.n + (c.d||'') + xtext(c) + c.a).toLowerCase().includes(s));
    list.innerHTML = hit.length ? hit.map(c=>
      `<div class="ct lg">
        <span class="ct-b"><b>${hl(c.p)}<span class="ct-tag">${hl(c.c)} · ${esc(c.code)}</span></b>
        <span class="ct-d">${areaLines(c.a, hl)}${
          c.d ? opsRow('추가', telsplit(c.d, `${c.p} (${c.c}) 추가 회선`, hl)) : ''}${
          xline(c, `${c.p} (${c.c})`, hl)}</span></span>
        <span class="ct-n">${telx(c.n, `${c.p} (${c.c})`, hl, true)}</span></div>`).join('')
      : `<div class="unk">해당하는 ${what} 협력사가 없습니다 — 지역명(시·군·구)으로 찾아보세요.</div>`;
    list.insertAdjacentHTML('beforeend', `<div class="cnt">${hit.length}개 센터</div>`);
    if (typeof wireContacts === 'function') wireContacts(list, '[data-tel]');
  };
  draw('#b2bq', '#b2blist', B2B, '가전');
  draw('#itq', '#itlist', B2B_IT, 'IT');
}

/*
 * 상단 통합 검색 — 세 탭에 흩어진 것을 한 칸에서 찾는다.
 *
 * 상담 중에 나오는 말은 "냉장고 컴프레서 몇 년이죠" · "수원은 어느 센터죠" ·
 * "식기세척기 이전설치" 인데, 그게 어느 탭에 있는지는 상담사가 알 이유가 없다.
 * 그래서 **찾은 뒤 그 탭까지 데려간다**(고르기만 하면 탭 전환·품목 선택·목록 필터가 함께 걸린다).
 *
 * 판정은 공백으로 쪼갠 **모든 토큰을 포함해야 하는 AND** 다 — "냉장고 컴프레서"처럼
 * 조건을 겹쳐 좁히는 것이 상담에서 실제로 쓰는 방식이다.
 */
function searchDocs(){
  const out = [];
  for (const k of keys) {
    const d = DB[k];
    out.push({ kind:'품목', title:k,
      sub:`무상보증 ${d.base}${d.hold ? ' · 부품보유 ' + d.hold + '년' : ''}`,
      kw:[k, d.base, d.baseWhy, d.baseNote, d.holdAs, d.note,
          'as 보증 보증기간 무상보증 무상수리 부품 부품보유 부품보유기간 내용연수',
          ...(d.core||[]).flat(),
          /* **품목별 적용 기준도 담는다** — 화면에 「총판 제품 … 케이원에이브(K1AV)」가
             떠 있는데 그 말로 못 찾으면 안 된다. 이 앱이 세운 규칙 그대로다.
             `RULES`(전 품목 공통)는 담지 않는다 — 모든 품목이 같은 글이라 검색이 흐려진다. */
          ...(d.rules||[]).map(r => r.l + ' ' + r.t)].filter(Boolean).join(' '),
      go(){ setTab('as'); cur = k; renderCats(); renderBody(); revealBody(); } });
  }
  /*
   * **센터도 한 칸에서 찾는다** (2026-08-27). 상담 중에 나오는 말은 *"수원 AS센터 어디죠"*
   * 인데 그게 어느 탭에 있는지는 상담사가 알 이유가 없다 — 이 검색이 세우는 원칙 그대로다.
   * `SVC` 는 비동기로 오므로 **오기 전에는 이 갈래가 비어 있다**(검색이 죽지는 않는다).
   */
  for (const x of ((SVC && SVC.items) || [])) {
    /* 제목도 화면과 같은 짧은 이름을 쓴다 — `kw` 에 `full` 이 그대로 있어 "삼성전자"로도 찾힌다 */
    out.push({ kind:'AS센터', title:svcName(x),
      sub:`${x.sd} ${x.sg} · ${x.home ? '가전 접수' : '모바일만'}`,
      kw:`${x.full} ${x.nm} ${x.sd} ${x.sg} ${x.ad} ${x.it.join(' ')} as센터 서비스센터 수리 위치 주소`,
      /* **이름을 통째로 넣어 그 한 곳만 남긴다** — 결과가 1곳이면 `renderSvcList` 가 그 곳을
         자동으로 골라 주므로 찾아 준 센터의 주소·번호가 바로 보인다. `nm`(`강릉센터`) 대신
         `svcName`(`모바일 강릉센터`)을 쓰는 이유는 그것이 화면에 적히는 이름이고
         178곳에서 유일하기 때문이다. */
      go(){ setTab('center'); svcSido = x.sd; svcHomeOnly = false; svcPick = x.id;
        renderSvcCenters();
        /* 허브 안에서는 센터 칸 검색이 감춰져 있어(통합검색 일원화) 거기 글자를 넣으면 지울 길 없이 목록이 한 곳으로 묶인다 */
        const b = document.getElementById('svcq');
        if (b && !document.documentElement.classList.contains('ax-embed')){ b.value = svcName(x); renderSvcList(); }
        revealBody(); } });
  }
  out.push({ kind:'수리비', title:'출장비 · 수리비(기술료) · 부품비',
    sub:'평절기 기본 28,000원 · 성수기 기본 33,000원 — 삼성전자서비스 원문',
    kw:'수리비 출장비 기술료 공임 공임비 부품비 부품값 부품가격 액정 액정값 디스플레이 배터리 후면커버 휴대폰수리비 폰수리비 자가수리 리퍼 리퍼부품 유상수리 무상수리 할증 야간 휴일 성수기 평절기 서비스요금 요금 비용 얼마 ' + FEE.trip.rules.join(' ') + ' ' + FEE.trip.always.join(' ') + ' ' + FEE.labor.join(' '),
    go(){ setTab('fee'); revealFee(); } });
  for (const g of CONTACTS) for (const c of g.items) {
    out.push({ kind:'연락처', title:c.t, sub:`${c.n} · ${c.d}`,
      kw:`${c.t} ${c.n} ${c.d} ${g.g} 연락처 전화번호`,
      go(){ openGroup('g-as'); } });
  }
  for (const c of CENTERS) {
    out.push({ kind:'물류센터', title:c.t, sub:`${c.n} · ${c.a}`,
      kw:`${c.t} ${c.code} ${c.n} ${c.a} ${c.kw.join(' ')} ${c.b} ${opsText(c)} 물류센터 배송 설치 관할 상황실 운영 voc`,
      go(){ openGroup('g-lg'); const q = document.querySelector('#lgq');
            if (q) { q.value = c.t; renderCenters(); } } });
  }
  for (const c of B2B) {
    out.push({ kind:'이전설치', title:`${c.p} · ${c.c}`, sub:c.a,
      kw:`${c.p} ${c.c} ${c.code} ${c.n} ${xtext(c)} ${c.a} 이전설치 빌트인 b2b 관할`,
      go(){ openGroup('g-mv'); const q = document.querySelector('#b2bq');
            if (q) { q.value = c.c; renderB2B(); } } });
  }
  for (const c of B2B_IT) {
    out.push({ kind:'IT 이전설치', title:`${c.p} · ${c.c}`, sub:c.a,
      kw:`${c.p} ${c.c} ${c.code} ${c.n} ${c.d||''} ${c.a} 이전설치 it b2b 관할 노트북 모니터 프린터`,
      go(){ openGroup('g-it'); const q = document.querySelector('#itq');
            if (q) { q.value = c.c; renderB2B(); } } });
  }
  for (const s of SINK) {
    out.push({ kind:'싱크장 리폼', title:s.p, sub:`${s.n} · ${s.a}`,
      kw:`${s.p} ${s.n} ${s.n2||''} ${xtext(s)} ${s.a} 싱크대 싱크장 리폼 식기세척기 식세기 빌트인`,
      go(){ openGroup('g-sink'); } });
  }
  const NAT_GRP = { ind:'g-ind', wat:'g-wat', hood:'g-hood', sac:'g-sac' };
  for (const x of B2B_NATION) {
    out.push({ kind:'전국 담당', title:`${x.t} 이전설치`, sub:`${x.p} · ${x.n} · ${x.d}`,
      kw:`${x.p} ${x.t} ${x.n} ${x.d} ${xtext(x)} 이전설치 전국`,
      go(){ openGroup(NAT_GRP[x.key]); } });
  }
  /* 중앙에너지 지사 — "우리 동네는 어디서 나오나" 에 답한다(접수는 본사콜 하나) */
  for (const m of MID) {
    out.push({ kind:'설치 지사', title:`${m.g} (중앙에너지)`, sub:`${m.tc} · ${m.a}`,
      kw:`${m.g} ${m.tc} ${m.a} 중앙에너지 인덕션 정수기 후드 지사 설치 관할`,
      go(){ openGroup('g-ind'); const q = document.querySelector('#mq-ind');
            if (q) { q.value = m.g; renderMid('ind'); } } });
  }
  /* 상담사가 치는 말은 "JBL AS" · "하만 서비스센터" · "AKG 수리" 다 — 그 말로 걸려야 한다 */
  out.push({ kind:'연락처', title:HARMAN.p, sub:`${HARMAN.n} · ${HARMAN.brands} 보증 교환 서비스`,
    kw:`${HARMAN.p} ${HARMAN.c} ${HARMAN.n} ${HARMAN.a} ${HARMAN.mail} jbl 제이비엘 하만 하만카돈 harman kardon akg 에이케이지 `

let DOCS = null;

/*
 * ── 질의 해석 — 허브 통합검색과 같은 규칙을 쓴다 ──
 *
 * 예전에는 친 글자를 그대로 `kw.includes` 로 대조해서 **한 글자에 아무거나 걸렸다**
 * (실측: '장' 23건 · '기' 58건 · '이' 52건 · '대' 40건). 상담사 눈에는 "AS 와 상관없는
 * 것이 섞여 나온다"로 보인다(2026-08-11 사용자 지적). 게다가 조사·꼬리말이 붙으면
 * 통째로 0건이 됐다 — *"냉장고 보증기간"* · *"에어컨 몇년"* 이 실제로 0건이었다.
 */
const AS_STOP_TAIL = /(입니까|입니다|인가요|인가|이야|이죠|인지|일까요|일까|해줘|해주세요|알려줘|알려주세요|뭐야|뭔가요|어때요|얼마나|얼마|몇|은|는|이|가|을|를|의|에|에서|도|만|요)$/;
/* 화면 말 ↔ 자료 말이 갈리는 짝만 넣는다. 상위·하위 개념을 섞으면 조건이 무의미해진다. */
const AS_SYN = {
  '보증기간': ['무상보증', '보증'], '보증': ['보증'], '무상': ['무상'],
  '몇년': ['년'], '년수': ['년'], '기간': ['기간', '년'],
  'as': ['as'], '에이에스': ['as'], '수리': ['수리'],
  '이사': ['이전설치'], '이전': ['이전설치'], '옮김': ['이전설치'],
  '로열': ['로열'], '블루': ['블루'], '멤버쉽': ['멤버십'],
  'dd모터': ['dd motor', 'ddmotor'], 'dd': ['dd'],
  '인버터': ['인버터', 'inverter'], '컴프레셔': ['컴프레서'],
};
function asTokens(s){
  return s.split(/\s+/)
    .map(t => t.replace(/^[?!.,;:~"'`()[\]{}<>]+|[?!.,;:~"'`()[\]{}<>]+$/g, '') || t)
    /* 한 글자는 조건으로 쓰지 않는다 — `includes` 판정이라 어디에나 걸린다 */
    .filter(t => t.length >= 2);
}
/** 토큰 하나가 조건 하나다. 조건 안은 OR(원래 말 + 조사 뗀 말 + 표기 짝). */
function asConds(s){
  return asTokens(s).map(raw => {
    const forms = [raw];
    const cut = raw.replace(AS_STOP_TAIL, '');
    if (cut && cut.length >= 2 && !forms.includes(cut)) forms.push(cut);
    for (const f of [raw, cut]) (AS_SYN[f] || []).forEach(v => { if (!forms.includes(v)) forms.push(v); });
    return { raw, forms };
  });
}

/*
 * ── 검색 결과 상자 여닫기 ──
 * 닫는 경로가 셋이다(글자를 지웠을 때 · 바깥을 눌렀을 때 · Esc). 셋 다 각자 클래스를
 * 지우고 있었는데, 휴대폰 뒤로가기까지 붙이려면 **한 군데로 모아야** 한 곳만 고치면 된다.
 * 상자가 화면을 덮으므로 뒤로가기를 누르면 앱이 아니라 이것부터 닫혀야 한다(back-kit.js).
 */
function searchOpen(){ return document.body.classList.contains('sres-open'); }
function closeSearchBox(){
  if (!searchOpen()) return;
  const box = document.getElementById('sres');
  box.style.display = 'none';
  document.body.classList.remove('sres-open');
  if (window.Back) Back.done();
}
function openSearchBox(){
  if (searchOpen()) return;        // 이미 열려 있는데 또 쌓으면 뒤로가기를 여러 번 눌러야 한다
  document.getElementById('sres').style.display = '';
  document.body.classList.add('sres-open');
  if (window.Back) Back.open(closeSearchBox, searchOpen);
}

function runSearch(){
  const box = document.getElementById('sres');
  const inp = document.getElementById('sq');
  const s = (inp.value || '').trim().toLowerCase();
  document.getElementById('sx').style.display = s ? '' : 'none';
  if (!s) { box.innerHTML = ''; closeSearchBox(); return; }
  if (!DOCS) DOCS = searchDocs();
  const conds = asConds(s);
  const match = (d, cs) => cs.every(c => c.forms.some(f => d.kw.includes(f)));
  let hit = conds.length ? DOCS.filter(d => match(d, conds)) : [];
  /*
   * **0건이면 안 걸린 조건 하나를 빼고 다시 찾는다** — 조용히 빼지 않고 화면에 적는다.
   * 활용형을 목록으로 다 잡을 수 없으니 데이터가 스스로 판정하게 한다(허브와 같은 원칙).
   */
  const dropped = [];
  if (!hit.length && conds.length > 1) {
    let best = null;
    for (const c of conds) {
      const rest = conds.filter(x => x !== c);
      const n = DOCS.filter(d => match(d, rest)).length;
      if (n > 0 && (!best || n > best.n)) best = { c, rest, n };
    }
    if (best) { hit = DOCS.filter(d => match(d, best.rest)); dropped.push(best.c.raw); }
  }
  hit = hit.slice(0, 40);

  if (!hit.length) {
    box.innerHTML = `<div class="sr-none">"${esc(inp.value.trim())}" 결과가 없습니다.<br>품목명 · 부품명 · 지역명(시·군·구) · 협력사명으로 찾아보세요.</div>`;
  } else {
    let last = '', h = '';
    /* 뺀 말이 있으면 반드시 밝힌다 — 조용히 빼면 왜 이 결과가 나왔는지 알 수 없다 */
    if (dropped.length) h += `<div class="sr-note">"${esc(dropped.join(' · '))}" 까지 함께 맞는 자료가 없어, 그 말은 빼고 찾았습니다.</div>`;
    for (let i = 0; i < hit.length; i++) {
      const d = hit[i];
      if (d.kind !== last) { h += `<div class="shd">${esc(d.kind)}</div>`; last = d.kind; }
      h += `<button type="button" class="sr" data-i="${i}">
        <span class="sr-k">${esc(d.kind)}</span>
        <span class="sr-b"><b>${esc(d.title)}</b><span>${esc(d.sub)}</span></span></button>`;
    }
    box.innerHTML = h;
    box.querySelectorAll('.sr').forEach(el => el.onclick = () => {
      hit[+el.dataset.i].go();
      inp.value = ''; runSearch(); inp.blur();
    });
  }
  openSearchBox();
}

function wireSearch(){
  const inp = document.getElementById('sq');
  inp.addEventListener('input', runSearch);
  inp.addEventListener('focus', runSearch);
  document.getElementById('sx').onclick = () => { inp.value = ''; runSearch(); inp.focus(); };
  /* 결과 밖을 누르면 닫는다 — 열어 둔 채로 두면 그 아래 화면을 만질 수가 없다 */
  document.addEventListener('pointerdown', e => {
    if (!document.getElementById('sbar').contains(e.target)) closeSearchBox();
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Escape') { inp.value = ''; runSearch(); inp.blur(); } });
}

  const raw = document.getElementById('csq').value, q = pkNorm(raw);
  const searching = q.length >= 2;
  const hit = searching ? CS.rows.filter(r => pkNorm(r[1] + r[2] + r[3] + r[6]).includes(q)) : CS.rows.filter(r => r[0] === csKind && csLineOf(r) === csLine);
  if (searching) { const kinds = new Set(hit.map(r => r[0])); if (kinds.size === 1) csKind = [...kinds][0]; }
  ks.innerHTML = CS.kinds.map((t, i) => `<button type="button" class="chip${i === csKind && !searching ? ' on' : ''}" data-ck="${i}">${esc(t)}</button>`).join('');
  ks.querySelectorAll('.chip').forEach(b => b.onclick = () => { csKind = Number(b.dataset.ck); csLine = ''; document.getElementById('csq').value = ''; renderConsum(); });
  /* 라인 버튼 — 갈래를 고르면 그 안의 라인만 칸으로 보이고, 라인을 눌러야 목록이 펼쳐진다 */

  CS.rows.filter(r => r[0] === csKind).forEach(r => lines.set(csLineOf(r), (lines.get(csLineOf(r)) || 0) + 1));

  ls.innerHTML = [...lines].map(([t, n]) => `<button type="button" class="cat${t === csLine ? ' on' : ''}" data-cl="${esc(t)}">${esc(t)}<span class="d">${n}개</span></button>`).join('');
  ls.querySelectorAll('.cat').forEach(b => b.onclick = () => { csLine = csLine === b.dataset.cl ? '' : b.dataset.cl; renderConsum(); });
  if (!searching && !csLine) { out.innerHTML = '<div class="why">위에서 제품 라인을 누르면 그 라인의 소모품 가격이 펼쳐집니다. 모델·부품번호를 알면 아래 검색이 더 빠릅니다.</div>'; return; }

  const list = [...hit].sort((a, b) => a[0] - b[0] || (a[1] > b[1] ? 1 : a[1] < b[1] ? -1 : b[4] - a[4]));   // 갈래 순 → 하위분류 → 비싼 순
  const shown = searching ? list.slice(0, 40) : list;   // 글자 검색은 40줄까지(폰에서 끝없이 늘어난다) · 라인을 골랐으면 그 라인 전부
  out.innerHTML = `<div class="why">${list.length.toLocaleString()}개${!searching ? ` · ${esc(CS.kinds[csKind])} › ${esc(csLine)}` : ''}${list.length > shown.length ? ` 중 ${shown.length}개 — 모델·품명을 더 넣어 좁히세요` : ''} · (${esc(CS.collectedAt)} 원문 수집)</div>

    ${shown.map(r => `<tr><td><b>${esc(r[2])}</b><span>${esc(r[1] || CS.kinds[r[0]])} · ${esc(r[3])}${r[5] ? ' · 일시품절' : ''}${r[6] ? ' · ' + esc(pkModels(r[6])) : ''}</span></td><td><b>${r[4] == null ? '—' : r[4].toLocaleString() + '원'}</b></td></tr>`).join('')}</tbody></table>`;

/* 색상만 다른 부품을 한 줄로 묶는다 — 「폴드8, MAIN DISPLAY_GREEN SHADOW」 · 「… (클라우드 화이트)」 */
const partBase = (n) => n.replace(/_[^_,]*$/, '').replace(/\s*\([^)]*\)\s*$/, '').trim() || n;
/* 적용 모델이 열 개 넘게 붙는 노트북 부품은 폰에서 한 줄이 화면 절반을 먹는다 — 앞 셋만 적고 나머지는 개수로 */
const pkModels = (m) => { const a = String(m || '').split(',').map(x => x.trim()).filter(Boolean); return a.length > 3 ? a.slice(0, 3).join(', ') + ` 외 ${a.length - 3}개` : a.join(', '); };
const pkNorm = (t) => String(t || '').toUpperCase().replace(/[\s,·]/g, '');
/* 노트북 겸용 부품(시리즈 「갤럭시 북3/북4 프로」)은 세대마다 찾혀야 한다 — 「갤럭시 북4 프로」로 찾아도 나온다.
   통합검색 색인(build-search-index.mjs)이 같은 규칙으로 세대마다 넣는다. */
const pkGens = (r) => (r[0] === 3 && r[1].includes('/'))
  ? [...new Set((r[1].match(/북\d*/g) || []).map(t => '갤럭시 ' + (t === '북' ? '북' : t) + ' 프로'))] : [r[1].trim()];
function renderParts(){

    }
    return;
  }
  const mine = PK.rows.filter(r => r[0] === pkKind);
  const q = pkNorm(document.getElementById('pkq').value);
  if (q.length < 2) {
    const series = [...new Set(mine.flatMap(pkGens))];
    out.innerHTML = `<div class="why">${mine.length.toLocaleString()}개 부품 · 시리즈를 누르거나 모델명을 두 글자 이상 넣으세요. (${esc(PK.collectedAt)} 원문 수집)</div>

    out.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => { document.getElementById('pkq').value = b.dataset.ps.trim(); renderParts(); });
    return;
  }
  /* 글자로 찾을 때는 **이 칸(휴대폰·태블릿·PC) 안에서는** 칩과 무관하게 — 「폴드8」을 S·A 칩에서 쳐도 나와야 한다 */
  const grp = PK_GROUP[feeSec] || [pkKind];
  const hit = PK.rows.filter(r => grp.includes(r[0]) && pkNorm(pkGens(r).join('') + r[1] + r[2] + r[4]).includes(q));
  /* 찾은 것이 한 종류(폴더블 등)면 위 칩도 그쪽으로 — 「폴드8」 인데 S·A 가 켜져 있으면 화면이 두 말을 한다 */
  const kinds = new Set(hit.map(r => r[0]));
  if (kinds.size === 1) { pkKind = [...kinds][0]; document.querySelectorAll('#pkKinds .chip').forEach(x => x.classList.toggle('on', Number(x.dataset.pk) === pkKind)); }
  if (!hit.length) {
    out.innerHTML = `<div class="unk">「${esc(q)}」 부품 가격이 이 칸에 없습니다.</div>${(() => { const o = PK.rows.find(r => !grp.includes(r[0]) && pkNorm(pkGens(r).join('') + r[1] + r[2] + r[4]).includes(q)); return o ? `<div class="why">「${esc(FEE_SECS.find(x => x[0] === pkSecOf(o[0]))[2])}」 칸에 있습니다.</div>` : ''; })()}
      <div class="why">원문은 고객 자가수리 대상 모델만 싣습니다. 그 밖의 모델은 AI CS Bot 이나 엔지니어 점검 후 안내됩니다.</div>`;
    return;
  }
  const g = new Map();
  for (const r of hit) {
    const k = r[2] + '|' + partBase(r[4]) + '|' + r[5] + '|' + r[6];
    if (!g.has(k)) g.set(k, { m: r[2], n: partBase(r[4]), p: r[5], rp: r[6], c: 0, out: 0, code: r[3] });
    const o = g.get(k); o.c++; if (r[7]) o.out++;
  }
  const list = [...g.values()].sort((a, b) => b.p - a.p);
  const shown = list.slice(0, 80);
  const won = (v) => v == null ? '—' : v.toLocaleString() + '원';
  out.innerHTML = `<div class="why">${list.length.toLocaleString()}개 부품${list.length > shown.length ? ` 중 ${shown.length}개 — 모델명을 더 넣어 좁히세요` : ''} · 비싼 순</div>
    <table class="fee-t rf-t"><thead><tr><th>부품 · 적용 모델</th><th>판매가</th><th>반납 시</th></tr></thead><tbody>
    ${shown.map(o => `<tr><td><b>${esc(o.n)}</b><span>${esc(pkModels(o.m))}${o.c > 1 ? ` · 색상 ${o.c}종` : ' · ' + esc(o.code)}${o.out ? (o.out === o.c ? ' · 일시품절' : ` · ${o.out}종 일시품절`) : ''}</span></td>
      <td>${won(o.p)}</td><td><b>${won(o.rp)}</b></td></tr>`).join('')}</tbody></table>`;
}

(function deepLink(){
  /* `?pk=폴드8` — 통합검색 「폴드8 수리비」 에서 온다. 수리비 탭의 부품가 검색을 그 시리즈로 연다 */
  const pk = new URLSearchParams(location.search).get('pk');
  if (pk) {
    /* 어느 칸(휴대폰·태블릿·PC)인지는 통합검색이 pkk 로 알려 준다 */
    const pkk = Number(new URLSearchParams(location.search).get('pkk'));
    if (pkk >= 0 && pkk <= 4 && new URLSearchParams(location.search).has('pkk')) { pkKind = pkk; feeSec = pkSecOf(pkk); }
    else {   // 옛 링크(pkk 없음) — 이름으로 어림한다
      feeSec = /북|모니터|노트북/.test(pk) ? 'pc' : /탭|태블릿/.test(pk) ? 'tablet' : 'phone';
      pkKind = PK_GROUP[feeSec][0];
      if (feeSec === 'pc' && /모니터/.test(pk)) pkKind = 4;
      if (feeSec === 'phone' && /폴드|플립|폴더블/.test(pk)) pkKind = 1;
    }
    setTab('fee');
    const inp = document.getElementById('pkq');
    if (inp) {
      inp.value = pk.trim();
      renderParts();
      const card = inp.closest('.card');
      if (card && card.scrollIntoView) setTimeout(() => card.scrollIntoView({ block: 'start' }), 60);
    }
    return;
  }
  const gk = new URLSearchParams(location.search).get('grp');
  if (gk && (GROUPS.some(x => x.id === gk) || MV_OLD[gk])) { openGroup(gk); return; }
  const fsk = new URLSearchParams(location.search).get('fs');
  if (fsk && FEE_SECS.some(x => x[0] === fsk)) {
    feeSec = fsk;
    const ck = Number(new URLSearchParams(location.search).get('ck'));
    if (fsk === 'consum' && ck >= 0 && ck < 7) csKind = ck;
    const cpv = new URLSearchParams(location.search).get('cpv');
    if (fsk === 'careplus' && CP_VIEWS.some(v => v[0] === cpv)) { cpView = cpv; cpGroup = new URLSearchParams(location.search).get('cpg') || ''; }
    setTab(feeTabOf(fsk));
    const cq = new URLSearchParams(location.search).get('cq');
    const inp = document.getElementById('csq');
    if (cq && inp) { inp.value = cq; renderConsum(); }
    const b = document.getElementById('feeBody');
    if (b && b.scrollIntoView) setTimeout(() => b.scrollIntoView({ block: 'start' }), 60);
    return;
  }
  const q = new URLSearchParams(location.search).get('q');
  if (!q) return;
  if (!DOCS) DOCS = searchDocs();
  const hit = DOCS.find(d => d.title === q);
  if (hit) { hit.go(); return; }
  const inp = document.getElementById('sq');
  /* 허브 안에서는 이 칸이 감춰져 있다 — 정확히 맞는 항목이 없어 이 칸으로 찾을 때만 보이게 한다(결과가 숨은 칸에 갇히지 않게) */
  if (inp) { document.documentElement.classList.add('ax-showsearch'); inp.value = q; runSearch(); }
})();

/* 공유 버튼은 한 번만 붙인다 — 렌더 안에서 부르면 품목을 눌러야 생긴다 */
if (typeof mountShareButton === 'function') mountShareButton(shareBuild);
window.__as = { FEE, FEE_SRC, FEE_SECS, FEE_GROUPS, CONFLICT, CAREPLUS, loadParts(j){ PK = j; renderParts(); }, loadConsum(j){ CS = j; renderConsum(); }, loadIC(j){ IC = j; }, CP_VIEWS, partBase, DB, ROYAL, RB, CONTACTS, CENTERS, OPS, VOC_HQ, HARMAN, B2B, B2B_IT, SINK, B2B_NATION, MID, GROUPS,
  openGroup,
  /* 딥링크가 착지하는지 검사하려면 **앱이 실제로 내놓는** 제목을 봐야 한다.
     데이터에서 제목을 다시 만들어 대조하던 검사는 색인과 사이좋게 틀린 채로 통과했다
     (멤버십 항목이 searchDocs 에 아예 없었는데 둘 다 있다고 여겼다, 2026-08-13). */
  searchDocs,
  /* AS센터 목록은 `fetch` 로 오는데 jsdom 에는 fetch 가 없다 — 검사가 직접 넣어 준다.
     이걸 안 열어 두면 센터 탭 전체가 검사 밖에 남는다(한글이 자모로 쪼개지던 버그가 그렇게 지나갔다). */
  loadSvc(j){ SVC = j; renderSvcCenters(); }, openSvcLink,
  renderSvcList, svcName,
  get cur(){ return cur; }, set cur(v){ cur=v; renderCats(); renderBody(); },
  get tab(){ return curTab; }, set tab(v){ setTab(v); },
  search(q){ const i = document.getElementById('sq'); i.value = q; runSearch();
             return [...document.querySelectorAll('#sres .sr')].map(el =>
               el.querySelector('b').textContent); } };
</script>
</body>
</html>
