<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼성 AI구독 케어 안내</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#e9ebef;min-height:100vh}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#16181b}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;background:#f3f4f7;padding-bottom:64px;position:relative;overflow-x:hidden}
.hd{position:sticky;top:0;z-index:60;background:#fff;padding:16px 18px 14px;border-bottom:1px solid #ecedf1}
.hd-row{display:flex;align-items:center;gap:11px}
.hd-ico{width:40px;height:40px;border-radius:12px;background:#1428A0;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hd-t{font-size:17px;font-weight:800;letter-spacing:-.01em;color:#16181b}
.hd-s{font-size:11px;color:#8a9099;margin-top:1px}
.hd-pill{margin-top:11px;background:#f1f3f6;border-radius:10px;padding:8px 11px;font-size:10px;color:#6b7280;line-height:1.6}
.hd-pill b{color:#1428A0}
.cat-wrap{padding:14px 16px 0;position:relative;z-index:50}
.cat-btn{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-radius:16px;background:#fff;border:1.5px solid #ecedf1;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,60,.04);transition:border-color .18s}
.cat-btn.open{border-color:#1259c3}
.cat-btn-l{display:flex;align-items:center;gap:11px}
.cat-ico{font-size:24px}.cat-nm{font-size:15px;font-weight:800;letter-spacing:-.01em}
.cat-dc{font-size:11.5px;color:#8a9099;margin-top:1px}
.cat-arr{font-size:11px;color:#aab0b8;transition:transform .2s;flex-shrink:0}
.cat-arr.open{transform:rotate(180deg)}
.drop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:16px;box-shadow:0 14px 36px rgba(20,30,60,.18);overflow:hidden;overflow-y:auto;max-height:320px;z-index:50;animation:dropIn .18s ease;display:none}
.drop-row{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid #f3f4f7;cursor:pointer;transition:background .12s}
.drop-row:last-child{border:none}
.drop-row:active,.drop-row:hover{background:#f7f8fa}
.drop-row.sel{background:#f2f6fd}
.drop-row-l{display:flex;align-items:center;gap:10px}
.drop-ico{font-size:19px;display:flex;align-items:center}.drop-nm{font-size:13.5px;font-weight:700}
/* 제품 심벌 — 크기는 담는 자리가 정하고, 색은 삼성 블루로 통일한다 */
.psym{width:1em;height:1em;display:block;color:#1428A0}
.drop-ico .psym{width:22px;height:22px}
.cat-ico .psym{width:24px;height:24px}
.todo-ico .psym{width:40px;height:40px;margin:0 auto;color:#9aa0a6;display:block}
.ov-ico .psym{width:28px;height:28px}
.ov-card.na-card .ov-ico .psym{color:#6366f1}
.st{font-size:9.5px;padding:3px 8px;border-radius:7px;font-weight:700}
.st-done{color:#16a34a;background:rgba(22,163,74,.1)}.st-todo{color:#9aa0a6;background:#f1f3f6}.st-na{color:#6366f1;background:rgba(99,102,241,.1)}
.bd{padding:0 16px}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 0 0}
.si{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.sl{font-size:10px;color:#9aa0a6;margin-bottom:4px}.sv{font-size:12.5px;font-weight:800;letter-spacing:-.01em}
.plan-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 0 0}
.plan-tab{position:relative;border:2px solid #ececf0;background:#fff;border-radius:16px;padding:16px 8px 13px;text-align:center;cursor:pointer;transition:all .18s}
.plan-tab.blue{border-color:#1259c3;background:#f2f6fd}
.plan-tab.teal{border-color:#0d9488;background:#eefaf8}
.ptag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:#fff;font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:9px;white-space:nowrap}
.pico{font-size:21px;margin-bottom:4px}.pnm{font-size:14px;font-weight:800}
.psub{font-size:10.5px;color:#9aa0a6;line-height:1.5;margin-top:3px}
.plan-tab.blue .psub,.plan-tab.teal .psub{color:#475569}
.type-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 0 0}
.type-tab{position:relative;border:2px solid #ececf0;background:#fff;border-radius:16px;padding:15px 8px 12px;text-align:center;cursor:pointer;transition:all .18s}
.type-tab.blue{border-color:#1259c3;background:#f2f6fd}
.type-tab.teal{border-color:#0d9488;background:#eefaf8}
.ttag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:#fff;font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:9px;white-space:nowrap}
.tnm{font-size:16px;font-weight:900;margin-bottom:3px}.tlbl{font-size:11px;font-weight:700;color:#6b7280;margin-bottom:3px}
.tmo{font-size:9px;color:#9aa0a6;line-height:1.4}
.vtabs{display:flex;gap:8px;padding:16px 0 0}
.vtab{flex:1;border:2px solid #ececf0;background:#fff;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .18s}
.vtab.on{border-color:#1259c3;background:#f2f6fd}
.vtn{font-size:12.5px;font-weight:800;margin-bottom:1px}.vtm{font-size:10px;color:#9aa0a6}
.vtab.on .vtm{color:#475569}
.card{background:#fff;border-radius:18px;overflow:hidden;margin-top:12px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.card-hd{padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.chd-t{font-size:13px;font-weight:800;color:#fff}
.chip{font-size:9px;padding:3px 9px;border-radius:8px;font-weight:700;background:rgba(255,255,255,.18);color:#fff}
.items{padding:4px 15px 13px}
.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f3f4f7;align-items:flex-start}
.item:last-child{border:none;padding-bottom:0}
.iico{font-size:13px;flex-shrink:0;margin-top:1px}
.inm{font-size:12.5px;font-weight:700;line-height:1.35;margin-bottom:2px}
.idet{font-size:11px;color:#8a9099;line-height:1.55}
.itag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:5px;margin-top:3px;font-weight:700;background:rgba(18,89,195,.1);color:#1259c3}
.note{margin:0 15px 13px;background:#f7f8fa;border-radius:10px;padding:9px 11px;font-size:10.5px;color:#6b7280;line-height:1.6;border-left:3px solid}
.cmp{background:#f7f8fa;border-radius:14px;padding:13px;margin-top:12px}
.cmp-t{font-size:10.5px;font-weight:700;color:#8a9099;margin-bottom:10px;text-align:center}
.cmp-g{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.cmp-hd{font-size:10px;font-weight:700;padding:4px 7px;border-radius:8px;margin-bottom:5px;text-align:center}
.cmp-i{font-size:10px;color:#8a9099;padding:2px 5px;line-height:1.4}
.cmp-i::before{content:'· '}
.vs{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#c8ccd4;padding-top:28px}
.be{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px}
.be-hd{font-size:11.5px;font-weight:700;margin-bottom:7px}
.be-i{font-size:11px;color:#6b7280;padding:2px 0;line-height:1.55}
.be-i::before{content:'· '}
.lgd{padding:13px}.lgd-t{font-size:10.5px;font-weight:700;color:#8a9099;margin-bottom:8px}
.lgd-i{font-size:11px;color:#6b7280;padding:2px 0;line-height:1.6}
.src-wrap{padding:4px 0 12px}
.src-row{display:flex;gap:7px;font-size:10px;color:#8a9099;padding:3px 0;line-height:1.5;align-items:flex-start}
.src-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px;background:#1428A0}
.src-dot2{background:#f59e0b}
.todo-card{background:#fff;border-radius:18px;padding:34px 22px;text-align:center;margin-top:14px;border:1.5px dashed #d7dae1}
.todo-ico{font-size:38px;margin-bottom:12px}
.todo-t{font-size:14px;font-weight:700;color:#6b7280;margin-bottom:8px}
.todo-s{font-size:11.5px;color:#9aa0a6;line-height:1.7}
.round-pills{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.round-pill{font-size:10px;background:#f1f3f6;color:#475569;border-radius:8px;padding:3px 9px;font-weight:600}
.round-pill.star{background:#fff8e1;color:#b45309}
.btm{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid #ecedf1;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#8a9099;z-index:100}
.btm b{color:#1428A0;font-weight:700}
/* === 모드 탭 === */
.mode-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#fff;border-bottom:1px solid #ecedf1;position:sticky;top:72px;z-index:55}
.mode-tab{padding:10px 4px 9px;text-align:center;cursor:pointer;font-size:9.5px;font-weight:700;color:#9aa0a6;border-bottom:2px solid transparent;transition:all .15s}
.mode-tab.on{color:#1428A0;border-bottom-color:#1428A0}
.mode-tab .mt-ico{font-size:16px;display:block;margin-bottom:2px}
/* === 전체품목 뷰 === */
/* 메인 화면의 블루패스는 카드 목록과 같은 좌우 여백을 쓴다 */
#overviewPane .bp-wrap{margin:14px 16px 0}
.ov-lead{padding:14px 16px 0;font-size:12.5px;font-weight:700;color:#16181b}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 14px}
.ov-card{background:#fff;border-radius:16px;padding:14px 12px;cursor:pointer;border:1.5px solid #ecedf1;transition:all .15s;position:relative}
.ov-card.done:hover{border-color:#1259c3;box-shadow:0 2px 12px rgba(18,89,195,.12)}
.ov-card.na-card{opacity:.65;cursor:default}
.ov-ico{font-size:26px;margin-bottom:7px}
.ov-nm{font-size:13px;font-weight:800;margin-bottom:5px}
.ov-pills{display:flex;flex-wrap:wrap;gap:4px}
.ov-pill{font-size:9px;padding:2px 7px;border-radius:6px;font-weight:700}
.ov-pill.p12{background:rgba(18,89,195,.1);color:#1259c3}
.ov-pill.p36{background:rgba(13,148,136,.1);color:#0d9488}
.ov-pill.pna{background:#f1f3f6;color:#9aa0a6}
/* === 타임라인 === */
.tl-ctrl{padding:14px 16px 0}
.tl-row{display:flex;gap:8px;margin-bottom:10px}
.tl-sel{flex:1;background:#fff;border:1.5px solid #ecedf1;border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;color:#16181b;font-weight:700;-webkit-appearance:none;appearance:none;cursor:pointer}
.tl-bar{padding:14px 16px;overflow-x:auto}
.tl-svg-wrap{min-width:600px}
.tl-list{padding:0 16px 16px}
.tl-item{background:#fff;border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.tl-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.tl-dot.p12c{background:linear-gradient(135deg,#1d4ed8,#7c3aed)}
.tl-dot.p36c{background:linear-gradient(135deg,#0d9488,#1d4ed8)}
.tl-round{font-size:12.5px;font-weight:800;margin-bottom:1px}
.tl-date{font-size:11px;color:#9aa0a6}
.tl-badge-sm{font-size:9px;padding:2px 7px;border-radius:6px;margin-top:3px;display:inline-block;font-weight:700;background:rgba(18,89,195,.1);color:#1259c3}
/* === 계산기 === */
.bar-wrap{margin-top:14px}
.bar-lbl{font-size:10px;opacity:.7;margin-bottom:5px}
.bar-track{background:rgba(255,255,255,.2);border-radius:8px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;transition:width .5s ease}
/* === 영업 멘트 카드 === */
.sell-card{background:#fff;border-radius:18px;margin-top:12px;overflow:hidden;border:1.5px solid #ecedf1}
.sell-hd{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;cursor:pointer;background:#fafbfd}
.sell-t{font-size:12.5px;font-weight:800;color:#16181b}
.sell-arr{font-size:11px;color:#aab0b8;transition:transform .2s}
.sell-arr.open{transform:rotate(180deg)}
.sell-body{display:none;padding:0 15px 14px}
.sell-pt{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #f3f4f7;align-items:flex-start}
.sell-pt:last-child{border:none}
.sell-num{width:20px;height:20px;border-radius:50%;background:#1428A0;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sell-text{font-size:11.5px;line-height:1.6;color:#374151}
.sell-obj{background:#f7f8fa;border-radius:12px;padding:11px 13px;margin-top:8px}
.sell-obj-t{font-size:10.5px;font-weight:700;color:#6b7280;margin-bottom:7px}
.sell-qa{margin-bottom:8px}
.sell-qa:last-child{margin-bottom:0}
.sell-q{font-size:11px;font-weight:700;color:#1259c3;margin-bottom:3px}
.sell-q::before{content:"Q. "}
.sell-a{font-size:11px;color:#6b7280;line-height:1.55}
.sell-a::before{content:"A. ";font-weight:700;color:#059669}

/* ── 블루패스 ───────────────────────────────────────────────────
   AI구독 케어를 열면 가장 먼저 보이는 자리. 삼성 블루를 바탕으로 깔아
   "다른 구독과 다른 지점"이라는 것을 색으로도 먼저 말한다. */
.bp-wrap{margin:14px 0 4px;background:linear-gradient(160deg,#1428A0 0%,#0d1b6b 100%);color:#fff;
  border-radius:18px;padding:18px 16px 14px}
.bp-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.bp-badge{font-size:10px;font-weight:800;letter-spacing:.09em;background:#fff;color:#1428A0;
  padding:4px 9px;border-radius:6px;flex-shrink:0}
.bp-hh{font-size:15px;font-weight:800;line-height:1.35}
.bp-sub{font-size:11.5px;color:#c7d0f5;line-height:1.55;margin-bottom:13px}
.bp-g{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bp-i{display:flex;gap:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  border-radius:13px;padding:11px 11px 10px}
.bp-ic{width:34px;height:34px;border-radius:10px;background:#fff;color:#1428A0;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
.bp-ic svg{width:20px;height:20px;display:block}
.bp-tx{min-width:0}
.bp-t{font-size:12.5px;font-weight:800;line-height:1.35}
.bp-s{font-size:10.5px;color:#a9b6ef;margin-top:1px;line-height:1.4}
.bp-d{font-size:11px;color:#e6eaff;line-height:1.5;margin-top:5px}
.bp-w{font-size:9.5px;color:#ffd9a8;line-height:1.45;margin-top:5px}
.bp-extra{margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,.2)}
.bp-eh{font-size:11.5px;font-weight:800;color:#ffd9a8;margin-bottom:8px}
.bp-gate{margin-top:11px;background:rgba(0,0,0,.22);border-radius:10px;padding:9px 11px;
  font-size:10.5px;color:#ffd9a8;line-height:1.55;font-weight:700}
.bp-src{margin-top:8px;font-size:9.5px;color:#9fabe6;line-height:1.5}
@media(max-width:560px){.bp-g{grid-template-columns:1fr}
  .bp-wrap{padding:15px 13px 12px}.bp-hh{font-size:14px}}

/* ── 방문케어 현장 사진 ──────────────────────────────────────────
   글만 있으면 "종합점검·케어"가 무슨 일인지 상담사도 고객도 모른다.
   삼성닷컴 구독 서비스 페이지의 실제 작업 사진을 라벨과 함께 보여 준다. */
.cimg-wrap{margin:14px 0 4px}
.cimg-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:#16181b;margin-bottom:4px}
.cimg-s{font-size:12px;color:#6b7280;margin-bottom:10px;line-height:1.5}
.cimg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.cimg{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff}
.cimg img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f3f4f6}
.cimg .cap{padding:7px 8px;font-size:11.5px;font-weight:600;color:#374151;line-height:1.35;text-align:center}
@media(max-width:520px){.cimg-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
  .cimg .cap{font-size:11px;padding:6px}}

/* ── AI구독 케어 혜택(첫 화면) ─────────────────────────────────
   상담은 "이 제품 케어가 몇 회차냐"가 아니라 "구독하면 뭘 받느냐"로 시작한다.
   회차표보다 **먼저** 보여야 한다(2026-08-10 사용자 요청). */
.bnf{background:linear-gradient(135deg,#1428A0,#2B44D0);border-radius:16px;padding:16px 17px;margin-bottom:12px;color:#fff}
.bnf-h{font-size:15px;font-weight:800;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.bnf-s{font-size:11.5px;opacity:.82;line-height:1.5;margin-bottom:12px}
.bnf-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.bnf-i{background:rgba(255,255,255,.13);border-radius:11px;padding:10px 11px}
.bnf-i .t{font-size:12.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.bnf-i .d{font-size:11px;opacity:.85;line-height:1.5}
.bnf-i .k{font-size:17px;font-weight:800;letter-spacing:-.3px}
.bnf-n{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);
  font-size:10.5px;opacity:.8;line-height:1.6}
@media(max-width:520px){.bnf-g{grid-template-columns:repeat(2,1fr);gap:7px}
  .bnf-i{padding:9px}.bnf-i .t{font-size:11.5px}.bnf-i .d{font-size:10.5px}}
</style>
</head>

</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="hd-row">
      <div class="hd-ico">🛡️</div>
      <div>
        <div class="hd-t">삼성 AI구독 케어 안내</div>
        <div class="hd-s">전 품목 케어 서비스 정보 · 12개월형 / 36개월형</div>
      </div>
    </div>
    <div class="hd-pill">📎 <b>삼성닷컴 공식</b> + <b>AI구독클럽 브로슈어 2026.06</b> 기반 &nbsp;|&nbsp; ✅ 공식확인 &nbsp;🔵 현장확인필요</div>
  </div>
<div class="mode-tabs" id="modeTabs">
  <div class="mode-tab" data-mode="care" onclick="setMode('care')"><span class="mt-ico">🛡️</span>케어정보</div>
  <div class="mode-tab on" data-mode="overview" onclick="setMode('overview')"><span class="mt-ico">🏠</span>전체품목</div>
  <div class="mode-tab" data-mode="timeline" onclick="setMode('timeline')"><span class="mt-ico">📅</span>타임라인</div>
</div>
<div id="overviewPane" style="display:none"></div>

<script>
/* ── 상태 ── */
let curCat = 'aircon', curPlan = '12', curTypeA = true, curRound = 0, isOpen = false;

/* ────────────────── 헬퍼 ────────────────── */
function gradStyle(g){ return 'background:' + g; }

function stBadge(st){
  if(st==='done') return '<span class="st st-done">완료</span>';
  if(st==='na')   return '<span class="st st-na">자가관리</span>';
  return '<span class="st st-todo">분석예정</span>';
}

function itemsHtml(list){
  return list.map(it =>
    `<div class="item">
      <span class="iico">${it.ico}</span>
      <div>
        <div class="inm">${it.nm}</div>
        <div class="idet">${it.det}</div>
        <span class="itag">${it.tt}</span>
      </div>
    </div>`
  ).join('');
}

function noteHtml(n){
  if(!n) return '';
  return `<div class="note" style="border-color:${n.c}">ℹ️ ${n.t.replace(/\n/g,'<br>')}</div>`;
}

/* ────────────────── 드롭다운 ────────────────── */
function buildDropHtml(){
  return PRODUCTS.map(p =>
    `<div class="drop-row${p.key===curCat?' sel':''}" data-key="${p.key}">
      <div class="drop-row-l">
        <span class="drop-ico">${prodIcon(p.key, p.icon)}</span>
        <span class="drop-nm">${p.name}</span>
      </div>
      ${stBadge(p.st)}
    </div>`
  ).join('');
}

function openDrop(){
  isOpen = true;
  document.getElementById('catBtn').classList.add('open');
  document.getElementById('catArr').classList.add('open');
  document.getElementById('catDrop').style.display = 'block';
}
function closeDrop(){
  isOpen = false;
  document.getElementById('catBtn').classList.remove('open');
  document.getElementById('catArr').classList.remove('open');
  document.getElementById('catDrop').style.display = 'none';
}

/* ────────────────── 요약 타일 ────────────────── */
function buildSummary(d){
  if(d.onlyPlan === '12') return [
    {l:'계약기간', v:d.contract},
    {l:'총 방문',  v:d.total12},
    {l:'방문 주기',v:'매 12개월'}
  ];
  if(d.onlyPlan === '36') return [
    {l:'계약기간', v:d.contract},
    {l:'총 방문',  v:d.total36},
    {l:'방문 주기',v:'매 36개월'}
  ];
  return [
    {l:'계약기간', v:d.contract},
    {l:'12개월형', v:d.total12},
    {l:'36개월형', v:d.total36}
  ];
}

/* ────────────────── 12개월형 ────────────────── */
function render12(d){
  /* rounds[] 배열 구조 (dish·airpur_s·purifier_under 등) → render36과 동일 방식 */
  if(d.plan12.rounds){
    const rr = d.plan12.rounds;
    let out = '';
    out += '<div class="vtabs">';
    rr.forEach((r,i) => {
      out += `<div class="vtab${curRound===i?' on':''}" data-round="${i}">
        <div class="vtn">${r.label}</div>
        <div class="vtm">${r.month}</div>
      </div>`;
    });
    out += '</div>';
    const cr = rr[curRound];
    out += `<div class="card">
      <div class="card-hd" style="${gradStyle(cr.grad)}">
        <span class="chd-t">🔧 ${cr.label} — ${cr.month}</span>
        <span class="chip">${cr.badge}</span>
      </div>
      <div class="items">${itemsHtml(cr.items)}</div>
      ${noteHtml(cr.note)}
    </div>`;
    return out;
  }

  const isSingle = d.plan12.singleType;
  const tA = d.plan12.typeA;
  const tB = isSingle ? null : d.plan12.typeB;
  const ct = isSingle ? tA : (curTypeA ? tA : tB);
  let out = '';

  if(!isSingle){
    // A/B 타입 탭
    out += '<div class="type-tabs">';
    [{t:tA,isA:true},{t:tB,isA:false}].forEach(({t,isA})=>{
      const active = isA ? curTypeA : !curTypeA;
      const cls    = active ? (isA?'blue':'teal') : '';
      const tagBg  = isA
        ? 'linear-gradient(90deg,#1d4ed8,#3730a3)'
        : 'linear-gradient(90deg,#0d9488,#1d4ed8)';
      const nmColor = isA ? '#1259c3' : '#0d9488';
      out += `<div class="type-tab ${cls}" data-type="${isA?'A':'B'}">
        <div class="ttag" style="background:${tagBg}">${t.badge}</div>
        <div class="tnm" style="color:${nmColor}">${isA?'A타입':'B타입'}</div>
        <div class="tlbl">${t.sub}</div>
        <div class="tmo">${t.rounds.join(' · ')}</div>
      </div>`;
    });
    out += '</div>';

    // A/B 비교 카드
    out += `<div class="card"><div class="cmp">
      <div class="cmp-t">📊 12개월형 방문 구성</div>
      <div class="cmp-g">
        <div>
          <div class="cmp-hd" style="background:rgba(18,89,195,.1);color:#1259c3">A타입 (4회)</div>
          ${tA.rounds.map(r=>`<div class="cmp-i" style="color:${curTypeA?'#16181b':'#9aa0a6'}">${r}</div>`).join('')}
          <div style="font-size:9px;color:#1259c3;padding:3px 5px">→ 기본점검·케어</div>
        </div>
        <div class="vs">VS</div>
        <div>
          <div class="cmp-hd" style="background:rgba(13,148,136,.1);color:#0d9488">B타입 (2회)</div>
          ${tB.rounds.map(r=>`<div class="cmp-i" style="color:${!curTypeA?'#16181b':'#9aa0a6'}">${r}</div>`).join('')}
          <div style="font-size:9px;color:#0d9488;padding:3px 5px">→ 기본 세척</div>
        </div>
      </div>
    </div></div>`;
  } else {
    // 단일 타입 — 회차 pill 요약
    out += `<div class="card"><div style="padding:13px">
      <div class="cmp-t" style="text-align:left;margin-bottom:8px">📊 12개월형 방문 구성 (${tA.rounds.length}회)</div>
      <div class="round-pills">
        ${tA.rounds.map(r=>`<span class="round-pill${r.includes('★')?' star':''}">${r}</span>`).join('')}
      </div>
      <div style="font-size:9px;color:#1259c3;margin-top:4px">→ ${tA.sub} (전 회차 동일)</div>
    </div></div>`;
  }

  // 서비스 상세 카드
  out += `<div class="card">
    <div class="card-hd" style="${gradStyle(ct.grad)}">
      <span class="chd-t">🔧 ${ct.label} — ${ct.sub}</span>
      <span class="chip">${ct.badge}</span>
    </div>
    <div class="items">${itemsHtml(ct.items)}</div>
    ${noteHtml(ct.note)}
  </div>`;
  return out;
}

/* ────────────────── 36개월형 ────────────────── */
function render36(d){
  const rr = d.plan36.rounds;
  let out = '';

  // 회차 탭
  out += '<div class="vtabs">';
  rr.forEach((r,i) => {

  if(rr.length >= 2){
    out += `<div class="card"><div class="cmp">

  }
  return out;
}

function buildBenefits(d, key){
  const inc = d.includes || [];
  const has = (re)=> inc.find(x=>re.test(x));
  const yrs = (String(d.contract||'').match(/(\d+)\s*개월/)||[])[1];
  const yr = yrs ? Math.round(+yrs/12) : null;

  const tiles = [];
  const repair = has(/무상수리/);
  if (repair) tiles.push({ t:'무상수리', k: yr? `최대 ${yr}년` : '구독 기간 내', d: repair.replace(/무상수리서비스\s*/,'') || '구독 기간 전체' });
  /*
   * 방문 주기를 고를 수 있는 제품은 회차가 둘이다(예: 식기세척기 12개월형 6회 / 36개월형 2회).
   * 한쪽만 띄우면 상담사가 나머지를 못 보고 "2회짜리"로 안내한다 — buildSummary 와 같은 기준으로 나눈다.
   */
  const n = (v)=> String(v).replace(/^총\s*/,'');
  if (d.onlyPlan === '12' && d.total12)      tiles.push({ t:'방문케어', k:n(d.total12), d:'매 12개월 · 전문가 방문 점검·세척' });
  else if (d.onlyPlan === '36' && d.total36) tiles.push({ t:'방문케어', k:n(d.total36), d:'매 36개월 · 전문가 방문 점검·세척' });
  else if (d.total12 && d.total36)           tiles.push({ t:'방문케어', k:'주기 선택', d:`12개월형 ${n(d.total12)} · 36개월형 ${n(d.total36)}` });
  else if (d.total12 || d.total36)           tiles.push({ t:'방문케어', k:n(d.total12 || d.total36), d:'전문가가 방문해 점검·세척' });
  const fee = has(/공임비/);
  if (fee) tiles.push({ t:'공임비 무상', k:'0원', d:'수리 시 출장·기술료 부담 없음' });
  const self = has(/셀프케어|소모품/);
  if (self) tiles.push({ t:'셀프케어', k:'정기 배송', d: self });
  const re2 = has(/재설치/);
  if (re2) tiles.push({ t:'재설치', k:'1회', d:'이사 등으로 옮길 때' });
  const sched = has(/일정 변경/);
  if (sched) tiles.push({ t:'일정 변경', k:'가능', d: sched.replace(/일정 변경 가능\s*/,'') || '' });

  if (!tiles.length) return '';
  const exc = (d.excludes||[]).slice(0,3).join(' · ');
  return `
  <div class="bnf">
    <div class="bnf-h">🎁 AI구독으로 ${d.name} 구매 시 받는 것</div>
    <div class="bnf-s">계약 ${d.contract||'-'} 기준 · 아래는 구독료에 포함된 서비스입니다</div>
    <div class="bnf-g">
      ${tiles.map(t=>`<div class="bnf-i"><div class="t">${t.t}</div><div class="k">${t.k}</div><div class="d">${t.d}</div></div>`).join('')}
    </div>
    ${exc ? `<div class="bnf-n">제외·주의 — ${exc}</div>` : ''}
  </div>`;
}

  document.querySelectorAll('.plan-tab').forEach(el => {

  });
  document.querySelectorAll('.type-tab').forEach(el => {

    });

let curMode = 'care';

function setMode(m){
  curMode = m;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('on', t.dataset.mode === m));
  document.querySelector('.cat-wrap').style.display = m==='care' ? '' : 'none';
  document.getElementById('body').style.display = m==='care' ? '' : 'none';
  document.getElementById('overviewPane').style.display = m==='overview' ? '' : 'none';
  document.getElementById('timelinePane').style.display = m==='timeline' ? '' : 'none';
  if(m==='overview') renderOverview();
  if(m==='timeline') renderTimeline();
}

/* ═══════════════ OVERVIEW ═══════════════ */
/*
 * 메인 화면 — 블루패스를 먼저 보여 주고, 그 아래에서 품목을 고르면 케어 내용으로 들어간다.
 *
 * 블루패스는 제품과 무관하게 구독 전체에 붙는 혜택이라 제품 상세마다 반복하면
 * 같은 카드를 열여섯 번 보게 된다. 여기 한 곳에만 둔다.
 */
function renderOverview(){
  const el = document.getElementById('overviewPane');
  let html = buildBluePass(null);
  html += '<div class="ov-lead">품목을 고르면 그 제품의 케어 내용을 볼 수 있습니다</div>';
  html += '<div class="ov-grid">';
  PRODUCTS.forEach(p => {
    const d = DATA[p.key];
    const isDone = p.st==='done';
    let pills = '';
    if(isDone && d){
      if(d.onlyPlan==='12') pills += '<span class="ov-pill p12">12개월형</span>';
      else if(d.onlyPlan==='36') pills += '<span class="ov-pill p36">36개월형</span>';
      else {
        if(d.plan12) pills += '<span class="ov-pill p12">12개월형</span>';
        if(d.plan36) pills += '<span class="ov-pill p36">36개월형</span>';
      }
    } else {
      pills = '<span class="ov-pill pna">자가관리</span>';
    }
    html += '<div class="ov-card ' + (isDone?'done':'na-card') + '" ' + (isDone?'onclick="switchToCare(\''+p.key+'\')"':'') + '>' +
      '<div class="ov-ico">' + prodIcon(p.key, p.icon) + '</div>' +
      '<div class="ov-nm">' + p.name + '</div>' +
      '<div class="ov-pills">' + pills + '</div>' +
      '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function switchToCare(key){
  const idx = PRODUCTS.findIndex(p=>p.key===key);
  if(idx>=0){
    curCat = key;
    curPlan = DATA[key]?.onlyPlan || '12';
    curRound = 0;
    curTypeA = true;
  }
  setMode('care');
  render();
}

/* ═══════════════ TIMELINE ═══════════════ */
const TL_MONTHS = {
  aircon:   {12:[12,24,48,60], '12b':[36,72], 36:[36,72]},
  aicombo:  {12:[12,24,36,48,60,72], 36:[36,72]},
  washer:   {12:[12,24,36,48,60,72], 36:[36,72]},
  dryer:    {12:[12,24,36,48,60,72], 36:[36,72]},
  fridge:   {12:[36,72], 36:[36,72]},
  kimchi:   {12:[36,72], 36:[36,72]},
  dish:     {12:[12,24,36,48,60,72], 36:[12,24,36,48,60,72]},
  dresser:  {12:[12,24,36,48,60,72]},
  airpur_reusable:{12:[12,24,36,48,60,72]},
  airpur_s:       {12:[12,24,36,48,60,72]},
  purifier_under: {12:[12,24,36,48,60,72]},
  vacuum:         {12:[12,24,36,48,60,72]},
};

let tlKey='aircon', tlPlan='12', tlYear=2026, tlMonth=7;

function renderTimeline(){
  const done = PRODUCTS.filter(p=>p.st==='done');
  const d = DATA[tlKey]||{};
  const plans = [];
  if(!d.onlyPlan||d.onlyPlan==='12') plans.push('12');
  if(d.plan36 && (!d.onlyPlan||d.onlyPlan==='36')) plans.push('36');

  // <option> 은 텍스트만 담는다 — SVG 심벌을 못 넣으므로 제품명만 쓴다
  let prodOpts = done.map(p=>'<option value="'+p.key+'" '+(p.key===tlKey?'selected':'')+'>'+p.name+'</option>').join('');
  let planOpts = plans.map(pl=>'<option value="'+pl+'" '+(pl===tlPlan?'selected':'')+'>매 '+pl+'개월형</option>').join('');
  let yearOpts = [2024,2025,2026,2027,2028,2029,2030].map(y=>'<option value="'+y+'" '+(y===tlYear?'selected':'')+'>'+y+'년</option>').join('');
  let monthOpts = Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'" '+((i+1)===tlMonth?'selected':'')+'>'+(i+1)+'월</option>').join('');

  const months = ((TL_MONTHS[tlKey]||{})[tlPlan]) || [];
  const now = new Date();
  const startDate = new Date(tlYear, tlMonth-1, 1);
  const nowOffsetMonths = Math.max(0, (now.getFullYear()-startDate.getFullYear())*12 + (now.getMonth()-startDate.getMonth()));

  const SVG_W = 680, SVG_H = 80, PAD = 30, INNER = SVG_W - PAD*2;
  const MON_W = INNER / 72;
  let svgDots = '';
  for(let i=0;i<=72;i+=6){
    const x = PAD + i*MON_W;
    svgDots += '<text x="'+x+'" y="'+(SVG_H-5)+'" font-size="9" fill="#aab0b8" text-anchor="middle">'+i+'M</text>';
    svgDots += '<line x1="'+x+'" y1="12" x2="'+x+'" y2="'+(SVG_H-18)+'" stroke="#ecedf1" stroke-width="1"/>';
  }
  if(nowOffsetMonths<=72){
    const nx = PAD + nowOffsetMonths*MON_W;
    svgDots += '<line x1="'+nx+'" y1="8" x2="'+nx+'" y2="'+(SVG_H-20)+'" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>';
    svgDots += '<text x="'+nx+'" y="7" font-size="8" fill="#ef4444" text-anchor="middle">현재</text>';
  }
  svgDots += '<line x1="'+PAD+'" y1="40" x2="'+(SVG_W-PAD)+'" y2="40" stroke="#dde1e9" stroke-width="2"/>';
  months.forEach((m,i)=>{
    const x = PAD + m*MON_W;
    const col = tlPlan==='12' ? '#1d4ed8' : '#0d9488';
    svgDots += '<circle cx="'+x+'" cy="40" r="12" fill="'+col+'"/>';
    svgDots += '<text x="'+x+'" y="44" font-size="9" fill="#fff" text-anchor="middle" font-weight="800">'+(i+1)+'회</text>';
  });
  const svg = '<svg viewBox="0 0 '+SVG_W+' '+SVG_H+'" width="100%" style="min-width:600px">'+svgDots+'</svg>';

  let listHtml = '';
  months.forEach((m,i)=>{
    const dt = new Date(tlYear, tlMonth-1+m, 1);
    const isPast = dt < now;
    const col = tlPlan==='12'?'p12c':'p36c';
    listHtml += '<div class="tl-item" style="'+(isPast?'opacity:.5':'')+'">' +
      '<div class="tl-dot '+col+'">'+(i+1)+'</div>' +
      '<div>' +
        '<div class="tl-round">'+(i+1)+'회차 방문케어 '+(isPast?'✓ 완료':'')+'</div>' +
        '<div class="tl-date">'+dt.getFullYear()+'년 '+(dt.getMonth()+1)+'월 (구독 '+m+'개월차)</div>' +
      '</div></div>';
  });
  if(!listHtml) listHtml = '<div style="text-align:center;color:#9aa0a6;font-size:12px;padding:20px">선택한 플랜에 타임라인 정보가 없습니다</div>';

  document.getElementById('timelinePane').innerHTML =
    '<div class="tl-ctrl">' +
      '<div class="tl-row"><select class="tl-sel" onchange="tlKey=this.value;renderTimeline()">'+prodOpts+'</select>' +
      '<select class="tl-sel" style="flex:.6" onchange="tlPlan=this.value;renderTimeline()">'+planOpts+'</select></div>' +
      '<div class="tl-row"><div style="font-size:11px;color:#8a9099;padding-bottom:6px;font-weight:600">📆 구독 시작월</div></div>' +
      '<div class="tl-row"><select class="tl-sel" onchange="tlYear=+this.value;renderTimeline()">'+yearOpts+'</select>' +
      '<select class="tl-sel" style="flex:.5" onchange="tlMonth=+this.value;renderTimeline()">'+monthOpts+'</select></div>' +
    '</div>' +
    '<div class="tl-bar" style="overflow-x:auto">'+svg+'</div>' +
    '<div style="padding:0 16px 6px;font-size:10px;color:#9aa0a6">● 빨간 점선 = 오늘('+now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+') 기준</div>' +
    '<div class="tl-list">'+listHtml+'</div>';
}


/* ═══════════════ SELLING POINTS RENDER ═══════════════ */
function renderSelling(key){
  if(!SELLING || !SELLING[key]) return '';
  const s = SELLING[key];
  if(!s||!s.points) return '';
  const pts = s.points.map((p,i)=>'<div class="sell-pt"><div class="sell-num">'+(i+1)+'</div><div class="sell-text">'+p+'</div></div>').join('');
  const qas = (s.objections||[]).map(o=>'<div class="sell-qa"><div class="sell-q">'+o.q+'</div><div class="sell-a">'+o.a+'</div></div>').join('');
  const objSec = qas ? '<div class="sell-obj"><div class="sell-obj-t">💬 자주 묻는 반론 대응</div>'+qas+'</div>' : '';
  return '<div class="sell-card" id="sellCard">' +
    '<div class="sell-hd" onclick="toggleSell()">' +
      '<div class="sell-t">🎯 영업 핵심 멘트</div>' +
      '<span class="sell-arr" id="sellArr">▼</span>' +
    '</div>' +
    '<div class="sell-body" id="sellBody">'+pts+objSec+'</div>' +
    '</div>';
}

let _sellOpen = false;
function toggleSell(){
  _sellOpen = !_sellOpen;
  const b = document.getElementById('sellBody');
  const a = document.getElementById('sellArr');
  if(b) b.style.display = _sellOpen?'block':'none';
  if(a) a.classList.toggle('open',_sellOpen);
}
</script>
