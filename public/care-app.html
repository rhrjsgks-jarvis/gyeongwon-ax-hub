   한 개를 고르는 화면은 네 앱이 전부 이 값을 쓴다 — 칸 최소폭 104px(좁은 화면 90px) ·
   간격 7px · 모서리 11px · 안여백 9px 6px · 글자 12.5px · 심벌 22px · 가운데 정렬.
   한쪽만 고치지 말 것.

   예전에는 혼자 **2열 고정 · 모서리 16 · 글자 16px · 왼쪽 정렬**이라, 같은 "품목 고르기"인데
   폰에서 한 줄에 2개만 보여 16품목이 8줄이 됐다(다른 앱은 3열).

   **다만 요금제 표시(12/36개월형)는 살린다.** 이 화면이 다른 셋과 다른 점이 그것 하나이고,
   맨 타일로 눌러 담으면 상담에서 가장 먼저 보는 정보가 사라진다. */

.ov-ico{display:block;margin-bottom:4px;line-height:1}
.ov-nm{font-size:12.5px;font-weight:600;margin-bottom:4px}
/* 요금제 표시는 타일 가운데에 모은다 — 왼쪽에 붙으면 가운데 정렬한 이름과 축이 어긋난다 */
.ov-pills{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
@media(max-width:520px){.ov-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}}
.ov-pill{font-size:9px;padding:2px 7px;border-radius:6px;font-weight:700}
.ov-pill.p12{background:rgba(18,89,195,.1);color:#1259c3}
.ov-pill.p36{background:rgba(13,148,136,.1);color:#0D1B7A}
.ov-pill.pna{background:#f1f3f6;color:#9aa0a6}
/* === 타임라인 === */
.tl-ctrl{padding:14px 16px 0}
.tl-row{display:flex;gap:8px;margin-bottom:10px}
.tl-sel{flex:1;background:#fff;border:1.5px solid #ecedf1;border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;color:#16181b;font-weight:700;-webkit-appearance:none;appearance:none;cursor:pointer}
/*
 * 방문 시점만 **균등 간격**으로 찍는다. 예전에는 0~72개월 축을 비례로 그렸는데
 * 두 가지가 나빴다 — ①축이 72개월 고정이라 12개월형(6회가 12~72M 에 고르게 오는
 * 제품 말고) 짧은 계약에서는 오른쪽이 통째로 비고 ②`min-width:600px` 이라 폰에서
 * 가로 스크롤이 생겼다. 상담에서 필요한 것은 "몇 개월 뒤가 몇 회차인가"이지
 * 시간 축 위의 비례 위치가 아니다(2026-08-13 사용자 요청: *"실제 개월수 반영된
 * 수치는 필요없고 방문시점만 표기되어도 문제가없을것같습니다"*).
 * 회차는 최대 6개라(전 제품 실측) 균등 간격이면 폰에서도 넘치지 않는다.
 */
.tl-bar{padding:14px 16px 6px}
.tl-track{display:flex;position:relative}
/* 잇는 선은 첫 점과 끝 점의 **중심 사이**만 긋는다 — 칸 너비의 절반씩 안으로 들인다 */
.tl-track::before{content:"";position:absolute;top:13px;height:2px;background:#e3e6ec;
  left:calc(50% / var(--n));right:calc(50% / var(--n))}
.tl-stop{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.tl-pt{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;color:#fff;background:#1428A0}
.tl-track.p36 .tl-pt{background:#0D1B7A}
.tl-mo{font-size:10px;font-weight:700;color:#6b7280;white-space:nowrap}
/* 지난 방문은 흐리게 — 예전의 빨간 '현재' 세로선이 하던 일을 대신한다(축이 없어도 갈린다) */
.tl-stop.past .tl-pt{background:#ccd0d8}
.tl-stop.past .tl-mo{color:#b0b5be}
.tl-list{padding:0 16px 16px}
.tl-item{background:#fff;border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.tl-body{min-width:0;flex:1}
.tl-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.tl-dot.p12c{background:linear-gradient(135deg,#1428A0,#2563EB)}
.tl-dot.p36c{background:linear-gradient(135deg,#0D1B7A,#1428A0)}
.tl-round{font-size:12.5px;font-weight:800;margin-bottom:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-date{font-size:11px;color:#9aa0a6}
/* 케어 종류 — 회차마다 무엇이 나가는지가 한눈에 갈려야 한다(AI콤보 종합점검 ↔ 초음파 세척) */
.tl-kind{background:#EEF2FF;color:#1428A0;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:800}
.tl-done{color:#0D1B7A;font-size:10.5px;font-weight:700}
.tl-items{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.tl-items li{display:flex;flex-direction:column;padding-left:9px;border-left:2px solid #DCE4FB}
.tl-items b{font-size:11.5px;font-weight:700;color:#16181b}
.tl-items span{font-size:10.5px;color:#8a9099;line-height:1.45;margin-top:1px}
.tl-note{margin-top:7px;background:#F4F6FB;border-radius:8px;padding:7px 9px;font-size:10.5px;color:#5b6270;line-height:1.5}
/* === 계산기 === */
/* === 영업 멘트 카드 === */
.sell-card{background:#fff;border-radius:18px;margin-top:12px;overflow:hidden;border:1.5px solid #ecedf1}
.sell-hd{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;cursor:pointer;background:#fafbfd}
.sell-t{font-size:12.5px;font-weight:800;color:#16181b}
.sell-arr{font-size:11px;color:#aab0b8;transition:transform .2s}
.sell-arr.open{transform:rotate(180deg)}
.sell-body{display:none;padding:0 15px 14px}
.sell-pt{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #f3f4f7;align-items:flex-start}
.sell-pt:last-child{border:none}
.sell-num{width:20px;height:20px;border-radius:50%;background:#1428A0;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sell-text{font-size:11.5px;line-height:1.6;color:#374151}
.sell-obj{background:#f7f8fa;border-radius:12px;padding:11px 13px;margin-top:8px}
.sell-obj-t{font-size:10.5px;font-weight:700;color:#6b7280;margin-bottom:7px}
.sell-qa{margin-bottom:8px}
.sell-qa:last-child{margin-bottom:0}
.sell-q{font-size:11px;font-weight:700;color:#1259c3;margin-bottom:3px}
.sell-q::before{content:"Q. "}
.sell-a{font-size:11px;color:#6b7280;line-height:1.55}
.sell-a::before{content:"A. ";font-weight:700;color:#059669}

/* ── 블루패스 ───────────────────────────────────────────────────
   AI구독 케어를 열면 가장 먼저 보이는 자리. 삼성 블루를 바탕으로 깔아
   "다른 구독과 다른 지점"이라는 것을 색으로도 먼저 말한다. */
.bp-wrap{margin:14px 0 4px;background:linear-gradient(160deg,#1428A0 0%,#0d1b6b 100%);color:#fff;
  border-radius:18px;padding:18px 16px 14px}
.bp-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.bp-badge{font-size:10px;font-weight:800;letter-spacing:.09em;background:#fff;color:#1428A0;
  padding:4px 9px;border-radius:6px;flex-shrink:0}
.bp-hh{font-size:15px;font-weight:800;line-height:1.35}
.bp-sub{font-size:11.5px;color:#c7d0f5;line-height:1.55;margin-bottom:13px}
.bp-g{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bp-i{display:flex;gap:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  border-radius:13px;padding:11px 11px 10px}
/* 원문 타일 그림 — 카드 위에 띠로 얹는다(배경으로 깔면 남색 위 흰 글자가 안 읽힌다) */
.bp-i.haspic{display:block;padding:0;overflow:hidden}
.bp-i.haspic .bp-img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;object-position:center 35%}
.bp-i.haspic .bp-ic{position:absolute;margin:-42px 0 0 9px;width:30px;height:30px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.bp-i.haspic .bp-ic svg{width:17px;height:17px}
.bp-i.haspic .bp-tx{padding:15px 10px 11px;margin-top:-2px}
/* 넓은 화면에서는 사진이 너무 커지지 않게 위아래를 조금 잘라 준다 */
@media (min-width:720px){ .bp-i.haspic .bp-img{aspect-ratio:2/1} }
.bp-ic{width:34px;height:34px;border-radius:10px;background:#fff;color:#1428A0;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
.bp-ic svg{width:20px;height:20px;display:block}
.bp-tx{min-width:0}
.bp-t{font-size:12.5px;font-weight:800;line-height:1.35}
.bp-s{font-size:10.5px;color:#a9b6ef;margin-top:1px;line-height:1.4}
.bp-d{font-size:11px;color:#e6eaff;line-height:1.5;margin-top:5px}
.bp-eh{font-size:11.5px;font-weight:800;color:#ffd9a8;margin-bottom:8px}
.bp-gate{margin-top:11px;background:rgba(0,0,0,.22);border-radius:10px;padding:9px 11px;
  font-size:10.5px;color:#ffd9a8;line-height:1.55;font-weight:700}
.bp-src{margin-top:8px;font-size:9.5px;color:#9fabe6;line-height:1.5}
.bp-sub b{color:#fff;font-weight:800}
/* 번호 — 상담사가 "여섯 가지 중 세 번째"로 짚어 말할 수 있게 */
.bp-n{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:5px;background:rgba(255,255,255,.9);color:#1428A0;font-size:9.5px;font-weight:900;
  margin-right:6px;vertical-align:1px}
/* 조건 — 대상/필요/제외/비용을 라벨로 갈라 적는다. 한 줄로 뭉치면 상담 중에 못 읽는다 */
.bp-cond{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.14);
  display:flex;flex-direction:column;gap:4px}
.bp-c{display:flex;gap:7px;align-items:flex-start}
.bp-cl{flex:0 0 auto;min-width:29px;text-align:center;border-radius:5px;padding:1px 5px;
  font-size:9px;font-weight:800;line-height:1.5}
.bp-cl.ok{background:rgba(255,255,255,.16);color:#dbe3ff}
.bp-cl.need{background:rgba(199,210,254,.18);color:#C7D2FE}
.bp-cl.warn{background:rgba(251,191,36,.16);color:#ffd9a8}
.bp-cv{font-size:10px;line-height:1.5;color:#dfe5ff;min-width:0}
/*
 * 블루패스 전용 탭은 1단이다 — 조건까지 펼치면 2단에서는 글자가 뭉갠다.
 * 자세히 보여 주는 것이 이 화면의 목적이므로 폭을 글에 준다.
 */
#bluepassPane .bp-wrap{margin:14px 16px 4px}
#bluepassPane .bp-g{grid-template-columns:1fr 1fr}
#bluepassPane .bp-t{font-size:13.5px}
#bluepassPane .bp-d{font-size:11.5px}
#bluepassPane .bp-cv{font-size:10.5px}
@media(max-width:560px){.bp-g{grid-template-columns:1fr 1fr;gap:8px}
  .bp-wrap{padding:15px 13px 12px}.bp-hh{font-size:14px}
  #bluepassPane .bp-wrap{margin:14px 12px 4px}}

/* ── 방문케어 현장 사진 ──────────────────────────────────────────
   글만 있으면 "종합점검·케어"가 무슨 일인지 상담사도 고객도 모른다.
   삼성닷컴 구독 서비스 페이지의 실제 작업 사진을 라벨과 함께 보여 준다. */
.cimg-wrap{margin:14px 0 4px}
.cimg-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:#16181b;margin-bottom:4px}
.cimg-s{font-size:12px;color:#6b7280;margin-bottom:10px;line-height:1.5}
.cimg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.cimg{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff}
.cimg img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f3f4f6}
.cimg .cap{padding:7px 8px;font-size:11.5px;font-weight:600;color:#374151;line-height:1.35;text-align:center}
@media(max-width:520px){.cimg-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
  .cimg .cap{font-size:11px;padding:6px}}

/* ── AI구독 케어 혜택(첫 화면) ─────────────────────────────────
   상담은 "이 제품 케어가 몇 회차냐"가 아니라 "구독하면 뭘 받느냐"로 시작한다.
   회차표보다 **먼저** 보여야 한다(2026-08-10 사용자 요청). */
.bnf{background:linear-gradient(135deg,#1428A0,#2B44D0);border-radius:16px;padding:16px 17px;margin-bottom:12px;color:#fff}
.bnf-h{font-size:15px;font-weight:800;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.bnf-s{font-size:11.5px;opacity:.82;line-height:1.5;margin-bottom:12px}
.bnf-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.bnf-i{background:rgba(255,255,255,.13);border-radius:11px;padding:10px 11px}
.bnf-i .t{font-size:12.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.bnf-i .d{font-size:11px;opacity:.85;line-height:1.5}
.bnf-i .k{font-size:17px;font-weight:800;letter-spacing:-.3px}
.bnf-n{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);
  font-size:10.5px;opacity:.8;line-height:1.6}
@media(max-width:520px){.bnf-g{grid-template-columns:repeat(2,1fr);gap:7px}
  .bnf-i{padding:9px}.bnf-i .t{font-size:11.5px}.bnf-i .d{font-size:10.5px}}

  /* PC 대응 — 넓은 화면에서 본문이 폰 폭 그대로라 화면 한가운데 좁은 기둥으로 보였다
     (2026-08-11 사용자 지적). 좁은 화면 값은 그대로 두고 넓은 화면에서만 늘린다. */
  @media(min-width:1024px){ .wrap,.btm { max-width:960px } }
  @media(min-width:1440px){ .wrap,.btm { max-width:1140px } }
</style>
</head>

<script>
/* ── 상태 ── */
let curCat = 'aircon', curPlan = 'P12', curRound = 0, isOpen = false;
/*
 * `curCat` 은 **기본값이 이미 들어 있다**('aircon'). 그래서 "지금 무엇을 보고 있나"는
 * 알려 주지만 "사용자가 골랐나"는 못 알려 준다. 블루패스 화면이 이 둘을 구분해야 한다 —
 * 안 그러면 앱을 열자마자 고른 적도 없는 에어컨을 "이 제품"이라고 부른다.
 * 축척 시뮬레이터가 `mmPerPx`(이미지 축척)와 `scaled`(확정 여부)를 따로 드는 것과 같다.
 */
let pickedCat = null;

/* ────────────────── 헬퍼 ────────────────── */
function gradStyle(g){ return 'background:' + g; }

/*
 * **'자가관리' 를 기본으로 박아 두지 않는다**(2026-08-30). 회차표가 없는 제품이라고
 * 다 자가관리가 아니다 — 사운드바는 **무상수리서비스 대상**이고, 카운터탑 정수기는
 * **방문케어까지 된다**. 제품이 자기 라벨을 정할 수 있게 두고, 안 정하면 예전대로 둔다.
 */
function stBadge(st, p){
  if(st==='done') return '<span class="st st-done">완료</span>';
  if(st==='na')   return '<span class="st st-na">' + ((p && p.stText) || '자가관리') + '</span>';
  return '<span class="st st-todo">분석예정</span>';
}

function itemsHtml(list){
  return list.map(it =>
    `<div class="item">
      <span class="iico">${it.ico}</span>
      <div>
        <div class="inm">${it.nm}</div>
        <div class="idet">${it.det}</div>
        <span class="itag">${it.tt}</span>
      </div>
    </div>`
  ).join('');
}

function noteHtml(n){
  if(!n) return '';
  return `<div class="note" style="border-color:${n.c}">ℹ️ ${n.t.replace(/\n/g,'<br>')}</div>`;
}

/* ────────────────── 드롭다운 ────────────────── */
function buildDropHtml(){
  return PRODUCTS.map(p =>
    `<div class="drop-row${p.key===curCat?' sel':''}" data-key="${p.key}">
      <div class="drop-row-l">
        <span class="drop-ico">${prodIcon(p.key, p.icon)}</span>
        <span class="drop-nm">${p.name}</span>
      </div>
      ${stBadge(p.st, p)}
    </div>`
  ).join('');
}

/*
 * 드롭다운을 열어 둔 채 휴대폰 뒤로가기를 누르면 **앱을 통째로 벗어났다.** 열 때 히스토리를
 * 한 칸 쌓아 두면 뒤로가기가 그 칸부터 소비한다(back-kit.js). 목록이 화면을 덮으므로
 * 사용자는 그것부터 닫히기를 기대한다.
 */
function openDrop(){
  if (isOpen) return;              // 이미 열려 있는데 또 쌓으면 뒤로가기를 두 번 눌러야 한다
  isOpen = true;
  document.getElementById('catBtn').classList.add('open');
  document.getElementById('catArr').classList.add('open');
  document.getElementById('catDrop').style.display = 'block';
  if (window.Back) Back.open(closeDrop, () => isOpen);
}
function closeDrop(){
  if (!isOpen) return;
  isOpen = false;
  document.getElementById('catBtn').classList.remove('open');
  document.getElementById('catArr').classList.remove('open');
  document.getElementById('catDrop').style.display = 'none';
  if (window.Back) Back.done();
}

/* ────────────────── 요약 타일 ────────────────── */
function buildSummary(d){
  if(d.plans){
    const p = d.plans[curPlan] || d.plans[defaultPlan(d)];
    return [
      {l:'계약기간', v:d.contract},
      {l:'선택한 요금제', v:PLAN_TYPE[p.type].short},
      {l:'방문', v:'매 '+p.cycle+'개월 · '+p.total}
    ];
  }
  /* 구독 지면이 없는 자가관리 품목(전자레인지·사운드바) */
  return [
    {l:'계약기간', v:d.contract},
    {l:'총 방문',  v:d.total36},
    {l:'방문 주기',v:'매 36개월'}
  ];
}

/* ────────────────── 36개월형 ────────────────── */
function render36(d){
  const rr = d.plan36.rounds;
  let out = '';

  // 회차 탭
  out += '<div class="vtabs">';
  rr.forEach((r,i) => {
    out += `<div class="vtab${curRound===i?' on':''}" data-round="${i}">
      <div class="vtn">${r.label}</div>
      <div class="vtm">${r.month}</div>
    </div>`;
  });
  out += '</div>';

  const cr = rr[curRound];
  out += `<div class="card">
    <div class="card-hd" style="${gradStyle(cr.grad)}">
      <span class="chd-t">🔧 ${cr.label} — ${cr.month}</span>
      <span class="chip">${cr.badge}</span>
    </div>
    <div class="items">${itemsHtml(cr.items)}</div>
    ${noteHtml(cr.note)}
  </div>`;

  if(rr.length >= 2){
    out += `<div class="card"><div class="cmp">
      <div class="cmp-t">📊 36개월형 — 1회차 vs 2회차</div>
      <div class="cmp-g">
        <div>
          <div class="cmp-hd" style="background:rgba(18,89,195,.1);color:#1259c3">1회차 (${rr[0].month})</div>
          ${rr[0].items.map(it=>`<div class="cmp-i">${it.nm}</div>`).join('')}
        </div>
        <div class="vs">VS</div>
        <div>
          <div class="cmp-hd" style="background:rgba(13,148,136,.1);color:#0D1B7A">2회차 (${rr[1].month})</div>
          ${rr[1].items.map(it=>`<div class="cmp-i">${it.nm}</div>`).join('')}
        </div>
      </div>
    </div></div>`;
  }
  return out;
}


/* ═══════════════ 요금제 — 방문케어 프리미엄 / 라이트 / 셀프케어 (2026-10 삼성닷컴 개편) ═══════════════
 * 「12개월형 / 36개월형」이 유형(프리미엄·라이트·셀프케어) × 주기(6·12·36개월)로 바뀌었다.
 * 자료는 CARE_PLANS(빌드 산출물 — scripts/build-care-plans.mjs)에서 오고 applyCarePlans() 가
 * DATA 에 얹는다. 키는 P12·P36·L12·S6 꼴이고 회차표·요약·혜택·타임라인·개요가 전부 이 키 하나를 지나간다.
 */
const PLAN_TYPE = {
  premium:{ nm:'방문케어 프리미엄', short:'프리미엄', bg:'linear-gradient(90deg,#0D1B7A,#1428A0)' },
  lite:   { nm:'방문케어 라이트',   short:'라이트',   bg:'linear-gradient(90deg,#1428A0,#2563EB)' },
  self:   { nm:'셀프케어',          short:'셀프케어', bg:'linear-gradient(90deg,#334155,#64748b)' }
};
const TYPE_ORDER = ['premium','lite','self'];
function planKeys(d){ return d && d.plans ? Object.keys(d.plans) : null; }
/* 기본은 프리미엄 12개월 — 상담에서 가장 먼저 나오는 조합이다 */
function defaultPlan(d){
  const k = planKeys(d);
  if (!k) return (d && d.onlyPlan) || '36';
  return k.includes('P12') ? 'P12' : k[0];
}
function planName(d, k){ const p = d.plans[k]; return PLAN_TYPE[p.type].short + ' · ' + p.cycle + '개월 주기'; }
function typesOf(d){ return TYPE_ORDER.filter(t => planKeys(d).some(k => d.plans[k].type === t)); }
function typeKinds(d, type){
  const ks = planKeys(d).filter(k => d.plans[k].type === type);
  return [...new Set(ks.flatMap(k => d.plans[k].rounds.flatMap(r => r.kinds || [r.badge])))];
}
function kindName(d, k){ return (d.kindNm && d.kindNm[k]) || k; }
function kindItems(d, k){ return (d.kindsDef && d.kindsDef[k]) || []; }
function isDeliver(d, k){ return (d.deliver || []).includes(k); }

/* CARE_PLANS → DATA — 회차·주기·정의는 전부 빌드가 만든 CARE_PLANS 에서 온다 */
function applyCarePlans(){
  if (typeof CARE_PLANS === 'undefined') return;
  Object.entries(CARE_PLANS).forEach(([key, C]) => {
    const d = DATA[key]; if (!d) return;
    d.kindsDef = C.kinds; d.kindNm = C.kindNm; d.deliver = C.deliver; d.reinstall = C.reinstall;
    d.srcNotes = C.notes; d.heads = C.heads; d.srcUrl = C.url;
    const maxT = Math.max(...Object.values(C.plans).map(p => p.maxTerm));
    d.contract = (maxT * 12) + '개월(' + maxT + '년형)';
    const allT = [...new Set(Object.values(C.plans).flatMap(p => p.terms))].sort((a,b)=>b-a);
    d.terms = allT.map(t => t + '년').join(' / ');
    d.src = '✅ samsung.com AI 구독 ' + (C.title || d.name) + ' 구독 지면 — 2026.10.15 원문 대조';
    d.plans = {};
    Object.entries(C.plans).forEach(([pk, p]) => {
      d.plans[pk] = {
        type: p.type, cycle: p.cycle, terms: p.terms, total: p.total, maxTerm: p.maxTerm, sched: p.sched,
        only6: p.terms.length === 1 && p.terms[0] === 6,
        rounds: p.rounds.map(r => ({
          label: r.label, month: r.month, kinds: r.kinds, badge: r.kinds.map(k => kindName(d, k)).join(' + '), bc: r.bc,
          grad: r.bc === 'btl' ? 'linear-gradient(90deg,#0D1B7A,#1428A0)' : (p.type === 'self' ? 'linear-gradient(90deg,#334155,#64748b)' : 'linear-gradient(90deg,#1428A0,#2563EB)'),
          items: r.kinds.flatMap(k => kindItems(d, k).map(nm => ({
            ico: isDeliver(d, k) ? '📦' : '✅', nm,
            det: isDeliver(d, k) ? '방문 없이 택배로 보내 드립니다' : kindName(d, k),
            tag: 'to', tt: '삼성닷컴 공식' })))
        }))
      };
    });
    CARE_IMGS[key] = C.imgs.map(x => ({ s: x.s, l: x.l, t: x.t }));
  });
}

/* ── 프리미엄 vs 라이트 vs 셀프케어 — O/X ──
 * 두 칸 이상을 **늘 함께** 그린다. 칸 값은 원문 정의(케어 종류 → 항목)로만 만든다 — 여기서 새로 판단하지 않는다.
 * 에어컨처럼 손으로 다듬은 표(d.compare)가 있으면 그것을 쓴다.
 */
function oxRows(d){
  const types = typesOf(d);
  if (d.compare) return d.compare.map(r => ({ g:r.g, k:r.k, key:r.key, v:{ premium:r.P, lite:r.L, self:r.S } }));
  const has = {};
  types.forEach(t => { has[t] = new Set(typeKinds(d, t).flatMap(k => kindItems(d, k))); });
  const rows = [], seen = new Set();
  Object.keys(d.kindsDef || {}).forEach(k => {
    const g = isDeliver(d, k) ? '셀프케어 배송 소모품' : kindName(d, k);
    kindItems(d, k).forEach(it => {
      if (seen.has(it)) return; seen.add(it);
      const v = {}; types.forEach(t => { v[t] = [has[t].has(it) ? 'O' : 'X', '']; });
      /* 라이트에도 같은 이름을 품은 항목이 있으면(냉장고 「UV 케어」 ↔ 「외관 UV 케어」) 핵심 차이로 내세우지 않는다 — 「라이트엔 UV 케어가 없다」로 잘못 읽힌다 */
      const key = types.includes('lite') && v.premium && v.premium[0] === 'O' && v.lite[0] === 'X'
        && ![...has.lite].some(x => x !== it && x.includes(it));
      rows.push({ g, k: it, key, v });
    });
  });
  /* 공통 줄 — 방문 여부 · 주기 · 횟수 · 무상수리 · 재설치 */
  const cyc = (t) => planKeys(d).filter(k => d.plans[k].type === t).map(k => d.plans[k].cycle + '개월' + (d.plans[k].only6 ? '(6년형만)' : '')).join(' / ');
  const cnt = (t) => { const k = planKeys(d).find(k => d.plans[k].type === t && d.plans[k].cycle === 12) || planKeys(d).find(k => d.plans[k].type === t); return d.plans[k].maxTerm + '년형 ' + d.plans[k].total; };
  const V = (f) => { const v = {}; types.forEach(t => { v[t] = f(t); }); return v; };
  rows.push({ g:'공통', k:'전문가 방문', v:V(t => t === 'self' ? ['X','방문 없이 배송'] : ['O','']) });
  rows.push({ g:'공통', k: types.includes('self') ? '방문·배송 주기' : '방문 주기', v:V(t => ['', '<b>' + cyc(t) + '</b>']) });
  rows.push({ g:'공통', k:'횟수 (가장 긴 계약)', v:V(t => ['', cnt(t)]) });
  const maxT = Math.max(...planKeys(d).map(k => d.plans[k].maxTerm));
  rows.push({ g:'공통', k:'무상수리서비스 (구독 기간 내)', v:V(() => ['O', '최대 ' + maxT + '년']) });
  if (d.reinstall) rows.push({ g:'공통', k:'재설치 (구독 기간 중 1회)', v:V(t => t === 'self' ? ['X','방문케어 가입 고객만'] : ['O','설치 기본비']) });
  return rows;
}
function oxCell(v){
  if (!v) return '<span class="ox-s">—</span>';
  /* 첫 칸이 비면 O/X 가 아니라 **값을 적는 줄**이다(방문 주기·횟수) */
  const mark = v[0] === 'O' ? '<span class="ox-o">O</span>' : v[0] === 'X' ? '<span class="ox-x">X</span>' : '';
  return mark + (v[1] ? '<span class="ox-s">' + v[1] + '</span>' : '');
}
function oxTable(d, curType){
  const types = typesOf(d);
  let g = '';
  const rows = oxRows(d).map(r => {
    let head = '';
    if (r.g !== g) { g = r.g; head = '<tr class="grp"><td colspan="' + (types.length + 1) + '">' + g + '</td></tr>'; }
    return head + '<tr' + (r.key ? ' class="key"' : '') + '><td class="k">' + r.k + '</td>'
      + types.map(t => '<td class="v' + (curType === t ? ' cur' : '') + '">' + oxCell(r.v[t]) + '</td>').join('') + '</tr>';
  }).join('');
  return '<div style="padding:4px 13px 13px"><table class="ox' + (types.length > 2 ? ' ox3' : '') + '"><tr><th></th>'
    + types.map(t => '<th class="' + (curType === t ? 'cur' : '') + '">' + PLAN_TYPE[t].short + '</th>').join('')
    + '</tr>' + rows + '</table></div>';
}
function nKey(d){ return oxRows(d).filter(r => r.key).length; }

/* ── 설명 멘트 — 원문 회차를 그대로 문장으로 ── */
function pitchFor(d, t){
  const ks = planKeys(d).filter(k => d.plans[k].type === t);
  const k = ks.find(k => d.plans[k].cycle === 12) || ks[0];
  const p = d.plans[k];
  const alt = ks.filter(x => x !== k).map(x => d.plans[x]);
  const altTxt = alt.length ? ' · 다른 주기: ' + alt.map(a => '매 ' + a.cycle + '개월(' + a.terms.join('·') + '년형, ' + a.total + ')').join(', ') : '';
  if (t === 'self') {
    const items = typeKinds(d, t).flatMap(x => kindItems(d, x)).join(', ');
    return '전문가 방문 없이 매 ' + p.cycle + '개월 집으로 배송 — <b>' + items + '</b><br>받으신 소모품은 고객님이 직접 교체하십니다.' + altTxt;
  }
  if (p.cycle === 6) {
    return '<ul class="pl"><li>매 6개월(연 2회) 방문 — ' + typeKinds(d, t).map(x => '<b>' + kindName(d, x) + '</b>: ' + kindItems(d, x).join(', ')).join(' / ') + '</li></ul>' + altTxt.replace(/^ · /, '');
  }
  /* 해마다 무엇이 오는지 케어 종류별로 묶는다 — 원문 표 그대로 */
  const by = {};
  Object.entries(p.sched[p.maxTerm]).forEach(([y, es]) => es.forEach(e => { (by[e.kind] = by[e.kind] || []).push(+y); }));
  return '<ul class="pl">' + Object.entries(by).map(([kind, ys]) => '<li>' + ys.join('·') + '년차 — <b>' + kindName(d, kind) + '</b>: ' + kindItems(d, kind).join(', ') + '</li>').join('')
    + '</ul>매 ' + p.cycle + '개월 · ' + p.maxTerm + '년형 기준' + altTxt;
}
function pitchCard(d){
  const types = typesOf(d);
  const P = d.pitch || {};
  let pick = P.pick || '';
  if (!pick && types.includes('lite')) {
    const only = oxRows(d).filter(r => r.key).map(r => r.k);
    if (only.length) pick = '「' + only.join('·') + '」까지 원하시면 프리미엄, 정기 점검이면 충분하시면 라이트입니다.';
  }
  if (!pick && types.includes('self')) pick = '전문가 손을 원하시면 방문케어 프리미엄, 소모품만 받아 직접 교체하시려면 셀프케어입니다.';
  return '<div class="pitch">' + types.map(t => '<div class="pr' + (t === 'lite' ? ' l' : t === 'self' ? ' s' : '') + '"><span class="pr-h">' + PLAN_TYPE[t].nm + '</span>' + (P[t] || pitchFor(d, t)) + '</div>').join('')
    + (pick ? '<div class="pk">👉 ' + pick + '</div>' : '') + '</div>';
}

/* ── 주기 구분 — 유형 × 주기를 계약기간별 O/X 로. 없는 조합도 적는다 ── */
function cycleMatrix(d){
  const T = [3,4,5,6];
  const lines = planKeys(d).map(k => {
    const p = d.plans[k];
    return '<tr><td class="k">' + PLAN_TYPE[p.type].short + ' · ' + p.cycle + '개월</td>'
      + T.map(t => p.terms.includes(t) ? '<td class="o">O</td>' : '<td class="x">X</td>').join('')
      + '<td>' + p.total + '<br><small>(' + p.maxTerm + '년형)</small></td></tr>';
  }).join('');
  const notes = [];
  const types = typesOf(d);
  const only6 = planKeys(d).filter(k => d.plans[k].only6).map(k => PLAN_TYPE[d.plans[k].type].short + ' ' + d.plans[k].cycle + '개월');
  if (only6.length) notes.push('<b>' + only6.join(', ') + '</b> 주기는 <b>6년형에서만</b> 고를 수 있습니다.');
  if (!types.includes('lite')) notes.push('이 제품에는 <b>방문케어 라이트가 없습니다</b>.');
  if (!types.includes('self')) notes.push('이 제품 구독 지면에는 <b>셀프케어가 없습니다</b>.');
  if (d.noCycle) d.noCycle.forEach(x => notes.push(x.why + '.'));
  if (d.repairOnly) notes.push(d.repairOnly);
  return '<div style="padding:4px 13px 13px"><table class="cyc-m"><tr><th></th>' + T.map(t => '<th>' + t + '년</th>').join('') + '<th>횟수</th></tr>'
    + lines + '</table>' + (notes.length ? '<div class="cyc-n">' + notes.join('<br>') + '</div>' : '') + '</div>';
}

/* ── 계약기간별 — 삼성 「구독케어 자세히 보기」 표를 그대로 다시 그린다(고른 유형만) ── */
function termTables(d, type){
  const short = (k) => kindName(d, k).replace(/\s*\(.*\)$/, '');
  return planKeys(d).filter(k => d.plans[k].type === type).map(k => {
    const p = d.plans[k];
    const yrs = Array.from({ length: Math.max(...p.terms) }, (_, i) => i + 1);
    const rows = p.terms.slice().sort().map(t => {
      const s = p.sched[t];
      return '<tr><td>' + t + '년형</td>' + yrs.map(y => {
        if (y > t) return '<td class="na"></td>';
        const es = s[y] || [];
        if (!es.length) return '<td class="nv">—</td>';
        return '<td' + (es.some(e => /세척|교체|상판|배터리|배송/.test(e.kind) && !/^종합점검/.test(e.kind)) ? ' class="sp"' : '') + '>'
          + es.map(e => short(e.kind) + (e.n > 1 ? ' ×' + e.n : '')).join('<br>') + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<div class="tt-h">' + PLAN_TYPE[type].short + ' · ' + p.cycle + '개월 주기</div>'
      + '<div class="tt-w"><table class="tt"><tr><th></th>' + yrs.map(y => '<th>' + y + '년차</th>').join('') + '</tr>' + rows + '</table></div>';
  }).join('');
}

/*
 * 접었다 폈다 — 섹션 묶음(2026-10-15 사장님: *"내용이 너무 길어 드래그해야 되니 접었다 폈다 …
 * 섹션을 구분해서 여러 개로"*).
 * <details> 를 쓰지 않는다 — 기본 화살표가 기기마다 다르게 생기고 화면 캡처(공유)에서 흔들린다.
 * 열고 닫을 때 **다시 그리지 않는다**(클래스만 바꾼다) — 다시 그리면 화면이 맨 위로 튄다.
 * 상태는 이 세션 동안 기억한다(FOLD) — 요금제·회차를 바꿔 다시 그려도 열어 둔 것이 그대로다.
 */
const FOLD = {};
function fold(id, title, sub, html, defOpen, cls){
  const open = (id in FOLD) ? FOLD[id] : !!defOpen;
  return `<section class="fold${open?' on':''}${cls?' '+cls:''}" data-fold="${id}">
    <button type="button" class="fold-h" aria-expanded="${open}">
      <span class="fold-tx"><span class="fold-t">${title}</span>${sub?`<span class="fold-s">${sub}</span>`:''}</span>
      <span class="fold-c" aria-hidden="true"></span>
    </button>
    <div class="fold-b">${html}</div>
  </section>`;
}
/* 모두 펼치기 / 모두 접기 — 한 화면의 접이식 전부를 한 번에 */
function foldBar(scope){
  return `<div class="fold-bar" data-scope="${scope}">
    <button type="button" class="fold-all" data-all="1">모두 펼치기</button>
    <button type="button" class="fold-all" data-all="0">모두 접기</button>
  </div>`;
}
function setFold(sec, on){
  sec.classList.toggle('on', on);
  const b = sec.querySelector(':scope > .fold-h');
  if (b) b.setAttribute('aria-expanded', on);
  FOLD[sec.dataset.fold] = on;
}
function wireFolds(root){
  if (!root) return;
  root.querySelectorAll('.fold > .fold-h').forEach(b => b.addEventListener('click', () => {
    const sec = b.parentElement; setFold(sec, !sec.classList.contains('on'));
  }));
  root.querySelectorAll('.fold-all').forEach(b => b.addEventListener('click', () => {
    const on = b.dataset.all === '1';
    root.querySelectorAll('.fold').forEach(sec => setFold(sec, on));
  }));
}

function renderPlans(d){
  if(!d.plans[curPlan]) curPlan = defaultPlan(d);
  const cur = d.plans[curPlan];
  const types = typesOf(d);
  let out = '';

  /* ① 유형 탭 — **접지 않는다**. 아래 섹션 전부가 이 선택을 따른다 */
  out += '<div class="plan-tabs' + (types.length > 2 ? ' three' : types.length === 1 ? ' one' : '') + '">';
  types.forEach(t => {
    const ks = planKeys(d).filter(k => d.plans[k].type === t);
    const k12 = ks.find(k => d.plans[k].cycle === 12) || ks[0];
    const active = cur.type === t;
    out += `<div class="plan-tab ptype ${active ? (t==='lite'?'blue':'teal') : ''}" data-ptype="${t}">
      <div class="ptag" style="background:${PLAN_TYPE[t].bg}">${d.plans[k12].total} ${t==='self'?'배송':'방문'}</div>
      <div class="pnm">${PLAN_TYPE[t].nm}</div>
      <div class="psub">${typeKinds(d, t).map(k => kindName(d, k).replace(/\s*\(.*\)$/,'')).join(' + ')}<br>${ks.map(k => '매 ' + d.plans[k].cycle + '개월').join(' / ')}</div>
    </div>`;
  });
  out += '</div>';
  /* 무엇이 갈리나 — 손으로 다듬은 문장(d.planDiff)이 없으면 O/X 의 핵심 차이에서 만든다 */
  let diff = d.planDiff || '';
  if (!diff && types.includes('lite')) {
    const only = oxRows(d).filter(r => r.key).map(r => r.k);
    if (only.length) diff = '프리미엄과 라이트를 가르는 것은 <b>' + only.join(' · ') + '</b>입니다 — 라이트에는 없습니다.';
  }
  if (types.includes('self')) diff += (diff ? '<br>' : '') + '<b>셀프케어</b>는 전문가 방문 없이 소모품만 집으로 보내 드리는 유형입니다.';
  if (types.length === 1) diff += (diff ? '<br>' : '') + '이 제품은 <b>' + PLAN_TYPE[types[0]].nm + '</b>만 있습니다(라이트·셀프케어 없음).';
  if (diff) out += `<div class="pdiff">${diff}</div>`;

  /* ② 섹션 — 상담 순서: 무엇이 다른가 → 어떻게 말하나 → 회차 → 주기 → 기간 → 유의사항 */
  const nk = nKey(d);
  out += fold('ox', '⚖️ ' + types.map(t => PLAN_TYPE[t].short).join(' vs ') + ' — 무엇을 해 주나',
    (nk ? '핵심 차이 ' + nk + '가지 · ' : '') + '유형별 O/X', oxTable(d, cur.type), true);
  out += fold('pitch', '🗣️ 고객에게 이렇게 설명하세요', types.map(t => PLAN_TYPE[t].short).join(' · ') + ' 설명 멘트', pitchCard(d), true);

  if(!cur.rounds[curRound]) curRound = 0;
  let rd = '';
  const sameType = planKeys(d).filter(k => d.plans[k].type === cur.type);
  if(sameType.length > 1){
    rd += '<div class="cyc">' + sameType.map(k => {
      const p = d.plans[k];
      return `<button class="cyc-b${k===curPlan?' on':''}" data-plan="${k}">매 ${p.cycle}개월 · ${p.total}${p.only6?' <small>(6년형만)</small>':''}</button>`;
    }).join('') + '</div>';
  }
  rd += `<div class="round-pills" style="padding:10px 0 2px">${cur.rounds.map((r,i) => `<span class="round-pill${r.bc==='btl'?' star':''}${i===curRound?' on':''}" data-round="${i}">${r.label} ${r.badge}</span>`).join('')}</div>`;
  rd += '<div class="vtabs" style="--n:' + Math.min(cur.rounds.length, 6) + '">' + cur.rounds.map((r,i) => `<div class="vtab${curRound===i?' on':''}" data-round="${i}">
      <div class="vtn">${r.label}</div><div class="vtm">${r.month}</div></div>`).join('') + '</div>';
  const cr = cur.rounds[curRound];
  rd += `<div class="card">
    <div class="card-hd" style="${gradStyle(cr.grad)}">
      <span class="chd-t">${cur.type==='self'?'📦':'🔧'} ${cr.label} — ${cr.month}</span>
      <span class="chip">${cr.badge}</span>
    </div>
    <div class="items">${itemsHtml(cr.items)}</div>
  </div>`;
  out += fold('rounds', (cur.type==='self'?'📦 회차별 배송 내용':'🔧 회차별 케어 내용'), planName(d, curPlan) + ' · ' + cur.maxTerm + '년형 ' + cur.total, '<div class="fold-pad">' + rd + '</div>', true);

  out += fold('cycle', '🗓️ 주기 구분 — 6 · 12 · 36개월이 어느 유형에 있나', [...new Set(planKeys(d).map(k => d.plans[k].cycle + '개월'))].join(' · '), cycleMatrix(d), false);
  out += fold('terms', '📅 계약기간별 구성 — ' + PLAN_TYPE[cur.type].short, cur.terms.join('·') + '년형 · 삼성 「구독케어 자세히 보기」 표', '<div style="padding:4px 13px 13px">' + termTables(d, cur.type) + '</div>', false);
  if (d.srcNotes && d.srcNotes.length) out += fold('notes', '⚠️ 꼭 알려 드릴 유의사항', '삼성닷컴 원문 ' + d.srcNotes.length + '가지', '<ul class="sn">' + d.srcNotes.map(n => '<li>' + n.replace(/^\*\s*/,'') + '</li>').join('') + '</ul>', false);
  return out;
}

/* ────────────────── 포함/제외·범례·출처 ────────────────── */

/**
 * 방문케어 현장 사진 갤러리.
 * 사진이 없는 제품(자가관리 대상 등)은 아무것도 그리지 않는다 — 빈 자리를 만들지 않는다.
 * 이미지는 삼성닷컴 원본을 그대로 링크한다(설치환경 가이드와 같은 방식).
 */
/* 제품 심벌은 미니앱 공용이라 public/prod-symbols.js 에 있다 — 여기서는 키만 넘긴다.
   앱마다 복사해 두면 심벌 하나 고칠 때 여러 곳을 고쳐야 한다. */
function prodIcon(key, fallback){ return prodSymbol(key, fallback); }

function buildCareImgs(key){
  let list = CARE_IMGS[key];
  if (!list || !list.length) return '';
  /* 요금제가 갈린 제품은 **고른 유형의 사진만** — 라이트 고객에게 열교환기 고압세척 사진을 보이면 약속이 된다 */
  const d = DATA[key];
  let head = '📸 방문케어는 이렇게 진행됩니다';
  if (d && d.plans && d.plans[curPlan] && list.some(x => x.t)) {
    const ty = d.plans[curPlan].type;
    list = list.filter(x => !x.t || x.t.includes(ty));
    head = '📸 ' + PLAN_TYPE[ty].nm + '는 이렇게 진행됩니다 (' + list.length + '장)';
  }
  return `
  <div class="card cimg-wrap">
    <div class="cimg-h">${head}</div>
    <div class="cimg-s">삼성닷컴 구독 서비스 안내의 실제 작업 사진입니다 — 고객에게 그대로 보여 주세요.</div>
    <div class="cimg-grid">
      ${list.map(x=>`<div class="cimg"><img src="${x.s}" alt="${x.l}" loading="lazy"><div class="cap">${x.l}</div></div>`).join('')}
    </div>
  </div>`;
}


/**
 * AI구독 케어 혜택 — **회차표보다 먼저** 보여준다.
 * 상담은 "이 제품 케어가 몇 회차냐"가 아니라 "구독하면 뭘 받느냐"로 시작하기 때문이다.
 *
 * 내용은 **그 제품의 `includes` 에서 뽑는다** — 제품마다 다르므로 공통 문구를 지어내지 않는다.
 * 계약기간·방문횟수는 이미 들고 있는 값(`contract`, `plans`)을 그대로 쓴다.

/*

function bpIcon(k){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (BP_ICONS[k]||BP_ICONS.plus) + '</svg>';
}

/* 조건 줄 — 값이 있는 것만 만든다. 빈 라벨을 띄우면 "조건이 없다"로 읽힌다 */
function bpConds(x){
  const rows = BP_COND.filter(c => x[c.k]).map(c =>
    `<div class="bp-c"><span class="bp-cl ${c.c}">${c.l}</span><span class="bp-cv">${x[c.k]}</span></div>`).join('');
  return rows ? `<div class="bp-cond">${rows}</div>` : '';
}

/* 번호를 붙인다 — 상담사가 "여섯 가지 중 몇 번째"로 짚어 말할 수 있어야 한다 */
function bpTile(x, n){
  /* 그림은 **뜻을 더하는 것이 아니라 분위기**라 alt 를 비운다(장식). 못 받아도 카드는 그대로다. */
  const pic = x.img ? `<img class="bp-img" src="${x.img}" alt="" loading="lazy">` : '';
  return `<div class="bp-i${x.img ? ' haspic' : ''}">
      ${pic}
      <div class="bp-ic">${bpIcon(x.ic)}</div>
      <div class="bp-tx">
        <div class="bp-t"><span class="bp-n">${n}</span>${x.t}${x.tag?`<span class="bp-tag">${x.tag}</span>`:''}</div>
        ${x.s?`<div class="bp-s">${x.s}</div>`:''}
        ${x.d?`<div class="bp-d">${x.d}</div>`:""}
        ${bpConds(x)}
      </div>
    </div>`;
}

function buildBluePass(key){
  const B = BLUEPASS;
  const eh = key === 'aircon'
    ? '에어컨 블루패스 — 이 제품에는 두 가지가 더 붙습니다'
    : '에어컨 블루패스 — 에어컨에만 두 가지가 더 붙습니다';
  /*
   * 갈래(설치·스마트한 경험·맞춤 케어·안심 A/S)로 묶는다 — 원문 지면이 그렇게 나누고,
   * 열두 장을 한 줄로 늘어놓으면 상담사가 "어디에 무엇이 있는지"를 못 찾는다.
   * 번호는 갈래를 가로질러 이어 붙인다 — "열두 가지 중 몇 번째"로 짚어 말할 수 있게.
   */
  let n = 0;
  const groups = (B.groups || []).map(g => {
    const its = B.items.filter(x => x.g === g.k);
    if (!its.length) return '';
    const from = n + 1;
    const body = `<div class="bp-gd">${g.d}</div><div class="bp-g">${its.map(x => bpTile(x, ++n)).join('')}</div>`;
    return fold('bp-' + g.k, `<span class="bp-gk">${g.h}</span>${g.s}`,
      from + '~' + n + ' · ' + its.map(x => x.t).join(' · '), body, false, 'dk');
  }).join('');
  const extra = B.aircon.length
    ? fold('bp-aircon', eh, B.aircon.map(x => x.t).join(' · '),
        `<div class="bp-g">${B.aircon.map((x,i)=>bpTile(x,i+1)).join('')}</div>`, false, 'dk') : '';
  const special = (B.special || []).length ? `<div class="sp-wrap">
      <div class="bp-eh">스페셜 패스 — 블루패스만의 특별한 패스 시리즈</div>
      ${B.special.map(p => fold('sp-' + p.k, p.t, p.s + ' · ' + p.items.map(x => x.t).join(' · '), `<div class="sp">
        <div class="sp-top"><img src="${p.img}" alt="" loading="lazy">
          <div class="sp-tt"><div class="sp-t">${p.t}</div><div class="sp-s">${p.s}</div><div class="sp-d">${p.d}</div></div></div>
        <div class="sp-g">${p.items.map(it => `<div class="sp-i">
          ${it.img ? `<img src="${it.img}" alt="" loading="lazy">` : ''}
          <div class="sp-it">${it.t}</div><div class="sp-id">${it.d}</div>
          ${it.note ? `<div class="sp-in">${it.note}</div>` : ''}</div>`).join('')}</div>
        <div class="sp-c"><b>대상 조건</b><ul>${p.conds.map(c => `<li>${c}</li>`).join('')}</ul></div>
      </div>`, false, 'dk')).join('')}
    </div>` : '';
  return `
  <div class="card bp-wrap">
    <div class="bp-h">
      <span class="bp-badge">BLUE PASS</span>
      <span class="bp-hh">새로워진 블루패스</span>
    </div>
    <div class="bp-sub">${B.lead} — 네 갈래 <b>${B.items.length}가지</b>이고, 에어컨은 <b>${B.aircon.length}가지</b>가 더 붙습니다.
      조건에 맞으면 <b>스페셜 패스 ${(B.special||[]).length}종</b>(신혼·이지케어)이 더해집니다.</div>
    ${foldBar('bp')}
    ${groups}
    ${extra}
    ${special}
    <div class="bp-gate">꼭 확인 — ${B.gate}</div>
    <div class="bp-src">${B.src}</div>
  </div>`;
}

function buildBenefits(d, key){
  const inc = d.includes || [];
  const has = (re)=> inc.find(x=>re.test(x));
  const yrs = (String(d.contract||'').match(/(\d+)\s*개월/)||[])[1];
  const yr = yrs ? Math.round(+yrs/12) : null;

  const tiles = [];
  const repair = has(/무상수리/);
  if (repair) tiles.push({ t:'무상수리', k: yr? `최대 ${yr}년` : '구독 기간 내', d: repair.replace(/무상수리서비스\s*/,'') || '구독 기간 전체' });
  /*
   * 구독 지면이 있는 품목은 유형(프리미엄·라이트)을, 자가관리 품목은 원문 문구를 그대로 띄운다.
   */
  const n = (v)=> String(v).replace(/^총\s*/,'');
  if (d.plans) tiles.push({ t:'방문케어', k:'프리미엄 · 라이트', d:'유형 선택 — ' + ['premium','lite'].filter(t=>planKeys(d).some(k=>d.plans[k].type===t)).map(t=>PLAN_TYPE[t].short+' '+typeKinds(d,t).join('+')).join(' / ') });
  else if (d.onlyPlan === '36' && d.total36) tiles.push({ t:'방문케어', k:n(d.total36), d:'매 36개월 · 전문가 방문 점검·세척' });

  /*
   * **「공임비 무상 0원」 타일을 없앴다**(2026-08-30). 공식 지면 어디에도 `공임` 이라는
   * 낱말이 없고(4개 지면 전문 + FAQ 112건 + 제품 지면 26종 전수), 뜻이 통하는 원문은
   * `무상수리서비스 / 구독 기간 내 제공` 하나뿐이라 **위 무상수리 타일과 같은 말을 두 번**
   * 하고 있었다. 근거 없는 약속은 상담사가 그대로 읽었을 때 현장에서 반박당한다.
   * 되살리려면 원문에서 그 말을 먼저 찾을 것.
   */
  const self = has(/셀프케어|소모품/);
  if (self) tiles.push({ t:'셀프케어', k:'정기 배송', d: self });
  const re2 = has(/재설치/);
  if (re2) tiles.push({ t:'재설치', k:'1회', d:'이사 등으로 옮길 때' });
  const sched = has(/일정 변경/);
  if (sched) tiles.push({ t:'일정 변경', k:'가능', d: sched.replace(/일정 변경 가능\s*/,'') || '' });

  if (!tiles.length) return '';
  const exc = (d.excludes||[]).slice(0,3).join(' · ');
  return `
  <div class="bnf">
    <div class="bnf-h">AI 구독클럽 구독케어로 더 오래, 더 편리하게 — ${d.name}</div>
    <div class="bnf-s">구독케어 기간 ${d.terms || d.contract || '-'} 중 선택 — 아래는 ${d.contract||'-'} 기준입니다</div>
    <div class="bnf-g">
      ${tiles.map(t=>`<div class="bnf-i"><div class="t">${t.t}</div><div class="k">${t.k}</div><div class="d">${t.d}</div></div>`).join('')}
    </div>
    ${exc ? `<div class="bnf-n">제외·주의 — ${exc}</div>` : ''}
  </div>`;
}

/* 화면에 보이는 번호는 눌린다 — AS 앱과 같은 규칙(`data-tel` 을 단 것만 잡는다) */
function wireTel(root){
  root.querySelectorAll('[data-tel]').forEach((el)=>{
    if (el.dataset.wired) return;
    el.dataset.wired = '1';
    el.style.cssText += ';cursor:pointer;text-decoration:underline;text-underline-offset:2px';
    el.addEventListener('click', ()=>{ location.href = 'tel:' + String(el.dataset.tel).replace(/[^\d]/g,''); });
  });
}

function render(){
  const d = DATA[curCat];
  const p = PRODUCTS.find(x => x.key === curCat);

  // 드롭다운 콘텐츠 갱신
  document.getElementById('catDrop').innerHTML = buildDropHtml();

    el.addEventListener('click', () => {

      closeDrop();
      render();
      revealBody();
    });
  });

  // 헤더 갱신
  // SVG 를 넣으므로 textContent 로는 안 된다
  document.getElementById('selIco').innerHTML = prodIcon(p.key, p.icon);
  document.getElementById('selNm').textContent  = p.name;
  document.getElementById('selDc').textContent  = p.desc;

  const body = document.getElementById('body');
  let out = '';

  /* 모바일 구독 — 회차 구조가 없으므로 아래 회차표 경로를 타지 않는다 */
  if(p.st==='mx'){ body.innerHTML = buildMobileSub(p); wireTel(body); return; }
  /* PC·태블릿 — 상품이 다르다(올인원 2.0). 회차표 경로를 타지 않는다 */
  if(p.st==='ai2'){ body.innerHTML = buildAllInOne2(p); wireTel(body); return; }

  if(!d && p.st==='na'){
    /* 제품이 `naNote` 로 사실을 적으면 그것을 쓴다 — "미대상" 이 맞는 제품에만 옛 문구가 남는다 */
    const naT = p.naTitle || (p.name + ' — 자가관리 가이드');
    const naB = p.naNote || ('이 제품은 <b>삼성 AI구독 케어 미대상</b> 제품입니다. 자가관리 가이드를 참조하거나 삼성전자서비스센터(1588-3366)에 문의하세요.');
    body.innerHTML = '<div class="todo-card"><div class="todo-ico">'+prodIcon(p.key,p.icon)+'</div><div class="todo-t" style="color:#2563EB">'+naT+'</div><div class="todo-s">'+p.desc+'<br><br>'+naB+'</div></div>';
    return;
  }
    /* TODO 상태 */
  if(!d){
    body.innerHTML = `<div class="todo-card">
      <div class="todo-ico">${prodIcon(p.key, p.icon)}</div>
      <div class="todo-t">${p.name} — 분석 예정</div>
      <div class="todo-s">삼성닷컴 공식 구독 제품 페이지 URL을 붙여주시면<br>동일한 방식으로 분석·업데이트 가능합니다.</div>
    </div>`;
    return;
  }

  /* 요약 타일 */
  /* 혜택 카드 — 회차표보다 **먼저** 보여준다. 상담은 "구독하면 뭘 받느냐"로 시작한다 */
  if (d.plans) {
    /* 위에 「모두 펼치기/접기」 — 섹션이 여럿이라 한 번에 여닫는 손잡이가 있어야 끌어내리지 않는다 */
    out += foldBar('care');
    const bnf = buildBenefits(d, curCat);
    if (bnf) out += fold('bnf', '🎁 구독하면 받는 것', '무상수리 · 방문케어 · 재설치 · 일정 변경', bnf, false, 'fold-bnf');
  } else out += buildBenefits(d, curCat);

  const cells = buildSummary(d);
  out += `<div class="sumrow">
    ${cells.map(c=>`<div class="si"><div class="sl">${c.l}</div><div class="sv">${c.v}</div></div>`).join('')}
  </div>`;

  /* 유형·주기 탭은 renderPlans 가 그린다 */
  if(d.plans){ out += renderPlans(d); }


  /* 본문 */
  if(!d.plans) out += render36(d);
  if (d.plans) {
    out += fold('tail', '📋 포함 · 제외 · 출처', '무상수리·일정 변경·회차 소멸 조건', '<div class="fold-pad">' + buildTail(d) + '</div>', false);
    const imgs = buildCareImgs(curCat);
    if (imgs) {
      const ty = d.plans[curPlan].type;
      const nImg = (CARE_IMGS[curCat]||[]).filter(x => !x.t || x.t.includes(ty)).length;
      out += fold('imgs', '📸 ' + PLAN_TYPE[ty].nm + (ty==='self'?' — 이렇게 직접 교체합니다':' 현장 사진'), nImg + '장' + (d.heads && d.heads[ty] ? ' · ' + d.heads[ty] : ''), '<div class="fold-pad">' + imgs + '</div>', false);
    }
  } else {
    out += buildTail(d);
    out += buildCareImgs(curCat);
  }
  out += renderSelling(curCat);
  body.innerHTML = out;
  wireFolds(body);

  /* 이벤트 바인딩 */
  document.querySelectorAll('.plan-tab:not(.ptype)').forEach(el => {
    el.addEventListener('click', () => {
      curPlan = el.dataset.plan; curRound = 0; render();
    });
  });
  document.querySelectorAll('.vtab, .round-pill[data-round]').forEach(el => {
    el.addEventListener('click', () => {
      curRound = +el.dataset.round; render();
    });
  });
  document.querySelectorAll('.plan-tab.ptype').forEach(el => {
    el.addEventListener('click', () => {
      curPlan = planKeys(d).find(k => d.plans[k].type === el.dataset.ptype); curRound = 0; render();
    });
  });
  document.querySelectorAll('.cyc-b').forEach(el => {
    el.addEventListener('click', () => { curPlan = el.dataset.plan; curRound = 0; render(); });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  /* 드롭다운 토글 */
  document.getElementById('catBtn').addEventListener('click', () => {
    isOpen ? closeDrop() : openDrop();
  });
  document.addEventListener('click', e => {
    if(isOpen && !document.getElementById('catBtn').contains(e.target)
               && !document.getElementById('catDrop').contains(e.target)){
      closeDrop();
    }
  });

  /* 초기 렌더 */
  const initD = DATA[curCat];
  curPlan = defaultPlan(initD);
  render();
  /*
   * 열면 블루패스부터 — 상담은 "삼성으로 구독하면 뭐가 다르냐"에서 시작하지,
   * 특정 제품 회차표에서 시작하지 않는다. 품목 고르기는 바로 옆 탭이다.
   */
  setMode('bluepass');

  /*
   * ── 통합검색 딥링크 (`?cat=aircon`) ──
   *
   * 허브 통합검색이 이 앱으로 보낼 때 `?cat=` 을 붙여 왔는데 **여기서 읽지를 않아
   * 늘 블루패스 첫 화면이 열렸다**(2026-08-12 사용자 지적: *"선택된 곳으로 자동
   * 이동이 되어야 하는데 이동이 안 됩니다"*). 검색이 찾아 준 항목과 다른 화면이
   * 뜨면 찾아 준 뜻이 없다 — AS 검색 결과가 접힌 묶음 안으로 데려갈 때 묶음까지
   * 펼치는 것과 같은 이유다.
   *
   * `switchToCare` 를 그대로 쓴다(품목 선택 + 케어 탭 + 결과로 스크롤). 화면을
   * 직접 만지지 않아야 사람이 눌렀을 때와 결과가 같다.
   * 없는 키가 오면 아무것도 하지 않는다 — 기본 화면이 그대로 열린다.
   */
  const qs = new URLSearchParams(location.search);
  const dl = qs.get('cat');
  if (dl && PRODUCTS.some(p => p.key === dl)) switchToCare(dl);
  else if (qs.get('mode') === 'bluepass') setMode('bluepass');
});

/* ═══════════════ MODE ═══════════════ */
let curMode = 'care';

function setMode(m){
  curMode = m;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('on', t.dataset.mode === m));
  document.querySelector('.cat-wrap').style.display = m==='care' ? '' : 'none';
  document.getElementById('body').style.display = m==='care' ? '' : 'none';
  document.getElementById('bluepassPane').style.display = m==='bluepass' ? '' : 'none';
  document.getElementById('overviewPane').style.display = m==='overview' ? '' : 'none';
  document.getElementById('timelinePane').style.display = m==='timeline' ? '' : 'none';
  if(m==='bluepass') renderBluePass();
  if(m==='overview') renderOverview();
  if(m==='timeline'){ tlShown = false; renderTimeline(); }   /* 탭을 누르면 설명+선택부터 (2026-08-30 사장님 지시) */
  /* 공유 카드는 탭마다 내용이 다르다 — 탭을 옮기면 버튼 노출도 다시 판단한다 */
  if (typeof syncCareShareBtn === 'function') syncCareShareBtn();
}

/* ═══════════════ BLUE PASS ═══════════════ */
/*
 * 블루패스 전용 탭. 예전에는 모델선택 화면 맨 위에 얹혀 있었는데, 그러면
 * 내용을 자세히 적을수록 정작 품목 카드가 화면 밖으로 밀린다. 둘을 갈랐다.
 *
 * 품목을 **직접 고른** 상태면 그 품목을 넘겨 준다 — 에어컨을 보다 넘어오면
 * "이 제품에는 두 가지가 더 붙습니다"로 문구가 바뀐다. `curCat` 이 아니라
 * `pickedCat` 을 쓰는 이유는 위 선언부에 적어 두었다(기본값을 고른 것으로 읽으면 안 된다).
 */
function renderBluePass(){
  const pane = document.getElementById('bluepassPane');
  pane.innerHTML = buildBluePass(pickedCat);
  wireFolds(pane);
}

/* ═══════════════ OVERVIEW ═══════════════ */
/*
 * 품목 고르기 — 여기서 고르면 그 제품의 케어 내용으로 들어간다.
 *
 * 블루패스는 제품과 무관하게 구독 전체에 붙는 혜택이라 제품 상세마다 반복하면
 * 같은 카드를 열여섯 번 보게 된다. 전용 탭 한 곳에만 둔다(`renderBluePass`).
 */
function renderOverview(){
  const el = document.getElementById('overviewPane');
  let html = '<div class="ov-lead">품목을 고르면 그 제품의 케어 내용을 볼 수 있습니다</div>';
  html += '<div class="ov-grid">';
  PRODUCTS.forEach(p => {
    const d = DATA[p.key];
    const isDone = p.st==='done';
    /*
     * **모바일 구독을 '자가관리'로 표시하면 안 된다.** 구독 대상이 맞고, 다만 회차형
     * 방문케어가 아닐 뿐이다 — `na-card` 로 두면 화면이 "구독 미대상"이라고 거짓말한다.
     * 누르면 그 제품 화면으로 가야 하는 것도 done 과 같다.
     */
    const isMx = p.st==='mx' || p.st==='ai2';
    const open = isDone || isMx;
    let pills = '';
    if(isMx){
      pills = '<span class="ov-pill p12">' + (p.st==='ai2' ? '올인원 2.0' : '갤럭시 AI 구독클럽') + '</span>';
    } else if(isDone && d && d.plans){
      ['premium','lite'].filter(t=>planKeys(d).some(k=>d.plans[k].type===t)).forEach(t=>{ pills += '<span class="ov-pill '+(t==='premium'?'p36':'p12')+'">'+PLAN_TYPE[t].short+'</span>'; });
    } else {
      pills = '<span class="ov-pill pna">자가관리</span>';
    }
    html += '<div class="ov-card ' + (open?'done':'na-card') + '" ' + (open?'onclick="switchToCare(\''+p.key+'\')"':'') + '>' +
      '<div class="ov-ico">' + prodIcon(p.key, p.icon) + '</div>' +
      '<div class="ov-nm">' + p.name + '</div>' +
      '<div class="ov-pills">' + pills + '</div>' +
      '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

/*
 * 제품을 고르면 결과로 데려간다(2026-08-11 사용자 지적).
 * 품목 카드가 열여섯 개라 케어 내용이 화면 밖에 그려지는데, 그러면 눌러도 아무 일이
 * 없어 보여 **클릭이 됐나 싶어 여러 번 누르게 된다.** 스크롤은 사용자가 할 일이 아니다.
 * 첫 렌더에서는 부르지 않는다 — 열자마자 화면이 튀면 그게 더 어리둥절하다.
 */
function revealBody(){
  const el = document.getElementById('body');
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function switchToCare(key){
  /*
   * **제품 단위로 한 번만** 남긴다(2026-08-20 사장님 지적 — 조회 종류가 많아 중복이 쌓인다).
   * 이 앱은 한 제품 안에서 12/36개월 · 회차 · 타입 A/B 를 오가므로, 그 전환을 다 세면
   * 제품 하나가 수십 건이 된다. 상담에서 알고 싶은 것은 **어떤 제품을 상담했는가**다.
   */
  /* **내부 키가 아니라 제품 이름으로 남긴다** — 대시보드에 `aircon` 이 뜨면 사람이 못 읽는다 */
  const _p = PRODUCTS.find(p=>p.key===key);
  if (window.AX_LOG) AX_LOG('care', 'result_open', (_p && _p.name) || key, true);
  const idx = PRODUCTS.findIndex(p=>p.key===key);
  if(idx>=0){
    curCat = pickedCat = key;
    curPlan = defaultPlan(DATA[key]);
    curRound = 0;
  }
  setMode('care');
  render();
  revealBody();
}

/* ═══════════════ TIMELINE ═══════════════ */
/* 회차 일정 — 개월수는 회차 문구("36개월차")에서 읽는다. 자료는 CARE_PLANS 하나뿐이다. */
function careSchedule(d, pl){
  const plan = d && d.plans ? d.plans[pl] : null;
  if(!plan) return [];
  const num = (s)=>{ const m = String(s).match(/(\d+)\s*개월/); return m ? +m[1] : null; };
  return plan.rounds.map(r => ({ month:num(r.month), kind:r.badge, items:r.items||[], note:r.note }))
    .filter(x => x.month != null).sort((a,b) => a.month - b.month);
}

/*
 * **기준월을 박지 않는다.** 상담 시점의 **다음 달**부터 설치되는 것으로 잡는다
 * (2026-08-30 사장님 지시 — 그 전에는 2026년 7월이 박혀 있어 지난달이 떴다).
 * 드롭다운으로 언제든 바꿀 수 있다.
 */
const tlNext = (() => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + 1); return d; })();
let tlKey='aircon', tlPlan='P12', tlYear=tlNext.getFullYear(), tlMonth=tlNext.getMonth()+1;
/* 탭 진입마다 false 로 돌아간다(setMode) — "누르면 설명부터" 가 사장님이 정한 흐름이다.
   선택(tlKey 등)은 남겨 두므로, 다시 들어온 상담사는 보기 한 번이면 같은 결과를 본다. */
let tlShown = false;

function renderTimeline(){
  /*
   * 자가관리 제품(인덕션·전자레인지·사운드바)은 방문 케어 대상이 아니다 —
   * DATA 가 contract:"자가관리" · total36:"AI구독 미해당" 로 밝히고 있고, 그 rounds 는
   * 방문 회차가 아니라 "사용 후 매회 / 연 1회 권장" 같은 관리 안내다. 타임라인에 두면
   * 골랐을 때 빈 화면이 나오므로 목록에서 뺀다.
   */
  const done = PRODUCTS.filter(p=>p.st==='done' && (DATA[p.key]||{}).contract !== '자가관리');
  if(!done.some(p=>p.key===tlKey) && done.length) tlKey = done[0].key;
  const d = DATA[tlKey]||{};
  const plans = d.plans ? planKeys(d) : [];
  /*
   * **고른 요금제가 이 제품에 없으면 있는 것으로 되돌린다** — tlPlan 은 화면 전역이라
   * 품목을 바꾸면 없는 요금제(예: 라이트가 없는 세탁기의 L12)가 남는다.
   */
  if(plans.length && !plans.includes(tlPlan)) tlPlan = plans[0];

  // <option> 은 텍스트만 담는다 — SVG 심벌을 못 넣으므로 제품명만 쓴다
  let prodOpts = done.map(p=>'<option value="'+p.key+'" '+(p.key===tlKey?'selected':'')+'>'+p.name+'</option>').join('');
  let planOpts = plans.map(pl=>'<option value="'+pl+'" '+(pl===tlPlan?'selected':'')+'>'+(d.plans ? planName(d,pl) : '매 '+pl+'개월형')+'</option>').join('');
  /* 연도도 박지 않는다 — 6년 계약이라 앞뒤로 넉넉히 편다(지난 상담을 되짚을 수 있게 뒤로 2년) */
  const tlY0 = new Date().getFullYear();
  let yearOpts = Array.from({length:11},(_,i)=>tlY0-2+i).map(y=>'<option value="'+y+'" '+(y===tlYear?'selected':'')+'>'+y+'년</option>').join('');
  let monthOpts = Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'" '+((i+1)===tlMonth?'selected':'')+'>'+(i+1)+'월</option>').join('');

  /* 회차·내용은 DATA 에서 직접 만든다 — TL_MONTHS 와 갈라질 여지를 없앤다 */
  const sched = careSchedule(d, tlPlan);
  const months = sched.map(function(x){ return x.month; });
  const now = new Date();

  /*
   * **방문 시점만 균등 간격으로 찍는다.** 시간 축을 비례로 그리지 않는다 —
   * 상담에서 묻는 것은 "몇 개월 뒤가 몇 회차인가"이고, 정확한 날짜는 바로 아래
   * 회차 목록이 이미 적는다("2027년 7월 · 구독 12개월차").
   * 지난 방문은 흐리게 칠해 예전 '현재' 세로선이 하던 구실을 대신한다.
   */
  const bar = '<div class="tl-track' + (d.plans && d.plans[tlPlan] && d.plans[tlPlan].type==='premium' ? ' p36' : '') + '" style="--n:' + (months.length||1) + '">' +
    months.map(function(m,i){
      const past = new Date(tlYear, tlMonth-1+m, 1) < now;
      return '<div class="tl-stop' + (past ? ' past' : '') + '">' +
        '<div class="tl-pt">' + (i+1) + '</div>' +
        '<div class="tl-mo">' + m + '개월</div></div>';
    }).join('') + '</div>';

  /*
   * 회차마다 **어떤 케어가 나가는지**를 함께 적는다(2026-08-11 사용자 요청).
   * 예전에는 "N회차 방문케어"와 날짜만 찍고 DATA 의 badge·items 를 통째로 버렸다.
   * 그런데 상담에서 나오는 질문은 "몇 번 오나"가 아니라 **"와서 뭘 해 주나"** 다.
   * 특히 회차마다 내용이 다른 제품(AI콤보 1회차 종합점검 ↔ 2회차 초음파 세척)은
   * 그 차이를 못 보여주면 상담사가 회차표를 따로 열어 봐야 한다.
   *
   * months 와 rounds 는 순서·개월수가 일치한다(test-care 가 대조한다). 그래서 i 로 짝지어도 안전하다.
   */
  let listHtml = '';
  months.forEach((m,i)=>{
    const dt = new Date(tlYear, tlMonth-1+m, 1);
    const isPast = dt < now;
    const col = d.plans && d.plans[tlPlan] && d.plans[tlPlan].type==='premium' ? 'p36c' : 'p12c';
    const r = sched[i];
    const items = (r && r.items) || [];
    listHtml += '<div class="tl-item" style="'+(isPast?'opacity:.55':'')+'">' +
      '<div class="tl-dot '+col+'">'+(i+1)+'</div>' +
      '<div class="tl-body">' +
        '<div class="tl-round">'+(i+1)+'회차'+
          (r && r.kind ? '<span class="tl-kind">'+r.kind+'</span>' : '')+
          (isPast?'<span class="tl-done">✓ 완료</span>':'')+'</div>' +
        '<div class="tl-date">'+dt.getFullYear()+'년 '+(dt.getMonth()+1)+'월 · 구독 '+m+'개월차</div>' +
        (items.length
          ? '<ul class="tl-items">'+items.map(function(it){
              return '<li><b>'+(it.ico||'·')+' '+it.nm+'</b>'+(it.det?'<span>'+it.det+'</span>':'')+'</li>';
            }).join('')+'</ul>'
          : '') +
        (r && r.note && r.note.t ? '<div class="tl-note">'+r.note.t.replace(/\n/g,'<br>')+'</div>' : '') +
      '</div></div>';
  });
  if(!listHtml) listHtml = '<div style="text-align:center;color:#9aa0a6;font-size:12px;padding:20px">선택한 플랜에 타임라인 정보가 없습니다</div>';

  /*
   * ── 설명 → 선택 → 보기 (2026-08-30 사장님 지시) ─────────────────────────────
   * 탭을 누르는 순간 결과부터 내밀지 않는다 — 아무도 고르지 않은 "에어컨 12개월형"이
   * 단정처럼 떴었다. 먼저 이 화면이 무엇인지 설명하고, 제품·플랜·시작월을 고르게 한 뒤
   * 「타임라인 보기」를 눌러야 결과가 나온다. 드롭다운 순서·클래스는 결과 화면과 같다
   * (제품·플랜·연·월 — test-care 가 그 순서로 짚는다).
   */
  if (!tlShown){
    document.getElementById('timelinePane').innerHTML =
      '<div class="tl-ctrl">' +
        '<div style="background:#EEF2FF;border:1px solid #DCE4FB;border-radius:12px;padding:13px 15px;margin-bottom:12px;line-height:1.65">' +
          '<div style="font-size:13.5px;font-weight:800;color:#1428A0;margin-bottom:5px">📅 타임라인이란?</div>' +
          '<div style="font-size:12px;color:#374151">구독을 시작하면 <b>방문케어가 언제 오는지</b>를 달력처럼 보여드리는 화면입니다.' +
          ' 구독 시작월을 넣으면 회차마다 <b>몇 년 몇 월에 방문하는지</b>, 그리고 <b>와서 무엇을 해 주는지</b>까지 함께 적습니다.</div>' +
          '<div style="font-size:11px;color:#8a9099;margin-top:6px">아래에서 제품 · 플랜(방문 주기) · 구독 시작월을 고르고 「타임라인 보기」를 눌러주세요.' +
          ' 시작월은 다음 달로 미리 맞춰 두었습니다.</div>' +
        '</div>' +
        '<div style="font-size:11px;color:#8a9099;padding-bottom:6px;font-weight:600">① 제품과 플랜</div>' +
        '<div class="tl-row"><select class="tl-sel" onchange="tlKey=this.value;renderTimeline()">'+prodOpts+'</select>' +
        '<select class="tl-sel" style="flex:.6" onchange="tlPlan=this.value;renderTimeline()">'+planOpts+'</select></div>' +
        '<div class="tl-row"><div style="font-size:11px;color:#8a9099;padding:6px 0;font-weight:600">② 구독 시작월</div></div>' +
        '<div class="tl-row"><select class="tl-sel" onchange="tlYear=+this.value;renderTimeline()">'+yearOpts+'</select>' +
        '<select class="tl-sel" style="flex:.5" onchange="tlMonth=+this.value;renderTimeline()">'+monthOpts+'</select></div>' +
        '<button id="tlGo" onclick="tlShown=true;renderTimeline()" ' +
          'style="width:100%;margin:14px 0 18px;padding:14px;border:0;border-radius:12px;background:#1428A0;color:#fff;' +
          'font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer">📅 타임라인 보기</button>' +
      '</div>';
    return;
  }

  document.getElementById('timelinePane').innerHTML =
    '<div class="tl-ctrl">' +
      '<button onclick="tlShown=false;renderTimeline()" ' +
        'style="border:1px solid #DCE4FB;background:#fff;color:#1428A0;border-radius:9px;padding:6px 11px;' +
        'font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:10px">⟵ 다시 선택하기</button>' +
      '<div class="tl-row"><select class="tl-sel" onchange="tlKey=this.value;renderTimeline()">'+prodOpts+'</select>' +
      '<select class="tl-sel" style="flex:.6" onchange="tlPlan=this.value;renderTimeline()">'+planOpts+'</select></div>' +
      '<div class="tl-row"><div style="font-size:11px;color:#8a9099;padding-bottom:6px;font-weight:600">📆 구독 시작월</div></div>' +
      '<div class="tl-row"><select class="tl-sel" onchange="tlYear=+this.value;renderTimeline()">'+yearOpts+'</select>' +
      '<select class="tl-sel" style="flex:.5" onchange="tlMonth=+this.value;renderTimeline()">'+monthOpts+'</select></div>' +
    '</div>' +
    '<div class="tl-bar">'+bar+'</div>' +
    /* 비례 축을 없애며 빨간 점선도 없앴다. 지난 방문은 회색 점으로 갈리므로 그렇게 적는다 —
       없는 표시를 설명하는 안내가 남아 있으면 화면이 거짓말을 한다. */
    '<div style="padding:0 16px 6px;font-size:10px;color:#9aa0a6">회색 = 지난 방문 · 오늘 '
      +now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+' 기준</div>' +
    '<div class="tl-list">'+listHtml+'</div>';
}


/* ═══════════════ SELLING POINTS RENDER ═══════════════ */
function renderSelling(key){
  if(!SELLING || !SELLING[key]) return '';
  const s = SELLING[key];
  if(!s||!s.points) return '';
  const pts = s.points.map((p,i)=>'<div class="sell-pt"><div class="sell-num">'+(i+1)+'</div><div class="sell-text">'+p+'</div></div>').join('');
  const qas = (s.objections||[]).map(o=>'<div class="sell-qa"><div class="sell-q">'+o.q+'</div><div class="sell-a">'+o.a+'</div></div>').join('');
  const objSec = qas ? '<div class="sell-obj"><div class="sell-obj-t">💬 자주 묻는 반론 대응</div>'+qas+'</div>' : '';
  return '<div class="sell-card" id="sellCard">' +
    '<div class="sell-hd" onclick="toggleSell()">' +
      '<div class="sell-t">🎯 영업 핵심 멘트</div>' +
      '<span class="sell-arr" id="sellArr">▼</span>' +
    '</div>' +
    '<div class="sell-body" id="sellBody">'+pts+objSec+'</div>' +
    '</div>';
}

let _sellOpen = false;
function toggleSell(){
  _sellOpen = !_sellOpen;
  const b = document.getElementById('sellBody');
  const a = document.getElementById('sellArr');
  if(b) b.style.display = _sellOpen?'block':'none';
  if(a) a.classList.toggle('open',_sellOpen);
}
</script>
<script>
/* 심벌 배선은 prod-symbols.js 가 스스로 한다 — 앱마다 복사해 두면 아홉 곳을 고쳐야 한다 */

/*
 * 고객에게 보낼 카드 — **지금 보고 있는 탭의 내용**을 이미지 한 장으로.
 *
 * 예전에는 탭과 무관하게 늘 `curCat` 의 회차표를 만들었다. 그래서 블루패스나
 * 전체보기를 보면서 공유를 누르면 **화면에 없는 '에어컨 회차표'가 나갔다**
 * (2026-08-11 사용자 지적, 네 탭 전부에서 재현됨). 고객에게 보내는 물건이
 * 화면과 다른 것은 이 도구에서 가장 위험한 종류의 고장이다.
 *
 * 그래서 `curMode` 로 갈라 각 탭이 자기 내용을 만든다. 만들 것이 없는 탭에서는
 * null 을 돌려주고 버튼도 감춘다(`syncCareShareBtn`) — 빈 카드를 내보내지 않는다.
 */
function careShareBuild(){
  const mode = (typeof curMode !== 'undefined') ? curMode : 'care';
  if (mode === 'bluepass') return bluepassShareBuild();
  if (mode === 'overview') return overviewShareBuild();

  /* care · timeline — 둘 다 회차표지만 보고 있는 제품·플랜이 다르다 */
  const useTl = (mode === 'timeline' && typeof tlKey !== 'undefined');
  const key = useTl ? tlKey : curCat;
  const pl  = useTl ? tlPlan : curPlan;
  const d = DATA[key];
  if (!d) return null;
  const sched = careSchedule(d, pl);
  if (!sched.length) return null;

  const sections = sched.map(function (r, i) {
    return {
      h: (i + 1) + '회차 · ' + r.month + '개월차' + (r.kind ? ' · ' + r.kind : ''),
      rows: (r.items || []).map(function (it) { return [it.nm, '', it.det || '']; }),
    };
  });
  sections.unshift({ h: '구독 조건', rows: [
    ['계약기간', d.contract || ''],
    ['방문 주기', d.plans ? planName(d, pl) : '매 ' + pl + '개월형'],
    ['총 방문', d.plans ? d.plans[pl].total : (d['total' + pl] || (sched.length + '회')) ],
  ] });

  return {
    app: '세일즈 코파일럿 · AI구독 케어 안내',
    title: d.name,
    sections: sections,
    note: (d.src ? d.src.replace(/^✅\s*/, '출처 — ') + ' · ' : '')
      + '실제 제공 항목은 제품·계약 조건에 따라 달라질 수 있습니다.',
    filename: 'AI구독케어_' + d.name.replace(/[\\/:*?"<>|]/g, '') + '_' + (d.plans ? planName(d, pl).replace(/[\s·]+/g,'') : pl + '개월형'),
  };
}

/* 블루패스 탭 — 화면에 뜬 혜택을 그대로 옮긴다.
 * 에어컨 전용 둘은 화면과 같이 항상 덧붙이되 어느 제품 것인지 머리글로 밝힌다. */
function bluepassShareBuild(){
  const line = (it) => [it.d, it.target ? '대상 — ' + it.target : '',
    it.need ? '필요 — ' + it.need : '', it.except ? '제외 — ' + it.except : '',
    it.cost ? '비용 — ' + it.cost : ''].filter(Boolean).join(' · ');
  const sections = [{
    h: '블루패스 혜택',
    rows: (BLUEPASS.items || []).map(it => [it.t, '', line(it)]),
  }];
  if ((BLUEPASS.aircon || []).length) {
    sections.push({ h: '에어컨 전용', rows: BLUEPASS.aircon.map(it => [it.t, '', line(it)]) });
  }
  return {
    app: '세일즈 코파일럿 · AI구독 케어 안내',
    title: '블루패스',
    subtitle: 'AI 올인원 2.0 구독 혜택',
    sections: sections,
    note: (BLUEPASS.gate ? BLUEPASS.gate + ' · ' : '')
      + (BLUEPASS.src ? BLUEPASS.src.replace(/^✅\s*/, '출처 — ') : ''),
    filename: 'AI구독케어_블루패스',
  };
}

/* 전체보기 탭 — 어떤 품목이 어떤 주기로 케어되는지 한 장으로. */
function overviewShareBuild(){
  const rows = (PRODUCTS || []).map(function (p) {
    const d = DATA[p.key];
    if (p.st !== 'done' || !d) return [p.name, '자가관리', ''];
    const plan = d.plans ? typesOf(d).map(t => PLAN_TYPE[t].short).join(' · ') : '';
    return [p.name, plan || '', d.contract || ''];
  });
  if (!rows.length) return null;
  return {
    app: '세일즈 코파일럿 · AI구독 케어 안내',
    title: '구독 케어 전체보기',
    subtitle: '품목별 방문 주기',
    sections: [{ h: '품목 ' + rows.length + '종', rows: rows }],
    note: '품목을 고르면 회차별 케어 내용을 볼 수 있습니다. 실제 제공 항목은 제품·계약 조건에 따라 달라질 수 있습니다.',
    filename: 'AI구독케어_전체보기',
  };
}

/* 만들 것이 없는 탭에서는 버튼을 감춘다 — 눌러도 아무 일이 없으면 고장으로 읽힌다.
 * AS 관련 정보가 연락처 탭에서 하는 것과 같은 방식이다. */
function syncCareShareBtn(){
  const b = document.getElementById('sk-share');
  if (!b) return;
  let ok = false;
  try { ok = !!careShareBuild(); } catch (e) { ok = false; }
  b.style.display = ok ? '' : 'none';
}

if (typeof mountShareButton === 'function') { mountShareButton(careShareBuild); syncCareShareBtn(); }
</script>
