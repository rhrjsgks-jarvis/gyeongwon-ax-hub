<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>제품 상세검색 — 키워드 제품 추천</title>
<!--
  폰트는 **화면을 막지 않게** 받는다(2026-08-11). 예전에는 렌더 차단 방식이라
  CDN 이 느리거나 막히면 그동안 화면이 비어 있었다 — 실측으로 포스터가 폰트 응답을
  기다리다 **13초** 걸린 적이 있다(CPU 는 97% 놀고 있었다). 매장 전파가 약하면 같은 일이 난다.
  `media="print"` 로 받아 다 받은 뒤 `all` 로 바꾸면 그리기를 막지 않는다.
  글꼴이 늦게 와도 -apple-system 등 대체 글꼴로 먼저 읽힌다.
  (**자체 호스팅이 정답이다** — three.js 를 vendor/ 에 받아 둔 것과 같은 이유. 다만 폰트
   파일을 받으려면 CDN 에 닿는 환경이 필요해 로컬 세션에서 할 일로 남겼다.)
-->
<link rel="stylesheet" href="/vendor/fonts/pretendard-variable.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/vendor/fonts/pretendard-variable.css"></noscript>
<style>
:root{
  --bg:#EDF2F9; --surface:#FFFFFF; --ink:#0E1C30; --sub:#5C6C82; --line:#D8E1EE;
  --blue:#1428A0; --blue-soft:#E4E9FB; --deep:#0D1B7A; --cyan:#4C7DF0; --cyan-soft:#E0F3FA;
  --good:#0E8A5F; --good-soft:#E3F4ED; --bad:#D6452C; --bad-soft:#FBEAE6; --amber:#9A6B00; --amber-soft:#FBF3DC;
  --mono:'JetBrains Mono','SF Mono','Consolas',monospace;
  --sans:'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR',sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(14,28,48,.05),0 6px 18px rgba(14,28,48,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 80px}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topbar{position:sticky;top:0;z-index:50;background:var(--blue);color:#fff}
.topbar-in{max-width:780px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;gap:10px}
/* 아이콘 배지 — 아홉 앱이 같은 머리를 갖도록(남색 바 + 배지 + 제목 + 부제).
   돋보기는 통합검색 전용이라 여기 쓰지 않는다. 나침반은 "찾아 준다"는 뜻이고
   다른 앱 아이콘(⚖️ 타사비교 · 🛠️ 설치환경 · 🛡️ AS · 🎯 퀴즈)과도 겹치지 않는다. */
.brand-ico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:18px}
.brand{flex:1;min-width:0}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.02em;display:block}
.brand span{font-size:11px;color:#9FB4D4;letter-spacing:.04em}
.mode{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:3px}
.mode button{font-size:12px;font-weight:700;padding:6px 11px;border-radius:7px;color:#A9BBD8;white-space:nowrap}
.mode button.on{background:#fff;color:var(--deep)}
/* 카탈로그 바로가기 — 모델파인더와 같은 제품 정보 도구라 모듈을 합치면서 상단바로 편입 */
.catalog-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;
  color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);white-space:nowrap;text-decoration:none;margin-left:8px}
.catalog-link:hover{background:rgba(255,255,255,.24)}
@media (max-width:480px){.catalog-link{font-size:11px;padding:6px 9px;margin-left:6px}}

/* 검색 히어로 */
.shero{padding:24px 2px 6px}
.shero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--cyan);font-weight:700}
.shero h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px}
.shero p{color:var(--sub);font-size:13px}
.searchbox{display:flex;gap:8px;margin:15px 0 11px}
.searchbox .field{flex:1;position:relative}
.searchbox input,.searchbox textarea{width:100%;font-family:var(--sans);font-size:15.5px;font-weight:600;
  padding:15px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow)}
.searchbox textarea{resize:none;height:84px;font-weight:500;line-height:1.5}
.searchbox input:focus,.searchbox textarea:focus{outline:none;border-color:var(--blue)}
.searchbox .go{background:var(--blue);color:#fff;font-size:14.5px;font-weight:800;padding:0 20px;border-radius:var(--r);
  box-shadow:var(--shadow);align-self:stretch}
.searchbox .go:active{background:#101F7E}
.exrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.ex{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);padding:6px 12px;border-radius:99px}
.ex:active{background:#D3DBF7}
.aihint{font-size:11.5px;color:var(--sub);margin:-2px 0 8px}

/* 해석 결과 바 */
.parsebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px;min-height:0}
.ptag{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;background:var(--cyan-soft);color:var(--cyan)}
.ptag.fil{background:var(--amber-soft);color:var(--amber)}
.ptag.cat{background:var(--deep);color:#fff}
/* DB 에 없어 조건에서 뺀 말 — 조용히 빼면 "왜 이게 나오지"가 된다 */
.ptag.off{background:#f3f4f6;color:#9aa0a6;font-weight:600}
.rescount{font-size:12px;color:var(--sub);font-weight:600;margin-left:auto}

/* 결과 목록 */
.sortrow{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.sortrow::-webkit-scrollbar{display:none}
.sbtn{flex:0 0 auto;font-size:12px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);color:var(--sub)}
.sbtn.on{background:var(--deep);border-color:var(--deep);color:#fff}
.rlist{display:flex;flex-direction:column;gap:10px}
/* ═══ 견적 담기 · 견적 한 장 ═══
   담기 버튼은 `.rmain`(카드 전체가 button) **밖**에 둔다 — 중첩 button 은 HTML 위반이라
   브라우저에 따라 클릭이 안 먹는다(AS 앱에서 겪은 것과 같은 함정). */
.rpick{display:flex;justify-content:flex-end;padding:0 14px 10px}
.rpick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:700;color:#555;cursor:pointer}
.rpick button.on{border-color:var(--brand);background:#f0f3ff;color:var(--brand)}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:10px 12px}
.qbar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.qbar-n{font-weight:800;color:var(--brand);font-size:13.5px;white-space:nowrap}
.qbar-sum{flex:1;font-size:12.5px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar-clear{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;color:#666;cursor:pointer}
.qbar-go{border:0;background:var(--brand);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer}
/* 견적 지면 — 공유는 화면을 그대로 찍으므로 이 DOM 이 곧 고객에게 나가는 그림이다 */
.qsheet{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 14px;margin-top:14px}
.qsheet h3{margin:0 0 2px;font-size:17px;font-weight:800;color:var(--brand)}
.qsheet .qsub{font-size:11.5px;color:#777;margin-bottom:12px}
.qrow{border-top:1px solid var(--line);padding:10px 0}
.qrow:last-of-type{border-bottom:1px solid var(--line)}
.qrow .qcat{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--cyan)}
.qrow .qname{font-size:14px;font-weight:700;margin-top:1px}
.qrow .qcode{font-size:11.5px;color:#777;font-family:ui-monospace,monospace}
.qrow .qmeta{font-size:11.5px;color:#555;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px}
.qprice{display:flex;align-items:center;gap:6px;margin-top:6px}
.qprice input{width:92px;border:1.5px solid var(--line);border-radius:7px;padding:5px 8px;
  font-size:13px;font-weight:700;text-align:right}
.qprice span{font-size:12px;color:#666}
.qtotal{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;font-size:15px}
.qtotal b{font-size:20px;color:var(--brand)}
.qwar{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.qwar h4{margin:0 0 6px;font-size:12.5px;font-weight:800;color:#333}
.qwar div{font-size:11.5px;color:#555;line-height:1.55}
.qnote{margin-top:12px;font-size:11px;color:#888;line-height:1.6}
.qacts{display:flex;gap:8px;margin-top:12px}
.qacts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;font-size:13px;cursor:pointer}
@media (max-width:520px){ .qbar-sum{display:none} }
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rmain{width:100%;text-align:left;padding:14px 16px 12px;display:block}
.rtop{display:flex;align-items:baseline;gap:8px}
.rcat{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--cyan)}
.rnew{font-size:9.5px;font-weight:800;color:#fff;background:var(--blue);padding:2px 7px;border-radius:5px;letter-spacing:.05em}
.rrank{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#A6B4C8;font-weight:700}
.rname{font-size:15px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
.rcode{font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:700}
.rmeta{display:flex;flex-wrap:wrap;gap:9px;margin-top:7px;font-size:12px;color:var(--sub)}
.rmeta b{color:var(--ink);font-weight:800;font-size:13px}
.rwhy{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.why{font-size:10.5px;font-weight:700;color:var(--good);background:var(--good-soft);padding:3px 9px;border-radius:6px}
.why.ai{color:#1428A0;background:#EEF2FF}
.rdetail{border-top:1px dashed var(--line);padding:12px 16px 14px;background:#FAFCFE;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.rdetail h5{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--sub);margin:9px 0 6px}
.rdetail h5:first-child{margin-top:0}
table.spec{width:100%;border-collapse:collapse;font-size:12.5px}
table.spec td{padding:6px 4px;border-bottom:1px solid #EEF2F8;vertical-align:top}
table.spec td:first-child{color:var(--sub);width:35%;font-weight:600}
table.spec tr:last-child td{border-bottom:none}
.flagrow{display:flex;flex-wrap:wrap;gap:5px}
.flg{font-size:11px;font-weight:600;background:var(--blue-soft);color:var(--blue);padding:4px 9px;border-radius:6px}
.flg.no{background:#F0F2F6;color:#9AA8BB;text-decoration:line-through}
/* 핵심 키워드·USP — 상담에서 바로 쓰는 셀링포인트라 기능칩과 구분되는 색으로 둔다 */
.flg.usp{background:#FFF4E5;color:#B45309;font-weight:700}
/* 카탈로그에 실제로 실린 모델임을 표시 — 삼성닷컴 조사 기반 모델과 구분한다 */
.catbadge{display:inline-block;margin-left:7px;font-size:10px;font-weight:700;background:#E7F6EE;color:#047857;border:1px solid #A7E3C6;padding:2px 7px;border-radius:5px;vertical-align:middle;letter-spacing:-.2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
.empty b{color:var(--ink)}
.notice{background:var(--amber-soft);border:1px solid #EBD9A8;border-radius:var(--r);padding:13px 15px;font-size:12.5px;color:#6E4F00;margin-bottom:11px;line-height:1.6}
.aicomment{background:#EEF2FF;border:1px solid #DCE4FB;border-radius:var(--r);padding:13px 15px;font-size:13px;color:#0D1B7A;margin-bottom:11px;line-height:1.6}
.aicomment b{display:block;font-size:10.5px;letter-spacing:.1em;margin-bottom:4px;color:#1428A0}
.loading{ text-align:center;color:var(--sub);font-size:13px;padding:26px 0}
.spin{display:inline-block;width:17px;height:17px;border:2.5px solid var(--line);border-top-color:var(--blue);border-radius:50%;
  animation:spin .8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:var(--deep);color:#fff;
  font-size:13px;font-weight:600;padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:all .25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2.5px solid var(--cyan);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.footer{margin-top:26px;text-align:center;font-size:11px;color:#93A3B8;line-height:1.7}
.footer b{font-family:var(--mono)}


/* ── AI 카테고리 선택기 ── */
.ai-budget{background:#f0f3ff;border:1.5px solid #1428A0;border-radius:10px;padding:10px 14px;font-size:14px;color:#1428A0;margin-bottom:14px}
.cat-selector-title{font-size:14px;font-weight:700;color:#333;margin-bottom:10px}
.cat-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cat-chip{display:flex;align-items:center;gap:6px;padding:8px 13px;border:2px solid var(--border);border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;color:#444;transition:all .15s;user-select:none}
/* 제품 심벌은 글자와 같은 크기면 작아 보인다 — 이모지가 차지하던 만큼 키운다 */
.cat-chip .ci{font-size:1.35em;display:flex;align-items:center}
.cat-chip.on{border-color:#1428A0;background:#f0f3ff;color:#1428A0;font-weight:700;box-shadow:0 0 0 2px #1428A040}
.cat-chip:has(input:checked){border-color:#1428A0;background:#f0f3ff;color:#1428A0}
/* cat-chip input removed */
.cat-src{font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:2px}
.cat-src-ce{background:#EEF2FF;color:#1428A0}
.cat-src-mx{background:#fff0e8;color:#cc4400}
.cat-search-btn{width:100%;padding:14px;background:#1428A0;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.cat-search-btn:active{background:#0f1f80}
.ai-result-header{background:#f8f9fb;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.ai-total{font-size:15px;font-weight:800;color:#1428A0}

/* ── AI Step2: 카테고리별 세부 설정 ── */
.step2-wrap{display:flex;flex-direction:column;gap:14px}
.cat-config-card{border:2px solid var(--border);border-radius:14px;padding:14px 16px;background:#fff}
.cat-config-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cat-config-name{font-size:15px;font-weight:800;color:#222}
.cat-budget-wrap{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cat-budget-wrap label{font-size:12px;font-weight:600;color:#555;white-space:nowrap}
.cat-budget-input{flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-weight:700;text-align:right;outline:none}
.cat-budget-input:focus{border-color:#1428A0}
.cat-budget-unit{font-size:13px;font-weight:700;color:#555}
.feat-title{font-size:12px;font-weight:600;color:#888;margin-bottom:6px}
.feat-grid{display:flex;flex-wrap:wrap;gap:6px}
.feat-chip{display:flex;align-items:center;gap:4px;padding:5px 10px;border:1.5px solid #ddd;border-radius:16px;cursor:pointer;font-size:12px;color:#555;transition:all .15s;user-select:none}
.feat-chip.on{border-color:#1428A0;background:#f0f3ff;color:#1428A0;font-weight:700}
.feat-chip input{display:none}
.total-bar{position:sticky;bottom:0;background:#1428A0;color:#fff;padding:14px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.total-bar-label{font-size:13px;opacity:.85}
.total-bar-price{font-size:18px;font-weight:800}
.step-back-btn{background:none;border:2px solid var(--border);color:#555;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px}
.ai-result-total{background:#1428A0;color:#fff;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ai-result-total-label{font-size:13px;opacity:.85}
.ai-result-total-price{font-size:17px;font-weight:800}



.ai-reason-block { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
.why-reason { background:#EEF2FF; color:#1428A0; border:1px solid #DCE4FB; border-radius:10px; padding:2px 9px; font-size:11.5px; font-weight:700; }
.why-match { background:#e8f5e9; color:#2e7d32; border:1px solid #c8e6c9 !important; }
.why-miss  { background:#fce4ec; color:#b71c1c; border:1px solid #f8bbd0 !important; }
.ai-feat-block { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
.ai-budget-bar { display:flex; align-items:center; gap:6px; margin-top:6px; }
.ai-budget-label { font-size:11.5px; color:#555; white-space:nowrap; }
.ai-budget-track { flex:1; height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; }
.ai-budget-fill { height:100%; border-radius:3px; transition:width .4s; }
.ai-budget-pct { font-size:11.5px; font-weight:700; white-space:nowrap; }

/* ═══ AI추천 v3 CSS ═══ */
.auto-dist-btn{display:block;width:100%;margin:8px 0 4px;padding:10px;background:#e8f5e9;border:1.5px solid #4caf50;border-radius:10px;color:#2e7d32;font-size:14px;font-weight:700;cursor:pointer;text-align:center;}
.auto-dist-btn:active{background:#c8e6c9;}

/* 카테고리 그룹 */
.ai-cat-group{margin-bottom:20px;}
.ai-cat-group-head{font-size:15px;font-weight:800;color:#1428A0;padding:8px 0 6px;border-bottom:2px solid #1428A0;margin-bottom:10px;}

/* 3티어 가로 행 */
.ai-tier-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.ai-tier-row::-webkit-scrollbar{height:4px;}
.ai-tier-row::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px;}

/* 티어 카드 */
.ai-tier-card{flex:0 0 calc(33.3% - 7px);min-width:200px;background:#fff;border:1.5px solid #e0e0e0;border-radius:14px;padding:14px 12px 10px;cursor:pointer;transition:box-shadow .2s,border-color .2s;}
.ai-tier-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);border-color:#1428A0;}
.ai-card-name{font-size:13px;font-weight:700;color:#111;margin-bottom:3px;line-height:1.3;}
.ai-card-model{font-size:11px;color:#888;margin-bottom:6px;font-family:monospace;}
.ai-card-price{font-size:20px;font-weight:900;color:#1428A0;margin-bottom:8px;}

/* 티어 배지 */
.tier-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.3px;}
.tier-premium{background:#1428A0;color:#fff;}
.tier-standard{background:#37474f;color:#fff;}
.tier-value{background:#e65100;color:#fff;}
.tier-legend{display:flex;align-items:center;gap:6px;margin:8px 0 14px;flex-wrap:wrap;}

/* 셀링포인트 */
.sell-pts{display:flex;flex-direction:column;gap:2px;margin:6px 0;}
.sell-pt{font-size:11.5px;color:#444;line-height:1.4;}

/* 추천 이유 */
.ai-reason-block{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px;}
.why-reason{background:#EEF2FF;color:#1428A0;border:1px solid #DCE4FB;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;}
.ai-feat-block{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px;}
.why-match{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9 !important;font-size:10.5px;}
.why-miss{background:#fce4ec;color:#b71c1c;border:1px solid #f8bbd0 !important;font-size:10.5px;}

/* 예산 바 */
.ai-budget-bar{display:flex;align-items:center;gap:5px;margin-top:8px;}
.ai-budget-label{font-size:10.5px;color:#555;white-space:nowrap;flex-shrink:0;}
.ai-budget-track{flex:1;height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden;min-width:40px;}
.ai-budget-fill{height:100%;border-radius:3px;transition:width .4s;}
.ai-budget-pct{font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;}

/* 상세 스펙 토글 */
.ai-detail-toggle{margin-top:10px;font-size:11.5px;color:#1428A0;text-align:center;padding:5px 0 0;}
.ai-detail-body{margin-top:8px;border-top:1px solid #eee;padding-top:8px;}
.spec-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #f5f5f5;gap:8px;}
.spec-row span{color:#777;}
.spec-row b{color:#111;text-align:right;}
.spec-row-full{margin-top:6px;}
.spec-on-label{font-size:10.5px;color:#2e7d32;font-weight:700;display:block;margin-bottom:3px;}
.spec-off-label{font-size:10.5px;color:#b71c1c;font-weight:700;display:block;margin-top:4px;margin-bottom:3px;}

/* 모바일 반응형 */
@media(max-width:520px){
  .ai-tier-row{flex-direction:column;}
  .ai-tier-card{min-width:unset;flex:none;}
}

/* ─── 질의 해석 ─── */
function parseQuery(raw){
  /*
   * **숫자 안의 쉼표는 지우고, 나머지 쉼표만 구분자로 본다.**
   * 통째로 공백으로 바꾸던 탓에 *"1,200만원 이하 TV"* 가 `1 200만원 이하` 가 되어 예산을
   * **200만원**으로 읽었다 — 0건도 아니고 **조용히 틀린 답**을 내밀었다(1,000만은 0만원이
   * 되어 0건). 상담에서 예산을 쉼표로 쓰는 것이 오히려 자연스럽다.
   * 통합검색 `normalize()` 와 같은 규칙이다.
   */
  let q = " " + raw.toLowerCase().replace(/(\d),(?=\d)/g,"$1").replace(/,/g," ") + " ";
  const P = {tokens:[], terms:[], budgetMax:null, budgetMin:null, dim:{}, cats:[], wantNew:false, wantValue:false, wantPremium:false, pkg:false, unsupported:[], tags:[], areaMin:null,
    // 형태 필터(SUBCAT) · 조건 그룹(그룹 안은 OR, 그룹끼리는 AND) · DB 에 없어 뺀 말
    subs:[], groups:[], ignored:[]};
  // 예산
  let m = q.match(/(\d{2,5})\s*(?:만\s*원?)?\s*[~∼\-]\s*(\d{2,5})\s*만\s*원?/);
  if(m){ P.budgetMin=+m[1]; P.budgetMax=+m[2]; q=q.replace(m[0]," "); P.tags.push(`예산 ${m[1]}~${m[2]}만원`); }
  m = q.match(/(\d{2,5})\s*만\s*원?\s*(이하|이내|미만|까지|아래)/);
  if(m && !P.budgetMax){ P.budgetMax=+m[1]; q=q.replace(m[0]," "); P.tags.push(`예산 ${m[1]}만원 ${m[2]}`); }
  m = q.match(/(\d{2,5})\s*만\s*원?\s*(이상|넘|초과)/);
  if(m && !P.budgetMin){ P.budgetMin=+m[1]; q=q.replace(m[0]," "); P.tags.push(`예산 ${m[1]}만원 이상`); }
  // 치수
  const dimDefs = [["폭","w"],["가로","w"],["너비","w"],["높이","h"],["세로","h"],["깊이","d"],["두께","d"]];
  for(const [word,axis] of dimDefs){
    const r = new RegExp(word+"\\s*(\\d{2,4})\\s*(?:mm)?\\s*(이하|이내|미만|까지)?");
    m = q.match(r);
    if(m){ P.dim[axis]=+m[1]; q=q.replace(m[0]," "); P.tags.push(`${word} ${m[1]}mm 이하`); }
  }
  /*
   * 면적 — "19평", "62㎡" 처럼 **공간 크기로 고르는 품목**(에어컨·공기청정기·제습기)이 있다.
   * 예전에는 이 말이 그냥 토큰이 되어 아무 데도 안 걸리고 **조용히 무시됐다** — "19평 에어컨"이
   * "에어컨"과 결과가 똑같았다(2026-08-11 사용자 지적: *"무풍 공기청정 19평 이런식으로
   * 복합적으로 검색할수있게 해줘야합니다"*).
   *
   * 뜻은 **"그 공간을 감당하는가"** 이므로 `면적 >= 요청` 으로 거른다(이하가 아니다).
   * 1평 = 3.3058㎡. 치수(`이하`)와 방향이 반대라는 점을 헷갈리지 말 것.
   */
  m = q.match(/(\d{1,3}(?:\.\d+)?)\s*평/);
  if(m){ P.areaMin = +m[1] * 3.3058; q = q.replace(m[0]," ");
         P.tags.push(`${m[1]}평(${P.areaMin.toFixed(1)}㎡) 이상`); }
  if(P.areaMin==null){
    m = q.match(/(\d{1,3}(?:\.\d+)?)\s*(?:㎡|m2|제곱미터)/i);
    if(m){ P.areaMin = +m[1]; q = q.replace(m[0]," "); P.tags.push(`${m[1]}㎡ 이상`); }
  }

  // 토큰화 + 복합어 분해 + 사전 매핑
  /* 앞뒤 문장부호를 뗀다 — "냉장고?" 가 0종이었다. 사람은 물음표를 붙여 묻는다.
     가운데 기호는 두어야 `2026.03.19`·`w×h×d` 가 조각나지 않는다. */
  const rawToks = q.split(/\s+/).filter(t=>t.length>=2 || /^[a-z0-9]+$/.test(t) && t.length>=1)
    .map(t => t.replace(/^[?!.,;:~"'`()[\]{}<>]+|[?!.,;:~"'`()[\]{}<>]+$/g,"") || t)
    .filter(Boolean);
  const JOSA = /(으로|로|은|는|이|가|을|를|에서|에|도|만|랑|이랑|와|과|좀|요|의|에게|한테|부터|까지)$/;
  const seen = new Set();
  for(let i=0;i<rawToks.length;i++){
    const t0 = rawToks[i];
    /*
     * 형태부터 본다 — decompound 보다 먼저다. '로봇청소기'가 DECOMP 에서 ['로봇','청소기']로
     * 쪼개지면 그 뒤로는 그냥 청소기 전체가 되어 형태를 되살릴 방법이 없다.
     *
     * **띄어 쓴 것과 조사 붙은 것까지 함께 본다**(2026-08-11). 예전에는 토큰 하나를
     * 표에 그대로 대조해서 두 가지로 새어 나갔다:
     *   ① *"드럼 세탁기"* 처럼 띄어 쓰면 안 맞아 **콤보 11 · 설치키트 8 · 통돌이 2 가
     *      섞인 38종**이 나왔다(붙여 쓴 "드럼세탁기"는 17종). *"무선 청소기"* 에는
     *      로봇청소기가 섞였다.
     *   ② '통돌이' 는 조사 제거가 '이'를 떼어 **'통돌'** 이 되어 표에 없는 말이 됐고,
     *      그대로 "없는 말이라 뺐습니다"로 조건에서 빠졌다.
     * 그래서 **다음 토큰까지 이어 붙인 것 · 조사를 뗀 것**을 후보로 함께 대조하고,
     * 이어 붙인 쪽이 맞으면 두 토큰을 함께 소비한다.
     */
    const nx  = rawToks[i+1] || "";
    const nxs = nx ? (nx.replace(JOSA,"") || nx) : "";
    const t0s = t0.replace(JOSA,"") || t0;
    let hit = null;
    for(const [k, skip] of [[nx?t0+nxs:"",1],[nx?t0s+nxs:"",1],[t0,0],[t0s,0]]){
      if(k && SUBCAT[k]){ hit = {k, skip}; break; }
    }
    if(hit){
      const s = SUBCAT[hit.k];
      if(!P.cats.includes(s.cat)) P.cats.push(s.cat);
      if(!P.subs.some(x=>x.label===s.label && x.cat===s.cat)) P.subs.push(s);
      if(!P.tags.includes("형태: "+s.label)) P.tags.push("형태: "+s.label);
      P.tokens.push(hit.k);
      seen.add(hit.k);
      i += hit.skip;
      continue;
    }
    let t = t0.replace(JOSA,"") || t0;
    if(t.length<2 && !/^[a-z0-9]{2,}$/.test(t)) continue;
    if(seen.has(t)) continue; seen.add(t);
    if(UNSUPPORTED[t]){ P.unsupported.push(UNSUPPORTED[t]); continue; }
    const decomped = decompound(t);
    if(decomped){
      for(const e of decomped){
        if(!P.terms.includes(e)) P.terms.push(e);
        if(CATSYN[e]) CATSYN[e].forEach(c=>{ if(!P.cats.includes(c)) P.cats.push(c); });
      }
      // 복합어는 이미 카테고리로 좁혀졌다 — 조각을 다시 AND 조건으로 걸지 않는다
      P.groups.push({raw:t, forms:decomped.map(e=>e.toLowerCase()), req:false});
      P.tokens.push(t); continue;
    }
    const isCat = !!CATSYN[t];
    if(isCat){ CATSYN[t].forEach(c=>{ if(!P.cats.includes(c)) P.cats.push(c); }); P.tags.push("카테고리: "+t); }
    const exp = SYN[t] || [t];
    /*
     * **친 말 자체를 조건에서 빼지 않는다.** SYN 은 치환표라 `"헤드폰":["버즈"]` 처럼
     * 원래 말이 목록에 없는 항목이 있는데, 그대로 두면 "JBL 헤드폰"이 **0건**이 된다
     * (JBL 헤드폰 kw 에는 '버즈'가 없다). 그룹 안은 OR 이라 원래 말을 더하는 것은
     * 넓히기만 한다 — 좁아져서 사라지는 일이 없다.
     */
    const forms = [t];
    for(const e of exp){
      if(e==="__NEW__"){ P.wantNew=true; continue; }
      if(e==="__VALUE__"){ P.wantValue=true; continue; }
      if(e==="__PREMIUM__"){ P.wantPremium=true; continue; }
      if(e==="__PKG__"){ P.pkg=true; continue; }
      if(!P.terms.includes(e)) P.terms.push(e);
      forms.push(e.toLowerCase());
    }
    /*
     * **인치 ↔ 형** — TV 는 데이터가 `65형` 으로, 모니터·노트북·태블릿은 `27인치` 로
     * 적혀 있다. 상담사는 둘 다 쓰므로 표기를 이어 준다(통합검색 `UNIT_PAIRS` 와 같은 규칙).
     * 맨숫자로는 넓히지 않는다 — '65' 하나면 `165hz`·`1,658.8` 이 걸린다.
     */
    const um = t.match(/^(\d{2,3})(인치|형)$/);
    if(um){
      for(const v of [um[1]+"인치", um[1]+"형"]){
        if(!forms.includes(v)) forms.push(v);
        if(!P.terms.includes(v)) P.terms.push(v);
      }
    }
    // 카테고리 말은 카테고리 필터가 이미 하므로 조건으로 또 걸지 않는다
    if(forms.length) P.groups.push({raw:t, forms, req:!isCat});
    P.tokens.push(t);
  }
  return P;
}

/*
 * 제품이 감당하는 면적(㎡). 라벨이 품목마다 달라(냉방면적(㎡) · 적용면적 · 청정면적)
 * **라벨에 '면적'이 들어간 항목**에서 첫 숫자를 읽는다. 값에 단위가 붙은 것도 있다("60㎡").
 * 면적 표기가 없는 제품은 null 이고, 면적 조건이 걸리면 후보에서 빠진다 —
 * 감당 여부를 알 수 없는 것을 "됩니다"로 내밀 수는 없다.
 */
function prodArea(p){
  for(const [k,v] of (p.fx||[])){
    if(!/면적/.test(k)) continue;
    const m = String(v).match(/(\d{1,3}(?:\.\d+)?)/);
    if(m) return +m[1];
  }
  return null;
}

/* ─── 스코어링 (정확 일치 가중치 개선) ─── */
function search(P){
  /* ─── 패키지 모드 (신혼/혼수/이사/입주) ─── */
  if(P.pkg){
    const PKG_CATS=['냉장고','세탁기·콤보','건조기','TV','에어컨','식기세척기','에어드레서','청소기'];
    const out=[];
    for(const cat of PKG_CATS){
      let items=PRODUCTS.filter(p=>p.src==='CE'&&p.cat===cat);
      // 패키지 추천은 예산 배분이 핵심이라 가격 미상 제품은 후보에서 제외한다
      items=items.filter(p=>p.price!=null);
      if(P.budgetMax!==null){
        // 예산 내 제품 우선, 없으면 전체에서 선택
        const inBudget=items.filter(p=>p.price<=P.budgetMax);
        if(inBudget.length) items=inBudget;
      }
      if(!items.length) continue;
      // 중간가 제품 선택 (플래그십보다 현실적인 라인)
      items.sort((a,b)=>b.price-a.price);
      const pick=items[Math.min(1,items.length-1)]; // 2번째 제품(중고가)
      out.push({p:pick, sc:10, hits:['패키지추천']});
    }
    return out;
  }
  /*
   * ─── 조건은 AND, 조건 안의 표기는 OR ───
   *
   * 예전에는 **카테고리만 맞으면 나머지 조건이 하나도 안 맞아도 남겼다**(`sc=1` 폴백).
   * 그래서 "로봇청소기 직배수"가 직배수 없는 제품까지 다 내밀었다. 조건을 겹쳐 좁히라고
   * 만든 도구에서 조건이 아무 일도 안 하면 없느니만 못하다.
   *
   * 다만 **없는 말은 조건에서 뺀다** — "부모님 효도 워치"의 '효도'처럼 사람이 덧붙이는 말이
   * 섞이는데, 그 하나 때문에 문장 전체가 0건이 되면 상담이 막힌다. 목록으로 관리하지 않고
   * **데이터가 스스로 판정하게** 한다(통합검색과 같은 원칙). 조용히 빼지 않는다 —
   * 뺀 말은 해석 바에 적는다.
   *
   * **판정 범위는 DB 전체가 아니라 "지금 보고 있는 선반"(카테고리·형태로 걸러낸 후보)이다.**
   * 전체로 판정했더니 *"비스포크 냉장고"* 가 **0종**이 됐다 — 냉장고 kw 에는 '비스포크'가
   * 한 종도 없는데 에어드레서·청소기에 14종이 있어 조건이 살아남아 AND 를 깨뜨렸다.
   * 그 카테고리 안에서 아무것도 못 거르는 조건은 그 상담에서 뜻이 없는 말이다.
   */
  const pool = PRODUCTS.filter(p=>
    (!P.cats.length || P.cats.includes(p.cat)) &&
    !P.subs.some(s=>p.cat===s.cat && !s.re.test(p.model)));
  const liveG = [];
  P.ignored = [];
  for(const g of (P.groups||[])){
    if(!g.req || !g.forms.length) continue;
    if(pool.some(p=>g.forms.some(f=>p.kw.indexOf(f)>=0))) liveG.push(g);
    else P.ignored.push(g.raw);
  }

  const out = [];
  for(const p of PRODUCTS){
    // 형태 필터는 자기 카테고리 안에서만 건다("드럼세탁기 건조기"에서 건조기까지 지우지 않게)
    if(P.subs.length && P.subs.some(s=>p.cat===s.cat && !s.re.test(p.model))) continue;
    if(liveG.length && !liveG.every(g=>g.forms.some(f=>p.kw.indexOf(f)>=0))) continue;
    // 가격 미상(price:null) 제품은 예산 조건이 걸린 검색에서 제외한다. null은 JS 비교에서
    // 0으로 취급돼 "예산 이하"에 항상 걸리므로, 그대로 두면 가격 없는 제품이 최저가처럼
    // 상단에 뜨는 왜곡이 생긴다(카탈로그 기준 구세대 모델은 출시가 정보가 없음).
    if((P.budgetMax!==null || P.budgetMin!==null) && p.price==null) continue;
    if(P.budgetMax!==null && p.price > P.budgetMax) continue;
    if(P.budgetMin!==null && p.price < P.budgetMin) continue;
    if(Object.keys(P.dim).length){
      const d = getDims(p); if(!d) continue;
      if(P.dim.w && d.w > P.dim.w) continue;
      if(P.dim.h && d.h > P.dim.h) continue;
      if(P.dim.d && d.d > P.dim.d) continue;
    }
    if(P.cats.length && !P.cats.includes(p.cat)) continue;
    if(P.areaMin!=null){
      const a = prodArea(p);
      if(a==null || a < P.areaMin) continue;
    }
    let sc = 0; const hits = [];
    for(const t of P.terms){
      const tl = t.toLowerCase();
      if(p.kw.indexOf(tl) >= 0){
        const exactWord = new RegExp("(^|\\s)"+tl.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(\\s|$)");
        sc += exactWord.test(p.kw) ? 5 : 3; hits.push(t);
      }
      if(p.model.toLowerCase().indexOf(tl) === 0 && tl.length>=3) sc += 8;
    }
    if(P.cats.length) sc += 4;
    if(P.areaMin!=null){ sc += 4; hits.push(`${prodArea(p)}㎡ 커버`); }
    if(P.wantNew && p.isnew){ sc += 3; hits.push("2026 신형"); }
    if(P.wantPremium) sc += Math.min(4, p.price/120);
    const hasTerms = P.terms.length > 0;
    if(hasTerms && hits.length===0 && !P.cats.length) continue;
    if(hasTerms && hits.length===0 && P.cats.length) sc = 1;
    out.push({p, sc, hits});
  }
  out.sort((a,b)=>{
    if(b.sc !== a.sc) return b.sc - a.sc;
    if(P.wantValue) return a.p.price - b.p.price;
    if(a.p.isnew !== b.p.isnew) return b.p.isnew - a.p.isnew;
    return b.p.price - a.p.price;
  });
  return out;
}

/* ─── 렌더링 ─── */
let lastResults = [], openId = null, sortMode = "rank";
const EXAMPLES = [
  "무풍 에어컨 300만 이하","폭 700 냉장고","S펜 노트북 OLED",
  "혈압 측정 워치","게이밍 모니터 240hz","펫 세탁기 콤보",
  "로봇청소기 직배수","2026 신형 TV","통역 이어폰 노캔",
  "가성비 태블릿 학생","크리에이터 노트북","부모님 효도 워치",
  "블루스카이 공기청정기 60㎡","사운드바 돌비애트모스","김치냉장고 스탠드형",
  "인덕션 빌트인 3구","큐커 오븐 에어프라이어",
  "비스포크 냉장고","여름 무풍 에어컨 2026","신혼가전 패키지"
];

function renderExamples(){
  $("exRow").innerHTML = EXAMPLES.map(e=>`<button class="ex" onclick="exGo('${e}')">${e}</button>`).join("");
}
function exGo(e){ $("q").value = e; runSearch(); }

function runSearch(){
  const raw = ($("q").value||"").trim();
  $("aiHost").innerHTML = "";
  if(!raw){ toast("키워드를 입력하세요"); return; }
  const P = parseQuery(raw);
  // 검색을 먼저 돌린다 — "DB 에 없어 뺀 말"이 그 안에서 판정되고, 해석 바가 그걸 보여준다
  lastResults = search(P);
  // 해석 태그 바
  $("parseBar").innerHTML = [
    ...P.tags.map(t=>`<span class="ptag ${t.startsWith('카테고리')||t.startsWith('형태')?'cat':'fil'}">${esc(t)}</span>`),
    ...P.terms.slice(0,6).map(t=>`<span class="ptag">${esc(t)}</span>`),
    ...(P.ignored||[]).map(t=>`<span class="ptag off">${esc(t)} — 없는 말이라 뺐습니다</span>`)
  ].join("") + `<span class="rescount" id="resCount"></span>`;
  // 미수록 안내
  $("noticeHost").innerHTML = P.unsupported.length ?
    `<div class="notice"><b>${P.unsupported.map(esc).join(", ")}</b>은(는) 현재 DB 미수록 카테고리입니다. [DB 최신화] 작업으로 보강 예정이며, 우선 수록된 22개 카테고리에서 검색해 보세요.</div>` : "";
  sortMode = P.wantValue ? "asc" : "rank";
  renderSortRow();
  renderResults();
}
function renderSortRow(){
  const row = $("sortRow");
  if(!lastResults.length){ row.classList.add("hidden"); return; }
  row.classList.remove("hidden");
  const B = [["rank","추천순"],["asc","낮은 가격"],["desc","높은 가격"],["new","2026 신형"]];
  row.innerHTML = B.map(([k,l])=>`<button class="sbtn ${sortMode===k?'on':''}" onclick="setSort('${k}')">${l}</button>`).join("");
}
function setSort(k){ sortMode=k; renderSortRow(); renderResults(); }
function sorted(){
  const r = lastResults.slice();
  // 가격 미상 제품은 가격 정렬 시 항상 뒤로 보낸다(null을 0으로 취급해 최저가에 끼는 것 방지)
  const pr=(x)=>x.p.price==null?null:x.p.price;
  const byPrice=(a,b,dir)=>{const A=pr(a),B=pr(b);if(A==null&&B==null)return 0;if(A==null)return 1;if(B==null)return -1;return dir*(A-B);};
  if(sortMode==="asc") r.sort((a,b)=>byPrice(a,b,1));
  if(sortMode==="desc") r.sort((a,b)=>byPrice(a,b,-1));
  if(sortMode==="new") r.sort((a,b)=>(b.p.isnew-a.p.isnew)||(b.sc-a.sc));
  return r;
}
function renderResults(){
  const list = sorted().slice(0,15);
  /*
   * **화면에 없는 제품이 공유 카드로 나가지 않게 한다**(2026-08-11 사용자 지적:
   * *"공유 눌렀을 때 현재 페이지가 공유되어야 하는데 다른 내용이 자꾸 나온다"*).
   * 상세를 펼쳐 둔 채 다른 검색을 하면 `openId` 가 그대로 남아, 화면에는 로봇청소기가
   * 떠 있는데 카드에는 **직전에 보던 에어컨**이 담겨 나갔다(실측 재현).
   * 목록을 다시 그리는 곳이 여기 하나뿐이라, 지금 그리는 목록에 없으면 여기서 지운다.
   */
  if (openId != null && !list.some(r => r.p.id === openId)) openId = null;
  syncShareBtn();
  const rc = $("resCount"); if(rc) rc.textContent = `${lastResults.length}종 매칭 · 상위 ${list.length}종`;
  if(!lastResults.length){
    $("rHost").innerHTML = `<div class="empty"><b>매칭 결과가 없습니다.</b><br>키워드를 줄이거나 예산·치수 조건을 완화해 보세요.<br>예: "무풍 에어컨" / "폭 920 냉장고" / "노트북 200만 이하"</div>`;
    return;
  }
  $("rHost").innerHTML = list.map((r,i)=>rcard(r,i)).join("");
}
/* ═══════════════ 견적 한 장 ═══════════════
 *
 * **상담이 끝나면 고객 손에 아무것도 안 남는 것**이 이 도구의 가장 큰 구멍이었다.
 * 배치 시뮬레이터만 결과 이미지를 내보내고 있었고, 제품 상담 전체를 담은 한 장이 없었다.
 * 제품과 가격이 있는 자리가 여기라 여기 붙인다.
 *
 * **그림을 따로 그리지 않는다.** 공유는 지금 화면을 그대로 찍으므로(`share-kit.js`),
 * 견적을 DOM 으로 그리면 헤더 공유 버튼이 그것을 그대로 이미지로 만든다 —
 * "보고 있는 것과 나가는 것이 갈리는" 옛 사고가 원천적으로 안 난다.
 *
 * **가격은 상담사가 확정한다.** DB 의 `price` 는 출시가라 매장·프로모션·설치비에 따라
 * 실제 판매가와 다르다. 고객에게 나가는 종이에 출시가를 그대로 박으면 그 숫자로
 * 약속한 것처럼 읽힌다. 그래서 **기본값으로 채워 두고 고칠 수 있게** 두고,
 * 지면에도 그 사실을 적는다. 가격이 없는 제품(`price:null`)은 빈 칸으로 둔다 —
 * 0원처럼 보이면 안 된다.
 */
var quotePicks = new Set();   /* var 로 둔다 — 고전 스크립트에서 let 은 window 에 안 붙어 검사가 못 본다 */
var quotePrice = {};      // id → 상담사가 고친 가격(만원). 없으면 출시가를 쓴다.
var WARRANTY = null;      // 견적을 열 때만 받는다(품목별 무상보증, 2KB)

function quoteToggle(id){
  if (quotePicks.has(id)) { quotePicks.delete(id); delete quotePrice[id]; }
  else quotePicks.add(id);
  renderResults();
  quoteSyncBar();
  if (document.getElementById('qsheet')) quoteRender();
}
function quoteClear(){
  quotePicks = new Set(); quotePrice = {};
  const h = $("quoteHost"); if (h) h.innerHTML = '';
  quoteHideSearch(false);
  renderResults(); quoteSyncBar();
}
function quoteItems(){
  return [...quotePicks].map((id) => PRODUCTS.find((p) => p.id === id)).filter(Boolean);
}
/** 그 제품에 쓸 가격(만원) — 상담사가 고친 값이 있으면 그것, 없으면 출시가, 둘 다 없으면 null */
function quoteAmt(p){
  const v = quotePrice[p.id];
  if (v != null && v !== '') return Number(v);
  return p.price == null ? null : p.price;
}
function quoteSyncBar(){
  const bar = $("qbar"); if (!bar) return;
  const items = quoteItems();
  bar.hidden = items.length === 0;
  if (!items.length) return;
  const amts = items.map(quoteAmt);
  const sum = amts.filter((v) => v != null).reduce((s, v) => s + v, 0);
  const unknown = amts.filter((v) => v == null).length;
  $("qbarN").textContent = items.length + '개';
  $("qbarSum").textContent = sum.toLocaleString() + '만원'
    + (unknown ? ` · 가격 미정 ${unknown}개` : '');
}
async function quoteOpen(){
  if (!quoteItems().length) { toast('견적에 담긴 제품이 없습니다'); return; }
  if (!WARRANTY) {
    /* 품목별 무상보증은 as-app 의 원문에서 뽑은 생성물이다(`scripts/build-warranty.mjs`).
       손으로 옮겨 적으면 한쪽만 고쳤을 때 조용히 어긋난다. 받지 못하면 그 칸만 비운다. */
    try { WARRANTY = await (await fetch('warranty.json')).json(); }
    catch (e) { WARRANTY = {}; }
  }
  quoteRender();
  /*
   * **견적을 열면 검색 화면을 감춘다.** 공유가 화면을 통째로 찍기 때문이다 —
   * 안 감추면 고객에게 나가는 그림에 상담사의 검색창과 결과 카드 15장이 함께 찍힌다.
   * "지금 보이는 것이 그대로 나간다"는 규칙을 지키려면 **보이는 것 자체를** 견적만 남겨야 한다.
   */
  quoteHideSearch(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
/** 견적 지면만 남기고 검색 화면을 접는다(되돌릴 수 있게 표시만 바꾼다) */
function quoteHideSearch(on){
  for (const id of ['rHost', 'sortRow', 'parseBar', 'noticeHost', 'aiHost']) {
    const el = document.getElementById(id);
    if (el) el.style.display = on ? 'none' : '';

/*
 * 상세를 펼쳐 둔 채 휴대폰 뒤로가기를 누르면 앱을 통째로 벗어났다. 펼침도 "연 것"이므로
 * 뒤로가기가 그것부터 접는다(back-kit.js). 펼친 것은 언제나 하나(`openId`)라 스택도 하나다.
 */
function closeDetail(){ if (openId == null) return; openId = null; renderResults(); syncShareBtn(); }
function toggleDetail(id){
  const wasOpen = openId != null;
  const opening = openId !== id;
  openId = opening ? id : null;
  renderResults(); syncShareBtn();
  if (!window.Back) return;
  /*
   * **쌓는 것은 "닫힘 → 열림" 일 때뿐이다.** 다른 카드를 눌러 옮겨 갈 때도 쌓으면
   * 펼친 것은 하나인데 칸은 둘이 되어, 뒤로가기 한 번이 아무 일도 안 하고 삼켜진다.
   */
  if (opening && !wasOpen) Back.open(closeDetail, () => openId != null);
  else if (!opening) Back.done();
}

/*
 * 고객에게 보낼 카드 — **상세를 펼친 제품 하나**를 담는다.
 * 검색 결과 목록을 통째로 보내면 고객이 무엇을 본 것인지 알 수 없고, 상담에서
 * 실제로 이야기한 것은 펼쳐 놓고 함께 본 그 제품이다. 그래서 펼친 것이 없으면
 * 버튼을 감춘다 — 무엇이 나갈지 모르는 채로 누르게 두지 않는다.
 *
 * 모델코드는 **넣는다.** 배치 시뮬레이터는 대표모델이 자리끼움이라 코드를 감추지만,
 * 여기서는 고객이 그 코드로 검색·문의하게 되는 것이 목적이다.
 */
function finderShareBuild(){
  if (openId == null) return null;
  const p = PRODUCTS.find(function (x) { return x.id === openId; });
  if (!p) return null;
  const sections = [];
  const fx = (p.fx || []).filter(function (r) { return r[0] !== '등급'; });
  if (fx.length) sections.push({ h: '스펙 (DB 검증값)', rows: fx.map(function (r) { return [r[0], '', r[1]]; }) });
  if ((p.on || []).length)  sections.push({ h: '탑재 기능', rows: p.on.map(function (f) { return [f, '']; }) });
  if ((p.off || []).length) sections.push({ h: '미탑재 — 과장 안내 주의', rows: p.off.map(function (f) { return [f, '']; }) });
  /* 가격 미상(price:null)은 "가격 문의"로 나간다 — 0 원처럼 보이면 안 된다 */
  sections.unshift({ h: '제품', rows: [
    ['모델코드', p.model],
    ['카테고리', p.cat],
    ['가격', p.price == null ? '가격 문의' : p.price + '만원'],
  ] });
  return {
    app: '세일즈 코파일럿 · 제품 상세검색',
    title: p.model,
    subtitle: p.group || p.cat,
    sections: sections,
    note: (p.note ? '비고 — ' + p.note + ' · ' : '')
      + '삼성스토어 카탈로그 기준 DB 검증값입니다. 가격·재고는 매장에서 확인하세요.',
    filename: '제품정보_' + String(p.model).replace(/[\\/:*?"<>|]/g, ''),
  };
}

/* Step 0: 자연어 파싱 → Step1 */
async function runAI(){
  const q=($("aq").value||"").trim();
  if(!q){ toast("상황을 입력하세요"); return; }

  const bm=q.match(/(\d[\d,]*)\s*만\s*원?/);
  aiParsedBudget=bm?parseInt(bm[1].replace(/,/g,"")):null;

  /*
   * ── 품목 감지 (2026-08-16 과잉 반응을 고침) ─────────────────────────
   *
   * 예전에는 용도 규칙과 품목 키워드를 **전부 합집합**으로 더했다. 그래서:
   *   · *"부모님 선물 TV 150만원"* → TV + **스마트폰 + 워치** ('부모님·선물' 규칙)
   *   · *"자취방 원룸 이사 300만원"* → **8품목** ('이사'가 신혼 규칙에 걸려
   *     식기세척기·에어드레서까지)
   * 예산은 고른 품목 수로 나뉘므로(`autoDistributeBudget`) **품목이 늘면 품목당 예산이
   * 줄어** 엉뚱한 급을 추천하게 된다 — 실제로 150만원 TV 상담에서 TV 몫이 50만원이 됐다.
   *
   * 두 가지로 좁힌다:
   *  ① **문장에 품목이 적혀 있으면 용도 규칙을 끈다.** 사람이 품목을 말했으면 그게 답이다.
   *  ② 품목이 없을 때, **가구 형태 규칙(1인가구)이 생활 이벤트 규칙(신혼·이사)을 이긴다.**
   *     '이사'는 1인가구에도 해당해서 합치면 늘 넓은 쪽이 이겨 버린다.
   *
   * 좁혀도 안전한 이유 — 선택 화면은 **모든 품목을 보여주고 감지된 것만 체크**하므로
   * 상담사가 언제든 더할 수 있다. 반대로 과하게 고르면 예산이 조용히 왜곡된다.
   */
  const ITEM_RULES=[
    [/냉장고/,'냉장고'],[/세탁기|콤보세탁|드럼세탁|빨래/,'세탁기·콤보'],[/건조기/,'건조기'],
    [/TV|텔레비전|티비/i,'TV'],[/에어컨|냉방기/,'에어컨'],[/식기세척기|식세기/,'식기세척기'],
    [/에어드레서|스타일러/,'에어드레서'],[/청소기|로봇청소기/,'청소기'],
    [/공기청정기|공청기/,'공기청정기'],[/김치냉장고|김치/,'김치냉장고'],
    [/사운드바|홈시어터/,'사운드바'],[/인덕션|전기레인지|하이라이트/,'인덕션/전기레인지'],
    [/갤럭시|핸드폰|스마트폰|폰|휴대폰/,'스마트폰'],[/노트북|랩탑/i,'노트북'],
    [/태블릿|갤탭|탭/,'태블릿'],[/워치|스마트워치|갤럭시워치/,'워치'],
    [/이어폰|버즈|에어팟|무선이어폰/,'버즈'],
  ];
  const explicit=new Set();
  ITEM_RULES.forEach(([r,c])=>{ if(r.test(q)) explicit.add(c); });

  /*
   * **'김치냉장고' 는 '냉장고' 를 품는다**(2026-08-16). `/냉장고/` 가 "김치냉장고" 안쪽에
   * 매치돼 *"김치냉장고 좋은거"* 에 **냉장고까지** 골라 예산이 둘로 쪼개졌다.
   * 더 긴 품목이 잡혔으면 그것이 답이다 — 짧은 쪽을 뺀다.
   */
  if(explicit.has('김치냉장고')) explicit.delete('냉장고');

  /*
   * **청소기는 카테고리가 하나인데 상담에서는 로봇/무선/유선을 따로 찾는다**(2026-08-16).
   * *"로봇청소기 100만원"* 에 **무선청소기와 유선 캐니스터**가 나왔다 — 로봇이 한 대도
   * 없이. 제품 상세검색은 이미 같은 문제를 **모델 접두**로 풀어 뒀다(CLAUDE.md `SUBCAT`):
   * DB 전수로 **VR 로봇 13종 · VS 무선 9종 · VC 유선 4종 · VW 업소용 1종**이 정확히 갈린다.
   * 키워드로 가르면 안 된다 — 제품군 이름이 형태를 안 밝히는 것이 많다.
   */
  aiSubcat=null;
  if(explicit.has('청소기')){
    if(/로봇\s*청소기|로봇청소기/.test(q))      aiSubcat={cat:'청소기',re:/^VR/,label:'로봇청소기'};
    else if(/무선\s*청소기|스틱\s*청소기/.test(q)) aiSubcat={cat:'청소기',re:/^VS/,label:'무선청소기'};
    else if(/유선\s*청소기|캐니스터/.test(q))     aiSubcat={cat:'청소기',re:/^VC/,label:'유선청소기'};
  }

  const detected=new Set(explicit);
  let why='';
  if(explicit.size){
    why=`문장에 적힌 품목 ${explicit.size}개만 골랐습니다 — 용도 추천은 껐습니다.`;
  } else {
    const solo=/1인가구|혼자|자취|원룸/.test(q);
    /* ② 1인가구가 잡히면 신혼·이사류는 적용하지 않는다 */
    if(!solo && /신혼|혼수|결혼|입주|전세|이사/.test(q))
      ['냉장고','세탁기·콤보','건조기','TV','에어컨','식기세척기','에어드레서','청소기'].forEach(c=>detected.add(c));
    if(solo)
      ['냉장고','세탁기·콤보','TV','청소기'].forEach(c=>detected.add(c));
    if(/학생|캠퍼스|대학|학교/.test(q))
      ['노트북','스마트폰','태블릿','버즈'].forEach(c=>detected.add(c));
    if(/재택|홈오피스|업무|사무/.test(q))
      ['노트북','스마트폰','워치'].forEach(c=>detected.add(c));
    if(/건강|운동|피트니스|헬스/.test(q))
      ['워치','스마트폰'].forEach(c=>detected.add(c));
    if(/게임|게이밍/.test(q))
      ['노트북','스마트폰'].forEach(c=>detected.add(c));
    if(/부모님|엄마|아빠|어른|선물/.test(q))
      ['TV','스마트폰','워치'].forEach(c=>detected.add(c));
    if(detected.size) why=`문장에 품목이 없어 **용도**로 ${detected.size}개를 골랐습니다 — 필요 없는 것은 체크를 푸세요.`;
  }

  renderCatSelector(detected, aiParsedBudget, why);
}

function toggleCat(cat){
  if(selectedCats.has(cat)) selectedCats.delete(cat);
  else selectedCats.add(cat);
  document.querySelectorAll('#catGrid [data-cat]').forEach(el=>{
    el.classList.toggle('on',selectedCats.has(el.dataset.cat));
  });
  const nextBtn=document.getElementById('aiNextBtn');
  if(nextBtn){
    const cnt=selectedCats.size;
    nextBtn.style.opacity=cnt?'1':'0.4';
    nextBtn.textContent=cnt?`다음: ${cnt}개 품목 세부 설정 →`:'품목을 선택하세요';
  }
}

/* Step 2: 예산·기능 설정 */
function goStep2(){
  if(!selectedCats.size){ toast("품목을 1개 이상 선택하세요"); return; }
  const catList=[...selectedCats];

  const cards=catList.map(cat=>{
    const feats=CAT_FEATURES[cat]||[];
    const safeId=cat.replace(/[^a-zA-Z0-9가-힣]/g,'_');
    const info=AI_CATS.find(c=>c.cat===cat);
    const featChips=feats.map(f=>`
      <button class="feat-chip" data-cat="${cat}" data-feat="${esc(f)}"
              onclick="toggleFeat(this)" type="button">${esc(f)}</button>`).join('');
    return `<div class="cat-config-card">
      <div class="cat-config-head">
        <span class="cat-config-name">${info?info.emoji:''} ${cat}</span>
      </div>
      <div class="cat-budget-wrap">
        <label>예산</label>
        <input class="cat-budget-input" type="number" inputmode="numeric"
               id="budget_${safeId}" data-cat="${cat}"
               placeholder="제한없음" min="0" step="10" oninput="updateTotal()">
        <span class="cat-budget-unit">만원 이하</span>
      </div>
      ${feats.length?`<div class="feat-title">원하는 기능 (복수 선택)</div><div class="feat-grid">${featChips}</div>`:''}
    </div>`;
  }).join('');

  /*
   * **문장에서 예산을 읽었으면 눌러 달라고 하지 말고 그냥 넣는다**(2026-08-16).
   *
   * 예전에는 분배가 이 버튼을 눌러야만 일어났다. 그런데 *"냉장고만 볼게요 400만원"* 처럼
   * **문장에 이미 예산을 쓴 상담사는 버튼을 누르지 않는다.** 그러면 예산 칸이 비어
   * `budget = 0` 이 되고 `budgetPool = pool` 이 되어 **예산 필터가 통째로 꺼진다** —
   * 실측으로 400만원 고객에게 **584만원**짜리를 프리미엄이라고 내밀었다.
   * 0건이 나오는 것도 아니고 조용히 틀린 답을 주는 종류라 제일 위험하다.
   *
   * 그래서 아래에서 자동으로 채우고, 버튼은 **다시 분배**용으로 남긴다(칸을 손으로
   * 고치다 되돌리고 싶을 때가 있다).
   */
  const autoBtn=aiParsedBudget
    ?`<button class="auto-dist-btn" onclick="autoDistributeBudget()" type="button">
        💰 ${aiParsedBudget.toLocaleString()}만원으로 다시 분배
      </button>
      <div class="ai-budget" style="margin-top:8px">문장에서 읽은 <b>${aiParsedBudget.toLocaleString()}만원</b>을 품목별로 나눠 넣었습니다 — 칸에서 직접 고칠 수 있습니다.</div>`:'';

  $("aiHost").innerHTML=''; $("parseBar").innerHTML='';
  $("noticeHost").innerHTML=''; $("sortRow").classList.add('hidden'); lastResults=[];

  $("rHost").innerHTML=`
    <button class="step-back-btn" onclick="renderCatSelector(selectedCats,aiParsedBudget)" type="button">← 품목 다시 선택</button>
    ${autoBtn}
    <div class="step2-wrap">${cards}</div>
    <button class="cat-search-btn" onclick="runAiFinal()" type="button" style="margin-top:14px">🔍 추천받기 →</button>
    <div class="total-bar"><span class="total-bar-label">선택 품목 예산 합산</span><span class="total-bar-price" id="totalBarPrice">0만원</span></div>`;

  /* 칸을 그린 뒤에 채운다 — 위 innerHTML 이 있어야 input 을 찾을 수 있다 */
  if(aiParsedBudget) autoDistributeBudget(true);
}

/*
 * 예산 자동 분배
 *
 * `silent` 는 **goStep2 가 자동으로 부를 때**만 준다 — 화면에 이미 안내를 적어 두므로
 * 토스트까지 띄우면 상담 중에 시끄럽다. 사람이 버튼을 눌렀을 때는 눌린 것이 보여야 한다.
 */
function autoDistributeBudget(silent){
  if(!aiParsedBudget){ if(!silent) toast("예산 정보가 없습니다. 상황 입력에 예산을 포함해주세요."); return; }
  const cats=[...selectedCats];
  const totalW=cats.reduce((s,c)=>s+(CAT_BUDGET_WEIGHT[c]||10),0);
  cats.forEach(cat=>{
    const w=CAT_BUDGET_WEIGHT[cat]||10;
    const alloc=Math.max(10,Math.round(aiParsedBudget*w/totalW/10)*10);
    const safeId=cat.replace(/[^a-zA-Z0-9가-힣]/g,'_');
    const inp=document.getElementById('budget_'+safeId);
    if(inp) inp.value=alloc;
  });
  updateTotal();
  if(!silent) toast("예산이 카테고리별로 자동 분배됐습니다.");
}

/* 스코어링 */
function scoreProduct(p, wantedFeats, budget){
  let score=0;
  const onArr=p.on||[];
  const onStr=onArr.join(' ');
  for(const feat of wantedFeats){
    const featKey=feat.replace(/[()（）]/g,'').slice(0,8);
    if(onArr.some(o=>o===feat)) score+=5;
    else if(onStr.includes(featKey)) score+=2;
    else if(onStr.includes(feat.slice(0,4))) score+=1;
  }
  if(p.isnew) score+=3;
  if(budget>0){
    const pct=p.price/budget;
    if(pct>=0.85&&pct<=1.0) score+=2;
    else if(pct>=0.6&&pct<0.85) score+=1;
  }
  score+=Math.min((onArr.length)*0.15,2);
  return score;
}

/* Step 3: 3티어 추천 */
function runAiFinal(){
  const inputs=[...document.querySelectorAll('.cat-budget-input')];
  const allResults=[]; let totalBudget=0;
  const poolStats=[];
  const overList=[];

  for(const el of inputs){
    const cat=el.dataset.cat;
    const budget=parseInt(el.value)||0;
    totalBudget+=budget;

    // 기능 선택 (data-feat 직접 읽기)
    const wantedFeats=[];
    document.querySelectorAll('.feat-chip.on').forEach(b=>{
      if(b.dataset.cat===cat) wantedFeats.push(b.dataset.feat);
    });

    // 패키지 모드는 가격 합산·티어 분리가 전제라 가격 미상 제품은 후보에서 제외
    let pool=PRODUCTS.filter(p=>p.cat===cat && p.price!=null);
    /* 문장이 형태를 말했으면 그 형태만 남긴다(로봇/무선/유선) — 없으면 거르지 않는다 */
    if(aiSubcat&&aiSubcat.cat===cat){
      const sub=pool.filter(p=>aiSubcat.re.test(p.model||''));
      if(sub.length) pool=sub;
    }
    /*
     * **몇 종 중에서 골랐는지 세어 둔다**(2026-08-16). 카탈로그 제품은 대부분
     * `price: null` 이라 이 품목의 절반 넘게 후보에서 빠지는 경우가 있는데, 화면이
     * 그 사실을 한 마디도 안 했다 — 상담사는 "이 품목 전체에서 고른 것"으로 읽는다.
     * 키워드 검색에는 나오는데 AI 추천에는 없는 모델이 생기는 이유가 이것이다.
     *
     * **가격 없는 제품을 티어에 어떻게 넣을지는 정하지 않았다** — 티어와 예산이
     * 모두 가격 위에 서 있어 규칙을 새로 정해야 하는 제품 결정이다(CLAUDE.md).
     * 그때까지는 빼되, **뺐다는 사실을 밝힌다.**
     */
    const catAll=PRODUCTS.filter(p=>p.cat===cat).length;
    poolStats.push({cat,used:pool.length,all:catAll});
    /*
     * **예산에 맞는 제품이 없으면 그렇다고 말한다**(2026-08-16).
     *
     * 예전에도 후보가 비면 예산 필터를 끄고 전체 풀을 썼는데, **아무 말도 안 했다.**
     * 실측 — *"자취방 원룸 이사 300만원"* 에서 TV 몫이 60만원인데 **890만원짜리 83인치
     * OLED 를 프리미엄으로** 내밀었다(15배). 상담사가 화면을 그대로 읽으면 사고다.
     *
     * 후보를 비우지는 않는다 — 0건으로 끝나면 상담이 거기서 멈춘다. 대신 **넘겼다는
     * 사실과 가장 싼 값을 함께 적어** 상담사가 예산을 다시 잡을 수 있게 한다.
     */
    let budgetPool=budget>0?pool.filter(p=>p.price<=budget):pool;
    let overBudget=null;
    if(!budgetPool.length){
      if(budget>0&&pool.length){
        const min=Math.min(...pool.map(p=>p.price));
        overBudget={cat,budget,min};
        /*
         * **넘길 때는 싼 쪽에서 고른다.** 전체 풀을 그대로 쓰면 티어가 가격 3등분이라
         * 프리미엄이 최상단으로 튄다 — 60만원 예산에 **890만원 83인치 OLED** 가 떴다.
         * 상담사가 알고 싶은 것은 "그럼 얼마부터 되나"이므로 가장 싼 쪽 몇 개만 남긴다.
         */
        budgetPool=pool.slice().sort((a,b)=>a.price-b.price).slice(0,6);
      } else budgetPool=pool;
    }
    if(overBudget) overList.push(overBudget);

    const scored=budgetPool.map(p=>({p,sc:scoreProduct(p,wantedFeats,budget)}))
      .sort((a,b)=>b.sc-a.sc||b.p.price-a.p.price);
    if(!scored.length) continue;

    /*
     * ── 가격 기반 3티어 분리 (2026-08-16 두 가지를 고침) ────────────────
     *
     * ① **같은 가격은 같은 티어여야 한다.** 개수로 3등분하다 보니 경계가 같은 값 사이에
     *    떨어지면 갈라졌다 — 색상만 다른 `WD90H25AHS`/`AHT` 가 둘 다 349만원인데
     *    하나는 프리미엄, 하나는 스탠다드로 나왔다. 화면에서 바로 이상해 보인다.
     *    그래서 경계에 걸린 가격은 **그 값 전체를 같은 쪽으로** 넘긴다.
     *
     * ② **가성비가 그 예산의 제품이어야 한다.** 예전에는 풀 전체의 최하위 1/3 을 그냥
     *    가성비라고 불러서, 400만원 고객에게 **59만원 일반형**을 "가성비"로 내밀었다.
     *    급이 다른 물건이라 대안이 아니다. 예산이 있으면 **예산의 40% 미만**은 가성비
     *    후보에서 뺀다(그 아래밖에 없으면 어쩔 수 없이 쓴다 — 없는 답을 지어내지 않는다).
     *    40% 는 못 박은 값이 아니라 판단이다. 열기 전에 실제 상담으로 재볼 것.
     */
    const byPrice=budgetPool.slice().sort((a,b)=>b.price-a.price);
    const n=byPrice.length;
    /** 경계 index 를 같은 가격 덩어리 끝까지 민다 */
    const spanEq=(arr,i)=>{ const v=arr[Math.min(i,arr.length-1)].price; let j=i; while(j<arr.length&&arr[j].price===v) j++; return j; };
    const premEnd=spanEq(byPrice,Math.max(1,Math.ceil(n*0.34)));
    const premIds=new Set(byPrice.slice(0,premEnd).map(p=>p.id));

    /* 가성비 시작점도 같은 가격 덩어리의 **처음**으로 당긴다 */
    let valStart=Math.floor(n*0.66);
    if(n){ const v=byPrice[Math.min(valStart,n-1)].price; while(valStart>0&&byPrice[valStart-1].price===v) valStart--; }
    let valCands=byPrice.slice(Math.max(valStart,premEnd));
    /*
     * **하한에 걸린 것은 티어에서 통째로 뺀다**(2026-08-16 같은 날 재수정).
     *
     * 처음에는 가성비 후보에서만 뺐는데, 그러면 걸러진 싼 제품이 사라지지 않고
     * **스탠다드로 떨어진다** — 실제로 신혼 사례에서 프리미엄 199만 · 스탠다드 59만 ·
     * 가성비 89만이 나와 **스탠다드가 가성비보다 싼** 역전이 생겼다. 화면에서 바로
     * 이상해 보인다. 그 예산에 걸맞지 않다고 판단한 물건이면 어느 티어에도 넣지 않는 것이 맞다.
     */
    const tooCheap=new Set();
    if(budget>0){
      const credible=valCands.filter(p=>p.price>=budget*0.4);
      if(credible.length){
        valCands.forEach(p=>{ if(p.price<budget*0.4) tooCheap.add(p.id); });
        valCands=credible;
      }
    }
    const valIds=new Set(valCands.map(p=>p.id));
    const premScored=scored.filter(r=>premIds.has(r.p.id));
    const valScored=scored.filter(r=>valIds.has(r.p.id));
    const stdScored=scored.filter(r=>!premIds.has(r.p.id)&&!valIds.has(r.p.id)&&!tooCheap.has(r.p.id));

    const makeTier=(r,tier,label)=>{
      if(!r) return null;
      const onArr=r.p.on||[];
      const onStr=onArr.join(' ');
      const matchedFeats=wantedFeats.filter(f=>{
        const k=f.replace(/[()（）]/g,'').slice(0,8);
        return onArr.some(o=>o===f)||onStr.includes(k)||onStr.includes(f.slice(0,4));
      });
      const missingFeats=wantedFeats.filter(f=>!matchedFeats.includes(f));
      const budgetPct=budget>0?Math.round(r.p.price/budget*100):null;
      const reasons=[];
      if(wantedFeats.length>0&&matchedFeats.length===wantedFeats.length) reasons.push('선택 기능 전부 탑재');
      else if(matchedFeats.length>0) reasons.push('선택 기능 '+matchedFeats.length+'/'+wantedFeats.length+'개 탑재');
      if(r.p.isnew) reasons.push('2026 신모델');
      if(budget>0&&r.p.price<=budget*0.8) reasons.push('예산 여유');
      else if(budget>0&&r.p.price>budget*0.9) reasons.push('예산 내 최고사양');
      if(tier==='premium'&&!reasons.length) reasons.push('최고사양 라인업');
      if(tier==='value'&&!reasons.length) reasons.push('합리적 가격');
      if(!reasons.length) reasons.push('최적 추천');
      const sellPts=[...matchedFeats.slice(0,2),...onArr.filter(o=>!matchedFeats.includes(o)).slice(0,Math.max(0,3-matchedFeats.slice(0,2).length))];
      return {p:r.p,sc:r.sc,tier,tierLabel:label,hits:matchedFeats,missingFeats,reasons,budgetPct,catBudget:budget,sellPts};
    };

    const premium=makeTier(premScored[0],'premium','프리미엄');
    const std=makeTier(stdScored[0]||scored[Math.floor(scored.length/2)]||null,'standard','스탠다드');
    const val=makeTier(valScored[valScored.length-1]||scored[scored.length-1]||null,'value','가성비');

    const seen=new Set();
    [premium,std,val].forEach(r=>{
      if(!r||seen.has(r.p.id)) return;
      seen.add(r.p.id);
      allResults.push(r);
    });
  }

  if(!allResults.length){
    $("rHost").innerHTML='<div class="empty">조건에 맞는 제품을 찾지 못했습니다.</div>'; return;
  }

  const premResults=allResults.filter(r=>r.tier==='premium');
  const premTotal=premResults.reduce((s,r)=>s+r.p.price,0);
  lastResults=allResults; sortMode="rank";

  $("aiHost").innerHTML=`
    <div class="ai-result-total">
      <span class="ai-result-total-label">🛒 ${premResults.length}개 품목 (프리미엄 기준)</span>
      <span class="ai-result-total-price">${premTotal.toLocaleString()}만원${totalBudget?' / 예산 '+totalBudget.toLocaleString()+'만원':''}</span>
    </div>
    <div class="tier-legend">
      <span class="tier-badge tier-premium">프리미엄</span>
      <span class="tier-badge tier-standard">스탠다드</span>
      <span class="tier-badge tier-value">가성비</span>
      <span style="font-size:11px;color:#888;margin-left:6px">— 카테고리별 3티어 비교</span>
    </div>
    ${overNote(overList)}
    ${poolNote(poolStats)}`;
  $("rHost").innerHTML='';
  renderAiResults(allResults);
}

/**
 * 예산 안에 제품이 하나도 없어 **예산을 넘겨 골랐다**면 그 사실을 먼저 밝힌다.
 * 조용히 넘기면 60만원 예산에 890만원짜리가 프리미엄으로 뜬다(실측).
 * 경고색으로 두는 이유 — 이건 참고가 아니라 **상담사가 손봐야 하는 것**이다.
 */
function overNote(list){
  if(!list||!list.length) return '';
  const txt=list.map(o=>`${o.cat} 예산 ${o.budget.toLocaleString()}만원 (가장 싼 것 ${o.min.toLocaleString()}만원)`).join(' · ');
  return `<div class="ai-budget" style="border-color:#c0392b;background:#fdf3f2;color:#a03228">
    ⚠️ 예산 안에 제품이 없어 <b>예산을 넘겨 골랐습니다</b> — ${esc(txt)}.
    예산을 다시 잡거나 품목을 줄여 주세요.
  </div>`;
}

/**
 * 후보에서 빠진 제품이 있으면 그 사실을 한 줄로 밝힌다.
 * 전부 가격이 있는 품목만 있으면 아무것도 적지 않는다 — 할 말이 없을 때 띄우는
 * 안내는 화면만 채운다.
 */
function poolNote(stats){
  const short=stats.filter(s=>s.used<s.all);
  if(!short.length) return '';
  const txt=short.map(s=>`${s.cat} ${s.used}/${s.all}종`).join(' · ');
  return `<div class="ai-budget" style="border-color:#bbb;background:#f8f8f8;color:#666">
    ℹ️ 가격이 확인된 제품 중에서 골랐습니다 — ${esc(txt)}.
    카탈로그에 가격이 없는 제품은 티어·예산 판정을 할 수 없어 뺐습니다(키워드 검색에는 나옵니다).
  </div>`;
}

function renderAiResults(results){
  const catMap={};
  results.forEach(r=>{ if(!catMap[r.p.cat]) catMap[r.p.cat]=[]; catMap[r.p.cat].push(r); });
  $("rHost").innerHTML=Object.entries(catMap).map(([cat,tiers])=>{
    const info=AI_CATS.find(c=>c.cat===cat);
    return `<div class="ai-cat-group">
      <div class="ai-cat-group-head">${info?info.emoji:''} ${cat}</div>
      <div class="ai-tier-row">${tiers.map(r=>aiTierCard(r)).join('')}</div>
    </div>`;
  }).join('');
}

function aiTierCard(r){
  const p=r.p;
  const tierClass={'premium':'tier-premium','standard':'tier-standard','value':'tier-value'}[r.tier]||'';
  const reasonHtml=r.reasons.map(rs=>'<span class="why-reason">'+esc(rs)+'</span>').join('');
  const matchHtml=(r.hits||[]).map(h=>'<span class="why why-match">✅ '+esc(h)+'</span>').join('');
  const missHtml=(r.missingFeats||[]).map(h=>'<span class="why why-miss">❌ '+esc(h)+'</span>').join('');
  const budgetBar=r.catBudget>0?`
    <div class="ai-budget-bar">
      <span class="ai-budget-label">예산 ${r.catBudget.toLocaleString()}만 중 <b>${p.price.toLocaleString()}만</b></span>
      <div class="ai-budget-track"><div class="ai-budget-fill" style="width:${Math.min(r.budgetPct,100)}%;background:${r.budgetPct>100?'#e53935':r.budgetPct>90?'#fb8c00':'#1428A0'}"></div></div>
      <span class="ai-budget-pct" style="color:${r.budgetPct>100?'#e53935':'#555'}">${r.budgetPct}%</span>
    </div>`:'';
  const sellHtml=(r.sellPts||[]).slice(0,3).map(s=>'<span class="sell-pt">• '+esc(s)+'</span>').join('');
  return `<div class="ai-tier-card" onclick="toggleAiDetail(this)">
    <div class="tier-badge ${tierClass}" style="margin-bottom:7px">${r.tierLabel}</div>
    <div class="ai-card-name">${esc(p.group||p.cat)}</div>
    <div class="ai-card-model">${esc(p.model)}${p.cat_ok?'<span class="catbadge">카탈로그 동일모델</span>':''}</div>
    <div class="ai-card-price">${p.price.toLocaleString()}<span style="font-size:12px">만원</span>${p.isnew?'<span class="rnew" style="margin-left:5px">2026</span>':''}</div>
    ${sellHtml?'<div class="sell-pts">'+sellHtml+'</div>':''}
    <div class="ai-reason-block">${reasonHtml}</div>
    ${matchHtml||missHtml?'<div class="ai-feat-block">'+matchHtml+missHtml+'</div>':''}
    ${budgetBar}
    <div class="ai-detail-toggle">▼ 상세 스펙</div>
    <div class="ai-detail-body" style="display:none">
      ${(p.fx||[]).filter(([k])=>k!=='등급').map(([k,v])=>`<div class="spec-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}
      ${p.on&&p.on.length?'<div class="spec-row-full"><span class="spec-on-label">탑재 기능</span>'+p.on.map(f=>'<span class="flg">'+esc(f)+'</span>').join('')+'</div>':''}
      ${p.off&&p.off.length?'<div class="spec-row-full"><span class="spec-off-label">미탑재</span>'+p.off.map(f=>'<span class="flg no">'+esc(f)+'</span>').join('')+'</div>':''}
    </div>
  </div>`;
}

function toggleAiDetail(card){
  const body=card.querySelector('.ai-detail-body');
  const toggle=card.querySelector('.ai-detail-toggle');
  if(!body) return;
  const isHidden=body.style.display==='none'||body.style.display==='';
  body.style.display=isHidden?'block':'none';
  if(toggle) toggle.textContent=isHidden?'▲ 닫기':'▼ 상세 스펙';
}
