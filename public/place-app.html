  const W = cv.width/(window.devicePixelRatio||1), H = cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);

  /*
   * **도면이 주인공이다.**
   * 이 도구가 답하는 것은 "이 집에 이 제품을 놓으면 어떤 느낌인가"이지 "벽이 어디인가"가
   * 아니다. 예전에는 인식 단계에서 원본을 정리본(흑백 마스크)으로 통째로 갈아 끼우고
   * 원본마저 85% 로 흐리게 그렸는데, 그러면 도면의 가구·바닥·색이 사라져 **현장감이
   * 무너진다**(사용자 지적). 원본은 있는 그대로 그리고, 정리본은 ◧ 버튼으로 볼 때만
   * 흐리게 겹쳐 "알고리즘이 무엇을 보고 있는지"를 확인하는 용도로 쓴다.
   */
  const drawPlan = (im, alpha)=>{
    const [x,y] = toScreen(0,0);
    const k = state.mmPerPx ? state.mmPerPx*state.zoom : state.zoom;
    ctx.globalAlpha = alpha;
    ctx.drawImage(im, x, y, state.imgW*k, state.imgH*k);
    ctx.globalAlpha = 1;
  };
  /*
   * **이미지와 벽은 반드시 같은 월드 좌표로 그린다.**
   * `mmPerPx` 를 알면 그것으로, 아직 축척을 안 맞췄으면 이미지 픽셀이 곧 월드 단위다.
   * 그런데 **축척은 맞췄는데(mm 월드) 이미지의 mm/px 는 모르는** 상태가 있다
   * (저장된 방만 복원한 경우). 그때 이미지를 그리면 1px=1mm 로 그려져 도면이
   * 구석 썸네일이 된다 — 그리지 않는 것이 맞다.
   */
  const canDrawPlan = state.img && (state.mmPerPx || !state.scaled);
  if (canDrawPlan) drawPlan(state.img, 1);
  if (canDrawPlan && state.showClean && state.cleanCv) drawPlan(state.cleanCv, .55);

  // 방 — 이름과 넓이를 도면 위에 적는다. 어느 방에 무엇을 놓는지가 이 도구의 핵심이라
  // 화면만 보고도 방을 구분할 수 있어야 한다.
  ROOM_FILL.length && state.rooms.forEach((rm, i)=>{
    const col = ROOM_FILL[i % ROOM_FILL.length];
    const on = state.roomSel === rm.id;
    for (const part of rm.parts){
      const L = loopOfWalls(part.walls);
      if (!L) continue;
      ctx.beginPath();
      L.forEach(([x,y],j)=>{ const [sx,sy]=toScreen(x,y); j?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
      ctx.closePath();
      ctx.fillStyle = col + (on ? '2e' : '18');
      ctx.fill();
    }
    const big = rm.parts.map((q)=>({ q, L:loopOfWalls(q.walls) })).filter((q)=>q.L)
      .sort((a,b)=>loopArea(b.L)-loopArea(a.L))[0];
    if (big){
      const c = partCenter(big.q);
      const [sx,sy] = toScreen(c[0], c[1]);
      ctx.font = `600 ${on?14:13}px system-ui,sans-serif`;
      ctx.textAlign='center'; ctx.fillStyle = col;
      ctx.fillText(rm.name, sx, sy - 2);
      if (state.scaled){
        ctx.font='11px ui-monospace,monospace'; ctx.fillStyle='#6B7280';
        ctx.fillText(`${(roomArea(rm)/1e6).toFixed(1)}㎡`, sx, sy + 13);
      }
    }
  });

  /*
   * 벽 — **도면 위에 얹는 표시지 도면을 대신하는 그림이 아니다.**
   * 굵은 검정 4px 로 긋고 모든 벽에 mm 를 찍었더니 도면이 안 보이고 선만 보였다
   * ("너무 벽에 치중된 것 같다" — 사용자 지적). 도면에 이미 벽이 그려져 있으므로
   * 인식 결과는 **가늘고 반투명하게** 겹치는 것으로 충분하다.
   * 다만 **개구부(문·창)는 또렷하게** 남긴다 — 도면만 봐서는 알 수 없는 판정 결과이고,
   * 그 앞을 막는 가전에 경고가 붙기 때문에 근거가 보여야 한다.
   * 벽 길이(mm)는 **치수 보기(state.showDims)를 켰을 때만** 적는다. 상담에서 필요한 순간이
   * 있지만 늘 떠 있으면 도면을 덮는다.
   */
  ctx.lineCap='round';
  const wallCol = getComputedStyle(document.documentElement).getPropertyValue('--wall').trim()||'#111';
  for (const w of state.walls){
    const [ax,ay]=toScreen(w.x1,w.y1), [bx,by]=toScreen(w.x2,w.y2);
    const L=Math.hypot(w.x2-w.x1,w.y2-w.y1);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
    ctx.globalAlpha = w.open ? 1 : .45;
    ctx.strokeStyle = w.open ? '#B45309' : wallCol;
    ctx.lineWidth = w.open ? 3 : 2;
    ctx.setLineDash(w.open ? [7,5] : []);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    if (state.showDims && (L > 400 || state.walls.length <= 8)){
      const mx=(ax+bx)/2, my=(ay+by)/2;
      ctx.fillStyle = w.open ? '#B45309' : '#374151';
      ctx.font='11px ui-monospace,monospace'; ctx.textAlign='center';
      ctx.fillText(`${w.open?'개구부 ':''}${Math.round(L).toLocaleString()}mm`, mx, my-6);
    }
  }
  // 경계 수정 손잡이 — 어디를 끌 수 있는지 보여야 끌 수 있다
  if (state.mode==='edit'){
    const sel = state.editSel;
    for (const rm of state.rooms) rm.parts.forEach((part, pi)=>{
      const pts = partPoints(part); if (!pts) return;
      part.walls.forEach((w,i)=>{
        const on = sel && sel.room===rm.id && sel.part===pi && sel.kind==='e' && sel.idx===i;
        if (!on) return;
        const [ax,ay]=toScreen(w.x1,w.y1), [bx,by]=toScreen(w.x2,w.y2);
        ctx.strokeStyle='#1428A0'; ctx.lineWidth=7; ctx.globalAlpha=.28;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.globalAlpha=1;
      });
      pts.forEach((q,i)=>{
        const [sx,sy]=toScreen(q[0],q[1]);
        const on = sel && sel.room===rm.id && sel.part===pi && sel.kind==='v' && sel.idx===i;
        ctx.fillStyle = on ? '#1428A0' : '#fff';
        ctx.strokeStyle = '#1428A0'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(sx-4, sy-4, 8, 8); ctx.fill(); ctx.stroke();
      });
    });
  }
  // 그리는 중인 벽
  if (state.mode==='wall' && state.wallPts.length){
    ctx.strokeStyle='#1428A0'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath();
    state.wallPts.forEach(([x,y],i)=>{ const [sx,sy]=toScreen(x,y); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.stroke(); ctx.setLineDash([]);
    for (const [x,y] of state.wallPts){ const [sx,sy]=toScreen(x,y);
      ctx.fillStyle='#1428A0'; ctx.beginPath(); ctx.arc(sx,sy,4,0,7); ctx.fill(); }
  }
  // 함께 묶으려고 담아 둔 조각 — 지금 고르는 것과 구분되게 옅게 채워 둔다.
  // 담긴 것이 눈에 보여야 "몇 개를 묶는 중인지" 알 수 있다.
  for (const pc of (state.draftMore || [])){
    if (!pc.poly || !pc.poly.length) continue;
    const k = state.mmPerPx || 1;
    ctx.beginPath();
    pc.poly.forEach(([ix,iy],i)=>{ const [sx,sy]=toScreen(ix*k, iy*k); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.closePath();
    ctx.fillStyle='rgba(20,40,160,.10)'; ctx.fill();
    ctx.strokeStyle='#1428A0'; ctx.lineWidth=2; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
  }
  // 자동 인식 초안
  if (state.draft && state.draft.length){
    const k = state.mmPerPx || 1;
    ctx.beginPath();
    state.draft.forEach(([ix,iy],i)=>{ const [sx,sy]=toScreen(ix*k, iy*k); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.closePath(); ctx.fillStyle='rgba(20,40,160,.06)'; ctx.fill();
    ctx.lineJoin='round'; ctx.lineCap='round';
    for (const e of (state.draftEdges || state.draft.map((p,i,a)=>{
      const q=a[(i+1)%a.length]; return {x1:p[0],y1:p[1],x2:q[0],y2:q[1],open:false};
    }))){
      const [ax,ay]=toScreen(e.x1*k, e.y1*k), [bx,by]=toScreen(e.x2*k, e.y2*k);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
      ctx.strokeStyle = e.open ? '#B45309' : '#1428A0';
      ctx.lineWidth = e.open ? 4 : 5;
      ctx.setLineDash(e.open ? [7,5] : []);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // 축척 보정 점
  for (const [x,y] of state.scalePts){
    ctx.fillStyle='#B45309'; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
  }

  // 지금 길이를 묻고 있는 벽 — 굵은 주황으로 못 박아 어느 것을 재는지 보여준다
  if (state.measureSeg){
    const m = state.measureSeg;
    const [ax,ay] = toScreen(m.x1, m.y1), [bx,by] = toScreen(m.x2, m.y2);
    ctx.strokeStyle = '#B45309'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.fillStyle = '#B45309'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('이 벽의 길이', (ax+bx)/2, (ay+by)/2 - 10);
  }

  // 가전
  state.items.forEach((it, itIdx)=>{
    const body = corners(it).map(([x,y])=>toScreen(x,y));
    const cl   = corners(it, it.clear).map(([x,y])=>toScreen(x,y));
    const bad  = it.warn && it.warn.length;

    // 도어 오픈 공간 — 이격보다 먼저(아래) 그려 이격선을 가리지 않게 한다
    const dz = doorZoneFor(it);
    if (dz){
      const zone = corners(it, {back:0, side:dz.side, front:0}).map(([x,y])=>toScreen(x,y));
      ctx.beginPath(); zone.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
      ctx.fillStyle = 'rgba(180,83,9,.07)'; ctx.fill();
      ctx.setLineDash([2,3]); ctx.lineWidth=1; ctx.strokeStyle='#B45309'; ctx.stroke();
      ctx.setLineDash([]);
    }

    // 이격 영역
    if (it.clear.back||it.clear.side||it.clear.front){
      ctx.setLineDash([5,4]); ctx.lineWidth=1;
      ctx.strokeStyle= bad ? '#B42318' : '#94A3B8';
      ctx.beginPath(); cl.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.stroke();
      ctx.setLineDash([]);
    }
    /*
     * 본체 — **도면 위에서 한눈에 보여야 한다.**
     * 예전에는 13% 투명도라 컬러 렌더링 도면 위에서 제품이 배경에 묻혔다
     * ("제품 컬러는 더 진하게 해야 도면 컬러와 겹치지 않게 확인이 가능하다" — 사용자 지적).
     * 도면을 가리지 않으면서 확실히 읽히도록, 진한 면 + 흰 테두리로 그린다 —
     * 흰 테두리가 있으면 어두운 도면 위에서도 윤곽이 끊기지 않는다.
     */
    ctx.beginPath(); body.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
    // 아직 도면 밖에 꺼내 둔 것은 흐리게 — "놓은 것"과 "꺼내 둔 것"이 구분돼야 한다
    ctx.fillStyle = it.staged ? 'rgba(71,85,105,.42)' : (bad ? 'rgba(180,35,24,.72)' : 'rgba(20,40,160,.68)');
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = state.sel===it.id ? 3.5 : 2.5; ctx.stroke();
    if (it.staged) ctx.setLineDash([6,4]);
    ctx.strokeStyle = bad ? '#7F1D1D' : (state.sel===it.id ? '#0B1A6B' : '#101C52');
    ctx.lineWidth = state.sel===it.id ? 2 : 1.2; ctx.stroke();
    ctx.setLineDash([]);
    drawGlyph(it);

    // 정면 표시(도어가 열리는 쪽)
    const [f1,f2] = [body[3], body[2]];
    ctx.beginPath(); ctx.moveTo(f1[0],f1[1]); ctx.lineTo(f2[0],f2[1]);
    ctx.strokeStyle = '#FDE68A'; ctx.lineWidth=3.5; ctx.stroke();   // 진한 본체 위에서 도어 쪽이 보이도록

    // 라벨
    const cx=(body[0][0]+body[2][0])/2, cy=(body[0][1]+body[2][1])/2;
    const [cxw,cyw] = bodyCenter(it);
    ctx.font='700 11px system-ui'; ctx.textAlign='center';
    // 진한 본체 위에 얹으므로 글자는 흰색. 얇은 어두운 외곽선으로 어떤 배경에서도 읽히게 한다.
    /*
     * 적층 조합(TV+사운드바, 세탁기+건조기)은 **같은 자리에 겹쳐 놓이는 것이 정상**이라
     * 라벨이 서로 뭉개져 둘 다 못 읽게 된다. 앞서 그린 것 중 중심이 가까운 것 수만큼
     * 아래로 어긋나게 적는다.
     */
    const near = state.items.slice(0, itIdx).filter((o)=>{
      const [ox,oy] = bodyCenter(o);
      return Math.hypot(ox-cxw, oy-cyw) < Math.max(it.w, it.d) * 0.6;
    }).length;
    const ly = cy + 4 + near * 14;
    ctx.lineWidth=3; ctx.strokeStyle='rgba(8,14,40,.85)'; ctx.strokeText(it.label, cx, ly);
    ctx.fillStyle='#fff'; ctx.fillText(it.label, cx, ly);
  });
  renderSide();
}

/**
 * 배치한 가전을 지운다. 키보드(Delete)와 목록의 ✕ 가 같은 길로 지나가야
 * 한쪽만 고치는 사고가 안 난다. **태블릿에는 Delete 키가 없으므로 버튼이 필수다.**
 */
function removeItem(id){
  const it = state.items.find((x)=>x.id===id);
  if (!it) return;
  state.items = state.items.filter((x)=>x!==it);
  if (state.sel===id) state.sel = null;
  if (!state.items.length) $('#empty').style.display='';
  evaluate(); renderSide(); draw();
  toast(`${it.label} 삭제`);
}

/*
 * ── 상담 결과를 이미지 한 장으로 ──────────────────────────────────
 * **상담이 끝나면 고객 손에 아무것도 안 남는 것이 이 도구의 가장 큰 구멍이었다.**
 * 고객은 자기 집 도면에 제품이 놓인 그림을 보고 갔는데 가져갈 것이 없다.
 * 도면 화면 아래에 고른 제품·모델코드·치수·이격을 붙여 한 장으로 만든다 —
 * 그대로 카톡으로 보내면 집에 가서 다시 보고, 그것이 재방문 명분이 된다.
 *
 * 캔버스를 다시 그리지 않고 **화면에 보이는 것을 그대로 복사**한다. 화면과 다른 그림이
 * 나가면 "내가 본 것과 다르다"가 되기 때문이다.
 */
function buildShareCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.width / dpr, H = cv.height / dpr;
  const items = state.items;
  const lineH = 34, headH = 64, padX = 20;
  const listH = items.length ? headH + items.length * lineH + 16 : headH;
  const out = document.createElement('canvas');
  const S = 2;                                   // 카톡으로 보내도 글자가 뭉개지지 않게
  out.width = W * S; out.height = (H + listH) * S;
  const g = out.getContext('2d');
  g.scale(S, S);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H + listH);
  g.drawImage(cv, 0, 0, W, H);                   // 화면 그대로

  g.fillStyle = '#F8FAFC'; g.fillRect(0, H, W, listH);
  g.strokeStyle = '#E2E8F0'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, H + .5); g.lineTo(W, H + .5); g.stroke();

  const title = state.complexName ? `${state.complexName}${state.typeName ? ' ' + state.typeName : ''}` : '가전 배치 상담';
  g.fillStyle = '#0F172A'; g.font = '700 17px system-ui,sans-serif'; g.textAlign = 'left';
  g.fillText(title, padX, H + 28);
  const area = planAreaM2();
  g.fillStyle = '#64748B'; g.font = '12px system-ui,sans-serif';
  g.fillText([
    area ? `전용 ${area.toFixed(1)}㎡` : null,
    state.rooms.length ? `공간 ${state.rooms.length}곳` : null,
    `가전 ${items.length}대`,
    new Date().toLocaleDateString('ko-KR'),
  ].filter(Boolean).join('  ·  '), padX, H + 48);

  items.forEach((it, i)=>{
    const y = H + headH + i * lineH + 14;
    g.fillStyle = it.warn && it.warn.length ? '#B42318' : (it.staged ? '#64748B' : '#1428A0');
    g.beginPath(); g.arc(padX + 4, y - 4, 4, 0, 7); g.fill();
    g.fillStyle = '#0F172A'; g.font = '600 13px system-ui,sans-serif';
    g.fillText(it.label + (it.staged ? ' (미배치)' : ''), padX + 16, y);
    g.fillStyle = '#475569'; g.font = '12px ui-monospace,monospace';
    const spec = `${it.model || '모델코드 미수록'}  ${Math.round(it.w)}×${Math.round(it.h)}×${Math.round(it.d)}mm  이격 후면 ${it.clear.back}·좌우 ${it.clear.side}mm`;
    g.fillText(spec, padX + 16, y + 15);
    if (it.warn && it.warn.length){
      g.fillStyle = '#B42318'; g.font = '11px system-ui,sans-serif'; g.textAlign = 'right';
      g.fillText(it.warn.join(' / '), W - padX, y);
      g.textAlign = 'left';
    }
  });
  g.fillStyle = '#94A3B8'; g.font = '11px system-ui,sans-serif'; g.textAlign = 'right';
  g.fillText('치수는 삼성스토어 카탈로그 기준 · 설치 규격은 실측 확인 필요', W - padX, H + 28);
  return out;
}

async function shareResult(){
  if (!state.items.length){ toast('배치한 가전이 없습니다'); return; }
  const out = buildShareCanvas();
  const name = `가전배치_${state.complexName ? state.complexName.replace(/\s+/g, '') + '_' : ''}${new Date().toISOString().slice(0, 10)}.png`;
  const blob = await new Promise((r)=> out.toBlob(r, 'image/png'));
  if (!blob){ toast('이미지를 만들지 못했습니다'); return; }
  /*
   * 공유 시트가 있으면 그것으로(매장에서 카톡으로 바로 보내는 것이 목적이다).
   * 없거나 사용자가 취소하면 내려받기로 떨어진다 — 어느 기기에서도 결과는 남아야 한다.
   */
  const file = new File([blob], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: '가전 배치 결과' }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // 사용자가 취소한 것은 실패가 아니다
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
  toast('이미지로 저장했습니다');
}

/* ── 사이드 목록 ── */
/*
 * 하단 요약 — **상담 중 눈을 떼지 않고 확인해야 하는 것만** 넣는다.
 * 어느 집인지 · 축척이 잡혔는지 · 공간과 가전이 몇인지 · 문제가 있는지.
 * 고른 가전이 있으면 그 치수와 이격을 한 줄 더 붙인다 — 상담에서 가장 많이 읽는 값이다.
 */
function renderMini(){
  const el = $('#mini'); if (!el) return;
  const bad = state.items.filter((i)=>i.warn && i.warn.length).length;
  const soft = state.items.filter((i)=>i.soft && i.soft.length).length;
  const staged = state.items.filter((i)=>i.staged).length;
  const area = planAreaM2();
  const who = planLabel();
  const bits = [];
  if (who) bits.push(`<b>${esc(state.complexName ? state.complexName + ' ' + (state.typeName||'') : who)}</b>`);
  bits.push(state.scaled ? '축척 확정' : '<span class="warn">축척 미확정</span>');
  if (state.rooms.length) bits.push(`공간 ${state.rooms.length}곳${area ? ` · ${area.toFixed(0)}㎡` : ''}`);
  bits.push(`가전 ${state.items.length}대${staged ? ` (대기 ${staged})` : ''}`);
  bits.push(bad ? `<span class="warn">확인 필요 ${bad}건</span>`
    : (state.items.length ? '<span class="ok">문제 없음</span>' : ''));
  if (soft) bits.push(`주의 ${soft}건`);
  const it = state.items.find((x)=>x.id===state.sel);
  const sel = it ? `<span class="sel">${esc(it.label)} · ${Math.round(it.w)}×${Math.round(it.h)}×${Math.round(it.d)}mm`
      + ` · 이격 후면 ${it.clear.back}·좌우 ${it.clear.side}mm`
      + `${it.warn && it.warn.length ? ` · <span class="warn">${esc(it.warn.join(' / '))}</span>` : ''}</span>` : '';
  el.innerHTML = `<div class="r">${bits.filter(Boolean).join('<span>·</span>')}`
    + `<span class="more" id="mini-more">자세히</span></div>${sel}`;
  const mo = $('#mini-more');
  if (mo) mo.onclick = ()=> $('#side').classList.add('on');
}

function renderSide(){
  renderRooms();
  renderMini();
  const list = $('#list');
  if (!state.items.length){
    list.innerHTML = '<p class="hint" style="padding:10px">아직 배치한 가전이 없습니다.</p>';
  } else {
    list.innerHTML = state.items.map((it)=>`
      <div class="row ${state.sel===it.id?'sel':''}" data-id="${it.id}">
        <div class="t">${esc(it.label)}<span class="pill">${esc(it.size)}</span>${itemRoom(it)?`<span class="pill">${esc(itemRoom(it).name)}</span>`:''}${it.staged?'<span class="pill">대기</span>':''}<span class="grow"></span><button class="del" data-delitem="${it.id}" title="이 가전을 지웁니다">✕</button></div>
        <div class="m">${esc(it.model)} · ${Math.round(it.w)}×${Math.round(it.h)}×${Math.round(it.d)}mm</div>
        <div class="m">이격 후면 ${it.clear.back} · 좌우 ${it.clear.side}${it.clear.front?` · 전면 ${it.clear.front}`:''}mm</div>
        <div class="w ${it.warn&&it.warn.length?'':'ok'}">${it.warn&&it.warn.length?esc(it.warn.join(' / ')):'배치 가능'}</div>
        ${it.soft&&it.soft.length?`<div class="s">${esc(it.soft.join(' / '))}</div>`:''}
      </div>`).join('');
  }
  list.querySelectorAll('button[data-delitem]').forEach((el)=>{
    el.onclick = (e)=>{
      e.stopPropagation();          // 줄을 누르면 선택이라 삭제와 겹친다
      removeItem(el.dataset.delitem);
    };
  });
  const bad = state.items.filter((i)=>i.warn&&i.warn.length).length;
  const soft = state.items.filter((i)=>i.soft&&i.soft.length).length;
  const loop = wallLoop();
  const opensN = state.walls.filter((w)=>w.open).length;
  /*
   * **한 공간이 세대 전체 크기면 방이 안 나뉜 것이다.**
   * 문이 전부 열린 채 그려진 도면에서 닫기 반경이 모자라면 세대 전체가 방 하나로 잡힌다
   * (CLAUDE.md "반경 0에서 세대 전체가 방 하나로 잡혔다"). 그 상태로 이름만 붙여 저장하면
   * 나중에 "거실 51.9㎡"처럼 보이는데, 52㎡ 세대의 거실이 52㎡일 수는 없다.
   * 전용면적을 아는 경우에만 짚어 준다 — 근거 없이 경고하지 않는다.
   */
  const whole = state.exclusiveM2 && state.rooms.find((r)=> roomArea(r)/1e6 >= state.exclusiveM2 * 0.9);
  const roomLine = state.rooms.length
    ? row('ok', `공간 ${state.rooms.length}곳 — ` + state.rooms.map((r)=>`${r.name} ${(roomArea(r)/1e6).toFixed(1)}㎡${r.parts.length>1?`(${r.parts.length}조각)`:''}`).join(' · ')
        + (opensN?` · 개구부 ${opensN}곳`:'')
        + (whole?` — <b>${esc(whole.name)}가 세대 전체(전용 ${state.exclusiveM2}㎡) 크기입니다. 방이 나뉘지 않았을 수 있어요 — '더 좁게'로 다시 인식해 보세요</b>`:''))
    : row(loop?'ok':(state.walls.length?'warn':'bad'), loop ? `방 닫힘 (경계 ${state.walls.length}구간${opensN?` · 개구부 ${opensN}곳`:''})` : (state.walls.length?`벽 ${state.walls.length}개 — 닫히지 않아 "방 밖" 판정을 하지 않습니다`:'벽 없음 — 벽 스냅·방 밖 판정 불가'));
  $('#report').innerHTML = [
    row(state.scaled?'ok':'warn', state.mmPerPx ? `축척 확정 (도면 1px = ${state.mmPerPx.toFixed(2)}mm)` : (state.scaled ? '축척 확정 (벽 실제 길이 입력 기준)' : '축척 미확정 — 벽을 그리고 실제 길이를 입력하세요')),
    roomLine,
    row(bad?'bad':'ok', bad ? `문제 ${bad}건` : `배치 ${state.items.length}건 · 문제 없음`),
    ...(soft ? [row('warn', `도어 오픈 등 확인 필요 ${soft}건 — 주황 점선 구역`)] : []),
  ].join('');
  $('#status').textContent = {
    idle:'가전을 끌어 옮기고, 두 번 누르면 90° 회전 · 벽을 넘으면 안쪽으로 옮겨 드립니다 · TV+사운드바, 세탁기+건조기는 같은 자리에 놓을 수 있습니다',
    scale:'도면에서 길이를 아는 두 점을 차례로 누르세요',
    wall:'벽 모서리를 차례로 누르고, 시작점을 다시 누르면 닫힙니다',
    edit:'벽을 끌면 밀리고, 모서리를 끌면 그 점이 움직입니다 · 벽을 그냥 누르면 개구부(문·창)로 바뀝니다',
    detect: state.rooms.length
      ? `공간 ${state.rooms.length}곳 지정됨 — 다른 방 안쪽을 눌러 계속 추가하세요`
      : '배치할 방 안쪽의 빈 곳을 한 번 누르세요 — 벽을 자동으로 잡습니다',
    place:'놓을 위치를 누르세요 — 가까운 벽에 붙습니다',
  }[state.mode];
}
/** 잡아 둔 공간 목록 — 이름을 고치고 지울 수 있어야 한다 */
function renderRooms(){
  const box = $('#rooms');
  if (!box) return;
  if (!state.rooms.length){
    box.innerHTML = '<p class="hint" style="padding:8px 10px">아직 지정한 공간이 없습니다. <b>벽 자동 인식</b>으로 방 안쪽을 누르면 이름을 붙여 등록됩니다.</p>';
    return;
  }
  box.innerHTML = state.rooms.map((r,i)=>`
    <div class="room ${state.roomSel===r.id?'sel':''}" data-room="${r.id}">
      <span class="swatch" style="background:${ROOM_FILL[i%ROOM_FILL.length]}"></span>
      <input type="text" class="rn" data-rename="${r.id}" value="${esc(r.name)}" maxlength="12">
      <span class="m">${(roomArea(r)/1e6).toFixed(1)}㎡${r.parts.length>1?` · ${r.parts.length}조각`:''}</span>
      <button class="del" data-del="${r.id}" title="삭제">✕</button>
    </div>`).join('');
  box.querySelectorAll('input[data-rename]').forEach((el)=>{
    el.onchange = ()=>{
      const r = roomById(el.dataset.rename);
      if (r) { r.name = (el.value||'').trim() || r.name; renderSide(); draw(); }
    };
    el.onclick = (e)=> e.stopPropagation();
  });
  box.querySelectorAll('button[data-del]').forEach((el)=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.dataset.del;
      state.rooms = state.rooms.filter((r)=>r.id!==id);
      state.items.forEach((it)=>{ if (it.room===id) it.room = null; });
      if (state.roomSel===id) state.roomSel = state.rooms.length ? state.rooms[0].id : null;
      if (!state.rooms.length) state.walls = [];
      syncWalls(); evaluate(); renderSide(); draw();
    };
  });
  box.querySelectorAll('.room').forEach((el)=>{
    el.onclick = ()=>{ state.roomSel = el.dataset.room; renderSide(); draw(); };
  });
}

const COLOR = { ok:'#0F7A5A', warn:'#B45309', bad:'#B42318' };
const row = (k,t) => `<div class="r"><span class="dot" style="background:${COLOR[k]}"></span><span>${esc(t)}</span></div>`;
const esc = (s) => String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 입력 ─────────────────────────────────────────────────────── */
let ptr = null;
cv.addEventListener('pointerdown', (e)=>{
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const [wx,wy] = toWorld(sx,sy);

  if (state.mode==='detect'){
    // 화면 → 도면 이미지 픽셀
    const k = state.mmPerPx || 1;
    const ix = wx / k, iy = wy / k;
    const r = detectRoomAt(ix, iy);
    if (r.error){ toast(r.error); return; }
    state.draft = r.poly; state.draftEdges = r.edges; state.draftCloseR = r.closeR;
    state.draftAt = [ix, iy]; state.draftStep = { wider: r.wider, narrow: r.narrow, step: r.step, steps: r.steps };
    draw();
    confirmDetected();
    return;
  }
  if (state.mode==='scale'){
    state.scalePts.push([sx,sy]);
    if (state.scalePts.length===2) askScale();
    draw(); return;
  }
  if (state.mode==='wall'){
    const first = state.wallPts[0];
    if (first && state.wallPts.length>2){
      const [fx,fy] = toScreen(first[0],first[1]);
      if (Math.hypot(fx-sx,fy-sy) < 14){ state.wallPts.push([first[0],first[1]]); commitWalls(); return; }
    }
    state.wallPts.push([wx,wy]); draw(); return;
  }
  if (state.mode==='place' && state.pending){
    placeAt(wx,wy); return;
  }
  if (state.mode==='edit'){
    const hit = hitBoundary(wx, wy);
    if (!hit){ toast('벽이나 모서리 위를 눌러주세요'); return; }
    state.editSel = hit;
    state.drag = { edit: hit, lx: wx, ly: wy, moved: false };
    cv.setPointerCapture(e.pointerId);
    draw(); return;
  }

  // 선택 / 드래그
  const hit = [...state.items].reverse().find((it)=>pointIn(corners(it), wx, wy));
  if (hit){
    if (state.sel===hit.id && ptr && Date.now()-ptr.t < 400){ hit.a += Math.PI/2; evaluate(); draw(); return; }
    state.sel = hit.id;
    state.drag = { id:hit.id, ox:wx-hit.bx, oy:wy-hit.by };
    ptr = { t:Date.now() };
    cv.setPointerCapture(e.pointerId);
  } else {
    state.sel = null;
    state.drag = { pan:true, sx, sy, px:state.panX, py:state.panY };
    cv.setPointerCapture(e.pointerId);
  }
  draw();
});
cv.addEventListener('pointermove', (e)=>{
  if (!state.drag) return;
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  if (state.drag.pan){
    state.panX = state.drag.px + (sx-state.drag.sx);
    state.panY = state.drag.py + (sy-state.drag.sy);
    draw(); return;
  }
  if (state.drag.edit){
    const [wx,wy] = toWorld(sx,sy);
    const d = state.drag;
    if (Math.hypot(wx-d.lx, wy-d.ly) * state.zoom > 3) d.moved = true;
    if (d.edit.kind==='v') moveVertex(d.edit, wx, wy);
    else moveEdge(d.edit, wx-d.lx, wy-d.ly);
    d.lx = wx; d.ly = wy;
    evaluate(); draw(); return;
  }
  const it = state.items.find((x)=>x.id===state.drag.id); if (!it) return;
  const [wx,wy] = toWorld(sx,sy);
  const prev = { bx:it.bx, by:it.by, a:it.a };

  // 자유 이동이 기본이고, 벽에 아주 가까이 가져갔을 때만 붙는다(예전 600mm는 너무 넓어
  // 방 한가운데에 두려 해도 자꾸 벽으로 끌려갔다).
  const snap = snapToWall(wx-state.drag.ox, wy-state.drag.oy, it);
  if (snap && snap.dist < 180){ it.bx=snap.bx; it.by=snap.by; it.a=snap.a; }
  else { it.bx = wx-state.drag.ox; it.by = wy-state.drag.oy; }

  /*
   * **도면 밖에 있으면 대기, 방 안에 들어오면 배치.**
   * 대기 중에는 아무 판정도 하지 않는다 — 아직 놓은 것이 아니다.
   */
  const [cx,cy] = bodyCenter(it);
  it.staged = state.rooms.length ? !roomAt(cx,cy) : !insideRoom(cx,cy);

  if (!it.staged){
    /*
     * **벽을 넘으면 되돌리지 않고 안쪽으로 밀어 넣는다.**
     * 예전에는 직전 위치로 되돌렸는데, 그러면 벽 근처에서 제품이 손에서 자꾸 빠져
     * "왜 안 움직이지"가 된다. 벽에 설치할 수는 없으므로 **안쪽으로 옮겨 주고 그 사실을
     * 경고로 알린다** — 사용자가 정한 동작이다.
     */
    if (escapesRoom(it)) nudgeInside(it);
    // 다른 가전과 부딪히는 것은 여전히 막는다(겹쳐도 되는 조합은 hitsOther 가 걸러 낸다).
    const clash = hitsOther(it);
    if (clash){ Object.assign(it, prev); toast(clash); }
  }
  evaluate(); draw();
});
cv.addEventListener('pointerup', ()=>{
  const d = state.drag;
  if (d && d.edit){
    if (!d.moved && d.edit.kind==='e') toggleEdgeOpen(d.edit);
    renderSide(); evaluate(); draw();
  }
  state.drag=null;
});
cv.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const r = cv.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
  const [wx,wy] = toWorld(sx,sy);
  state.zoom = Math.max(0.02, Math.min(3, state.zoom * (e.deltaY<0?1.12:1/1.12)));
  state.panX = sx - wx*state.zoom; state.panY = sy - wy*state.zoom;
  draw();
}, {passive:false});

function pointIn(poly,x,y){
  let inside=false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i], [xj,yj]=poly[j];
    if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

$('#list').addEventListener('click',(e)=>{
  const r = e.target.closest('.row'); if(!r) return;
  state.sel = r.dataset.id; draw();
});
document.addEventListener('keydown',(e)=>{
  /*
   * **입력칸에 글자를 치는 중에는 단축키를 받지 않는다.**
   * 가전이 선택된 상태에서 길이를 고치다 Backspace 를 누르면 그 가전이 지워졌다.
   */
  const t = e.target;
  if (t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) return;
  if (!state.sel) return;
  const it = state.items.find((x)=>x.id===state.sel); if(!it) return;
  if (e.key==='r'||e.key==='R'){ it.a += Math.PI/2; evaluate(); draw(); }
  if (e.key==='Delete'||e.key==='Backspace'){ removeItem(it.id); }
});

/* ── 단계별 동작 ── */
$('#btn-lib').onclick = ()=> openLibrary();
$('#btn-save').onclick = ()=> askSaveComplex();
$('#btn-img').onclick = ()=> $('#file').click();
/** 도면 이미지를 화면에 올린다 (파일 선택·라이브러리 공용) */
function useImage(src, after){
  const img = new Image();
  img.onload = ()=>{
    state.img=img; state.imgW=img.naturalWidth; state.imgH=img.naturalHeight;
    state.mmPerPx=null; state.scaled=false; state.scalePts=[]; state.exclusiveM2=null; state.mask=null; state.baseMask=null; state.sealCache=null; state.cleanCv=null; state.showClean=false;
    state.walls=[]; state.rooms=[]; state.roomSel=null; state.draft=null; state.draftMore=[]; hideDraftBar();
    // 도면 전체가 화면에 들어오도록 배율을 잡는다. 이걸 안 하면 1,000px이 넘는 보통
    // 도면에서 치수선 한쪽 끝이 화면 밖으로 나가 축척을 맞출 수가 없다.
    const r = cv.getBoundingClientRect();
    state.zoom = Math.min(r.width/state.imgW, r.height/state.imgH) * 0.92;
    state.panX = 12; state.panY = 12;
    $('#empty').style.display='none';
    /*
     * **곧장 치수선 두 점 클릭 모드로 보내지 않는다.**
     * 두 점 보정은 정확하지만 벽과 벽을 정밀하게 눌러야 하고, 손가락으로는 몇 px 씩
     * 어긋나 축척이 통째로 틀어진다(사용자 지적). 게다가 분양 도면 중 치수가 인쇄된
     * 것은 8% 뿐이라 대부분은 애초에 찍을 치수선도 없다.
     * 그래서 **방을 자동으로 인식해 가장 긴 벽을 찾아 두고, 사용자는 길이만 입력**한다.
     * 치수선이 있는 도면은 도구막대 "축척 맞추기"로 언제든 두 점 보정을 쓸 수 있다.
     */
    setStep(2); draw();
    if (after) after();
    autoDetectCenter();
  };
  img.onerror = ()=> toast('도면을 열지 못했습니다');
  img.src = src;
}
$('#file').onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  useImage(URL.createObjectURL(f));
};
$('#btn-scale').onclick = ()=>{ state.scalePts=[]; setMode('scale'); setStep(2); draw(); };
$('#btn-wall').onclick  = ()=>{ state.wallPts=[]; setMode('wall'); setStep(3); draw(); };
$('#btn-edit').onclick  = ()=>{
  if (!state.rooms.length){ toast('먼저 공간을 하나 이상 지정해주세요'); return; }
  hideDraftBar(); state.draft=null; setMode(state.mode==='edit'?'idle':'edit'); draw();
};
$('#btn-more').onclick  = ()=> $('#bar').classList.toggle('moreopen');
$('#btn-detect').onclick= ()=> startDetect();
$('#btn-share').onclick = ()=> shareResult();
/*
 * 벽 길이(mm)는 기본으로 끈다. 늘 떠 있으면 숫자가 도면을 덮어 "제품이 놓인 느낌"이
 * 안 보인다 — 이 도구가 보여주려는 것이 그것이다. 필요할 때만 켠다.
 */
$('#btn-dims').onclick  = ()=>{
  state.showDims = !state.showDims;
  $('#btn-dims').classList.toggle('on', state.showDims);
  toast(state.showDims ? '벽 길이를 표시합니다' : '벽 길이를 숨겼습니다 — 도면이 잘 보입니다');

};
$('#btn-clean').onclick = ()=>{
  if (!state.img){ toast('도면을 먼저 올려주세요'); return; }
  ensureClean();
  state.showClean = !state.showClean;
  toast(state.showClean
    ? `정리본 — 가구·글씨(${state.cleanInfo.openR}px 이하)를 지운 벽만 보입니다. 문·창은 뚫린 그대로이며 인식할 때만 임시로 메웁니다.`
    : '원본 도면');

// 축척이 없으면 시트를 열기 전에 막는다 — 체크를 다 한 뒤에 막으면 헛수고가 된다
$('#btn-add').onclick   = ()=> (state.scaled ? openSelect(null) : needScale());
$('#btn-auto').onclick  = ()=> (state.scaled ? openSelect('주방') : needScale());
$('#btn-side').onclick  = ()=> $('#side').classList.toggle('on');
$('#steps').onclick = (e)=>{ const s=e.target.closest('.step'); if(!s) return;
  const n=+s.dataset.step; if(n===1)$('#btn-img').click(); if(n===2)$('#btn-scale').click();
  if(n===3)$('#btn-detect').click(); if(n===4)openSelect(null); };

function setMode(m){ state.mode=m; renderSide(); }
function setStep(n){ document.querySelectorAll('.step').forEach((s)=>{
  const k=+s.dataset.step; s.classList.toggle('on', k===n); if(k<n) s.classList.add('done'); }); }

function askScale(){
  const [[x1,y1],[x2,y2]] = state.scalePts;
  const px = Math.hypot(x2-x1,y2-y1) / state.zoom;   // 화면 px → 도면 이미지 px
  sheet(`<h2>축척 맞추기</h2>
    <p class="hint">방금 누른 두 점 사이의 <b>실제 길이</b>를 입력하세요. 도면에 적힌 치수선을 쓰면 가장 정확합니다.</p>
    <label class="pickers"><span class="hint">실제 길이 (mm)</span>
      <input type="number" id="mm" value="3000" min="1" step="10"></label>
    <p class="src">두 점 사이가 도면 이미지에서 ${px.toFixed(1)}px입니다.</p>
    <div class="modal-actions"><button id="c">취소</button><button class="primary" id="ok">확정</button></div>`,
    ()=>{
      $('#ok').onclick = ()=>{
        const mm = +$('#mm').value;
        if (!(mm>0)) return;
        state.mmPerPx = mm / px;
        state.scaled = true;
        // 도면이 화면에 알맞게 들어오도록 초기 배율을 잡는다
        const r = cv.getBoundingClientRect();
        state.zoom = Math.min(r.width/(state.imgW*state.mmPerPx), r.height/(state.imgH*state.mmPerPx)) * 0.9;
        state.panX = 20; state.panY = 20;
        state.scalePts=[]; state.wallPts=[]; closeSheet(); setStep(3); draw();
        autoDetectCenter();
      };
      $('#c').onclick = ()=>{ state.scalePts=[]; closeSheet(); setMode('idle'); draw(); };
    });
}

function commitWalls(){
  const p = state.wallPts;
  const segs = [];
  for (let i=0;i<p.length-1;i++) segs.push({x1:p[i][0],y1:p[i][1],x2:p[i+1][0],y2:p[i+1][1]});
  state.wallPts=[];
  // 축척이 아직 확정되지 않았다면 벽 좌표의 mm 값은 아무 근거가 없다. 그대로 두면
  // "2,227mm" 같은 숫자가 화면에 뜨는데, 상담 중에 그걸 실제 치수로 읽으면 사고다.
  // 그래서 방금 그린 벽 중 가장 긴 것의 실제 길이를 받아 전체를 환산한다.
  if (!state.scaled) askWallLength(segs);
  else { addRoom(nextRoomName(), segs); setMode('idle'); setStep(4); evaluate(); draw(); }
}

/** 그린 벽 중 가장 긴 것의 실제 길이를 받아 전체 좌표를 실제 mm로 환산한다 */
function askWallLength(segs, opts){
  let li=0, lmax=0;
  segs.forEach((s,i)=>{ const L=Math.hypot(s.x2-s.x1,s.y2-s.y1); if(L>lmax){lmax=L;li=i;} });
  /*
   * **어느 벽을 재는지 도면 위에 표시한다.**
   * 가장 긴 벽을 자동으로 고르므로 사용자는 클릭할 필요가 없지만, 어느 벽인지 모르면
   * 엉뚱한 길이를 넣게 되고 그러면 축척이 통째로 틀어진다. 화면에 보이면 눈으로 검산된다.
   */
  state.measureSeg = segs[li];
  // 이름 붙이기 모달이 열린 채로 올 수 있다. 모달을 닫아야 도면이 보인다 —
  // 예전에는 sheet() 가 내용을 갈아 끼워 저절로 닫혔지만 이제는 막대를 쓰므로 직접 닫는다.
  closeSheet();
  draw();
  /*
   * **모달로 묻지 않는다.** 정작 봐야 할 것은 주황으로 표시된 그 벽인데 모달이 그 위를
   * 덮는다. 초안 조절을 막대로 옮긴 것과 같은 이유다 — 화면이 가려지면 무엇을 재는지
   * 모르는 채 숫자를 넣게 되고, 축척이 틀어지면 이후 판정이 전부 거짓이 된다.
   */
  const bar = $("#draftbar");
  bar.innerHTML = "<div class='dl'>"
    + "<span class='area'>지금 이 거리는 몇 mm 입니까?</span></div>"
    + "<div class='dl'>"
    + "<input type='number' id='wl' value='3600' min='100' step='10' "
    + "style='width:120px;padding:6px 8px;font:600 15px ui-monospace,monospace'>"
    + "<span class='meta'>mm</span>"
    + "<span class='grow'></span>"
    + "<button id='wl-again'>" + (state.img ? "다시 인식" : "다시 그리기") + "</button>"
    + "<button class='primary' id='wl-ok'>확정</button></div>"
    + "<div class='dl'><span class='prev'>지금 잡은 공간에서 <b>가장 긴 벽</b>(도면 위 <b style='color:#B45309'>주황색</b>)의 실제 길이입니다. "
    + "입력하신 값에 맞춰 <b>도면 전체</b> 비율을 수정하겠습니다. 어느 방이든 벽 하나만 알면 됩니다 — "
    + "거실 3,600~4,500 · 안방 3,000~3,600mm 쯤입니다. "
    + "다른 방이 잡혔으면 <b>다시 인식</b>을 눌러 거실 안쪽을 직접 찍어 주세요.</span></div>";
  bar.classList.add("on");
  const wl = $("#wl");
  wl.focus(); wl.select();
  const commit = ()=>{
    const mm = +wl.value;
    if (!(mm>0)) { toast("실제 길이를 mm 로 넣어주세요"); return; }
    const k = mm / lmax;
    for (const s of segs){ s.x1*=k; s.y1*=k; s.x2*=k; s.y2*=k; }
    /*
     * **도면 이미지도 같은 자로 재야 한다.**
     * 벽 좌표만 mm 로 환산하고 `mmPerPx` 를 null 로 두면, 벽은 mm 축에 이미지는
     * "이미지 픽셀 = 월드 단위" 축에 그려져 **같은 화면에 자가 둘**이 된다.
     * 실제로 방이 도면보다 4.27배 크게 나와 도면 위에 제품을 올릴 수가 없었다
     * (사용자 지적: "거실 공간만 별도로 크게 나오고 이미지는 작게 줄어듭니다").
     * 벽이 이미지 픽셀 좌표에서 왔으므로 그 환산 계수가 곧 mm/px 다.
     */
    if (state.img) state.mmPerPx = k;
    state.scaled = true;
    const o = opts || {};
    const room = o.appendTo ? roomById(o.appendTo) : null;
    if (room){ room.parts.push({ walls: segs }); state.roomSel = room.id; syncWalls(); }
    else addRoom(o.name || nextRoomName(), segs);
    state.zoom /= k; state.panX = 24; state.panY = 24;
    state.measureSeg = null;
    bar.classList.remove("on");
    setMode("idle"); setStep(4); evaluate(); draw();
    toast(`도면 비율을 맞췄습니다 — 이 벽 ${mm.toLocaleString()}mm 기준`);
  };
  $("#wl-ok").onclick = commit;
  wl.onkeydown = (e)=>{ if (e.key === "Enter"){ e.preventDefault(); commit(); } };
  $("#wl-again").onclick = ()=>{
    state.measureSeg = null; bar.classList.remove("on");
    // 도면이 있으면 다시 그리라고 할 게 아니라 다시 인식시키는 것이 맞다
    if (state.img) startDetect(); else { setMode("wall"); draw(); }
  };
}

/* ── 단지 평면 라이브러리 ────────────────────────────────────────────
   매장에서 고객 단지를 고르면 업로드·축척·인식을 건너뛰고 바로 배치를 시작한다.

   **도면 이미지는 저장하지 않는다.** 분양 도면은 저작권이 있어 저장소에 둘 수 없다.
   대신 확인이 끝난 방 경계(mm 좌표)만 남긴다 — 파생 측정값이라 담을 수 있고, 벽이 이미
   월드 좌표라 이미지 없이 그대로 복원된다. 단지 하나당 몇 KB 밖에 되지 않는다.

   두 곳에서 읽는다:
     · public/plan-library.json  — 저장소에 커밋된 공용 목록
     · localStorage              — 이 기기에서 등록한 것 (내보내기로 공용 목록에 합칠 수 있다)
──────────────────────────────────────────────────────────────── */
const LIB_KEY = 'place_library_v1';
let libSeed = null;

async function libraryAll(){
  if (!libSeed) {
    try {
      const r = await fetch('plan-library.json');
      const j = await r.json();
      libSeed = Array.isArray(j.entries) ? j.entries : [];
    } catch { libSeed = []; }
  }
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch { local = []; }
  return [...libSeed.map((e) => ({ ...e, _src: '공용' })), ...local.map((e) => ({ ...e, _src: '이 기기' }))];
}

/** 현재 잡아 놓은 방들을 단지로 등록한다 */
function saveToLibrary(region, complex, type){
  if (!state.rooms.length) { toast('먼저 방을 잡아 주세요'); return; }
  const entry = {
    region: region || '', complex, type,
    addedAt: new Date().toISOString().slice(0, 10),
    /*
     * **그때 쓰던 도면 축척을 함께 남긴다.** 방 좌표는 mm 라 그것만으로 복원되지만,
     * 나중에 같은 도면을 다시 띄우려면 "이 이미지 1px 이 몇 mm 였는지"를 알아야
     * 방과 도면이 같은 자로 그려진다. 없으면 도면은 못 띄우고 방만 복원한다.
     */
    mmPerPx: state.mmPerPx || null,
    rooms: state.rooms.map((r) => ({
      name: r.name,
      parts: r.parts.map((p) => ({
        walls: p.walls.map((w) => ({ x1: Math.round(w.x1), y1: Math.round(w.y1),
                                     x2: Math.round(w.x2), y2: Math.round(w.y2), open: !!w.open })),
      })),
    })),
  };
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch {}
  // 같은 단지·타입이 있으면 덮어쓴다
  local = local.filter((e) => !(e.complex === complex && e.type === type));
  local.push(entry);
  localStorage.setItem(LIB_KEY, JSON.stringify(local));
  toast(`${complex} ${type} 저장됨 (이 기기)`);
  return entry;
}

/** 라이브러리 항목을 현재 화면으로 불러온다 — 도면 이미지 없이 방만 복원한다 */
function loadFromLibrary(entry){
  state.img = null; state.imgW = state.imgH = 0;
  state.mask = state.baseMask = state.cleanCv = null; state.sealCache = null;
  state.items = []; state.rooms = []; state.walls = [];
  /*
   * **`mmPerPx` 에 1 을 넣지 말 것.**
   * 이 값의 뜻은 "도면 이미지 1px 이 몇 mm 인가"이지 "월드 단위가 mm 인가"가 아니다.
   * 1 을 넣으면 1,000px 짜리 도면이 **가로 1m** 로 그려져 화면 구석 썸네일이 된다
   * (사용자 지적: 도면은 50px 썸네일, 방만 크게). 저장된 좌표가 이미 mm 라는 사실은
   * `scaled = true` 하나로 충분하다. 도면 이미지의 축척은 **따로** 아는 값이 있을 때만 쓴다.
   */
  state.mmPerPx = (entry && +entry.mmPerPx) || null;
  state.scaled = true;
  for (const r of entry.rooms) {
    const room = { id: 'r' + Math.random().toString(36).slice(2, 8), name: r.name,
                   parts: r.parts.map((p) => ({ walls: p.walls.map((w) => ({ ...w })) })) };
    state.rooms.push(room);
  }
  state.roomSel = state.rooms[0] ? state.rooms[0].id : null;
  syncWalls();
  // 화면에 맞춰 배율을 잡는다
  const xs = state.walls.flatMap((w) => [w.x1, w.x2]), ys = state.walls.flatMap((w) => [w.y1, w.y2]);
  if (xs.length) {
    const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
    const rect = cv.getBoundingClientRect();
    state.zoom = Math.min(rect.width / (w || 1), rect.height / (h || 1)) * 0.85;
    state.panX = 40 - Math.min(...xs) * state.zoom;
    state.panY = 40 - Math.min(...ys) * state.zoom;
  }
  setMode('idle'); setStep(4);
  // 어느 단지·주택형인지 남긴다 — 결과 이미지 제목에 쓴다(상담지에 단지명이 없으면 무슨 종이인지 모른다)
  state.complexName = entry.complex || null;
  state.typeName = entry.type || null;
  evaluate(); renderSide(); draw();
  toast(`${entry.complex} ${entry.type} — 방 ${entry.rooms.length}곳 불러옴`);
}

let planIndex = null;
async function loadPlanIndex(){
  if (planIndex) return planIndex;
  try {
    const r = await fetch('plan-index.json');
    const j = await r.json();
    planIndex = Array.isArray(j.complexes) ? j.complexes : [];
  } catch { planIndex = []; }
  return planIndex;
}

/**
 * 단지 고르기 — **지역 → 단지 → 도면** 순으로 좁혀 간다.
 * 매장에서 고객에게 묻는 순서 그대로다("어느 지역이세요" → "어느 단지" → "몇 평형").
 *
 * 도면을 고르면 그 단지의 평면도가 화면에 올라오고 축척 맞추기부터 시작한다.
 * 그 타입의 방을 전에 저장해 두었다면 도면 없이 방까지 그대로 복원한다.
 */
async function openLibrary(){
  const [idx, saved] = await Promise.all([loadPlanIndex(), libraryAll()]);
  let lv = 'region', region = null, cx = null;
  /*
   * **시·도를 먼저 고르게 한다.**
   * 지역이 17곳이라 휴대폰에서는 한 화면에 안 들어가 계속 쓸어내려야 했다
   * (사용자 지적). 지역 이름이 "경기 평택"·"강원 원주" 꼴이라 앞 토막이 곧 시·도다.
   * 칩으로 걸러 두면 경기 14곳 / 강원 5곳이 되어 한 화면에 들어온다.
   */
  const sidoOf = (r) => (String(r).split(' ')[0] || '기타');
  let sido = null;

  const uniq = (a) => [...new Set(a)].sort((x, y) => x.localeCompare(y, 'ko'));
  // 도면이 있는 단지 + 방만 저장된 단지를 함께 보여 준다
  const savedOnly = saved.filter((e) => !idx.some((c) => c.complex === e.complex));
  const regions = () => uniq([...idx.map((c) => c.region), ...savedOnly.map((e) => e.region || '지역 미지정')]);
  const inRegion = () => idx.filter((c) => c.region === region);
  const savedIn = (complex) => saved.filter((e) => e.complex === complex);

  const render = () => {
    const body = $('#libbody'), crumb = $('#libcrumb');
    if (!body) return;
    crumb.innerHTML = lv === 'region' ? '<b>지역</b>'
      : lv === 'complex' ? `<a href="#" data-go="region">지역</a> › <b>${esc(region)}</b>`
      : `<a href="#" data-go="region">지역</a> › <a href="#" data-go="complex">${esc(region)}</a> › <b>${esc(cx.complex)}</b>`;

    let items = [];
    // 시·도 칩은 지역 단계에서만 띄운다
    const chipBox = $('#libchips');
    if (chipBox) chipBox.innerHTML = '';
    if (lv === 'region') {
      const sidos = [...new Set(regions().map(sidoOf))]
        .sort((a,b)=> regions().filter((r)=>sidoOf(r)===b).length - regions().filter((r)=>sidoOf(r)===a).length);
      if (sido === null || !sidos.includes(sido)) sido = sidos[0] || null;
      if (chipBox && sidos.length > 1) {
        chipBox.innerHTML = sidos.map((sd)=>{
          const n = regions().filter((r)=>sidoOf(r)===sd).length;
          return `<button class="chip${sd===sido?' on':''}" data-sido="${esc(sd)}">${esc(sd)}<span>${n}</span></button>`;
        }).join('');
        chipBox.querySelectorAll('.chip').forEach((c)=>{
          c.onclick = ()=>{ sido = c.dataset.sido; render(); };
        });
      }
      items = regions().filter((r)=> !sido || sidoOf(r) === sido).map((r) => {
        const cs = idx.filter((c) => c.region === r);
        const n = cs.reduce((s, c) => s + c.plans.length, 0)
          + savedOnly.filter((e) => (e.region || '지역 미지정') === r).length;
        // 칩에서 시·도를 이미 골랐으니 목록에는 시·군만 적는다 — 줄이 짧아야 눈에 잘 들어온다
        const shortName = sido && r.startsWith(sido + ' ') ? r.slice(sido.length + 1) : r;
        return `<button class="libitem" data-v="${esc(r)}"><b>${esc(shortName)}</b>
          <span class="hint">단지 ${cs.length + uniq(savedOnly.filter((e) => (e.region || '지역 미지정') === r).map((e) => e.complex)).length}곳 · 도면 ${n}장</span></button>`;
      });
    } else if (lv === 'complex') {
      items = inRegion().map((c) => `<button class="libitem" data-id="${esc(c.id)}"><b>${esc(c.complex)}</b>
        <span class="hint">도면 ${c.plans.length}장${savedIn(c.complex).length ? ` · 저장된 방 ${savedIn(c.complex).length}종` : ''}</span></button>`);
      for (const e of savedOnly.filter((x) => (x.region || '지역 미지정') === region)) {
        items.push(`<button class="libitem" data-saved="${esc(e.complex)}"><b>${esc(e.complex)}</b>
          <span class="hint">저장된 방만 있음</span></button>`);
      }
    } else {
      items = cx.plans.map((p) => {
        const s = saved.find((e) => e.complex === cx.complex && e.type === p.type);
        // 도면에 인쇄된 치수를 읽어 축척을 미리 구해 둔 도면이 있다. 확신도를 함께 밝힌다 —
        // 자동으로 구한 값이라 사용자가 눈으로 확인하고 넘어갈 수 있어야 한다.
        const sc = p.mmPerPx ? `<span class="ty">축척 ${p.scaleConf || '자동'}</span>` : '';
        /*
         * 미리보기를 함께 보여준다. 도면 고르기는 자동 선별에 기대는데, 그 선별이 가끔
         * 설명글·면적표·3D 조감도를 고른다(표본 40장 중 8장). 어느 판별식으로도 깨끗이
         * 갈리지 않아 — 방 이름 OCR·색 가짓수·벽 그물망을 다 시도했다 — 사람이 눈으로
         * 건너뛸 수 있게 하는 편이 확실하다. 이 앱이 "자동은 초안, 확정은 사람"인 것과 같다.
         */
        return `<button class="libitem withthumb" data-file="${esc(p.file)}" data-type="${esc(p.type)}" data-excl="${p.exclusiveM2 || ''}"
            ${p.mmPerPx ? `data-mmpx="${p.mmPerPx}" data-sconf="${esc(p.scaleConf || '')}"` : ''}>
          <img class="thumb" src="${esc(p.file)}" alt="" loading="lazy">
          <span class="body">
            <b>${esc(p.type)}</b>${p.exclusiveM2 ? `<span class="ty">전용 ${p.exclusiveM2}㎡</span>` : ''}${sc}
            <span class="hint">${p.w}×${p.h}px · ${p.kb}KB${s ? ` · <b>저장된 방 ${s.rooms.length}곳</b>` : ''}</span>
          </span></button>`;
      });
    }
    body.innerHTML = items.length ? items.join('')
      : '<p class="hint">등록된 것이 없습니다. 도면을 올려 방을 잡은 뒤 <b>이 단지 저장</b>을 누르세요.</p>';

    body.querySelectorAll('.libitem').forEach((b) => {
      b.onclick = () => {
        if (lv === 'region') { region = b.dataset.v; lv = 'complex'; render(); }
        else if (lv === 'complex') {
          if (b.dataset.saved) {                       // 도면 없이 방만 저장된 단지
            const e = saved.find((x) => x.complex === b.dataset.saved);
            closeSheet(); if (e) loadFromLibrary(e);
            return;
          }
          cx = idx.find((c) => c.id === b.dataset.id); lv = 'plan'; render();
        } else {
          const type = b.dataset.type;
          const s = saved.find((e) => e.complex === cx.complex && e.type === type);
          const mmpx = +b.dataset.mmpx || 0;
          // 전용면적은 평형별 추천의 기준이 된다 (청약홈·도면 머리말에서 읽은 공시값)
          const excl = +b.dataset.excl || 0;
          const sconf = b.dataset.sconf || '';
          closeSheet();
          // 도면을 올리고, 저장해 둔 방이 있으면 그 위에 그대로 되살린다
          useImage(b.dataset.file, () => {
            state.exclusiveM2 = excl || null;
            if (s) {
              /*
               * 저장된 방(월드 mm)과 도면 이미지(이미지 px)를 같은 화면에 올리려면
               * **이 이미지 1px 이 몇 mm 인지**를 알아야 한다. 모르면 이미지를 띄우지
               * 않는다 — 틀린 크기로 겹쳐 보이는 것이 안 보이는 것보다 나쁘다.
               * 저장할 때 남긴 값이 가장 정확하고, 없으면 색인의 자동 판독값을 쓴다.
               */
              const keep = { img: state.img, imgW: state.imgW, imgH: state.imgH };
              loadFromLibrary(s);
              const px = (+s.mmPerPx) || mmpx || 0;
              if (px) {
                state.mmPerPx = px;
                state.img = keep.img; state.imgW = keep.imgW; state.imgH = keep.imgH;
              } else {
                toast('저장된 방만 복원했습니다 — 이 도면의 축척을 몰라 이미지는 띄우지 않았습니다');
              }
            } else if (mmpx) {
              /*
               * 도면에 인쇄된 치수로 미리 구해 둔 축척이 있으면 채워 놓고 바로 인식 단계로 간다.
               * 근거 없는 숫자가 아니라 **도면에 실제로 적힌 치수**에서 나온 값이라 원칙에 어긋나지
               * 않는다. 다만 자동 판독이므로 사용자가 확인하고 넘어갈 수 있어야 한다 —
               * 도구막대의 '축척'으로 언제든 다시 맞출 수 있고, 확신도를 함께 알린다.
               */
              state.mmPerPx = mmpx; state.scaled = true;
              setMode('room'); setStep(3);
            }
            draw();
          });
          toast(s ? `${cx.complex} ${type} — 저장된 방까지 복원`
            : mmpx ? `${cx.complex} ${type} — 축척 자동 적용(${sconf || '자동'}) · 다르면 '축척'으로 다시 맞추세요`
            : `${cx.complex} ${type} — 축척을 맞춰 주세요`);
        }
      };
    });
    crumb.querySelectorAll('a[data-go]').forEach((a) => {
      a.onclick = (ev) => { ev.preventDefault(); lv = a.dataset.go; render(); };
    });
  };

  sheet(`<h2>단지 고르기</h2>
    <p class="hint">지역 → 단지 → 도면 순으로 고릅니다. 저장해 둔 도면은 방까지 복원됩니다.</p>
    <div id="libcrumb" class="crumb"></div>
    <div id="libchips" class="chips"></div>
    <div id="libbody" class="liblist"></div>
    <div class="modal-actions"><button id="libexp">내보내기(JSON)</button><button id="c">닫기</button></div>`,
    () => {
      render();
      $('#libexp').onclick = () => {
        let local = [];
        try { local = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch {}
        const blob = new Blob([JSON.stringify({ version: 1, entries: local }, null, 1)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'plan-library-내보내기.json'; a.click();
      };
      $('#c').onclick = closeSheet;
    });
}
