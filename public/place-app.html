   * | | 지금(어림 폴백) | 캐시만 비움 | 2배 가드까지 |
   * |---|---|---|---|
   * | 덮음 중앙값 | **35.7%** | 39.4% | 32.0% |
   * | 덮음 5% 미만 | **5장** | 17장 | 14장 |
   * | 공간 0곳 | **1장** | 5장 | 3장 |
   * | 띠 포기 | **6장** | 19장 | 8장 |
   *
   * 이유 — 어림 폴백(`긴변의 0.0054%`)은 **치수가 인쇄된 도면 15장으로 직접 보정한 값**
   * 이라 해상도에서 곧바로 나오는데, 사용자가 넣는 축척은 **어느 벽을 재느냐에 따라 몇
   * 배씩 흔들린다**(CLAUDE.md: *"기준 벽이 창 구간만 잡혀 축척이 통째로 틀어졌다"*).
   * 문턱을 그 위에 세우면 그 오차가 그대로 증폭돼 `keepBands` 가 픽셀의 절반 넘게
   * 지우고 스스로 물러난다(=띠 포기).
   *
   * **어림 폴백은 축척 오차에 둔감하다. 그게 여기서는 장점이다.**
   */
  const mmFb = Math.max(mask.w, mask.h) * 0.000054;      // 1mm 당 마스크 픽셀(실측 보정)
  const pxPerMm = state.mmPerPx ? mask.S / state.mmPerPx : mmFb;
  const oldPx = (fb) => Math.max(2, Math.round(Math.max(mask.w, mask.h) * fb));
  // 띠 길이 기준 500mm — 문 옆 벽 토막·600mm 기둥은 남고, 실명 글씨 한 덩이(400~460mm)와
  // 해칭 빗금은 걸러진다. 이보다 올리면 작은 기둥·벽감이 사라져 그 자리에 가전을 놓게 된다.
  /*
   * **길이·조각 폴백을 낮췄다** (2026-08-18, AI Hub 정답 30장으로 쓸어 정함).
   *
   * 바로 위 주석은 셋을 **올려** 보고 후퇴한 기록이다. 이번은 **반대 방향**이고, 근거도
   * 다르다 — 정답이 붙은 도면으로 격자를 쓸어 **지킴과 정밀도를 함께** 봤다:
   *
   * | 길이×조각 | 윤곽선 도면 | 중간 | 벽이 칠해진 도면 |
   * |---|---|---|---|
   * | 1.0 × 1.0 (예전) | 52% / 57% | 68% / 73% | 95% / 53% |
   * | 0.75 × 0.35 | 74% / 57% | 79% / 72% | 98% / 52% |
   * | **1.0 × 0.35 (지금)** | **64% / 58%** | **77% / 72%** | **96% / 53%** |
   *
   * **`dropSpecks` 만 낮췄다.** 그쪽은 지킴이 12pt 오르는데 **정밀도가 오히려 올랐다**
   * (57 → 58) — 지우던 조각이 쓰레기가 아니라 **진짜 벽 토막**이었다는 뜻이다.
   *
   * **길이 문턱은 건드리면 안 된다** — 0.75 로 낮췄더니 `test:plans` 의 비평면도 판별이
   * 깨졌다(`plans/c133/T2.jpg` 기울기 0.42 에 경고가 안 붙었다). CLAUDE.md 가
   * *"비도면 최고 0.42는 **띠 포기**로 잡힌다"* 고 적어 둔 그 자리다 — 길이를 낮추면
   * `keepBands` 가 비평면도에서도 띠를 찾아 **포기하지 않게 되어** 경고가 사라진다.
   * 비평면도가 조용히 통과하면 상담사가 엉뚱한 인식 결과를 근거 없이 믿는다.
   * `dropSpecks` 는 띠 포기 판정과 무관해 이 문제가 없다.
   */
  const lenPx = state.mmPerPx ? Math.max(2, Math.round(500 * pxPerMm / 2)) : oldPx(0.010);
  const thickPx = Math.max(2, Math.round(450 * pxPerMm / 2));
  /*
   * **나란한 두 선 사이를 먼저 메운다** (2026-08-18). 속이 빈 벽에서 몸통을 놓치던
   * 원리 결함을 고치는 자리다 — 자세한 근거는 `pairedFill` 주석에 있다.
   *
   * **메운 뒤에는 열기를 쓰지 않는다.** 벽이 속까지 찬 덩어리가 되므로 얇은 선을 지울
   * 이유가 없고, 오히려 깎는다. 실측(정답 20장) — 열기를 두면 재현 41.7%, 빼면 48.6%
   * 이고 정밀도는 71.0% → 69.4% 로 1.6pt 만 준다.
   *
   * `usedOpen`·`outline` 은 **그대로 계산해 둔다** — 화면이 "윤곽선만 그린 도면"을
   * 알리는 신호이고, 여기서 쓰지 않을 뿐 진단으로는 여전히 맞다.
   */
  /*
   * **속이 빈 벽에만 쓴다.** 전부에 쓰면 벽이 두꺼워져 방이 좁아진다 — 우리 코퍼스에서
   * 실제로 거실이 51.3 → 36.9㎡ 로 줄었다(기대 44~56). 분양 도면은 벽이 이미 칠해져
   * 있어 메울 것이 없는데, 다른 나란한 선(마감선·가구 윤곽)까지 메우기 때문이다.
   *
   * 가르는 신호는 이미 있다 — 바로 위의 `usedOpen === 0`, 즉 **열기가 그림의 절반
   * 넘게 지워 건너뛴 도면**이 곧 "선으로만 그린 도면"이다.
   */
  if (usedOpen === 0 && openR > 0){
    const pairPx = Math.max(2, Math.round(PAIR_MM * pxPerMm));
    m = pairedFill(mask.dark, mask.w, mask.h, lenPx, pairPx);
  }
  m = keepBands(m, mask.w, mask.h, lenPx, thickPx);
  // 그래도 떨어져 남은 작은 조각을 지운다. 기준은 800mm — 벽은 아무리 짧아도 그보다 길다.
  const speckPx = state.mmPerPx
    ? Math.max(4, Math.round((800 / state.mmPerPx) * mask.S))
    : oldPx(0.0105);
  m = dropSpecks(m, mask.w, mask.h, speckPx);
  const bbox = structureBox(m, mask.w, mask.h);
  // 건물 안쪽 — 창의 유리선이 살아 있는 **원본** 마스크로 잡는다. 근거를 못 찾으면 null.
  const bboxArea = (bbox.x1 - bbox.x0 + 1) * (bbox.y1 - bbox.y0 + 1);
  const env = envelopeMask(mask.dark, mask.w, mask.h, bboxArea * 0.15);
  /* bands=false 는 "가로·세로 띠로는 벽을 못 찾았다"(대각선·사진·표 지면),
     outline=true 는 "벽을 칠하지 않고 윤곽선만 그린 도면이라 열기를 건너뛰었다".
     둘 다 결과를 못 믿을 신호이므로 화면이 그대로 밝힌다(renderReport). */
  /*
   * **벽 두께를 재 둔다.** 3D 가 60mm 가정 대신 이 값을 쓴다. 축척을 모르면 픽셀만
   * 싣고 mm 는 비운다 — 모르는 것을 숫자로 적지 않는다.
   */
  const wallPx = wallThickPx(m, mask.w, mask.h);
  const wallMm = (wallPx && state.mmPerPx) ? Math.round(wallPx * state.mmPerPx / mask.S) : null;
  const axis = axisConcentration();
  state.baseInfo = { openR: usedOpen, bbox, thr: mask.thr, env: !!env, axis, wallPx, wallMm,
                     bands: !bandsBailed, outline: usedOpen === 0 && openR > 0,
                     /* 두 신호는 **서로 다른 실패**를 잡는다 — 기울기는 입체 렌더링·글자 지면을,
                        띠 포기는 벽이 아예 없는 사진 몽타주를 잡는다. 그래서 합집합으로 본다. */
                     tilted: (axis !== null && axis < AXIS_MIN) || bandsBailed };
  return (state.baseMask = { w:mask.w, h:mask.h, S:mask.S, dark:m, bbox, env });
}

/** 지정한 반경으로 틈을 메운 마스크 (반경별로 캐시) */
function sealedMask(closeR){
  state.sealCache = state.sealCache || {};
  if (state.sealCache[closeR]) return state.sealCache[closeR];
  const base = ensureBase();
  const m = closeR > 0
    ? boxMorph(boxMorph(base.dark, base.w, base.h, closeR, 'max'), base.w, base.h, closeR, 'min')
    : base.dark;
  return (state.sealCache[closeR] = { w:base.w, h:base.h, S:base.S, dark:m, bbox:base.bbox, env:base.env });
}

function ensureClean(){
  const base = ensureBase();
  if (!state.cleanCv) {
    state.cleanCv = cleanCanvas(base, base.dark);
    state.cleanInfo = { openR: state.baseInfo.openR, closeR: 0 };
  }
  return base;
}

/**
 * 경계선의 각 구간이 실제 벽인지, 메워서 만든 개구부(문·창)인지 가른다.
 *
 * 판정 근거를 **바깥에 벽이 안 보인다**에서 **닫기가 여기를 메웠다**로 바꿨다.
 * 예전에는 경계에서 바깥으로 7px 훑어 어두운 것이 없으면 개구부로 봤는데,
 * ①경계선이 단순화 과정에서 몇 px 밀리면 판정이 뒤집히고 ②복도 건너편 벽이
 * 7px 안에 있으면 문이 벽이 되고 ③해칭이 성긴 벽은 개구부가 됐다.
 * 지금은 바깥으로 나가며 **처음 만나는 것**을 본다 —
 *   도면에 실제로 그려진 벽이면 벽, 닫기로 메운 자리면 개구부.
 * 어느 쪽 근거도 못 찾으면 벽으로 둔다. 없는 개구부를 만들어 내지 않는다.
 *
 * sealed를 넘기지 않으면(단위 테스트 등) 예전처럼 "바깥에 벽이 없으면 개구부"로 판정한다.
 */
function classifyEdges(poly, base, sealed){
  const { w, h } = base;
  const bd = base.dark, sd = sealed ? sealed.dark : null;
  const cx = poly.reduce((s,p)=>s+p[0],0)/poly.length;
  const cy = poly.reduce((s,p)=>s+p[1],0)/poly.length;

  // 길이 기준은 축척을 알면 실제 치수(mm)로 잡는다. 도면 크기에 따라 기준이 달라지면
  // 같은 문이 어떤 도면에서는 개구부, 어떤 도면에서는 벽이 된다.
  const S = base.S || 1;
  const pxPerMm = state.mmPerPx ? S / state.mmPerPx : 0;
  const span = Math.max(w, h);
  /*
   * **축척을 모를 때가 기본이다.** 자동 인식은 사용자가 길이를 넣기 전에 돌아가므로
   * `state.mmPerPx` 가 없고, 아래 폴백이 사실상 늘 쓰인다. 그런데 예전 폴백(도면의 1.2%)은
   * 실제 500mm 의 **1.6~3.7배(중앙값 2.1배) 작았다.** 그래서 짧은 벽 토막까지 개구부로
   * 판정됐고, 화면에서는 "어디는 벽으로 잡고 어디는 안 잡는" 것처럼 보였다
   * (실측: 40장 표본에서 개구부 길이비율 중앙값 24.5%, 최악 57%).
   *
   * 배율은 **축척이 실린 도면 15장으로 보정**했다 — 1mm ≈ 도면 긴변의 0.0054%.
   * 도면마다 실제 폭이 11~27m 로 달라 이 환산은 어림이지만, **틀리는 방향이 안전하다** —
   * 기준이 커지면 개구부로 덜 보고 벽으로 더 본다. 근거를 못 찾으면 벽으로 둔다는
   * 원칙과 같은 방향이다(없는 개구부를 만들어 내지 않는다).
   */
  const mmFb = span * 0.000054;
  const mmPx = (mm, fb) => (pxPerMm ? Math.max(1, Math.round(mm * pxPerMm))
                                    : Math.max(fb, Math.round(mm * mmFb)));
  const probe   = Math.max(6, mmPx(400, Math.round(span * 0.012)));   // 경계선이 밀린 만큼은 더 본다
  const minOpen = mmPx(500, Math.max(4, Math.round(span * 0.012)));   // 이보다 짧으면 문·창이 아니다
  const noise   = Math.max(2, Math.round(probe / 3));                 // 표본 몇 개짜리 깜빡임

  // 닫기는 실제 벽 옆에도 1~2px짜리 얇은 테두리를 남긴다. 그 한 겹만 보고 판정하면
  // 멀쩡한 벽이 통째로 개구부가 된다(ㄱ자 도면에서 실제로 그렇게 됐다).
  // 그래서 **메운 자리를 지나 빈 곳이 나올 때까지** 나가 본다 —
  // 도중에 그려진 벽에 닿으면 벽, 메운 자리를 뚫고 빈 곳이 나오면 개구부.
  const fillMax = Math.max(3, mmPx(300, 4));   // 문·창을 메운 두께는 벽 두께 수준이다
  const kindAt = (x, y, nx, ny) => {
    let fill = 0;
    for (let d = 0; d <= probe; d++) {
      const px = Math.round(x + nx*d), py = Math.round(y + ny*d);
      if (px < 0 || py < 0 || px >= w || py >= h) return 1;   // 도면 밖은 벽으로 본다
      const p = py*w + px;
      if (bd[p]) return 1;                                    // 도면에 그려진 벽
      if (sd && sd[p]) { if (++fill > fillMax) return 0; continue; }   // 닫기로 메운 자리
      if (fill) return 0;                                     // 메운 자리를 지나 빈 곳 = 문·창
    }
    return sd && !fill ? 1 : 0;
  };

  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i+1) % poly.length];
    const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy);
    if (L < 1) continue;
    const ux = dx/L, uy = dy/L;
    let nx = -uy, ny = ux;
    const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
    if ((mx-cx)*nx + (my-cy)*ny < 0){ nx = -nx; ny = -ny; }      // 바깥쪽 법선

    const n = Math.max(2, Math.round(L));
    const flags = [];
    for (let k = 0; k <= n; k++) {
      const t = k/n;
      flags.push(kindAt(a[0]+dx*t, a[1]+dy*t, nx, ny));
    }
    // 구간은 **빈틈 없이** 이어져야 한다. 한 표본씩 비우면 벽 사이에 미세한 구멍이 생겨
    // 방이 닫히지 않은 것으로 보인다.
    let s0 = 0;
    const runs = [];
    for (let k = 1; k <= flags.length; k++) {
      if (k === flags.length || flags[k] !== flags[s0]) {
        runs.push({ t0: s0/n, t1: Math.min(k, n)/n, solid: !!flags[s0] });
        s0 = k;
      }
    }
    const merged = [];
    for (const r of runs) {
      const prev = merged[merged.length-1];
      if (prev && (r.t1 - r.t0) * L < noise) { prev.t1 = r.t1; continue; }
      merged.push({ ...r });
    }
    for (const r of merged) {
      out.push({
        x1: a[0] + dx*r.t0, y1: a[1] + dy*r.t0,
        x2: a[0] + dx*r.t1, y2: a[1] + dy*r.t1,
        open: !r.solid,
      });
    }
  }

  // 문·창이라기엔 너무 짧은 개구부는 벽으로 되돌린다. 모서리에서 한두 표본이 뒤집혀
  // 엉뚱한 자리에 주황 점선이 뜨던 것이 이것 때문이었다.
  for (const e of out) {
    if (e.open && Math.hypot(e.x2-e.x1, e.y2-e.y1) < minOpen) e.open = false;
  }
  // 같은 종류로 이어지는 구간은 하나로 합친다 (한 벽이 여러 줄로 쪼개져 보고되지 않게)
  const joined = [];
  for (const e of out) {
    const p = joined[joined.length-1];
    if (p && p.open === e.open
        && Math.abs(p.x2-e.x1) < 0.6 && Math.abs(p.y2-e.y1) < 0.6
        && Math.abs((p.x2-p.x1)*(e.y2-e.y1) - (p.y2-p.y1)*(e.x2-e.x1)) < 1e-6) {
      p.x2 = e.x2; p.y2 = e.y2; continue;
    }
    joined.push({ ...e });
  }
  if (joined.length > 1) {
    const f = joined[0], l = joined[joined.length-1];
    if (f.open === l.open
        && Math.abs(l.x2-f.x1) < 0.6 && Math.abs(l.y2-f.y1) < 0.6
        && Math.abs((l.x2-l.x1)*(f.y2-f.y1) - (l.y2-l.y1)*(f.x2-f.x1)) < 1e-6) {
      f.x1 = l.x1; f.y1 = l.y1; joined.pop();
    }
  }
  return joined;
}

/**
 * forceR을 주면 그 반경을 그대로 쓴다 — 사용자가 "더 넓게/더 좁게"로 조절할 때.
 * 자동 판정은 도면 관례를 전제로 한 추정이라, 전제를 벗어나는 도면에서는 사람이 고쳐야 한다.
 */
function detectRoomAt(imgX, imgY, forceR){
  if (!state.img) return { error: '도면을 먼저 올려주세요.' };
  const base = ensureBase();
  let { closeSteps } = cleanRadii(base);
  if (forceR != null) closeSteps = [forceR];
  const sx = Math.round(imgX * base.S), sy = Math.round(imgY * base.S);

  // 새어 나가지 않는 **가장 작은** 닫기 반경을 찾는다. 크게 잡을수록 창문 표시나
  // 가까운 선이 뭉쳐 검은 덩어리가 되므로, 막을 수 있는 최소한만 막는다.
  // 한 장에 도면이 여럿이면 **누른 자리가 속한 도면**만 기준으로 삼는다.
  // 시트 전체를 기준으로 재면 상부층 방을 눌러도 하부층까지 포함한 범위로 누수를 판정한다.
  const bb = sheetBoxAt(base, sx, sy);
  const planArea = (bb.x1 - bb.x0 + 1) * (bb.y1 - bb.y0 + 1);
  const leakLimit = ((bb.x1-bb.x0) + (bb.y1-bb.y0)) * 0.3;
  let tooBig = false;
  const cands = [];
  // 실패했을 때 되짚어 볼 구간을 기억한다 — 새어 나간 가장 큰 반경과 방이 메워진 가장 작은 반경
  let lastLeak = null, firstWall = null;
  let fallback = null;   // 하나도 통과하지 못했을 때 내놓을 근사치
  const tryRadius = (r) => {
    const m0 = sealedMask(r);
    // sealedMask 는 반경별로 캐시되므로 bbox 만 이 클릭용으로 갈아 끼운다(복사는 얕게)
    const m = bb === base.bbox ? m0 : { ...m0, bbox: bb };
    if (m.dark[sy*m.w + sx]) {                      // 이 반경에서는 누른 자리가 벽에 먹혔다
      if (firstWall == null || r < firstWall) firstWall = r;
      return;
    }
    const g = floodRegion(m, sx, sy);
    if (!g) return;
    if (g.count < planArea * 0.004) return;
    if (g.border > leakLimit) {
      if (lastLeak == null || r > lastLeak) lastLeak = r;
      // 하나도 통과하지 못했을 때 내놓을 근사치 후보로 가장 작은 것을 기억해 둔다.
      // 이 도구는 상담 중 대략을 보는 용도라, 아무것도 못 내놓는 것이 제일 나쁘다.
      if (g.count < planArea * 0.6 && (!fallback || g.count < fallback.g.count)) fallback = { r, g, m };
      return;
    }
    // 새어 나갔는지는 위의 border 검사(도면 범위 가장자리 접촉)가 판정한다.
    // 면적 비율은 최후 안전장치로만 쓴다 — 기준을 낮추면 안 된다. 요즘 평면은 거실·주방·
    // 식당·알파공간이 하나로 트여 있어 그 자체로 도면의 3~4할을 차지하는 것이 정상이고,
    // 방 하나짜리 도면에서는 8할에 가깝다.
    if (g.count > planArea * 0.95){ tooBig = true; return; }
    cands.push({ r, g, m });
  };
  for (const r of closeSteps) tryRadius(r);

  // 사다리로 하나도 못 찾았다면, "새는 반경"과 "방이 메워지는 반경" 사이를 이분 탐색한다.
  // 작은 방일수록 새지 않으면서 방이 살아남는 구간이 좁아 사다리 눈금 사이에 빠진다
  // (실제 LH 평면도의 드레스룸은 612~695mm 에서만 닫혔는데 사다리는 500·800 이었다).
  // 정상 경로에는 손대지 않으므로 이미 잘 되던 도면의 판정은 그대로다.
  if (!cands.length && lastLeak != null && firstWall != null && firstWall - lastLeak > 2) {
    let lo = lastLeak, hi = firstWall;
    for (let i = 0; i < 12 && hi - lo > 1 && !cands.length; i++) {
      const mid = Math.round((lo + hi) / 2);
      const before = cands.length;
      tryRadius(mid);
      if (cands.length > before) break;             // 찾았다
      // mid 가 벽이면 더 작은 쪽, 샜으면 더 큰 쪽을 본다
      if (firstWall <= mid) hi = mid; else lo = mid;
    }
    cands.sort((a, b) => a.r - b.r);
  }

  // 어느 반경을 쓸 것인가. 예전에는 "새지 않는 가장 작은 값"을 썼는데, 실제 세대 평면도는
  // 도면 안에서 완전히 닫혀 있고 문이 전부 열린 채 그려져 있어 **반경 0에서 세대 전체가
  // 방 하나로 잡혔다**. 어느 방을 눌러도 90㎡가 나온다. 세 단계로 고른다.
  let used = null, reg = null, mask = null, poly = null, edges = null;
  let pool = [];   // 아래 "더 넓게/더 좁게" 계산에서도 쓰므로 블록 밖에 둔다
  if (cands.length) {
    // ① 경계가 도면 가장자리에 닿지 않는 것을 먼저 쓴다. 닿아 있으면 그건 방의 경계가
    //    아니라 도면이 잘린 자리이고, 그 구간은 개구부로도 보고되지 않는다.
    const closed = cands.filter((c) => c.g.border === 0);
    pool = closed.length ? closed : cands;
    // ② 그 중 **처음으로 크게 줄어든 지점**을 쓴다. 반경을 키우면 문이 막히며 옆방이
    //    통째로 떨어져 나가 면적이 확 준다. 더 키우면 문보다 넓은 개구부(주방 2m·현관
    //    1.85m)까지 막혀 트인 공간이 잘리므로, 처음 갈라진 자리에서 멈춘다.
    //    '마지막' 지점을 쓰면 계속 잘려 나가고, 필요한 반경이 도면 해상도에 따라
    //    0.5~0.9배로 달라져 절대 기준으로는 가를 수 없다(실제로 저해상도에서 어긋났다).
    let pick = 0;
    for (let i = 0; i + 1 < pool.length; i++) {
      if (pool[i].g.count > pool[i + 1].g.count * 1.25) { pick = i + 1; break; }
    }
    // ③ **막은 것이 문·창이 맞는지 확인한다.** 반경을 더 키우면 트인 주방(개구부 2m)까지
    //    막혀 거실이 통째로 잘린다. 막아 놓은 자리는 개구부로 보고되므로, 문·창이라기엔
    //    너무 넓은 개구부가 생겼다면 그건 통로를 자른 것이다 — 한 단계 물러선다.
    //    반경 상한을 픽셀로 정하지 않고 이렇게 결과로 판정하는 이유는, 같은 900mm 문이라도
    //    도면 해상도에 따라 필요한 반경이 0.5~0.9배로 달라지기 때문이다.
    const jogOf = (m) => (state.mmPerPx
      ? Math.max(3, Math.round((300 / state.mmPerPx) * m.S))
      : Math.max(4, Math.round(Math.max(m.w, m.h) * 0.012)));
    for (let i = pick; i >= 0; i--) {
      const c = pool[i];
      const pg = regionPolygon(c.m, c.g, jogOf(c.m));
      if (!pg) continue;
      const eg = classifyEdges(pg, base, c.m);
      const widest = eg.reduce((mx, e) => (e.open
        ? Math.max(mx, Math.hypot(e.x2 - e.x1, e.y2 - e.y1) / c.m.S * (state.mmPerPx || 0)) : mx), 0);
      used = c.r; reg = c.g; mask = c.m; poly = pg; edges = eg;
      if (!state.mmPerPx || widest <= MAX_SEAL_MM || i === 0) break;
    }
    if (reg) state.cleanInfo = { openR: state.baseInfo.openR, closeR: used, thr: state.baseInfo.thr };
  }
  // 깔끔히 닫힌 것을 못 찾았으면 **근사치라도 내놓는다.**
  //
  // 이 도구는 상담 중 "대략 들어가느냐"를 보는 용도다. 아무것도 못 내놓고 오류만 띄우는 것이
  // 제일 나쁘다 — 사용자는 이미 "더 넓게/더 좁게" 손잡이를 갖고 있으니 출발점만 주면 된다.
  // 실제 분양 도면에는 마감재 범례나 "공간옵션" 별도 도면이 한 장에 같이 실려 있어
  // 경계가 깔끔히 닫히지 않는 경우가 흔하다.
  let approx = false;
  if ((!reg || !poly) && !base.dark[sy*base.w + sx]) {
    // ① 새어 나갔지만 방 크기라 할 만한 것이 있으면 그것을 쓴다
    if (fallback) {
      const jog = state.mmPerPx
        ? Math.max(3, Math.round((300 / state.mmPerPx) * fallback.m.S))
        : Math.max(4, Math.round(Math.max(fallback.m.w, fallback.m.h) * 0.012));
      const pg = regionPolygon(fallback.m, fallback.g, jog);
      if (pg) {
        used = fallback.r; reg = fallback.g; mask = fallback.m; poly = pg;
        edges = classifyEdges(pg, base, fallback.m);
        approx = true;
      }
    }
    // ② 그것도 없으면 **누른 자리에서 사방으로 벽까지 재어 사각형**을 만든다.
    //    범위는 대충이지만 방 크기는 맞아, 가전이 들어가는지 보는 데는 충분하다.
    //    아무것도 못 내놓는 것보다 낫다 — 사용자가 넓게/좁게로 다듬을 수 있다.
    if (!poly) {
      const W = base.w, H = base.h, D = base.dark;
      const ray = (dx, dy) => {
        let x = sx, y = sy, n = 0;
        const lim = Math.max(W, H);
        while (n < lim) {
          const nx = x + dx, ny = y + dy;
          if (nx < bb.x0 || ny < bb.y0 || nx > bb.x1 || ny > bb.y1) break;
          if (D[ny * W + nx]) break;
          x = nx; y = ny; n++;
        }
        return n;
      };
      const l = ray(-1, 0), r2 = ray(1, 0), u = ray(0, -1), d2 = ray(0, 1);
      if (l + r2 > 2 && u + d2 > 2) {
        poly = [[sx - l, sy - u], [sx + r2, sy - u], [sx + r2, sy + d2], [sx - l, sy + d2]];
        mask = sealedMask(0); reg = null; used = 0;
        edges = classifyEdges(poly, base, mask);
        approx = true;
      }
    }
    if (poly) state.cleanInfo = { openR: state.baseInfo.openR, closeR: used, thr: state.baseInfo.thr };
  }

  if (!reg || !poly) {
    if (base.dark[sy*base.w + sx]) return { error: '누른 자리가 벽 위입니다. 방 안쪽의 빈 곳을 눌러주세요.' };
    if (tooBig) return { error: '벽이 끊겨 여러 방이 하나로 이어졌습니다. 방 사이가 뚫려 있으면 자동으로 가를 수 없습니다 — 벽 그리기로 직접 그려주세요.' };
    if (cands.length) return { error: '방 모양을 잡지 못했습니다. 벽 그리기로 직접 그려주세요.' };
    return { error: '이 방은 문·창이 넓게 열려 있어 경계를 닫지 못했습니다. 다른 방을 누르거나 벽 그리기로 직접 그려주세요.' };
  }

  // 사용자가 조절할 수 있도록 인접 단계와 몇 번째 단계인지도 알려준다.
  //
  // 사다리의 바로 옆 칸을 주면 안 된다 — 촘촘해진 사다리에서는 옆 칸이 같은 넓이를 내서
  // "더 좁게"를 눌러도 아무 일도 일어나지 않는다. **넓이가 실제로 달라지는 가장 가까운
  // 반경**을 찾아 준다. 계산은 이미 후보(pool)에 들어 있으므로 추가 비용이 없다.
  const all = cleanRadii(base).closeSteps;
  const at = all.indexOf(used);
  const cur = pool.find((c) => c.r === used);
  const seat = pool.indexOf(cur);
  let widerR = null, narrowR = null;
  if (seat >= 0) {
    const cnt = cur.g.count;
    for (let i = seat - 1; i >= 0; i--) if (pool[i].g.count > cnt * 1.05) { widerR = pool[i].r; break; }
    for (let i = seat + 1; i < pool.length; i++) if (pool[i].g.count < cnt * 0.95) { narrowR = pool[i].r; break; }
  }
  return {
    poly: poly.map(([x, y]) => [x / mask.S, y / mask.S]),
    edges: edges.map((e) => ({ ...e, x1:e.x1/mask.S, y1:e.y1/mask.S, x2:e.x2/mask.S, y2:e.y2/mask.S })),
    closeR: used, reg, mask,
    wider: widerR,     // 덜 막는다 = 더 넓게
    narrow: narrowR,   // 더 막는다 = 더 좁게
    step: at + 1, steps: all.length,
    approx,            // 경계가 깔끔히 닫히지 않아 근사로 잡은 것 — 화면에 그렇게 알린다
  };
}

/**
 * 인식한 다각형(도면 픽셀)을 방으로 확정한다.
 * opts.name    — 새 방 이름
 * opts.appendTo — 기존 방 id. 주면 그 방의 **조각으로 이어 붙인다**
 *   (자동 인식이 방을 절반만 잡는 경우가 있어 나머지를 더할 수 있어야 한다)
 */
function applyDetected(polyImg, edges, opts){
  const o = opts || {};
  const k = state.mmPerPx || 1;                 // 축척이 없으면 나중에 벽 길이로 환산한다
  let segs;
  if (edges && edges.length) {
    // 벽/개구부 구분을 그대로 살린다. 경계로는 둘 다 쓰되 개구부는 문·창으로 표시한다.
    segs = edges.map((e) => ({ x1:e.x1*k, y1:e.y1*k, x2:e.x2*k, y2:e.y2*k, open:!!e.open }));
  } else {
    const pts = polyImg.map(([x, y]) => [x * k, y * k]);
    segs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      segs.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] });
    }
  }
  /*
   * **축척 전에도 등록할 수 있어야 한다**(2026-08-15 개편).
   *
   * 예전에는 축척이 없으면 무조건 여기서 빠져나가 길이부터 물었다. 그래서 축척이
   * 색인에 없는 도면(전체의 92%)에서는 **방 하나만 잡히고 끝났다** — 사용자 지적:
   * *"전체면적이 선택되어야하는데 아직도 방하나만 선택이됩니다"*.
   *
   * 뿌리는 순서였다. **축척은 방이 아니라 이미지 하나의 성질**인데 코드가 "어느 방의
   * 어느 벽이냐"를 먼저 정하려 했고, 그래서 집 전체를 보여주는 일이 축척 뒤로 밀렸다.
   * 지금은 뒤집는다 — `raw` 로 부르면 **이미지 픽셀 좌표 그대로 등록**하고(월드 단위가
   * 곧 이미지 px 다), 집 전체를 먼저 보여준 뒤 축척을 한 번만 묻는다.
   */
  if (!state.scaled && !o.raw) { state.walls = []; askWallLength(segs, o); return; }
  const room = o.appendTo ? roomById(o.appendTo) : null;
  if (room) { room.parts.push({ walls: segs }); state.roomSel = room.id; syncWalls(); }
  else {
    /*
     * **이미 잡은 공간과 겹치면 새로 만들지 않는다**(2026-08-12 사용자 지적:
     * *"방 선택 시 중복되는 방은 자동으로 합쳐줘야 할 것 같습니다. 중복된 경계선이
     * 벽으로 인식이 됩니다"*).
     *
     * `state.walls` 는 모든 방의 경계를 그냥 합친 것이라(syncWalls), 같은 자리를 두 번
     * 잡으면 **그 경계가 벽으로 두 겹** 남는다. 화면에서 두껍게 보이는 데 그치지 않고
     * 벽 스냅·방 밖 판정이 있지도 않은 벽을 기준으로 돌게 된다.
     *
     * 판정은 detectAllRooms 와 같은 `sameSpace` 를 쓴다(겹침 70% + 넓이 0.6배).
     * 같은 공간이면 **넓은 쪽을 남긴다** — 좁게 잡힌 것을 넓게 다시 잡는 것이
     * 사용자가 다시 누르는 이유이기 때문이다. 이름은 원래 것을 지킨다.
     */
    const mine = loopOfWalls(segs);
    let merged = null;
    if (mine) {
      for (const r of state.rooms){
        for (const part of r.parts){
          const cur = loopOfWalls(part.walls);
          if (!cur || !sameSpace(mine, cur)) continue;
          if (Math.abs(polyAreaPx(mine)) > Math.abs(polyAreaPx(cur))) part.walls = segs;
          merged = r;
          break;
        }
        if (merged) break;
      }
    }
    if (merged){
      state.roomSel = merged.id; syncWalls();
      toast(`${merged.name} 과 같은 자리라 하나로 합쳤습니다`);
    } else addRoom(o.name || nextRoomName(), segs);
  }
  state.showClean = false;
  // 방을 더 잡을 수 있게 인식 모드를 유지한다 — 한 세대에는 방이 여럿이다
  setMode('detect'); setStep(4); evaluate(); draw();
  toast(`${(roomById(state.roomSel)||{}).name || '공간'} 확정 — 다른 방을 이어서 누르거나 '가전 선택'으로 넘어가세요`);
}

function startDetect(){
  if (!state.img){
    sheet(`<h2>도면을 먼저 올려주세요</h2>
      <p class="hint">벽 자동 인식은 도면 이미지에서 방을 찾아냅니다. 도면이 없으면
        <b>벽 그리기</b>로 방 크기를 직접 입력하시면 됩니다.</p>
      <div class="modal-actions"><button id="c">벽 그리기</button><button class="primary" id="ok">도면 올리기</button></div>`,
      ()=>{ $('#ok').onclick=()=>{closeSheet(); $('#btn-img').click();};
            $('#c').onclick =()=>{closeSheet(); $('#btn-wall').click();}; });
    return;
  }
  state.draft = null; state.draftMore = []; hideDraftBar(); ensureClean();
  /*
   * **도면 전체를 한 번에 잡는다**(2026-08-11 사용자 요청).
   * 예전에는 방을 하나씩 눌러 잡아야 했고, 그러면 잡은 방 안에만 가전을 놓을 수 있었다.
   * 그런데 상담에 오는 고객은 **어디에 놓을지 정해 두고 오지 않는다** — 집 전체를 보고
   * 고른다. 그래서 누르는 순간 온 집을 잡고, 3D 도 집 전체가 선다.
   * 잘못 잡힌 곳은 그대로 눌러 고칠 수 있게 detect 모드는 유지한다.
   */
  const made = detectAllRooms();
  setMode('detect'); setStep(made ? 4 : 3); draw();
  if (made) toast(`도면 전체에서 공간 ${made}곳을 잡았습니다 — 빠진 곳은 눌러서 더하세요`);
  else toast('자동으로 잡지 못했습니다 — 방 안쪽을 눌러 주세요');
}

/**
 * 도면 전체를 훑어 방을 **전부** 등록한다.
 *
 * `autoDetectCenter` 가 쓰는 격자 탐침을 그대로 쓰되, 하나만 고르는 대신 살아남은 것을
 * 모두 공간으로 만든다. 같은 방을 여러 번 찔러도 같은 다각형이 나오므로 넓이·중심으로
 * 중복을 걷어낸다(그쪽과 같은 기준).
 *
 * 격자를 6×6 으로 둔 이유 — 4×4 로는 욕실·현관처럼 작은 방이 통째로 빠진다.
 * 탐침은 `sealedMask` 캐시 덕에 두 번째부터 싸다.
 *
 * 너무 작은 조각은 뺀다. 축척 기준을 고를 때(3%)보다 기준을 낮춘 것은 여기서는
 * **욕실·현관도 잡아야** 하기 때문이고, 그래도 창틀 틈 같은 것은 걸러야 한다.
 */
function detectAllRooms(opts){
  const dopt = opts || {};   // { raw:true } 면 축척 전에도 그대로 등록한다
  if (!state.img) return 0;
  const base = ensureClean();
  const W = state.imgW, H = state.imgH;
  /*
   * **기준은 시트가 아니라 건물이다**(2026-08-12 실측으로 고침).
   *
   * 분양 시트에는 위에 면적표·타입명, 아래에 안내문이 붙는다. 홍천 84B 는 이미지가
   * 1032×1200 인데 **건물은 788×605(넓이의 39%)** 다. 그런데 방 크기 문턱을 시트 전체의
   * 1.2% 로 잡고 있어 실제 욕실·현관(5,775~9,994px²)이 문턱(14,861px²) 아래로 떨어졌다 —
   * 공간이 4곳에서 멈춘 원인이다(사용자 시연에서 주방·욕실·현관·발코니가 빠졌다).
   * 찌르는 지점도 시트 전체에 뿌려 **36곳 중 11곳만** 방에 들어갔다.
   *
   * `structureBox` 가 이미 건물 범위를 알고 있다(치수선 마커·글씨를 뺀 가장 큰 덩어리).
   * 그 안에만 찌르고, 크기 문턱도 그 넓이를 기준으로 잡는다.
   * 건물 범위를 못 구하면 예전처럼 시트 전체로 물러선다.
   *
   * **단, bbox 는 마스크 좌표다 — 이미지 좌표로 되돌려야 한다**(2026-08-12 실측으로 고침).
   * `structureBox(m, mask.w, mask.h)` 가 만든 값이라 `mask.S` 만큼 줄어 있는데,
   * `detectRoomAt(x, y)` 는 **이미지 좌표**를 받아 안에서 다시 `× S` 를 한다.
   * 배포된 도면은 전부 긴변 1,200px 이하라 `S = 1` 이어서 두 좌표계가 우연히 같았고,
   * 그래서 **버그가 라이브러리에서는 한 번도 드러나지 않았다.**
   *
   * 사용자가 **원본 해상도로 도면을 올리면** S 가 0.4~0.5 로 떨어지고, 그러면 탐침 64개가
   * 전부 도면 **좌상단 40% 안**으로 뭉친다 — 오른쪽·아래 방은 한 번도 찔러 보지 않는다.
   * 실측(도면 14장을 2.5배로 올려 재현): 덮는 비율 중앙값 **78% → 5%**, 공간을 한 곳도
   * 못 잡은 도면 3장. 사용자가 말한 *"부분선택이 되면 3D 정확도가 떨어진다"* 가 이것이다.
   * 크기 문턱(`planA`·`minShort`)도 마스크 px 를 이미지 px 와 견주고 있어 함께 어긋났다.
   */
  const S = base.S || 1;
  const bx = ((state.baseInfo || {}).bbox) || null;
  const bw = bx ? Math.max(1, (bx.x1 - bx.x0) / S) : W;
  const bh = bx ? Math.max(1, (bx.y1 - bx.y0) / S) : H;
  const bx0 = bx ? bx.x0 / S : 0, by0 = bx ? bx.y0 / S : 0;
  /* 건물 안만 보게 되니 같은 촘촘함으로도 방에 훨씬 자주 들어간다 — 8×8 로 올린다.
     마스크가 반경별로 캐시돼 있어 탐침을 늘려도 비용이 선형으로 늘지 않는다. */
  const N = 8;
  const found = [];
  /**
   * 한 점을 찔러 후보로 담는다(이미 같은 것을 담았으면 건너뛴다). 담았으면 true
   *
   * `strict` 는 **빈틈 되짚기에서만** 켠다 — 경계를 못 닫아 근사로 잡은 것을 받지 않는다.
   * 첫 격자에서 근사를 받는 이유는 "아무것도 못 내놓는 것이 제일 나쁘다"이지만, 되짚기는
   * 이미 공간을 여럿 잡아 둔 뒤라 사정이 반대다. 새어 나간 영역은 벽 밖 흰 여백까지
   * 삼켜 **이미 잡은 공간과 겹쳐 등록되고**, 그러면 3D 에서 벽이 두 겹으로 선다
   * (실측: 성남 T2 가 공간 합계 108% — 전용면적보다 넓어졌다).
   * 빈틈으로 남겨 두는 편이 없는 벽을 세우는 것보다 낫다.
   */
  const probe = (x, y, strict) => {
    let r; try { r = detectRoomAt(x, y); } catch (_) { return false; }
    if (!r || r.error || !r.poly) return false;
    if (strict && r.approx) return false;
    const a = polyAreaPx(r.poly);
    if (a <= 0) return false;
    const xs = r.poly.map((q)=>q[0]), ys = r.poly.map((q)=>q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const cx = (x0+x1)/2, cy = (y0+y1)/2, w = x1-x0, h = y1-y0;
    if (found.some((c)=> Math.abs(c.cx-cx) < 20 && Math.abs(c.cy-cy) < 20
      && Math.abs(c.a-a) < Math.max(c.a, a) * 0.08)) return false;
    found.push({ a, cx, cy, w, h, at:[x, y], closeR:r.closeR, poly:r.poly, edges:r.edges });
    return true;
  };
  for (let iy = 1; iy <= N; iy++) for (let ix = 1; ix <= N; ix++)
    probe(bx0 + bw * ix / (N + 1), by0 + bh * iy / (N + 1));

  const planA = bw * bh;                       // 시트가 아니라 **건물** 넓이
  const minShort = Math.min(bw, bh) * 0.05;
  /*
   * 걸러내기를 **함수로 둔다** — 빈틈을 되짚어 후보를 더 담은 뒤 처음부터 다시 걸러야 하기
   * 때문이다. 아래 45% 규칙과 겹침 규칙은 "잡힌 것 전부"를 놓고 보는 것이라, 후보가 늘면
   * 판정이 달라진다(실제로 달라져야 맞다). 라운드마다 새로 계산한다.
   */
  const refine = () => {
  const keep = found
    .filter((c)=> c.a >= planA * 0.012 && Math.min(c.w, c.h) >= minShort)
    .sort((u,v)=> v.a - u.a);
  /*
   * **여러 방이 한 덩어리로 잡힌 것은 버린다.**
   * 문이 다 열린 채 그려진 도면에서는 닫기 반경이 모자라 온 집(때로는 도면 여백까지)이
   * 한 영역으로 잡힌다. 그걸 '거실'로 등록하면 "거실 169.6㎡"가 된다 — 전용 85.5㎡ 세대에서.
   *
   * 넓이 비율(예: 도면의 50%)로 거르려 했더니 도면마다 여백이 달라 흔들렸다(실측 43%로 통과).
   * **더 확실한 단서는 포함 관계다** — 새어 나간 영역은 다른 방들을 품고 있다.
   * 어떤 후보가 다른 후보 2곳 이상의 중심을 담으면 그건 방이 아니라 합쳐진 덩어리다.
   *
   * **경계상자로 보면 안 된다.** 처음에 상자로 쟀더니 ㄱ자 거실의 상자가 옆 침실 중심을
   * 품어 **진짜 거실(31㎡)까지 버렸다.** 다각형 자체로 재야 한다 — ㄱ자 거실의 실제 영역은
   * 옆방 중심을 담지 않는다.
   */
  let trimmed = keep.filter((c) => {
    const inside = keep.filter((o) => o !== c && o.a < c.a * 0.9
      && inLoop(c.poly, o.cx, o.cy)).length;
    return inside < 2;
  });

  /*
   * **포함 관계만으로는 부족하다.** 합쳐진 영역의 다각형은 속 방들의 벽을 피해 구불구불
   * 감싸므로 그 방들의 중심이 기하학적으로는 바깥에 있다 — 그래서 "품고 있다"로 안 걸린다.
   * 더 확실한 단서는 **전체 대비 비율**이다: 합쳐진 것은 잡힌 것 전부를 합한 넓이의
   * 절반 가까이를 혼자 차지한다. 문턱은 **45%** 다 — 실측으로 디에트르 84 의 덩어리가 49%,
   * 대방 86A 의 정상적인 거실+주방 트인 공간이 42% 였다. 40% 로 잡았더니 그 거실까지
   * 쪼개져 31.0 → 27.7㎡ 가 됐다(한국 아파트의 트인 거실은 원래 이만큼을 차지한다).
   *
   * 그런 후보는 버리지 않고 **닫기 반경을 키워 다시 잡아 본다.** 반경을 키우면 문이 막히며
   * 옆방이 떨어져 나가 면적이 준다 — 화면의 "◂ 더 좁게"가 하는 일을 자동으로 하는 것이다.
   * 끝내 안 줄면 그때 버린다(합쳐진 것을 '거실'로 등록하면 상담에서 그대로 읽힌다).
   */
  const total = () => trimmed.reduce((s, c) => s + c.a, 0);
  const steps = (cleanRadii(ensureBase()).closeSteps || []).slice().sort((a, b) => a - b);
  for (let i = 0; i < trimmed.length; i++){
    const c = trimmed[i];
    if (trimmed.length < 2 || c.a <= total() * 0.45) continue;
    let fixed = null;
    for (const r of steps){
      if (r <= (c.closeR || 0)) continue;                 // 지금보다 큰 반경만 의미가 있다
      let t; try { t = detectRoomAt(c.at[0], c.at[1], r); } catch (_) { continue; }
      if (!t || t.error || !t.poly) continue;
      const a = polyAreaPx(t.poly);
      if (a <= 0 || a < planA * 0.012) continue;          // 너무 잘게 쪼개진 것은 방이 아니다
      if (a <= total() * 0.45){ fixed = { ...c, a, poly: t.poly, edges: t.edges, closeR: r }; break; }
    }
    if (fixed) trimmed[i] = fixed;
    else { trimmed.splice(i, 1); i--; }
  }

  /*
   * **같은 공간을 두 번 등록하지 않는다.**
   *
   * 위 중복 걷어내기는 "중심이 20px 안 + 넓이가 8% 안"일 때만 같은 것으로 본다. 그런데
   * 트인 거실·주방을 서로 다른 닫기 반경으로 찌르면 다각형이 제법 달라져 그 검사를 빠져나간다.
   * 실제로 디에트르 84 에서 **거실 35.2㎡ 와 주방 30.3㎡ 가 87% 겹친 채** 둘 다 등록됐고,
   * 공간 7곳의 합이 104.7㎡ — 전용 84㎡ 의 125% 가 됐다. 화면은 "공간 7곳"이라 말하고
   * 가전은 둘 중 어느 방 소속인지가 찌른 순서로 정해진다.
   *
   * 그래서 **넓이 겹침을 실제로 잰다.** 작은 쪽의 70% 이상이 큰 쪽 안에 들어 있으면 같은
   * 공간이고, **큰 쪽을 남긴다** — 한국 아파트의 거실·주방은 원래 트여 있어 한 공간으로
   * 보는 편이 상담과 맞는다(45% 규칙 주석의 "트인 거실은 원래 이만큼을 차지한다"와 같은 판단).
   *
   * **겹침만 보면 안 된다 — 넓이 비를 함께 본다.** 겹침만으로 지웠더니 합성 84타입에서
   * 트인 거실(31㎡) 안에 든 **진짜 주방(16.8㎡)이 지워졌다.** 같은 공간을 두 번 잡은 것은
   * 다각형뿐 아니라 **넓이도 비슷하고**(35.2 ↔ 30.3, 0.86배), 큰 공간 안의 작은 방은
   * 훨씬 작다(31 ↔ 16.8, 0.54배). 그래서 **0.6배 이상**일 때만 같은 것으로 본다.
   *
   * **45% 규칙이 다 끝난 뒤에 한다.** 먼저 지우면 합계가 줄어 멀쩡한 트인 거실이 45% 를
   * 넘게 되고, 그 규칙이 거실을 쪼개러 들어간다 — 고쳐야 할 곳은 여기지 저기가 아니다.
   */
  return trimmed.filter((c, i) =>
    !trimmed.some((o, j) => j !== i && (o.a > c.a || (o.a === c.a && j < i))
      && c.a > o.a * 0.6 && coverFrac(c.poly, o.poly) > 0.7));
  };

  /*
   * **격자가 못 찌른 자리를 되짚는다**(2026-08-12 신설).
   *
   * 8×8 격자는 도면을 골고루 훑지만 **어디를 놓쳤는지는 모른다.** 격자점이 하필 벽 위나
   * 가구 위에 떨어지면 그 방은 한 번도 안 찔러 보고 끝나고, 45% 규칙이 덩어리를 버리면
   * 그 자리가 통째로 비는데 아무도 다시 보지 않는다. 화면에서는 *"어떤 방은 잡히고 어떤
   * 방은 안 잡힌다"* 로 보인다 — 사용자가 말한 **부분선택**이다.
   *
   * 그래서 **결과를 놓고 빈 곳을 찾아 거기를 찌른다.** 건물 안쪽에서 아직 어느 공간에도
   * 안 든 곳을 덩어리로 묶고, 방이라 할 만한 크기의 덩어리마다 **가장 깊은 점**(벽에서
   * 가장 먼 자리)을 찔러 본다. 새 후보가 나오면 걸러내기를 처음부터 다시 돌린다 —
   * 45% 규칙과 겹침 규칙은 "잡힌 것 전부"를 놓고 보는 것이라 후보가 늘면 판정도 달라져야 한다.
   *
   * 라운드를 **3번**으로 묶는다. 한 라운드가 새 공간을 못 만들면 거기서 멈춘다.
   * (탐침 자체는 `sealedMask` 캐시를 타서 싸다 — 비싼 것은 마스크를 만드는 첫 회뿐이다.)
   */
  let uniq = refine();
  for (let round = 0; round < 3; round++){
    const pts = gapProbes(base, uniq.map((c) => c.poly), bx0, by0, bw, bh, planA * 0.012, minShort);
    if (!pts.length) break;
    let added = false;
    for (const [x, y] of pts) if (probe(x, y, true)) added = true;
    if (!added) break;
    const next = refine();
    // 되짚었는데 공간이 늘지 않았으면 더 볼 것이 없다(같은 자리를 계속 찌르지 않는다)
    if (next.length <= uniq.length) { uniq = next.length >= uniq.length ? next : uniq; break; }
    uniq = next;
  }

  /*
   * **이미 잡아 둔 공간은 다시 등록하지 않는다.**
   * 축척을 맞추는 단계에서 방 하나가 먼저 등록되고(그 방의 가로 벽으로 축척을 냈다),
   * 곧바로 여기가 도면 전체를 잡는다. 그 방을 또 넣으면 같은 공간이 이름만 다르게 둘이 된다.
   * 등록된 벽은 mm 좌표이고 여기 후보는 이미지 픽셀이라 **축척을 곱해 같은 자로 맞춰** 비교한다.
   */
  const k = state.mmPerPx || 1;
  const known = state.rooms.flatMap((r) => r.parts.map((p) => loopOfWalls(p.walls)).filter(Boolean));
  const fresh = known.length
    ? uniq.filter((c) => !known.some((e) => sameSpace(c.poly.map(([x, y]) => [x * k, y * k]), e)))
    : uniq;

  for (const c of fresh) applyDetected(c.poly, c.edges, { name: nextRoomName(), raw: dopt.raw });
  return fresh.length;
}

/**
 * **아직 아무 공간에도 안 든 자리**를 찾아 찌를 점을 돌려준다.
 *
 * 건물 안쪽(env 가 있으면 그것, 없으면 건물 경계상자)에서 벽이 아니고 어느 다각형에도
 * 안 든 칸을 모아 덩어리로 묶는다. 방이라 할 만한 크기의 덩어리마다 **가장 깊은 점**을 낸다.
 *
 * **중심(무게중심)을 쓰면 안 된다.** ㄱ자·ㄷ자 공간의 중심은 그 공간 **바깥**이고,
 * 거기를 찌르면 벽 위이거나 옆방이 잡힌다. 그래서 덩어리 가장자리에서 안쪽으로 BFS 를 돌려
 * **벽에서 가장 먼 칸**을 고른다 — 그 점은 반드시 그 공간 안이고, 문틈에서도 멀다.
 *
 * 칸 크기는 짧은변 문턱의 절반이다. 더 잘게 나눠도 얻는 것이 없고(그만한 빈틈은 방이 아니다)
 * 격자만 커진다.
 */
function gapProbes(base, polys, bx0, by0, bw, bh, minA, minShort){
  const S = base.S || 1;
  const cs = Math.max(3, minShort / 2);
  const GW = Math.min(220, Math.max(2, Math.round(bw / cs)));
  const GH = Math.min(220, Math.max(2, Math.round(bh / cs)));
  const cw = bw / GW, ch = bh / GH;
  const bb = base.bbox;
  const gap = new Uint8Array(GW * GH);
  const ptOf = (gx, gy) => [bx0 + (gx + 0.5) * cw, by0 + (gy + 0.5) * ch];
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++){
    const [x, y] = ptOf(gx, gy);
    const mx = Math.round(x * S), my = Math.round(y * S);
    if (mx < 0 || my < 0 || mx >= base.w || my >= base.h) continue;
    const p = my * base.w + mx;
    const inside = base.env ? !!base.env[p]
      : (mx >= bb.x0 && mx <= bb.x1 && my >= bb.y0 && my <= bb.y1);
    if (!inside || base.dark[p]) continue;                  // 건물 밖이거나 벽
    if (polys.some((pg) => inLoop(pg, x, y))) continue;     // 이미 어느 공간에 들었다
    gap[gy * GW + gx] = 1;
  }
  // 빈틈을 덩어리로 묶고, 방이라 할 만한 크기만 남긴다
  const cellA = cw * ch;
  const seen = new Uint8Array(GW * GH);
  const blobs = [];
  for (let i = 0; i < gap.length; i++){
    if (!gap[i] || seen[i]) continue;
    const cells = [i]; seen[i] = 1;
    for (let q = 0; q < cells.length; q++){
      const c = cells[q], cx = c % GW, cy = (c - cx) / GW;
      if (cx > 0)      { const n = c - 1;  if (gap[n] && !seen[n]) { seen[n] = 1; cells.push(n); } }
      if (cx < GW - 1) { const n = c + 1;  if (gap[n] && !seen[n]) { seen[n] = 1; cells.push(n); } }
      if (cy > 0)      { const n = c - GW; if (gap[n] && !seen[n]) { seen[n] = 1; cells.push(n); } }
      if (cy < GH - 1) { const n = c + GW; if (gap[n] && !seen[n]) { seen[n] = 1; cells.push(n); } }
    }
    if (cells.length * cellA >= minA) blobs.push(cells);
  }
  blobs.sort((a, b) => b.length - a.length);
  // 덩어리마다 가장 깊은 칸 — 가장자리에서 안쪽으로 BFS
  const out = [];
  for (const cells of blobs.slice(0, 6)){
    const mine = new Set(cells);
    const dist = new Map();
    const q = [];
    for (const c of cells){
      const cx = c % GW, cy = (c - cx) / GW;
      const edge = cx === 0 || cy === 0 || cx === GW - 1 || cy === GH - 1
        || !mine.has(c - 1) || !mine.has(c + 1) || !mine.has(c - GW) || !mine.has(c + GW);
      if (edge) { dist.set(c, 0); q.push(c); }
    }
    if (!q.length) { dist.set(cells[0], 0); q.push(cells[0]); }
    let best = q[0], bestD = 0;
    for (let i = 0; i < q.length; i++){
      const c = q[i], d = dist.get(c);
      if (d > bestD) { bestD = d; best = c; }
      const cx = c % GW, cy = (c - cx) / GW;
      for (const n of [cx > 0 ? c - 1 : -1, cx < GW - 1 ? c + 1 : -1,
                       cy > 0 ? c - GW : -1, cy < GH - 1 ? c + GW : -1]){
        if (n < 0 || !mine.has(n) || dist.has(n)) continue;
        dist.set(n, d + 1); q.push(n);
      }
    }
    const gx = best % GW, gy = (best - gx) / GW;
    out.push(ptOf(gx, gy));
  }
  return out;
}

/** 다각형 A 의 몇 할이 B 안에 드는가 (점 찍어 어림한다 — 정확한 교집합 넓이는 필요 없다) */
function coverFrac(inner, outer){
  const xs = inner.map((p) => p[0]), ys = inner.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let n = 0, both = 0;
  for (let i = 0; i < 30; i++) for (let j = 0; j < 30; j++){
    const x = x0 + (x1 - x0) * (i + 0.5) / 30, y = y0 + (y1 - y0) * (j + 0.5) / 30;
    if (!inLoop(inner, x, y)) continue;
    n++;
    if (inLoop(outer, x, y)) both++;
  }
  return n ? both / n : 0;
}

/**
 * 두 다각형이 **같은 공간**인가.
 *
 * 겹침만 보면 안 된다 — 트인 거실(31㎡) 안에는 진짜 주방(16.8㎡)이 들어 있어서
 * 겹침만으로 지우면 그 주방이 사라진다. 같은 공간을 두 번 잡은 것은 **넓이도 비슷하고**
 * (실측 0.86배), 큰 공간 안의 작은 방은 훨씬 작다(0.54배). 그래서 넓이 비를 함께 본다.
 */
function sameSpace(a, b){
  const A = Math.abs(polyAreaPx(a)), B = Math.abs(polyAreaPx(b));
  if (!A || !B) return false;
  if (Math.min(A, B) / Math.max(A, B) <= 0.6) return false;
  return coverFrac(a, b) > 0.7 || coverFrac(b, a) > 0.7;
}

/** 도면을 올리고 축척을 맞춘 직후, 가운데를 눌러본 셈 치고 한 번 자동으로 시도한다 */
/** 이미지 픽셀 좌표 다각형의 넓이 (px²) — 어느 방이 더 넓은지 견주는 데만 쓴다 */
function polyAreaPx(poly){
  if (!poly || poly.length < 3) return 0;
  let a = 0;
  for (let i = 0; i < poly.length; i++){
    const [x1,y1] = poly[i], [x2,y2] = poly[(i+1) % poly.length];
    a += x1*y2 - x2*y1;
  }
  return Math.abs(a) / 2;
}

/*
 * 도면을 올린 직후 **가장 넓은 방**을 찾아 초안으로 내놓는다.
 *
 * 예전에는 이미지 한가운데 한 점만 찔러 봤다. 그런데 도면 가운데가 늘 거실인 것은 아니라,
 * **주방이 잡히면 뒤이어 묻는 "가장 긴 벽"도 주방 벽이 된다**(사용자 지적).
 * 축척이 그 한 값에서 나오므로 방을 잘못 잡으면 도면 전체 치수가 어긋난다.
 *
 * 여러 곳을 찔러 보고 가장 넓은 것을 고른다 — 세대에서 가장 넓은 방은 거의 언제나 거실이다.
 * `ensureBase()`·`sealedMask(r)` 가 반경별로 캐시되므로 두 번째 탐침부터는 훨씬 싸다.
 * 그래도 자동은 초안이다. 틀리면 도면 위 막대의 "다시 누르기"로 사용자가 직접 찍으면 된다.
 */
/*
 * **집 전체를 먼저 잡고, 축척은 한 번만 묻는다** (2026-08-15 사용자 요청:
 * *"집전체를 자동으로인식하고 사용자는 그중에 하나의 벽면을 선택해서(여러 후보지 생성)
 * 치수를 입력하게해주세요"*).
 *
 * 예전 순서는 [방 하나 인식 → 그 방 벽 길이 → (축척 있으면) 나머지] 였다. 축척이
 * 색인에 있는 도면은 8% 뿐이라 **흔한 경로에서 늘 방 하나만 섰다.**
 *
 * 축척이 없어도 인식은 돈다 — mm 문턱은 이미지 긴변 비율로 물러서게 돼 있다.
 * 그래서 이미지 픽셀 좌표로 **집 전체를 먼저 세워 보여주고**, 사용자가 아는 벽을
 * 골라 길이를 넣으면 그때 mm 로 **다시** 잡는다(문턱이 mm 기준이라 결과가 달라진다 —
 * 좌표를 환산하는 것보다 다시 잡는 편이 정확하고 단순하다).
 */
function detectHouseThenScale(){
  if (state.scaled && state.rooms.length) return;    // 이미 다 돼 있으면 할 일이 없다
  let n = 0;
  try { n = detectAllRooms({ raw: true }) || 0; } catch (_) { n = 0; }
  if (!n) {
    /* 전체 인식이 아무것도 못 내놓으면 예전 경로로 물러선다 — 방 하나라도 있어야 한다 */
    autoDetectCenter();
    return;
  }
  try { nameRoomsFromPlan(); } catch (_) {}
  setStep(3);
  fitAll(); draw();
  askHouseScale();
}

/*
 * 잡아 둔 **집 전체의 벽**에서 후보를 모아 길이를 묻는다.
 * 후보가 방 하나에 갇히지 않으므로 사용자는 **자기가 아는 벽**(현관 폭이든 거실 가로든)을
 * 고를 수 있다. 화면·조작은 기존 `askWallLength` 막대를 그대로 쓴다 — 검증된 UI 다.
 */
function askHouseScale(){
  const segs = [];
  for (const r of state.rooms) for (const part of r.parts) for (const w of part.walls) segs.push({ ...w });
  if (!segs.length) { autoDetectCenter(); return; }
  /*
   * **긴 벽부터 내민다.** 후보를 집 전체에서 모으면 현관·욕실 같은 짧은 벽이 앞에 설 수
   * 있는데, 짧은 벽으로 축척을 재면 같은 픽셀 오차가 훨씬 크게 증폭된다(1m 벽에서 5px 는
   * 3.6m 벽에서 5px 보다 3.6배 아프다). 상담사가 아는 벽이 따로 있으면 `다음 ▸` 이나
   * `벽 직접 고르기`로 넘어가면 된다 — 기본값만 안전한 쪽으로 둔다.
   */
  askWallLength(segs, { house: true, sortByLen: true });
}

function autoDetectCenter(){
  /*
   * **물어볼 것이 없으면 묻지 않는다**(2026-08-14).
   *
   * 단지에서 부른 도면은 축척이 색인에 있고, 불러오는 자리에서 `detectAllRooms` 로
   * 공간까지 전부 잡아 둔다. 그런데 `useImage` 는 콜백(`after`)을 부른 **뒤에** 이
   * 함수를 부르므로, 그쪽에서 막대를 닫아도 여기서 다시 열렸다 — 화면에는
   * "이 공간 확정 / 다른 방 ▸" 막대가 남아 **할 일이 없는데 할 일이 있는 것처럼**
   * 보이고 도면의 절반을 가렸다(프로덕션 시연에서 확인).
   *
   * 축척이 확정돼 있고 공간도 이미 잡혀 있으면 이 함수가 할 일이 남아 있지 않다.
   */
  if (state.scaled && state.rooms.length) return;
  ensureClean();
  const W = state.imgW, H = state.imgH;
  const probes = [];
  for (let iy = 1; iy <= 4; iy++) for (let ix = 1; ix <= 4; ix++) probes.push([W*ix/5, H*iy/5]);
  /*
   * 같은 방을 여러 번 찔러도 같은 다각형이 나오므로 **넓이·중심으로 중복을 걷어낸다.**
   * 남은 것을 넓은 순으로 세워 두면 보통 [거실(+주방) · 안방 · 침실…] 순이 된다.
   * 축척 기준을 거실이 아니라 **안방으로 잡고 싶다는 요청**이 있어(고객이 아는 치수가
   * 대개 안방이다) 사용자가 막대에서 후보를 넘겨 가며 고를 수 있게 이 목록을 남긴다.
   */
  const cands = [];
  for (const [x, y] of probes){
    const r = detectRoomAt(x, y);
    if (r.error || !r.poly) continue;
    const a = polyAreaPx(r.poly);
    if (a <= 0) continue;
    const xs = r.poly.map((q)=>q[0]), ys = r.poly.map((q)=>q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const cx = (x0+x1)/2, cy = (y0+y1)/2;
    const dup = cands.find((c)=> Math.abs(c.cx-cx) < 20 && Math.abs(c.cy-cy) < 20
      && Math.abs(c.a-a) < Math.max(c.a, a) * 0.08);
    if (dup) continue;
    // 크기·모양을 여기서 재 둔다 — 고를 때 detectRoomAt 을 다시 부르지 않아도 된다
    cands.push({ a, cx, cy, at: [x, y], w: x1-x0, h: y1-y0 });
  }
  cands.sort((u,v)=> v.a - u.a);
  state.roomCands = cands;
  /*
   * **기본 기준 방은 안방이다**(사용자 지정: "거실 크기는 몰라도 안방 치수는 알고 있다").
   * 가장 넓은 방은 거의 언제나 거실(+주방)이므로 그것을 뺀 나머지에서 고른다.
   * 그중에서도 **네모난 방**을 앞세운다 — 닫힌 주방은 길쭉해서(가로:세로 2배 이상)
   * 넓이만 보면 안방보다 클 수 있는데, 그걸 안방으로 잘못 잡으면 축척이 통째로 틀어진다.
   * 어디까지나 추정이므로 초안 막대의 "다른 방 ▸"로 사용자가 바로잡을 수 있다.
   */
  const boxy = (c) => Math.max(c.w, c.h) / Math.max(1, Math.min(c.w, c.h));
  /*
   * **사람이 쓰는 방만 후보로 둔다.**
   * 가장 넓은 방(거실)을 빼고 고르다 보니, 후보가 둘뿐인 도면에서는 남은 하나가
   * 창틀·기둥 사이 같은 조각이어도 그걸 집었다. 조각도 네모나서 "네모난 방 우선"
   * 조건마저 통과한다. 실측으로 도면 39장 중 8장(21%)이 이랬고 최악은 32×21px 였다.
   * 축척을 조각으로 재면 도면 전체 치수가 통째로 틀어지므로 하한을 둔다:
   *   · 넓이가 도면의 3% 이상 (실측 중앙값이 8.9% 라 방다운 방은 넉넉히 넘는다)
   *   · 짧은 변이 도면 짧은 변의 8% 이상 (얇은 띠를 걸러낸다)
   * 통과하는 후보가 하나도 없으면 **가장 넓은 방으로 물러선다** — 조각보다는 낫다.
   */
  const planA = (state.imgW || 1) * (state.imgH || 1);
  const minShort = Math.min(state.imgW || 1, state.imgH || 1) * 0.08;
  const roomLike = (c) => c.a >= planA * 0.03 && Math.min(c.w, c.h) >= minShort;
  /*
   * **침실은 세대 폭을 가로지르지 않는다**(2026-08-13, 실측으로 넣음).
   *
   * 화면이 *"침실1 가로가 몇 mm 입니까?"* 하고 벽 하나를 주황으로 부각하는데, 그 벽이
   * 실은 **세대 전체 폭**인 도면이 있었다. 사용자가 안내대로 3,300 을 넣으면 도면이 두세
   * 배로 줄어 축척이 통째로 틀어지고, 그 뒤의 "들어갑니다/안 들어갑니다"가 전부 거짓이
   * 된다 — 이 도구에서 가장 위험한 실패다(사용자 보고: 원주 푸르지오 85A · 안양자이 50-2).
   *
   * 실측(도면 54장, `.scratch/scale-truth.mjs`) — 기준 벽이 건물 폭에서 차지하는 비율의
   * 중앙값은 **0.36**(침실다움)이고, **4장(7%)이 0.8 이상**이었다. 그 4장이 갈리는 원인은
   * 둘인데 **증상과 처방은 같다**:
   *   · 합쳐진 세대 — 다른 후보 2~5곳의 중심을 품는다(`detectAllRooms` 의 포함 관계 규칙)
   *   · 길고 얕은 띠(발코니·복도로 보인다) — 넓이/벽² 이 0.07~0.52 로 납작하고, 품는 것이
   *     없어 **포함 관계로는 안 걸린다**
   * 그래서 포함 관계를 옮겨 오는 대신 **"세대 폭을 가로지르는 것은 침실이 아니다"** 한 줄로
   * 넷을 모두 덮는다. 축척과 무관한 잣대라 도면 크기에 흔들리지 않는다(4장 → 2장).
   *
   * **거르지 않고 뒤로 미룬다.** 원룸처럼 세대 폭이 곧 방 폭인 도면이 있고, 그런 도면에서
   * 후보를 지우면 자동 인식이 아예 실패한다. 통과하는 후보가 하나도 없으면 예전 그대로다.
   */
  const bxx = ((state.baseInfo || {}).bbox) || null;
  const bS = ((state.baseMask || {}).S) || 1;
  const bldgW = bxx ? Math.max(1, (bxx.x1 - bxx.x0) / bS) : (state.imgW || 1);
  const narrow = (c) => c.w < bldgW * 0.8;
  let pick = 0;
  if (cands.length > 1){
    const rest = cands.slice(1).filter(roomLike);
    const pool = rest.filter(narrow).length ? rest.filter(narrow) : rest;
    const square = pool.find((c)=> boxy(c) < 2);
    const chosen = square || pool[0];
    pick = chosen ? cands.indexOf(chosen) : 0;
  }
  state.candIdx = pick;
  /*
   * **가장 넓은 것마저 방답지 않으면 자동으로 확정하지 않는다.**
   * 그런 도면은 인식 자체가 약한 것이라(실측: 39장 중 2장, 최대 조각이 도면의 2.5%),
   * 그 조각으로 축척을 물으면 도면 전체 치수가 틀어진다. 사용자에게 넘기는 편이 맞다.
   */
  const usable = cands.length && roomLike(cands[pick]);
  const best = usable ? { a: cands[pick].a, r: detectRoomAt(cands[pick].at[0], cands[pick].at[1]), at: cands[pick].at } : null;
  if (!best || best.r.error){
    setMode('detect');
    toast('방을 자동으로 못 잡았습니다 — 침실1(안방) 안쪽을 한 번 눌러주세요');
    draw(); return;
  }
  const r = best.r;
  state.draft = r.poly; state.draftEdges = r.edges; state.draftCloseR = r.closeR;
  state.draftAt = best.at;
  state.draftStep = { wider: r.wider, narrow: r.narrow, step: r.step, steps: r.steps };
  setMode('detect'); draw();
  confirmDetected(true);
}

/** 인식한 초안의 넓이(㎡) — 축척이 확정된 뒤에만 의미가 있다 */
function draftAreaM2(poly){
  if (!state.scaled || !poly) return null;
  const k = state.mmPerPx || 1;
  let a2 = 0;
  for (let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    a2 += (a[0]*k)*(b[1]*k) - (b[0]*k)*(a[1]*k);
  }
  return Math.abs(a2/2)/1e6;
}

/**
 * 인식한 범위를 **도면 위에서** 확인하고 조절한다.
 *
 * 예전에는 모달로 물었는데, 모달이 도면을 덮어 버려서 "더 넓게/더 좁게를 눌러도
 * 무엇이 바뀌는지 모르겠다"는 지적을 받았다. 바뀌는 것은 도면 위 파란 영역인데
 * 그게 안 보였던 것이다. 그래서 조절은 도면 위 막대에서 하고, 이름은 확정할 때 묻는다.
 */
/**
 * 지금 고르는 중인 조각들 — 확정 전 초안. 방금 누른 것(state.draft)과 앞서 담아 둔 것들.
 *
 * **한 공간이 여러 조각으로 잡히는 것이 정상이다.** 도면에 따라 거실만 잡히기도 하고
 * 거실과 주방이 한 덩어리로 잡히기도 한다. 주방은 냉장고장이 별도 칸으로 그려져 따로 떨어지고,
 * 붙박이장 선이 방을 가르기도 한다. 가전은 "이 방 안"을 기준으로 자리를 찾으므로,
 * 거실과 주방을 한 공간으로 묶어야 그 사이에 놓을 자리를 찾는다.
 */
function draftPieces(){
  const more = state.draftMore || [];
  return state.draft ? [...more, { poly: state.draft, edges: state.draftEdges }] : more.slice();
}
/** 초안 조각들의 넓이 합 */
function draftTotalM2(){
  let t = 0, any = false;
  for (const p of draftPieces()){
    const a = draftAreaM2(p.poly);
    if (a != null){ t += a; any = true; }
  }
  return any ? t : null;
}

/**
 * 자동으로 잡은 초안이 **왜 이 방인지**를 한 줄로 적는다.
 *
 * 예전에는 `침실1(안방)로 보이는 방을 잡았습니다 — 축척은 이 방의 가로 벽으로 잽니다`
 * 가 **통째로 하드코딩**돼 있었다. 두 가지가 어긋났다(2026-08-14 프로덕션 시연):
 *
 *  ① **이름**이 실제 고른 방과 무관했다. 디에트르 84 에서 30.3㎡(거실)를 잡아 놓고
 *     "침실1(안방)로 보이는 방"이라고 말했다. CLAUDE.md 가 이미 정해 둔 규칙이 있다 —
 *     *"자동이 그 방을 골랐으면 이름 제안도 그 방 이름이어야 한다. 화면이 거짓말을 한다."*
 *  ② **축척이 이미 확정된 도면**(단지 색인에 실려 있다)에서도 "이 방의 가로 벽으로
 *     잽니다"라고 말했다. 잴 일이 없는데 잰다고 하니 상담사가 무엇을 해야 하는지 흐려진다.
 */
function autoWhy(){
  const nm = (() => { try { return nextRoomName(); } catch (_) { return '방'; } })();
  const pick = `<b>${esc(nm)}(으)로 보이는 방</b>을 잡았습니다`;
  const tail = ' 다른 방이면 <b>다른 방 ▸</b>';
  /* 축척이 이미 있으면 잰다는 말을 하지 않는다 — 그 말이 곧 다음에 할 일을 가리키기 때문 */
  return state.scaled
    ? `${pick} —${tail}`
    : `${pick} — 축척은 이 방의 <b>가로 벽</b>으로 잽니다.${tail}`;
}

function showDraftBar(auto, prevArea){
  const bar = $('#draftbar');
  const more = state.draftMore || [];
  if (!state.draft && !more.length){ bar.classList.remove('on'); return; }

  // 조각을 담아 두고 다음 공간을 기다리는 상태 — 도면을 가리지 않게 막대만 남긴다
  if (!state.draft){
    const t = draftTotalM2();
    bar.innerHTML = `
      <div class="dl">
        <span class="area">${t != null ? t.toFixed(1) + '㎡' : '조각 담김'}</span>
        <span class="meta">조각 ${more.length}개 담김 — <b>함께 묶을 공간을 마저 누르세요</b></span>
        <span class="grow"></span>
      </div>
      <div class="dl">
        <span class="grow"></span>
        <button id="d-cancel">담은 것 비우기</button>
        <button id="d-ok" class="primary">${more.length}개로 확정</button>
      </div>`;
    if (!bar.classList.contains('on')) pushBack();   // 휴대폰 뒤로가기가 앱이 아니라 이 막대를 닫도록
    bar.classList.add('on');
    $('#d-cancel').onclick = ()=>{ state.draftMore = []; hideDraftBar(); setMode('detect'); draw(); };
    $('#d-ok').onclick = ()=> nameRoomSheet();
    return;
  }

  const st = state.draftStep || {};
  const area = draftAreaM2(state.draft);
  const total = draftTotalM2();
  const opens = (state.draftEdges || []).filter((e)=>e.open).length;
  const lvl = st.step ? `범위 ${st.step}/${st.steps}` : '';
  const delta = (prevArea != null && area != null && Math.abs(prevArea - area) > 0.05)
    ? `<span class="prev">${prevArea.toFixed(1)}㎡ → ${area > prevArea ? '넓어짐' : '좁아짐'}</span>` : '';
  bar.innerHTML = `
    <div class="dl">
      ${area != null ? `<span class="area">${area.toFixed(1)}㎡</span>` : '<span class="area">범위 확인</span>'}
      ${delta}
      ${more.length ? `<span class="meta">조각 ${more.length + 1}개 · 합계 <b>${total != null ? total.toFixed(1) + '㎡' : '—'}</b></span>` : ''}
      <span class="meta">모서리 ${state.draft.length}개${opens?` · 개구부 ${opens}곳`:''}</span>
      ${st.approx ? '<span class="meta">경계가 깔끔히 닫히지 않아 <b>대략</b>으로 잡았습니다 — 넓게/좁게로 맞춰 주세요</span>' : ''}
      <span class="grow"></span>
      ${auto ? `<span class="meta">${autoWhy()}</span>` : ''}
    </div>
    <div class="dl">
      <button id="d-wide" ${st.wider  == null ? 'disabled' : ''}>◂ 더 넓게</button>
      <span class="lvl">${esc(lvl)}</span>
      <button id="d-narrow" ${st.narrow == null ? 'disabled' : ''}>더 좁게 ▸</button>
      <span class="grow"></span>
      <button id="d-add">＋ 이 공간도 함께</button>
      ${(state.roomCands||[]).length > 1 ? `<button id="d-next">다른 방 ▸ <span class="lvl">${(state.candIdx||0)+1}/${state.roomCands.length}</span></button>` : ''}
      <button id="d-again">다시 누르기</button>
      <button id="d-draw">직접 그리기</button>
      <button id="d-ok" class="primary">${more.length ? `${more.length + 1}개로 확정` : '이 공간 확정'}</button>
    </div>`;
  if (!bar.classList.contains('on')) pushBack();   // 휴대폰 뒤로가기가 앱이 아니라 이 막대를 닫도록
  bar.classList.add('on');
  if (delta){ bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump'); }

  const redo = (r) => {
    if (r == null || !state.draftAt) return;
    const before = draftAreaM2(state.draft);
    const res = detectRoomAt(state.draftAt[0], state.draftAt[1], r);
    if (res.error){ toast(res.error); return; }
    state.draft = res.poly; state.draftEdges = res.edges; state.draftCloseR = res.closeR;
    state.draftStep = { wider: res.wider, narrow: res.narrow, step: res.step, steps: res.steps };
    draw();
    showDraftBar(false, before);
  };
  /*
   * **축척 기준을 다른 방으로 옮긴다.**
   * 고객이 아는 치수는 거실보다 안방인 경우가 많다(사용자 지적). 자동은 가장 넓은 방
   * (보통 거실)부터 보여주고, 이 버튼으로 넓은 순서대로 넘겨 가며 고르게 한다 —
   * '안방'을 기하학만으로 찍어내려 하면 주방이 닫힌 도면에서 주방을 안방으로 잘못 본다.
   */
  const nx = $('#d-next');
  if (nx) nx.onclick = ()=>{
    const cs = state.roomCands || [];
    if (cs.length < 2) return;
    state.candIdx = ((state.candIdx || 0) + 1) % cs.length;
    const c = cs[state.candIdx];
    const res = detectRoomAt(c.at[0], c.at[1]);
    if (res.error){ toast(res.error); return; }
    const before = draftAreaM2(state.draft);
    state.draft = res.poly; state.draftEdges = res.edges; state.draftCloseR = res.closeR;
    state.draftAt = c.at;
    state.draftStep = { wider: res.wider, narrow: res.narrow, step: res.step, steps: res.steps };
    draw();
    showDraftBar(false, before);
  };
  $('#d-wide').onclick   = ()=> redo(st.wider);
  $('#d-narrow').onclick = ()=> redo(st.narrow);
  // 지금 조각을 담아 두고 다음 공간을 누르게 한다. 거실 + 주방처럼 한 공간이 여러 덩어리로
  // 잡히는 도면에서, 이름 붙이기를 반복하지 않고 한 번에 묶기 위한 것이다.
  $('#d-add').onclick    = ()=>{
    (state.draftMore = state.draftMore || []).push({ poly: state.draft, edges: state.draftEdges });
    state.draft = null; state.draftEdges = null; state.draftStep = null;
    setMode('detect'); draw(); showDraftBar(false);
    toast('담았습니다 — 함께 묶을 공간을 마저 누르세요');
  };
  $('#d-again').onclick  = ()=>{ state.draft=null; state.draftEdges=null; setMode('detect'); draw(); showDraftBar(false); };
  $('#d-draw').onclick   = ()=>{ hideDraftBar(); state.draft=null; state.draftMore=[]; state.wallPts=[]; setMode('wall'); draw(); };
  $('#d-ok').onclick     = ()=> nameRoomSheet();
}
function hideDraftBar(){
  $('#draftbar').classList.remove('on');
  /* 막대가 사라지면 '벽 직접 고르기'도 함께 꺼진다 — 켜진 채 남으면 도면을 눌러도
     방 인식이 안 되고 아무 일도 안 일어난 것처럼 보인다 */
  state.wallPick = false; state.wallPickFn = null; state.wallSegs = null; state.measureCands = null;
}

/** 확정 직전 — 이름을 붙이거나 이미 잡은 방에 이어 붙인다 */
function nameRoomSheet(){
  const pieces = draftPieces();
  if (!pieces.length) return;
  const k = state.mmPerPx || 1;
  let long = 0, corners = 0;
  const opens = [];
  for (const pc of pieces){
    corners += pc.poly.length;
    for (let i=0;i<pc.poly.length;i++){
      const a=pc.poly[i], b=pc.poly[(i+1)%pc.poly.length];
      long = Math.max(long, Math.hypot(b[0]-a[0], b[1]-a[1]) * k);
    }
    for (const e of (pc.edges || [])) if (e.open) opens.push(e);
  }
  const area = draftTotalM2();
  const openLen = opens.reduce((s,e)=>s+Math.hypot(e.x2-e.x1,e.y2-e.y1)*k, 0);
  const sizeTxt = (pieces.length > 1 ? `조각 <b>${pieces.length}개</b>를 한 공간으로 묶습니다 · ` : '')
    + (state.scaled
      ? `가장 긴 벽 <b>${Math.round(long).toLocaleString()}mm</b> · 모서리 ${corners}개`
      : `모서리 ${corners}개 — 실제 길이는 다음 단계에서 입력합니다`)
    + (opens.length
      ? `<br>개구부(문·창) <b>${opens.length}곳</b>${state.scaled?` · 합계 ${Math.round(openLen).toLocaleString()}mm`:''} — 주황 선으로 표시됩니다`
      : '');
  // 이미 잡아 둔 방이 있으면 "그 방에 이어 붙이기"를 고를 수 있다.
  // 자동 인식이 방을 절반만 잡는 경우(붙박이장 선·확장 창호선이 방을 가른다)의 해법이다.
  const joinSel = state.rooms.length
    ? `<label class="pickers" style="margin-top:6px"><span class="hint">이미 잡은 방에 이어 붙이기</span>
         <select id="join"><option value="">— 새 방으로 추가 —</option>
           ${state.rooms.map((r)=>`<option value="${r.id}">${esc(r.name)}에 이어 붙이기</option>`).join('')}
         </select></label>`
    : '';
  sheet(`<h2>이 공간을 무엇으로 부를까요?</h2>
    <div class="spec">${area != null ? `넓이 <b>${area.toFixed(1)}㎡</b> · ` : ''}${sizeTxt}</div>
    <label class="pickers"><span class="hint">방 이름</span>
      <input type="text" id="rname" value="${esc(nextRoomName())}" maxlength="12" placeholder="예: 침실2"></label>
    ${joinSel}
    <p class="src">벽 모양만 자동으로 잡습니다. 실제 치수는 축척 보정(또는 벽 길이 입력)에서 온 값을 씁니다 —
      도면 선을 추측해서 치수를 만들지 않습니다. 범위를 더 바꾸려면 <b>범위 다시 조절</b>로 돌아가세요.</p>
    <div class="modal-actions">
      <button id="back">범위 다시 조절</button>
      <button class="primary" id="ok">확정</button>
    </div>`,
    ()=>{
      $('#back').onclick = ()=>{ closeSheet(); showDraftBar(false); };
      $('#ok').onclick   = ()=>{
        const join = $('#join') ? $('#join').value : '';
        const name = ($('#rname').value || '').trim() || nextRoomName();
        closeSheet(); hideDraftBar();
        const list = draftPieces();
        state.draft=null; state.draftEdges=null; state.draftMore=[];
        // 첫 조각이 방을 만들고 나머지는 그 방에 이어 붙는다 (state.rooms[].parts)
        let target = join;
        for (const pc of list){
          applyDetected(pc.poly, pc.edges, target ? { appendTo: target } : { name });
          target = target || state.roomSel;
        }
      };
    });
}

/** 예전 이름 — 초안을 띄우는 진입점 */
function confirmDetected(auto){ showDraftBar(auto); }

/* 짧은 안내 — 모달을 띄울 만큼은 아닌 것들 */
let toastTimer = null;
function toast(msg){
  $('#status').textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(renderSide, 4000);
}

/**
 * 이 위치에 놓을 수 없는 이유를 돌려준다(놓을 수 있으면 null).
 * 드래그 중에 호출해 "겹친 채로 놓이는 상태" 자체를 만들지 않는다 —
 * 설치할 수 없는 배치를 화면에 그려 두면 상담 중에 그대로 읽힌다.
 *
 * 본체 겹침과 이격 침범은 막고, 도어 오픈은 막지 않는다. 힌지 방향(좌/우)을 알 수 없어
 * 양쪽에 그리기 때문에, 막아 버리면 실제로는 열리는 자리도 못 놓게 된다. 대신 경고로 남긴다.
 */
/*
 * ── 겹쳐도 되는 조합 ────────────────────────────────────────────────
 * **2D 평면도라서 생기는 예외다.** 실제로는 높이가 달라 서로 부딪히지 않는데,
 * 위에서 내려다본 그림에서는 같은 자리를 차지하는 것처럼 보이는 조합이 있다.
 *   · 사운드바는 TV **아래**에 건다
 *   · 건조기는 세탁기 **위**에 얹는다(적층). 다만 콤보(세탁+건조 일체형)는
 *     그 자체가 건조까지 하는 물건이라 위에 건조기를 얹지 않으므로 제외한다.
 * 이 예외를 안 두면 실제로 되는 설치를 "겹칩니다"로 막아 버린다.
 * 언젠가 3D 로 가면 높이축이 생겨 이 예외 자체가 필요 없어진다.
 */
const isCombo = (it)=> /콤보/.test(it.group||'') || /^WD/.test(it.model||'');
const STACKABLE = [
  { a:/^TV$/, b:/^사운드바$/, ok:()=>true, why:'사운드바는 TV 아래에 설치합니다' },
  { a:/^세탁기·콤보$/, b:/^건조기$/, ok:(w)=>!isCombo(w), why:'건조기를 세탁기 위에 적층합니다' },
];
/*
 * ── 설치 높이 (`it.mh` — 바닥에서 제품 **하단**까지 mm) ─────────────────────
 *
 * *"TV와 사운드바는 높이를 설정할 수 있게 해주세요"*(2026-08-12 사용자).
 *
 * 예전에는 3D 가 `body.position.y = h/2` 한 줄이라 **모든 가전이 바닥에 놓였다.**
 * 벽에 거는 TV 와 그 아래 사운드바가 거실 바닥에 누워 있으면 "우리 집 느낌"이 무너지고,
 * 더 나쁘게는 **바닥 자리를 차지한 것으로 판정**되어 그 앞에 다른 가전을 못 놓는다.
 *
 * **어느 값이 근거가 있고 어느 값이 가정인지 분명히 갈라 둔다.**
 *
 *  ① 스탠드형 TV — `size-reps` 가 **스탠드 포함 높이**를 따로 들고 있다(65형 H1361.2 대
 *     벽걸이 H875.1). 받침이 이미 치수에 들어 있으므로 **바닥(0)이 맞다.** 근거 있음.
 *  ② 사운드바 — `STACKABLE` 이 이미 *"사운드바는 TV 아래에 설치합니다"* 라고 적고 있다.
 *     그래서 같은 방 TV 의 **하단에 딱 붙여** 따라가게 한다. 지어낸 값이 아니라 파생값이다.
 *     TV 가 없으면 바닥에 둔다(받침대 위에 놓는 경우와 같다).
 *  ③ 벽걸이 TV 를 몇 mm 에 거는가 — **삼성 설치가이드에도, 구매가이드에도 수치가 없다**
 *     (실제로 원문을 확인했다: 벽면 재질·두께·이격만 있고 높이는 없다).
 *     그래서 **가정값**으로 두고 화면이 그 사실을 밝힌다 — 이 앱이 층고 2,300mm 를
 *     다루는 방식 그대로다. 기준은 *화면 중심을 앉은 눈높이에 맞춘다* 는 통용 원칙이고,
 *     눈높이는 `EYE_MM` 하나뿐이다. 사용자가 그 자리에서 고칠 수 있다.
 *
 * 뒤이어 **벽·천장·창·상판에 붙는 나머지도 같은 방식으로** 넣었다(2026-08-12).
 * 설치가이드 원문에 높이 수치는 여전히 없지만 **설치 방식은 확정돼 있다** —
 * 창문형은 *"창틀이 있는 미닫이 창문 전용 · 기본 거치대는 창문높이 92~146cm 지원"*,
 * 인덕션은 *"하단 7~10cm 이상 확보 시 밀착 빌트인"*(= 상판에 묻힌다),
 * 천장형 시스템에어컨은 실내기 높이가 135~138mm 에 판넬이 따로 있는 카세트다.
 *
 * **가정은 상수 세 개로 모은다.** 여기저기 숫자를 흩어 두면 무엇이 근거이고 무엇이
 * 어림인지 알 수 없게 된다. 천장에 붙는 것은 **층고에서 빼는 파생값**이라 새 가정이 아니다
 * (층고 자체가 이미 밝혀 둔 가정이다).
 */
/*
 * 벽걸이 TV 의 **화면 중심 높이**. 예전에는 "앉은 눈높이" 어림값 1,100 이었는데,
 * 2026-08-17 사용자가 현장 기준을 줬다 — *"85인치 기준 600mm. 소파에서 앉아서
 * 시청했을 때의 적정 높이"*.
 *
 * 83~85형 벽걸이 높이가 **실측 1,077mm** 이므로 하단 600 → **중심 1,139mm**.
 * 즉 **기준점만 바꾸면 되고 공식(`중심 − 높이/2`)은 그대로다.** 그 공식이 곧
 * *"더 큰 TV 는 비율에 맞춰 하향조정"* 이다 — 화면이 커진 만큼 하단이 내려간다:
 *   65형 701 · **83~85형 600(기준)** · 98형 514 · 115형 400mm
 * (작은 TV 는 반대로 올라간다 — 중심을 눈높이에 맞추는 것이 기준이라 그렇다.)
 */
const EYE_MM = 1139;
const COUNTER_MM = 850;     // 주방 상판 높이(가정) — 인덕션은 여기에 묻힌다
const SILL_MM = 900;        // 창대 높이(가정) — 창문형 에어컨이 얹히는 자리
/* 3D 층고와 **같은 값을 써야 한다.** 천장에 붙는 것을 층고에서 빼서 놓는데 둘이 어긋나면
   가전이 천장을 뚫거나 공중에 뜬다. Place3D 는 모듈 안에 있어 여기서 못 읽으므로 상수를
   여기 두고 그쪽이 가져다 쓴다 — `test-plans` 가 둘이 같은지 대조한다. */
const CEIL_MM = 2300;

/*
 * 설치 방식 표 — **어디에 붙는가**만 적는다. 높이는 아래 `defaultMountH` 가 계산한다.
 * 여기 없는 가전은 바닥이다(기본값 0이라 예전 판정과 한 픽셀도 다르지 않다).
 */
const MOUNT_KIND = [
  // TV 는 부품이 갈린다 — 스탠드형은 받침이 치수에 이미 들어 있어 바닥이 맞다
  { cat:/^TV$/,      when:(it)=> /벽걸이/.test(it.part||''), kind:'벽' },
  /* **사운드바 본체만** TV 아래에 건다. 같은 줄에 딸린 서라운드 스피커는 옆·뒤에 두고
     우퍼는 바닥에 놓는 물건이라, 부품 이름을 보지 않으면 셋 다 TV 아래로 붙어 버린다. */
  { cat:/^사운드바$/,  when:(it)=> /^사운드바$/.test(it.part||''), kind:'TV아래' },
  // 에어컨 — 줄 이름이 설치 형태를 그대로 밝힌다(스탠드는 바닥이라 여기 없다)
  { cat:/^에어컨$/,    when:(it)=> /벽걸이/.test(it.size||''), kind:'천장아래' },
  { cat:/^에어컨$/,    when:(it)=> /창문형/.test(it.size||''), kind:'창' },
  // 시스템에어컨 — 실내기가 얇은 것(카세트)만 천장이다. 1,800mm 대는 바닥에 세우는 패키지형이다
  { cat:/^시스템에어컨$/, when:(it)=> (it.h||0) <= 400,        kind:'천장' },
  { cat:/^인덕션\/전기레인지$/, when:()=> true,                 kind:'상판' },
];
function mountKind(it){
  for (const m of MOUNT_KIND) if (m.cat.test(it.cat||'') && m.when(it)) return m.kind;
  return null;
}
/** 이 가전이 설치 높이를 가질 수 있는가 (바닥에 놓는 것은 칸을 만들지 않는다) */
function mountable(it){ return !!mountKind(it); }

/*
 * ── 주 부품 고르기 (`mainPart`) ────────────────────────────────────────
 *
 * **TV 는 항상 벽걸이로 배치한다**(2026-08-17 사용자 결정).
 *
 * `size-reps` 는 TV 를 스탠드/벽걸이 **두 부품으로 따로** 들고 있고 치수가 크게 다르다 —
 * 55형 스탠드 `1255×1237×483` vs 벽걸이 `1255×748×**221**`. **깊이가 2.2배**다(받침 포함).
 *
 * 그래서 "높이만 벽걸이로"는 틀린 구현이다. 스탠드 치수를 그대로 쓰면
 *   · 3D 에 **받침 달린 TV 가 벽에 떠 있고**
 *   · 평면에서 **바닥 자리를 2배로 차지**해 그 앞에 다른 가전을 못 놓는다.
 *
 * **한 곳에서 정한다.** 예전에는 `o.parts[0]`(=스탠드)을 목록·정보줄·배치가 각각 집었다.
 * 세 곳이 갈리면 화면에 적힌 치수와 실제로 놓이는 치수가 달라진다.
 */
function mainPart(cat, o){
  const parts = (o && o.parts) || [];
  if (/^TV$/.test(cat)) return parts.find((p)=>/벽걸이/.test(p.part||'')) || parts[0];
  return parts[0];
}
/** 기본 설치 높이 — 근거가 있으면 그것으로, 없으면 가정값으로 */
function defaultMountH(it, others){
  const kind = mountKind(it);
  const H = it.h || 0;
  const fit = (v)=> Math.max(0, Math.round(v));
  switch (kind){
    /*
     * 화면 중심을 눈높이에 — 커질수록 하단이 내려간다(사용자 기준: 85인치 하단 600mm).
     * **천장을 뚫지 않게 상한을 둔다.** 115형(높이 1,478)까지는 여유가 있지만 층고가
     * 가정값이라 사용자가 낮추면 넘칠 수 있다. 그때는 천장에 붙여 세운다.
     */
    case '벽':      return fit(Math.min(EYE_MM - H / 2, CEIL_MM - H));
    case '천장':    return fit(CEIL_MM - H);             // 천장에 붙인다(층고에서 뺀 파생값)
    /* 벽걸이 에어컨도 천장 가까이 단다 — 찬 공기가 아래로 내려와야 하기 때문이다.
       천장에 딱 붙이는 것으로 두면 새 가정을 만들지 않는다. */
    case '천장아래': return fit(CEIL_MM - H);
    case '창':      return fit(SILL_MM);                 // 창대에 얹는다
    case '상판':    return fit(COUNTER_MM);              // 주방 상판에 묻힌다
    case 'TV아래': {
      // 같은 방(없으면 아무 곳)의 벽에 건 TV 하단에 붙인다
      const list = others || state.items;
      const tvs = list.filter((o)=> o !== it && /^TV$/.test(o.cat) && (o.mh || 0) > 0);
      if (!tvs.length) return 0;                          // TV 가 없으면 받침대 위(=바닥)
      const mine = it.room, same = tvs.filter((o)=> o.room === mine);
      const tv = (same.length ? same : tvs).sort((a,b)=> (a.mh||0) - (b.mh||0))[0];
      /* **틈은 여기서도 같이 뺀다.** `alignUnderTV` 와 값이 갈리면 배치 경로에 따라
         사운드바 높이가 달라진다 — 화면이 스스로 다른 말을 하게 된다. */
      return fit((tv.mh || 0) - H - SB_GAP_MM);
    }
    default: return 0;
  }
}
/**
 * 화면에 적을 근거 — **가정인지 파생인지 밝힌다.** 숫자만 띄우면 확정으로 읽힌다.
 * 이 앱이 층고 2,300mm 를 "(가정)"으로 적는 것과 같은 규칙이다.
 */
const MOUNT_WHY = {
  /* 근거가 바뀌었다 — 설치가이드가 아니라 **현장 기준**이다. 그 사실을 화면에 밝힌다. */
  '벽':      ()=> `85인치 하단 600mm(앉아서 볼 때의 적정 높이) 기준으로, 화면 중심을 ${EYE_MM.toLocaleString()}mm 에 맞춘 값입니다 — 화면이 클수록 하단이 내려갑니다`,
  '천장':    ()=> `천장(층고 ${CEIL_MM.toLocaleString()}mm)에 붙인 값입니다 — 층고가 가정이라 이 값도 함께 움직입니다`,
  '천장아래': ()=> `천장(층고 ${CEIL_MM.toLocaleString()}mm) 가까이 단다는 기준에서 나온 값입니다 — 층고가 가정입니다`,
  '창':      ()=> `창대 높이(${SILL_MM.toLocaleString()}mm)에 얹은 값 — 설치가이드가 창 종류만 정하고 높이는 없어 가정입니다`,
  '상판':    ()=> `주방 상판 높이(${COUNTER_MM.toLocaleString()}mm)에 묻은 값 — 설치가이드가 "하단 7~10cm 확보 시 밀착 빌트인"만 적고 높이는 없어 가정입니다`,
  'TV아래':  ()=> 'TV 하단에 붙여 건다는 기준에서 나온 값입니다',
};
function mountWhy(it){
  const k = mountKind(it);
  return k ? MOUNT_WHY[k]() : null;
}
/** 안내띠에 붙일 짧은 꼬리 — 가정에서 왔는지 다른 값에서 파생됐는지 */
function mountTag(it){
  const k = mountKind(it);
  return k === 'TV아래' ? 'TV 기준' : (k === '천장' || k === '천장아래') ? '층고 기준' : '가정';
}
/**
 * 새로 만든 가전들의 설치 높이를 정한다.
 *
 * **반드시 다 만든 뒤에 한 번에 한다.** 사운드바는 TV 를 보고 따라가는데, 목록 순서상
 * 사운드바가 TV 보다 먼저 만들어지면(size-reps 순서가 그렇다) 그 시점엔 TV 가 없어
 * **조용히 바닥(0)이 된다** — 실제로 그랬다. 그래서 TV 부터 세우고 나머지를 이어 정한다.
 */
function applyMountH(made, all){
  const pool = (all || state.items);
  for (const it of made) if (mountKind(it) !== 'TV아래') it.mh = defaultMountH(it, pool);
  for (const it of made) if (mountKind(it) === 'TV아래') it.mh = defaultMountH(it, pool);
}

/*
 * ── 사운드바를 TV 에 맞춘다 (`alignUnderTV`) ─────────────────────────────
 *
 * *"사운드바는 TV 하단에 살짝 공간 두고 센터정렬 자동배치"*(2026-08-17 사용자).
 *
 * 예전에는 **높이만** TV 를 따라갔다(`mountKind 'TV아래'`). 평면 좌표는 각자
 * `findSpot` 으로 제 자리를 찾아서, 3D 로 보면 사운드바가 **TV 와 다른 벽에 붙어 있었다.**
 *
 * 맞추는 것은 셋이다 — **중심(x·y) · 방향(각도) · 방(room)**. 각도까지 같이 돌려야
 * 벽에 나란히 붙는다(TV 만 벽을 보고 사운드바는 90° 틀어져 있으면 벽을 파고든다).
 *
 * **사용자가 직접 옮긴 것은 건드리지 않는다** — 설치 높이에 `mhSet` 플래그가 있는 것과
 * 같은 장치(`posSet`)다. 상담사가 일부러 옮겨 놓은 것을 도로 끌어오면 조작이 안 먹는다.
 */
const SB_GAP_MM = 60;        // TV 하단과 사운드바 윗면 사이 — "살짝 공간"의 값(가정)

/** 이 사운드바가 따라갈 TV — 같은 방을 먼저, 없으면 가장 가까운 것 */
function tvFor(sb, all){
  const tvs = (all || state.items).filter((o)=> o !== sb && /^TV$/.test(o.cat) && !o.staged);
  if (!tvs.length) return null;
  const same = tvs.filter((o)=> o.room === sb.room);
  const pool = same.length ? same : tvs;
  return pool.sort((a,b)=> Math.hypot(a.bx-sb.bx, a.by-sb.by) - Math.hypot(b.bx-sb.bx, b.by-sb.by))[0];
}

/**
 * 사운드바를 TV 아래 중앙으로 옮긴다. 옮겼으면 true.
 * `made` 를 주면 그 안의 사운드바만 본다(새로 꺼낸 것만 맞출 때).
 */
function alignUnderTV(made, all){
  const pool = all || state.items;
  const list = (made || pool).filter((it)=> mountKind(it) === 'TV아래' && !it.posSet && !it.staged);
  let n = 0;
  for (const sb of list){
    const tv = tvFor(sb, pool);
    if (!tv) continue;
    sb.bx = tv.bx; sb.by = tv.by;          // 센터정렬 — 평면 중심을 TV 와 같게
    sb.a = tv.a;                            // 같은 벽을 보게 (안 맞추면 벽을 파고든다)
    sb.room = tv.room;
    sb.mh = Math.max(0, Math.round((tv.mh || 0) - (sb.h || 0) - SB_GAP_MM));
    /* TV 보다 넓은 사운드바가 실제로 있다 — 사운드바 최대 1,030mm vs TV 42~43형 986mm.
       센터정렬은 되지만 양옆으로 나오므로 그 사실을 알린다(하드로 막을 일은 아니다). */
    sb.soft = (sb.soft || []).filter((s)=> !/사운드바가 TV 보다/.test(s));
    if ((sb.w || 0) > (tv.w || 0) + 1) {
      sb.soft.push(`사운드바가 TV 보다 ${Math.round(sb.w - tv.w)}mm 넓습니다 — 양옆으로 나옵니다`);
    }
    n++;
  }
  return n;
}
/** 두 가전이 높이로 갈려 서로 자리를 안 뺏는가 (하나가 벽/천장에 붙어 있을 때) */
function clearsVertically(A, B){
  const a0 = A.mh || 0, a1 = a0 + (A.h || 0);
  const b0 = B.mh || 0, b1 = b0 + (B.h || 0);
  return a1 <= b0 || b1 <= a0;      // 위아래로 어긋나면 같은 바닥을 다투지 않는다
}

/** 두 가전이 같은 자리를 차지해도 되는가 — 되면 사유를 돌려준다 */
/*
 * 한 번에 도는 각도. 기본은 90°(벽에 붙여 놓는 물건은 네 방향이면 충분하다)이고,
 * **에어컨은 45°** 다 — *"에어컨의 경우 회전각이 45도 단위로 해주세요. 대각선으로 설치
 * 많이 합니다."*(2026-08-09 사용자). 스탠드 에어컨은 거실 모서리에 비스듬히 놓는 설치가
 * 실제로 흔한데, 90° 단위로는 그 자리를 아예 그릴 수 없다.
 * 45° 는 90° 를 포함하므로 두 번 누르면 예전과 같은 자리가 된다.
 */
const ROT_STEP = { '에어컨': Math.PI / 4 };
const rotStep = (cat)=> ROT_STEP[cat] || Math.PI / 2;
/** 회전 버튼에 적을 각도 — 실제로 도는 만큼과 어긋나면 안 된다 */
const rotLabel = (cat)=> Math.round(rotStep(cat) * 180 / Math.PI);

/**
 * **가전을 돌린다 — 제자리에서.**
 *
 * 가전은 뒷면 중앙(bx,by)과 각도로 표현한다(벽에 붙이는 물건이라 그 점이 기준이다).
 * 그런데 `it.a += rotStep(...)` 만 하면 **뒷면 중앙을 축으로 돌아** 제품이 방을 가로질러
 * 날아간다. 실측(912×930 냉장고, 7.8㎡ 방): 한 번 돌릴 때마다 본체 중심이 **930mm**
 * 움직였다(6449 → 5519 → …). 벽에 붙여 둔 것이 방 한가운데로 가니, 돌릴 때마다 다시
 * 끌어와야 한다 — 사용자가 "회전이 잘 안 된다"고 한 실체가 이것이다.
 *
 * 그래서 **본체 중심을 그대로 두고** 돌린 뒤 뒷면 중앙을 다시 잡는다. 벽에 붙어 있던
 * 것은 벽에서 떨어질 수 있는데, 그건 회전하면 발자국이 바뀌니 당연한 일이고 판정이
 * 알려 준다(억지로 벽에 다시 붙이면 사용자가 의도하지 않은 자리로 옮기는 셈이다).
 *
 * **다섯 자리가 이 함수를 지나가야 한다** — 하단 요약 버튼 · 2D 더블탭 · `R` 키 ·
 * 3D 버튼 · 3D 더블탭. 한 곳만 고치면 "버튼은 45°인데 더블탭은 90°"가 되고,
 * 그건 화면을 봐야만 알 수 있다(CLAUDE.md).
 *
 * @param dir -1 이면 반대 방향(길게 누르기)
 */
function rotateItem(it, dir){
  if (!it) return;
  /*
   * **벽에 거는 것은 돌리지 않는다**(2026-08-17 사용자: *"TV는 반드시 벽을 등집니다"*).
   * 각도는 붙은 벽이 정하는 값이라 손으로 돌리면 **화면이 벽을 보게 된다.**
   * 다른 벽으로 옮기고 싶으면 끌어다 놓으면 된다 — `snapWallMounted` 가 그때 다시 맞춘다.
   * 사운드바도 TV 를 따라 도는 물건이라 같이 막는다.
   */
  const k = mountKind(it);
  if (k === '벽' || k === 'TV아래'){
    toast(k === '벽' ? '벽걸이는 벽을 등지므로 돌리지 않습니다 — 다른 벽으로 끌어다 놓으세요'
                     : '사운드바는 TV 를 따라갑니다 — TV 를 옮기면 함께 움직입니다');
    return;
  }
  const c = bodyCenter(it);
  it.a += (dir < 0 ? -1 : 1) * rotStep(it.cat);
  const c2 = bodyCenter(it);
  it.bx += c[0] - c2[0];
  it.by += c[1] - c2[1];
}

function stackable(A, B){
  for (const s of STACKABLE){
    if (s.a.test(A.cat) && s.b.test(B.cat) && s.ok(A, B)) return s.why;
    if (s.a.test(B.cat) && s.b.test(A.cat) && s.ok(B, A)) return s.why;
  }
  return null;
}

/**
 * **벽을 가로지르는가** — 모서리는 다 놓을 수 있는 자리인데 몸통이 못 지나는 곳을 지난다.
 * 판정이 아니라 **문구를 고르기 위한** 함수다: 벽에 걸친 것을 "집 밖으로 나갑니다"라고
 * 하면 화면이 거짓말을 한다(상담사가 도면을 보며 "집 안인데요?" 하게 된다).
 * 모서리부터 밖이면 그건 진짜 '밖'이므로 여기서 false 를 준다.
 */
function crossesWall(it){
  if (it.staged || !canJudge(it)) return false;
  for (const [x,y] of corners(it)) if (!placeable(it,x,y)) return false;
  return bodyProbes(it).some(([x,y]) => !placeable(it,x,y));
}
/** 본체가 방을 벗어나는가 */
function escapesRoom(it){
  if (it.staged || !canJudge(it)) return false;
  return bodyOutside(it);
}
/** 다른 가전과 부딪히는가 (겹쳐도 되는 조합은 뺀다) */
function hitsOther(it){
  const body = corners(it), clear = corners(it, it.clear);
  for (const o of state.items){
    if (o === it || o.staged) continue;
    if (stackable(it, o)) continue;
    /*
     * **높이로 갈리면 같은 바닥을 다투지 않는다.**
     * 벽에 건 TV 아래를 지나가는 것은 겹침이 아니다 — 이걸 막으면 "들어갈 자리를
     * 안 들어간다고 말하는" 쪽 실패가 되고, CLAUDE.md 가 그 손실이 더 크다고 적어 두었다.
     * 둘 다 바닥(mh=0)이면 세로 구간이 반드시 겹치므로 예전 판정 그대로다.
     */
    if (clearsVertically(it, o)) continue;
    if (overlaps(body, corners(o))) return `${o.label}와 겹칩니다`;
    if (overlaps(clear, corners(o, o.clear))) return `${o.label}와 이격거리가 부족합니다`;
  }
  return null;
}

function collisionAt(it){
  if (escapesRoom(it)) {
    /*
     * 이제 방은 울타리가 아니므로, 여기까지 왔다는 것은 **잡힌 공간 어디에도 안 들어간다**는
     * 뜻이다. 그런데 예전 문구는 가전에 붙은 방 이름을 그대로 썼다 — 집 밖에 있는데
     * "침실2 밖으로 나갑니다"라고 말하게 된다. 화면이 거짓말을 하면 안 된다.
     */
    if (crossesWall(it)) return '벽을 가로지릅니다';
    if (state.rooms.length) return state.rooms.length > 1 ? '집 밖으로 나갑니다' : `${state.rooms[0].name} 밖으로 나갑니다`;
    return '방 밖으로 나갑니다';
  }
  return hitsOther(it);
}

/** 선분이 다각형과 닿는가 (개구부를 가로막는지 볼 때 쓴다) */
/*
 * ── 개구부 개폐 영역 (2026-08-18 사용자 요청) ────────────────────
 *
 * *"문은 모두 오픈된 상태로 해주면 됩니다. 가전배치하는데 문은 크게 상관이 없습니다.
 *   다만 **문이 열리고 닫히는 가상선은 있어야** 하고 그 위로 가전을 올릴 경우
 *   **문 개폐에 지장이 있다는 식으로 경고**가 필요합니다."*
 *
 * 예전에는 **개구부 선에 몸체가 닿을 때만** 경고했다. 문 앞 1m 에 냉장고를 세워도
 * 아무 말이 없었다 — 정작 문이 안 열리는 배치인데.
 *
 * ## 문인지 창인지 모르는 채로 그린다 — **재도전해서 다시 확인했다**
 * 정답 11,230개로 판별자를 셋(폭·바깥경계·유리선) 재 봤을 때 최고가 72% 였고,
 * 2026-08-18 에 AI Hub 정답으로 **5겹 교차검증**까지 붙여 다시 세워 봤지만
 * **기준선(전부 창이라고 답하기 80.5%)을 못 넘었다**(최고 81.2% · 문 재현 9%).
 * 그래서 **가르지 않고** 개구부 앞을 **"열고 드나드는 자리"** 로 본다 — 문이든 창(발코니 출입)이든
 * 앞을 막으면 안 되는 것은 같다. **경고 문구도 '문·창' 으로 적는다** — 문이라고 단정하면
 * 재 보지도 않은 것을 화면이 사실처럼 말하게 된다.
 *
 * ## 반지름은 문 한 짝만큼
 * 개구부 길이를 그대로 쓰면 2m 발코니 창이 6㎡ 를 먹는다. **문 한 짝이 열리는 만큼**
 * (최대 900mm)으로 자른다. 방 안쪽에만 그린다 — 바깥은 남의 집이거나 발코니다.
 *
 * **하드가 아니라 주의다.** 힌지 방향을 몰라 양쪽을 덮는 추정값이라, 막으면 실제 주방
 * 대부분이 배치 불가가 된다(이 파일의 기존 결정과 같은 이유).
 */
const SWING_MAX_MM = 900;
function openingSwing(w){
  const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
  const L = Math.hypot(dx, dy);
  if (!L) return null;
  const ux = dx / L, uy = dy / L;
  const R = Math.min(L, SWING_MAX_MM);
  const mx = (w.x1 + w.x2) / 2, my = (w.y1 + w.y2) / 2;
  /* 어느 쪽이 방 안인가 — 법선 양쪽을 찔러 본다 */
  let nx = -uy, ny = ux;
  if (!insideRoom(mx + nx * 60, my + ny * 60)) { nx = -nx; ny = -ny; }
  if (!insideRoom(mx + nx * 60, my + ny * 60)) return null;   // 양쪽 다 밖이면 그리지 않는다
  const pts = [[w.x1, w.y1]];
  const N = 12;
  for (let i = 0; i <= N; i++){
    const t = Math.PI * i / N;                      // 개구부를 따라 반원
    const ax = Math.cos(t), ay = Math.sin(t);
    pts.push([mx + (-ux * R) * ax + nx * R * ay, my + (-uy * R) * ax + ny * R * ay]);
  }
  pts.push([w.x2, w.y2]);
  return pts;
}

function segHitsPoly(seg, poly){
  const cross = (ax,ay,bx,by,cx,cy)=> (bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
  for (let i=0;i<poly.length;i++){
    const [px,py]=poly[i], [qx,qy]=poly[(i+1)%poly.length];
    const d1=cross(seg.x1,seg.y1,seg.x2,seg.y2,px,py);
    const d2=cross(seg.x1,seg.y1,seg.x2,seg.y2,qx,qy);
    const d3=cross(px,py,qx,qy,seg.x1,seg.y1);
    const d4=cross(px,py,qx,qy,seg.x2,seg.y2);
    if (((d1>0)!==(d2>0)) && ((d3>0)!==(d4>0))) return true;
  }
  return pointIn(poly, seg.x1, seg.y1) || pointIn(poly, seg.x2, seg.y2);
}

/* ── 판정 ── */
function evaluate(){
  const items = state.items;
  for (const it of items){ it.warn = []; it.soft = []; }
  for (let i=0;i<items.length;i++){
    const A = items[i];
    const closed = canJudge(A);
    const Abody = corners(A), Aclear = corners(A, A.clear);
    // 방 밖으로 나가는가 — **도면 밖에 꺼내 둔 것(staged)은 아직 판정하지 않는다.**
    // 상담사가 끌어다 넣기 전이라 "방 밖"이 당연하고, 경고로 채우면 진짜 문제가 묻힌다.
    if (!A.staged && closed && bodyOutside(A)) {
      const r = itemRoom(A);
      A.warn.push(crossesWall(A) ? '벽을 가로지름'
                : r ? `${r.name} 밖으로 나감` : '방 밖으로 나감');
    }
    for (let j=i+1;j<items.length;j++){
      const B = items[j];
      const Bbody = corners(B), Bclear = corners(B, B.clear);
      if (A.staged || B.staged) continue;   // 꺼내 두기만 한 것은 아직 판정 대상이 아니다
      // 2D 라서 겹쳐 보일 뿐 실제로는 위아래로 놓이는 조합 — 경고가 아니라 안내로 남긴다
      const stack = stackable(A, B);
      if (stack){
        if (overlaps(Abody,Bbody)){
          A.soft.push(`${B.label}와 같은 자리 — ${stack}`);
          B.soft.push(`${A.label}와 같은 자리 — ${stack}`);
        }
        continue;
      }
      if (overlaps(Abody,Bbody)){
        A.warn.push(`${B.label}와 겹침`); B.warn.push(`${A.label}와 겹침`);
      } else if (overlaps(Aclear,Bclear)){
        A.warn.push(`${B.label}와 이격거리 부족`); B.warn.push(`${A.label}와 이격거리 부족`);
      }
    }
    // ── 도어 오픈 공간 (주의 경고) ──
    const dz = doorZoneFor(A);
    if (dz){
      const zone = corners(A, { back:0, side:dz.side, front:0 });
      if (closed && zone.some(([x,y]) => !insideFor(A,x,y))) {
        A.soft.push(`도어 오픈 공간(좌우 ${dz.side}mm)이 벽에 닿습니다 — 실측 확인`);
      }
      for (const B of items){
        if (B === A) continue;
        if (overlaps(zone, corners(B))) {
          A.soft.push(`${B.label}가 도어 오픈 공간 안에 있습니다 — 실측 확인`);
          break;
        }
      }
    }
    const to = topOpenFor(A);
    if (to) A.soft.push(to.note);

    // 문·창(개구부) 앞을 막는가 — 인식된 경계 중 open 표시가 붙은 구간
    for (const w of state.walls){
      if (!w.open) continue;
      if (segHitsPoly(w, Abody)){
        /*
         * **벽에 거는 것은 여기서 하드다**(2026-08-17 사용자 결정).
         *
         * 바닥에 놓는 가전이 창 앞에 오는 것은 "출입·개폐 확인"으로 족하다 —
         * 실제로 그 자리에 놓기도 한다. 그런데 **벽걸이는 걸 벽 자체가 없다.**
         * 상담 중에 *"여기 걸면 됩니다"* 가 거짓이 되는 것이라 경고로는 부족하다.
         *
         * 도어 오픈을 하드로 만들지 않은 기존 결정과 어긋나지 않는다 — 그쪽은
         * **힌지 방향을 몰라 양쪽에 그리는 추정값**이고, 이쪽은 "벽이 있는가"라는
         * 훨씬 단순한 사실이다.
         */
        if (mountKind(A) === '벽') A.warn.push('창·문 자리에는 벽걸이를 걸 수 없습니다');
        else A.soft.push('문·창(개구부) 앞을 막습니다 — 출입·개폐 확인');
        break;
      }
    }
    /*
     * **개폐 영역까지 본다**(2026-08-18). 위 검사는 개구부 **선에 닿을 때만** 걸려서,
     * 문 앞 1m 에 냉장고를 세워도 아무 말이 없었다 — 정작 문이 안 열리는 배치인데.
     */
    if (mountKind(A) !== '벽'){
      for (const w of state.walls){
        if (!w.open) continue;
        const z = openingSwing(w);
        if (z && overlaps(Abody, z)){
          A.soft.push('문·창 개폐에 지장이 있습니다 — 열고 드나드는 자리입니다');
          break;
        }
      }
    }
  }
}

/*
 * ── 위에서 본 제품 실루엣 ──────────────────────────────────────────
 * 라벨 붙은 사각형만으로는 "여기 이 제품이 놓인다"는 느낌이 안 산다. 도면은 위에서 본
 * 그림이므로 **위에서 봤을 때 보이는 것**만 그린다 — 냉장고 도어 분할선, 세탁기 원형 도어,
 * TV 화면 폭, 인덕션 화구. 없는 정보를 그리지 않으므로 치수를 왜곡하지 않는다.
 * (사용자가 바라는 3D 렌더링의 저비용 대용이다. 3D 로 가면 이 함수는 필요 없어진다.)
 *
 * 좌표는 **제품 로컬 mm**로 쓴다 — x 는 -w/2..w/2, y 는 0(뒷면)..d(앞면).
 * 캔버스 변환을 걸어 두면 회전·배율을 신경 쓰지 않아도 된다.
 */
/*
 * ── 냉장고 도어 구성 (`fridgeLayout`) ─────────────────────────────────
 *
 * **이름이 도어 구성을 그대로 밝히고 있는데 그림이 그것을 안 보고 있었다**(2026-08-17).
 * 예전에는 `폭 800mm 초과 = 양문` 한 줄로 갈라서 넷이 틀렸다:
 *   · **양문형** — 좌우 도어인데 가로 분할선이 하나 더 그려졌다
 *   · **1도어 키친핏** — 문이 하나인데 가로로 갈렸다
 *   · **1도어 세트(2~4벌)** — 캐비닛이 나란한 것인데 2×2 로 그려졌다
 *   · **뚜껑형 김치냉장고** — 위로 여는 물건인데 앞면에 도어선이 생겼다
 *
 * **지어내지 않는다.** 여기서 읽는 것은 `size-reps` 의 사이즈 이름·제품군 문자열뿐이고,
 * 그 이름이 밝히지 않는 것(업소용 다목적 등)은 **예전 폭 기준을 그대로** 쓴다 —
 * 근거 없이 도어 수를 지어내면 고객이 실물로 오해한다.
 *
 * **2D 와 3D 가 이 함수 하나를 같이 본다.** 위에서 본 그림(2D)은 `cols` 만 쓰고,
 * 앞면이 보이는 3D 는 `rows` 까지 쓴다 — 같은 품목이 앱마다 다르게 생기면 눈이 헤맨다.
 */
/*
 * ── 칸 높이 비율 (`rowFrac`) — **규격도에서 재서 넣었다** (2026-08-27) ──────────
 *
 * 사장님 지적: *"김치냉장고 **서랍 높이가 비정상적으로** 보입니다."* 재 보니 그대로였다 —
 * 예전에는 칸 높이를 `h / rows` 로 **균등 분할**해서 김치냉장고가 33/33/33% 였는데,
 * 실물은 **상실이 절반이 넘고 서랍은 그 절반도 안 된다.**
 *
 * 지어낸 값이 아니다. `public/install-img/` 의 **공식 설치가이드 규격도 전면 VIEW** 를
 * 픽셀로 재서 넣었다 — 그 그림에는 제품 전체 높이가 mm 로 적혀 있어 비율이 곧 실측이 된다
 * (도구: `.scratch/_measure-front2.mjs`, 도어 사이 손잡이 띠의 **가운데**를 경계로 본다).
 *
 * | 규격도 | 실측 | 옛 값 |
 * |---|---|---|
 * | `pc01-02-03-01.jpg` 김치플러스 스탠드형 4도어(1,825mm) — 상실 54.9% · 중실 23.0% · 하실 22.1% | **0.55 / 0.23 / 0.22** | 0.33 / 0.33 / 0.33 |
 * | `pc-set-one-refri-bespoke-4doorFs-rm_f91_f90_v4.jpg` Bespoke 4도어 프리스탠딩(1,853mm) — 상 54.5% | **0.545 / 0.455** | 0.5 / 0.5 |
 *
 * **이름이 안 밝히는 것에는 넣지 않는다** — `rowFrac` 이 없으면 예전처럼 균등 분할이라
 * 양문형·일반형·업소용은 한 픽셀도 달라지지 않는다.
 *
 * **앞면 그림과 문짝 구간이 같은 값을 봐야 한다**(`leafSpans` ← `fridgeRows`).
 * 갈리면 문이 앞면에 그려 둔 분할선을 가로지른다 — 그 사고를 이미 한 번 겪었다.
 */
const KIMCHI_ROWS  = [0.55, 0.23, 0.22];    // 위 칸부터: 상실(좌우 2도어) · 중실 서랍 · 하실 서랍
const FRIDGE4_ROWS = [0.545, 0.455];        // 위 칸부터: 상단 좌우 도어 · 하단 좌우 도어

/**
 * 칸마다 [바닥에서 y0, y1] (위 칸부터). `rowFrac` 이 있으면 그 비율, 없으면 균등 분할.
 * **2D·3D·문짝이 전부 이 함수 하나를 본다** — 세 곳에서 따로 나누면 화면이 서로 다른 말을 한다.
 */
function fridgeRows(F, H){
  const n = Math.max(1, F.rows || 1);
  const fr = (F.rowFrac && F.rowFrac.length === n) ? F.rowFrac : Array.from({ length: n }, () => 1 / n);
  const out = [];
  let top = H;
  for (const f of fr){ const bot = top - H * f; out.push([bot, top]); top = bot; }
  return out;
}

function fridgeLayout(it){
  const size = String(it.size || ''), grp = String(it.group || ''), s = size + ' ' + grp;
  if (/뚜껑형/.test(s)) return { cols: 1, rows: 1, top: true };
  /* 1도어 세트 — `(냉장+냉동+김치)` 처럼 구성이 이름에 적혀 있다. 캐비닛 수가 곧 도어 수다 */
  const set = size.match(/\(([^)]*\+[^)]*)\)/);
  if (set) return { cols: Math.max(2, Math.min(4, set[1].split('+').length)), rows: 1, top: false };
  /*
   * **김치냉장고 4도어는 냉장고 4도어와 앞면이 다르다**(2026-08-27 사용자 확인) —
   * 상실만 좌우 두 짝이고 **중실·하실은 서랍**이라 그 아래는 통째로 한 칸씩이다.
   * 냉장고와 같은 2×2 로 그리면 서랍 한가운데에 **없는 세로 분할선**이 생긴다.
   * `splitRows` 는 "위에서 몇 칸이 좌우로 갈리는가"이고, 나머지 칸은 서랍이다.
   */
  if (/^김치냉장고$/.test(String(it.cat || '')) && /4도어/.test(s))
    return { cols: 2, rows: 3, top: false, splitRows: 1, rowFrac: KIMCHI_ROWS };
  if (/4도어/.test(s)) return { cols: 2, rows: 2, top: false, rowFrac: FRIDGE4_ROWS };
  if (/양문형/.test(s)) return { cols: 2, rows: 1, top: false };   // 좌우 도어 — 가로로 안 갈린다
  if (/일반형|상냉장|하냉동/.test(s)) return { cols: 1, rows: 2, top: false };
  if (/1도어/.test(s)) return { cols: 1, rows: 1, top: false };    // 통짜 캐비닛
  /* 이름이 안 밝히는 것(업소용 다목적·냉동고 등) — 예전 기준을 그대로 둔다 */
  const twin = /3도어|더블/.test(grp) || (it.w || 0) > 800;
  return { cols: twin ? 2 : 1, rows: 2, top: false };
}

/*
 * 인덕션 화구 수 — **이름이 `N구` 라고 밝힐 때만** 그 수를 쓴다.
 * `더 플레이트 1구` 인데 화구를 넷 그리고 있었다. 이름이 안 밝히는 것(빌트인 63cm 등)은
 * **예전 그대로 4구**로 둔다 — 카탈로그에서 확인하지 않은 수를 지어내지 않는다.
 */
function burnerCount(it){
  const m = (String(it.size || '') + ' ' + String(it.group || '')).match(/(\d)\s*구/);
  return m ? Math.max(1, Math.min(5, +m[1])) : 4;
}

function drawGlyph(it){
  const [sx,sy] = toScreen(it.bx, it.by);
  const z = state.zoom;
  if (it.w * z < 26) return;          // 너무 작으면 지저분하기만 하다
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(it.a); ctx.scale(z, z);
  ctx.lineWidth = 1.6 / z;
  ctx.strokeStyle = it.staged ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.78)';
  const w = it.w, d = it.d, hw = w/2;
  const line = (x1,y1,x2,y2)=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  const circle = (cx,cy,r)=>{ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); };
  const cat = it.cat, g = String(it.group || '');

  if (/^냉장고$|^김치냉장고$|^냉동고$|^업소용/.test(cat)){
    const F = fridgeLayout(it);
    if (F.top){
      /* 뚜껑형 — 위로 여는 물건이라 **앞면에 도어선이 없다.** 위에서 보면 뚜껑이다
         (통버블 세탁기를 사각으로 두는 것과 같은 어휘). */
      ctx.strokeRect(-hw*0.86, d*0.14, w*0.86, d*0.72);
    } else {
      // 세로 분할선 — 나란한 도어(캐비닛) 사이. 위에서 보이는 것은 이것뿐이다.
      for (let i = 1; i < F.cols; i++){
        const x = -hw + (w * i) / F.cols;
        line(x, d*0.12, x, d);
      }
      // 손잡이(앞면 가까이) — 어느 쪽이 앞인지 한눈에 보인다
      const hy = d*0.86, cw = w / F.cols;
      for (let i = 0; i < F.cols; i++){
        const cx = -hw + cw * (i + 0.5);
        line(cx - cw*0.30, hy, cx + cw*0.30, hy);
      }
    }
  } else if (/세탁기|건조기|에어드레서|슈드레서/.test(cat)){
    // 원형 도어 — 통버블(상부 개폐)은 위에서 보면 뚜껑이라 사각으로 둔다
    if (/통버블|일반세탁기/.test(g)) { ctx.strokeRect(-hw*0.72, d*0.16, w*0.72, d*0.68); }
    else {
      /* 3D 와 같은 어휘로 두 겹 — 테두리 원 + 안쪽 유리(2026-08-18 사용자 요청).
         한 겹 선만 그으면 작은 배율에서 점으로 보인다. */
      const rr = Math.min(w, d) * 0.34;
      circle(0, d*0.55, rr);
      ctx.beginPath(); ctx.arc(0, d*0.55, rr*0.74, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill(); ctx.stroke();
    }
  } else if (/^TV$|사운드바/.test(cat)){
    // 화면(앞면) 쪽을 굵게 — 어느 방향을 보고 있는지가 TV 배치의 전부다
    ctx.lineWidth = 3.2 / z;
    line(-hw*0.94, d*0.9, hw*0.94, d*0.9);
    ctx.lineWidth = 1.6 / z;
    /*
     * **스탠드 목은 스탠드로 세울 때만 그린다.** TV 를 항상 벽걸이로 배치하도록 바꾼 뒤
     * (2026-08-17) 벽에 건 TV 아래에 받침 목이 그려지고 있었다 — 없는 물건이다.
     * 벽걸이는 대신 **벽에 붙은 쪽**을 짧게 그어 어디에 걸렸는지 보이게 한다.
     */
    if (/^TV$/.test(cat)){
      if (/스탠드/.test(String(it.part || ''))) line(-hw*0.3, d*0.9, hw*0.3, d*0.15);
      else line(-hw*0.5, d*0.06, hw*0.5, d*0.06);              // 벽에 닿는 면
    }
  } else if (/인덕션|전기레인지/.test(cat)){
    /* 화구 수는 이름이 밝힐 때만 그 수를 쓴다(`burnerCount`) — 1구 플레이트에 넷을 그렸었다 */
    const n = burnerCount(it), r = Math.min(w, d) * (n <= 2 ? 0.26 : 0.17);
    if (n === 1) circle(0, d*0.5, r);
    else if (n === 2){ circle(-hw*0.42, d*0.5, r); circle(hw*0.42, d*0.5, r); }
    else if (n === 3){ circle(-hw*0.45, d*0.34, r); circle(hw*0.45, d*0.34, r); circle(0, d*0.74, r); }
    else { circle(-hw*0.45, d*0.34, r); circle(hw*0.45, d*0.34, r);
           circle(-hw*0.45, d*0.72, r); circle(hw*0.45, d*0.72, r); }
  } else if (/식기세척기|전자레인지|오븐|데이코/.test(cat)){
    ctx.strokeRect(-hw*0.8, d*0.2, w*0.8, d*0.6);
  } else if (/공기청정기|청소기|정수기|제습기/.test(cat)){
    circle(0, d*0.5, Math.min(w, d) * 0.3);
  } else if (/에어컨/.test(cat)){
    /*
     * **부품 이름이 물건을 밝힌다**(`실내기`·`실외기`·`판넬`). 예전에는 셋을 똑같이
     * 그려서, 천장에 붙는 35mm 두께 판넬에도 실내기와 같은 토출 호가 붙었다.
     */
    const p = String(it.part || '');
    if (/실외기/.test(p)){
      /* 실외기는 **앞으로 바람을 뿜는다** — 그 방향이 배치의 전부다(이격도 전면 500mm).
         앞면을 굵게 긋고 팬 자리를 원으로 얹는다. */
      ctx.lineWidth = 3.2 / z; line(-hw*0.9, d*0.94, hw*0.9, d*0.94); ctx.lineWidth = 1.6 / z;
      circle(0, d*0.5, Math.min(w, d) * 0.32);
    } else if (/판넬/.test(p)){
      /* 천장에 붙는 사각 판넬 — 위에서 보면 테두리와 가운데 흡입구다 */
      ctx.strokeRect(-hw*0.9, d*0.08, w*0.9, d*0.84);
      ctx.strokeRect(-hw*0.34, d*0.34, w*0.34, d*0.32);
    } else {
      // 바람이 나가는 쪽 — 앞면에 호를 그린다
      ctx.beginPath(); ctx.arc(0, d*0.2, Math.min(w,d)*0.5, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
    }
  /*
   * ── 리빙 4종 (2026-08-14) ─────────────────────────────────────
   * **위에서 봤을 때 실제로 보이는 것만** 그린다. 카탈로그에 규격도가 없으므로
   * 도어 분할선·손잡이 위치 같은 것은 넣지 않는다 — 확인이 안 되면 안 그린다.
   * 여기 그리는 것은 그 물건의 **형태 자체**다: 비데는 변기에 얹는 시트,
   * 선풍기는 원형 날개, 발안마기는 두 발이 들어가는 자리, 욕실케어는 벽에 붙는 사각 판.
   */
  } else if (/리빙 비데/.test(cat)){
    /* 변기 위에 얹는 물건이라 위에서 보면 **시트 구멍**이 전부다.
       뒤쪽(물탱크 쪽)에 조작부가 있어 앞뒤가 구분된다 */
    ctx.beginPath();
    ctx.ellipse(0, d*0.62, w*0.34, d*0.3, 0, 0, Math.PI*2); ctx.stroke();
    line(-hw*0.7, d*0.2, hw*0.7, d*0.2);
  } else if (/리빙 선풍기/.test(cat)){
    /* 위에서 보면 원형 날개 하나 — 받침이 그보다 작다 */
    circle(0, d*0.5, Math.min(w, d)*0.44);
    circle(0, d*0.5, Math.min(w, d)*0.1);
  } else if (/리빙 안마기/.test(cat)){
    /* 발안마기는 발 두 짝이 들어가는 자리가 보인다. 손·복부용(얕은 것)은 한 칸이다 */
    if (d > w*0.7){
      ctx.strokeRect(-hw*0.7, d*0.25, w*0.32, d*0.5);
      ctx.strokeRect(hw*0.06, d*0.25, w*0.32, d*0.5);
    } else ctx.strokeRect(-hw*0.7, d*0.25, w*1.4*0.5, d*0.5);
  } else if (/리빙 욕실케어/.test(cat)){
    /* 벽·천장에 붙는 사각 판 — 가운데 흡·토출구가 보인다 */
    ctx.strokeRect(-hw*0.78, d*0.18, w*0.78*2*0.5, d*0.64);
    circle(0, d*0.5, Math.min(w, d)*0.18);
  }
  ctx.restore();
}

/* ── 그리기 ── */
function draw(){
  /*
   * 3D 를 켠 채로 가전을 고르거나 자동 배치를 돌리면 3D 가 그대로였다 — 상담사가 2D 로
   * 돌아가야 보였다. 2D 를 다시 그리는 순간은 곧 "무언가 바뀌었다"는 뜻이므로 여기서 함께
   * 세운다. 3D 가 켜져 있으면 2D 는 화면에 없으니(`#stage.on3d`) draw 가 자주 불리지도 않는다.
   * `rebuild` 는 화면을 다시 맞추지 않으므로 보던 각도는 그대로다.
   */
  if (window.Place3D && window.Place3D.isOpen) window.Place3D.rebuild();
  const W = cv.width/(window.devicePixelRatio||1), H = cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);

  /*
   * **도면이 주인공이다.**
   * 이 도구가 답하는 것은 "이 집에 이 제품을 놓으면 어떤 느낌인가"이지 "벽이 어디인가"가
   * 아니다. 예전에는 인식 단계에서 원본을 정리본(흑백 마스크)으로 통째로 갈아 끼우고
   * 원본마저 85% 로 흐리게 그렸는데, 그러면 도면의 가구·바닥·색이 사라져 **현장감이
