<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>가전 배치 시뮬레이터</title>
<style>
  :root{
    --ink:#16191C; --muted:#6B7280; --line:#E3E6EA; --bg:#F6F7F8; --card:#fff;
    --brand:#1428A0;            /* 삼성 블루 계열 — 허브 공통 */
    --ok:#0F7A5A; --warn:#B45309; --bad:#B42318;
    --item:#1428A0; --clear:#94A3B8; --wall:#111827;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;
  }
  #app{display:flex;flex-direction:column;height:100%}

  /* ── 단계 안내 ── */
  #steps{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--line);flex:none}
  .step{
    flex:1;padding:9px 6px;text-align:center;font-size:12px;color:var(--muted);
    border-bottom:2px solid transparent;cursor:pointer;user-select:none;
  }
  .step b{display:block;font-size:11px;color:#9AA1AC;font-weight:600}
  .step.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
  .step.on b{color:var(--brand)}
  .step.done b::after{content:" ✓"}

  /* ── 도구막대 ── */
  #bar{
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);flex:none;
  }
  button,select,input[type=number],input[type=text]{
    font:inherit;color:inherit;border:1px solid var(--line);background:#fff;
    border-radius:7px;padding:7px 10px;cursor:pointer;
  }
  button:hover{background:#F2F4F7}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  button:disabled{opacity:.45;cursor:not-allowed}
  select{cursor:pointer;max-width:44vw}
  .hint{color:var(--muted);font-size:12px}
  .grow{flex:1}

  /* ── 본체 ── */
  #main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0;background:
    repeating-linear-gradient(0deg,#EFF1F3 0 1px,transparent 1px 24px),
    repeating-linear-gradient(90deg,#EFF1F3 0 1px,transparent 1px 24px),#FAFBFC;}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #empty{
    position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
    align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);
    pointer-events:none;
  }
  #empty strong{color:var(--ink);font-size:16px}

  /* ── 사이드 ── */
  #side{
    width:290px;flex:none;background:var(--card);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  #side h3{margin:0;padding:10px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);
    letter-spacing:.02em}
  #list{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
  .row{
    border:1px solid var(--line);border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:3px;
    cursor:pointer;
  }
  .row.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(20,40,160,.1)}
  .row .t{font-weight:650;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .row .m{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .row .w{font-size:11.5px;color:var(--bad)}
  .row .w.ok{color:var(--ok)}
  .row .s{font-size:11px;color:var(--warn);line-height:1.35}
  .pill{font-size:10px;padding:1px 6px;border-radius:99px;background:#EEF2FF;color:var(--brand);font-weight:600;flex:none}
  /* 허브의 '개발자에게 문의하기' 떠 있는 버튼이 우하단을 가려 아래 여백을 둔다 */
  #report{border-top:1px solid var(--line);padding:10px 12px 62px;font-size:12px;display:flex;flex-direction:column;gap:5px}
  #report .r{display:flex;gap:6px;align-items:flex-start}
  #report .dot{width:7px;height:7px;border-radius:99px;margin-top:5px;flex:none}

  /* ── 모달 ── */
  #modal{position:absolute;inset:0;background:rgba(15,18,22,.42);display:none;align-items:center;
    justify-content:center;padding:16px;z-index:20}
  #modal.on{display:flex}
  .sheet{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:86%;overflow:auto;
    padding:16px;display:flex;flex-direction:column;gap:12px}
  .sheet h2{margin:0;font-size:16px}
  .pickers{display:flex;flex-direction:column;gap:8px}
  .pickers label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .pickers select{max-width:none;width:100%}
  .spec{background:#F7F8FA;border-radius:8px;padding:9px 10px;font-size:12px;color:var(--muted);
    display:flex;flex-direction:column;gap:3px}
  .spec b{color:var(--ink);font-variant-numeric:tabular-nums}
  .src{font-size:11px;color:#8A9099;line-height:1.4}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .picklist{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto;
    border:1px solid var(--line);border-radius:8px;padding:6px}
  .pick{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
  .pick:hover{background:#F4F6F9}
  .pick input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--brand);margin:0}
  .pick .nm{flex:none;min-width:104px;font-size:13px;color:var(--ink)}
  .pick select{flex:1;min-width:0;padding:5px 7px;font-size:12px}
  .pick input[type=number]{width:52px;padding:5px 6px;font-size:12px;text-align:center}
  .pick .unit{flex:none;font-size:12px;color:var(--muted)}

  @media (max-width:760px){
    #side{position:absolute;right:0;top:0;bottom:0;width:min(84vw,300px);transform:translateX(100%);
      transition:transform .2s;z-index:15;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
    #side.on{transform:none}
    select{max-width:38vw}
  }
</style>
</head>
<body>
<div id="app">

  <div id="steps">
    <div class="step on" data-step="1"><b>1</b>도면 올리기</div>
    <div class="step" data-step="2"><b>2</b>축척 맞추기</div>
    <div class="step" data-step="3"><b>3</b>벽 인식</div>
    <div class="step" data-step="4"><b>4</b>가전 배치</div>
  </div>

  <div id="bar">
    <input type="file" id="file" accept="image/*" hidden>
    <button id="btn-img">도면 이미지</button>
    <button id="btn-scale">축척 맞추기</button>
    <button id="btn-detect">벽 자동 인식</button>
    <button id="btn-wall">벽 그리기</button>
    <button id="btn-add">가전 선택</button>
    <button id="btn-auto" class="primary">주방 배치 추천</button>
    <span class="grow"></span>
    <span class="hint" id="status">도면 없이 벽만 그려도 됩니다</span>
    <button id="btn-side" class="ghost" title="목록">☰</button>
  </div>

  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="empty">
        <strong>도면을 올리고 축척을 맞추면 시작합니다</strong>
        <span>도면을 올리면 <b>벽을 자동으로 인식</b>합니다. 그 뒤 가전을 체크해 고르면 이격거리에 맞춰 놓아 드립니다.</span>
        <span>도면이 없으면 <b>벽 그리기</b>로 방 크기를 직접 입력해도 됩니다.</span>
      </div>
      <div id="modal"><div class="sheet" id="sheet"></div></div>
    </div>

    <aside id="side">
      <h3>배치 목록</h3>
      <div id="list"></div>
      <div id="report"></div>
    </aside>
  </div>
</div>

<script>
/* ────────────────────────────────────────────────────────────────
   가전 배치 시뮬레이터

   목적 — 상담 중에 "이 자리에 들어갑니까"를 도면 위에서 바로 보여준다.

   설계 원칙
   ① 도면 자동 인식은 하지 않는다. 도면마다 축척·선 두께·표기가 달라 벽을 몇 cm씩
      틀리게 잡는데, 그 오차가 그대로 "들어간다/안 들어간다" 판정이 된다. 대신
      사용자가 도면의 치수선 하나를 클릭해 축척을 확정하고 벽을 직접 그린다.
      판정 근거가 사용자가 확인한 실제 치수에 묶인다.
   ② 이격거리는 설치환경 가이드(INSTALL_DB)에 실제로 적힌 값만 쓴다. 값이 없는
      카테고리는 이격 0으로 두고 "확인된 이격거리 없음"이라고 표시한다 —
      추정치를 넣어 통과시키면 현장에서 사고가 난다.
   ③ 치수는 모델파인더 DB에서 뽑은 카탈로그 검증값(size-reps.json)만 쓴다.

   좌표계 — 월드 좌표는 mm. 화면 좌표는 월드 × zoom + pan.
   가전은 "뒷면 중앙"을 기준점으로 잡는다. 벽에 붙이는 물건이라 뒷면이 기준이어야
   회전·이격 계산이 자연스럽다.
──────────────────────────────────────────────────────────────── */

const $ = (s) => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');

/* ── 이격거리표 ──────────────────────────────────────────────────
   출처는 전부 설치환경 가이드(public/install-app.html)의 space 항목이다.
   back  : 후면(벽쪽) 이격
   side  : 좌우 이격
   front : 도어 개폐 등 전면에 필요한 여유. "도어 오픈 시 깊이 − 본체 깊이"로 계산된
           값만 넣었다. 확인되지 않은 카테고리는 넣지 않는다.
   설치 상담에서 치수 오류는 바로 사고이므로, 근거가 없으면 비워 두는 쪽을 택했다.
──────────────────────────────────────────────────────────────── */
const CLEAR = {
  '냉장고':        { back:50, side:0, front:0,
    src:'프리스탠딩 후면 최소 50mm (설치환경 가이드 · 냉장고 4도어 프리스탠딩) 기준. 키친핏(빌트인)은 벽이 아니라 냉장고장 내측 이격이라 값이 다르다 — 4도어 키친핏은 Infinite Line 각 12mm, Bespoke는 4mm 또는 12mm(용량대별로 상이해 확정되지 않음), 키친핏 Max는 4mm, 1도어는 Infinite 5mm·Bespoke 12mm. 빌트인 상담은 설치환경 가이드에서 해당 유형을 직접 확인할 것.' },
  '김치냉장고':    { back:100, side:50, front:0,
    src:'스탠드형 후면 100mm · 냉장고장과 양측 각 50mm (RQ48A9001S9 · RQ33C71G1S9 기준). 뚜껑형은 양면·후면 각 50mm.' },
  '세탁기·콤보':   { back:50, side:20, front:555,
    src:'양옆 각 20mm · 후면 25~50mm 중 큰 값 채택. 전면은 콤보 도어 오픈 시 1,430mm − 본체 875mm = 555mm (WD90F25*** 기준).' },
  '건조기':        { back:20, side:20, front:0,
    src:'양옆 각 20mm · 후면 20mm (Bespoke AI 건조기 직배수 단독 설치 기준).' },
  '에어드레서':    { back:15, side:2.5, front:0,
    src:'좌우 이격 2.5mm · 상단 이격 25mm · 후면 이격 15mm. 좌우 2.5mm는 현재 판매 라인업(DF*0H24R**·DF24CB******·DF18CB******) 기준이고, 구형 Bespoke 라인은 14mm가 필요하다 — 아래 모델별 예외 참조.' },
  '슈드레서':      { back:15, side:2.5, front:0, src:'에어드레서 기준을 준용(전용 수치 미확인).' , weak:true },
  '전자레인지/오븐':{ back:100, side:100, front:0,
    src:'후면 이격 10cm 이상(후면에 콘센트·멀티탭이 있으면 15cm 이상) · 좌우 이격 10cm 이상 · 상단 이격 20cm 이상.' },
  '공기청정기':    { back:600, side:0, front:0,
    src:'벽면 이격 최소 60cm 권장. 비스포크 양측면 흡입 모델은 벽에 근접해도 효율 저하가 적다. (출처인 삼성뉴스룸이 2026-08-04 재접속에 실패해 그날 재확인은 되지 않았다)' },
  'TV':            { back:15, side:100, front:0,
    src:'제품–벽 최소 15mm · 상하좌우 100mm (벽걸이 기준).' },
  '청소기':        { back:20, side:0, front:800,
    src:'청정스테이션 후면 20mm · 프리스탠딩은 전면 800mm 이내 장애물이 없어야 한다.' },
  '식기세척기':    { back:0, side:0, front:0,
    src:'설치 개구부 기준으로 관리한다 — 빌트인 600×815~900×575mm 이상, 프리스탠딩 600×845~895×600mm 이상, 카운터탑 555×470×510mm 이상.' },
  '에어컨':        { back:0, side:0, front:0,
    src:'실내기 이격은 가이드에 수치가 없다. 실외기는 벽·장애물 100mm 이상, 전면 500mm, 후면 100~150mm.' , weak:true },
  '냉동고':        { back:50, side:50, front:0, src:'김치냉장고 뚜껑형 기준을 준용(전용 수치 미확인).', weak:true },
};
const OUTDOOR = { back:150, side:100, front:500,
  src:'실외기 — 벽·장애물 100mm 이상, 전면 흡배기 500mm 권장, 후면 100~150mm.' };

/* ── 도어 오픈 공간 ──────────────────────────────────────────────
   문을 열었을 때 옆으로 튀어나오는 공간. 설치환경 가이드에 "도어 오픈 시 전체 폭"이나
   "도어 측면 최소 여유"가 적힌 유형만 넣는다.

   **하드 판정이 아니라 주의 경고로 다룬다.** 이유가 셋이다.
     ① 힌지 방향(좌/우)을 알 수 없다 — 가이드에도 "도어 오픈 방향 변경 가능 여부 확인"으로만
        적혀 있다. 그래서 양쪽에 그린다.
     ② 4도어는 246~295mm로 모델별 편차가 있다(큰 값을 쓴다).
     ③ 이걸 이격거리처럼 하드 판정으로 걸면 실제 주방 대부분이 "배치 불가"가 되어
        도구가 쓸모없어진다. 옆에 벽이 있어도 문은 열리는 경우가 많다.
   즉 "여기 문이 안 열릴 수 있으니 실측하세요"를 보여주는 것이 목적이다.

   전면으로 열리는 깊이(세탁기 콤보 도어 오픈 시 1,430mm 등)는 CLEAR의 front에 이미 들어 있다.
   뚜껑형 김치냉장고·통버블 세탁기는 위로 열려 평면 배치에 영향이 없다(상부 장애물만 확인).
──────────────────────────────────────────────────────────────── */
const DOOR_ZONE = [
  { cat:'냉장고', group:/양문형/, side:407,
    src:'양문형은 도어 오픈 시 전체 폭 1,726mm — 본체 폭 912mm을 빼면 좌우 각 407mm다 (RS63R557EB4·RS84B508115 설치 규격도, samsung.com 2026-08-04). 814~841L급(RH81R9151S8)은 1,670mm라 각 379mm.' },
  { cat:'냉장고', group:/4도어|패밀리허브|프리스탠딩/, side:295,
    src:'4도어 프리스탠딩 도어 측면 최소 여유 246~295mm(모델별 상이, 도어 오픈 시 간섭 방지용) 중 큰 값. 힌지 방향을 알 수 없어 좌우 양쪽에 표시한다.' },
];
/* 위로 열려 평면에 영향이 없는 유형 — 상부 장애물만 안내한다 */
const TOP_OPEN = [
  { cat:'김치냉장고', group:/뚜껑형/, note:'뚜껑형은 상부 개폐(도어 오픈 92°)라 평면 배치에는 영향이 없습니다. 위쪽 선반·조명 등 장애물만 확인하세요.' },
  { cat:'세탁기·콤보', group:/통버블/, note:'통버블은 상부 개폐라 평면 배치에는 영향이 없습니다. 도어 오픈 높이 1,480~1,510mm(모델별)를 확인하세요.' },
];
const findRule = (list, it) =>
  list.find((r) => r.cat === it.cat && (!r.group || r.group.test(it.group || ''))) || null;
const doorZoneFor = (it) => findRule(DOOR_ZONE, it);
const topOpenFor  = (it) => findRule(TOP_OPEN, it);

const state = {
  img:null, imgW:0, imgH:0,
  mmPerPx:null,          // 도면 이미지 1px이 몇 mm인가 (축척 보정 결과)
  scaled:false,          // 월드 좌표가 실제 mm로 확정되었는가
  zoom:0.22, panX:60, panY:60,
  walls:[],              // [{x1,y1,x2,y2}] 월드(mm)
  items:[],              // 배치된 가전
  reps:[],               // size-reps.json
  mode:'idle',           // idle | scale | wall | place
  scalePts:[], wallPts:[], mask:null, draft:null,
  pending:null,          // 배치 대기중인 가전
  sel:null, drag:null,
};

/* ── 좌표 변환 ── */
const toScreen = (x,y) => [x*state.zoom + state.panX, y*state.zoom + state.panY];
const toWorld  = (sx,sy) => [(sx-state.panX)/state.zoom, (sy-state.panY)/state.zoom];

function resize(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);

/* ── 기하 ─────────────────────────────────────────────────────────
   가전은 뒷면 중앙(bx,by)과 각도 a로 표현한다. 로컬 +y가 정면 방향이다.
──────────────────────────────────────────────────────────────── */
function corners(it, pad){
  const p = pad || {back:0,side:0,front:0};
  const hw = it.w/2 + p.side;
  const y0 = -p.back, y1 = it.d + p.front;
  const c = Math.cos(it.a), s = Math.sin(it.a);
  return [[-hw,y0],[hw,y0],[hw,y1],[-hw,y1]]
    .map(([x,y]) => [it.bx + x*c - y*s, it.by + x*s + y*c]);
}

/** 분리축 정리(SAT) — 회전된 사각형끼리의 겹침 판정 */
function overlaps(A, B){
  for (const poly of [A,B]){
    for (let i=0;i<poly.length;i++){
      const [x1,y1] = poly[i], [x2,y2] = poly[(i+1)%poly.length];
      const nx = -(y2-y1), ny = x2-x1;
      let aMin=Infinity,aMax=-Infinity,bMin=Infinity,bMax=-Infinity;
      for (const [x,y] of A){ const p=x*nx+y*ny; if(p<aMin)aMin=p; if(p>aMax)aMax=p; }
      for (const [x,y] of B){ const p=x*nx+y*ny; if(p<bMin)bMin=p; if(p>bMax)bMax=p; }
      if (aMax <= bMin + 1 || bMax <= aMin + 1) return false;  // 1mm² 이하 접촉은 허용
    }
  }
  return true;
}

/** 점–선분 최근접점 */
function nearestOnSeg(px,py,w){
  const dx=w.x2-w.x1, dy=w.y2-w.y1, L2=dx*dx+dy*dy;
  if (!L2) return {x:w.x1,y:w.y1,t:0,dist:Math.hypot(px-w.x1,py-w.y1)};
  let t=((px-w.x1)*dx+(py-w.y1)*dy)/L2; t=Math.max(0,Math.min(1,t));
  const x=w.x1+t*dx, y=w.y1+t*dy;
  return {x,y,t,dist:Math.hypot(px-x,py-y)};
}

/**
 * 클릭 지점에서 가장 가까운 벽에 붙인다.
 * 법선 부호는 "사용자가 클릭한 쪽"으로 정한다 — 벽 선분의 점 순서에 따라
 * +90°가 벽 바깥을 가리키는 경우가 있어, 각도만 보고 정하면 가전이 방 밖에 놓인다.
 */
function snapToWall(px,py,item){
  if (!state.walls.length) return null;
  let best=null;
  for (const w of state.walls){
    const n = nearestOnSeg(px,py,w);
    if (!best || n.dist < best.n.dist) best = {w,n};
  }
  const {w,n} = best;
  const ang = Math.atan2(w.y2-w.y1, w.x2-w.x1);
  // 벽에 수직인 두 방향 중 클릭 지점이 있는 쪽
  let nx = -Math.sin(ang), ny = Math.cos(ang);
  if ((px-n.x)*nx + (py-n.y)*ny < 0){ nx=-nx; ny=-ny; }
  const back = (item.clear && item.clear.back) || 0;
  return { bx:n.x + nx*back, by:n.y + ny*back, a:Math.atan2(ny,nx) - Math.PI/2, dist:best.n.dist };
}

/** 방(닫힌 벽 폴리곤) 안에 점이 있는가 */
function insideRoom(x,y){
  const pts = wallLoop();
  if (!pts) return true;                       // 닫힌 방이 없으면 판정하지 않는다
  let inside=false;
  for (let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i], [xj,yj]=pts[j];
    if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}
/** 벽이 하나의 닫힌 고리를 이루면 그 정점 목록을 돌려준다 */
function wallLoop(){
  const w = state.walls;
  if (w.length < 3) return null;
  const pts=[[w[0].x1,w[0].y1]];
  for (const s of w) pts.push([s.x2,s.y2]);
  const [fx,fy]=pts[0], [lx,ly]=pts[pts.length-1];
  return Math.hypot(fx-lx,fy-ly) < 1 ? pts.slice(0,-1) : null;
}

/* ── 벽 자동 인식 ────────────────────────────────────────────────
   도면에서 방 하나를 눌러 벽을 자동으로 잡는다.

   **선을 추측해서 그리지 않는다.** 하는 일은 "밝은 영역을 채우고 그 경계를 따라가는 것"
   뿐이다. 도면에서 벽은 굵고 어두운 선이고 방 안은 밝으므로, 방 안쪽을 채우면 그 경계가
   곧 벽 안쪽 면이 된다. 어떤 선이 벽인지 판단하지 않으므로 "벽을 몇 cm 틀리게 잡는" 종류의
   오차가 생기지 않는다.

   **축척은 여전히 사용자가 확정한 값을 쓴다.** 자동 인식은 모양만 잡고, mm는 치수선 보정
   (또는 가장 긴 벽 길이 입력)에서 온다. 그래서 판정 근거는 그대로 사용자가 확인한 치수다.

   결과는 확정이 아니라 초안이다 — 마음에 들지 않으면 '벽 그리기'로 직접 그리면 된다.
──────────────────────────────────────────────────────────────── */
const DETECT_MAX = 900;      // 인식 해상도 상한(픽셀). 큰 도면도 1초 안에 끝나게 한다
const DARK_LUM   = 125;      // 이 밝기 미만이면 벽·글씨 같은 '어두운 것'으로 본다

function buildMask(){
  const S = Math.min(1, DETECT_MAX / Math.max(state.imgW, state.imgH));
  const w = Math.max(1, Math.round(state.imgW * S));
  const h = Math.max(1, Math.round(state.imgH * S));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);      // 투명 배경은 흰색으로 본다
  cx.drawImage(state.img, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;
  const dark = new Uint8Array(w * h);
  for (let i = 0, p = 0; p < w * h; i += 4, p++) {
    const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    dark[p] = lum < DARK_LUM ? 1 : 0;
  }
  return { w, h, S, dark };
}

/** 밝은 영역을 4방향으로 채운다. 도면 바깥까지 새어 나가면 방이 아니라고 판단한다. */
function floodRegion(mask, sx, sy){
  const { w, h, dark } = mask;
  if (sx < 0 || sy < 0 || sx >= w || sy >= h || dark[sy * w + sx]) return null;
  const seen = new Uint8Array(w * h);
  const stack = [sy * w + sx];
  seen[sy * w + sx] = 1;
  let minX = sx, maxX = sx, minY = sy, maxY = sy, count = 0, border = 0;
  while (stack.length) {
    const p = stack.pop();
    const x = p % w, y = (p - x) / w;
    count++;
    if (x === 0 || y === 0 || x === w - 1 || y === h - 1) border++;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (x > 0     && !seen[p - 1] && !dark[p - 1]) { seen[p - 1] = 1; stack.push(p - 1); }
    if (x < w - 1 && !seen[p + 1] && !dark[p + 1]) { seen[p + 1] = 1; stack.push(p + 1); }
    if (y > 0     && !seen[p - w] && !dark[p - w]) { seen[p - w] = 1; stack.push(p - w); }
    if (y < h - 1 && !seen[p + w] && !dark[p + w]) { seen[p + w] = 1; stack.push(p + w); }
  }
  return { seen, minX, maxX, minY, maxY, count, border };
}

/**
 * 채워진 영역의 좌·우 윤곽을 계단으로 압축해 직교 다각형을 만든다.
 * 아파트 도면은 대부분 직각이라 이 방식으로 ㄱ자·ㄷ자 방까지 잡힌다.
 */
function regionPolygon(mask, reg, tol, minRun){
  const { w } = mask;
  const ys = [], lefts = [], rights = [];
  for (let y = reg.minY; y <= reg.maxY; y++) {
    let l = -1, r = -1;
    for (let x = reg.minX; x <= reg.maxX; x++) {
      if (reg.seen[y * w + x]) { if (l < 0) l = x; r = x; }
    }
    if (l >= 0) { ys.push(y); lefts.push(l); rights.push(r); }
  }
  if (ys.length < minRun) return null;

  // 같은 값이 이어지는 구간(계단)으로 묶는다
  const steps = (prof) => {
    const out = [];
    let s = 0;
    for (let i = 1; i <= prof.length; i++) {
      if (i === prof.length || Math.abs(prof[i] - prof[s]) > tol) {
        const seg = prof.slice(s, i).slice().sort((a, b) => a - b);
        out.push({ y0: ys[s], y1: ys[i - 1], v: seg[seg.length >> 1] });
        s = i;
      }
    }
    // 짧은 계단은 노이즈(치수 글씨·가구 표기)라 앞 계단에 흡수시킨다
    const merged = [];
    for (const st of out) {
      const prev = merged[merged.length - 1];
      if (prev && (st.y1 - st.y0) < minRun) { prev.y1 = st.y1; continue; }
      merged.push({ ...st });
    }
    return merged;
  };

  const L = steps(lefts), R = steps(rights);
  if (!L.length || !R.length) return null;

  const pts = [];
  for (const s of L) { pts.push([s.v, s.y0]); pts.push([s.v, s.y1]); }   // 왼쪽 위→아래
  for (let i = R.length - 1; i >= 0; i--) {                              // 오른쪽 아래→위
    const s = R[i];
    pts.push([s.v, s.y1]); pts.push([s.v, s.y0]);
  }
  // 같은 점 연속 제거
  const out = [];
  for (const p of pts) {
    const q = out[out.length - 1];
    if (!q || Math.abs(q[0] - p[0]) > 0.5 || Math.abs(q[1] - p[1]) > 0.5) out.push(p);
  }
  return out.length >= 4 ? out : null;
}

/**
 * 도면의 (imgX, imgY) 지점이 속한 방을 인식해 벽 후보를 돌려준다.
 * 실패 사유를 문자열로 함께 돌려줘 화면에 그대로 보여준다.
 */
function detectRoomAt(imgX, imgY){
  if (!state.img) return { error: '도면을 먼저 올려주세요.' };
  const mask = state.mask || (state.mask = buildMask());
  const sx = Math.round(imgX * mask.S), sy = Math.round(imgY * mask.S);
  const reg = floodRegion(mask, sx, sy);
  if (!reg) return { error: '누른 자리가 벽·글씨 위입니다. 방 안쪽의 빈 곳을 눌러주세요.' };

  const area = mask.w * mask.h;
  if (reg.count < area * 0.002) return { error: '인식된 공간이 너무 작습니다. 방 한가운데를 눌러주세요.' };
  if (reg.border > (mask.w + mask.h) * 0.3) {
    return { error: '도면 바깥까지 이어져 있습니다 — 벽이 끊긴 곳으로 새어 나갔습니다. 방 안쪽을 누르거나 벽 그리기로 직접 그려주세요.' };
  }

  const tol = Math.max(2, Math.round(Math.max(mask.w, mask.h) * 0.006));
  const minRun = Math.max(4, Math.round(Math.max(mask.w, mask.h) * 0.02));
  const poly = regionPolygon(mask, reg, tol, minRun);
  if (!poly) return { error: '방 모양을 잡지 못했습니다. 벽 그리기로 직접 그려주세요.' };

  // 인식 해상도 → 도면 이미지 픽셀
  return { poly: poly.map(([x, y]) => [x / mask.S, y / mask.S]), reg, mask };
}

/** 인식한 다각형(도면 픽셀)을 실제 벽으로 확정한다 */
function applyDetected(polyImg){
  const k = state.mmPerPx || 1;                 // 축척이 없으면 나중에 벽 길이로 환산한다
  const pts = polyImg.map(([x, y]) => [x * k, y * k]);
  const segs = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    segs.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] });
  }
  state.walls = [];
  if (!state.scaled) { askWallLength(segs); return; }
  state.walls.push(...segs);
  setMode('idle'); setStep(4); evaluate(); draw();
}

function startDetect(){
  if (!state.img){
    sheet(`<h2>도면을 먼저 올려주세요</h2>
      <p class="hint">벽 자동 인식은 도면 이미지에서 방을 찾아냅니다. 도면이 없으면
        <b>벽 그리기</b>로 방 크기를 직접 입력하시면 됩니다.</p>
      <div class="modal-actions"><button id="c">벽 그리기</button><button class="primary" id="ok">도면 올리기</button></div>`,
      ()=>{ $('#ok').onclick=()=>{closeSheet(); $('#btn-img').click();};
            $('#c').onclick =()=>{closeSheet(); $('#btn-wall').click();}; });
    return;
  }
  state.draft = null; setMode('detect'); setStep(3); draw();
}

/** 도면을 올리고 축척을 맞춘 직후, 가운데를 눌러본 셈 치고 한 번 자동으로 시도한다 */
function autoDetectCenter(){
  const r = detectRoomAt(state.imgW/2, state.imgH/2);
  if (r.error){ setMode('detect'); toast('가운데 자동 인식이 안 됐습니다 — 방 안쪽을 눌러주세요'); draw(); return; }
  state.draft = r.poly; setMode('detect'); draw();
  confirmDetected(true);
}

function confirmDetected(auto){
  const poly = state.draft;
  if (!poly) return;
  // 면적과 최장변을 미리 보여줘 사용자가 눈으로 검산할 수 있게 한다
  const k = state.mmPerPx || 1;
  let long = 0;
  for (let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    long = Math.max(long, Math.hypot(b[0]-a[0], b[1]-a[1]) * k);
  }
  const sizeTxt = state.scaled
    ? `가장 긴 벽 <b>${Math.round(long).toLocaleString()}mm</b> · 모서리 ${poly.length}개`
    : `모서리 ${poly.length}개 — 실제 길이는 다음 단계에서 입력합니다`;
  sheet(`<h2>이 방으로 잡을까요?</h2>
    <p class="hint">${auto ? '도면 가운데를 기준으로 자동 인식했습니다. ' : ''}파란 굵은 선이 인식된 벽입니다.
      도면과 다르면 <b>다시 누르기</b>로 다른 방을 고르거나 <b>직접 그리기</b>로 그리세요.</p>
    <div class="spec">${sizeTxt}</div>
    <p class="src">벽 모양만 자동으로 잡습니다. 실제 치수는 축척 보정(또는 벽 길이 입력)에서 온 값을 씁니다 —
      도면 선을 추측해서 치수를 만들지 않습니다.</p>
    <div class="modal-actions">
      <button id="draw">직접 그리기</button>
      <button id="again">다시 누르기</button>
      <button class="primary" id="ok">이 방으로 확정</button>
    </div>`,
    ()=>{
      $('#ok').onclick   = ()=>{ closeSheet(); const p=state.draft; state.draft=null; applyDetected(p); };
      $('#again').onclick= ()=>{ closeSheet(); state.draft=null; setMode('detect'); draw(); };
      $('#draw').onclick = ()=>{ closeSheet(); state.draft=null; state.wallPts=[]; setMode('wall'); draw(); };
    });
}

/* 짧은 안내 — 모달을 띄울 만큼은 아닌 것들 */
let toastTimer = null;
function toast(msg){
  $('#status').textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(renderSide, 4000);
}

/**
 * 이 위치에 놓을 수 없는 이유를 돌려준다(놓을 수 있으면 null).
 * 드래그 중에 호출해 "겹친 채로 놓이는 상태" 자체를 만들지 않는다 —
 * 설치할 수 없는 배치를 화면에 그려 두면 상담 중에 그대로 읽힌다.
 *
 * 본체 겹침과 이격 침범은 막고, 도어 오픈은 막지 않는다. 힌지 방향(좌/우)을 알 수 없어
 * 양쪽에 그리기 때문에, 막아 버리면 실제로는 열리는 자리도 못 놓게 된다. 대신 경고로 남긴다.
 */
function collisionAt(it){
  const body = corners(it), clear = corners(it, it.clear);
  if (wallLoop() && body.some(([x,y]) => !insideRoom(x,y))) return '방 밖으로 나갑니다';
  for (const o of state.items){
    if (o === it) continue;
    if (overlaps(body, corners(o))) return `${o.label}와 겹칩니다`;
    if (overlaps(clear, corners(o, o.clear))) return `${o.label}와 이격거리가 부족합니다`;
  }
  return null;
}

/* ── 판정 ── */
function evaluate(){
  const items = state.items;
  for (const it of items){ it.warn = []; it.soft = []; }
  const closed = !!wallLoop();
  for (let i=0;i<items.length;i++){
    const A = items[i];
    const Abody = corners(A), Aclear = corners(A, A.clear);
    // 방 밖으로 나가는가
    if (closed && Abody.some(([x,y]) => !insideRoom(x,y))) A.warn.push('방 밖으로 나감');
    for (let j=i+1;j<items.length;j++){
      const B = items[j];
      const Bbody = corners(B), Bclear = corners(B, B.clear);
      if (overlaps(Abody,Bbody)){
        A.warn.push(`${B.label}와 겹침`); B.warn.push(`${A.label}와 겹침`);
      } else if (overlaps(Aclear,Bclear)){
        A.warn.push(`${B.label}와 이격거리 부족`); B.warn.push(`${A.label}와 이격거리 부족`);
      }
    }
    // ── 도어 오픈 공간 (주의 경고) ──
    const dz = doorZoneFor(A);
    if (dz){
      const zone = corners(A, { back:0, side:dz.side, front:0 });
      if (closed && zone.some(([x,y]) => !insideRoom(x,y))) {
        A.soft.push(`도어 오픈 공간(좌우 ${dz.side}mm)이 벽에 닿습니다 — 실측 확인`);
      }
      for (const B of items){
        if (B === A) continue;
        if (overlaps(zone, corners(B))) {
          A.soft.push(`${B.label}가 도어 오픈 공간 안에 있습니다 — 실측 확인`);
          break;
        }
      }
    }
    const to = topOpenFor(A);
    if (to) A.soft.push(to.note);
  }
}

/* ── 그리기 ── */
function draw(){
  const W = cv.width/(window.devicePixelRatio||1), H = cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);

  if (state.img && state.mmPerPx){
    const [x,y] = toScreen(0,0);
    ctx.globalAlpha=.85;
    ctx.drawImage(state.img, x, y, state.imgW*state.mmPerPx*state.zoom, state.imgH*state.mmPerPx*state.zoom);
    ctx.globalAlpha=1;
  } else if (state.img){
    // 축척 확정 전 — 이미지 1px을 화면 zoom px로 그린다(월드 단위가 아직 mm가 아니다)
    const [x,y] = toScreen(0,0);
    ctx.globalAlpha=.85;
    ctx.drawImage(state.img, x, y, state.imgW*state.zoom, state.imgH*state.zoom);
    ctx.globalAlpha=1;
  }

  // 벽
  ctx.lineCap='round';
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--wall').trim()||'#111';
  ctx.lineWidth=4;
  for (const w of state.walls){
    const [ax,ay]=toScreen(w.x1,w.y1), [bx,by]=toScreen(w.x2,w.y2);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    // 길이 표기
    const mx=(ax+bx)/2, my=(ay+by)/2, L=Math.hypot(w.x2-w.x1,w.y2-w.y1);
    ctx.fillStyle='#374151'; ctx.font='11px ui-monospace,monospace'; ctx.textAlign='center';
    ctx.fillText(`${Math.round(L).toLocaleString()}mm`, mx, my-6);
  }
  // 그리는 중인 벽
  if (state.mode==='wall' && state.wallPts.length){
    ctx.strokeStyle='#1428A0'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath();
    state.wallPts.forEach(([x,y],i)=>{ const [sx,sy]=toScreen(x,y); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.stroke(); ctx.setLineDash([]);
    for (const [x,y] of state.wallPts){ const [sx,sy]=toScreen(x,y);
      ctx.fillStyle='#1428A0'; ctx.beginPath(); ctx.arc(sx,sy,4,0,7); ctx.fill(); }
  }
  // 자동 인식 초안
  if (state.draft && state.draft.length){
    const k = state.mmPerPx || 1;
    ctx.strokeStyle='#1428A0'; ctx.lineWidth=5; ctx.lineJoin='round';
    ctx.beginPath();
    state.draft.forEach(([ix,iy],i)=>{ const [sx,sy]=toScreen(ix*k, iy*k); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle='rgba(20,40,160,.06)'; ctx.fill();
  }

  // 축척 보정 점
  for (const [x,y] of state.scalePts){
    ctx.fillStyle='#B45309'; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
  }

  // 가전
  for (const it of state.items){
    const body = corners(it).map(([x,y])=>toScreen(x,y));
    const cl   = corners(it, it.clear).map(([x,y])=>toScreen(x,y));
    const bad  = it.warn && it.warn.length;

    // 도어 오픈 공간 — 이격보다 먼저(아래) 그려 이격선을 가리지 않게 한다
    const dz = doorZoneFor(it);
    if (dz){
      const zone = corners(it, {back:0, side:dz.side, front:0}).map(([x,y])=>toScreen(x,y));
      ctx.beginPath(); zone.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
      ctx.fillStyle = 'rgba(180,83,9,.07)'; ctx.fill();
      ctx.setLineDash([2,3]); ctx.lineWidth=1; ctx.strokeStyle='#B45309'; ctx.stroke();
      ctx.setLineDash([]);
    }

    // 이격 영역
    if (it.clear.back||it.clear.side||it.clear.front){
      ctx.setLineDash([5,4]); ctx.lineWidth=1;
      ctx.strokeStyle= bad ? '#B42318' : '#94A3B8';
      ctx.beginPath(); cl.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.stroke();
      ctx.setLineDash([]);
    }
    // 본체
    ctx.beginPath(); body.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
    ctx.fillStyle = bad ? 'rgba(180,35,24,.14)' : 'rgba(20,40,160,.13)';
    ctx.fill();
    ctx.strokeStyle = bad ? '#B42318' : (state.sel===it.id ? '#1428A0' : '#334155');
    ctx.lineWidth = state.sel===it.id ? 2.5 : 1.6; ctx.stroke();

    // 정면 표시(도어가 열리는 쪽)
    const [f1,f2] = [body[3], body[2]];
    ctx.beginPath(); ctx.moveTo(f1[0],f1[1]); ctx.lineTo(f2[0],f2[1]);
    ctx.strokeStyle = bad ? '#B42318' : '#1428A0'; ctx.lineWidth=3; ctx.stroke();

    // 라벨
    const cx=(body[0][0]+body[2][0])/2, cy=(body[0][1]+body[2][1])/2;
    ctx.fillStyle='#111827'; ctx.font='600 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(it.label, cx, cy+4);
  }
  renderSide();
}

/* ── 사이드 목록 ── */
function renderSide(){
  const list = $('#list');
  if (!state.items.length){
    list.innerHTML = '<p class="hint" style="padding:10px">아직 배치한 가전이 없습니다.</p>';
  } else {
    list.innerHTML = state.items.map((it)=>`
      <div class="row ${state.sel===it.id?'sel':''}" data-id="${it.id}">
        <div class="t">${esc(it.label)}<span class="pill">${esc(it.size)}</span></div>
        <div class="m">${esc(it.model)} · ${Math.round(it.w)}×${Math.round(it.h)}×${Math.round(it.d)}mm</div>
        <div class="m">이격 후면 ${it.clear.back} · 좌우 ${it.clear.side}${it.clear.front?` · 전면 ${it.clear.front}`:''}mm</div>
        <div class="w ${it.warn&&it.warn.length?'':'ok'}">${it.warn&&it.warn.length?esc(it.warn.join(' / ')):'배치 가능'}</div>
        ${it.soft&&it.soft.length?`<div class="s">${esc(it.soft.join(' / '))}</div>`:''}
      </div>`).join('');
  }
  const bad = state.items.filter((i)=>i.warn&&i.warn.length).length;
  const soft = state.items.filter((i)=>i.soft&&i.soft.length).length;
  const loop = wallLoop();
  $('#report').innerHTML = [
    row(state.scaled?'ok':'warn', state.mmPerPx ? `축척 확정 (도면 1px = ${state.mmPerPx.toFixed(2)}mm)` : (state.scaled ? '축척 확정 (벽 실제 길이 입력 기준)' : '축척 미확정 — 벽을 그리고 실제 길이를 입력하세요')),
    row(loop?'ok':(state.walls.length?'warn':'bad'), loop ? `방 닫힘 (벽 ${state.walls.length}개)` : (state.walls.length?`벽 ${state.walls.length}개 — 닫히지 않아 "방 밖" 판정을 하지 않습니다`:'벽 없음 — 벽 스냅·방 밖 판정 불가')),
    row(bad?'bad':'ok', bad ? `문제 ${bad}건` : `배치 ${state.items.length}건 · 문제 없음`),
    ...(soft ? [row('warn', `도어 오픈 등 확인 필요 ${soft}건 — 주황 점선 구역`)] : []),
  ].join('');
  $('#status').textContent = {
    idle:'가전을 끌어 옮기고, 두 번 누르면 90° 회전 · 겹치는 자리에는 놓이지 않습니다',
    scale:'도면에서 길이를 아는 두 점을 차례로 누르세요',
    wall:'벽 모서리를 차례로 누르고, 시작점을 다시 누르면 닫힙니다',
    detect:'배치할 방 안쪽의 빈 곳을 한 번 누르세요 — 벽을 자동으로 잡습니다',
    place:'놓을 위치를 누르세요 — 가까운 벽에 붙습니다',
  }[state.mode];
}
const COLOR = { ok:'#0F7A5A', warn:'#B45309', bad:'#B42318' };
const row = (k,t) => `<div class="r"><span class="dot" style="background:${COLOR[k]}"></span><span>${esc(t)}</span></div>`;
const esc = (s) => String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 입력 ─────────────────────────────────────────────────────── */
let ptr = null;
cv.addEventListener('pointerdown', (e)=>{
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const [wx,wy] = toWorld(sx,sy);

  if (state.mode==='detect'){
    // 화면 → 도면 이미지 픽셀
    const k = state.mmPerPx || 1;
    const ix = wx / k, iy = wy / k;
    const r = detectRoomAt(ix, iy);
    if (r.error){ toast(r.error); return; }
    state.draft = r.poly; draw();
    confirmDetected();
    return;
  }
  if (state.mode==='scale'){
    state.scalePts.push([sx,sy]);
    if (state.scalePts.length===2) askScale();
    draw(); return;
  }
  if (state.mode==='wall'){
    const first = state.wallPts[0];
    if (first && state.wallPts.length>2){
      const [fx,fy] = toScreen(first[0],first[1]);
      if (Math.hypot(fx-sx,fy-sy) < 14){ state.wallPts.push([first[0],first[1]]); commitWalls(); return; }
    }
    state.wallPts.push([wx,wy]); draw(); return;
  }
  if (state.mode==='place' && state.pending){
    placeAt(wx,wy); return;
  }

  // 선택 / 드래그
  const hit = [...state.items].reverse().find((it)=>pointIn(corners(it), wx, wy));
  if (hit){
    if (state.sel===hit.id && ptr && Date.now()-ptr.t < 400){ hit.a += Math.PI/2; evaluate(); draw(); return; }
    state.sel = hit.id;
    state.drag = { id:hit.id, ox:wx-hit.bx, oy:wy-hit.by };
    ptr = { t:Date.now() };
    cv.setPointerCapture(e.pointerId);
  } else {
    state.sel = null;
    state.drag = { pan:true, sx, sy, px:state.panX, py:state.panY };
    cv.setPointerCapture(e.pointerId);
  }
  draw();
});
cv.addEventListener('pointermove', (e)=>{
  if (!state.drag) return;
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  if (state.drag.pan){
    state.panX = state.drag.px + (sx-state.drag.sx);
    state.panY = state.drag.py + (sy-state.drag.sy);
    draw(); return;
  }
  const it = state.items.find((x)=>x.id===state.drag.id); if (!it) return;
  const [wx,wy] = toWorld(sx,sy);
  const prev = { bx:it.bx, by:it.by, a:it.a };

  // 자유 이동이 기본이고, 벽에 아주 가까이 가져갔을 때만 붙는다(예전 600mm는 너무 넓어
  // 방 한가운데에 두려 해도 자꾸 벽으로 끌려갔다).
  const snap = snapToWall(wx-state.drag.ox, wy-state.drag.oy, it);
  if (snap && snap.dist < 180){ it.bx=snap.bx; it.by=snap.by; it.a=snap.a; }
  else { it.bx = wx-state.drag.ox; it.by = wy-state.drag.oy; }

  // 겹치면 그 자리에 놓지 않는다 — 설치할 수 없는 배치를 화면에 만들지 않기 위함.
  const clash = collisionAt(it);
  if (clash){ Object.assign(it, prev); toast(clash); }
  evaluate(); draw();
});
cv.addEventListener('pointerup', ()=>{ state.drag=null; });
cv.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const r = cv.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
  const [wx,wy] = toWorld(sx,sy);
  state.zoom = Math.max(0.02, Math.min(3, state.zoom * (e.deltaY<0?1.12:1/1.12)));
  state.panX = sx - wx*state.zoom; state.panY = sy - wy*state.zoom;
  draw();
}, {passive:false});

function pointIn(poly,x,y){
  let inside=false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i], [xj,yj]=poly[j];
    if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

$('#list').addEventListener('click',(e)=>{
  const r = e.target.closest('.row'); if(!r) return;
  state.sel = r.dataset.id; draw();
});
document.addEventListener('keydown',(e)=>{
  if (!state.sel) return;
  const it = state.items.find((x)=>x.id===state.sel); if(!it) return;
  if (e.key==='r'||e.key==='R'){ it.a += Math.PI/2; evaluate(); draw(); }
  if (e.key==='Delete'||e.key==='Backspace'){ state.items=state.items.filter((x)=>x!==it); state.sel=null; evaluate(); draw(); }
});

/* ── 단계별 동작 ── */
$('#btn-img').onclick = ()=> $('#file').click();
$('#file').onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    state.img=img; state.imgW=img.naturalWidth; state.imgH=img.naturalHeight;
    state.mmPerPx=null; state.scaled=false; state.scalePts=[]; state.mask=null; state.walls=[];
    // 도면 전체가 화면에 들어오도록 배율을 잡는다. 이걸 안 하면 1,000px이 넘는 보통
    // 도면에서 치수선 한쪽 끝이 화면 밖으로 나가 축척을 맞출 수가 없다.
    const r = cv.getBoundingClientRect();
    state.zoom = Math.min(r.width/state.imgW, r.height/state.imgH) * 0.92;
    state.panX = 12; state.panY = 12;
    $('#empty').style.display='none';
    setStep(2); setMode('scale'); draw();
  };
  img.src = URL.createObjectURL(f);
};
$('#btn-scale').onclick = ()=>{ state.scalePts=[]; setMode('scale'); setStep(2); draw(); };
$('#btn-wall').onclick  = ()=>{ state.wallPts=[]; setMode('wall'); setStep(3); draw(); };
$('#btn-detect').onclick= ()=> startDetect();
$('#btn-add').onclick   = ()=> openSelect(null);
$('#btn-auto').onclick  = ()=> openSelect('주방');
$('#btn-side').onclick  = ()=> $('#side').classList.toggle('on');
$('#steps').onclick = (e)=>{ const s=e.target.closest('.step'); if(!s) return;
  const n=+s.dataset.step; if(n===1)$('#btn-img').click(); if(n===2)$('#btn-scale').click();
  if(n===3)$('#btn-detect').click(); if(n===4)openSelect(null); };

function setMode(m){ state.mode=m; renderSide(); }
function setStep(n){ document.querySelectorAll('.step').forEach((s)=>{
  const k=+s.dataset.step; s.classList.toggle('on', k===n); if(k<n) s.classList.add('done'); }); }

function askScale(){
  const [[x1,y1],[x2,y2]] = state.scalePts;
  const px = Math.hypot(x2-x1,y2-y1) / state.zoom;   // 화면 px → 도면 이미지 px
  sheet(`<h2>축척 맞추기</h2>
    <p class="hint">방금 누른 두 점 사이의 <b>실제 길이</b>를 입력하세요. 도면에 적힌 치수선을 쓰면 가장 정확합니다.</p>
    <label class="pickers"><span class="hint">실제 길이 (mm)</span>
      <input type="number" id="mm" value="3000" min="1" step="10"></label>
    <p class="src">두 점 사이가 도면 이미지에서 ${px.toFixed(1)}px입니다.</p>
    <div class="modal-actions"><button id="c">취소</button><button class="primary" id="ok">확정</button></div>`,
    ()=>{
      $('#ok').onclick = ()=>{
        const mm = +$('#mm').value;
        if (!(mm>0)) return;
        state.mmPerPx = mm / px;
        state.scaled = true;
        // 도면이 화면에 알맞게 들어오도록 초기 배율을 잡는다
        const r = cv.getBoundingClientRect();
        state.zoom = Math.min(r.width/(state.imgW*state.mmPerPx), r.height/(state.imgH*state.mmPerPx)) * 0.9;
        state.panX = 20; state.panY = 20;
        state.scalePts=[]; state.wallPts=[]; closeSheet(); setStep(3); draw();
        autoDetectCenter();
      };
      $('#c').onclick = ()=>{ state.scalePts=[]; closeSheet(); setMode('idle'); draw(); };
    });
}

function commitWalls(){
  const p = state.wallPts;
  const segs = [];
  for (let i=0;i<p.length-1;i++) segs.push({x1:p[i][0],y1:p[i][1],x2:p[i+1][0],y2:p[i+1][1]});
  state.wallPts=[];
  // 축척이 아직 확정되지 않았다면 벽 좌표의 mm 값은 아무 근거가 없다. 그대로 두면
  // "2,227mm" 같은 숫자가 화면에 뜨는데, 상담 중에 그걸 실제 치수로 읽으면 사고다.
  // 그래서 방금 그린 벽 중 가장 긴 것의 실제 길이를 받아 전체를 환산한다.
  if (!state.scaled) askWallLength(segs);
  else { state.walls.push(...segs); setMode('idle'); setStep(4); evaluate(); draw(); }
}

/** 그린 벽 중 가장 긴 것의 실제 길이를 받아 전체 좌표를 실제 mm로 환산한다 */
function askWallLength(segs){
  let li=0, lmax=0;
  segs.forEach((s,i)=>{ const L=Math.hypot(s.x2-s.x1,s.y2-s.y1); if(L>lmax){lmax=L;li=i;} });
  sheet(`<h2>방 크기 확정</h2>
    <p class="hint">지금 그린 벽은 화면상의 모양일 뿐이라 아직 실제 길이를 모릅니다.
      <b>가장 긴 벽</b>의 실제 길이를 입력하면 나머지가 같은 비율로 환산됩니다.</p>
    <label class="pickers"><span class="hint">가장 긴 벽의 실제 길이 (mm)</span>
      <input type="number" id="wl" value="3600" min="100" step="10"></label>
    <p class="src">도면을 올려 축척을 맞춘 경우에는 이 단계가 나오지 않습니다.</p>
    <div class="modal-actions"><button id="c">다시 그리기</button><button class="primary" id="ok">확정</button></div>`,
    ()=>{
      $('#ok').onclick = ()=>{
        const mm = +$('#wl').value;
        if (!(mm>0)) return;
        const k = mm / lmax;
        for (const s of segs){ s.x1*=k; s.y1*=k; s.x2*=k; s.y2*=k; }
        state.walls.push(...segs);
        state.scaled = true;
        state.zoom /= k; state.panX = 24; state.panY = 24;
        closeSheet(); setMode('idle'); setStep(4); evaluate(); draw();
      };
      $('#c').onclick = ()=>{ closeSheet(); setMode('wall'); draw(); };
    });
}

/* ── 가전 고르기 ── */
async function loadReps(){
  if (state.reps.length) return;
  const r = await fetch('size-reps.json');
  state.reps = await r.json();
}
/**
 * 가전 선택 — 체크박스로 여러 종을 한 번에 고른다.
 * 예전에는 드롭다운으로 한 번에 한 종만 골라 도면에 놓는 방식이라, 주방 6종을 넣으려면
 * 같은 절차를 여섯 번 반복해야 했다.
 *
 * room을 주면 그 용도에 맞는 카테고리만 보여주고 미리 체크해 둔다(배치 추천).
 * room이 없으면 전체 카테고리를 체크 없이 보여준다(가전 선택).
 */
async function openSelect(room){
  await loadReps();
  const allCats = [...new Set(state.reps.map((r)=>r.cat))];
  const rooms = ['전체', ...Object.keys(ROOM_PLAN)];
  const start = room || '전체';

  sheet(`<h2>가전 선택</h2>
    <div class="pickers">
      <label>방 용도<select id="a-room">${rooms.map((r)=>`<option${r===start?' selected':''}>${esc(r)}</option>`).join('')}</select></label>
    </div>
    <div id="a-list" class="picklist"></div>
    <p class="src">체크한 가전을 폭이 큰 것부터 긴 벽을 따라 놓습니다. 이격거리와 방 경계를 지키는
      자리를 못 찾으면 억지로 놓지 않고 "자리 없음"으로 알려드립니다. 놓은 뒤에는 끌어서 옮길 수 있고,
      겹치는 자리에는 놓이지 않습니다.</p>
    <div class="modal-actions">
      <button id="c">취소</button>
      <button class="primary" id="ok">도면에 배치</button>
    </div>`,
    ()=>{
      const roomSel = $('#a-room');
      const fill = ()=>{
        const v = roomSel.value;
        const cats = v==='전체' ? allCats : ROOM_PLAN[v].filter((c)=>allCats.includes(c));
        const pre  = v!=='전체';
        $('#a-list').innerHTML = cats.map((c)=>{
          const rows = state.reps.filter((r)=>r.cat===c);
          return `<label class="pick">
            <input type="checkbox" data-cat="${esc(c)}"${pre?' checked':''}>
            <span class="nm">${esc(c)}</span>
            <select data-size="${esc(c)}">
              ${rows.map((r,i)=>`<option value="${i}">${esc(r.size)}${r.specs.length?` — ${esc(r.specs[0])}`:''}</option>`).join('')}
            </select>
            <input type="number" data-qty="${esc(c)}" value="1" min="1" max="6" title="수량">
            <span class="unit">대</span></label>`;
        }).join('');
        // 체크박스 외의 곳(사이즈·수량)을 눌렀을 때 체크가 토글되지 않게 한다
        $('#a-list').querySelectorAll('select,input[type=number]').forEach((el)=>{
          el.addEventListener('click',(e)=>e.stopPropagation());
          el.addEventListener('change',(e)=>{
            e.stopPropagation();
            const box = el.closest('.pick').querySelector('input[type=checkbox]');
            box.checked = true;      // 사이즈를 고르면 쓰겠다는 뜻이다
          });
        });
      };
      roomSel.onchange = fill; fill();
      $('#c').onclick = closeSheet;
      $('#ok').onclick = ()=>{
        const picks = [];
        for (const cb of document.querySelectorAll('#a-list input[type=checkbox]:checked')){
          const cat = cb.dataset.cat;
          const sel = document.querySelector(`select[data-size="${CSS.escape(cat)}"]`);
          const qtyEl = document.querySelector(`input[data-qty="${CSS.escape(cat)}"]`);
          const r = state.reps.filter((x)=>x.cat===cat)[+sel.value||0];
          const o = r.options[0], p = o.parts[0];
          const qty = Math.max(1, Math.min(6, +qtyEl.value || 1));
          for (let n=1; n<=qty; n++) picks.push({ cat, size:r.size, model:o.model, group:o.group, part:p, seq:qty>1?n:0 });
        }
        if (!picks.length){ toast('가전을 하나 이상 체크해주세요'); return; }
        closeSheet();
        if (!wallLoop()){ needRoom(); return; }
        autoPlace(picks);
      };
    });
}

function needRoom(){
  sheet(`<h2>먼저 방을 잡아주세요</h2>
    <p class="hint">배치하려면 닫힌 방이 필요합니다. 도면을 올렸다면 <b>벽 자동 인식</b>으로
      방 안쪽을 한 번 누르면 되고, 도면이 없으면 <b>벽 그리기</b>로 직접 그리시면 됩니다.</p>
    <div class="modal-actions">
      <button id="c">벽 그리기</button>
      <button class="primary" id="ok">벽 자동 인식</button>
    </div>`,
    ()=>{ $('#ok').onclick=()=>{closeSheet(); startDetect();};
          $('#c').onclick =()=>{closeSheet(); $('#btn-wall').click();}; });
}

/* 같은 카테고리인데 모델 세대에 따라 이격이 달라지는 경우.
   에어드레서 구형 Bespoke(DF10A9500CG·DF60A8500CG)는 좌우 14mm가 필요하고 현행
   라인업은 2.5mm다 — 삼성닷컴 설치가이드 다이어그램에 색상별로 모델코드와 함께 표기돼 있다.
   현재 size-reps에는 현행 모델만 들어 있지만, 나중에 구형이 추가돼도 2.5mm로 계산되지
   않도록 여기서 잡는다. 5.5배 차이라 나란히 설치할 때 결과가 뒤집힌다. */
const CLEAR_BY_MODEL = [
  { match: /^DF(10A9500CG|60A8500CG)/, clear: { back:15, side:14, front:0,
    src:'구형 Bespoke 에어드레서(DF10A9500CG·DF60A8500CG)는 좌우 이격 14mm가 필요하다 — 현행 라인업(2.5mm)과 다르다. 삼성닷컴 설치가이드 다이어그램에서 모델코드와 함께 확인된 값.' } },
];

function clearFor(cat, part, model){
  if (part==='실외기') return OUTDOOR;
  if (model) {
    const hit = CLEAR_BY_MODEL.find((r)=>r.match.test(model));
    if (hit) return hit.clear;
  }
  return CLEAR[cat] || { back:0, side:0, front:0, src:'' };
}

/* ── 배치 추천 ────────────────────────────────────────────────────
   "이 방에 이 가전들을 넣으면 어디에 놓이는가"를 자동으로 잡아 준다.

   추천이라고 해서 취향을 판단하지는 않는다. 하는 일은 딱 두 가지다.
     ① 방 용도에 맞는 가전만 후보로 올린다(주방에 세탁기를 넣지 않는다).
     ② 벽면을 따라 훑으면서 겹치지도, 이격을 침범하지도, 방을 벗어나지도 않는
        첫 자리에 놓는다.
   자리를 못 찾으면 억지로 놓지 않고 "자리 없음"으로 보고한다 — 억지로 밀어 넣어
   "들어갑니다"라고 말하는 것이 이 도구에서 가장 위험한 실패다.

   벽 배정 순서는 긴 벽부터다. 폭이 큰 제품(냉장고·콤보)이 먼저 자리를 잡아야
   나중에 작은 제품이 남은 틈에 들어간다. 사람이 실제로 배치하는 순서와 같다.
──────────────────────────────────────────────────────────────── */
const ROOM_PLAN = {
  '주방':   ['냉장고','김치냉장고','인덕션/전기레인지','식기세척기','전자레인지/오븐','정수기'],
  '세탁실': ['세탁기·콤보','건조기','에어드레서'],
  '거실':   ['TV','에어컨','공기청정기','사운드바','청소기'],
  '침실':   ['에어컨','공기청정기','에어드레서','제습기'],
};

/** 방 안쪽을 향하는 단위 법선 — 방 중심이 있는 쪽 */
function inwardNormal(w, center){
  const ang = Math.atan2(w.y2-w.y1, w.x2-w.x1);
  let nx = -Math.sin(ang), ny = Math.cos(ang);
  const mx = (w.x1+w.x2)/2, my = (w.y1+w.y2)/2;
  if ((center[0]-mx)*nx + (center[1]-my)*ny < 0){ nx=-nx; ny=-ny; }
  return { nx, ny, ang };
}
function roomCenter(){
  const pts = wallLoop();
  if (!pts) return null;
  return [pts.reduce((s,p)=>s+p[0],0)/pts.length, pts.reduce((s,p)=>s+p[1],0)/pts.length];
}

/**
 * 벽면을 50mm 간격으로 훑어 첫 유효 위치를 찾는다.
 * 유효 = 본체가 방 안 + 다른 가전과 본체/이격 모두 겹치지 않음.
 */
function findSpot(item, placed){
  const center = roomCenter();
  if (!center) return null;
  const walls = [...state.walls].sort((a,b)=>
    Math.hypot(b.x2-b.x1,b.y2-b.y1) - Math.hypot(a.x2-a.x1,a.y2-a.y1));

  for (const w of walls){
    const L = Math.hypot(w.x2-w.x1, w.y2-w.y1);
    const need = item.w + item.clear.side*2;
    if (L < need) continue;                       // 이 벽에는 폭이 안 들어간다
    const { nx, ny, ang } = inwardNormal(w, center);
    const ux = (w.x2-w.x1)/L, uy = (w.y2-w.y1)/L;
    for (let t = need/2; t <= L - need/2; t += 50){
      const px = w.x1 + ux*t + nx*item.clear.back;
      const py = w.y1 + uy*t + ny*item.clear.back;
      const cand = { ...item, bx:px, by:py, a:Math.atan2(ny,nx) - Math.PI/2 };
      const body = corners(cand), cl = corners(cand, cand.clear);
      if (body.some(([x,y])=>!insideRoom(x,y))) continue;
      let clash = false;
      for (const o of placed){
        if (overlaps(body, corners(o)) || overlaps(cl, corners(o, o.clear))){ clash = true; break; }
      }
      if (!clash) return cand;
    }
  }
  return null;
}

function autoPlace(picks){
  // 폭이 큰 것부터 — 자리를 많이 먹는 제품이 먼저 벽을 잡아야 나머지가 틈에 들어간다
  const list = picks.map((q)=>({
    id:'i'+Math.random().toString(36).slice(2,8),
    cat:q.cat, size:q.size, model:q.model, group:q.group,
    label:`${q.cat} ${q.size}${q.seq?` #${q.seq}`:''}`,
    w:q.part.w, h:q.part.h, d:q.part.d,
    clear:clearFor(q.cat, q.part.part, q.model), bx:0, by:0, a:0, warn:[],
  })).sort((a,b)=> b.w - a.w);

  const placed = [...state.items];
  const failed = [];
  for (const it of list){
    const spot = findSpot(it, placed);
    if (spot){ Object.assign(it, {bx:spot.bx, by:spot.by, a:spot.a}); placed.push(it); state.items.push(it); }
    else failed.push(it.label);
  }
  $('#empty').style.display='none';
  evaluate(); draw();
  if (failed.length){
    sheet(`<h2>자리를 못 찾은 제품이 있습니다</h2>
      <p class="hint">아래 제품은 이격거리와 방 경계를 지키면서 놓을 자리가 없었습니다.
        억지로 놓지 않았습니다 — 방을 넓히거나 더 작은 사이즈로 바꿔야 합니다.</p>
      <ul style="margin:0;padding-left:18px">${failed.map((f)=>`<li>${esc(f)}</li>`).join('')}</ul>
      <div class="modal-actions"><button class="primary" id="ok">확인</button></div>`,
      ()=>{ $('#ok').onclick = closeSheet; });
  }
}
function placeAt(wx,wy){
  const q = state.pending;
  const it = {
    id:'i'+Math.random().toString(36).slice(2,8),
    cat:q.cat, size:q.size, model:q.model, group:q.group,
    label:`${q.cat} ${q.size}${q.part.part!=='본체'?` (${q.part.part})`:''}`,
    w:q.part.w, h:q.part.h, d:q.part.d,
    clear:q.clear, bx:wx, by:wy, a:0, warn:[],
  };
  const snap = snapToWall(wx,wy,it);
  if (snap && snap.dist < 2000){ it.bx=snap.bx; it.by=snap.by; it.a=snap.a; }
  state.items.push(it);
  state.sel = it.id; state.pending=null; setMode('idle');
  $('#empty').style.display='none';
  evaluate(); draw();
}

/* ── 모달 ── */
function sheet(html, after){
  $('#sheet').innerHTML = html;
  $('#modal').classList.add('on');
  if (after) after();
}
function closeSheet(){ $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click',(e)=>{ if(e.target.id==='modal') closeSheet(); });

/* ── 시작 ── */
resize();
loadReps();

// 테스트에서 직접 호출할 수 있도록 노출한다(다른 모듈과 같은 방식)
window.__place = { state, corners, overlaps, snapToWall, evaluate, insideRoom, wallLoop, clearFor,
  findSpot, autoPlace, inwardNormal, roomCenter, doorZoneFor, topOpenFor,
  collisionAt, buildMask, floodRegion, regionPolygon, detectRoomAt,
  CLEAR, OUTDOOR, ROOM_PLAN, DOOR_ZONE, TOP_OPEN };
</script>
