const insideMat = new THREE.MeshLambertMaterial({ color: 0x3A4350, side: THREE.DoubleSide });
const backMat   = new THREE.MeshLambertMaterial({ color: 0x4A5462, side: THREE.DoubleSide });
const shelfMat  = new THREE.MeshLambertMaterial({ color: 0xC3CAD3, side: THREE.DoubleSide });
const hideMat   = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const doorMat = new THREE.MeshLambertMaterial({ color: 0xE8ECF1, transparent: true, opacity: 0.92, side: THREE.DoubleSide });
const doorBad = new THREE.MeshLambertMaterial({ color: 0xE23D3D, transparent: true, opacity: 0.85, side: THREE.DoubleSide });

/*
 * ── 문 열기 — **제품마다 따로**, 그리고 **여닫는 동작이 보이게** (2026-08-27) ──────────
 *
 * 예전에는 `openDoors` 불리언 하나로 **모든 제품의 문이 한꺼번에** 열렸다. 상담에서
 * 보고 싶은 것은 *"이 냉장고 문을 열면 어떻게 되는가"* 인데 옆의 세탁기·건조기 문까지
 * 함께 열려 화면이 문짝으로 뒤덮였다(2026-08-27 사용자 지적).
 *
 * 그래서 **열림 상태를 제품이 들고 있는다**(`it.doorOpen`). 3D 에서 제품을 누르면 고른
 * 것이 되고 안내띠의 「문 열기」가 **그 제품에만** 걸린다. 아무것도 안 골랐을 때만
 * 「문 전체 열기」로 예전처럼 다 연다 — 훑어보던 동작을 없애지는 않는다.
 *
 * **여는 동작도 보여준다.** `doorLeaves(it, frac)` 가 이미 0~1 사이 자세를 낸다
 * (충돌 판정이 *열리는 도중*을 12단계로 훑느라 만들어 둔 것이다). 프레임마다 그 값만
 * 올리면 문이 실제로 돌아가고, **그림과 판정이 같은 함수를 쓴다**는 규칙도 그대로 지켜진다.
 */
const DOOR_MS = 520;                    // 다 여는 데 걸리는 시간(ms). 실제로 냉장고 문을 여는 속도쯤이다
const easeDoor = (t) => 1 - Math.pow(1 - t, 3);   // 끝에서 감속. 진행도는 선형이라 **반드시 끝난다**
const doorFrac = new Map();             // 제품 id → 지금 열린 정도(0~1). 그림에만 쓰는 값이다
let doorPlan = [];                      // build() 가 정리해 둔 [{it, bad}] — 애니메이션은 이것만 다시 그린다
let doorRoot = null;                    // 열린 문짝만 담는 그룹. 장면 전체가 아니라 여기만 갈아 끼운다
let doorClock = 0;                      // 지난 프레임 시각(ms)
/** 문을 열어 보여줄 수 있는 제품인가 — 위로 열리는 뚜껑형은 평면에 보여줄 것이 없다 */
const canOpenDoor = (it) => !!(it && !it.staged && P.doorOpenFor(it) && P.doorLeaves(it).length);
/** 지금 문이 열려 있는 제품 수 */
const openDoorCount = () => P.state.items.filter((it) => it.doorOpen && canOpenDoor(it)).length;
let showTags = false;       // 가전 이름표를 띄우는가

/*
 * 가전 이름표 — **기본으로 끈다.**
 * 고객에게 보여주는 화면이라 글자가 떠 있으면 "우리 집 느낌"이 흐려진다(2D 에서 벽 길이를
 * 기본으로 끈 것과 같은 이유). 그런데 흰 상자가 여럿 서 있으면 상담사도 어느 것이 어느
 * 제품인지 헷갈리므로, 필요할 때 켜는 손잡이를 둔다.
 *
 * **모델코드는 적지 않는다** — 대표모델은 크기를 가늠하려고 세운 자리끼움이지 "이 제품을
 * 사시라"는 제안이 아닌데, 코드가 박혀 있으면 고객이 그 모델을 제안받은 것으로 읽는다.
 * 카테고리와 사이즈까지만 적는다(2D 라벨과 같은 규칙).
 */
function tagSprite(text, bad){
  const pad = 12, fs = 44;
  const c = document.createElement('canvas');
  const g0 = c.getContext('2d');
  g0.font = `700 ${fs}px system-ui,sans-serif`;
  const w = Math.ceil(g0.measureText(text).width) + pad * 2;
  c.width = w; c.height = fs + pad * 2;
  const g = c.getContext('2d');
  g.font = `700 ${fs}px system-ui,sans-serif`;
  g.fillStyle = bad ? 'rgba(226,61,61,.94)' : 'rgba(17,24,39,.86)';
  g.beginPath(); g.roundRect(0, 0, c.width, c.height, 14); g.fill();
  g.fillStyle = '#fff'; g.textBaseline = 'middle';
  g.fillText(text, pad, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  /* 화면에서 늘 같은 크기로 보이게 하지 않는다 — 멀리 있는 것은 작게 보여야 거리감이 산다.
     0.0016 은 1m 앞에서 글자가 읽히는 배율(실측으로 맞췄다). */
  sp.scale.set(c.width * 0.0016, c.height * 0.0016, 1);
  sp.renderOrder = 999;
  return sp;
}

/**
 * 열린 문짝 하나를 세운다. `doorLeaves` 가 낸 **월드 다각형 그대로** 밑면으로 깔고
 * 문 높이만큼 올린다 — 판정과 그림이 같은 것을 봐야 한다.
 * 문 높이는 본체 높이의 8할로 둔다(손잡이·힌지 여유). 실측이 아니라 보이기 위한 값이다.
 */
/**
 * 문짝이 앞면에서 차지하는 **높이 구간들** [[아래, 위], …] (m).
 *
 * **앞면 구성이 곧 문짝 구성이다.** `fridgeLayout` 이 이미 "좌우로 몇 칸(`cols`) ·
 * 위아래로 몇 칸(`rows`) · 그중 좌우로 갈린 것이 몇 칸(`splitRows`)"을 알고 있으므로
 * 그대로 읽는다 — 앞면 그림과 열리는 문이 어긋나면 눈이 헤맨다.
 *
 *   · 4도어 냉장고  — 상·하 두 단이 각각 좌우 두 짝 → **문짝 4장**
 *     (예전에는 바닥부터 통짜 한 장이라 앞면에 그려 둔 가로 분할선을 문이 가로질렀다)
 *   · 양문형        — 한 단 좌우 두 짝
 *   · 김치냉장고 4도어 — **상실 한 단만**(2026-08-27 사용자 확인). 중실·하실은 서랍이라
 *     바닥까지 내려온 문짝을 그리면 서랍 두 칸이 통째로 열리는 것처럼 보인다
 *
 * 냉장고 계열이 아닌 것(세탁기·건조기…)은 예전 그대로 바닥부터 8할이다 —
 * 실측이 아니라 보이기 위한 값이다(손잡이·힌지 여유).
 */
function leafSpans(it){
  const H = it.h || 800;
  const F = /^냉장고|^김치냉장고|^냉동고|^업소용/.test(String(it.cat || '')) && P.fridgeLayout
    ? P.fridgeLayout(it) : null;
  if (F && !F.top && F.cols > 1){
    const sr = F.splitRows == null ? F.rows : F.splitRows;
    /* **칸 높이는 균등이 아니다** — 앞면 그림과 같은 `fridgeRows` 를 본다(2026-08-27).
       예전에는 여기서도 `H / rows` 로 따로 나눠, 규격도를 반영하면 문이 앞면 분할선을
       가로지르게 될 자리였다. 두 곳이 같은 함수를 지나가야 저절로 맞는다. */
    const rows = P.fridgeRows(F, H), out = [];
    for (let i = 0; i < sr; i++){                    // 위 칸부터 — 갈린 칸만 여닫이다
      const [y0, y1] = rows[i], gap = (y1 - y0) * 0.02;
      out.push([M(y0 + gap), M(y1 - gap)]);
    }
    if (out.length) return out;
  }
  return [[0, M(H * 0.8)]];
}

/**
 * **드럼 세탁기·건조기의 문은 원형이다** (2026-08-27 사장님 지적:
 * *"세탁기 도어 개폐가 원형으로 개폐되는 모습이어야 하는데 냉장고 도어처럼 열리는 모습으로
 * 나옵니다"*). 앞면 그림은 이미 원(테두리+유리)이었는데 **열린 문짝만 사각 판**이었다.
 *
 * **판정 다각형(`lf.poly`)은 건드리지 않는다.** 앞으로 얼마나 나오는지(`openD 1,430mm`)는
 * 설치가이드 실측이고 `doorHits` 가 그 값으로 부딪힘을 판정한다 — 그림만 바꾼다.
 * 원판은 그 다각형의 **힌지 쪽 끝에서 반지름만큼 나아간 자리**에 세운다(문은 제 가장자리에
 * 달려 돈다). 지름은 앞면 그림과 **같은 `drumR`** 을 본다.
 *
 * 위로 열리는 통버블·일반세탁기는 애초에 `kind:'top'` 이라 문짝이 만들어지지 않는다.
 */
function drumLeafMesh(lf, it, bad){
  const g = new THREE.Group();
  const p = lf.poly;
  const R = drumR(it), T = 0.022;                 // 두께 — 실측이 아니라 보이기 위한 값(사각 문짝과 같다)
  const cy = M(it.h || 800) * DRUM_CY;
  /* 힌지 쪽 변(p0→p1)이 문이 뻗는 방향이다 */
  const ux = M(p[1][0] - p[0][0]), uz = M(p[1][1] - p[0][1]);
  const len = Math.hypot(ux, uz) || 1;
  const dx = ux / len, dz = uz / len;
  const cx = M(p[0][0]) + dx * R, cz = M(p[0][1]) + dz * R;
  /* 문 판의 법선 = 뻗는 방향에 수직인 수평 방향 */
  const nrm = new THREE.Vector3(-dz, 0, dx);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R, T, 28), bad ? doorBad : doorMat);
  body.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), nrm);
  body.position.set(cx, cy, cz);
  g.add(body);
  /* 유리 — 양면에 하나씩. 어느 쪽에서 봐도 원이 두 겹으로 읽혀야 한다(앞면 그림과 같은 어휘) */
  for (const sgn of [1, -1]){
    const gl = new THREE.Mesh(new THREE.CircleGeometry(R * 0.74, 28), bad ? doorBad : darkMat);
    gl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), nrm.clone().multiplyScalar(sgn));
    gl.position.set(cx + nrm.x * sgn * (T / 2 + 0.002), cy, cz + nrm.z * sgn * (T / 2 + 0.002));
    g.add(gl);
  }
  g.userData.item = it;
  g.userData.isDoorLeaf = true;
  g.userData.isRoundDoor = true;      // 검사가 "원형으로 열리는가"를 형상으로 확인한다
  return g;
}

function leafMesh(lf, it, bad){
  /* 드럼 도어는 원판이다 — 앞으로 열리는 세탁기·건조기 계열이 전부 그렇다 */
  if (lf.spec && lf.spec.kind === 'front') return drumLeafMesh(lf, it, bad);
  const g = new THREE.Group();
  const p = lf.poly;
  /* 사각형이므로 두 삼각형이면 된다. 앞뒤로 보이게 DoubleSide 를 쓴다. */
  const idx = [[0,1,2],[0,2,3]];
  const pos = [];
  /* **한 짝이 여러 단이면 단마다 판을 세운다** — 판정 다각형(`lf.poly`)은 하나 그대로다.
     평면에서 쓸고 가는 자리는 상·하 도어가 같으므로 판정은 바뀌지 않고 그림만 정확해진다. */
  for (const [y0, y1] of leafSpans(it)){
    for (const t of idx) for (const i of t){ pos.push(M(p[i][0]), y0, M(p[i][1])); }
    for (const t of idx) for (const i of t){ pos.push(M(p[i][0]), y1, M(p[i][1])); }
    /* 옆면 — 문짝이 판때기로만 보이지 않게 네 변을 세운다 */
    for (let i = 0; i < 4; i++){
      const a = p[i], b = p[(i + 1) % 4];
      pos.push(M(a[0]), y0, M(a[1]), M(b[0]), y0, M(b[1]), M(b[0]), y1, M(b[1]));
      pos.push(M(a[0]), y0, M(a[1]), M(b[0]), y1, M(b[1]), M(a[0]), y1, M(a[1]));
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo, bad ? doorBad : doorMat));
  /* **열린 문짝을 눌러도 그 제품이 집힌다.** 문이 활짝 열리면 화면에서 가장 큰 것이
     문짝인데, 그걸 눌렀을 때 아무 일도 안 일어나면 "왜 안 골라지지"가 된다. */
  g.userData.item = it;
  g.userData.isDoorLeaf = true;
  return g;
}

/**
 * ── 열린 칸의 **안쪽**을 만든다 (2026-08-27) ────────────────────────────────
 *
 * 문만 젖혀 놓고 몸통을 통짜 상자로 두면 **닫힌 것처럼** 보인다. 그래서 열려 있는 동안만
 * ①몸통의 앞면을 지우고 ②그 자리에 **구멍 뚫린 앞면**을 새로 깔고 ③구멍 뒤에 **안쪽 상자**를
 * 세운다. 셋 다 `doorRoot` 에 들어가므로 `paintDoors()` 가 프레임마다 버리고 다시 만든다.
 *
 * **왜 몸통을 고쳐 만들지 않는가** — 앞면에 구멍을 내려면 몸통 지오메트리를 다시 만들어야
 * 하는데, 여는 동작은 프레임마다 자세가 바뀐다. 이 파일이 이미 못박아 둔 규칙이 그것이다:
 * *"`build()` 는 방·벽·가전을 통째로 만드는 함수라 60fps 로 돌릴 것이 아니다."*
 * 대신 **재질 한 칸만 바꾼다**(앞면 = 재질 배열의 4번). 지오메트리는 그대로다.
 *
 * **구멍 자리는 문짝과 같은 값에서 나온다** — 냉장고 계열은 `leafSpans`(= `fridgeRows`),
 * 드럼은 `drumR`. 갈리면 구멍과 문짝 크기가 달라 보인다.
 */
function insideGroup(it, bad){
  const w = M(it.w), h = M(it.h || 800), d = M(it.d);
  const cat = String(it.cat || '');
  const drum = /세탁기|콤보|건조기/.test(cat) && P.doorOpenFor(it) && P.doorOpenFor(it).kind === 'front';
  const g = new THREE.Group();
  /* 가전 그룹과 **같은 자세**로 놓는다(applianceMesh 끝부분과 같은 식) */
  const c = Math.cos(it.a), sn = Math.sin(it.a);
  g.position.set(M(it.bx - (it.d / 2) * sn), M(it.mh || 0), M(it.by + (it.d / 2) * c));
  g.rotation.y = -it.a;

  /* 구멍 — 냉장고 계열은 열리는 칸마다 네모, 드럼은 원 하나 */
  const holes = [];
  if (drum) holes.push({ round: true, cy: h * DRUM_CY, r: drumR(it) });
  else for (const [y0, y1] of leafSpans(it)) holes.push({ y0, y1 });
  if (!holes.length) return null;

  /* ① 구멍 뚫린 앞면. `ShapeGeometry` 가 구멍 감기를 알아서 맞춘다 */
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0); shape.lineTo(w / 2, 0); shape.lineTo(w / 2, h); shape.lineTo(-w / 2, h);
  const inx = w * 0.02;                       // 좌우 테두리 — 실물 도어도 몸통보다 조금 작다
  for (const hl of holes){
    const path = new THREE.Path();
    if (hl.round) path.absarc(0, hl.cy, hl.r, 0, Math.PI * 2, false);
    else {
      path.moveTo(-w / 2 + inx, hl.y0); path.lineTo(w / 2 - inx, hl.y0);
      path.lineTo(w / 2 - inx, hl.y1);  path.lineTo(-w / 2 + inx, hl.y1);
    }
    shape.holes.push(path);
  }
  const face = new THREE.Mesh(new THREE.ShapeGeometry(shape), bad ? badMat : faceMat);
  face.position.z = d / 2 + 0.0015;           // 몸통 앞면 바로 앞 — z-파이팅을 피한다
  g.add(face);

  /* ② 안쪽 — 앞이 트인 상자(다섯 면). 벽 두께 60mm 만큼 들어가 있다고 본다 */
  const zF = d / 2 - 0.02;
  const quad = (a, b, c2, e) => [...a, ...b, ...c2, ...a, ...c2, ...e];
  const box = (x0, x1, y0, y1, z0, z1) => {
    const P3 = (x, y, z) => [x, y, z];
    return [
      ...quad(P3(x0, y0, z1), P3(x0, y0, z0), P3(x0, y1, z0), P3(x0, y1, z1)),   // 왼쪽
      ...quad(P3(x1, y0, z0), P3(x1, y0, z1), P3(x1, y1, z1), P3(x1, y1, z0)),   // 오른쪽
      ...quad(P3(x0, y1, z0), P3(x1, y1, z0), P3(x1, y1, z1), P3(x0, y1, z1)),   // 위
      ...quad(P3(x0, y0, z1), P3(x1, y0, z1), P3(x1, y0, z0), P3(x0, y0, z0)),   // 아래
    ];
  };
  const mesh = (pos, mat) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat);
    g.add(m); return m;
  };
  if (drum){
    /* 드럼 — 원통 안쪽과 막힌 끝. 선반 같은 것은 없다 */
    const R = drumR(it), depth = Math.min(d * 0.7, d - 0.06);
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(R, R, depth, 24, 1, true), insideMat);
    cyl.rotation.x = Math.PI / 2;
    cyl.position.set(0, h * DRUM_CY, zF - depth / 2);
    g.add(cyl);
    const cap = new THREE.Mesh(new THREE.CircleGeometry(R, 24), backMat);
    cap.position.set(0, h * DRUM_CY, zF - depth);
    g.add(cap);
  } else {
    const depth = Math.min(d * 0.78, d - 0.06);
    for (const hl of holes){
      const x0 = -w / 2 + inx, x1 = w / 2 - inx, z0 = zF - depth;
      mesh(box(x0, x1, hl.y0, hl.y1, z0, zF), insideMat);
      /* 안쪽 끝 — 옆·위·아래보다 밝게 둬야 깊이가 읽힌다 */
      const back = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, hl.y1 - hl.y0), backMat);
      back.position.set(0, (hl.y0 + hl.y1) / 2, z0);
      g.add(back);
      /*
       * 선반 — **냉장고에만**. 칸 수는 카탈로그 값이 아니라 보이기 위한 값이다(위 재질 주석).
       * 김치냉장고 상실은 통을 넣는 칸이라 구성을 확인한 적이 없어 **넣지 않는다.**
       */
      if (/^냉장고$/.test(cat) && (hl.y1 - hl.y0) > 0.35){
        for (const f of [0.36, 0.68]){
          const sh2 = new THREE.Mesh(new THREE.PlaneGeometry((x1 - x0) * 0.94, depth * 0.9), shelfMat);
          sh2.rotation.x = -Math.PI / 2;
          sh2.position.set(0, hl.y0 + (hl.y1 - hl.y0) * f, zF - depth * 0.5);
          g.add(sh2);
        }
      }
    }
  }
  g.userData.item = it;          // 안쪽을 눌러도 그 제품이 집힌다(열린 문짝과 같은 규칙)
  g.userData.isDoorInside = true;
  return g;
}

/**
 * 열린 문짝들을 지금 진행도(`doorFrac`)에 맞춰 다시 세운다.
 *
 * **장면 전체를 다시 짓지 않는다.** 여는 동작은 프레임마다 자세가 바뀌는데 `build()` 는
 * 방·벽·가전을 통째로 다시 만들어 60fps 로 돌릴 것이 아니다. 문짝만 담는 그룹
 * (`doorRoot`)을 두고 그 안만 갈아 끼운다.
 *
 * **지오메트리는 반드시 버린다**(`dispose`). 프레임마다 새로 만드는 자리라 안 버리면
 * GPU 메모리가 그대로 샌다 — 색 재질을 한 장만 만들어 나눠 쓰는 것과 같은 이유다.
 */
function paintDoors(){
  if (!doorRoot) return;
  for (const c of doorRoot.children.slice()){
    c.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    doorRoot.remove(c);
  }
  for (const d of doorPlan){
    const t = doorFrac.get(d.it.id) || 0;
    /* 거의 닫힌 자세는 그리지 않는다 — 문짝이 앞면 안쪽에 겹쳐 z-파이팅으로 깜빡인다 */
    const open = t > 0.02;
    /*
     * **열려 있는 동안만 앞면을 지운다.** 몸통 지오메트리는 그대로 두고 재질 배열의
     * 4번(앞면) 한 칸만 바꾼다 — 그래야 60fps 로 돌려도 값이 싸다.
     * 닫히면 원래 재질로 되돌린다(안 되돌리면 앞면이 영영 사라진 채로 남는다).
     */
    if (d.body){
      if (open){
        if (d.savedFace === undefined) d.savedFace = d.body.material[4];
        d.body.material[4] = hideMat;
      } else if (d.savedFace !== undefined){
        d.body.material[4] = d.savedFace; d.savedFace = undefined;
      }
    }
    /* 도어 분할선·손잡이·원형 도어 그림은 **문에 붙은 것**이라 함께 사라진다 */
    for (const m of (d.faces || [])) m.visible = !open;
    if (!open) continue;
    const inside = insideGroup(d.it, d.bad);
    if (inside) doorRoot.add(inside);
    for (const lf of P.doorLeaves(d.it, easeDoor(t))) doorRoot.add(leafMesh(lf, d.it, d.bad));
  }
}

/**
 * 문이 열리고 닫히는 **동작** — 제품마다 목표(`it.doorOpen`)를 향해 진행도를 옮긴다.
 *
 * 진행도는 **선형**으로 재고 각도로 바꿀 때만 감속을 준다(`easeDoor`). 지수 감쇠로
 * 부드럽게 하면 목표에 영원히 도달하지 않아 문이 미세하게 계속 떨리고, 그러면 화면이
 * 멈추지 않아 폰 배터리를 계속 먹는다.
 */
function stepDoors(){
  const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  /* 탭이 가려졌다 돌아오면 dt 가 몇 초씩 튄다 — 그러면 문이 순간이동한다. 잘라 둔다 */
  const dt = doorClock ? Math.min(120, Math.max(0, now - doorClock)) : 16;
  doorClock = now;
  let moved = false;
  for (const d of doorPlan){
    const tgt = d.it.doorOpen ? 1 : 0;
    const cur = doorFrac.has(d.it.id) ? doorFrac.get(d.it.id) : tgt;
    if (cur === tgt){ doorFrac.set(d.it.id, tgt); continue; }
    const step = dt / DOOR_MS;
    doorFrac.set(d.it.id, tgt > cur ? Math.min(tgt, cur + step) : Math.max(tgt, cur - step));
    moved = true;
  }
  return moved;
}

/**
 * 여는 도중을 건너뛰고 **목표 자세로 곧장 맞춘다.**
 *
 * 공유 카드는 *"문을 연 상태"* 를 보여야지 **여는 도중**을 보이면 안 된다 — 중간 자세는
 * 그 찰나에만 있는 그림이라 고객 손에 남을 그림으로는 뜻이 없다. 그래서 내보내기 직전
 * (`render()`)에 한 번 부른다. 화면도 그 자리에서 함께 끝난다.
 */
function settleDoors(){
  let moved = false;
  for (const d of doorPlan){
    const tgt = d.it.doorOpen ? 1 : 0;
    if (doorFrac.get(d.it.id) !== tgt){ doorFrac.set(d.it.id, tgt); moved = true; }
  }
  if (moved) paintDoors();
  return moved;
}

/*
 * **카탈로그에 적힌 제품 색으로 칠한다**(2026-08-14). 사실감은 지어낸 외형이 아니라
 * 컬러와 치수 정확도로 올린다 — 색은 카탈로그가 이미 갖고 있다(`색상: 코타 화이트`).
 * 색 이름에 색 단어가 없으면(`트러플 메탈`) 칠하지 않고 기본 회백색으로 둔다.
 * 2D 는 같은 hex 를 정면 띠로 보인다 — **두 화면이 같은 값을 쓴다.**
 * 재질은 색마다 하나만 만들어 재사용한다(제품마다 새로 만들면 GPU 자원이 샌다).
 */
/*
 * 접지 그림자 재질 — **한 장을 만들어 모두가 나눠 쓴다.**
 * 가운데가 진하고 가장자리로 사라지는 원. 그림자 맵을 쓰지 않는 이유는 위 조명 주석과
 * 같다 — 바닥이 원본 도면 텍스처라 전체가 어두워지면 마루색·가구가 죽는다.
 */
let shadowMat_ = null;
function shadowMat(){
  if (shadowMat_) return shadowMat_;
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g2 = c.getContext('2d');
  const grd = g2.createRadialGradient(64, 64, 4, 64, 64, 62);
  grd.addColorStop(0, 'rgba(0,0,0,0.34)');
  grd.addColorStop(0.55, 'rgba(0,0,0,0.16)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g2.fillStyle = grd; g2.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  /* `depthWrite:false` 라야 그 위에 선 제품이 그림자에 잘리지 않는다 */
  return (shadowMat_ = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
}

const colorMats = new Map();
function bodyMatFor(it){
  const hex = it && it.hex;
  if (!hex || !/^#[0-9a-f]{6}$/i.test(hex)) return bodyMat;
  if (!colorMats.has(hex)) colorMats.set(hex, new THREE.MeshLambertMaterial({ color: parseInt(hex.slice(1), 16) }));
  return colorMats.get(hex);
}

/*
 * ── 가전 3D 자산 (2026-08-18) ───────────────────────────────────
 *
 * **지금은 자산이 하나도 없다.** 저장소·스크래치에 GLB/GLTF 가 0개다. 그래서 이 길은
 * **자리를 열어 두는 것**이고, 자산이 없으면 아래 상자 그림이 그대로 쓰인다(섞여도 된다).
 *
 * ## 치수는 우리가 안다 — 자산은 모양만 준다
 * `size-reps` 의 W×H×D 는 카탈로그 실측이고 **이 도구의 존재 이유**다. 그래서 불러온
 * 모델의 경계상자를 재서 **우리 치수에 맞춰 늘린다.** 다만 **가로세로 비가 15% 넘게
 * 어긋나면 쓰지 않는다** — 늘려서 맞추면 형태가 왜곡되고, 그건 실물이 아닌 것을 실물처럼
 * 보이게 하는 일이다(CLAUDE.md: 지어낸 외형은 고객이 실물로 오해한다).
 *
 * ## 지연 로드
 * `GLTFLoader`(107KB)는 **등록부에 자산이 있을 때만** 받는다. three.js 를 3D 를 켤 때만
 * 받는 것과 같은 이유 — 매장 전파가 약해도 열려야 한다.
 */
let MODELS = null, gltfLoader = null;
async function modelManifest(){
  if (MODELS) return MODELS;
  try {
    const r = await fetch('models/manifest.json');
    MODELS = r.ok ? ((await r.json()).models || {}) : {};
  } catch { MODELS = {}; }
  return MODELS;
}
/** 자산이 있으면 상자를 그것으로 바꿔 끼운다. 없거나 치수가 어긋나면 아무것도 안 한다. */
async function swapInModel(group, it){
  const man = await modelManifest();
  const path = man[`${it.cat}|${it.size}`] || man[it.cat];
  if (!path) return;
  if (!gltfLoader){
    const { GLTFLoader } = await import('./vendor/GLTFLoader.js');
    gltfLoader = new GLTFLoader();
  }
  let gltf; try { gltf = await gltfLoader.loadAsync('models/' + path); } catch { return; }
  const obj = gltf.scene;
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const want = { x: M(it.w), y: M(it.h || 800), z: M(it.d) };
  if (!size.x || !size.y || !size.z) return;
  /* 가로세로 비가 크게 어긋나면 믿지 않는다 */
  const rx = (size.x / size.y) / (want.x / want.y), rz = (size.z / size.y) / (want.z / want.y);
  if (rx < 0.85 || rx > 1.18 || rz < 0.85 || rz > 1.18){
    console.warn('[3D] 자산 치수가 실측과 어긋나 쓰지 않습니다:', path,
      `모델 ${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)}m · 실측 ${want.x.toFixed(2)}×${want.y.toFixed(2)}×${want.z.toFixed(2)}m`);
    return;
  }
  obj.scale.set(want.x / size.x, want.y / size.y, want.z / size.z);
  /* 원점이 어디든 바닥 중심으로 옮긴다 */
  const b2 = new THREE.Box3().setFromObject(obj);
  const c = b2.getCenter(new THREE.Vector3());
  obj.position.set(-c.x, -b2.min.y, -c.z);
  /* 상자·모서리·디테일은 걷어내고 그림자는 남긴다 */
  for (const ch of [...group.children]) if (!ch.userData.isShadow) group.remove(ch);
  obj.userData.isBody = true;                 // 문 막힘 때 빨갛게 칠할 대상
  group.add(obj);
  if (typeof render === 'function') render();
}

/*
 * 드럼 도어의 **반지름과 높이**. 앞면 그림 · 열린 원형 문짝 · 드럼 개구부가 **같은 값**을
 * 봐야 한다 — 갈리면 문을 열었을 때 구멍과 문짝 크기가 달라 보인다.
 * 실측이 아니라 보이기 위한 값이다(문짝 두께 22mm 와 같은 부류).
 */
const DRUM_CY = 0.52;
const drumR = (it) => Math.min(M(it.w), M(it.h || 800)) * 0.36;

function applianceMesh(it){
  const g = new THREE.Group();
  const w = M(it.w), h = M(it.h || 800), d = M(it.d);
  /* 앞면(로컬 +Z)만 다른 재질로 둬 방향이 읽히게 한다 */
  const bm = bodyMatFor(it);
  const mats = [bm, bm, bm, bm, bm === bodyMat ? faceMat : bm, bm];
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
  /* 문이 막혔을 때 빨갛게 칠할 대상을 표시해 둔다 — 제품 색으로 칠하면 재질 비교로는 못 찾는다 */
  body.userData.isBody = true;
  body.position.y = h / 2;
  g.add(body);
  /* 모서리 선 — 흰 제품이 흰 벽 앞에 서면 윤곽이 사라진다(2D 에서 흰 테두리를 준 것과 같은 이유) */
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)),
    /* 윤곽선을 진하게 — 흰 제품이 밝은 벽 앞에 서면 면만으로는 경계가 사라진다
       (2D 가 흰 테두리를 준 것과 같은 이유, 방향만 반대다) */
    new THREE.LineBasicMaterial({ color: 0x5B6675 }));
  edge.position.y = h / 2; g.add(edge);

  /*
   * 디테일은 **2D `drawGlyph` 와 같은 어휘**로 넣는다. 같은 품목이 앱마다 다른 그림이면
   * 상담사 눈이 헤맨다(CLAUDE.md: 같은 품목이면 앱이 달라도 같은 아이콘).
   * 그래서 갈래도 2D 와 똑같이 나눈다 — 냉장고 도어선·손잡이 / 원형 도어 / 화면 /
   * 화구 / 앞면 도어패널 / 윗면 원형 그릴 / 에어컨 토출구.
   *
   * **규칙은 "2D 에 없는 품목은 3D 에도 만들지 않는다"** 이다 — 근거 없이 외형을
   * 지어내면 고객이 실물로 오해한다. 한쪽에만 그림이 있으면 `test-plans` 가 양방향으로
   * 물린다.
   *
   * 리빙 4종(비데·선풍기·안마기·욕실케어)은 **2026-08-17 에 2D·3D 양쪽에 함께 넣었다.**
   * 이 주석이 한동안 "만들지 않는다"로 남아 있어 없는 것처럼 읽혔다 — 지금은
   * `size-reps` 24개 카테고리 전부에 2D 실루엣과 3D 디테일이 있다.
   */
  const cat = it.cat || '';
  const grp = String(it.group || '');
  const z = d / 2 + 0.004;                        // 앞면 바로 앞
  const plate = (pw, ph, px, py, mat) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), mat);
    m.position.set(px, py, z); g.add(m); return m;
  };
  /** 앞면에 붙이는 원 (세탁기 도어 등). `dz` 로 살짝 앞에 겹쳐 그린다 */
  const disc = (r, py, mat, dz) => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 28), mat);
    m.position.set(0, py, z + (dz || 0)); g.add(m); return m;
  };
  /** 윗면에 눕히는 원 (인덕션 화구·공기청정기 토출구 등) */
  const topDisc = (r, ux, uz, mat) => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 24), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(ux, h + 0.004, uz); g.add(m); return m;
  };

  if (/^냉장고|김치냉장고|냉동고|^업소용/.test(cat)){
    /*
     * **도어 구성은 2D 와 같은 함수(`fridgeLayout`)가 정한다.** 예전에는 여기서 따로
     * `폭 800mm 초과 = 양문` 으로 갈라, 양문형에 없는 가로 분할선을 그리고 1도어를
     * 반으로 갈랐다. 앞면이 보이는 3D 는 세로(`cols`)·가로(`rows`)를 모두 쓴다.
     */
    const F = P.fridgeLayout(it);
    if (F.top){
      /* 뚜껑형 — 위로 여는 물건이라 앞면에 도어선이 없다. 윗면에 뚜껑 경계만 얹는다. */
      const lid = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, d * 0.8), faceMat);
      lid.rotation.x = -Math.PI / 2; lid.position.set(0, h + 0.004, 0); g.add(lid);
    } else {
      /* `splitRows` 는 **위에서 몇 칸이 좌우로 갈리는가**다(김치냉장고 4도어 = 상실 1칸).
         안 적혀 있으면 예전처럼 전 칸이 갈린다 — 아래 식이 그대로 옛 그림을 낸다. */
      const sr = F.splitRows == null ? F.rows : F.splitRows;
      /*
       * **칸 높이는 균등이 아니다** — 규격도에서 잰 `rowFrac` 을 `fridgeRows` 가 편다
       * (2026-08-27). 예전에는 `h / rows` 라 김치냉장고 상실이 33% 였는데 실물은 55% 다.
       * 문짝 구간(`leafSpans`)도 같은 함수를 보므로 앞면과 문이 저절로 맞는다.
       */
      const rows = P.fridgeRows(F, h);                        // 위 칸부터 [[y0,y1], …]
      const splitTop = rows[0][1], splitBot = rows[sr - 1][0], splitH = splitTop - splitBot;
      /*
       * **여닫이 칸의 그림은 문에 붙은 것이다.** 문이 열리면 함께 사라져야 한다 —
       * 안 그러면 활짝 열린 문 앞에 도어 분할선과 손잡이만 허공에 떠 있다.
       * `paintDoors()` 가 이 표를 보고 진행도에 맞춰 껐다 켠다.
       */
      const onDoor = (m) => { m.userData.doorFace = true; return m; };
      for (let i = 1; i < F.cols; i++)                        // 세로 분할선 — **갈린 칸에만**
        onDoor(plate(0.006, splitH * 0.99, -w / 2 + (w * i) / F.cols, (splitTop + splitBot) / 2, darkMat));
      for (let i = 1; i < F.rows; i++){                       // 가로 분할선 — 칸 경계마다
        const y = rows[i][1];
        /* 여닫이 칸 **사이**의 선만 문에 붙은 것이다(서랍과 맞닿는 아래쪽 경계는 몸통에 남는다) */
        const m = plate(w * 0.995, 0.006, 0, y, darkMat);
        if (i < sr) onDoor(m);
      }
      const cw = w / F.cols;
      const hy = sr === F.rows ? h * 0.75 : splitTop - splitH * 0.42;
      const hh = sr === F.rows ? h * 0.22 : splitH * 0.40;
      for (let i = 0; i < F.cols; i++){                       // 여닫이 칸마다 세로 손잡이 하나
        const cx = -w / 2 + cw * (i + 0.5);
        onDoor(plate(0.012, hh, cx + cw * (F.cols > 1 && i === 0 ? 0.34 : F.cols > 1 ? -0.34 : 0.30), hy, darkMat));
      }
      /* 서랍 칸은 **가로 손잡이** — 앞으로 당겨 빼는 물건이라 세로 손잡이가 없다.
         손잡이는 서랍 앞판 **위쪽**에 있다(규격도에서 확인) — 칸 높이의 22% 아래. */
      for (let r = sr; r < F.rows; r++){
        const [y0, y1] = rows[r];
        plate(w * 0.46, 0.014, 0, y1 - (y1 - y0) * 0.22, darkMat);
      }
    }
  } else if (/세탁기|콤보|건조기|에어드레서|슈드레서/.test(cat)){
    /*
     * **도어가 한눈에 보여야 한다**(2026-08-18 사용자 요청: *"세탁기는 도어모양이
     * 명확히 보여야합니다"*). 예전에는 어두운 원 하나였는데, 흰 본체 위에서는 그냥
     * 점으로 보이고 색 있는 본체 위에서는 묻혔다.
     * 지금은 **테두리(중간 회색) + 유리(어두움)** 두 겹이고 지름도 키웠다 —
     * 실물 드럼 도어가 그렇게 생겼고, 두 겹이라 어떤 본체 색 위에서도 원이 읽힌다.
     */
    /* 통버블은 위로 열리는 물건이라 앞면에 원형 도어가 없다 — 2D 도 사각으로 둔다 */
    if (/통버블|일반세탁기/.test(grp)) plate(w * 0.72, h * 0.5, 0, h * 0.62, faceMat);
    else {
      /* 이 두 겹은 **도어 자체**다 — 문을 열면 함께 사라지고 원형 문짝이 그 자리를 대신한다
         (`paintDoors`). 안 그러면 열린 문 앞에 도어 그림만 남아 문이 둘로 보인다. */
      const R = drumR(it);
      disc(R, h * DRUM_CY, rimMat).userData.doorFace = true;                 // 도어 테두리
      disc(R * 0.74, h * DRUM_CY, darkMat, 0.004).userData.doorFace = true;  // 유리
    }
  } else if (/^TV|모니터/.test(cat)){
    plate(w * 0.96, h * 0.9, 0, h / 2, screenMat);            // 화면 — 본체보다 밝게(방향이 읽히게)
  } else if (/사운드바/.test(cat)){
    /*
     * **한 줄에 세 물건이 들어 있다** — `사운드바`(길고 얇은 띠) · `서라운드 스피커`(작은
     * 상자) · `우퍼`(325×400 상자). 예전에는 셋 다 긴 그릴 띠를 붙여, 우퍼 앞면이
     * 통째로 띠가 됐다. 부품 이름이 데이터에 있으므로 그것으로 가른다.
     */
    if (/우퍼|스피커/.test(String(it.part || ''))) disc(Math.min(w, h) * 0.34, h * 0.5, darkMat);
    else plate(w * 0.97, h * 0.7, 0, h / 2, darkMat);         // 그릴 — 화면이 아니라 얇은 띠
  } else if (/인덕션|전기레인지/.test(cat)){
    /* 상판이 보이는 물건이라 앞면이 아니라 윗면에 화구를 그린다.
       화구 수·자리는 2D 와 같은 함수(`burnerCount`)를 본다 — 1구 플레이트에 넷을 그렸었다 */
    const n = P.burnerCount(it), r = Math.min(w, d) * (n <= 2 ? 0.24 : 0.16);
    const spots = n === 1 ? [[0, 0]]
      : n === 2 ? [[-0.24, 0], [0.24, 0]]
      : n === 3 ? [[-0.25, -0.20], [0.25, -0.20], [0, 0.22]]
      : [[-0.25, -0.22], [0.25, -0.22], [-0.25, 0.22], [0.25, 0.22]];
    for (const [ux, uz] of spots) topDisc(r, ux * w, uz * d, darkMat);
  } else if (/식기세척기|전자레인지|오븐|데이코/.test(cat)){
    /* 앞면이 통째로 도어인 물건 — 도어 패널과 가로 손잡이를 넣는다 */
    plate(w * 0.86, h * 0.66, 0, h * 0.5, faceMat);
    plate(w * 0.62, 0.014, 0, h * 0.84, darkMat);
  } else if (/공기청정기|청소기|정수기|제습기/.test(cat)){
    /* 2D 가 위에서 본 원(토출구·그릴)을 그리므로 3D 도 윗면에 원을 얹는다 */
    topDisc(Math.min(w, d) * 0.30, 0, 0, faceMat);
  } else if (/에어컨/.test(cat)){
    /* 부품 이름이 물건을 밝힌다 — 2D 와 같은 갈래로 나눈다(`실내기`·`실외기`·`판넬`) */
    const p = String(it.part || '');
    if (/실외기/.test(p)){
      /* 앞면 팬 그릴 — 실외기에서 눈에 들어오는 것이 이것이고, 이격도 그 방향으로 잡는다 */
      disc(Math.min(w, h) * 0.34, h * 0.5, darkMat);
    } else if (/판넬/.test(p)){
      /* 천장 카세트 판넬은 **아래를 본다** — 앞면이 아니라 밑면에 흡입구를 얹는다 */
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.42, d * 0.42), darkMat);
      m.rotation.x = Math.PI / 2; m.position.set(0, 0.004, 0); g.add(m);
    } else {
      plate(w * 0.6, 0.008, 0, h * 0.86, blueMat);            // 토출구 띠
    }
  /*
   * ── 리빙 4종 (2026-08-14) ─────────────────────────────────────
   * **2D `drawGlyph` 와 같은 어휘**로 넣는다 — 같은 품목이 앱마다 다른 그림이면 눈이 헤맨다.
   * 카탈로그에 규격도가 없으므로 도어 분할선·손잡이는 넣지 않는다. 그리는 것은 그
   * 물건의 형태 자체다(2D 와 짝이 맞는지 `test-plans` 가 양방향으로 검사한다).
   */
  } else if (/리빙 비데/.test(cat)){
    topDisc(Math.min(w, d) * 0.32, 0, d * 0.12, faceMat);     // 위에서 보이는 시트 구멍
  } else if (/리빙 선풍기/.test(cat)){
    topDisc(Math.min(w, d) * 0.44, 0, 0, faceMat);            // 위에서 본 원형 날개
  } else if (/리빙 안마기/.test(cat)){
    topDisc(Math.min(w, d) * 0.22, -w * 0.2, 0, faceMat);     // 발 두 짝이 들어가는 자리
    topDisc(Math.min(w, d) * 0.22, w * 0.2, 0, faceMat);
  } else if (/리빙 욕실케어/.test(cat)){
    plate(w * 0.78, h * 0.64, 0, h * 0.5, faceMat);           // 벽에 붙는 사각 판
  }

  /*
   * 열린 문짝은 **여기서 만들지 않는다** — `paintDoors()` 가 `doorRoot` 에 따로 세운다.
   * 문짝 좌표는 이미 월드라 이 그룹의 회전에 딸려 돌면 안 되고, 무엇보다 여는 동작이
   * 프레임마다 자세를 바꾸므로 **가전 몸통까지 매 프레임 다시 만들 수는 없다.**
   * 다각형은 여전히 `doorLeaves` 가 만든 것을 그대로 쓴다 — 그림과 충돌 판정이 갈리면
   * 화면에서는 부딪히는데 경고가 없거나 그 반대가 된다.
   */

  g.userData.item = it;      // 레이캐스트로 집었을 때 어느 가전인지 되찾는다

  /* 2D 와 같은 자세로 놓는다 — it 는 뒷면 중앙(bx,by)과 각도 a 로 표현되고 로컬 +y 가 정면이다.
     몸통 중심은 로컬 (0, d/2) 이므로 회전시켜 월드로 옮긴다. */
  const c = Math.cos(it.a), s = Math.sin(it.a);
  const cx = it.bx - (it.d / 2) * s, cy = it.by + (it.d / 2) * c;
  /*
   * ── 접지 그림자 ────────────────────────────────────────────────
   *
   * 그림자가 없으면 가전이 바닥에 **얹혀 있지 않고 떠 보인다** — "우리 집 느낌"이
   * 가장 크게 깨지는 지점이다. 그렇다고 **그림자 맵을 켜지 않는다**: 이 앱의 바닥은
   * 원본 도면 텍스처라 전체가 어두워지면 마루색·가구가 죽는다(위 조명 주석과 같은 이유).
   *
   * 그래서 **발밑에만** 부드러운 원을 깐다. 텍스처는 한 장을 만들어 모두가 나눠 쓰고
   * 크기만 발자국에 맞춘다(제품마다 만들면 GPU 자원이 샌다 — 색 재질과 같은 규칙).
   *
   * **바닥에 놓는 것에만 붙인다.** 벽에 건 TV·천장 카세트의 그림자가 발자국 자리에
   * 생기면 없는 물건이 거기 있는 것처럼 보인다.
   */
  /* 자산이 있으면 비동기로 바꿔 끼운다 — 없으면 아무 일도 일어나지 않는다 */
  swapInModel(g, it);
  if (!(it.mh > 0)) {
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(M(it.w) * 1.35, M(it.d) * 1.35), shadowMat());
    sh.rotation.x = -Math.PI / 2;
    sh.position.y = 0.003;                 // 바닥과 z-fighting 하지 않게 살짝 띄운다
    sh.renderOrder = -1;
    sh.userData.isShadow = true;           // 검사가 '디테일' 로 세지 않게 표시해 둔다
    g.add(sh);
  }
  /* **설치 높이만큼 띄운다.** 몸통·모서리선·디테일이 전부 이 그룹 안에 있으므로 그룹을
     올리면 함께 올라간다(디테일마다 따로 올리면 하나 빠뜨렸을 때 조용히 어긋난다).
     기본 0 이라 바닥에 놓는 가전은 예전과 한 픽셀도 다르지 않다. */
  g.position.set(M(cx), M(it.mh || 0), M(cy));
  /* 박스 로컬 +Z 를 제품 정면 (−sin a, cos a) 에 맞추면 회전각은 −a 다 */
  g.rotation.y = -it.a;
  return g;
}

/* ── 장면 구성 ── */
function build(refit){
  ensure();
  while (root.children.length) root.remove(root.children[0]);
  culled.length = 0; segs2d = []; eyeAt = null; roomPolysM = [];
  /* 열린 문짝은 따로 담는다 — 여는 동작이 프레임마다 이 그룹만 갈아 끼운다 */
  doorPlan = [];
  doorRoot = new THREE.Group(); root.add(doorRoot);
  const loops = P.roomLoops();
  const box = new THREE.Box3();
  let bestA = 0;
  /* 방들 **아래에** 도면 한 장을 깐다 — 인식 못 한 곳도 발밑이 생긴다 */
  const base = basePlanFloor();
  if (base) root.add(base);
  for (const L of loops){
    const g = buildRoom(L);
    root.add(g);
    for (const p of L.pts) box.expandByPoint(new THREE.Vector3(M(p[0]), 0, M(p[1])));
    for (const w of (L.walls || [])) segs2d.push([M(w.x1), M(w.y1), M(w.x2), M(w.y2)]);
    /*
     * 눈높이 시점이 설 자리 — **가장 넓은 방 안쪽의 한 점**이다.
     * 여러 방의 경계상자 중심은 ㄱ자 평면이나 방이 떨어져 있을 때 **아무 방에도 안 들어간다**
     * (복도 한가운데나 벽 속에 서게 된다). 그래서 방마다 따로 구해 넓은 쪽을 쓴다.
     */
    const mp = L.pts.map((p) => [M(p[0]), M(p[1])]);
    roomPolysM.push(mp);
    let a2 = 0, cx = 0, cy = 0;
    for (let i = 0, j = mp.length - 1; i < mp.length; j = i++){
      const f = mp[j][0] * mp[i][1] - mp[i][0] * mp[j][1];
      a2 += f; cx += (mp[j][0] + mp[i][0]) * f; cy += (mp[j][1] + mp[i][1]) * f;
    }
    const A = Math.abs(a2) / 2;
    if (A > bestA){
      let c = a2 ? [cx / (3 * a2), cy / (3 * a2)] : null;
      /* 무게중심은 오목한 방(ㄱ자)에서 밖으로 나간다 — 그러면 경계상자 중심으로 물러선다 */
      if (!c || !inPoly(mp, c[0], c[1])){
        const xs = mp.map((p) => p[0]), ys = mp.map((p) => p[1]);
        const b = [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
        c = inPoly(mp, b[0], b[1]) ? b : mp[0];
      }
      bestA = A; eyeAt = c;
    }
  }
  let n = 0, blocked = 0, waiting = 0, openN = 0;
  const placed = P.state.items.filter((i) => !i.staged);
  /*
   * **대기(staged) 중인 가전도 세운다 — 흐릿하게.**
   * 예전에는 아예 안 그렸는데, 그러면 3D 를 켠 채로 가전을 고르면 화면에 아무것도 안 나타나
   * 상담사가 2D 로 돌아가야 했다. 고객 앞에서 화면이 왔다 갔다 한다.
   * 2D 가 도면 밖에 회색 점선으로 꺼내 두는 것과 같은 뜻이다 — **아직 놓은 것이 아니므로**
   * 판정은 하지 않고(문·겹침 모두), 끌어서 방 안으로 넣으면 그때부터 진짜 배치가 된다.
   */
  for (const it of P.state.items){
    if (it.staged){
      const g = applianceMesh(it);
      g.traverse((o) => { if (o.isMesh){ o.material = ghostMat; } });
      root.add(g); waiting++;
      continue;
    }
    const mesh = applianceMesh(it);
    root.add(mesh); n++;
    /* 문을 열었을 때 부딪히면 **빨갛게** 칠하고 몇 건인지 센다.
       배치 단계의 주황 주의와 달리 여기서는 하드하게 말한다 — 상담사가 직접 연 것이다. */
    /* 문 열림은 **제품마다** 다르다 — 연 것만 판정하고, 연 것만 빨갛게 칠한다 */
    const opened = !!it.doorOpen && canOpenDoor(it);
    const hits = opened ? P.doorHits(it, placed, P.state.walls) : [];
    const bad = hits.length > 0;
    if (opened) openN++;
    if (bad) blocked++;
    /* 닫힌 것도 계획에 넣는다 — 그래야 **닫히는 동작**이 보인다(빼면 그 자리에서 사라진다) */
    if (canOpenDoor(it)){
      /*
       * 문을 열면 **앞면을 지우고 안을 보여줘야** 한다. 그러려면 프레임마다 두 가지를
       * 만져야 하는데, 매 프레임 장면을 훑을 수는 없으므로 여기서 한 번 찾아 둔다 —
       * 몸통(앞면 재질을 지울 대상)과 **문에 붙은 그림**(도어 분할선·손잡이·원형 도어).
       */
      let body = null; const faces = [];
      mesh.traverse((o) => {
        if (o.userData.isBody && Array.isArray(o.material)) body = o;
        if (o.userData.doorFace) faces.push(o);
      });
      doorPlan.push({ it, bad, body, faces });
    }
    /* 문이 막히면 빨갛게 — 제품 색으로 칠한 것도 함께 바뀌어야 경고가 보인다 */
    /*
     * **재질 배열을 통째로 갈아 끼우지 않는다.** 몸통은 면마다 재질이 다른 6칸 배열이라
     * (앞면만 `faceMat`) 하나로 덮어쓰면 배열이 사라지고, 그러면 문을 열 때 **앞면만
     * 지우는 일**(`paintDoors`)을 할 수가 없다 — 열어도 안이 안 보인다.
     */
    if (bad) mesh.traverse((o) => {
      if (!o.isMesh) return;
      if (Array.isArray(o.material)) { if (o.userData.isBody) o.material = o.material.map(() => badMat); }
      else if (o.userData.isBody || o.material === bodyMat) o.material = badMat;
    });
    /* 고른 것은 모서리를 삼성 블루로 굵게 — 무엇을 돌리고 지우는지 보여야 한다 */
    if (it.id === P.state.sel) mesh.traverse((o) => { if (o.isLineSegments) o.material = selEdge; });
    if (showTags && it.label){
      const sp = tagSprite(it.label, bad);
      const [cx, cy] = P.bodyCenter(it);
      sp.position.set(M(cx), M((it.h || 800) + 260), M(cy));   // 제품 머리 위
      root.add(sp);
    }
  }
  /* 카메라를 방 전체가 보이는 자리로 */
  const c = box.getCenter(new THREE.Vector3());
  const sz = box.getSize(new THREE.Vector3());
  ctr = [c.x, c.z];
  /*
   * **걸어 다닐 범위 — 도면 전체다**(2026-08-28 사장님: *"조이스틱으로 도면 전체를 다
   * 이동할 수 있어야 합니다"*). 방 다각형으로 가두던 것을 풀었다.
   * 가두지 않고 완전히 자유롭게 두면 **끝없이 걸어 나가 도면을 잃어버린다** — 3D 에는
   * 2D 의 화면 맞추기(⤢) 같은 손잡이가 없어 되돌아올 길이 시점 프리셋뿐이다.
   * 그래서 도면(없으면 방 경계) **바깥 2m** 까지만 둔다. 실질적으로 "아무 데나"이면서
   * 길을 잃지는 않는다.
   */
  {
    const ps = P.state, MG = 2;
    let x0 = box.min.x, z0 = box.min.z, x1 = box.max.x, z1 = box.max.z;
    if (ps.img && ps.mmPerPx && ps.imgW && ps.imgH){
      x0 = Math.min(x0, 0); z0 = Math.min(z0, 0);
      x1 = Math.max(x1, M(ps.imgW * ps.mmPerPx)); z1 = Math.max(z1, M(ps.imgH * ps.mmPerPx));
    }
    walkBox = Number.isFinite(x0) && Number.isFinite(x1)
      ? { x0: x0 - MG, z0: z0 - MG, x1: x1 + MG, z1: z1 + MG } : null;
  }
  fitDist = Math.max(3, Math.hypot(sz.x, sz.z) * 1.15);
  orb.max = Math.max(20, fitDist * 3);
  /*
   * **화면을 다시 맞추는 것은 요청할 때만 한다.**
   * 예전에는 build() 끝에서 늘 view() 를 불렀는데, 가전을 끄는 동안 매 프레임 build() 가
   * 돌기 때문에 **카메라가 계속 제자리로 튕겨** 나갔다. 문 열기·이름표를 켜도 보던
   * 각도를 잃었다. 방이 바뀐 것이 아니라 그 안의 물건만 바뀐 때는 시점을 그대로 둔다.
   */
  if (refit){ orb.tx = c.x; orb.tz = c.z; view(mode3); }
  paintDoors();          // 지금 진행도로 문짝을 세운다(여는 도중이면 그 자세로)
  return { rooms: loops.length, items: n, blocked, waiting, opened: openN, doorable: doorPlan.length };
}

/* ── 시점 프리셋 ────────────────────────────────────────────────
   상담에서 실제로 필요한 시점은 셋이다:
     둘러보기 — 방 전체가 보이는 비스듬한 각도(기본)
     눈높이   — 사람이 서서 보는 높이. "우리 집 느낌"이 가장 잘 나는 각도다
     위에서   — 2D 평면도와 같은 구도. 2D ↔ 3D 를 눈으로 잇게 해 준다
   `fit` 은 방 크기에서 다시 계산한다 — 방마다 필요한 거리가 다르다. */
let fitDist = 8, mode3 = 'iso';
const EYE_MM = 1600;           // 서서 보는 눈높이. 한국 성인 평균 신장에서 눈까지가 대략 이 값이다
function view(name){
  mode3 = (name === 'eye' || name === 'top') ? name : 'iso';
  /* 실내에서는 화각을 넓힌다 — 부동산 실내 사진이 광각으로 찍히는 것과 같은 이유다.
     52°로는 2m 앞 냉장고가 화면을 다 먹어 방이 안 보인다. */
  if (cam){ cam.fov = mode3 === 'eye' ? 72 : 52; cam.updateProjectionMatrix(); }
  if (mode3 === 'eye'){
    /*
     * 방 **안**에 서서 둘러보는 시점. 실제 위치는 apply() 가 매 프레임 벽까지 거리로 자른다 —
     * 한 번 놓아 두기만 하면 사용자가 돌리는 순간 다시 벽을 뚫는다.
     *
     * 거리를 크게 넣어 두면 자동으로 **벽 앞까지 물러선다.** 방 한가운데 서면 코앞의
     * 가전이 화면을 채워 방이 안 보인다 — 실내 사진이 늘 구석에서 찍히는 것과 같은 이유다.
     * 그 뒤 두 손가락으로 좁히면 앞으로 다가온다.
     */
    orb.pitch = 0.06; orb.dist = 1e4;
    if (eyeAt){ orb.tx = eyeAt[0]; orb.tz = eyeAt[1]; }
  } else if (mode3 === 'top'){
    orb.pitch = 1.44; orb.ty = 0; orb.dist = fitDist * 0.95; orb.yaw = 0;
    if (ctr){ orb.tx = ctr[0]; orb.tz = ctr[1]; }
  } else {
    orb.pitch = 0.85; orb.ty = M(WALL_H_MM) * 0.35; orb.dist = fitDist; orb.yaw = -0.7;
    if (ctr){ orb.tx = ctr[0]; orb.tz = ctr[1]; }
  }
}

/* ── 눈높이 시점을 방 안에 가둔다 ────────────────────────────────
   벽 선분을 m 단위로 들고 있다가, 시선 방향으로 광선을 쏴 가장 가까운 벽을 찾는다.
   궤도 반지름을 그보다 짧게 자르면 **돌려도 확대해도 벽 밖으로 못 나간다.**
   개구부(문·창)도 벽으로 친다 — 트인 곳으로 카메라가 빠져나가면 옆방이 통째로 보여
   "우리 집 한 칸"을 보여주려던 뜻이 사라진다.
──────────────────────────────────────────────────────────────── */
let segs2d = [], eyeAt = null, ctr = null;
/*
 * 방 경계 다각형(m). 조이스틱 이동이 **집 밖으로 새지 않게** 하는 데만 쓴다.
 * `segs2d` 로는 못 한다 — 그쪽은 벽 선분 묶음이라 "지금 이 점이 방 안인가"를 못 답한다.
 */
let roomPolysM = [];
/** 광선 (px,pz)+t·(dx,dz) 와 선분의 교차 t (없으면 null) */
function raySeg(px, pz, dx, dz, s){
  const ex = s[2] - s[0], ez = s[3] - s[1];
  const den = dx * ez - dz * ex;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((s[0] - px) * ez - (s[1] - pz) * ex) / den;
  const u = ((s[0] - px) * dz - (s[1] - pz) * dx) / den;
  return (t > 1e-4 && u >= 0 && u <= 1) ? t : null;
}
function clampInside(){
  if (!segs2d.length) return;
  const cp = Math.max(Math.cos(orb.pitch), 1e-3);
  const dx = Math.sin(orb.yaw), dz = Math.cos(orb.yaw);
  let hit = Infinity;
  for (const s of segs2d){ const t = raySeg(orb.tx, orb.tz, dx, dz, s); if (t != null && t < hit) hit = t; }
  const rmax = Math.max(M(500), (hit === Infinity ? fitDist : hit) - M(300));
  orb.dist = Math.min(orb.dist, rmax / cp);
  /* 카메라가 눈높이에 오도록 바라보는 점의 높이를 거꾸로 맞춘다 */
  orb.ty = Math.max(M(200), M(EYE_MM) - orb.dist * Math.sin(orb.pitch));
}
/** 다각형 안인가 (짝수-홀수) */
function inPoly(pts, x, y){
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}

/* ── 카메라 적용 ── */
function apply(){
  if (mode3 === 'eye') clampInside();     // 돌리는 중에도 매 프레임 다시 자른다
  const cp = Math.cos(orb.pitch), sp = Math.sin(orb.pitch);
  cam.position.set(
    orb.tx + orb.dist * cp * Math.sin(orb.yaw),
    orb.ty + orb.dist * sp,
    orb.tz + orb.dist * cp * Math.cos(orb.yaw));
  cam.lookAt(orb.tx, orb.ty, orb.tz);
}

function size(){
  const r = cv3.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // 폰에서 3배까지 올리면 느려진다
  if (!r.width || !r.height) return;
  ren.setPixelRatio(dpr);
  ren.setSize(r.width, r.height, false);
  cam.aspect = r.width / r.height;
  cam.updateProjectionMatrix();
  placeJoy();   // 폭이 바뀌면 안내띠가 접히는 줄 수도 바뀐다
}

function loop(ts){
  raf = requestAnimationFrame(loop);
  /* 닫혀 있는 동안 시계를 끊는다 — 안 그러면 다시 열 때 그 사이 시간이 한 프레임 dt 로
     잡혀 조이스틱을 밀어 두었던 만큼 **순간이동**한다(문 여닫이의 doorClock 과 같은 함정). */
  if (!on){ joyClock = 0; return; }
  stepJoy(ts || performance.now());   // 첫 호출은 rAF 가 아니라 open() 이 직접 부른다
  /* 문이 여닫히는 중이면 그 프레임만큼 자세를 옮기고 문짝만 다시 세운다.
     움직임이 끝나면 아무 일도 하지 않는다 — 늘 다시 만들면 폰이 계속 뜨거워진다 */
  if (stepDoors()) paintDoors();
  apply();
  cullWalls();
  ren.render(scene, cam);
}

/* ── 손가락 조작 — 한 손가락 회전 / 두 손가락 확대·이동 ──
   2D 화면의 관례(한 포인터는 끌면 이동)와 다르지만, 3D 에서 가장 하고 싶은 일이
   "돌려 보기"라 한 손가락에 회전을 준다. 안내띠가 그 사실을 적는다. */
const pts = new Map();
let last = null, pinch = 0;

/* ── 3D 에서 가전 끌어 옮기기 ────────────────────────────────────
 * 보기 전용이면 옮기려고 2D 로 돌아가야 하는데, 그러면 고객 앞에서 화면이 왔다 갔다 한다.
 * **가전을 누르면 가전이 움직이고, 빈 곳을 끌면 카메라가 돈다** — 2D 에서 "가전을 누르면
 * 모드와 상관없이 가전이 반응한다"고 정한 것과 같은 규칙이다.
 *
 * 바닥면(y=0)에 광선을 쏘아 그 교점을 새 자리로 삼는다. 판정은 **2D 와 같은 함수**를
 * 그대로 쓴다(`nudgeInside`·`hitsOther`) — 3D 에서만 되는 배치가 생기면 안 된다.
──────────────────────────────────────────────────────────────── */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const floor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPt = new THREE.Vector3();
let drag = null;      // { it, offX, offY, prev }
let downAt = null;    // 누른 자리 — 빈 곳을 '눌렀는지' 카메라를 '돌렸는지' 가른다
let lastTap = null;   // 더블탭 회전용 — 2D 와 같은 500ms 창(손가락은 마우스보다 느리다)

/** 화면 좌표 → 바닥면 위의 월드 mm. 바닥과 안 만나면 null */
function floorAt(clientX, clientY){
  const r = cv3.getBoundingClientRect();
  ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, cam);
  if (!ray.ray.intersectPlane(floor, hitPt)) return null;
  return [hitPt.x * 1000, hitPt.z * 1000];
}
/** 그 자리에 가전이 있으면 돌려준다 */
function pickItem(clientX, clientY){
  const r = cv3.getBoundingClientRect();
  ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, cam);
  for (const h of ray.intersectObjects(root.children, true)){
    let o = h.object;
    while (o && !o.userData.item) o = o.parent;
    if (o && o.userData.item) return o.userData.item;
  }
  return null;
}

cv3.addEventListener('pointerdown', (e) => {
  /* **조이스틱에서 시작한 손가락은 여기 오지 않는다** — 스틱이 캡처한다. 그래도 한 겹 더
     막는다: 캡처가 실패했을 때 새어 들어오면 조이스틱이 가전을 집어 끌고 다니게 된다. */

                                        + (uy * lim * R * 0.50).toFixed(1) + 'px)';

    joyVec[key][0] = ux * t; joyVec[key][1] = uy * t;
  };

    id = null; joyVec[key][0] = joyVec[key][1] = 0;

    e.preventDefault(); e.stopPropagation();

    cx = r.left + r.width / 2; cy = r.top + r.height / 2; R = r.width / 2;

   * 공간 수·가전 수는 패널의 `공간`·`배치 목록`에 그대로 있어 화면에 같은 숫자가 세 번 떴다.
   * 여기 남길 것은 **이 화면에서만 알 수 있는 것**이다 —
   * 층고가 가정값이라는 사실 · 대기 중인 가전(할 일) · 문 열림 판정(경고).
   */
  bar.innerHTML =
    `<b>3D</b> · 층고 ${WALL_H_MM.toLocaleString()}mm<span style="opacity:.55">(가정)</span>` +
    /* 벽에 건 가전을 고르면 **그 설치 높이**를 여기 적는다 — 3D 에서만 보이는 값이고,
       기본값이 가정에서 나온 것이라 숫자만 띄우면 확정처럼 읽힌다(층고와 같은 이유).
       고치는 것은 2D 하단 띠의 입력칸이다. */
    (sel && P.mountable(sel)
      ? ` · 설치 높이 ${Math.round(sel.mh || 0).toLocaleString()}mm`
        + `<span style="opacity:.55">(${P.mountTag(sel)})</span>`
      : '') +
    (info.waiting ? ` · <span style="opacity:.8">대기 ${info.waiting}대 — 끌어서 넣으세요</span>` : '') +
    (warn ? ' · ' + warn : '') +
    `<span class="sp"></span>` +
    `<button data-v="iso">둘러보기</button>` +
    `<button data-v="eye">눈높이</button>` +
    `<button data-v="top">위에서</button>` +
    (doorSel
      ? `<button id="d3-door" class="${doorSel.doorOpen ? 'on' : ''}">${doorSel.doorOpen ? '문 닫기' : '문 열기'}</button>`
      : `<button id="d3-door" class="${info.opened ? 'on' : ''}">${info.opened ? '문 전체 닫기' : '문 전체 열기'}</button>`) +
    /* 버튼이 여섯이면 좁은 화면에서 줄이 넘어간다. 켜짐 여부는 글자가 아니라
       **색**으로 알린다 — 라벨이 짧아야 폰에서 한 줄에 들어간다. */
    `<button id="d3-tag" class="${showTags ? 'on' : ''}">이름</button>` +
    /* 고른 가전이 있으면 회전·삭제를 띄운다. 회전 각도는 카테고리가 정한다
       (에어컨 45° — 거실 모서리에 비스듬히 놓는 설치가 흔하다). 2D 와 같은 함수를 쓴다. */
    (sel ? `<button id="d3-rot">↻ ${P.rotLabel(sel.cat)}°</button>` +
           `<button id="d3-del">✕ 삭제</button>` : '') +
    `<button id="d3-close">2D로</button>`;
  bar.querySelectorAll('[data-v]').forEach((b) => { b.onclick = () => view(b.dataset.v); });
  if (sel){
    document.getElementById('d3-rot').onclick = () => {
      P.rotateItem(sel); P.evaluate(); P.draw(); paintBar(build());
    };
    document.getElementById('d3-del').onclick = () => {
      P.removeItem(sel.id); P.draw(); paintBar(build());
    };
  }
  document.getElementById('d3-door').onclick = () => {
    if (doorSel) doorSel.doorOpen = !doorSel.doorOpen;                 // 고른 제품 하나만
    else {
      const want = !openDoorCount();                                   // 하나라도 열려 있으면 전부 닫는다
      for (const it of P.state.items) if (canOpenDoor(it)) it.doorOpen = want;
    }
    paintBar(build());
  };
  document.getElementById('d3-tag').onclick = () => { showTags = !showTags; paintBar(build()); };
  document.getElementById('d3-close').onclick = close;
  placeJoy();   // 띠 높이가 방금 바뀌었을 수 있다(버튼이 늘면 두 줄로 접힌다)
}

function open(){
  const info = build(true);   // 열 때만 화면을 맞춘다
  on = true;
  doorClock = 0;              // 닫아 둔 사이의 시간이 dt 로 잡히면 문이 순간이동한다
  joyClock = 0; releaseJoy();  // 밀어 둔 채로 닫았어도 열자마자 걸어가지 않게
  document.getElementById('stage').classList.add('on3d');
  document.body.classList.add('is3d');   // 도구막대의 2D 전용 손잡이를 감춘다
  size(); if (!raf) loop();
  paintBar(info);
  return info;
}
function close(){
  on = false;
  releaseJoy();
  document.getElementById('stage').classList.remove('on3d');
  document.body.classList.remove('is3d');
}
window.Place3D = {
  open, close, toggle(){ return on ? (close(), null) : open(); },
  get isOpen(){ return on; },
  /* 내용이 바뀌었을 때 다시 세운다 — **화면은 다시 맞추지 않는다.** 그러면 보던 각도를 잃는다. */
  rebuild(){ if (on) { const i = build(false); paintBar(i); } },
  /**
   * 지금 상태를 즉시 한 장 그린다.
   * `preserveDrawingBuffer` 는 **마지막으로 그린 프레임**을 보관할 뿐이라, 장면을 바꾼
   * 직후에 캔버스를 복사하면 바뀌기 전 그림이 나간다 — 실제로 공유 카드에 문이 닫힌
   * 냉장고가 찍혔다. 내보내기 전에 반드시 이걸 부른다.
   */
  render(){ if (!ren) return false; settleDoors(); apply(); cullWalls(); ren.render(scene, cam); return true; },
  view,
  /**
   * 문 열기/닫기 — **모든 제품**에 걸린다(제품 하나만은 `door(id)`).
   * 열었을 때 부딪히는 대수를 돌려준다. 인자를 안 주면 뒤집는다 —
   * 하나라도 열려 있으면 전부 닫고, 다 닫혀 있으면 전부 연다.
   */
  doors(open){
    const want = open == null ? !openDoorCount() : !!open;
    for (const it of P.state.items) if (canOpenDoor(it)) it.doorOpen = want;
    const i = build(); if (on) paintBar(i); return i;
  },
  /** 제품 하나만 여닫는다 — 상담에서 실제로 하는 동작이다 */
  door(id, open){
    const it = P.state.items.find((x) => x.id === id);
    if (!canOpenDoor(it)) return null;
    it.doorOpen = open == null ? !it.doorOpen : !!open;
    const i = build(); if (on) paintBar(i); return i;
  },
  /** 문이 하나라도 열려 있는가 (공유 카드가 "문 열림"을 적을지 판단한다) */
  get doorsOpen(){ return openDoorCount() > 0; },
  /** 문을 열어 보여줄 수 있는 제품인가 */
  canOpenDoor,
  /** 여는 도중을 건너뛰고 목표 자세로 맞춘다 — 검사가 동작을 기다리지 않아도 되게 */
  settleDoors,
  /** 그 제품의 문이 지금 얼마나 열려 있는가(0~1). 여는 **동작**을 검사가 들여다본다 */
  doorFracOf(id){ return doorFrac.get(id) || 0; },
  /** 가전 이름표 켜기·끄기 (기본은 꺼짐 — 고객 화면에 글자가 뜨면 "우리 집 느낌"이 흐려진다) */
  /* 인자 이름을 `on` 으로 두면 모듈의 `on`(3D 가 열려 있는가)을 가린다 — 그러면
     "화면이 켜져 있을 때만 다시 그린다"가 정반대로 동작한다. */
  tags(want){
    showTags = want == null ? !showTags : !!want;
    const info = build();
    if (on) paintBar(info);
    return info;
  },
  get tagsOn(){ return showTags; },
  get canvas(){ return cv3; },
  /** 지금 조이스틱이 얼마나 밀려 있는가 (−1~1). 스틱이 입력을 받았는지 검사가 확인한다 */
  get joy(){ return { move: joyVec.move.slice(), look: joyVec.look.slice() }; },
  /* 테스트가 장면을 직접 들여다볼 수 있게 연다 — 좌표계가 뒤집혔는지는
     화면을 봐서는 알기 어렵고(방이 대칭이면 똑같아 보인다) 정점을 재야 잡힌다. */
  get root(){ return root; },
  get camera(){ return cam; },
  /** 화면 좌표에 있는 가전 (없으면 null) — 끌어 옮기기가 무엇을 집는지 검사할 때 쓴다 */
  pickAt(x, y){ return pickItem(x, y); },
  /** 화면 좌표가 가리키는 바닥 위 월드 mm */
  floorAt(x, y){ return floorAt(x, y); },
  /** 지금 바라보고 있는 점(m) — 조이스틱이 실제로 옮겼는지 검사가 잰다 */
  get target(){ return [orb.tx, orb.tz]; },
  /** 걸어 다닐 수 있는 범위(m) — 검사가 "도면 전체를 걷는가"를 잰다 */
  get walkBox(){ return walkBox ? { ...walkBox } : null; },
  /** 바라보는 점을 옮긴다 (검사·자동화용) */
  moveTarget(dx, dz){ moveTarget(dx, dz); apply(); },
  /** 지금 바라보는 점이 잡힌 공간 안인가 */
  get inRoomNow(){ return insideAnyRoom(orb.tx, orb.tz); },
  WALL_H_MM, M,
};

}
  })();
  return __p3d;
};
</script>
</body>
