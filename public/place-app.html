          return `<button class="chip${sd===sido?' on':''}" data-sido="${esc(sd)}">${esc(sd)}<span>${n}</span></button>`;
        }).join('');
        chipBox.querySelectorAll('.chip').forEach((c)=>{
          c.onclick = ()=>{ sido = c.dataset.sido; render(); };
        });
      }
      items = regions().filter((r)=> !sido || sidoOf(r) === sido).map((r) => {
        const cs = idx.filter((c) => c.region === r);
        /*
         * **도면과 벽선을 한 숫자에 뭉치지 않는다.** 예전에는 둘을 더해 놓고 라벨은
         * `도면 N장` 이라 적어서, 도면이 한 장도 없는 하남이 **"도면 6장"** 으로 떴다
         * (2026-08-19 프로덕션에서 확인 — LH 벽선 6건이 그 숫자였다). 들어가 보면
         * 도면이 없으니 화면이 거짓말을 한 셈이다. 단지 단계는 이미 갈라 적고 있었다.
         */
        const planN = cs.reduce((s, c) => s + c.plans.length, 0);
        const savedN = savedOnly.filter((e) => (e.region || '지역 미지정') === r).length;
        // 칩에서 시·도를 이미 골랐으니 목록에는 시·군만 적는다 — 줄이 짧아야 눈에 잘 들어온다
        const shortName = cityOf(r);
        const withPlan = cs.length + uniq(savedOnly.filter((e) => (e.region || '지역 미지정') === r).map((e) => e.complex)).length;
        /* 그 시의 전체 아파트 수 — 도면이 없어도 목록에는 있다. 목차만 미리 받아 둔다.
           상담사가 "그 시에 몇 단지가 있나"를 먼저 알아야 없다고 단정하지 않는다. */
        const allN = ((aptCity[shortName.replace(/[시군]$/, '')] || {}).n || 0);
        const bits = [];
        if (planN) bits.push(`도면 ${planN}장`);
        if (savedN) bits.push(`저장된 방 ${savedN}종`);
        if (!bits.length) bits.push('도면 0장');
        return `<button class="libitem" data-v="${esc(r)}"><b>${esc(shortName)}</b>
          <span class="hint">${allN ? `단지 ${allN.toLocaleString()}곳 · ` : `단지 ${withPlan}곳 · `}${bits.join(' · ')}</span></button>`;
      });
    } else if (lv === 'complex') {
      items = inRegion().map((c) => `<button class="libitem" data-id="${esc(c.id)}"><b>${esc(c.complex)}</b>
        <span class="hint">도면 ${c.plans.length}장${savedIn(c.complex).length ? ` · 저장된 방 ${savedIn(c.complex).length}종` : ''}${
          c.allTilted ? ' · <b>벽 인식이 어려운 도면만 있습니다</b>' : ''}</span></button>`);
      for (const e of savedOnly.filter((x) => (x.region || '지역 미지정') === region)) {
        items.push(`<button class="libitem" data-saved="${esc(e.complex)}"><b>${esc(e.complex)}</b>
          <span class="hint">저장된 방만 있음</span></button>`);
      }
      /*
       * **도면이 없는 단지도 함께 보여준다**(2026-08-15). 경기 12개 시 + 강원 전역
       * 18개 시·군 3,829곳 중 도면이 있는 것은 150곳뿐이라, 그것만 띄우면 상담사가
       * 대부분의 고객에게 *"그 단지는 없습니다"* 로 시작해야 한다. 이름·동·입주년월만
       * 있어도 고객 집을 특정하고 평형 상담을 시작할 수 있고, 도면은 받아서 올리면 된다.
       * 이미 도면이 있는 단지는 위에서 나왔으므로 **이름이 겹치면 뺀다.**
       */
      const cityKey = cityOf(region).replace(/[시군]$/, '');
      const extra = (aptCache[cityKey] || []).filter((a) => {
        const n = a.n.replace(/\s+/g, '');
        return !inRegion().some((c) => { const h = c.complex.replace(/\s+/g, ''); return h.includes(n) || n.includes(h); });
      });
      for (const a of extra) {
        const yr = a.y ? `${a.y.slice(0, 4)}년 ${+a.y.slice(4, 6)}월 입주` : '입주년월 미상';
        items.push(`<button class="libitem noplan" data-apt="${esc(a.n)}" data-yr="${esc(a.y || '')}"><b>${esc(a.n)}</b>
          <span class="hint">${esc(a.d || '')} · ${esc(yr)} · <b>도면 없음</b> — 고객 도면을 올려 주세요</span></button>`);
      }
    } else {
      items = cx.plans.map((p) => {
        const s = saved.find((e) => e.complex === cx.complex && e.type === p.type);
        // 도면에 인쇄된 치수를 읽어 축척을 미리 구해 둔 도면이 있다. 확신도를 함께 밝힌다 —
        // 자동으로 구한 값이라 사용자가 눈으로 확인하고 넘어갈 수 있어야 한다.
        const sc = p.mmPerPx ? `<span class="ty">축척 ${p.scaleConf || '자동'}</span>` : '';
        /*
         * 미리보기를 함께 보여준다. 도면 고르기는 자동 선별에 기대는데, 그 선별이 가끔
         * 설명글·면적표·3D 조감도를 고른다(표본 40장 중 8장). 어느 판별식으로도 깨끗이
         * 갈리지 않아 — 방 이름 OCR·색 가짓수·벽 그물망을 다 시도했다 — 사람이 눈으로
         * 건너뛸 수 있게 하는 편이 확실하다. 이 앱이 "자동은 초안, 확정은 사람"인 것과 같다.
         */
        return `<button class="libitem withthumb" data-file="${esc(p.file)}" data-type="${esc(p.type)}" data-excl="${p.exclusiveM2 || ''}"
            ${p.mmPerPx ? `data-mmpx="${p.mmPerPx}" data-sconf="${esc(p.scaleConf || '')}"` : ''}>
          <img class="thumb" src="${esc(p.file)}" alt="" loading="lazy">
          <span class="body">
            <b>${esc(p.type)}</b>${p.exclusiveM2 ? `<span class="ty">전용 ${p.exclusiveM2}㎡</span>` : ''}${sc}
            <span class="hint">${p.w}×${p.h}px · ${p.kb}KB${s ? ` · <b>저장된 방 ${s.rooms.length}곳</b>` : ''}</span>
          </span></button>`;
      });
    }
    body.innerHTML = items.length ? items.join('')
      : '<p class="hint">등록된 것이 없습니다. 도면을 올려 방을 잡은 뒤 <b>이 단지 저장</b>을 누르세요.</p>';

    body.querySelectorAll('.libitem').forEach((b) => {
      b.onclick = () => {
        if (lv === 'region') {
          region = b.dataset.v; lv = 'complex';
          /* 그 시의 단지 목록을 받아 둔다(도면 없는 곳까지 보여주기 위해).
             먼저 그려 두고 도착하면 다시 그린다 — 기다림이 안 보이게. */
          const ck = (region.split(' ')[1] || region).replace(/[시군]$/, '');
          render();
          if (!aptCache[ck]) loadAptList(ck).then(() => { if (lv === 'complex') render(); });
        }
        else if (lv === 'complex') {
          if (b.dataset.apt) {
            /*
             * **도면 없는 단지** — 단지 이름만 들고 도면 올리기로 보낸다.
             * 이름을 기억해 두면 결과 이미지·저장에 그 단지로 적힌다(상담지에
             * 단지명이 없으면 무슨 종이인지 모른다).
             */
            state.complexName = b.dataset.apt;
            state.typeName = null;
            closeSheet();
            toast(`${b.dataset.apt} — 도면이 없습니다. 고객 도면을 올려 주세요`);
            const f = document.getElementById('file');
            if (f) f.click();
            return;
          }
          if (b.dataset.saved) {                       // 도면 없이 방만 저장된 단지
            const e = saved.find((x) => x.complex === b.dataset.saved);
            closeSheet(); if (e) loadFromLibrary(e);
            return;
          }
          cx = idx.find((c) => c.id === b.dataset.id); lv = 'plan'; render();
        } else {
          const type = b.dataset.type;
          const s = saved.find((e) => e.complex === cx.complex && e.type === type);
          const mmpx = +b.dataset.mmpx || 0;
          // 전용면적은 평형별 추천의 기준이 된다 (청약홈·도면 머리말에서 읽은 공시값)
          const excl = +b.dataset.excl || 0;
          const sconf = b.dataset.sconf || '';
          closeSheet();
          // 도면을 올리고, 저장해 둔 방이 있으면 그 위에 그대로 되살린다
          useImage(b.dataset.file, () => {
            state.exclusiveM2 = excl || null;
            /*
             * **어느 단지 어느 주택형인지 기억한다.** 예전에는 이 경로에서만 빠져 있어
             * 두 가지가 조용히 무너졌다 — ①고객에게 나가는 결과 카드 제목이 단지명 없이
             * '가전 배치 상담' 이었고 ②이름을 모르니 상담사가 맞춘 축척·벽선을 자동으로
             * 남길 수가 없었다(공용 목록을 늘리는 유일한 길인데).
             */
            state.region = cx.region || '';
            state.complexName = cx.complex || null;
            state.typeName = type || null;
            if (s) {
              /*
               * 저장된 방(월드 mm)과 도면 이미지(이미지 px)를 같은 화면에 올리려면
               * **이 이미지 1px 이 몇 mm 인지**를 알아야 한다. 모르면 이미지를 띄우지
               * 않는다 — 틀린 크기로 겹쳐 보이는 것이 안 보이는 것보다 나쁘다.
               * 저장할 때 남긴 값이 가장 정확하고, 없으면 색인의 자동 판독값을 쓴다.
               */
              const keep = { img: state.img, imgW: state.imgW, imgH: state.imgH };
              loadFromLibrary(s);
              const px = (+s.mmPerPx) || mmpx || 0;
              if (px) {
                state.mmPerPx = px;
                state.img = keep.img; state.imgW = keep.imgW; state.imgH = keep.imgH;
              } else {
                toast('저장된 방만 복원했습니다 — 이 도면의 축척을 몰라 이미지는 띄우지 않았습니다');
              }
            } else if (mmpx) {
              /*
               * 도면에 인쇄된 치수로 미리 구해 둔 축척이 있으면 채워 놓고 바로 인식 단계로 간다.
               * 근거 없는 숫자가 아니라 **도면에 실제로 적힌 치수**에서 나온 값이라 원칙에 어긋나지
               * 않는다. 다만 자동 판독이므로 사용자가 확인하고 넘어갈 수 있어야 한다 —
               * 도구막대의 '축척'으로 언제든 다시 맞출 수 있고, 확신도를 함께 알린다.
               */
              state.mmPerPx = mmpx; state.scaled = true;
              /*
               * **여기서도 도면 전체를 잡는다**(2026-08-12 프로덕션 시험에서 발견).
               *
               * "축척이 잡히면 도면 전체를 잡는다"를 `askWallLength` 안에만 넣어 뒀는데,
               * **단지에서 불러온 도면은 축척이 색인에 이미 있어 그 함수를 지나가지 않는다.**
               * 그래서 가장 흔한 경로인 `단지 불러오기` 에서는 여전히 방 하나만 섰다 —
               * 실제로 3회 시험 전부 "공간 1곳"이었다(디에트르 84 에서 30.3㎡ 하나).
               * 고객은 가전을 어디에 놓을지 정해진 상태가 아니므로 집 전체가 서야 한다.
               */
              let found = 0;
              try { found = detectAllRooms() || 0; } catch (_) { found = 0; }
              try { nameRoomsFromPlan(); } catch (_) {}
              if (found) {
                setMode('idle'); setStep(4); evaluate();
                /*
                 * **자동 인식이 띄워 둔 초안 막대를 닫는다**(2026-08-14).
                 * `useImage` 안의 `autoDetectCenter` 가 방 하나를 잡아 "이 공간 확정 /
                 * 축척은 이 방의 가로 벽으로 잽니다" 막대를 띄우는데, 여기서는 축척이
                 * 이미 색인에 있고 공간도 전부 잡은 뒤다. 그대로 두면 **할 일이 없는데
                 * 할 일이 있는 것처럼** 보이고, 도면의 절반을 가린다.
                 */
                hideDraftBar(); state.draft = null; state.draftMore = [];
              }
              else { setMode('room'); setStep(3); }
              /*
               * **화면을 다시 맞춘다 — 안 맞추면 도면이 통째로 화면 밖에 있다**
               * (2026-08-14 프로덕션 시연에서 발견).
               *
               * `useImage` 가 맞춰 둔 줌·팬은 **월드 단위가 이미지 픽셀**일 때의 값이다.
               * 바로 위에서 `mmPerPx` 를 세우는 순간 월드가 **mm** 로 바뀌므로 그 값은
               * 17배쯤 어긋난다 — 실측(디에트르 84): 줌 0.579 로 남아 있는데 도면은
               * 16,622 × 19,036mm 라, 캔버스 766 × 758 에는 **왼쪽 위 여백만** 들어온다.
               * 화면에는 빈 격자만 보이는데 오른쪽 패널은 "공간 7곳"이라 말한다.
               *
               * CLAUDE.md 가 적어 둔 "mmPerPx 와 월드 단위를 섞으면 화면이 무너진다"의
               * 또 다른 얼굴이다. 그때는 도면이 작아졌고 이번엔 화면 밖으로 나갔다.
               */
              fitAll();
            }
            draw();
          });
          toast(s ? `${cx.complex} ${type} — 저장된 방까지 복원`
            : mmpx ? `${cx.complex} ${type} — 축척 자동 적용(${sconf || "자동"}) · 공간 ${state.rooms.length}곳을 잡았습니다`
            : `${cx.complex} ${type} — 축척을 맞춰 주세요`);
        }
      };
    });
    crumb.querySelectorAll('a[data-go]').forEach((a) => {
      a.onclick = (ev) => { ev.preventDefault(); lv = a.dataset.go; render(); };
    });
  };

  sheet(`<h2>단지 고르기</h2>
    <p class="hint">도시 → 단지 → 도면 순으로 고릅니다. 저장해 둔 도면은 방까지 복원됩니다.</p>
    <div id="libcrumb" class="crumb"></div>
    <div id="libchips" class="chips"></div>
    <div id="libbody" class="liblist"></div>
    <div id="libmine" class="hint"></div>
    <div class="modal-actions"><button id="libexp">벽선 보내기</button><button id="c">닫기</button></div>`,
    () => {
      render();
      /*
       * **이 기기에 몇 건이 있는지 먼저 말한다.** 버튼만 있으면 누를 이유를 모른다 —
       * 벽선을 보내 달라는 부탁은 "당신이 잡아 둔 N 곳이 여기 있다"에서 시작한다.
       * 0건이면 무엇을 해야 하는지로 바꿔 적는다.
       */
      let mine = [];
      try { mine = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch { mine = []; }
      $('#libmine').innerHTML = mine.length
        ? `이 기기에 저장해 둔 단지 <b>${mine.length}곳</b>이 있습니다. ‘벽선 보내기’로 개발자에게 보내 주시면
           다음 배포부터 <b>모든 매장</b>이 그 단지를 바로 불러옵니다 — 도면 이미지는 담기지 않습니다.`
        : `도면에서 방을 잡은 뒤 <b>단지 저장</b>을 누르면 이 기기에 남고, 그것을 보내 주시면
           다음 배포부터 모든 매장이 함께 씁니다.`;
      $('#libexp').onclick = () => { exportLibrary(); };
      $('#c').onclick = closeSheet;
    });
}

function askSaveComplex(){
  if (!state.rooms.length) { toast('먼저 방을 잡아 주세요'); return; }
  sheet(`<h2>이 단지로 저장</h2>
    <p class="hint">지금 잡아 놓은 방 ${state.rooms.length}곳을 단지로 등록합니다.
      도면 이미지는 저장하지 않고 <b>방 경계 좌표만</b> 남습니다.</p>
    <label class="pickers"><span class="hint">지역</span><input id="sv-region" placeholder="경기 수원"></label>
    <label class="pickers"><span class="hint">단지명</span><input id="sv-complex" placeholder="매교역 팰루시드"></label>
    <label class="pickers"><span class="hint">타입</span><input id="sv-type" placeholder="84A"></label>
    <div class="modal-actions"><button id="c">취소</button><button class="primary" id="ok">저장</button></div>`,
    () => {
      $('#ok').onclick = () => {
        const c = $('#sv-complex').value.trim();
        if (!c) { toast('단지명을 입력해 주세요'); return; }
        saveToLibrary($('#sv-region').value.trim(), c, $('#sv-type').value.trim());
        closeSheet();
      };
      $('#c').onclick = closeSheet;
    });
}

/* ── 가전 고르기 ── */
async function loadReps(){
  if (state.reps.length) return;
  const r = await fetch('size-reps.json');
  /*
   * `hidden` 은 **이 도구가 다룰 것이 아닌** 줄이다(공기청정기 벽걸이형).
   * 여기서 한 번에 걸러야 드롭다운·추천·대안 제시가 같은 목록을 본다 —
   * 드롭다운에서만 숨기면 "안 들어갑니다" 뒤에 그것이 대안으로 튀어나온다.
   * 데이터에는 그대로 남아 있으니 되살릴 때는 이 필터만 걷으면 된다.
   */
  state.reps = (await r.json()).filter((x)=> !x.hidden);
}
/**
 * 가전 선택 — 체크박스로 여러 종을 한 번에 고른다.
 * 예전에는 드롭다운으로 한 번에 한 종만 골라 도면에 놓는 방식이라, 주방 6종을 넣으려면
 * 같은 절차를 여섯 번 반복해야 했다.
 *
 * room을 주면 그 용도에 맞는 카테고리만 보여주고 미리 체크해 둔다(배치 추천).
 * room이 없으면 전체 카테고리를 체크 없이 보여준다(가전 선택).
 */
/**
 * 이 카테고리를 기본으로 어느 방에 놓을 것인가.
 * 잡아 둔 방 이름이 ROOM_PLAN의 용도와 맞으면 그 방을 고른다(주방 가전 → '주방').
 * 맞는 방이 없으면 첫 번째 방. 어디까지나 기본값이고 사용자가 바꿀 수 있다.
 */
function defaultRoomFor(cat){
  if (!state.rooms.length) return null;
  for (const [use, cats] of Object.entries(ROOM_PLAN)){
    if (!cats.includes(cat)) continue;
    const hit = state.rooms.find((r)=>r.name.includes(use) || use.includes(r.name));
    if (hit) return hit.id;
  }
  // 침실은 '안방/침실N' 어느 쪽이든 침실로 본다
  if (ROOM_PLAN['침실'].includes(cat)){
    const hit = state.rooms.find((r)=>/침실|안방/.test(r.name));
    if (hit) return hit.id;
  }
  return state.rooms[0].id;
}

/*
 * 통합검색이 보낸 `?pick=카테고리|사이즈` 를 들고 있다가 가전 선택 시트가 열릴 때 적용한다.
 * 한 번 쓰면 지운다 — 다음에 시트를 열 때 또 체크되면 사용자가 지운 선택이 되살아난다.
 */
let deepPick = null;
function applyDeepPick(){
  if (!deepPick) return;
  const [cat, size] = deepPick;
  const cb = document.querySelector(`#a-list input[type=checkbox][data-cat="${CSS.escape(cat)}"]`);
  if (!cb) return;                       // 목록에 없는 카테고리(업소용 토글 등)면 그냥 둔다
  deepPick = null;
  cb.checked = true;
  cb.dispatchEvent(new Event('change', { bubbles: true }));
  /* 사이즈까지 맞춘다 — 카테고리만 체크하면 "건조기 폭 600mm"가 아니라 대표 사이즈가 잡힌다 */
  const sel = document.querySelector(`select[data-size="${CSS.escape(cat)}"]`);
  if (sel && size) {
    const rows = state.reps.filter((x)=>x.cat===cat);
    const i = rows.findIndex((r)=>r.size === size);
    if (i >= 0) {
      const opt = [...sel.options].find((o)=>String(o.value).startsWith(i + ':'));
      if (opt) { sel.value = opt.value; sel.dispatchEvent(new Event('change', { bubbles: true })); }
    }
  }
  cb.scrollIntoView({ block: 'center' });
}

async function openSelect(room){
  await loadReps();
  const allCats = [...new Set(state.reps.map((r)=>r.cat))];
  const rooms = ['전체', ...Object.keys(ROOM_PLAN)];
  const start = room || '전체';

  /*
   * 기본은 **가정 배치 상담에 실제로 올리는 카테고리**만 보여준다.
   * 업소용 냉장고·데이코 빌트인·시스템에어컨(천장 매립)·리빙 제휴상품(비데·욕실케어·
   * 안마기·선풍기)은 목록만 채우고 상담에는 거의 안 쓴다 — 24개 중 8개, 사이즈로는 19종이다.
   * 지우지 않고 토글로 둔다. 업소용 상담이 없지는 않다.
   */
  const homeCats = [...new Set(state.reps.filter((r)=>r.home).map((r)=>r.cat))];
  const otherCats = allCats.filter((c)=>!homeCats.includes(c));

  sheet(`<h2>가전 선택</h2>
    <div class="pickers">
      <label>방 용도<select id="a-room">${rooms.map((r)=>`<option${r===start?' selected':''}>${esc(r)}</option>`).join('')}</select></label>
      ${otherCats.length ? `<label class="chk"><input type="checkbox" id="a-all">
        <span class="hint">업소용·빌트인·리빙 상품도 보기 (${otherCats.length}종)</span></label>` : ''}
    </div>
    <p class="spec" id="a-rec"></p>
    <div class="pickhead"><b>여기서 고르세요</b>
      <span class="hint">체크한 것만 도면에 나갑니다 · 사이즈·수량·방은 각 줄에서</span></div>
    <div id="a-list" class="picklist"></div>
    <details class="help"><summary>'도면 옆에 꺼내기'와 '자동 배치'는 어떻게 다른가요?</summary>
    <p class="src"><b>도면 옆에 꺼내기</b>를 누르면 체크한 가전이 도면 오른쪽에 세워집니다 — 끌어서 원하는 자리에 놓으시면 됩니다.
      벽을 넘으면 안쪽으로 옮겨 드리고 그 사실을 알려드립니다. TV·사운드바와 세탁기·건조기는 위아래로 설치하는 조합이라 같은 자리에 놓을 수 있습니다.<br>
      <b>자동 배치</b>는 체크한 가전을 폭이 큰 것부터 긴 벽을 따라 놓습니다. 이격거리와 방 경계를 지키는
      자리를 못 찾으면 억지로 놓지 않고 "자리 없음"으로 알려드립니다. 놓은 뒤에는 끌어서 옮길 수 있고,
      겹치는 자리에는 놓이지 않습니다.<br>
      추천은 <b>시작점</b>입니다 — 에어컨·공기청정기는 잡아 둔 방 넓이로 계산한 값이고,
      TV·냉장고·세탁기는 평형별로 흔히 나가는 구성입니다. 체크를 풀거나 사이즈를 바꾸면 됩니다.</p></details>
    <div class="modal-actions">
      <button id="c">취소</button>
      <button id="auto" title="이격과 방 경계를 지키는 자리를 찾아 자동으로 놓습니다">자동 배치</button>
      <button class="primary" id="ok" title="도면 옆에 세워 둡니다 — 끌어서 원하는 자리에 놓으세요">도면 옆에 꺼내기</button>
    </div>`,
    ()=>{
      const roomSel = $('#a-room');
      const fill = ()=>{
        const v = roomSel.value;
        // 기본은 가정 배치 대상만. 토글을 켜면 업소용·빌트인·리빙까지 보여준다.
        const showAll = $('#a-all') && $('#a-all').checked;
        const pool = showAll ? allCats : homeCats;
        const cats = v==='전체' ? pool : ROOM_PLAN[v].filter((c)=>pool.includes(c));
        const rec = recommendPicks();
        // 무엇을 근거로 미리 체크했는지 밝힌다 — 근거 없이 체크돼 있으면 그대로 나간다
        const recNote = $('#a-rec');
        if (recNote) {
          /*
           * **몇 종을 왜 골랐는지 한 문장으로 먼저 말한다.**
           * 체크박스가 스무 줄 늘어서 있으면 무엇이 이미 골라져 있는지 안 보인다.
           * 상담은 "84A는 보통 이 일곱 가지입니다"로 시작해서 빼는 쪽으로 진행되므로,
           * 개수를 먼저 말하고 무엇을 빼면 되는지 바로 알려 준다.
           */
          const label = planLabel();
          const lines = cats.filter((c)=>rec[c]).map((c)=>`${c} ${rec[c].size}`);
          const area = planAreaM2();
          recNote.innerHTML = lines.length
            ? `<b class="recn">${label ? esc(label) + ' ' : ''}추천 가전 ${lines.length}종</b>`
              + `<br><span class="hint">${area && state.typeName ? `전용 ${area.toFixed(0)}㎡ 기준 · ` : ''}`
              + `미리 골라 뒀습니다 — 필요 없는 것은 체크를 풀고, 대수는 옆 칸에서 조절하세요</span>`
              + `<br><span class="hint">${esc(lines.join(' · '))}</span>`
            : '<b>미리 고른 것이 없습니다</b><br><span class="hint">평형을 알아야 골라 드릴 수 있습니다 — 단지를 불러오거나 도면의 축척을 맞춰 방을 잡아 주세요.</span>';
        }
        $('#a-list').innerHTML = cats.map((c)=>{
          const rows = state.reps.filter((r)=>r.cat===c);
          /*
           * **사이즈 하나에 줄 하나.**
           *
           * 여기까지 세 번 바뀌었으니 이유를 남긴다.
           *  ① 처음엔 사이즈 안의 모델 변형을 전부 펼쳤다 → TV 44줄. 고를 수 없다는 지적.
           *  ② 발자국이 비슷한 것끼리 묶어 봤다 → 73줄. 깊이 편차(65형 222~499mm)는 살렸지만
           *     여전히 길고, 한 사이즈가 여러 줄로 나뉘어 무엇을 고를지 알기 어려웠다.
           *  ③ **사용자 판단으로 ①의 단위(사이즈당 1줄)로 돌아왔다.** 대표모델을 두는 목적이
           *     "도면에 넣었을 때 대략적인 느낌을 보는 것이지 정확히 이렇다고 표시하려는 게
           *     아니다"라는 것 — 즉 깊이 편차는 이 도구가 감당할 오차 범위 안이다.
           *
           * 그래도 편차를 숨기지는 않는다. `options[0]` 은 **발자국이 가장 큰 것**이고
           * (애매하면 크게 재는 쪽이 안전하다), 아래 정보줄이 사이즈 안의 편차를 함께 적는다.
           */
          const foot = (o)=>{
            /* TV 는 벽걸이가 주 부품이다(mainPart) — 목록 정렬·정보줄·배치가 같은 것을 봐야 한다 */
            const p = mainPart(c, o) || (o.parts||[]).find((q)=>/본체|실내기/.test(q.part||'')) || o.parts[0];
            return p ? { w:+p.w||0, d:+p.d||0 } : { w:0, d:0 };
          };
          const opts = rows.map((r,i)=>({ r, i, o:r.options[0], k:0 }));
          /*
           * **큰 사이즈부터** — 상담은 큰 것에서 시작해 안 들어가면 줄이는 순서로 진행된다.
           * 단 사이즈가 **이름**인 카테고리(`named`)는 폭이 상담 순서가 아니다. 에어컨을
           * 폭으로 줄세우면 벽걸이(1099) → 와이드형(492) → 창문형(402) 순이 되어
           * 스탠드 사이에 창문형이 끼어든다. 그런 카테고리는 데이터 순서를 그대로 쓴다.
           */
          /*
           * 벽에 거는·창에 끼우는 것은 **맨 뒤로**. 바닥에 놓는 것이 상담의 기본인데
           * 발자국 폭으로 줄세우면 벽걸이가 맨 위로 온다 — 공기청정기 벽걸이형(1050×130)이
           * 목록 첫 줄에 서서 도면에 긴 막대로 놓였다(사용자 지적).
           */
          const hangs = (r)=> (/벽걸이|창문형/.test(r.size) ? 1 : 0);
          // **전부** 이름일 때만 데이터 순서를 쓴다. 한 줄만 이름인 카테고리(김치냉장고의
          // 설치가이드 전용 줄)까지 정렬을 건너뛰면 나머지가 작은 것부터로 뒤집힌다.
          if (!rows.every((r)=>r.named)) {
            opts.sort((a,b)=> hangs(a.r) - hangs(b.r) || foot(b.o).w - foot(a.o).w);
          }
          const pick = rec[c];
          return `<label class="pick">
            <input type="checkbox" data-cat="${esc(c)}"${pick?' checked':''}>
            <span class="nm">${esc(c)}</span>
            <select data-size="${esc(c)}">
              ${opts.map(({ r, i, o, k })=>{
                const p0 = mainPart(c, o);
                const dim = `${Math.round(p0.w)}×${Math.round(p0.h)}×${Math.round(p0.d)}`;
                /*
                 * 라인업 접두는 사이즈 이름이 **이미 설치 방식을 담고 있으면** 붙이지 않는다 —
                 * `프리스탠딩 4도어 프리스탠딩` 이 된다. `named` 가 그 표시다.
                 */
                const head = (r.line && !r.named ? `${r.line} ` : '') + sizeText(c, r.size);
                // 사이즈당 한 줄이므로 제품군으로 구분할 필요가 없다. 어느 모델의 치수인지는
                // 아래 정보줄이 모델코드·제품군으로 밝힌다 — 드롭다운은 짧을수록 고르기 쉽다.
                const fam = '';
                /*
                 * 용량은 **묶인 범위**로 적는다. 예전에는 첫 값만 보여줘서, 602~905L 가 섞인
                 * 냉장고 폭 910mm 묶음이 "609L" 하나로 표시됐다 — 사용자가 잡아낸 오류다.
                 */
                // 이 줄에 해당하는 옵션의 용량만 쓴다. 사이즈 전체 범위를 쓰면 "뚜껑형 126L"
                // 줄에 126~347L 이 뜬다 — 그 줄은 126L 짜리다.
                const sp = (o.specs && o.specs.length) ? o.specs : r.specs;
                const nums = sp.map((v)=>parseFloat(v)).filter((v)=>isFinite(v));
                const unit = (String(sp[0]||'').match(/[^\d.,\s]+$/)||[''])[0];
                /*
                 * 사양 꼬리가 사이즈를 그대로 되풀이하면 적지 않는다 —
                 * "115인치 — … · 115형 (290cm)" 처럼 같은 말이 두 번 나온다.
                 * 앞 숫자가 같으면 되풀이로 본다.
                 */
                // 사이즈가 범위면(83~85형) 그 안의 값도 되풀이로 본다 — "85형 (214cm)"
                const sizeNums = (String(r.size).match(/[\d.]+/g) || []).map(Number);
                const specNum = +((String(sp[0] || '').match(/[\d.]+/) || [])[0]);
                /*
                 * 에어컨은 냉방면적을 적지 않는다(2026-08-09 사용자: *"에어컨의 경우
                 * 냉방면적은 없어도 됩니다"*). 고르는 기준이 설치 형태로 바뀌었으니
                 * 면적은 상담을 헷갈리게만 한다. **데이터에는 남긴다** — 추천이 그 값으로
                 * 평형을 맞춘다.
                 */
                const echo = c === '에어컨' || (sizeNums.length && Number.isFinite(specNum)
                  && specNum >= Math.min(...sizeNums) && specNum <= Math.max(...sizeNums));
                const tail = (!sp.length || echo) ? ''
                  : nums.length > 1 && Math.max(...nums) > Math.min(...nums)
                    ? ` · ${Math.min(...nums)}~${Math.max(...nums)}${esc(unit)}`
                    : ` · ${esc(sp[0])}`;
                const on = pick && pick.i===i && pick.k===k ? ' selected' : '';
                return `<option value="${i}:${k}"${on}>${esc(head)}${fam} — ${dim}mm${tail}</option>`;
              }).join('')}
            </select>
            <input type="number" data-qty="${esc(c)}" value="1" min="1" max="6" title="수량">
            <span class="unit">대</span>
            ${state.rooms.length ? `<select data-room="${esc(c)}" title="배치할 방">
              ${state.rooms.map((rm)=>`<option value="${rm.id}"${rm.id===defaultRoomFor(c)?' selected':''}>${esc(rm.name)}</option>`).join('')}
            </select>` : ''}</label>
            <p class="pickinfo" data-info="${esc(c)}"></p>`;
        }).join('');
        // 고른 사이즈의 모델코드·이격거리를 한 줄로 보여준다.
        // 폭만 보이면 "이게 들어가나"를 판단할 수 없어 가로·높이·깊이를 모두 적는다.
        const pickOf = (cat)=>{
          const sel = document.querySelector(`select[data-size="${CSS.escape(cat)}"]`);
          const [i,k] = String(sel.value || '0:0').split(':').map(Number);
          const r = state.reps.filter((x)=>x.cat===cat)[i||0];
          return { r, o: r.options[k||0] };
        };
        const info = (cat)=>{
          const el = document.querySelector(`p[data-info="${CSS.escape(cat)}"]`);
          if (!el) return;
          const { r, o } = pickOf(cat);
          const p0 = mainPart(cat, o);   /* TV 는 벽걸이가 주 부품 — 화면 치수와 실제 배치가 같아야 한다 */
          const cl = clearFor(cat, p0.part, o.model, o.group);
          /* 부속은 **주 부품을 뺀 나머지**다. `slice(1)` 로 자르면 TV 에서 주 부품(벽걸이)이
             부속으로 적히고 스탠드가 사라진다 — 주 부품이 항상 0번은 아니다. */
          const rest = (o.parts||[]).filter((q)=> q !== p0);
          const extra = rest.length
            ? ' · ' + rest.map((q)=>`${esc(q.part)} ${Math.round(q.w)}×${Math.round(q.h)}×${Math.round(q.d)}`).join(' · ')
            : '';
          const dz = doorZoneFor({ cat, group:o.group });
          // 비슷한 발자국끼리 묶은 사이즈는 그 사실을 밝힌다. 무리 중 **가장 큰 치수**로
          // 판정하므로, 고객 제품이 그보다 작으면 실제로는 더 여유가 있다는 뜻이다.
          const mg = r.mergedFrom && r.mergedFrom.length > 1
            ? ` · <span class="hint">${esc(r.mergedFrom.join(' · '))} 통합 — 큰 치수 기준</span>` : '';
          /*
           * 사이즈당 한 줄로 접었으므로 **접으면서 뭉갠 편차를 여기서 밝힌다.**
           * 같은 65형인데 스탠드 깊이가 222~499mm 다. 화면은 가장 큰 값으로 판정하니
           * 고객 모델이 그보다 얕으면 실제로는 여유가 더 있다 — 그 사실을 말해 줘야
           * "왜 안 들어간다고 나오지"를 상담에서 설명할 수 있다.
           */
          const sp = (r.spreadW > 30 || r.spreadD > 30)
            ? ` · <span class="hint">이 사이즈 안 ${r.options.length}종 편차 폭 ±${Math.round(r.spreadW)}·깊이 ±${Math.round(r.spreadD)}mm</span>` : '';
          // 세트 구성·설치가이드 전용처럼 근거를 밝혀야 하는 항목은 note 를 그대로 띄운다
          const nt = (r.set || r.guideOnly) && r.note ? `<br><span class="hint">${esc(r.note)}</span>` : '';
          /*
           * **모델코드는 화면에 적지 않는다.**
           * 대표모델은 크기를 가늠하려고 세운 자리끼움이지 이 제품을 사라는 제안이 아닌데,
           * 코드가 박혀 있으면 고객이 그 모델을 제안받은 것으로 읽는다(사용자 지적).
           * 치수 출처는 데이터에 그대로 남아 있어 나중에 되짚을 수 있다.
           */
          const gp = o.group ? ` <span class="hint">${esc(String(o.group).replace(/\s*\(.*$/, ''))}</span>` : '';
          /*
           * **컬러는 카탈로그에 적힌 그대로 적는다.** 색 이름에 색 단어가 없어 화면에 칠하지
           * 못하는 것도 있는데(`트러플 메탈`), 그때는 **그 사실을 적는다** — 회백색으로
           * 그려 놓고 아무 말도 안 하면 상담사가 그 색으로 오해한다.
           */
          const cw = o.color
            ? ` · <span class="hint">컬러 ${esc(String(o.color).split(/[\/,·]/)[0].trim())}`
              + (o.hex ? `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:4px;`
                + `border:1px solid rgba(0,0,0,.25);background:${esc(o.hex)}"></span>`
                : ' <b>색 미상</b> — 화면은 회백색으로 그립니다') + '</span>'
            : '';
          el.innerHTML = `<b>가로 ${Math.round(p0.w)} · 높이 ${Math.round(p0.h)} · 깊이 ${Math.round(p0.d)}mm</b>`
            + ` — ${esc(sizeText(cat, r.size))}${gp}${mg}${sp}`
            + ` · 이격 후면 ${cl.back}·좌우 ${cl.side}${cl.front?`·전면 ${cl.front}`:''}mm`
            + (dz ? ` · 도어 오픈 좌우 각 ${dz.side}mm` : '')
            + (cl.weak ? ' · <span class="hint">확정되지 않은 값이 섞여 있어 실측 확인 필요</span>' : '')
            + cw + extra + nt;
        };
        cats.forEach(info);

        // 체크박스 외의 곳(사이즈·수량)을 눌렀을 때 체크가 토글되지 않게 한다
        $('#a-list').querySelectorAll('select,input[type=number]').forEach((el)=>{
          el.addEventListener('click',(e)=>e.stopPropagation());
          el.addEventListener('change',(e)=>{
            e.stopPropagation();
            const box = el.closest('.pick').querySelector('input[type=checkbox]');
            box.checked = true;      // 사이즈를 고르면 쓰겠다는 뜻이다
            if (el.tagName==='SELECT') info(el.dataset.size);
          });
        });
      };
      roomSel.onchange = fill;
      if ($('#a-all')) $('#a-all').onchange = fill;
      fill();
      /*
       * ── 통합검색 딥링크 (`/place?pick=건조기|폭 600mm`) ──
       *
       * 허브 통합검색이 이 앱의 사이즈 70건을 담고 있는데 링크가 전부 맨 `/place` 였다.
       * *"건조기 폭 600mm"* 를 찾아 눌러도 앱 첫 화면만 열려, 상담사가 목록에서 그것을
       * 다시 찾아야 했다(2026-08-12 사용자 지적).
       *
       * **시트를 억지로 먼저 열지 않는다.** 축척이 없으면 가전을 올릴 수 없다는 규칙이
       * 먼저다(CLAUDE.md — 체크를 다 한 뒤에 막으면 헛수고가 된다). 그래서 요청을
       * 들고만 있다가 **시트가 열리는 그때** 그 줄을 체크해 준다. 도면을 불러오는 순서가
       * 바뀌어도 찾아 준 것이 사라지지 않는다.
       */
      applyDeepPick();
      $('#c').onclick = closeSheet;
      // 체크한 것을 모으는 일은 자동·수동이 똑같다. 한 곳에서 만든다.
      const collect = ()=>{
        const picks = [];
        for (const cb of document.querySelectorAll('#a-list input[type=checkbox]:checked')){
          const cat = cb.dataset.cat;
          const sel = document.querySelector(`select[data-size="${CSS.escape(cat)}"]`);
          const qtyEl = document.querySelector(`input[data-qty="${CSS.escape(cat)}"]`);
          const [si,ki] = String(sel.value || '0:0').split(':').map(Number);
          const r = state.reps.filter((x)=>x.cat===cat)[si||0];
          const o = r.options[ki||0], p = mainPart(cat, o);
          const qty = Math.max(1, Math.min(6, +qtyEl.value || 1));
          const roomEl = document.querySelector(`select[data-room="${CSS.escape(cat)}"]`);
          const rid = roomEl ? roomEl.value : null;
          for (let n=1; n<=qty; n++) picks.push({ cat, size:r.size, model:o.model, group:o.group, part:p, seq:qty>1?n:0, room:rid,
            /* 카탈로그에 적힌 제품 색 — 2D 띠와 3D 상자가 같은 값을 쓴다. hex 가 없으면 색 미상 */
            color:o.color||null, hex:o.hex||null });
        }
        return picks;
      };
      /*
       * **기본은 "꺼내 두기"다.** 이 도구는 상담사가 제품을 도면 안으로 끌고 들어와
       * 설치 느낌을 보여주는 물건이지, 자리를 대신 정해 주는 물건이 아니다(사용자 정의).
       * 방이 없어도 된다 — 도면 옆에 세우는 것뿐이라서.
       */
      /*
       * **배치는 3D 에서 한다**(2026-08-17 사용자: *"2D로 가전제품 배치하지 않습니다.
       * 3D에서만 배치합니다"*). 그래서 가전을 확정하면 곧바로 3D 를 연다.
       *
       * 2D 의 끌기·놓기 코드는 **지우지 않는다** — 3D 가 판정에 쓰는 함수들
       * (`nudgeInside`·`hitsOther`·`retagRoom`·`snapWallMounted`)이 전부 그쪽에 있고,
       * 검사도 그 길로 돈다. 2D 는 **도면·축척·방을 잡는 화면**으로 남는다.
       */
      const to3D = ()=>{ try { open3D(); } catch (_) {} };
      $('#ok').onclick = ()=>{
        const picks = collect();
        if (!picks.length){ toast('가전을 하나 이상 체크해주세요'); return; }
        closeSheet(); stageOutside(picks); to3D();
      };
      $('#auto').onclick = ()=>{
        const picks = collect();
        if (!picks.length){ toast('가전을 하나 이상 체크해주세요'); return; }
        closeSheet();
        if (!state.rooms.length && !wallLoop()){ needRoom(); return; }
        autoPlace(picks); to3D();
      };

    });
}

/*
 * **축척이 없으면 가전을 올리지 않는다.**
 * 가전 치수는 언제나 mm 인데 축척 전 도면의 월드 단위는 이미지 픽셀이라, 둘을 같은
 * 화면에 올리면 크기 관계가 통째로 거짓이 된다(냉장고가 도면보다 커진다).
 * 화면이 이상해지는 것보다 **"이 자리에 들어갑니다"가 거짓이 되는 것**이 더 큰 문제다.
 * 축척은 사용자가 확정하는 값이므로(자동으로 만들어 내지 않는다) 여기서 안내만 한다.
 */
function needScale(){
  /*
   * **거실 길이 입력을 주 경로로 둔다.**
   * 치수선 두 점 보정이 더 정확하지만, 수집한 분양 도면 중 치수가 인쇄된 것은 8% 뿐이다
   * (CLAUDE.md 참조). 나머지 92% 에서 안 되는 방법을 먼저 권하면 상담이 막힌다.
   * 방 하나를 인식시키면 `askWallLength` 가 가장 긴 벽의 실제 길이를 묻고,
   * 나머지가 같은 비율로 환산된다 — 벽 하나만 알면 도면 전체가 맞춰진다.
   */
  sheet(`<h2>축척을 먼저 맞춰주세요</h2>
    <p class="hint">가전 치수는 mm 이지만, 축척을 정하기 전 도면은 <b>실제 크기를 모르는 그림</b>입니다.
      그대로 제품을 올리면 크기 관계가 맞지 않아 &ldquo;여기 들어갑니다&rdquo;가 근거를 잃습니다.</p>
    <p class="hint"><b>침실1(안방) 가로 한 변의 실제 길이 하나만</b> 알면 됩니다 — 나머지 벽과 도면 전체가 같은 비율로 환산됩니다.
      고객이 알고 계신 치수가 대개 침실1(안방)이라 이 쪽을 기준으로 잡습니다. 도면에 치수선이 인쇄돼 있으면 두 점을 찍는 쪽이 더 정확합니다.</p>
    <p class="src">단지 라이브러리에서 불러온 도면은 이미 맞춰져 있어 이 단계가 없습니다.</p>
    <div class="modal-actions">
      <button id="lib">단지 불러오기</button>
      <button id="c">치수선으로 맞추기</button>
      <button class="primary" id="ok">침실1 길이로 맞추기</button>
    </div>`,
    ()=>{ $('#ok').onclick =()=>{ closeSheet(); startDetect(); toast('침실1(안방) 안쪽을 눌러주세요 — 방을 잡으면 가로 길이를 여쭤봅니다'); };
          $('#c').onclick  =()=>{ closeSheet(); $('#btn-scale').click(); };
          $('#lib').onclick=()=>{ closeSheet(); $('#btn-lib').click(); }; });
}

function needRoom(){
  sheet(`<h2>먼저 방을 잡아주세요</h2>
    <p class="hint">배치하려면 닫힌 방이 필요합니다. 도면을 올렸다면 <b>벽 자동 인식</b>으로
      방 안쪽을 한 번 누르면 되고, 도면이 없으면 <b>벽 그리기</b>로 직접 그리시면 됩니다.</p>
    <div class="modal-actions">
      <button id="c">벽 그리기</button>
      <button class="primary" id="ok">벽 자동 인식</button>
    </div>`,
    ()=>{ $('#ok').onclick=()=>{closeSheet(); startDetect();};
          $('#c').onclick =()=>{closeSheet(); $('#btn-wall').click();}; });
}

/* 같은 카테고리인데 모델 세대에 따라 이격이 달라지는 경우.
   에어드레서 구형 Bespoke(DF10A9500CG·DF60A8500CG)는 좌우 14mm가 필요하고 현행
   라인업은 2.5mm다 — 삼성닷컴 설치가이드 다이어그램에 색상별로 모델코드와 함께 표기돼 있다.
   현재 size-reps에는 현행 모델만 들어 있지만, 나중에 구형이 추가돼도 2.5mm로 계산되지
   않도록 여기서 잡는다. 5.5배 차이라 나란히 설치할 때 결과가 뒤집힌다. */
const CLEAR_BY_MODEL = [
  { match: /^DF(10A9500CG|60A8500CG)/, clear: { back:15, side:14, front:0,
    src:'구형 Bespoke 에어드레서(DF10A9500CG·DF60A8500CG)는 좌우 이격 14mm가 필요하다 — 현행 라인업(2.5mm)과 다르다. 삼성닷컴 설치가이드 다이어그램에서 모델코드와 함께 확인된 값.' } },
];

/* ── 평형별 추천 ──────────────────────────────────────────────────
   상담을 "무엇을 넣을까"부터 시작하지 않게, 세대 크기에 맞는 구성을 미리 체크해 둔다.
   **확정이 아니라 시작점이다** — 직원이 체크를 풀거나 사이즈를 바꾸면 그만이다.

   근거가 두 종류로 나뉘므로 섞지 않는다:
     · **계산으로 정하는 것** — 에어컨·공기청정기는 제품 사양에 냉방/청정 면적이 있어
       방 넓이와 직접 대응한다. 잡아 둔 방 넓이를 덮는 가장 작은 것을 고른다.
     · **관례로 정하는 것** — TV 화면크기, 냉장고·세탁기 용량은 세대 크기별로 흔히 팔리는
       구성이다. 계산으로 나오는 값이 아니므로 화면에 "관례"임을 밝힌다.

   평형 구간은 주택형 표기 그대로 쓴다(59·84·114㎡가 분양 표기의 경계다). */
/*
 * 여기 적힌 사이즈 이름이 `size-reps.json` 에 없으면 **그 카테고리가 조용히 추천에서 빠진다.**
 * 대표모델을 다시 만들면 `test-plans.mjs` 의 추천 검사가 이름이 어긋난 것을 잡아 준다.
 *
 * 냉장고는 평형과 무관하게 **4도어 프리스탠딩**이다. 1단이 용량에서 도어 구성으로 바뀌면서
 * (2026-08-09) 4도어가 한 줄이 됐기 때문인데, 그래도 상담이 어긋나지 않는다 —
 * 매장에서 냉장고 상담은 형태부터 정하고, 작은 주방에 912×930 이 안 들어가면
 * `fitAlternative` 가 **같은 4도어 중 912×716 규격이면 들어갑니다**로 이어 준다.
 * 평형별로 용량을 단정하는 것보다 이쪽이 근거가 분명하다.
 * 김치냉장고는 아직 용량이 1단이라 그대로 용량으로 적는다.
 */
/** 추천에 쓰는 기본 라인업 — 상담의 출발점이지 유일한 답은 아니다 */
const DEFAULT_LINE = { '냉장고':'프리스탠딩', '김치냉장고':'프리스탠딩', '세탁기·콤보':'세탁기' };
const BY_AREA = [
  { upTo: 60,       label: '59㎡ 이하',  tv: '55형',    fridge: '4도어 프리스탠딩', wash: '폭 560~600mm', kimchi: '126L' },
  { upTo: 85,       label: '59~84㎡',   tv: '65형',    fridge: '4도어 프리스탠딩', wash: '폭 635~685mm', kimchi: '324~347L' },
  { upTo: 115,      label: '84~114㎡',  tv: '75~77형', fridge: '4도어 프리스탠딩', wash: '폭 635~685mm', kimchi: '490L' },
  { upTo: Infinity, label: '114㎡ 초과', tv: '83~85형', fridge: '4도어 프리스탠딩', wash: '폭 635~685mm', kimchi: '490L' },
];

/*
 * 화면에 적는 사이즈 이름. **데이터는 그대로 두고 표시만 바꾼다** —
 * 추천표(`BY_AREA`)·골든값이 데이터 표기를 그대로 쓰고 있어, 데이터를 건드리면 그쪽이 깨진다.
 * TV 는 상담에서 "115인치"라고 부르므로 `형` 을 `인치` 로 적는다.
 */
function sizeText(cat, size){
  let t = String(size || '');
  if (cat === 'TV') t = t.replace(/형/g, '인치');
  return t;
}

/**
 * 상담 기준이 되는 세대 넓이(㎡) — **색인의 전용면적이 있을 때만 확정값**이다.
 *
 * 없으면 잡아 둔 방을 더해 어림하는데, 그 값은 **화면에 숫자로 내밀지 않는다**
 * (2026-08-20 사용자 지적: *"여러 공간을 추가하면 모든 공간값을 더한 수치를 보여주는데
 * 사실 중복된 공간이 있어 잘못된 수치가 될 수 있다"*).
 *
 * 실제로 그렇다 — 이 앱은 **트인 거실 안의 주방을 일부러 따로 잡는다**(넓이비 0.6 조건).
 * 실측: 대방 엘리움 86A 가 11곳 합계 104.3㎡ = 전용의 **122%** 였고, 초과분이 전부
 * 이중 계산이었다(주방 ⊂ 거실 · 세탁실 ⊂ 안방).
 *
 * 그래서 어림값은 **추천 평형을 고르는 데만** 쓰고, 화면에는 겹칠 수 있다는 사실을
 * 경고로 적는다. `planAreaKnown()` 이 그 둘을 가른다.
 */
function planAreaM2(){
  if (state.exclusiveM2) return state.exclusiveM2;
  if (!state.rooms.length || !state.scaled) return null;
  const t = state.rooms.reduce((s, r)=> s + roomArea(r), 0) / 1e6;
  return t > 5 ? t : null;
}
/** 위 값이 **확정된 전용면적**인가(색인에서 온 것인가) — 아니면 겹칠 수 있는 어림이다 */
function planAreaKnown(){ return !!state.exclusiveM2; }

/**
 * 카테고리별 추천 사이즈 — { i, k } (state.reps 안 인덱스와 옵션 인덱스).
 * 근거를 못 대는 카테고리는 넣지 않는다. 넣지 않으면 체크가 안 된 채로 남고,
 * 직원이 필요할 때 직접 고르면 된다 — 아무거나 찍어 두는 것보다 낫다.
 */
/**
 * 상담에서 부르는 이름. 단지 라이브러리에서 불러왔으면 주택형(84A)이 가장 잘 통하고,
 * 직접 올린 도면이면 전용면적으로 부른다. 둘 다 모르면 아무 이름도 붙이지 않는다 —
 * "84타입"이라고 단정할 근거가 없는데 그렇게 부르면 상담에서 그대로 읽힌다.
 */
function planLabel(){
  if (state.typeName) return `${state.typeName}`.replace(/\s*타입$/, '') + ' 타입';
  /* 방을 더한 어림값으로 "전용 84㎡" 라 부르면 상담에서 그대로 읽힌다 — 확정값일 때만 부른다 */
  const a = planAreaKnown() ? planAreaM2() : null;
  return a ? `전용 ${a.toFixed(0)}㎡` : null;
}

function recommendPicks(){
  const area = planAreaM2();
  const out = {};
  const findSize = (cat, test) => {
    const list = state.reps.filter((r)=>r.cat===cat);
    const i = list.findIndex(test);
    if (i < 0) return null;
    const r = list[i];
    /*
     * **드롭다운이 쓰는 옵션과 같은 것(k=0)을 가리켜야 한다.**
     * 한때 여기서 가운데 옵션을 골랐는데, 목록이 사이즈당 한 줄(k=0)로 바뀌면서
     * 추천이 가리키는 줄이 목록에 없는 상태가 됐다 — 미리 체크가 조용히 안 됐다.
     * 추천 단위와 표시 단위는 반드시 같아야 한다.
     */
    return { i: state.reps.indexOf(r), k: 0, size: r.size, why: null };
  };
  // 계산 — 냉방·청정 면적이 방을 덮는 가장 작은 것
  const room = state.rooms.find((r)=>/거실|주방/.test(r.name)) || state.rooms[0];
  const roomM2 = room && state.scaled ? roomArea(room) / 1e6 : null;
  if (roomM2) {
    for (const [cat, why] of [['에어컨', '냉방면적'], ['공기청정기', '청정면적']]) {
      const list = state.reps.filter((r)=>r.cat===cat);
      /*
       * 덮는 면적은 **㎡ 가 붙은 값에서만** 읽는다.
       *  · 사이즈 이름에서 뽑으면 안 된다 — 에어컨 1단이 '슬림형 스탠드' 같은 이름으로 바뀌어
       *    전부 0 이 되고, 아래 폴백이 조용히 마지막 줄을 추천한다.
       *  · 그렇다고 아무 숫자나 읽어도 안 된다 — **'Q9000 스탠드'가 냉방 9,000㎡** 가 된다.
       * 냉방면적은 사이즈 이름에서 빠졌을 뿐 `specs` 에 `62.6㎡` 로 그대로 살아 있다.
       */
      const cover = (r)=> Math.max(0, ...(r.specs||[])
        .filter((v)=>/㎡/.test(v))
        .map((v)=> parseFloat(String(v).split('~').pop().replace(/[^\d.]/g,'')) || 0));
      /*
       * **거실에 미리 골라 두는 것은 바닥에 놓는 것이다.** 추천이 보는 방은 거실(없으면
       * 첫 방)인데, 설치 형태별로 줄이 갈리면서 면적만 보면 엉뚱한 것이 올라온다:
       *  · 작은 거실에 에어컨 **창문형** — 창에 끼우는 물건이다
       *  · 큰 거실에 공기청정기 **벽걸이형** — 청정면적이 가장 커서 뽑혔는데,
       *    1050×130 이라 도면에 긴 막대로 놓인다(사용자 지적)
       * 벽걸이는 침실 몫인데 방별 추천이 아직 없다. 상담사가 체크를 풀거나 다른 줄을
       * 고를 수 있으므로 **시작점만** 바닥에 놓는 것으로 둔다.
       */
      const floorOnly = list.filter((r)=> !/벽걸이|창문형/.test(r.size));
      const pool = floorOnly.length ? floorOnly : list;
      const fit = pool.filter((r)=>cover(r) >= roomM2).sort((a,b)=>cover(a)-cover(b))[0]
        || pool.slice().sort((a,b)=>cover(b)-cover(a))[0];
      if (fit) out[cat] = { i: state.reps.indexOf(fit), k: 0, size: fit.size,
        why: `${room.name} ${roomM2.toFixed(0)}㎡ → ${why}` };
    }
  }
  // 관례 — 세대 크기별로 흔히 나가는 구성
  if (area) {
    const band = BY_AREA.find((b)=>area < b.upTo) || BY_AREA[BY_AREA.length-1];
    for (const [cat, want] of [['TV', band.tv], ['냉장고', band.fridge],
      ['세탁기·콤보', band.wash], ['김치냉장고', band.kimchi]]) {
      // 라인업이 갈린 카테고리는 **기본 라인업**을 함께 맞춰야 한다.
      // (세탁기·콤보를 세탁기/콤보로 나누면서 예전 조건 `line==='프리스탠딩'` 이
      //  세탁기에 안 걸려 추천이 통째로 빠졌다.)
      const hit = findSize(cat, (r)=> r.size === want && (!r.line || r.line === (DEFAULT_LINE[cat] || r.line)));
      if (hit) out[cat] = { ...hit, why: `${band.label} 기준` };
    }
  }
  return out;
}

/* ── 라인업별 이격 ────────────────────────────────────────────────
   냉장고·김치냉장고는 **설치 방식이 이격 기준을 바꾼다.**
   프리스탠딩은 벽에서 후면 50mm를 띄우지만, 키친핏은 벽이 아니라 **냉장고장 안**에 들어가
   장 내측과의 이격을 본다. 키친핏에 벽 이격 50mm를 적용하면 실제 주방 대부분이
   "안 들어감"이 되어 도구가 쓸모없어진다 — 정반대 방향으로 틀리는 셈이다.

   **한 값(12mm)으로 뭉뚱그리지 말 것.** 예전 판이 그랬는데, 그러면 키친핏 Max 의 4mm 가
   3배로 부풀려진다 — "이렇게 좁은 자리에도 들어갑니다"가 이 라인업을 파는 이유인데
   정반대로 재는 셈이다. 사용자가 지적한 실제 사고다.

   여기서 이격을 크게 잡는 것은 안전한 방향이 아니다. 프리스탠딩 후면 50mm 는 방열 공간이라
   모자라면 사고지만, 키친핏의 이격은 **냉장고장 안에 들어가는 끼움 여유**다. 크게 잡으면
   들어갈 자리를 "안 들어갑니다"라고 말하게 되고, 그게 이 도구에서 잃는 것이 더 크다.

   설치환경 가이드('냉장고 페어(2대 이상) 설치')의 라인업별 표를 그대로 옮긴다:
     신형 Bespoke 키친핏 Max · 1도어 조합 → 좌우 각 4mm
     Infinite Line · 구형 Bespoke 4도어   → 좌우 각 12mm
   깊이는 라인업과 무관하게 **냉장고장 깊이 700mm 이상**(콘센트 있으면 720mm)이 요건이라
   제품 깊이(688~697mm)에 따라 후면 여유가 달라진다 — 값이 아니라 문구로 안내한다. */
const CLEAR_BY_LINE = [
  { cat:/^(냉장고|김치냉장고)$/, group:/키친핏 Max|1도어/, clear:{ back:4, side:4, front:0, weak:true,
    src:'신형 Bespoke 키친핏 Max·1도어는 좌우 각 4mm만 있으면 설치된다(설치환경 가이드 "좌우 이격(Max 전용): 좌/우 단 4mm만 있으면 설치 가능", "냉장고장 규격(외곽 이격) … 신형 Bespoke 키친핏 Max: 좌우 각 4mm"). 냉장고장 깊이는 700mm 이상(콘센트 있을 시 720mm 이상), 높이 1,873~1,900mm 이상이 별도 요건이다. 장 규격은 반드시 실측 확인할 것.' } },
  { cat:/^(냉장고|김치냉장고)$/, group:/키친핏|빌트인/, clear:{ back:12, side:12, front:0, weak:true,
    src:'Infinite Line·구형 Bespoke 4도어 키친핏은 냉장고장 내측 좌우 각 12mm다(설치환경 가이드 "냉장고장 규격(외곽 이격) — Infinite Line·구형 Bespoke: 좌우 각 12mm(4도어)"). Bespoke 는 용량대에 따라 4mm 인 구간도 있어 미확정이므로 큰 쪽을 쓴다. 냉장고장 깊이 700mm 이상·높이 1,900mm 이상. 장 규격은 반드시 실측 확인할 것.' } },
];

function clearFor(cat, part, model, group){
  if (part==='실외기') return OUTDOOR;
  if (model) {
    const hit = CLEAR_BY_MODEL.find((r)=>r.match.test(model));
    if (hit) return hit.clear;
  }
  if (group) {
    const hit = CLEAR_BY_LINE.find((r)=>r.cat.test(cat) && r.group.test(group));
    if (hit) return hit.clear;
  }
  return CLEAR[cat] || { back:0, side:0, front:0, src:'' };
}

/* ── 배치 추천 ────────────────────────────────────────────────────
   "이 방에 이 가전들을 넣으면 어디에 놓이는가"를 자동으로 잡아 준다.

   추천이라고 해서 취향을 판단하지는 않는다. 하는 일은 딱 두 가지다.
     ① 방 용도에 맞는 가전만 후보로 올린다(주방에 세탁기를 넣지 않는다).
     ② 벽면을 따라 훑으면서 겹치지도, 이격을 침범하지도, 방을 벗어나지도 않는
        첫 자리에 놓는다.
   자리를 못 찾으면 억지로 놓지 않고 "자리 없음"으로 보고한다 — 억지로 밀어 넣어
   "들어갑니다"라고 말하는 것이 이 도구에서 가장 위험한 실패다.

   벽 배정 순서는 긴 벽부터다. 폭이 큰 제품(냉장고·콤보)이 먼저 자리를 잡아야
   나중에 작은 제품이 남은 틈에 들어간다. 사람이 실제로 배치하는 순서와 같다.
──────────────────────────────────────────────────────────────── */
const ROOM_PLAN = {
  '주방':   ['냉장고','김치냉장고','인덕션/전기레인지','식기세척기','전자레인지/오븐','정수기'],
  '세탁실': ['세탁기·콤보','건조기','에어드레서'],
  '거실':   ['TV','에어컨','공기청정기','사운드바','청소기'],
  '침실':   ['에어컨','공기청정기','에어드레서','제습기'],
};

/** 방 안쪽을 향하는 단위 법선 — 방 중심이 있는 쪽 */
function inwardNormal(w, center){
  const ang = Math.atan2(w.y2-w.y1, w.x2-w.x1);
  let nx = -Math.sin(ang), ny = Math.cos(ang);
  const mx = (w.x1+w.x2)/2, my = (w.y1+w.y2)/2;
  if ((center[0]-mx)*nx + (center[1]-my)*ny < 0){ nx=-nx; ny=-ny; }
  return { nx, ny, ang };
}
function roomCenter(){
  const pts = wallLoop();
  if (!pts) return null;
  return [pts.reduce((s,p)=>s+p[0],0)/pts.length, pts.reduce((s,p)=>s+p[1],0)/pts.length];
}

/**
 * 벽면을 50mm 간격으로 훑어 첫 유효 위치를 찾는다.
 * 유효 = 본체가 방 안 + 다른 가전과 본체/이격 모두 겹치지 않음.
 */
function findSpot(item, placed){
  // 가전이 속한 방 안에서만 찾는다. 방을 지정하지 않았으면 예전처럼 전체를 본다.
  // 한 방이 여러 조각일 수 있으므로(자동 인식이 절반만 잡은 방을 이어 붙인 경우)
  // 조각마다 따로 훑는다.
  const room = itemRoom(item);
  const groups = room
    ? room.parts.map((p)=>({ walls:p.walls, center:partCenter(p) })).filter((g)=>g.center)
    : (wallLoop() ? [{ walls: state.walls, center: roomCenter() }] : []);
  if (!groups.length) return null;
  const dz = doorZoneFor(item);
  const openings = state.walls.filter((w)=>w.open);

  /** 이 자리가 쓸 만한가. strict면 도어 오픈 공간까지 비어 있어야 한다. */
  const okAt = (cand, strict) => {
    const body = corners(cand), cl = corners(cand, cand.clear);
    if (bodyOutside(cand)) return false;
    for (const o of placed){
      if (overlaps(body, corners(o)) || overlaps(cl, corners(o, o.clear))) return false;
    }
    for (const op of openings){ if (segHitsPoly(op, body)) return false; }   // 문·창 앞 막기 금지
    if (!strict) return true;
    // 도어가 열리는 공간이 벽·다른 가전과 부딪히지 않는 자리를 먼저 찾는다
    if (dz){
      const zone = corners(cand, { back:0, side:dz.side, front:0 });
      if (zone.some(([x,y])=>!insideFor(item,x,y))) return false;
      for (const o of placed){ if (overlaps(zone, corners(o))) return false; }
    }
    // 도어가 앞으로 열리는 제품(콤보 등)은 전면 여유도 방 안에 들어와야 한다
    if (item.clear.front > 0){
      const front = corners(cand, { back:0, side:0, front:item.clear.front });
      if (front.some(([x,y])=>!insideFor(item,x,y))) return false;
    }
    /*
     * **3D 가 쓰는 바로 그 판정으로 마무리한다** (2026-08-18).
     *
     * 바로 위 `dz` 는 도어 오픈 공간을 **좌우 사각형으로 어림한** 값이고, 3D 는
     * `doorLeaves` 로 **실제 문짝이 쓸고 가는 자리**를 12단계로 훑는다. 두 모델이 달라
     * 자동 배치가 "괜찮다" 한 자리를 3D 가 빨갛게 칠했다 — 축척이 실린 도면 12장으로
     * 재니 **배치 60대 중 6대, 12장 중 5장**에서 났다. 시연에서 "추천 배치입니다" 하고
     * 3D 를 열었는데 빨간 상자가 뜨면 그 자리에서 신뢰가 무너진다.
     *
     * 같은 함수로 재면 어긋날 수 없다. **strict 단계에서만** 본다 — 자리가 정말 없으면
     * 2차(완화)에서 놓고 `evaluate()` 가 주의로 표시한다("억지로 놓지 않는다"는 규칙은
     * 자리를 아예 못 찾는 경우를 말하는 것이지, 문이 걸리는 자리를 금지하는 것이 아니다).
     * 앞의 싼 검사들이 후보 대부분을 이미 걸러내므로 비용도 그만큼만 든다.
     */
    if (doorHits(cand, placed, state.walls).length) return false;
    return true;
  };

  // 1차: 도어 열림까지 고려한 자리를 찾는다. 없으면 2차로 조건을 완화한다.
  // (완화해서 놓은 것은 evaluate()가 "도어 오픈 공간 …" 주의로 표시한다)
  for (const strict of [true, false]){
    for (const g of groups){
      // 개구부(문·창)는 벽이 아니므로 가전을 붙이지 않는다. 붙이면 문이 안 열린다.
      const walls = g.walls.filter((w)=>!w.open).sort((a,b)=>
        Math.hypot(b.x2-b.x1,b.y2-b.y1) - Math.hypot(a.x2-a.x1,a.y2-a.y1));
      for (const w of walls){
        const L = Math.hypot(w.x2-w.x1, w.y2-w.y1);
        const need = item.w + item.clear.side*2;
        if (L < need) continue;                       // 이 벽에는 폭이 안 들어간다
        const { nx, ny } = inwardNormal(w, g.center);
        const ux = (w.x2-w.x1)/L, uy = (w.y2-w.y1)/L;
        for (let t = need/2; t <= L - need/2; t += 50){
          const cand = {
            ...item,
            bx: w.x1 + ux*t + nx*item.clear.back,
            by: w.y1 + uy*t + ny*item.clear.back,
            a: Math.atan2(ny,nx) - Math.PI/2,
          };
          if (okAt(cand, strict)) return cand;
        }
      }
    }
  }
  return null;
}

/*
 * ── 안 들어가면 "무엇이면 들어가는지"를 말한다 ──────────────────────
 * 예전에는 자리를 못 찾으면 "억지로 놓지 않았습니다"로 끝났다. 그러면 상담이 거기서
 * 멈춘다 — 고객은 "그럼 뭘 사야 하나"를 물을 참인데 도구가 답을 안 준다.
 * 같은 카테고리·같은 라인업 안에서 **실제로 들어가는 가장 큰 사이즈**를 찾아 준다.
 * 없는 답을 지어내지 않는다 — `findSpot` 으로 진짜 놓아 보고 되는 것만 말한다.
 */
function fitAlternative(it, placed){
  const reps = (state.reps || []).filter((r)=> r.cat === it.cat);
  if (!reps.length) return null;
  const foot = (q)=> q.w * q.d;
  const mine = reps.find((r)=> r.size === it.size);
  const line = mine ? mine.line : null;
  const myFoot = it.w * it.d;
  /*
   * 후보는 **사이즈 줄이 아니라 옵션 단위**로 만든다. 한 줄 안에서도 발자국이 크게 다르다 —
   * 냉장고 1단이 도어 구성으로 바뀌면서 '4도어 프리스탠딩' 한 줄에 깊이 683~930mm 가
   * 함께 들어왔다(247mm 차이). 줄 대표(`options[0]`, 가장 큰 것)만 보면
   * **"같은 4도어인데 얕은 모델이면 들어갑니다"** 를 말할 수 없는데,
   * 상담에서 가장 쓸모 있는 답이 그것이다.
   * 자기보다 발자국이 작은 것만 담으므로 자기 자신은 저절로 빠진다.
   */
  const cands = [];
  for (const r of reps){
    if (line && r.line !== line) continue;
    for (const o of (r.options || [])){
      const q = (o.parts || [])[0];
      if (!q || foot(q) >= myFoot) continue;
      /*
       * 같은 줄 안의 대안은 **눈에 띄게 작아야** 말할 값어치가 있다.
       * 그냥 "발자국이 더 작은 것"으로 두면 912×930 대신 **912×922** 를 내민다 —
       * 8mm 차이는 사실상 같은 제품이라 상담에서 아무 도움이 안 된다.
       * 기준은 대표모델을 묶을 때 쓴 것과 같은 10%(`MERGE_SPAN`) — 그보다 가까우면
       * 애초에 한 사이즈로 묶는 거리다. 다른 줄은 이름이 이미 다르므로 그대로 둔다.
       */
      if (r.size === it.size && q.w > it.w / 1.1 && q.d > it.d / 1.1) continue;
      cands.push({ r, o, q });
    }
  }
  cands.sort((a,b)=> foot(b.q) - foot(a.q));    // 큰 것부터 — 되는 것 중 가장 큰 것이 답이다
  for (const { r, o, q } of cands){
    const trial = { ...it, w:q.w, h:q.h, d:q.d, size:r.size, model:o.model, group:o.group,
      clear: clearFor(it.cat, q.part, o.model, o.group) };
    if (findSpot(trial, placed)) {
      return { size:r.size, model:o.model, w:q.w, d:q.d, line:r.line, same: r.size === it.size };
    }
  }
  return null;
}

function autoPlace(picks){
  if (!state.scaled){ needScale(); return; }
  // 폭이 큰 것부터 — 자리를 많이 먹는 제품이 먼저 벽을 잡아야 나머지가 틈에 들어간다
  const list = picks.map((q)=>({
    id:'i'+Math.random().toString(36).slice(2,8),
    cat:q.cat, size:q.size, model:q.model, group:q.group, room:q.room || null, color:q.color||null, hex:q.hex||null,
    label:`${q.cat} ${sizeText(q.cat, q.size)}${q.seq?` #${q.seq}`:''}`,
    w:q.part.w, h:q.part.h, d:q.part.d, part:q.part.part,
    clear:clearFor(q.cat, q.part.part, q.model, q.group), bx:0, by:0, a:0, warn:[],
  })).sort((a,b)=> b.w - a.w);
  /* 설치 높이는 **다 만든 뒤에** 정한다 — 사운드바가 TV 를 보고 따라가기 때문이다 */
  applyMountH(list, list.concat(state.items));

  const placed = [...state.items];
  const failed = [];
  // 실패한 것은 **원래 pick 그대로** 들고 있어야 "직접 놓기"로 이어 줄 수 있다
  const failedPicks = [];
  /*
   * **사운드바는 맨 뒤로 미룬다.** TV 아래 중앙에 붙일 것이라 TV 가 먼저 놓여 있어야 한다.
   * 폭 내림차순만 믿으면 안 된다 — 사운드바 최대 1,030mm 가 TV 42~43형 986mm 보다 넓어
   * **사운드바가 먼저 놓이는 조합이 실제로 있다.**
   */
  const order = [...list].sort((a,b)=> (mountKind(a)==='TV아래'?1:0) - (mountKind(b)==='TV아래'?1:0));
  for (const it of order){
    /* TV 가 이미 놓였으면 자리를 따로 찾지 않고 그 아래 중앙에 붙인다 */
    if (mountKind(it) === 'TV아래' && tvFor(it, placed)){
      alignUnderTV([it], placed);
      placed.push(it); state.items.push(it);
      continue;
    }
    const spot = findSpot(it, placed);
    if (spot){ Object.assign(it, {bx:spot.bx, by:spot.by, a:spot.a}); placed.push(it); state.items.push(it); }
    else {
      const alt = fitAlternative(it, placed);
      failed.push({
        label: it.label + (itemRoom(it) ? ` (${itemRoom(it).name})` : ''),
        cat: it.cat,          // 대안 문구가 `sizeText` 로 표기를 맞추는 데 쓴다
        alt,
      });
      const q = picks.find((x)=> x.cat===it.cat && x.size===it.size && x.model===it.model);
      if (q) failedPicks.push(q);
    }
  }
  $('#empty').style.display='none';
  /*
   * **배치가 끝나면 도면을 다시 만질 수 있는 상태로 돌려놓는다.**
   *
   * 방을 확정한 뒤에는 "한 세대에 방이 여럿이니 더 잡을 수 있게" 일부러 `detect` 모드를
   * 유지한다. 그런데 그 상태로 가전을 배치하면, 배치된 가전을 누르는 순간 `pointerdown` 이
   * 드래그 분기까지 가기 전에 **detect 분기에서 return** 해 버린다 — 그 자리를 새 방으로
   * 인식하는 것이라 **가전을 집을 수가 없었다**(사용자가 지적한 문제다).
   * 방을 더 잡고 싶으면 '벽 자동 인식'을 다시 누르면 된다.
   */
  setMode('idle');
  state.showClean = false;   // 정리본(마스크)이 아니라 원본 도면을 보여준다
  evaluate(); draw();
  if (list.length > failed.length){
    toast('가전을 끌어서 옮길 수 있습니다 — 두 번 누르면 90° 돌아갑니다');
  }
  if (failed.length){
    sheet(`<h2>자리를 못 찾은 제품이 있습니다</h2>
      <p class="hint">아래 제품은 이격거리와 방 경계를 지키면서 놓을 자리가 없었습니다.
        억지로 놓지 않았습니다.</p>
      <ul style="margin:0;padding-left:18px">${failed.map((f)=>`<li>${esc(f.label)}
        ${f.alt
          ? `<br><span style="color:#166534">→ ${f.alt.same
              // 같은 줄 안의 더 작은 모델 — 이름이 같으므로 무엇이 다른지를 말해야 한다
              ? `같은 <b>${esc(sizeText(f.cat, f.alt.size))}</b> 중 <b>${Math.round(f.alt.w)}×${Math.round(f.alt.d)}mm</b> 규격이면 들어갑니다`
              : `<b>${esc(sizeText(f.cat, f.alt.size))}</b>이면 들어갑니다 (${Math.round(f.alt.w)}×${Math.round(f.alt.d)}mm)`}</span>`
          : '<br><span class="hint">더 작은 사이즈로도 자리가 없습니다 — 방을 넓히거나 다른 방을 보셔야 합니다</span>'}
      </li>`).join('')}</ul>
      <p class="hint">도면 옆에 꺼내 두면 직접 끌어다 놓을 수 있습니다 — 이격이 모자라면 그대로 경고로 알려드립니다.</p>
      <div class="modal-actions"><button id="manual">도면 옆에 꺼내기</button><button class="primary" id="ok">확인</button></div>`,
      ()=>{ $('#ok').onclick = closeSheet;
            $('#manual').onclick = ()=>{ closeSheet(); stageOutside(failedPicks); }; });
  }
}
/*
 * ── 하나씩 직접 놓기 ────────────────────────────────────────────────
 * 자동 배치는 "이격거리와 방 경계를 지키는 자리"를 찾아 주지만, 상담에서 보고 싶은 것은
 * 대개 **"저 자리에 놓으면 어떤 느낌인가"** 다 — 고객이 가리키는 자리가 따로 있고,
 * 자동이 자리를 못 찾았을 때 "안 됩니다"로 끝나면 상담이 거기서 막힌다.
 * 그래서 고른 가전을 대기열에 넣고 **한 대씩 눌러서** 놓는 길을 둔다.
 *
 * mode==="place" + state.pending 경로는 처음부터 있었는데 **진입점이 없어 죽어 있었다** —
 * pending 을 설정하는 코드가 어디에도 없었다. 여기가 그 진입점이다.
 */
/** 도면(이미지가 없으면 벽)이 차지하는 월드 범위 */
function planBox(){
  /*
   * **축척 전에는 월드 단위가 mm 가 아니라 이미지 픽셀이다**(`drawPlan` 이 그렇게 그린다).
   * 그때도 도면이 차지하는 범위는 이미지 크기 그대로다 — 예전에는 이 경우가 벽 검사로
   * 떨어졌고, 벽마저 없으면 6000×4000 폴백을 썼다. 900px 짜리 도면 옆에 x=6756 으로
   * 가전을 꺼내 놓는 바람에 화면 맞춤이 줌아웃해 **도면이 854px → 118px 로 줄었다.**
   */
  if (state.img) {
    const k = state.mmPerPx || 1;
    return { x1:0, y1:0, x2: state.imgW*k, y2: state.imgH*k };
  }
  const xs = state.walls.flatMap((w)=>[w.x1,w.x2]), ys = state.walls.flatMap((w)=>[w.y1,w.y2]);
  if (!xs.length) return { x1:0, y1:0, x2:6000, y2:4000 };
  return { x1:Math.min(...xs), y1:Math.min(...ys), x2:Math.max(...xs), y2:Math.max(...ys) };
}
/*
 * 방을 벗어난 가전을 **방 안쪽으로 조금씩 밀어 넣는다.**
 * 방은 ㄱ자·ㄷ자도 되므로 사각형으로 자를 수 없다. 방 중심 쪽으로 한 걸음씩 옮겨 보며
 * 처음으로 온전히 들어가는 자리를 쓴다 — 최단 이동은 아니지만 예측 가능하고 싸다.
 * 끝내 못 넣으면 false 를 돌려주고, 부르는 쪽이 직전 위치로 되돌린다.
 */
function nudgeInside(it){
  /*
   * **가장 가까운 공간으로 밀어 넣는다.** 예전에는 가전에 붙은 방으로만 밀었는데, 이제는
   * 집 안 어디든 놓을 수 있으므로(`insideFor`) 자기 방으로 끌고 가면 손에서 뺏는 셈이 된다 —
   * 사용자가 옆방에 놓으려고 끌어다 놨는데 원래 방으로 되돌아가 버린다.
   */
  const [bx0, by0] = bodyCenter(it);
  const centers = state.rooms.map((rm) =>
    partCenter(rm.parts.reduce((a, q) =>
      (loopArea(loopOfWalls(q.walls)||[]) >= loopArea(loopOfWalls(a.walls)||[]) ? q : a)))).filter(Boolean);
  const target = centers.length
    ? centers.reduce((best, c) =>
        (Math.hypot(c[0]-bx0, c[1]-by0) < Math.hypot(best[0]-bx0, best[1]-by0) ? c : best))
    : roomCenter();
  if (!target) return false;
  const step = Math.max(40, Math.min(it.w, it.d) / 6);
  for (let n = 0; n < 60; n++){
    const [cx,cy] = bodyCenter(it);
    const dx = target[0]-cx, dy = target[1]-cy;
    const L = Math.hypot(dx,dy) || 1;
    it.bx += dx/L*step; it.by += dy/L*step;
    if (!escapesRoom(it)) return true;
  }
  return false;
}
/** 본체 한가운데 (bx,by 는 뒷면 가운데다) */
function bodyCenter(it){
  const c = corners(it);
  return [ (c[0][0]+c[2][0])/2, (c[0][1]+c[2][1])/2 ];
}

/*
 * ── 도면 밖에 꺼내 두기 ────────────────────────────────────────────
 * 이 도구의 쓰임새는 **"상담사가 제품을 도면 안으로 끌고 들어와 대략적인 설치 느낌을
 * 보여주는 것"** 이다(사용자 정의). 그래서 고른 가전을 자동으로 어딘가에 밀어 넣지 않고,
 * 도면 오른쪽 바깥에 **대기 상태(staged)** 로 세워 둔다.
 *
 * 대기 중에는 방 밖 판정도 겹침 판정도 하지 않는다 — 아직 놓은 것이 아니기 때문이다.
 * 끌어서 방 안에 떨어뜨리는 순간 대기가 풀리고 그때부터 판정이 시작된다.
 */
function stageOutside(picks){
  if (!picks || !picks.length) return [];
  // 축척 없이 올리면 mm 와 이미지 픽셀이 섞여 크기 관계가 거짓이 된다
  if (!state.scaled){ needScale(); return []; }
  const box = planBox();
  const gap = Math.max(300, (box.y2-box.y1) * 0.02);
  const already = state.items.filter((i)=>i.staged);
  let y = already.length ? Math.max(...already.map((i)=>i.by + i.d)) + gap : box.y1;
  const made = [];
  for (const q of picks){
    const it = {
      id:'i'+Math.random().toString(36).slice(2,8),
      cat:q.cat, size:q.size, model:q.model, group:q.group, room:q.room || null, color:q.color||null, hex:q.hex||null,
      label:`${q.cat} ${sizeText(q.cat, q.size)}${q.seq?` #${q.seq}`:``}`,
      w:q.part.w, h:q.part.h, d:q.part.d,
      /* 부품 이름을 함께 들고 있어야 **스탠드형 TV 와 벽걸이 TV 를 가를 수 있다** —
         둘은 치수도 설치 높이도 다르다(스탠드는 받침이 치수에 이미 들어 있어 바닥이 맞다). */
      part:q.part.part,
      clear:clearFor(q.cat, q.part.part, q.model, q.group),
      bx: box.x2 + gap + q.part.w/2, by: y, a:0, warn:[], soft:[], staged:true,
    };
    y += q.part.d + gap;
    state.items.push(it); made.push(it);
  }
  applyMountH(made, state.items);
  $('#empty').style.display='none';
  setMode('idle'); state.showClean = false;
  fitAll();
  evaluate(); draw();
  toast(`${made.length}대를 도면 옆에 꺼냈습니다 — 끌어서 도면 안으로 옮기세요`);
  return made;
}

/** 도면과 꺼내 둔 가전이 모두 보이도록 화면을 맞춘다 — 안 보이면 끌 수가 없다 */
function fitAll(){
  const box = planBox();
  let x1 = box.x1, y1 = box.y1, x2 = box.x2, y2 = box.y2;
  for (const it of state.items){
    for (const [x,y] of corners(it)){
      x1 = Math.min(x1,x); y1 = Math.min(y1,y); x2 = Math.max(x2,x); y2 = Math.max(y2,y);
    }
  }
  const rect = cv.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const pad = 24;
  state.zoom = Math.min((rect.width-pad*2)/((x2-x1)||1), (rect.height-pad*2)/((y2-y1)||1));
  state.panX = pad - x1*state.zoom;
  state.panY = pad - y1*state.zoom;
}

function startManual(picks){
  if (!picks || !picks.length) return;
  if (!state.scaled){ needScale(); return; }
  state.queue = picks.slice();
  nextPending();
}
function nextPending(){
  const q = state.queue.shift();
  if (!q){
    state.pending = null; setMode("idle"); hidePlaceBar();
    toast("다 놓았습니다 — 끌어서 옮기거나 두 번 눌러 돌릴 수 있습니다"); draw(); return;
  }
  state.pending = Object.assign({}, q, { clear: clearFor(q.cat, q.part.part, q.model, q.group) });
  setMode("place"); showPlaceBar(); draw();
}
/** 무엇을 놓는 중인지 도면 위 막대로 알린다 — 모달로 물으면 도면이 가려진다 */
function showPlaceBar(){
  const q = state.pending; if (!q) return;
  const bar = $("#draftbar");
  bar.innerHTML = "<div class='dl'>"
    + "<span class='area'>" + esc(q.cat) + "</span>"
    + "<span class='meta'>" + esc(q.size) + " · " + Math.round(q.part.w) + "×" + Math.round(q.part.d) + "mm</span>"
    + "<span class='grow'></span>"
    + "<span class='lvl'>남은 " + state.queue.length + "개</span></div>"
    + "<div class='dl'><span class='prev'>놓을 자리를 도면에서 누르세요 — 가까운 벽에 자동으로 붙습니다</span>"
    + "<span class='grow'></span>"
    + "<button id='p-skip'>건너뛰기</button><button id='p-stop'>그만</button></div>";
  if (!bar.classList.contains('on')) pushBack();   // 휴대폰 뒤로가기가 앱이 아니라 이 막대를 닫도록
  bar.classList.add("on");
  $("#p-skip").onclick = ()=> nextPending();
  $("#p-stop").onclick = ()=>{ state.queue=[]; state.pending=null; setMode("idle"); hidePlaceBar(); draw(); };
}
function hidePlaceBar(){ $("#draftbar").classList.remove("on"); }

function placeAt(wx,wy){
  const q = state.pending;
  const it = {
    id:'i'+Math.random().toString(36).slice(2,8),
    cat:q.cat, size:q.size, model:q.model, group:q.group, color:q.color||null, hex:q.hex||null,
    label:`${q.cat} ${sizeText(q.cat, q.size)}${q.part.part!=='본체'?` (${q.part.part})`:''}`,
    w:q.part.w, h:q.part.h, d:q.part.d,
    clear:q.clear, bx:wx, by:wy, a:0, warn:[],
    room: q.room || (roomAt(wx,wy)||{}).id || null,
  };
  const snap = snapToWall(wx,wy,it);
  if (snap && snap.dist < 2000){ it.bx=snap.bx; it.by=snap.by; it.a=snap.a; }
  state.items.push(it);
  state.sel = it.id; state.pending = null;
  $('#empty').style.display='none';
  evaluate();
  // 대기열이 남아 있으면 이어서 다음 제품을 놓는다
  if (state.queue.length){ nextPending(); return; }
  setMode('idle'); hidePlaceBar(); draw();
}

/* ── 모달 ── */
function sheet(html, after){
  $('#sheet').innerHTML = html;
  const wasOpen = $('#modal').classList.contains('on');
  $('#modal').classList.add('on');
  if (!wasOpen) pushBack();      // 휴대폰 뒤로가기가 앱이 아니라 이 창을 닫도록
  if (after) after();
}
function closeSheet(){ $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click',(e)=>{ if(e.target.id==='modal') closeSheet(); });

/* ── 시작 ── */
resize();
loadReps();

/*
 * ── 통합검색 딥링크 (`?pick=건조기|폭 600mm`) ──
 *
 * 축척이 이미 잡혀 있으면(단지에서 불러온 경우) 바로 가전 선택 시트를 열어 그 줄을
 * 체크한다. 아직 도면이 없으면 **시트를 열지 않는다** — 가전을 올릴 수 없는 상태에서
 * 고르게 하면 헛수고가 된다. 대신 무엇을 찾아 왔는지 한 줄로 알리고, 나중에 시트를
 * 열 때 그 줄이 체크된다.

   * **개폐 궤적을 바닥에 깐다**(2026-08-18 사용자 요청). 3D 는 개구부 아래를 트여
   * 두므로 "여기가 문"이라는 것이 안 보였다 — 열고 드나드는 자리를 바닥에 표시한다.
   * 가전을 그 위에 놓으면 배치 목록에 "문 개폐에 지장" 이 함께 뜬다.
   */
  for (const w of (loop.walls || [])){
    if (!w.open) continue;
    const z = P.openingSwing(w);
    if (!z || z.length < 3) continue;
    const shape = new THREE.Shape(z.map((p) => new THREE.Vector2(M(p[0]), M(p[1]))));
    const geo = new THREE.ShapeGeometry(shape);
    geo.rotateX(Math.PI / 2);                       // XY 평면 → 바닥(XZ)
    const mesh = new THREE.Mesh(geo, swingMat);
    mesh.position.y = 0.004;
    mesh.renderOrder = -1;
    mesh.userData.isSwing = true;                   // 검사가 '가전 디테일' 로 세지 않게
    root.add(mesh);
  }
  for (const w of (loop.walls || [])){
    const m = w.open
      ? wallBox(w.x1, w.y1, w.x2, w.y2, LINTEL_MM, WALL_H_MM, lintMat)
      : wallBox(w.x1, w.y1, w.x2, w.y2, 0, WALL_H_MM, wallMat);
    if (!m) continue;
    const mx = (w.x1 + w.x2) / 2, my = (w.y1 + w.y2) / 2;
    /*
     * **벽은 경계선 **바깥쪽**으로 세운다 — 안쪽 면이 방 경계다** (2026-08-20).
     *
     * `wallBox` 는 상자를 경계선 **위에 가운데 정렬**한다. 두께가 60mm 이던 시절에는
     * 방 안으로 30mm 만 들어와 티가 안 났는데, 실측값 200mm 로 바꾸면서 **100mm 가
     * 방 안으로 들어왔다.** 그래서 벽에 등을 붙인 벽걸이 TV 가 그만큼 벽 속에 묻혀
     * **어디에서도 안 보이는** 상태가 됐다(2026-08-20 사용자 보고).
     *
     * 이 파일의 다른 주석이 이미 *"벽은 방 경계에서 바깥쪽으로 세우므로 안쪽 면은
     * 그대로다"* 라고 적어 두었는데 코드가 그렇지 않았다 — 코드를 주석에 맞춘다.
     * 이웃 방과 겹치는 것은 실제로 공유 벽이라 맞는 그림이다.
     */
    {
      const wx = w.x2 - w.x1, wy = w.y2 - w.y1, WL = Math.hypot(wx, wy) || 1;
      let nx = -wy / WL, ny = wx / WL;                       // 벽에 수직
      if ((mx - cx) * nx + (my - cy) * ny < 0){ nx = -nx; ny = -ny; }   // 방 바깥쪽으로
      m.position.x += M(nx * wallT() / 2);
      m.position.z += M(ny * wallT() / 2);
    }
    const ox = mx - cx, oy = my - cy, L = Math.hypot(ox, oy) || 1;
    m.userData.mid = new THREE.Vector3(M(mx), 0, M(my));
    m.userData.out = new THREE.Vector3(ox / L, 0, oy / L);
    culled.push(m);
    g.add(m);
  }
  return g;
}
/** 카메라가 바깥쪽에 있는 벽을 감춘다 (매 프레임) */
const _v = new THREE.Vector3();
function cullWalls(){
  for (const m of culled){
    _v.copy(cam.position).sub(m.userData.mid);
    m.visible = _v.dot(m.userData.out) <= 0;
  }
}

/* ── 가전 ────────────────────────────────────────────────────

   **치수는 정확하게, 외형은 단순하게.** 삼성 공식 3D 모델을 구할 수 없으므로
   그럴듯한 곡면을 지어내지 않는다. 지어낸 외형은 고객이 실물로 오해한다.
──────────────────────────────────────────────────────────────── */
const bodyMat = new THREE.MeshLambertMaterial({ color: 0xFAFBFC });

const badMat  = new THREE.MeshLambertMaterial({ color: 0xE23D3D });

const ghostMat = new THREE.MeshLambertMaterial({ color: 0xB6BFCB, transparent: true, opacity: 0.45 });

 *   읽어 갈 일이 없다. **김치냉장고 상실에는 넣지 않는다** — 통을 넣는 칸이라 선반 구성을
