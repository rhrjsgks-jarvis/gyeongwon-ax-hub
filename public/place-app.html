   * 무너진다**(사용자 지적). 원본은 있는 그대로 그리고, 정리본은 ◧ 버튼으로 볼 때만
   * 흐리게 겹쳐 "알고리즘이 무엇을 보고 있는지"를 확인하는 용도로 쓴다.
   */
  const drawPlan = (im, alpha)=>{
    const [x,y] = toScreen(0,0);
    const k = state.mmPerPx ? state.mmPerPx*state.zoom : state.zoom;
    ctx.globalAlpha = alpha;
    ctx.drawImage(im, x, y, state.imgW*k, state.imgH*k);
    ctx.globalAlpha = 1;
  };
  /*
   * **이미지와 벽은 반드시 같은 월드 좌표로 그린다.**
   * `mmPerPx` 를 알면 그것으로, 아직 축척을 안 맞췄으면 이미지 픽셀이 곧 월드 단위다.
   * 그런데 **축척은 맞췄는데(mm 월드) 이미지의 mm/px 는 모르는** 상태가 있다
   * (저장된 방만 복원한 경우). 그때 이미지를 그리면 1px=1mm 로 그려져 도면이
   * 구석 썸네일이 된다 — 그리지 않는 것이 맞다.
   */
  const canDrawPlan = state.img && (state.mmPerPx || !state.scaled);
  if (canDrawPlan) drawPlan(state.img, 1);
  if (canDrawPlan && state.showClean && state.cleanCv) drawPlan(state.cleanCv, .55);

  // 방 — 이름과 넓이를 도면 위에 적는다. 어느 방에 무엇을 놓는지가 이 도구의 핵심이라
  // 화면만 보고도 방을 구분할 수 있어야 한다.
  ROOM_FILL.length && state.rooms.forEach((rm, i)=>{
    const col = ROOM_FILL[i % ROOM_FILL.length];
    const on = state.roomSel === rm.id;
    for (const part of rm.parts){
      const L = loopOfWalls(part.walls);
      if (!L) continue;
      ctx.beginPath();
      L.forEach(([x,y],j)=>{ const [sx,sy]=toScreen(x,y); j?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
      ctx.closePath();
      ctx.fillStyle = col + (on ? '2e' : '18');
      ctx.fill();
    }
    const big = rm.parts.map((q)=>({ q, L:loopOfWalls(q.walls) })).filter((q)=>q.L)
      .sort((a,b)=>loopArea(b.L)-loopArea(a.L))[0];
    if (big){
      const c = partCenter(big.q);
      const [sx,sy] = toScreen(c[0], c[1]);
      ctx.font = `600 ${on?14:13}px system-ui,sans-serif`;
      ctx.textAlign='center'; ctx.fillStyle = col;
      ctx.fillText(rm.name, sx, sy - 2);
      if (state.scaled){
        ctx.font='11px ui-monospace,monospace'; ctx.fillStyle='#6B7280';
        ctx.fillText(`${(roomArea(rm)/1e6).toFixed(1)}㎡`, sx, sy + 13);
      }
    }
  });

  /*
   * 벽 — **도면 위에 얹는 표시지 도면을 대신하는 그림이 아니다.**
   * 굵은 검정 4px 로 긋고 모든 벽에 mm 를 찍었더니 도면이 안 보이고 선만 보였다
   * ("너무 벽에 치중된 것 같다" — 사용자 지적). 도면에 이미 벽이 그려져 있으므로
   * 인식 결과는 **가늘고 반투명하게** 겹치는 것으로 충분하다.
   * 다만 **개구부(문·창)는 또렷하게** 남긴다 — 도면만 봐서는 알 수 없는 판정 결과이고,
   * 그 앞을 막는 가전에 경고가 붙기 때문에 근거가 보여야 한다.
   * 벽 길이(mm)는 **치수 보기(state.showDims)를 켰을 때만** 적는다. 상담에서 필요한 순간이
   * 있지만 늘 떠 있으면 도면을 덮는다.
   */
  ctx.lineCap='round';
  const wallCol = getComputedStyle(document.documentElement).getPropertyValue('--wall').trim()||'#111';
  /*
   * **개폐 궤적을 먼저 깐다**(2026-08-18 사용자 요청: *"문이 열리고 닫히는 가상선은
   * 있어야 한다"*). 벽·가전보다 아래에 깔아야 그것들을 가리지 않는다.
   */
  for (const w of state.walls){
    if (!w.open) continue;
    const z = openingSwing(w);
    if (!z) continue;
    ctx.beginPath();
    z.forEach((p, i) => { const [sx, sy] = toScreen(p[0], p[1]); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
    ctx.closePath();
    ctx.fillStyle = 'rgba(180,83,9,.10)'; ctx.fill();
    ctx.strokeStyle = 'rgba(180,83,9,.55)'; ctx.lineWidth = 1.2; ctx.setLineDash([5,4]); ctx.stroke();
    ctx.setLineDash([]);
  }
  for (const w of state.walls){
    const [ax,ay]=toScreen(w.x1,w.y1), [bx,by]=toScreen(w.x2,w.y2);
    const L=Math.hypot(w.x2-w.x1,w.y2-w.y1);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
    ctx.globalAlpha = w.open ? 1 : .45;
    ctx.strokeStyle = w.open ? '#B45309' : wallCol;
    ctx.lineWidth = w.open ? 3 : 2;
    ctx.setLineDash(w.open ? [7,5] : []);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    if (state.showDims && (L > 400 || state.walls.length <= 8)){
      const mx=(ax+bx)/2, my=(ay+by)/2;
      ctx.fillStyle = w.open ? '#B45309' : '#374151';
      ctx.font='11px ui-monospace,monospace'; ctx.textAlign='center';
      ctx.fillText(`${w.open?'개구부 ':''}${Math.round(L).toLocaleString()}mm`, mx, my-6);
    }
  }
  // 경계 수정 손잡이 — 어디를 끌 수 있는지 보여야 끌 수 있다
  if (state.mode==='edit'){
    const sel = state.editSel;
    for (const rm of state.rooms) rm.parts.forEach((part, pi)=>{
      const pts = partPoints(part); if (!pts) return;
      part.walls.forEach((w,i)=>{
        const on = sel && sel.room===rm.id && sel.part===pi && sel.kind==='e' && sel.idx===i;
        if (!on) return;
        const [ax,ay]=toScreen(w.x1,w.y1), [bx,by]=toScreen(w.x2,w.y2);
        ctx.strokeStyle='#1428A0'; ctx.lineWidth=7; ctx.globalAlpha=.28;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.globalAlpha=1;
      });
      pts.forEach((q,i)=>{
        const [sx,sy]=toScreen(q[0],q[1]);
        const on = sel && sel.room===rm.id && sel.part===pi && sel.kind==='v' && sel.idx===i;
        ctx.fillStyle = on ? '#1428A0' : '#fff';
        ctx.strokeStyle = '#1428A0'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(sx-4, sy-4, 8, 8); ctx.fill(); ctx.stroke();
      });
    });
  }
  // 그리는 중인 벽
  if (state.mode==='wall' && state.wallPts.length){
    ctx.strokeStyle='#1428A0'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath();
    state.wallPts.forEach(([x,y],i)=>{ const [sx,sy]=toScreen(x,y); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.stroke(); ctx.setLineDash([]);
    for (const [x,y] of state.wallPts){ const [sx,sy]=toScreen(x,y);
      ctx.fillStyle='#1428A0'; ctx.beginPath(); ctx.arc(sx,sy,4,0,7); ctx.fill(); }
  }
  // 함께 묶으려고 담아 둔 조각 — 지금 고르는 것과 구분되게 옅게 채워 둔다.
  // 담긴 것이 눈에 보여야 "몇 개를 묶는 중인지" 알 수 있다.
  for (const pc of (state.draftMore || [])){
    if (!pc.poly || !pc.poly.length) continue;
    const k = state.mmPerPx || 1;
    ctx.beginPath();
    pc.poly.forEach(([ix,iy],i)=>{ const [sx,sy]=toScreen(ix*k, iy*k); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.closePath();
    ctx.fillStyle='rgba(20,40,160,.10)'; ctx.fill();
    ctx.strokeStyle='#1428A0'; ctx.lineWidth=2; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
  }
  // 자동 인식 초안
  if (state.draft && state.draft.length){
    const k = state.mmPerPx || 1;
    ctx.beginPath();
    state.draft.forEach(([ix,iy],i)=>{ const [sx,sy]=toScreen(ix*k, iy*k); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); });
    ctx.closePath(); ctx.fillStyle='rgba(20,40,160,.06)'; ctx.fill();
    ctx.lineJoin='round'; ctx.lineCap='round';
    for (const e of (state.draftEdges || state.draft.map((p,i,a)=>{
      const q=a[(i+1)%a.length]; return {x1:p[0],y1:p[1],x2:q[0],y2:q[1],open:false};
    }))){
      const [ax,ay]=toScreen(e.x1*k, e.y1*k), [bx,by]=toScreen(e.x2*k, e.y2*k);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
      ctx.strokeStyle = e.open ? '#B45309' : '#1428A0';
      ctx.lineWidth = e.open ? 4 : 5;
      ctx.setLineDash(e.open ? [7,5] : []);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // 축척 보정 점
  for (const [x,y] of state.scalePts){
    ctx.fillStyle='#B45309'; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
  }

  /*
   * 지금 길이를 묻고 있는 벽 — 굵은 주황으로 못 박아 어느 것을 재는지 보여준다.
   *
   * **후보를 한꺼번에 보여준다**(2026-08-20 사용자 요청: *"한 군데만 기준을 두면 모르는
   * 치수가 나올 수 있다"*). 예전에는 현재 후보 하나만 그리고 나머지는 `다음 ▸` 으로
   * 하나씩 넘겨야 보였다 — 상담사는 **어느 벽 길이를 아는지 이미 알고 있으므로**,
   * 고를 수 있는 벽을 전부 보여주고 눌러서 고르게 하는 편이 빠르고 덜 틀린다.
   * 지금 것은 굵은 주황, 나머지는 옅은 주황에 번호를 붙인다.
   */
  if (state.measureCands && state.measureCands.length > 1){
    ctx.lineCap = 'round'; ctx.textAlign = 'center';
    state.measureCands.forEach((c, i) => {
      if (state.measureSeg && c.x1 === state.measureSeg.x1 && c.y1 === state.measureSeg.y1
        && c.x2 === state.measureSeg.x2 && c.y2 === state.measureSeg.y2) return;   // 현재 것은 아래에서 굵게
      const [ax,ay] = toScreen(c.x1, c.y1), [bx,by] = toScreen(c.x2, c.y2);
      ctx.strokeStyle = 'rgba(180,83,9,.42)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
      const mx = (ax+bx)/2, my = (ay+by)/2;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mx, my, 9, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(180,83,9,.75)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#B45309'; ctx.font = '700 11px system-ui';
      ctx.fillText(String(i+1), mx, my + 4);
    });
  }
  if (state.measureSeg){
    const m = state.measureSeg;
    const [ax,ay] = toScreen(m.x1, m.y1), [bx,by] = toScreen(m.x2, m.y2);
    ctx.strokeStyle = '#B45309'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.fillStyle = '#B45309'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center';
    const many = (state.measureCands || []).length > 1;
    ctx.fillText(many ? '이 벽의 길이 (다른 벽을 눌러 바꿀 수 있습니다)' : '이 가로 벽의 길이', (ax+bx)/2, (ay+by)/2 - 10);
  }

  // 가전
  state.items.forEach((it, itIdx)=>{
    const body = corners(it).map(([x,y])=>toScreen(x,y));
    const cl   = corners(it, it.clear).map(([x,y])=>toScreen(x,y));
    const bad  = it.warn && it.warn.length;

    // 도어 오픈 공간 — 이격보다 먼저(아래) 그려 이격선을 가리지 않게 한다
    const dz = doorZoneFor(it);
    if (dz){
      const zone = corners(it, {back:0, side:dz.side, front:0}).map(([x,y])=>toScreen(x,y));
      ctx.beginPath(); zone.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
      ctx.fillStyle = 'rgba(180,83,9,.07)'; ctx.fill();
      ctx.setLineDash([2,3]); ctx.lineWidth=1; ctx.strokeStyle='#B45309'; ctx.stroke();
      ctx.setLineDash([]);
    }

    // 이격 영역
    if (it.clear.back||it.clear.side||it.clear.front){
      ctx.setLineDash([5,4]); ctx.lineWidth=1;
      ctx.strokeStyle= bad ? '#B42318' : '#94A3B8';
      ctx.beginPath(); cl.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.stroke();
      ctx.setLineDash([]);
    }
    /*
     * 본체 — **도면 위에서 한눈에 보여야 한다.**
     * 예전에는 13% 투명도라 컬러 렌더링 도면 위에서 제품이 배경에 묻혔다
     * ("제품 컬러는 더 진하게 해야 도면 컬러와 겹치지 않게 확인이 가능하다" — 사용자 지적).
     * 도면을 가리지 않으면서 확실히 읽히도록, 진한 면 + 흰 테두리로 그린다 —
     * 흰 테두리가 있으면 어두운 도면 위에서도 윤곽이 끊기지 않는다.
     */
    ctx.beginPath(); body.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath();
    // 아직 도면 밖에 꺼내 둔 것은 흐리게 — "놓은 것"과 "꺼내 둔 것"이 구분돼야 한다
    ctx.fillStyle = it.staged ? 'rgba(71,85,105,.42)' : (bad ? 'rgba(180,35,24,.72)' : 'rgba(20,40,160,.68)');
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = state.sel===it.id ? 3.5 : 2.5; ctx.stroke();
    if (it.staged) ctx.setLineDash([6,4]);
    ctx.strokeStyle = bad ? '#7F1D1D' : (state.sel===it.id ? '#0B1A6B' : '#101C52');
    ctx.lineWidth = state.sel===it.id ? 2 : 1.2; ctx.stroke();
    ctx.setLineDash([]);
    drawGlyph(it);

    // 정면 표시(도어가 열리는 쪽)
    const [f1,f2] = [body[3], body[2]];
    /*
     * **카탈로그 컬러는 정면 쪽 띠로 보인다**(2026-08-14).
     *
     * 본체를 제품 색으로 칠하지 않는 이유가 있다 — 카탈로그 색은 대부분 화이트·베이지라
     * 밝은 도면 위에서 **제품이 배경에 묻힌다.** 그건 이미 겪고 고친 문제다
     * ("제품 컬러는 더 진하게 해야 도면 컬러와 겹치지 않게 확인이 가능하다" — 사용자).
     * 그래서 본체는 진한 남색 그대로 두고, **정면 쪽에 색 띠**를 얹는다.
     * 3D 는 상자 자체를 이 색으로 칠한다 — **두 화면이 같은 hex 를 쓴다.**
     * `hex` 가 없으면(카탈로그 컬러명에 색 단어가 없다) 칠하지 않는다 — 지어내지 않는다.
     */
    if (it.hex && !it.staged){
      const [b1, b2] = [body[0], body[1]];              // 뒷면
      const t = 0.16;                                    // 깊이의 16% 만큼만
      const mix = (p, q) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
      const m1 = mix(f1, b1), m2 = mix(f2, b2);
      ctx.beginPath();
      ctx.moveTo(f1[0],f1[1]); ctx.lineTo(f2[0],f2[1]);
      ctx.lineTo(m2[0],m2[1]); ctx.lineTo(m1[0],m1[1]); ctx.closePath();
      ctx.fillStyle = it.hex; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(f1[0],f1[1]); ctx.lineTo(f2[0],f2[1]);
    ctx.strokeStyle = '#FDE68A'; ctx.lineWidth=3.5; ctx.stroke();   // 진한 본체 위에서 도어 쪽이 보이도록

    // 라벨
    const cx=(body[0][0]+body[2][0])/2, cy=(body[0][1]+body[2][1])/2;
    const [cxw,cyw] = bodyCenter(it);
    ctx.font='700 11px system-ui'; ctx.textAlign='center';
    // 진한 본체 위에 얹으므로 글자는 흰색. 얇은 어두운 외곽선으로 어떤 배경에서도 읽히게 한다.
    /*
     * 적층 조합(TV+사운드바, 세탁기+건조기)은 **같은 자리에 겹쳐 놓이는 것이 정상**이라
     * 라벨이 서로 뭉개져 둘 다 못 읽게 된다. 앞서 그린 것 중 중심이 가까운 것 수만큼
     * 아래로 어긋나게 적는다.
     */
    const near = state.items.slice(0, itIdx).filter((o)=>{
      const [ox,oy] = bodyCenter(o);
      return Math.hypot(ox-cxw, oy-cyw) < Math.max(it.w, it.d) * 0.6;
    }).length;
    const ly = cy + 4 + near * 14;
    ctx.lineWidth=3; ctx.strokeStyle='rgba(8,14,40,.85)'; ctx.strokeText(it.label, cx, ly);
    ctx.fillStyle='#fff'; ctx.fillText(it.label, cx, ly);
  });
  renderSide();
}

/**
 * 배치한 가전을 지운다. 키보드(Delete)와 목록의 ✕ 가 같은 길로 지나가야
 * 한쪽만 고치는 사고가 안 난다. **태블릿에는 Delete 키가 없으므로 버튼이 필수다.**
 */
function removeItem(id){
  const it = state.items.find((x)=>x.id===id);
  if (!it) return;
  state.items = state.items.filter((x)=>x!==it);
  if (state.sel===id) state.sel = null;
  if (!state.items.length) $('#empty').style.display='';
  /*
   * **TV 를 지우면 그 아래 사운드바가 공중에 남는다.** 3D 에서 벽에 붙어 떠 있는데
   * 걸 TV 가 없으니 거짓 그림이다. 따라가던 것만 다시 계산한다 —
   * 다른 TV 가 있으면 그쪽으로 가고, 없으면 바닥(받침대 위)으로 내려온다.
   */
  if (/^TV$/.test(it.cat)){
    const orphans = state.items.filter((o)=> mountKind(o)==='TV아래' && !o.mhSet);
    for (const o of orphans) o.mh = defaultMountH(o, state.items);
    alignUnderTV(orphans.filter((o)=>!o.posSet), state.items);
  }
  evaluate(); renderSide(); draw();
  toast(`${it.label} 삭제`);
}

/*
 * ── 상담 결과를 이미지 한 장으로 ──────────────────────────────────
 * **상담이 끝나면 고객 손에 아무것도 안 남는 것이 이 도구의 가장 큰 구멍이었다.**
 * 고객은 자기 집 도면에 제품이 놓인 그림을 보고 갔는데 가져갈 것이 없다.
 * 도면 화면 아래에 고른 제품·모델코드·치수·이격을 붙여 한 장으로 만든다 —
 * 그대로 카톡으로 보내면 집에 가서 다시 보고, 그것이 재방문 명분이 된다.
 *
 * 캔버스를 다시 그리지 않고 **화면에 보이는 것을 그대로 복사**한다. 화면과 다른 그림이
 * 나가면 "내가 본 것과 다르다"가 되기 때문이다.
 */
function buildShareCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.width / dpr, H = cv.height / dpr;
  const items = state.items;
  const lineH = 34, headH = 64, padX = 20;
  const listH = items.length ? headH + items.length * lineH + 16 : headH;
  const out = document.createElement('canvas');
  const S = 2;                                   // 카톡으로 보내도 글자가 뭉개지지 않게
  out.width = W * S; out.height = (H + listH) * S;
  const g = out.getContext('2d');
  g.scale(S, S);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H + listH);
  /*
   * **화면에 보이는 것을 그대로** 내보낸다 — 3D 를 보고 있으면 3D 가 나가야 한다.
   * 고객에게 보여준 그림과 손에 남는 그림이 다르면 "내가 본 것과 다르다"가 된다.
   * WebGL 캔버스는 `preserveDrawingBuffer:true` 로 만들어 두어 그대로 복사된다.
   */
  const on3d = window.Place3D && window.Place3D.isOpen;
  if (on3d) window.Place3D.render();     // 지금 상태로 한 장 그린 뒤 복사한다(아래 주석 참조)
  g.drawImage(on3d ? window.Place3D.canvas : cv, 0, 0, W, H);

  g.fillStyle = '#F8FAFC'; g.fillRect(0, H, W, listH);
  g.strokeStyle = '#E2E8F0'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, H + .5); g.lineTo(W, H + .5); g.stroke();

  const title = state.complexName ? `${state.complexName}${state.typeName ? ' ' + state.typeName : ''}` : '가전 배치 상담';
  g.fillStyle = '#0F172A'; g.font = '700 17px system-ui,sans-serif'; g.textAlign = 'left';
  g.fillText(title, padX, H + 28);
  const area = planAreaM2();
  g.fillStyle = '#64748B'; g.font = '12px system-ui,sans-serif';
  /* 3D 로 내보낼 때는 무엇을 보고 있는지 밝힌다 — 층고는 도면에 없는 가정값이고,
     문을 연 상태라면 그 사실이 그림의 뜻을 바꾼다. */
  const doorsOn = on3d && window.Place3D.doorsOpen;
  g.fillText([
    area && planAreaKnown() ? `전용 ${area.toFixed(1)}㎡`
      : (state.rooms.length ? `공간 ${state.rooms.length}곳 · 넓이 합계는 겹칠 수 있어 적지 않습니다` : null),
    state.rooms.length ? `공간 ${state.rooms.length}곳` : null,
    `가전 ${items.length}대`,
    on3d ? `3D · 층고 ${window.Place3D.WALL_H_MM.toLocaleString()}mm(가정)` : null,
    doorsOn ? `문 열림 ${items.filter((it) => it.doorOpen && !it.staged).length}대` : null,
    new Date().toLocaleDateString('ko-KR'),
  ].filter(Boolean).join('  ·  '), padX, H + 48);

  /* 문을 열었더니 막히는 제품이 있으면 **카드에도 빨갛게** 적는다.
     고객에게 보여준 경고가 손에 남는 그림에서 사라지면 안 된다. */
  if (doorsOn){
    /* **연 것만 센다** — 문 열림은 제품마다 다르다. 닫아 둔 제품을 "문이 안 열립니다"로
       적으면 상담사가 열어 보지도 않은 제품에 경고를 달게 된다 */
    const blocked = items.filter((it) => !it.staged && it.doorOpen && doorHits(it, items, state.walls).length);
    if (blocked.length){
      g.fillStyle = '#B42318'; g.font = '700 12.5px system-ui,sans-serif';
      g.fillText(`⚠ 문이 안 열리는 제품 ${blocked.length}대 — ${blocked.map((b) => b.label).join(', ')}`,
        padX, H + 62);
    }
  }

  items.forEach((it, i)=>{
    const y = H + headH + i * lineH + 14;
    g.fillStyle = it.warn && it.warn.length ? '#B42318' : (it.staged ? '#64748B' : '#1428A0');
    g.beginPath(); g.arc(padX + 4, y - 4, 4, 0, 7); g.fill();
    g.fillStyle = '#0F172A'; g.font = '600 13px system-ui,sans-serif';
    g.fillText(it.label + (it.staged ? ' (미배치)' : ''), padX + 16, y);
    g.fillStyle = '#475569'; g.font = '12px ui-monospace,monospace';
    // 상담지에도 모델코드는 적지 않는다 — 크기를 보여주는 것이지 그 모델을 제안하는 것이 아니다
    /* 벽에 건 것은 **설치 높이도 카드에 남긴다** — 고객이 집에 가서 재 봐야 하는 값이고,
       화면에서 보여준 것이 손에 남는 그림에서 사라지면 안 된다(경고를 카드에 적는 것과 같은 이유). */
    const spec = `${Math.round(it.w)}×${Math.round(it.h)}×${Math.round(it.d)}mm  이격 후면 ${it.clear.back}·좌우 ${it.clear.side}mm`
      + (mountable(it) ? `  설치 높이 ${Math.round(it.mh || 0).toLocaleString()}mm(바닥→하단)` : '');
    g.fillText(spec, padX + 16, y + 15);
    if (it.warn && it.warn.length){
      g.fillStyle = '#B42318'; g.font = '11px system-ui,sans-serif'; g.textAlign = 'right';
      g.fillText(it.warn.join(' / '), W - padX, y);
      g.textAlign = 'left';
    }
  });
  g.fillStyle = '#94A3B8'; g.font = '11px system-ui,sans-serif'; g.textAlign = 'right';
  g.fillText('치수는 삼성스토어 카탈로그 기준 · 설치 규격은 실측 확인 필요', W - padX, H + 28);
  return out;
}

async function shareResult(){
  if (!state.items.length){ toast('배치한 가전이 없습니다'); return; }
  const out = buildShareCanvas();
  const name = `가전배치_${state.complexName ? state.complexName.replace(/\s+/g, '') + '_' : ''}${new Date().toISOString().slice(0, 10)}.png`;
  const blob = await new Promise((r)=> out.toBlob(r, 'image/png'));
  if (!blob){ toast('이미지를 만들지 못했습니다'); return; }
  /*
   * 공유 시트가 있으면 그것으로(매장에서 카톡으로 바로 보내는 것이 목적이다).
   * 없거나 사용자가 취소하면 내려받기로 떨어진다 — 어느 기기에서도 결과는 남아야 한다.
   */
  const file = new File([blob], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: '가전 배치 결과' }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // 사용자가 취소한 것은 실패가 아니다
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
  toast('이미지로 저장했습니다');
}

/* ── 사이드 목록 ── */
/*
 * 하단 요약 — **상담 중 눈을 떼지 않고 확인해야 하는 것만** 넣는다.
 * 어느 집인지 · 축척이 잡혔는지 · 공간과 가전이 몇인지 · 문제가 있는지.
 * 고른 가전이 있으면 그 치수와 이격을 한 줄 더 붙인다 — 상담에서 가장 많이 읽는 값이다.
 */
function renderMini(){
  const el = $('#mini'); if (!el) return;
  const bad = state.items.filter((i)=>i.warn && i.warn.length).length;
  const soft = state.items.filter((i)=>i.soft && i.soft.length).length;
  const staged = state.items.filter((i)=>i.staged).length;
  const area = planAreaM2();
  const who = planLabel();
  const bits = [];
  if (who) bits.push(`<b>${esc(state.complexName ? state.complexName + ' ' + (state.typeName||'') : who)}</b>`);
  bits.push(state.scaled ? '축척 확정' : '<span class="warn">축척 미확정</span>');
  if (state.rooms.length) bits.push(`공간 ${state.rooms.length}곳${planAreaKnown() && area ? ` · 전용 ${area.toFixed(0)}㎡` : ''}`);
  /* 숫자를 안 적는 이유를 화면이 밝힌다 — 없으면 "왜 없지"가 되고, 적으면 거짓이 된다 */
  if (state.rooms.length > 1 && !planAreaKnown()) bits.push('<span class="warn">공간이 겹칠 수 있어 넓이 합계는 표시하지 않습니다</span>');
  /* 좁은 화면에서는 오른쪽 패널이 안 보이므로 이 띠가 유일한 알림 자리다(CLAUDE.md) */
  if (state.baseInfo && state.baseInfo.tilted)
    bits.push('<span class="warn">벽이 비스듬한 이미지 — 인식 결과 확인</span>');
  bits.push(`가전 ${state.items.length}대${staged ? ` (대기 ${staged})` : ''}`);
  bits.push(bad ? `<span class="warn">확인 필요 ${bad}건</span>`
    : (state.items.length ? '<span class="ok">문제 없음</span>' : ''));
  if (soft) bits.push(`주의 ${soft}건`);
  const it = state.items.find((x)=>x.id===state.sel);
  const sel = it ? `<span class="sel">${esc(it.label)} · ${Math.round(it.w)}×${Math.round(it.h)}×${Math.round(it.d)}mm`
      + ` · 이격 후면 ${it.clear.back}·좌우 ${it.clear.side}mm`
      + `${it.warn && it.warn.length ? ` · <span class="warn">${esc(it.warn.join(' / '))}</span>` : ''}`
      /*
       * 고른 가전에 **회전·삭제 버튼**을 붙인다. 회전이 더블탭뿐이면 아무도 모른다 —
       * 실제로 "더블클릭으로 알고 있다"는 말을 들었다. 손가락으로 정확히 두 번 누르는
       * 것도 쉽지 않다. 버튼이 있으면 헤맬 일이 없다.
       */
      /*
       * **설치 높이** — 벽에 거는 TV·그 아래 사운드바만 나온다(사용자 요청).
       * 바닥에 놓는 가전에는 칸을 만들지 않는다 — 늘 0 인 칸이 붙어 있으면 화면만 시끄럽다.
       * 값의 근거(가정인지 파생인지)는 `title` 로 붙여 눌러 보면 알 수 있게 한다.
       */
      + (mountable(it)
        ? ` · 설치 높이 <input class="mh" id="mini-mh" type="number" inputmode="numeric"`
          + ` min="0" max="2200" step="10" value="${Math.round(it.mh || 0)}"`
          + ` title="${esc(mountWhy(it) || '')}">mm`
        : '')
      + ` <button class="act" id="mini-rot">↻ ${rotLabel(it.cat)}°</button>`
      + `<button class="act" id="mini-del">✕ 삭제</button></span>` : '';
  el.innerHTML = `<div class="r">${bits.filter(Boolean).join('<span>·</span>')}`
    + `<span class="more" id="mini-more">자세히</span></div>${sel}`;
  const mo = $('#mini-more');
  // 열기만 하면 닫을 길이 없어 다음 작업을 못 한다(사용자 지적) — 토글로 둔다
  if (mo) mo.onclick = ()=> toggleSide();
  const ro = $('#mini-rot');
  if (ro) {
    /*
     * **길게 누르면 반대 방향으로 돈다**(2026-08-14 지시문 F).
     * 90° 단위면 세 번 눌러 돌아오면 되지만 **에어컨은 45°** 라 일곱 번이다 —
     * 대각선으로 놓다가 한 칸 지나치면 되돌리기가 번거롭다.
     * 길게 누르는 동안 한 번만 돈다(누르고 있으면 계속 도는 것은 어지럽다).
     */
    let held = null, fired = false;
    const spin = (dir)=>{
      const t = state.items.find((x)=>x.id===state.sel);
      if (!t) return;
      rotateItem(t, dir); evaluate(); renderSide(); draw();
      if (dir < 0) toast(`반대 방향으로 ${rotLabel(t.cat)}° 돌렸습니다`);
    };
    ro.onpointerdown = ()=>{ fired = false; held = setTimeout(()=>{ fired = true; spin(-1); }, 500); };
    const clear = ()=>{ if (held) { clearTimeout(held); held = null; } };
    ro.onpointerup = ro.onpointerleave = ro.onpointercancel = clear;
    ro.onclick = ()=>{ clear(); if (fired) { fired = false; return; } spin(1); };
  }
  const de = $('#mini-del');
  if (de) de.onclick = ()=> removeItem(state.sel);
  /*
   * 설치 높이 입력 — 값이 바뀌면 3D 를 다시 세운다(2D 평면에는 높이가 안 보인다).
   * `input` 이 아니라 `change` 로 받는다: 숫자를 치는 중간값("6" → 60mm)마다 3D 를
   * 다시 세우면 장면이 튀고, 무엇보다 그 중간값으로 판정이 돌아 경고가 깜빡인다.
   * **글자를 치는 중에는 단축키를 받지 않는다**는 기존 규칙(`keydown` 이 INPUT 을 거른다)이
   * 여기에도 그대로 걸린다 — 그래서 Backspace 로 가전이 지워지지 않는다.
   */
  const mh = $('#mini-mh');
  if (mh) mh.onchange = ()=>{
    const t = state.items.find((x)=>x.id===state.sel);
    if (!t) return;
    const v = Math.max(0, Math.min(2200, Math.round(+mh.value || 0)));
    t.mh = v;
    /* TV 를 옮기면 그 아래 사운드바가 따라간다 — 사용자가 사운드바를 직접 만진 적이
       없을 때만. 한 번이라도 손댔으면 그 값을 존중한다(`mhSet`). */
    if (/^TV$/.test(t.cat)) {
      for (const o of state.items)
        if (/^사운드바$/.test(o.cat) && !o.mhSet && o.room === t.room) o.mh = defaultMountH(o, state.items);
      alignUnderTV(null, state.items);      // 높이만이 아니라 평면 중심도 따라간다
    } else t.mhSet = true;
    evaluate(); renderSide(); draw();
    if (window.Place3D && window.Place3D.isOpen) window.Place3D.rebuild();
  };
}

function renderSide(){
  renderRooms();
  renderMini();
  const list = $('#list');
  if (!state.items.length){
    list.innerHTML = '<p class="hint" style="padding:10px">아직 배치한 가전이 없습니다.</p>';
  } else {
    list.innerHTML = state.items.map((it)=>`
      <div class="row ${state.sel===it.id?'sel':''}" data-id="${it.id}">
        <!-- 이름표에 이미 사이즈가 들어 있다(“TV 115인치”) — pill 로 또 붙이면 두 번 나온다 -->
        <div class="t">${esc(it.label)}${itemRoom(it)?`<span class="pill">${esc(itemRoom(it).name)}</span>`:''}${it.staged?'<span class="pill">대기</span>':''}<span class="grow"></span><button class="del" data-delitem="${it.id}" title="이 가전을 지웁니다">✕</button></div>
        <!--
          한 줄로 합치고 **0 인 이격은 적지 않는다**(2026-08-12 사용자: *"난잡하다"*).
          가전 한 대가 네 줄을 먹어 여섯 대만 놓아도 목록이 화면을 넘겼는데,
          그중 "이격 후면 0 · 좌우 0mm" 처럼 **아무 제약이 없다는 뜻의 줄**이 섞여 있었다.
          이격은 값이 있을 때만 판정에 영향을 주므로 있을 때만 적는다.
        -->
        <div class="m">${Math.round(it.w)}×${Math.round(it.h)}×${Math.round(it.d)}mm${
          (()=>{ const c=[]; if(it.clear.back)c.push(`후면 ${it.clear.back}`);
                 if(it.clear.side)c.push(`좌우 ${it.clear.side}`);
                 if(it.clear.front)c.push(`전면 ${it.clear.front}`);
                 return c.length?` · 이격 ${c.join('·')}mm`:''; })()}</div>
        <!-- **문제가 있을 때만 적는다.** 모든 줄에 초록 "배치 가능"이 붙어 있으면
             정작 빨간 경고가 그 사이에 묻힌다. 아래 리포트가 총계를 따로 말한다. -->
        ${it.warn&&it.warn.length?`<div class="w">${esc(it.warn.join(' / '))}</div>`:''}
        ${it.soft&&it.soft.length?`<div class="s">${esc(it.soft.join(' / '))}</div>`:''}
      </div>`).join('');
  }
  list.querySelectorAll('button[data-delitem]').forEach((el)=>{
    el.onclick = (e)=>{
      e.stopPropagation();          // 줄을 누르면 선택이라 삭제와 겹친다
      removeItem(el.dataset.delitem);
    };
  });
  const bad = state.items.filter((i)=>i.warn&&i.warn.length).length;
  const soft = state.items.filter((i)=>i.soft&&i.soft.length).length;
  const loop = wallLoop();
  const opensN = state.walls.filter((w)=>w.open).length;
  /*
   * **한 공간이 세대 전체 크기면 방이 안 나뉜 것이다.**
   * 문이 전부 열린 채 그려진 도면에서 닫기 반경이 모자라면 세대 전체가 방 하나로 잡힌다
   * (CLAUDE.md "반경 0에서 세대 전체가 방 하나로 잡혔다"). 그 상태로 이름만 붙여 저장하면
   * 나중에 "거실 51.9㎡"처럼 보이는데, 52㎡ 세대의 거실이 52㎡일 수는 없다.
   * 전용면적을 아는 경우에만 짚어 준다 — 근거 없이 경고하지 않는다.
   */
  const whole = state.exclusiveM2 && state.rooms.find((r)=> roomArea(r)/1e6 >= state.exclusiveM2 * 0.9);
  /*
   * **방별 면적을 여기 다시 적지 않는다.** 바로 위 `공간` 목록이 이름과 넓이를 이미
   * 한 줄씩 보여주는데, 리포트가 그것을 쉼표로 이어 한 번 더 적고 있었다 —
   * 같은 숫자가 화면에 두 번 뜬다(3D 하단바까지 치면 세 번).
   * 여기서는 목록이 말하지 않는 것만 말한다 — 개수 · 조각난 방 · 세대 전체 경고.
   */
  const pieces = state.rooms.filter((r)=>r.parts.length>1).length;
  const roomLine = state.rooms.length
    ? row('ok', `공간 ${state.rooms.length}곳`
        + (pieces?` · ${pieces}곳은 조각으로 이어 붙임`:'')
        + (opensN?` · 개구부 ${opensN}곳`:'')
        + (whole?` — <b>${esc(whole.name)}가 세대 전체(전용 ${state.exclusiveM2}㎡) 크기입니다. 방이 나뉘지 않았을 수 있어요 — '더 좁게'로 다시 인식해 보세요</b>`:''))
    : row(loop?'ok':(state.walls.length?'warn':'bad'), loop ? `방 닫힘 (경계 ${state.walls.length}구간${opensN?` · 개구부 ${opensN}곳`:''})` : (state.walls.length?`벽 ${state.walls.length}개 — 닫히지 않아 "방 밖" 판정을 하지 않습니다`:'벽 없음 — 벽 스냅·방 밖 판정 불가'));
  /*
   * **인식이 스스로 포기한 것을 숨기지 않는다.**
   * 이미지를 거부하지는 않는다 — 왼쪽은 입체, 오른쪽은 평면인 도면이 실제로 있고
   * 그런 도면은 오른쪽만 보면 멀쩡히 인식된다. 다만 결과가 이상할 때 **왜 그런지**와
   * **무엇을 하면 되는지**가 화면에 있어야 상담이 거기서 막히지 않는다.
   */
  const bi = state.baseInfo;
  const drawLine = !bi ? null
    : (bi.tilted
        ? row('warn', '이 이미지는 벽이 가로·세로로 곧지 않습니다(입체 렌더링·사진·표 지면일 수 있어요) — '
            + '<b>인식 결과를 그대로 믿지 마세요.</b> 2D 평면도 부분만 잘라 올리거나 <b>경계 수정</b>으로 고쳐 주세요')
        : (bi.outline ? row('warn', '벽을 칠하지 않고 선으로만 그린 도면이라 가구·글씨가 함께 남습니다 — 경계 수정으로 다듬어 주세요') : null));
  $('#report').innerHTML = [
    row(state.scaled?'ok':'warn', state.mmPerPx ? `축척 확정 (도면 1px = ${state.mmPerPx.toFixed(2)}mm)` : (state.scaled ? '축척 확정 (벽 실제 길이 입력 기준)' : '축척 미확정 — 벽을 그리고 실제 길이를 입력하세요')),
    ...(drawLine ? [drawLine] : []),
    roomLine,
    row(bad?'bad':'ok', bad ? `문제 ${bad}건` : `배치 ${state.items.length}건 · 문제 없음`),
    ...(soft ? [row('warn', `도어 오픈 등 확인 필요 ${soft}건 — 주황 점선 구역`)] : []),
  ].join('');
  $('#status').textContent = {
    idle:'가전을 끌어 옮기고, 두 번 누르면 90° 회전 · 벽을 넘으면 안쪽으로 옮겨 드립니다 · TV+사운드바, 세탁기+건조기는 같은 자리에 놓을 수 있습니다',
    scale:'도면에서 길이를 아는 두 점을 차례로 누르세요',
    wall:'벽 모서리를 차례로 누르고, 시작점을 다시 누르면 닫힙니다',
    edit:'벽을 끌면 밀리고, 모서리를 끌면 그 점이 움직입니다 · 벽을 그냥 누르면 개구부(문·창)로 바뀝니다',
    detect: state.rooms.length
      ? `공간 ${state.rooms.length}곳 지정됨 — 다른 방 안쪽을 눌러 계속 추가하세요`
      : '배치할 방 안쪽의 빈 곳을 한 번 누르세요 — 벽을 자동으로 잡습니다',
    place:'놓을 위치를 누르세요 — 가까운 벽에 붙습니다',
  }[state.mode];
}
/** 잡아 둔 공간 목록 — 이름을 고치고 지울 수 있어야 한다 */
function renderRooms(){
  const box = $('#rooms');
  if (!box) return;
  if (!state.rooms.length){
    box.innerHTML = '<p class="hint" style="padding:8px 10px">도면을 올리면 공간을 자동으로 잡습니다. 방을 더 잡으려면 도면에서 그 방 안쪽을 누르세요.</p>';
    return;
  }
  /*
   * **경계 수정은 잡은 공간이 있을 때만 꺼낸다.**
   * 자동 인식이 관례를 벗어난 도면에서 틀릴 때 사람이 고치는 마지막 안전망이라 없앨 수
   * 없지만(CLAUDE.md), 공간이 없을 때는 고칠 대상도 없다. 도구막대에 늘 띄워 두는 대신
   * 고칠 것이 생긴 자리에 둔다.
   */
  /*
   * **품고 있는 공간은 그 사실을 적는다**(2026-08-14 실측으로 넣음).
   *
   * 한국 아파트의 거실·주방은 트여 있어 자동 인식이 **트인 전체**와 **그 안의 주방**을
   * 둘 다 잡는다. 그것을 지우지 않는 것은 이미 정한 결정이다 — 겹침만 보고 지웠더니
   * 트인 거실(31㎡) 안의 **진짜 주방(16.8㎡)이 사라졌다**(CLAUDE.md).
   *
   * 그런데 화면은 `거실 30.1㎡` 라고만 적었다. 상담사가 "거실이 30이네요"라고 읽으면
   * 사실과 다르다 — 그 안에 주방 16.3㎡ 가 들어 있다(대방 86A 실측: 공간 합이 전용의
   * **122%** 인데, 초과분이 전부 이 이중 계산이다). 인식을 바꾸면 위 결정을 되돌리게
   * 되므로 **화면이 포함 사실을 밝히는 쪽**으로 고친다.
   *
   * 판정은 **중심이 안에 드는가**로 한다 — 다각형 겹침을 매번 재면 목록을 그릴 때마다
   * 비싸고, 완전히 품긴 경우만 잡으면 되므로 이걸로 충분하다.
   */
  const loopOf = (r) => { for (const pt of (r.parts || [])){ const L = loopOfWalls(pt.walls); if (L && L.length > 2) return L; } return null; };
  const cen = (L) => { let x = 0, y = 0; for (const p of L){ x += p[0]; y += p[1]; } return [x / L.length, y / L.length]; };
  const holds = state.rooms.map((r) => {
    const L = loopOf(r); if (!L) return null;
    const mine = roomArea(r);
    const inside = state.rooms.filter((o) => {
      if (o === r || roomArea(o) >= mine) return false;
      const OL = loopOf(o); if (!OL) return false;
      const c = cen(OL);
      return inLoop(L, c[0], c[1]);
    });
    return inside.length ? inside : null;
  });
  box.innerHTML = state.rooms.map((r,i)=>{
    const inn = holds[i];
    const note = inn
      ? ` <span class="m2in" title="이 공간 넓이에 아래 공간이 함께 들어 있습니다">· ${esc(inn.map((o)=>o.name).join('·'))} 포함</span>`
      : '';
    return `
    <div class="room ${state.roomSel===r.id?'sel':''}" data-room="${r.id}">
      <span class="swatch" style="background:${ROOM_FILL[i%ROOM_FILL.length]}"></span>
      <input type="text" class="rn" data-rename="${r.id}" value="${esc(r.name)}" maxlength="12">
      <span class="m">${(roomArea(r)/1e6).toFixed(1)}㎡${r.parts.length>1?` · ${r.parts.length}조각`:''}${note}</span>
      <button class="del" data-del="${r.id}" title="삭제">✕</button>
    </div>`;}).join('')
    /*
     * **못 잡은 공간을 손으로 더 넣을 수 있어야 한다**(2026-08-12 사용자 지적:
     * *"자동으로 인식이 안 될 경우를 대비해서 도면 영역을 선택하게 되면 선택된 영역을
     * 추가하는 기능이 필요합니다"*).
     *
     * 자동 인식은 도면마다 놓치는 곳이 있다 — 홍천 84B 에서 4곳만 잡고 주방·욕실·현관이
     * 빠졌다. 예전에는 확정 뒤 `detect` 모드가 유지돼 도면을 누르면 계속 추가됐는데,
     * **자동 배치 뒤에는 `idle` 로 두어야 가전을 집을 수 있다**(CLAUDE.md — detect 모드가
     * 살아 있으면 가전을 누르는 순간 그 자리를 새 방으로 인식해 가전을 집을 수가 없다).
     * 그래서 모드를 유지하는 대신 **여기서 다시 켜는 손잡이**를 둔다.
     */
    + `<p class="hint" style="padding:6px 10px 10px">못 잡은 곳이 있으면 <button id="rooms-add" class="ghost" style="padding:4px 8px;font-size:12px">+ 공간 추가</button>를 누르고 그 방 안쪽을 누르세요.`
    + ` 경계가 어긋났으면 <button id="rooms-edit" class="ghost" style="padding:4px 8px;font-size:12px">경계 수정</button>으로 벽을 끌어 고칩니다.</p>`;
  const ed = $('#rooms-edit');
  if (ed) ed.onclick = (e)=>{ e.stopPropagation(); $('#btn-edit').click(); };
  const ad = $('#rooms-add');
  if (ad) ad.onclick = (e)=>{ e.stopPropagation(); $('#btn-detect').click(); };
  box.querySelectorAll('input[data-rename]').forEach((el)=>{
    el.onchange = ()=>{
      const r = roomById(el.dataset.rename);
      if (r) { r.name = (el.value||'').trim() || r.name; renderSide(); draw(); }
    };
    el.onclick = (e)=> e.stopPropagation();
  });
  box.querySelectorAll('button[data-del]').forEach((el)=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.dataset.del;
      state.rooms = state.rooms.filter((r)=>r.id!==id);
      state.items.forEach((it)=>{ if (it.room===id) it.room = null; });
      if (state.roomSel===id) state.roomSel = state.rooms.length ? state.rooms[0].id : null;
      if (!state.rooms.length) state.walls = [];
      syncWalls(); evaluate(); renderSide(); draw();
    };
  });
  box.querySelectorAll('.room').forEach((el)=>{
    el.onclick = ()=>{ state.roomSel = el.dataset.room; renderSide(); draw(); };
  });
}

const COLOR = { ok:'#0F7A5A', warn:'#B45309', bad:'#B42318' };
const row = (k,t) => `<div class="r"><span class="dot" style="background:${COLOR[k]}"></span><span>${esc(t)}</span></div>`;
const esc = (s) => String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 입력 ─────────────────────────────────────────────────────── */
let ptr = null;
/*
 * ── 두 손가락으로 확대·축소·이동 ────────────────────────────────
 * 한 손가락은 **모드가 정한 일**을 한다(방 인식·축척 점 찍기·벽 그리기·가전 끌기).
 * 그래서 도면을 올린 직후처럼 detect 모드일 때는 한 손가락으로 팬을 할 수가 없어
 * 도면이 화면 밖으로 나가면 되돌릴 방법이 없었다(사용자 지적).
 * **두 손가락은 모드와 상관없이 언제나 확대·축소·이동**으로 쓴다 — 지도 앱과 같다.
 */
const ptrs = new Map();
let pinch = null;
let preTouch = null;      // 첫 손가락이 저지른 것을 되돌리기 위한 직전 상태
const TAP_MODES = new Set(['detect', 'scale', 'wall', 'place']);
let tap = null;           // 누르기인지 끌기인지 가리는 중
const TAP_SLOP = 6;       // 이보다 더 움직이면 끌기로 본다(손가락은 가만히 있지 못한다)

/** 눌렀다 뗀 자리에서 모드가 정한 일을 한다 */
function modeTap(sx, sy, wx, wy, mode){
  /*
   * **'벽 직접 고르기'가 켜져 있으면 그것이 먼저다**(2026-08-14).
   * 축척 막대가 떠 있는 동안에도 모드는 `detect` 로 남아 있어, 먼저 보지 않으면
   * 벽을 누르려던 손이 **새 방을 인식해 버린다**(가전을 누르면 가전이 먼저 반응해야
   * 한다고 정한 것과 같은 이유다).
   */
  /*
   * 길이를 묻는 막대가 열려 있으면 **탭을 먼저 후보에게 준다**(2026-08-20).
   * 후보를 눌렀으면 기준 벽이 그것으로 바뀌고(true), 아무 후보도 아니면 false 라
   * 원래 하던 일(방 인식 등)이 그대로 이어진다 — '벽 직접 고르기'는 그대로 동작한다.
   */
  if (typeof state.wallPickFn === 'function' && state.wallPickFn(wx, wy)) return;
  if (mode === 'detect'){
    const k = state.mmPerPx || 1;
    const ix = wx / k, iy = wy / k;
    const r = detectRoomAt(ix, iy);
    if (r.error){ toast(r.error); return; }
    state.draft = r.poly; state.draftEdges = r.edges; state.draftCloseR = r.closeR;
    state.draftAt = [ix, iy]; state.draftStep = { wider: r.wider, narrow: r.narrow, step: r.step, steps: r.steps };
    draw();
    confirmDetected();
    return;
  }
  if (mode === 'scale'){
    state.scalePts.push([sx, sy]);
    if (state.scalePts.length === 2) askScale();
    draw(); return;
  }
  if (mode === 'wall'){
    const first = state.wallPts[0];
    if (first && state.wallPts.length > 2){
      const [fx, fy] = toScreen(first[0], first[1]);
      if (Math.hypot(fx - sx, fy - sy) < 14){ state.wallPts.push([first[0], first[1]]); commitWalls(); return; }
    }
    state.wallPts.push([wx, wy]); draw(); return;
  }
  if (mode === 'place' && state.pending){ placeAt(wx, wy); return; }
}
const clampZoom = (z) => Math.max(0.005, Math.min(8, z));
function pinchStart(){
  const [a, c] = [...ptrs.values()];
  const mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
  const [wx, wy] = toWorld(mx, my);
  pinch = { d0: Math.hypot(a.x - c.x, a.y - c.y) || 1, z0: state.zoom, wx, wy };
  state.drag = null;                     // 끌던 것이 있으면 놓는다
  tap = null;                            // 누르려던 것도 취소 — 두 손가락은 확대·이동이다
  // 첫 손가락이 시작해 버린 것을 되돌린다 — 두 손가락은 확대·이동이지 방 인식이 아니다
  if (preTouch){
    state.draft = preTouch.draft; state.draftEdges = preTouch.draftEdges;
    state.draftStep = preTouch.draftStep; state.draftAt = preTouch.draftAt;
    state.scalePts = preTouch.scalePts; state.wallPts = preTouch.wallPts;
    if (!preTouch.barOn) $('#draftbar').classList.remove('on');
    if (!preTouch.modalOn) $('#modal').classList.remove('on');
    preTouch = null;
    draw();
  }
}
function pinchMove(){
  if (!pinch || ptrs.size < 2) return;
  const [a, c] = [...ptrs.values()];
  const mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
  const d = Math.hypot(a.x - c.x, a.y - c.y) || 1;
  // 처음 두 손가락 가운데에 있던 도면 위 지점이 지금 가운데에 오도록 맞춘다
  state.zoom = clampZoom(pinch.z0 * (d / pinch.d0));
  state.panX = mx - pinch.wx * state.zoom;
  state.panY = my - pinch.wy * state.zoom;
  draw();
}

cv.addEventListener('pointerdown', (e)=>{
  const rc = cv.getBoundingClientRect();
  ptrs.set(e.pointerId, { x: e.clientX - rc.left, y: e.clientY - rc.top });
  if (ptrs.size >= 2){ pinchStart(); return; }
  /*
   * 두 손가락을 완전히 동시에 대는 사람은 없다. 첫 손가락이 먼저 닿아 **방 인식·축척 점 찍기**
   * 같은 일을 이미 저질러 놓은 뒤 두 번째 손가락이 온다. 그대로 두면 확대하려던 것뿐인데
   * 엉뚱한 방이 잡힌다. 되돌릴 수 있게 직전 상태를 떠 둔다.
   */
  preTouch = {
    draft: state.draft, draftEdges: state.draftEdges, draftStep: state.draftStep, draftAt: state.draftAt,
    scalePts: state.scalePts.slice(), wallPts: state.wallPts.slice(),
    barOn: $('#draftbar').classList.contains('on'),
    modalOn: $('#modal').classList.contains('on'),
  };
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const [wx,wy] = toWorld(sx,sy);

  /*
   * **누르기와 끌기를 가른다.**
   * 이 모드들에서 한 손가락(마우스)은 원래 누르는 즉시 일을 했다. 그래서 끌어서 도면을
   * 옮길 방법이 없었다 — PC 는 포인터가 하나뿐이라 아예 옮길 수가 없었다(사용자 지적).
   * 이제 여기서는 자리만 기억해 두고, **뗄 때 움직이지 않았으면** 그때 일을 한다.
   * 끌면 아래 pointermove 가 팬으로 바꾼다.
   */
  /*
   * **가전을 누르면 가전이 반응해야 한다 — 모드와 상관없이.**
   * 방을 확정하면 "다른 방도 잡을 수 있게" detect 모드가 유지되는데, 그 상태에서 가전을
   * 누르면 가전이 아니라 그 자리를 방으로 인식하려 들었다. 화면 맨 위에 그려진 것이
   * 가전인데 손은 그 아래 도면을 만지는 셈이라, **이동도 회전도 안 됐다**(사용자 지적).
   * 빈 곳을 눌렀을 때만 모드가 정한 일을 한다.
   */
  const onItem = state.mode !== 'edit' && state.items.some((it)=>pointIn(corners(it), wx, wy));
  if (!onItem && TAP_MODES.has(state.mode) && !(state.mode==='place' && !state.pending)){
    tap = { sx, sy, wx, wy, mode: state.mode, moved: false,
            px: state.panX, py: state.panY };
    try { cv.setPointerCapture(e.pointerId); } catch {}
    return;
  }
  if (state.mode==='edit'){
    const hit = hitBoundary(wx, wy);
    if (!hit){ toast('벽이나 모서리 위를 눌러주세요'); return; }
    state.editSel = hit;
    state.drag = { edit: hit, lx: wx, ly: wy, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch {}   // 이미 놓인 포인터면 던진다 — 잡기 실패가 조작을 막으면 안 된다
    draw(); return;
  }

  // 선택 / 드래그
  const hit = [...state.items].reverse().find((it)=>pointIn(corners(it), wx, wy));
  if (hit){
    // 손가락 더블탭은 마우스보다 느리다 — 창을 400 → 500ms 로 넓혔다
    if (state.sel===hit.id && ptr && Date.now()-ptr.t < 500){ rotateItem(hit); evaluate(); draw(); return; }
    state.sel = hit.id;
    state.drag = { id:hit.id, ox:wx-hit.bx, oy:wy-hit.by };
    ptr = { t:Date.now() };
    try { cv.setPointerCapture(e.pointerId); } catch {}   // 이미 놓인 포인터면 던진다 — 잡기 실패가 조작을 막으면 안 된다
  } else {
    state.sel = null;
    state.drag = { pan:true, sx, sy, px:state.panX, py:state.panY };
    try { cv.setPointerCapture(e.pointerId); } catch {}   // 이미 놓인 포인터면 던진다 — 잡기 실패가 조작을 막으면 안 된다
  }
  draw();
});
cv.addEventListener('pointermove', (e)=>{
  if (ptrs.has(e.pointerId)){
    const rc = cv.getBoundingClientRect();
    ptrs.set(e.pointerId, { x: e.clientX - rc.left, y: e.clientY - rc.top });
  }
  if (ptrs.size >= 2){ pinchMove(); return; }
  /*
   * 누르기인 줄 알았는데 움직였다 → **도면 이동**으로 바꾼다.
   * 한 손가락(마우스)으로도 옮길 수 있어야 한다.
   */
  if (tap){
    const rc2 = cv.getBoundingClientRect();
    const mx = e.clientX - rc2.left, my = e.clientY - rc2.top;
    if (!tap.moved && Math.hypot(mx - tap.sx, my - tap.sy) < TAP_SLOP) return;
    tap.moved = true;
    state.panX = tap.px + (mx - tap.sx);
    state.panY = tap.py + (my - tap.sy);
    draw();
    return;
  }
  if (!state.drag) return;
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  if (state.drag.pan){
    state.panX = state.drag.px + (sx-state.drag.sx);
    state.panY = state.drag.py + (sy-state.drag.sy);
    draw(); return;
  }
  if (state.drag.edit){
    const [wx,wy] = toWorld(sx,sy);
    const d = state.drag;
    if (Math.hypot(wx-d.lx, wy-d.ly) * state.zoom > 3) d.moved = true;
    if (d.edit.kind==='v') moveVertex(d.edit, wx, wy);
    else moveEdge(d.edit, wx-d.lx, wy-d.ly);
    d.lx = wx; d.ly = wy;
    evaluate(); draw(); return;
  }
  const it = state.items.find((x)=>x.id===state.drag.id); if (!it) return;
  const [wx,wy] = toWorld(sx,sy);
  const prev = { bx:it.bx, by:it.by, a:it.a };

  // 자유 이동이 기본이고, 벽에 아주 가까이 가져갔을 때만 붙는다(예전 600mm는 너무 넓어
  // 방 한가운데에 두려 해도 자꾸 벽으로 끌려갔다).
  const snap = snapToWall(wx-state.drag.ox, wy-state.drag.oy, it);
  if (snap && snap.dist < 180){ it.bx=snap.bx; it.by=snap.by; it.a=snap.a; }
  else { it.bx = wx-state.drag.ox; it.by = wy-state.drag.oy; }

  /*
   * **도면 밖에 있으면 대기, 방 안에 들어오면 배치.**
   * 대기 중에는 아무 판정도 하지 않는다 — 아직 놓은 것이 아니다.
   */
  const [cx,cy] = bodyCenter(it);
  it.staged = state.rooms.length ? !roomAt(cx,cy) : !insideRoom(cx,cy);

  if (!it.staged){
    /*
     * **벽을 넘으면 되돌리지 않고 안쪽으로 밀어 넣는다.**
     * 예전에는 직전 위치로 되돌렸는데, 그러면 벽 근처에서 제품이 손에서 자꾸 빠져
     * "왜 안 움직이지"가 된다. 벽에 설치할 수는 없으므로 **안쪽으로 옮겨 주고 그 사실을
     * 경고로 알린다** — 사용자가 정한 동작이다.
     */
    if (escapesRoom(it)) nudgeInside(it);
    // 다른 가전과 부딪히는 것은 여전히 막는다(겹쳐도 되는 조합은 hitsOther 가 걸러 낸다).
    const clash = hitsOther(it);
    if (clash){ Object.assign(it, prev); toast(clash); }
    /* 다른 방으로 넘어갔으면 소속을 그 방으로 옮긴다 — 이름표는 사실을 따라야 한다 */
    else retagRoom(it);
    /*
     * **손으로 옮긴 사운드바는 더 이상 TV 를 따라가지 않는다**(`posSet`).
     * 설치 높이의 `mhSet` 과 같은 장치다 — 일부러 옮겨 둔 것을 도로 끌어오면 조작이 안 먹는다.
     * 반대로 **TV 를 옮기면** 아직 손대지 않은 사운드바는 따라간다.
     */
    if (mountKind(it) === 'TV아래') it.posSet = true;
    else if (/^TV$/.test(it.cat)) {
      snapWallMounted(it);            // 벽걸이는 반드시 벽을 등진다
      alignUnderTV(null, state.items);
    } else snapWallMounted(it);
  }
  evaluate(); draw();
});
function endPtr(e){
  if (e) ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0){ preTouch = null; }
}

cv.addEventListener('pointerup', (e)=>{
  endPtr(e);

  if (tap){
    const t = tap; tap = null;
    // 끌었으면 이미 도면을 옮긴 것이고, 안 움직였으면 그것이 곧 "누르기"다
    if (!t.moved) modeTap(t.sx, t.sy, t.wx, t.wy, t.mode);

  }
  const d = state.drag;
  if (d && d.edit){
    if (!d.moved && d.edit.kind==='e') toggleEdgeOpen(d.edit);
    renderSide(); evaluate(); draw();
  }

  e.preventDefault();
  const r = cv.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
  const [wx,wy] = toWorld(sx,sy);
  state.zoom = clampZoom(state.zoom * (e.deltaY<0?1.12:1/1.12));
  state.panX = sx - wx*state.zoom; state.panY = sy - wy*state.zoom;
  draw();
}, {passive:false});

function pointIn(poly,x,y){
  let inside=false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i], [xj,yj]=poly[j];
    if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

/** 도면 이미지를 화면에 올린다 (파일 선택·라이브러리 공용) */
function useImage(src, after){
  const img = new Image();
  img.onload = ()=>{
    state.img=img; state.imgW=img.naturalWidth; state.imgH=img.naturalHeight;
    /* 어느 도면인지 기억해 둔다 — plan-names.json 의 키가 이 경로다.
       직접 올린 이미지(data:/blob:)는 색인에 없으므로 비운다. */
    state.planFile = /^(data:|blob:)/.test(String(src)) ? null
      : String(src).replace(/^\.?\//, '').split('?')[0];
    state.mmPerPx=null; state.scaled=false; state.scalePts=[]; state.exclusiveM2=null; state.mask=null; state.baseMask=null; state.sealCache=null; state.cleanCv=null; state.showClean=false;
    state.walls=[]; state.rooms=[]; state.roomSel=null; state.draft=null; state.draftMore=[]; hideDraftBar();
    // 도면 전체가 화면에 들어오도록 배율을 잡는다. 이걸 안 하면 1,000px이 넘는 보통
    // 도면에서 치수선 한쪽 끝이 화면 밖으로 나가 축척을 맞출 수가 없다.
    const r = cv.getBoundingClientRect();
    state.zoom = Math.min(r.width/state.imgW, r.height/state.imgH) * 0.92;
    state.panX = 12; state.panY = 12;
    $('#empty').style.display='none';
    /*
     * **곧장 치수선 두 점 클릭 모드로 보내지 않는다.**
     * 두 점 보정은 정확하지만 벽과 벽을 정밀하게 눌러야 하고, 손가락으로는 몇 px 씩
     * 어긋나 축척이 통째로 틀어진다(사용자 지적). 게다가 분양 도면 중 치수가 인쇄된
     * 것은 8% 뿐이라 대부분은 애초에 찍을 치수선도 없다.
     * 그래서 **방을 자동으로 인식해 가장 긴 벽을 찾아 두고, 사용자는 길이만 입력**한다.
     * 치수선이 있는 도면은 도구막대 "축척 맞추기"로 언제든 두 점 보정을 쓸 수 있다.
     */
    setStep(2); draw();
    if (after) after();
    detectHouseThenScale();   // 집 전체를 먼저 잡고 축척을 한 번만 묻는다(2026-08-15 개편)
  };

}

function askScale(){
  const [[x1,y1],[x2,y2]] = state.scalePts;
  const px = Math.hypot(x2-x1,y2-y1) / state.zoom;   // 화면 px → 도면 이미지 px
  sheet(`<h2>축척 맞추기</h2>
    <p class="hint">방금 누른 두 점 사이의 <b>실제 길이</b>를 입력하세요. 도면에 적힌 치수선을 쓰면 가장 정확합니다.</p>
    <label class="pickers"><span class="hint">실제 길이 (mm)</span>
      <input type="number" id="mm" value="3000" min="1" step="10"></label>
    <p class="src">두 점 사이가 도면 이미지에서 ${px.toFixed(1)}px입니다.</p>
    <div class="modal-actions"><button id="c">취소</button><button class="primary" id="ok">확정</button></div>`,
    ()=>{

        const mm = +$('#mm').value;
        if (!(mm>0)) return;
        state.mmPerPx = mm / px;
        state.scaled = true;
        // 도면이 화면에 알맞게 들어오도록 초기 배율을 잡는다
        const r = cv.getBoundingClientRect();
        state.zoom = Math.min(r.width/(state.imgW*state.mmPerPx), r.height/(state.imgH*state.mmPerPx)) * 0.9;
        state.panX = 20; state.panY = 20;
        state.scalePts=[]; state.wallPts=[]; closeSheet(); setStep(3); draw();
        /*
         * **축척 전에 잡아 둔 방은 버리고 다시 잡는다**(2026-08-15 개편).
         *
         * 도면을 올릴 때 집 전체를 먼저 잡는데(`detectHouseThenScale`) 그 좌표는
         * **이미지 픽셀**이다. 여기서 `scaled = true` 가 되는 순간 월드는 **mm** 가 되므로
         * 그대로 두면 **같은 화면에 자가 둘**이 된다 — CLAUDE.md 가 "도면이 작아진다 /
         * 화면 밖으로 나간다"로 두 번 적어 둔 그 사고다.
         *
         * 게다가 `autoDetectCenter` 는 첫 줄에서 `scaled && rooms.length` 면 그냥

function commitWalls(){
  const p = state.wallPts;
  const segs = [];
  for (let i=0;i<p.length-1;i++) segs.push({x1:p[i][0],y1:p[i][1],x2:p[i+1][0],y2:p[i+1][1]});
  state.wallPts=[];
  // 축척이 아직 확정되지 않았다면 벽 좌표의 mm 값은 아무 근거가 없다. 그대로 두면
  // "2,227mm" 같은 숫자가 화면에 뜨는데, 상담 중에 그걸 실제 치수로 읽으면 사고다.
  // 그래서 방금 그린 벽 중 가장 긴 것의 실제 길이를 받아 전체를 환산한다.
  if (!state.scaled) askWallLength(segs);
  else { addRoom(nextRoomName(), segs); setMode('idle'); setStep(4); evaluate(); draw(); }

/** 그린 벽 중 가장 긴 것의 실제 길이를 받아 전체 좌표를 실제 mm로 환산한다 */

 * 가로 벽면 하나를 통째로 재기 위해, **다각형 순서상 이어지고 같은 y 위에 있는**
 * 가로 조각들을 하나의 런으로 합친다. 벽·개구부를 구분하지 않는다 —
 * 창이 중간에 끼어 있어도 그 벽면의 안목치수는 양 끝 사이이기 때문이다.
 *
 * **반드시 닫힌 고리로 돌아야 한다.** 앞에서 뒤로만 훑으면 배열의 시작과 끝에 걸친 런이
 * 두 토막으로 남는다 — `mergeCollinear` 를 순환으로 고쳤을 때와 똑같은 함정이다.
 * 그래서 런이 끊기는 자리를 먼저 찾아 거기서부터 한 바퀴 돈다.
 *
 * 같은 y 허용오차는 벽 두께 정도다. 이 시점에는 축척이 없어 mm 로 잡을 수 없으므로
 * 방 짧은 변의 2%(최소 2px)로 둔다 — 도면 이미지에서 벽 선 굵기가 대개 3~9px 다.
 */
function longestHRun(segs){
  const n = segs.length;
  if (!n) return null;
  const xs = segs.flatMap((q)=>[q.x1,q.x2]), ys = segs.flatMap((q)=>[q.y1,q.y2]);
  const short = Math.min(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys));
  const tol = Math.max(2, short * 0.02);
  const isH   = (q) => Math.abs(q.y2 - q.y1) <= tol && Math.abs(q.x2 - q.x1) > tol;
  const midY  = (q) => (q.y1 + q.y2) / 2;
  // a 의 끝점이 b 의 시작점이고, 같은 높이의 가로 조각인가
  const joins = (a, b) => isH(a) && isH(b)
    && Math.abs(midY(a) - midY(b)) <= tol
    && Math.hypot(a.x2 - b.x1, a.y2 - b.y1) <= tol;

  let start = -1;
  for (let i = 0; i < n; i++){
    if (!joins(segs[(i - 1 + n) % n], segs[i])) { start = i; break; }
  }
  if (start < 0) return null;      // 전부 이어지는 경우 — 닫힌 다각형에서는 생기지 않는다

  let best = null, cur = null;
  for (let k = 0; k < n; k++){
    const i = (start + k) % n, q = segs[i];
    if (!isH(q)) { cur = null; continue; }
    if (cur && joins(segs[(i - 1 + n) % n], q)) { cur.x2 = q.x2; cur.y2 = q.y2; }
    else cur = { x1: q.x1, y1: q.y1, x2: q.x2, y2: q.y2 };
    const L = Math.abs(cur.x2 - cur.x1);
    if (!best || L > best.len) best = { len: L, seg: { x1: cur.x1, y1: cur.y1, x2: cur.x2, y2: cur.y2 } };
  }
  return best;
}

/*
 * **잴 수 있는 벽면 후보를 전부 모은다** — 가로와 세로 둘 다.
 *
 * 2026-08-12 사용자 요청: *"이미지에서 자동으로 가로 또는 세로 선 부각(해당 치수를 모르면
 * 다음 버튼 눌러서 다른 경우의 수 표기)"*. 자동으로 고른 벽의 실제 길이를 상담사가 모를 수
 * 있는데, 예전에는 그 자리에서 할 수 있는 일이 '다른 방'으로 넘기는 것뿐이었다.
 * 같은 방 안에서도 **아는 벽**이 따로 있을 수 있다(가로는 몰라도 세로는 알거나 그 반대).
 *
 * 합치는 규칙은 `longestHRun` 과 같다 — 다각형 순서상 이어지고 같은 축에 있는 조각을
 * 하나로 잇는다. **조각 하나를 재면 창 하나를 재게 되기 때문이다**(그 함수 주석 참조).
 * 여기서는 가장 긴 것만이 아니라 **모든 런**을 길이 순으로 돌려준다.
 */
function wallRuns(segs){
  const n = segs.length;
  if (!n) return [];
  const xs = segs.flatMap((q)=>[q.x1,q.x2]), ys = segs.flatMap((q)=>[q.y1,q.y2]);
  const short = Math.min(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys));
  const tol = Math.max(2, short * 0.02);
  const out = [];
  for (const dir of ['h', 'v']){
    const flat = (q) => dir === 'h' ? Math.abs(q.y2 - q.y1) : Math.abs(q.x2 - q.x1);
    const along = (q) => dir === 'h' ? Math.abs(q.x2 - q.x1) : Math.abs(q.y2 - q.y1);
    const mid   = (q) => dir === 'h' ? (q.y1 + q.y2) / 2 : (q.x1 + q.x2) / 2;
    const ok    = (q) => flat(q) <= tol && along(q) > tol;
    const joins = (a, b) => ok(a) && ok(b) && Math.abs(mid(a) - mid(b)) <= tol
      && Math.hypot(a.x2 - b.x1, a.y2 - b.y1) <= tol;
    let start = -1;
    for (let i = 0; i < n; i++) if (!joins(segs[(i - 1 + n) % n], segs[i])) { start = i; break; }
    if (start < 0) continue;
    let cur = null;
    for (let k = 0; k < n; k++){
      const i = (start + k) % n, q = segs[i];
      if (!ok(q)) { cur = null; continue; }
      if (cur && joins(segs[(i - 1 + n) % n], q)) { cur.x2 = q.x2; cur.y2 = q.y2; }
      else { cur = { x1: q.x1, y1: q.y1, x2: q.x2, y2: q.y2 }; out.push({ dir, seg: cur }); }
    }
  }
  return out
    .map((r) => ({ ...r, len: Math.hypot(r.seg.x2 - r.seg.x1, r.seg.y2 - r.seg.y1) }))
    /* 짧은 토막은 재 봐야 축척이 흔들린다 — 가장 긴 것의 35% 미만은 후보에서 뺀다 */
    .filter((r, _, a) => r.len >= Math.max(...a.map((x) => x.len)) * 0.35)
    .sort((a, b) => b.len - a.len);
}

/**
 * **누른 자리의 벽면 전체**를 돌려준다 — 축척을 사용자가 직접 고른 벽으로 재기 위한 것.
 *
 * `classifyEdges` 가 한 벽면을 [벽토막 | 개구부 | 벽토막] 으로 쪼개 놓으므로, 누른
 * **조각 하나만 재면 창 하나를 재게 된다** — 실제로 75㎡ 도면에서 침실1 아래 창 구간만
 * 잡혔고 거기에 3,600 을 넣어 축척이 통째로 틀어졌다(CLAUDE.md). 그래서 누른 조각이
 * 속한 **런 전체**를 잇는다. 병합 규칙은 `wallRuns`·`longestHRun` 과 같다.
 *
 * **닫힌 고리로 돌아야 한다.** 배열 앞에서 뒤로만 훑으면 시작·끝에 걸친 런이 두 토막으로
 * 남는다 — `mergeCollinear` 를 순환으로 고쳤을 때와 같은 함정이다.
 *
 * @returns {{dir:'h'|'v', seg:{x1,y1,x2,y2}, len:number}|null}
 */
function runAt(segs, wx, wy, tolPx){
  const n = segs && segs.length;
  if (!n) return null;
  const xs = segs.flatMap((q)=>[q.x1,q.x2]), ys = segs.flatMap((q)=>[q.y1,q.y2]);
  const short = Math.min(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys));
  const tol = Math.max(2, short * 0.02);
  /* 누른 자리에서 가장 가까운 조각 */
  let hit = -1, best = Infinity;
  segs.forEach((q, i) => { const d = nearestOnSeg(wx, wy, q).dist; if (d < best) { best = d; hit = i; } });
  if (hit < 0 || best > (tolPx || tol * 4)) return null;
  const q0 = segs[hit];
  const dir = Math.abs(q0.y2 - q0.y1) <= tol && Math.abs(q0.x2 - q0.x1) > tol ? 'h'
            : Math.abs(q0.x2 - q0.x1) <= tol && Math.abs(q0.y2 - q0.y1) > tol ? 'v' : null;
  if (!dir) return null;                                  // 대각선 조각은 이어 붙일 규칙이 없다
  const flat  = (q) => dir === 'h' ? Math.abs(q.y2 - q.y1) : Math.abs(q.x2 - q.x1);
  const along = (q) => dir === 'h' ? Math.abs(q.x2 - q.x1) : Math.abs(q.y2 - q.y1);
  const mid   = (q) => dir === 'h' ? (q.y1 + q.y2) / 2 : (q.x1 + q.x2) / 2;
  const ok    = (q) => flat(q) <= tol && along(q) > tol;
  const joins = (a, b) => ok(a) && ok(b) && Math.abs(mid(a) - mid(b)) <= tol
    && Math.hypot(a.x2 - b.x1, a.y2 - b.y1) <= tol;
  if (!ok(q0)) return null;
  /* 뒤로 · 앞으로 걸어 나간다. 한 바퀴를 넘지 않도록 n 번으로 막는다 */
  let s = hit, e = hit;
  for (let k = 0; k < n; k++){ const p = (s - 1 + n) % n; if (p === e || !joins(segs[p], segs[s])) break; s = p; }
  for (let k = 0; k < n; k++){ const x = (e + 1) % n; if (x === s || !joins(segs[e], segs[x])) break; e = x; }
  const a = segs[s], b = segs[e];
  const seg = { x1: a.x1, y1: a.y1, x2: b.x2, y2: b.y2 };
  return { dir, seg, len: Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1) };
}

/**
 * 방 이름에 맞는 **가로 치수 예시**. 상담사가 감을 못 잡을 때 기준이 되는 값이라
 * 방과 어긋나면 축척이 통째로 틀어진다 — 아는 방만 적고 나머지는 비운다.
 * 값은 국내 아파트 전용 59~85㎡ 의 통상 범위다(확정 수치가 아니라 "보통 이 정도"의 안내).
 */
function wallHint(name){
  const n = String(name || '');
  if (/거실/.test(n))            return " 거실 가로는 보통 3,600~5,200mm.";
  if (/안방|침실1/.test(n))      return " 침실1(안방) 가로는 보통 3,000~3,600mm.";
  if (/침실/.test(n))            return " 침실 가로는 보통 2,700~3,300mm.";
  if (/주방|주방·식당|식당/.test(n)) return " 주방 가로는 보통 2,400~3,600mm.";
  return "";                     // 모르는 방이면 예시를 만들지 않는다
}

function askWallLength(segs, opts){
  /*
   * 기준 벽은 **가로 벽면 전체**다(사용자 지정).
   * 안방 치수는 상담에서 가로로 이야기하고, 세로 벽을 재면 고객이 아는 숫자와 어긋난다.
   *
   * **조각 하나를 재면 안 된다.** `classifyEdges` 가 한 벽면을
   * [벽토막 | 개구부 | 벽토막] 으로 쪼개 놓기 때문에, "가장 긴 가로 조각"을 고르면
   * 창 하나를 재게 된다. 실제로 75㎡ 도면에서 침실1 아래 창 구간만 잡혔고,
   * 거기에 3,600을 넣으면 **도면 전체 축척이 통째로 틀어진다**(사용자 지적).
   * 벽면의 안목치수는 창·문이 끼어 있어도 왼쪽 끝에서 오른쪽 끝까지다.
   */
  /*
   * **후보를 여럿 세워 두고 `다음`으로 넘긴다**(2026-08-12 사용자 요청).
   * 기본은 여전히 **가로 벽면 전체**다 — 안방 치수는 상담에서 가로로 이야기하고,
   * 세로를 재면 고객이 아는 숫자와 어긋난다. 다만 그 가로 길이를 모를 수 있으므로
   * 같은 방의 다른 벽면(세로 포함)으로 넘겨 **아는 벽을 고를 수 있게** 한다.
   */
  const runSeg = longestHRun(segs);
  const runs = wallRuns(segs);
  const cands = [];
  if (runSeg) cands.push({ dir: 'h', seg: runSeg.seg, len: runSeg.len });
  for (const r of runs){
    if (cands.some((c) => Math.abs(c.len - r.len) < 1
      && Math.abs(c.seg.x1 - r.seg.x1) < 1 && Math.abs(c.seg.y1 - r.seg.y1) < 1)) continue;
    cands.push(r);
  }
  if (!cands.length){
    // 가로·세로 벽면이 하나도 없는 도면(대각선 위주)에서만 전체 최장 벽으로 물러선다
    let li = -1, m = 0;
    segs.forEach((q,i)=>{ const L = Math.hypot(q.x2-q.x1, q.y2-q.y1); if (L > m){ m = L; li = i; } });
    if (li < 0) return;
    cands.push({ dir: 'h', seg: segs[li], len: m });
  }
  /* 집 전체에서 모은 후보는 **긴 벽부터** 세운다(위 askHouseScale 주석 참조) */
  if (opts && opts.sortByLen) cands.sort((a, b) => b.len - a.len);
  let ci = 0;
  let lmax = cands[0].len, mseg = cands[0].seg;
  /*
   * **어느 벽을 재는지 도면 위에 표시한다.**
   * 가장 긴 벽을 자동으로 고르므로 사용자는 클릭할 필요가 없지만, 어느 벽인지 모르면
   * 엉뚱한 길이를 넣게 되고 그러면 축척이 통째로 틀어진다. 화면에 보이면 눈으로 검산된다.
   */
  state.measureSeg = mseg;
  // 이름 붙이기 모달이 열린 채로 올 수 있다. 모달을 닫아야 도면이 보인다 —
  // 예전에는 sheet() 가 내용을 갈아 끼워 저절로 닫혔지만 이제는 막대를 쓰므로 직접 닫는다.
  closeSheet();
  draw();
  /*
   * **모달로 묻지 않는다.** 정작 봐야 할 것은 주황으로 표시된 그 벽인데 모달이 그 위를
   * 덮는다. 초안 조절을 막대로 옮긴 것과 같은 이유다 — 화면이 가려지면 무엇을 재는지
   * 모르는 채 숫자를 넣게 되고, 축척이 틀어지면 이후 판정이 전부 거짓이 된다.
   */
  const bar = $("#draftbar");
  /*
   * 문구는 **상담사가 고객에게 그대로 물을 수 있는 말**이어야 한다.
   * "안방 가로가 몇 mm 입니까?" — 방 이름과 방향이 다 들어 있어 그대로 읽으면 된다.
   * 방 이름은 앞 단계에서 사용자가 붙인 것을 쓴다. "안방"으로 못 박으면
   * `다른 방 ▸`로 다른 방을 골랐을 때 화면이 거짓말을 한다.
   */
  const rn = (opts && opts.name) || (roomById(state.roomSel)||{}).name || '침실1';
  /*
   * 막대를 **다시 그릴 수 있게** 함수로 뺐다 — `다음`으로 후보를 넘기면 문구(가로/세로)와
   * 주황 표시가 함께 바뀌어야 하기 때문이다. 숫자와 그림이 따로 놀면 축척이 틀어진다.
   */
  /*
   * **부각한 벽이 세대 전체 폭이면 방 이름으로 묻지 않는다**(2026-08-14 실측으로 넣음).
   *
   * 도면 150장을 훑어 보니 **6장에서 기준 벽이 건물 폭 전체**였다. 벽을 그렇게 고른 것
   * 자체는 사고가 아니다 — 사용자가 12,000 이라고 답하면 축척은 정확하다. **사고는 그
   * 벽을 두고 "침실1 가로는 보통 3,000~3,600mm" 라고 안내하는 것이다.** 안내대로 3,300 을
   * 넣으면 축척이 3.6배 틀어지고 이후 "들어갑니다"가 전부 거짓이 된다.
   *
   * 그래서 인식을 더 쥐어짜는 대신 **화면이 사실대로 말하게** 한다 — 방 이름과 예시 치수를
   * 빼고 "이 벽"으로 묻고, 세대 전체 폭으로 보인다고 알린다. 사용자는 그 길이를 넣거나
   * `다음 ▸` 으로 다른 벽을 고르면 된다.
   */
  const bldgW = (() => {
    const bx = (state.baseInfo || {}).bbox, S = (state.baseMask || {}).S || 1;
    return bx ? Math.max(1, (bx.x1 - bx.x0) / S) : (state.imgW || 1);
  })();
  /*
   * **세로 벽도 본다**(2026-08-15 개편). 예전에는 가로만 후보라 `c.dir !== 'v'` 로
   * 걸러도 됐는데, 지금은 집 전체에서 후보를 모아 세로 벽도 부각된다. 그대로 두면
   * **세대 깊이 전체를 잡아 놓고 아무 말도 안 하는** 도면이 생긴다(실측 5장).
   * 벽이 놓인 축의 건물 크기와 견준다.
   */
  const bldgH = (() => {
    const bx = (state.baseInfo || {}).bbox, S = (state.baseMask || {}).S || 1;
    return bx ? Math.max(1, (bx.y1 - bx.y0) / S) : (state.imgH || 1);
  })();
  const spans = (c) => c.len >= (c.dir === 'v' ? bldgH : bldgW) * 0.8;

  const paint = () => {
    const c = cands[ci];
    lmax = c.len; mseg = c.seg; state.measureSeg = mseg;
    /* 고를 수 있는 벽을 전부 그리게 넘긴다 — 너무 많으면 도면이 번호로 덮이므로 12개까지 */
    state.measureCands = cands.slice(0, 12).map((x) => x.seg);
    const way = c.dir === 'v' ? '세로' : '가로';
    const wide = spans(c);
    /* 사용자가 직접 고른 벽은 **어느 방 벽인지 우리가 모른다** — 방 이름으로 묻지 않고
       예시 치수도 붙이지 않는다. 미리 채운 값도 지운다(그대로 확정을 눌러 버린다).
       **집 전체에서 모은 후보도 마찬가지다**(2026-08-15). 후보가 한 방에 갇혀 있지
       않으므로 어느 방 벽인지 단정할 수 없다 — 실제로 첫 후보가 현관 벽인데 화면이
       "현관 가로가 몇 mm 입니까?" 하고 3,600 을 미리 채워, 그대로 확정하면 축척이
       3배 넘게 틀어졌다(프로덕션 시연에서 확인). */
    const neutral = wide || !!c.picked || !!(opts && opts.house);
    bar.innerHTML = "<div class='dl'>"
      + "<span class='area'>" + (neutral ? "이 벽의 길이가 몇 mm 입니까?" : esc(rn) + " " + way + "가 몇 mm 입니까?") + "</span>"
      + (cands.length > 1
        ? "<span class='grow'></span><span class='meta' style='margin-right:6px'>도면에서 다른 주황 벽을 눌러도 됩니다</span>"
          + "<button id='wl-next'>다음 ▸ <span class='n'>"
          + (ci + 1) + "/" + cands.length + "</span></button>" : "")
      + "</div>"
      + "<div class='dl'>"
      /* 세대 폭이면 **미리 채우지 않는다** — 3,600 이 들어 있으면 그냥 확정을 누른다 */
      + "<input type='number' id='wl' value='" + (neutral ? '' : (c.dir === 'v' ? 3000 : 3600)) + "' min='100' step='10' "
      + "style='width:120px;padding:6px 8px;font:600 15px ui-monospace,monospace'>"
      + "<span class='meta'>mm</span>"
      + "<span class='grow'></span>"
      /*
       * **치수선 두 점 보정은 여기서만 꺼낸다.**
       * 더 정확하지만 분양 도면 중 치수가 인쇄된 것은 8%뿐이고, 손가락으로는 몇 px 씩
       * 어긋나 축척이 통째로 틀어진다(CLAUDE.md). 그래서 도구막대에 늘 띄워 두지 않고
       * **치수를 실제로 보고 있는 이 순간**에만 내민다.
       */
      /*
       * **내가 아는 벽을 직접 고른다**(2026-08-14 사용자 요청).
       * 자동이 고른 벽의 실제 길이를 모를 수 있다 — 그때 `다음 ▸` 으로 후보를 넘기는
       * 길만 있었는데, 상담사는 대개 **어느 벽 길이를 아는지 이미 알고 있다.**
       * 누르면 도면에서 그 벽면을 탭해 고른다(누른 조각이 속한 **런 전체**를 잰다).
       */
      + "<button id='wl-pick'" + (state.wallPick ? " class='on'" : "") + ">벽 직접 고르기</button>"
      + (state.img ? "<button id='wl-two' class='ghost'>치수선 두 점으로</button>" : "")
      + "<button id='wl-again'>" + (state.img ? "다시 인식" : "다시 그리기") + "</button>"
      + "<button class='primary' id='wl-ok'>확정</button></div>"
      /*
       * 예시 치수는 **지금 잡은 방에 맞춰** 적는다. 예전에는 "침실1(안방) 가로는 보통
       * 3,000~3,600mm" 로 고정돼 있어, 거실을 잡았는데 "거실 가로가 몇 mm 입니까?" 밑에
       * 침실 예시가 붙었다 — 상담사가 그 숫자를 그대로 넣으면 축척이 통째로 틀어진다.
       * 방 이름을 모르면 예시를 아예 적지 않는다(없는 근거를 만들지 않는다).
       */
      + "<div class='dl'><span class='prev'><b style='color:#B45309'>주황색으로 표시된 벽</b>입니다 — "
      + "넣으시면 <b>도면 전체</b>가 그 비율로 맞춰집니다."
      + (wide
        ? (" 이 벽은 <b>세대 전체 폭</b>" + (c.dir === 'v' ? "(세로)" : "")
           + "으로 보입니다 — 방 하나의 치수를 넣지 마세요.")
        : c.picked ? " <b>직접 고르신 벽</b>입니다 — 그 벽의 실제 길이를 넣어 주세요."
        : (c.dir === 'v' ? '' : wallHint(rn)))
      + (cands.length > 1 ? " 이 벽 길이를 모르시면 <b>다음</b>으로 다른 벽을 고르세요." : "")
      + "</span></div>";
    draw();
    const nx = $('#wl-next');
    if (nx) nx.onclick = ()=>{
      /*
       * 이 방의 벽을 한 바퀴 다 돌았으면 **다음 방 후보로 넘어간다.**
       * 자동 인식이 도면 시트 전체를 방으로 잡는 일이 있어(실측 2/27장), 그 안의 벽은
       * 전부 시트 가장자리라 아무리 넘겨도 잴 것이 없다. 상담사가 아는 벽에 닿으려면
       * 방 자체를 바꿀 수 있어야 한다 — 초안 막대의 '다른 방'과 같은 손잡이다.
       */
      if (ci + 1 < cands.length){ ci++; paint(); wire(); return; }
      const cs = state.roomCands || [];
      if (cs.length < 2){ ci = 0; paint(); wire(); return; }
      state.candIdx = ((state.candIdx || 0) + 1) % cs.length;
      const c = cs[state.candIdx];
      let res; try { res = detectRoomAt(c.at[0], c.at[1]); } catch (_) { res = { error: '인식 실패' }; }
      if (res.error){ toast(res.error); ci = 0; paint(); wire(); return; }
      state.draft = res.poly; state.draftEdges = res.edges; state.draftCloseR = res.closeR;
      state.draftAt = c.at;
      bar.classList.remove('on');
      /* 새 방의 벽 목록으로 이 막대를 다시 연다 */
      askWallLength(res.edges && res.edges.length
        ? res.edges.map((e) => ({ x1:e.x1, y1:e.y1, x2:e.x2, y2:e.y2, open:!!e.open }))
        : res.poly.map((p, i, a) => { const q = a[(i+1)%a.length]; return { x1:p[0], y1:p[1], x2:q[0], y2:q[1] }; }),
        opts);
    };
    const w = $('#wl'); w.focus(); w.select();
  };
  paint();
  if (!bar.classList.contains('on')) pushBack();   // 휴대폰 뒤로가기가 앱이 아니라 이 막대를 닫도록
  bar.classList.add("on");
  const wl = () => $("#wl");
  const commit = ()=>{
    const mm = +wl().value;
    if (!(mm>0)) { toast("실제 길이를 mm 로 넣어주세요"); return; }
    const k = mm / lmax;
    for (const s of segs){ s.x1*=k; s.y1*=k; s.x2*=k; s.y2*=k; }
    /*
     * **도면 이미지도 같은 자로 재야 한다.**
     * 벽 좌표만 mm 로 환산하고 `mmPerPx` 를 null 로 두면, 벽은 mm 축에 이미지는
     * "이미지 픽셀 = 월드 단위" 축에 그려져 **같은 화면에 자가 둘**이 된다.
     * 실제로 방이 도면보다 4.27배 크게 나와 도면 위에 제품을 올릴 수가 없었다
     * (사용자 지적: "거실 공간만 별도로 크게 나오고 이미지는 작게 줄어듭니다").
     * 벽이 이미지 픽셀 좌표에서 왔으므로 그 환산 계수가 곧 mm/px 다.
     */
    if (state.img) state.mmPerPx = k;
    state.scaled = true;
    const o = opts || {};
    /*
     * **집 전체를 먼저 잡은 경우**(2026-08-15 개편) — 방은 이미 등록돼 있고,
     * 그 좌표는 **이미지 픽셀**이다. 좌표를 곱해 mm 로 바꾸는 대신 **버리고 다시 잡는다**:
     * 인식 문턱(띠 길이·두께·조각 크기·닫기 반경)이 전부 mm 기준이라 축척을 알고 나면
     * 결과 자체가 달라지기 때문이다(CLAUDE.md 실측 — 축척 전후로 공간 수가 3곳 vs 11곳).
     * 환산은 옛 문턱으로 잡은 모양을 그대로 굳히는 셈이라 정확하지 않다.
     */
    if (o.house) {
      state.rooms = []; state.walls = []; state.roomSel = null;
    } else {
      const room = o.appendTo ? roomById(o.appendTo) : null;
      if (room){ room.parts.push({ walls: segs }); state.roomSel = room.id; syncWalls(); }
      else addRoom(o.name || nextRoomName(), segs);
    }
    state.zoom /= k; state.panX = 24; state.panY = 24;
    state.measureSeg = null;
    state.wallPick = false; state.wallPickFn = null; state.wallSegs = null; state.measureCands = null;
    bar.classList.remove("on");
    /*
     * **축척이 잡히면 곧바로 도면 전체를 잡는다**(2026-08-12 사용자 지적).
     *
     * 축척은 방 하나의 가로 벽만 있으면 나오지만, 배치는 집 전체가 있어야 한다.
     * 예전에는 여기서 **그 한 방만 등록하고 끝나서**, 사용자가 `벽 자동 인식`을 따로
     * 누르지 않으면 3D 에도 그 방 하나만 섰다 — *"도면의 한 부분만 3D로 만드는 게
     * 아닙니다"*. 고객은 가전을 어디에 놓을지 정해진 상태가 아니므로 집 전체가 서야 한다.
     *
     * 이미 등록한 그 방은 `detectAllRooms` 가 알아보고 건너뛴다(sameSpace).
     * 도면 없이 벽을 직접 그린 경우에는 인식할 이미지가 없으므로 그대로 둔다.
     */
    let more = 0;
    if (state.img) { try { more = detectAllRooms() || 0; } catch (_) { more = 0; } }
    /* 도면에 인쇄된 방 이름이 있으면 그걸로 부른다(없으면 순서대로 붙인 이름 그대로) */
    try { nameRoomsFromPlan(); } catch (_) {}
    /*
     * **축척을 잰 방이 덩어리면 버린다.**
     *
     * 합쳐진 덩어리를 걸러내는 45% 규칙은 `detectAllRooms` **안에만** 있어서, 축척 단계에서
     * 먼저 등록되는 이 방은 그 검사를 지나가지 않았다. 프로덕션 3회 시험에서 전부 걸렸다 —
     * 디에트르 84 에서 '침실1' 이 **96.1㎡** 로 잡혀 공간 5곳 합이 전용 84㎡ 의 **182%** 가 됐다.
     * 축척은 그 벽 길이만 있으면 나오므로 값 자체는 맞지만(색인값과 0.0% 차이), **공간으로
     * 남으면 상담에서 "침실1 96㎡"가 그대로 읽힌다.**
     *
     * 자동 인식이 방을 제대로 찾아낸 경우에만 버린다 — 못 찾았으면 이 방이라도 있어야 한다.
     * 판정은 detectAllRooms 와 같은 두 가지다: 전체의 45% 초과 · 다른 방 2곳 이상을 품음.
     */
    /*
     * **집 전체를 먼저 잡은 경로에서는 이 정리를 하지 않는다**(2026-08-15 개편).
     * 아래 로직은 "축척을 재느라 먼저 등록된 그 방"이 `state.rooms[0]` 이라는 전제 위에
     * 서 있다. 새 경로는 축척을 확정하며 방을 통째로 버리고 다시 잡으므로 `rooms[0]` 은
     * 그냥 첫 번째로 잡힌 방이다 — 그대로 두면 **멀쩡한 방을 지운다.**
     */
    if (!o.house && more && state.rooms.length > 1){
      const mine = state.rooms[0];
      const area = (r) => roomArea(r);
      const total = state.rooms.reduce((s, r) => s + area(r), 0);
      const loop = loopOfWalls(mine.parts[0].walls);
      const holds = loop ? state.rooms.filter((r) => {
        if (r === mine) return false;
        const c = loopOfWalls(r.parts[0].walls);
        if (!c) return false;
        const cx = c.reduce((s, p) => s + p[0], 0) / c.length;
        const cy = c.reduce((s, p) => s + p[1], 0) / c.length;
        return inLoop(loop, cx, cy);
      }).length : 0;
      /*
       * **넓이 비율은 공간이 넉넉히 잡혔을 때만 본다.**
       * 공간이 둘뿐이면 어느 쪽이든 45% 를 넘어 늘 걸린다 — 실제로 원주역 우미린 T1 에서
       * 멀쩡한 방(8.5㎡)이 지워져 공간이 1곳만 남았다. 포함 관계(다른 방 2곳 이상을 품음)는
       * 개수와 무관하게 성립하므로 그대로 둔다.
       */
      if ((state.rooms.length >= 4 && area(mine) > total * 0.45) || holds >= 2){
        state.rooms = state.rooms.filter((r) => r !== mine);
        state.items.forEach((it) => { if (it.room === mine.id) it.room = null; });
        if (state.roomSel === mine.id) state.roomSel = state.rooms[0].id;
        syncWalls();
      }
    }
    setMode("idle"); setStep(4); evaluate(); draw();
    toast(`도면 비율을 맞췄습니다 — 이 벽 ${mm.toLocaleString()}mm 기준`
      + (more ? ` · 도면 전체에서 공간 ${state.rooms.length}곳을 잡았습니다` : ''));
  };
  /*
   * **도면에서 잰 벽을 직접 고른다**(2026-08-14 사용자 요청).
   *
   * 자동이 고른 벽의 실제 길이를 상담사가 모를 수 있다. 예전에는 그때 `다음 ▸` 으로
   * 후보를 넘기는 길뿐이었는데, 상담사는 대개 **어느 벽 길이를 아는지 이미 알고 있다** —
   * 그 벽을 바로 누르게 하는 편이 빠르다.
   *
   * 누른 조각 하나가 아니라 **그 조각이 속한 벽면 전체**를 잰다(`runAt`). 조각만 재면
   * 창 하나를 재게 되고 축척이 통째로 틀어진다(CLAUDE.md 에 적힌 실제 사고).
   */
  /** 점과 선분 사이 거리 — 후보를 눌렀는지 판정하는 데만 쓴다 */
  const distSeg = (px, py, q) => {
    const dx = q.x2 - q.x1, dy = q.y2 - q.y1;
    const L = dx*dx + dy*dy;
    let t = L ? ((px - q.x1) * dx + (py - q.y1) * dy) / L : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (q.x1 + t*dx), py - (q.y1 + t*dy));
  };
  const pickWall = (wx, wy) => {
    /*
     * **화면에 보이는 후보를 눌렀으면 그것으로 옮긴다**(2026-08-20).
     * 후보를 한꺼번에 그려 주므로, 상담사는 자기가 아는 벽을 바로 누르면 된다 —
     * `다음 ▸` 으로 하나씩 넘겨 볼 필요가 없다. 허용 오차는 **화면에서 14px**
     * (확대해서 보고 있으면 그만큼 촘촘하게 잡힌다).
     */
    const tol = 14 / (state.zoom || 1);
    let best = -1, bestD = tol;
    cands.slice(0, 12).forEach((c, i) => {
      const d = distSeg(wx, wy, c.seg);
      if (d < bestD) { bestD = d; best = i; }
    });
    if (best >= 0 && best !== ci) { ci = best; paint(); wire(); return true; }
    if (best >= 0) return true;                       // 지금 것을 다시 누른 것 — 아무 일도 안 한다
    if (!state.wallPick) return false;                // 후보가 아닌 곳은 '벽 직접 고르기'일 때만 잰다
    const r = runAt(segs, wx, wy);
    if (!r){ toast('그 자리에서 벽면을 찾지 못했습니다 — 벽 선 위를 눌러 주세요'); return false; }
    /* 고른 벽을 후보 맨 뒤에 넣고 그것을 가리킨다 — `다음 ▸` 으로 되돌아갈 수 있다 */
    cands.push({ ...r, picked: true }); ci = cands.length - 1;
    state.wallPick = false;
    paint(); wire();
    toast(`이 벽으로 잽니다 — 길이를 넣어 주세요`);
    return true;
  };
  /*
   * 탭 처리(modeTap)가 이 함수를 찾아 부를 수 있게 열어 둔다. 막대를 닫을 때 지운다.
   * `wallSegs` 는 지금 재고 있는 벽 목록 — 검사가 "어느 조각을 눌렀을 때 벽면 전체가
   * 잡히는가"를 사람이 누른 것과 같은 길로 재현하는 데 쓴다(`draftEdges` 는 이 단계에서
   * 이미 비워져 있다).
   */
  state.wallPickFn = pickWall;
  state.wallSegs = segs;

  /* 막대를 다시 그리면 버튼도 새로 생기므로 손잡이 연결을 한 함수로 묶어 둔다 */
  function wire(){
    $("#wl-ok").onclick = commit;
    wl().onkeydown = (e)=>{ if (e.key === "Enter"){ e.preventDefault(); commit(); } };
    $("#wl-again").onclick = again;
    const two = $("#wl-two");
    if (two) two.onclick = ()=>{ bar.classList.remove("on"); state.measureSeg = null; state.wallPick = false; state.wallPickFn = null; state.wallSegs = null; state.measureCands = null; $("#btn-scale").click(); };
    const pk = $("#wl-pick");
    if (pk) pk.onclick = ()=>{
      state.wallPick = !state.wallPick;
      paint(); wire();
      if (state.wallPick) toast('도면에서 길이를 아는 벽을 눌러 주세요');
    };
  }
  const again = ()=>{
    state.measureSeg = null; state.wallPick = false; state.wallPickFn = null; state.wallSegs = null; state.measureCands = null; bar.classList.remove("on");
    // 도면이 있으면 다시 그리라고 할 게 아니라 다시 인식시키는 것이 맞다
    if (state.img) startDetect(); else { setMode("wall"); draw(); }
  };
  wire();
}

/* ── 단지 평면 라이브러리 ────────────────────────────────────────────
   매장에서 고객 단지를 고르면 업로드·축척·인식을 건너뛰고 바로 배치를 시작한다.

   **도면 이미지는 저장하지 않는다.** 분양 도면은 저작권이 있어 저장소에 둘 수 없다.
   대신 확인이 끝난 방 경계(mm 좌표)만 남긴다 — 파생 측정값이라 담을 수 있고, 벽이 이미
   월드 좌표라 이미지 없이 그대로 복원된다. 단지 하나당 몇 KB 밖에 되지 않는다.

   두 곳에서 읽는다:
     · public/plan-library.json  — 저장소에 커밋된 공용 목록
     · localStorage              — 이 기기에서 등록한 것 (내보내기로 공용 목록에 합칠 수 있다)
──────────────────────────────────────────────────────────────── */
const LIB_KEY = 'place_library_v1';
let libSeed = null;

async function libraryAll(){
  if (!libSeed) {
    try {
      const r = await fetch('plan-library.json');
      const j = await r.json();
      libSeed = Array.isArray(j.entries) ? j.entries : [];
    } catch { libSeed = []; }
  }
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch { local = []; }
  return [...libSeed.map((e) => ({ ...e, _src: '공용' })), ...local.map((e) => ({ ...e, _src: '이 기기' }))];
}

/*
 * ── 상담 한 번이 곧 도면 한 장이 되게 (2026-08-28 사장님: *"도면데이터도 부족하며"*) ──
 *
 * 웹 수집은 소진됐고(CLAUDE.md 에 경로별로 왜 막혔는지 전수 기록) 공용 목록을 늘리는
 * 길은 **매장에서 잡은 벽선을 모으는 것**뿐이다. 그런데 새는 곳이 있었다 —
 * 상담사가 축척을 맞추고 방을 다 잡아도 **'단지 저장'을 따로 눌러야** 남았다.
 * 안 누르면 그 수고가 통째로 사라지고, 다음에 같은 도면을 열면 처음부터 다시 한다.
 *
 * **단지 목록에서 연 도면은 이름을 아는데**(단지·주택형) 그 이름이 화면 상태에 안 담겨
 * 있어서 자동으로 남길 수가 없었다. 이름을 채우고 나니 자동 저장이 가능해졌다.
 *
 * 저장 조건 셋 — 셋 다 있어야 담는다:
 *   · **이름을 안다**(단지·주택형). 이름 없는 것은 매장에서 고를 수가 없다
 *   · **축척이 확정됐다**. 그 전 좌표는 이미지 픽셀이라 mm 가 아니다
 *   · **방이 둘 이상**. 한 칸짜리는 작업 도중일 가능성이 커서, 이미 잘 저장해 둔 것을
 *     덮어쓰면 손해다
 *
 * 이 기기 localStorage 에만 쌓이고, '벽선 보내기'로 개발자에게 보내면 공용 목록에 든다.
 */
let autoSaveT = null, autoSaidOnce = false;
function autoSaveLibrary(){
  if (!state.complexName || !state.typeName) return;
  if (!state.scaled || state.rooms.length < 2) return;
  clearTimeout(autoSaveT);
  /* 경계를 끄는 동안 매 프레임 저장하지 않게 잠깐 기다린다 */
  autoSaveT = setTimeout(() => {
    const e = saveToLibrary(state.region || '', state.complexName, state.typeName,
                            { quiet: true, auto: true });
    if (e && !autoSaidOnce) {
      autoSaidOnce = true;
      toast(`${state.complexName} ${state.typeName} 벽선을 이 기기에 저장했습니다 — 다음에 열면 바로 3D 로 섭니다`);
    }
  }, 1200);
}

/** 현재 잡아 놓은 방들을 단지로 등록한다 */
function saveToLibrary(region, complex, type, opts){
  const o = opts || {};
  if (!state.rooms.length) { if (!o.quiet) toast('먼저 방을 잡아 주세요'); return; }
  const entry = {
    region: region || '', complex, type,
    addedAt: new Date().toISOString().slice(0, 10),
    /*
     * **그때 쓰던 도면 축척을 함께 남긴다.** 방 좌표는 mm 라 그것만으로 복원되지만,
     * 나중에 같은 도면을 다시 띄우려면 "이 이미지 1px 이 몇 mm 였는지"를 알아야
     * 방과 도면이 같은 자로 그려진다. 없으면 도면은 못 띄우고 방만 복원한다.
     */
    mmPerPx: state.mmPerPx || null,
    rooms: state.rooms.map((r) => ({
      name: r.name,
      parts: r.parts.map((p) => ({
        walls: p.walls.map((w) => ({ x1: Math.round(w.x1), y1: Math.round(w.y1),
                                     x2: Math.round(w.x2), y2: Math.round(w.y2), open: !!w.open })),
      })),
    })),
  };
  /* 자동으로 담은 것은 그렇게 표시한다 — 개발자가 합칠 때 사람이 확인한 것과 구분된다 */
  if (o.auto) entry.auto = true;
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch {}
  // 같은 단지·타입이 있으면 덮어쓴다
  local = local.filter((e) => !(e.complex === complex && e.type === type));
  local.push(entry);
  try { localStorage.setItem(LIB_KEY, JSON.stringify(local)); }
  catch { if (!o.quiet) toast('저장 공간이 가득 찼습니다 — 벽선 보내기로 비워 주세요'); return null; }
  if (!o.quiet) toast(`${complex} ${type} 저장됨 (이 기기)`);
  return entry;
}

/*
 * ── 잡아 둔 벽선을 밖으로 내보낸다 ──────────────────────────────────
 *
 * **공용 목록을 늘리는 유일한 길이 여기다.** 도면 이미지 수집은 소진됐지만 벽선은
 * 파생 측정값이라 저작권 제약이 없어 계속 모을 수 있다. 그런데 이 앱이 저장한 것은
 * 그 기기 localStorage 에만 남아, 상담사가 애써 잡아 둔 벽선이 매장 밖으로 못 나갔다.
 *
 * **예전에는 내려받기뿐이었다.** 폰에서는 파일이 다운로드 폴더에 떨어진 뒤 거기서
 * 끝난다 — 그것을 찾아 카톡에 첨부하는 일은 매장에서 일어나지 않는다. 그래서 결과
 * 이미지와 **같은 방식**으로 보낸다(`share-kit`): `navigator.share` 로 파일째 넘기면
 * 그 자리에서 카톡·메일을 고를 수 있다. 안 되는 기기에서만 내려받기로 물러선다.
 *
 *   · **취소(AbortError)는 실패가 아니다** — 조용히 끝낸다(share-kit 과 같은 규칙).
 *   · **파일명은 영문이다.** 한글 이름은 다운로드·공유에서 조용히 깨진다
 *     (단지 목록 파일을 영문으로 둔 것과 같은 이유).
 *   · **0건이면 내보내지 않는다.** 빈 파일을 건네면 보낸 사람은 보낸 줄 알고,
 *     받는 쪽은 왜 비었는지 모른다. 무엇을 해야 하는지 말해 준다.
 */
async function exportLibrary(){
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch { local = []; }
  if (!local.length) {
    toast('이 기기에 저장해 둔 단지가 없습니다 — 방을 잡고 ‘단지 저장’을 먼저 눌러 주세요');
    return false;
  }

  const name = `plan-library-${new Date().toISOString().slice(0, 10)}-${local.length}.json`;
  const blob = new Blob([JSON.stringify({ version: 1, entries: local }, null, 1)], { type: 'application/json' });

  let file = null;
  try { file = new File([blob], name, { type: 'application/json' }); } catch (_) { /* File 미지원 */ }
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
    try {
      await navigator.share({ files: [file], title: `벽선 ${local.length}건` });
      toast(`벽선 ${local.length}건을 보냈습니다`);
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;   // 사용자가 취소한 것은 실패가 아니다
      /* 공유가 막힌 기기 — 내려받기로 물러선다 */
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`벽선 ${local.length}건을 내려받았습니다`);
  return true;
}

/** 라이브러리 항목을 현재 화면으로 불러온다 — 도면 이미지 없이 방만 복원한다 */
function loadFromLibrary(entry){
  state.img = null; state.imgW = state.imgH = 0;
  state.mask = state.baseMask = state.cleanCv = null; state.sealCache = null;
  state.items = []; state.rooms = []; state.walls = [];
  /*
   * **`mmPerPx` 에 1 을 넣지 말 것.**
   * 이 값의 뜻은 "도면 이미지 1px 이 몇 mm 인가"이지 "월드 단위가 mm 인가"가 아니다.
   * 1 을 넣으면 1,000px 짜리 도면이 **가로 1m** 로 그려져 화면 구석 썸네일이 된다
   * (사용자 지적: 도면은 50px 썸네일, 방만 크게). 저장된 좌표가 이미 mm 라는 사실은
   * `scaled = true` 하나로 충분하다. 도면 이미지의 축척은 **따로** 아는 값이 있을 때만 쓴다.
   */
  state.mmPerPx = (entry && +entry.mmPerPx) || null;
  state.scaled = true;
  for (const r of entry.rooms) {
    const room = { id: 'r' + Math.random().toString(36).slice(2, 8), name: r.name,
                   parts: r.parts.map((p) => ({ walls: p.walls.map((w) => ({ ...w })) })) };
    state.rooms.push(room);
  }
  state.roomSel = state.rooms[0] ? state.rooms[0].id : null;
  syncWalls();
  // 화면에 맞춰 배율을 잡는다
  const xs = state.walls.flatMap((w) => [w.x1, w.x2]), ys = state.walls.flatMap((w) => [w.y1, w.y2]);
  if (xs.length) {
    const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
    const rect = cv.getBoundingClientRect();
    state.zoom = Math.min(rect.width / (w || 1), rect.height / (h || 1)) * 0.85;
    state.panX = 40 - Math.min(...xs) * state.zoom;
    state.panY = 40 - Math.min(...ys) * state.zoom;
  }
  setMode('idle'); setStep(4);
  // 어느 단지·주택형인지 남긴다 — 결과 이미지 제목에 쓴다(상담지에 단지명이 없으면 무슨 종이인지 모른다)
  state.complexName = entry.complex || null;
  state.typeName = entry.type || null;
  evaluate(); renderSide(); draw();
  toast(`${entry.complex} ${entry.type} — 방 ${entry.rooms.length}곳 불러옴`);
}

/*
 * ── 도면 없는 단지 목록 (2026-08-15) ──────────────────────────────
 *
 * 라이브러리에는 도면이 있는 139단지만 있었다. 그런데 경원 관할 경기 12개 시에는
 * **아파트가 2,969곳**이고, 그중 90~2000년대 단지가 1,600여 곳이다 — 고객 대다수가
 * 사는 그 집들이 목록에 아예 없어서 상담사는 *"그 단지는 없습니다"* 로 시작해야 했다.
 *
 * 도면은 못 구한다(실측: 표본 50곳 중 공식 출처가 있는 곳 2곳뿐. 남은 사본은 전부
 * 약관·저작권으로 막힌 집계 사이트에 있다). **그래도 이름·동·입주년월은 실을 수 있다.**
 * 그러면 상담사가 *"○○아파트요? 1998년 입주 단지네요"* 로 받고, 도면은 고객에게
 * 받아 올리면 된다(올리는 즉시 집 전체가 잡힌다).
 *
 * 출처: K-apt 공동주택관리정보시스템(국토교통부) — 100세대 이상 **의무 등록**이라
 * 전수다. 시별로 쪼개 두어 고른 시만 받는다(전체 200KB → 한 시 5~45KB).
 * 매장 전파가 약해도 열려야 하므로 필요한 것만 받는 것이 이 앱의 규칙이다.
 */
/*
 * **시·도와 파일명은 목차(`apt/index.json`)에서 읽는다 — 앱에 표를 또 두지 않는다.**
 * 한때 `APT_KEY` 를 여기 적고 지역명을 `'경기 ' + 시` 로 만들었는데, 강원을 넣는
 * 순간 **춘천·원주까지 전부 '경기'** 가 됐다. 표가 두 곳에 있으면 한쪽만 고치게 된다 —
 * 목차는 `scripts/build-apt-index.mjs` 가 만들며 `{city, sido, key, n}` 을 함께 싣는다.
 * (파일명이 영문인 이유는 그대로다 — 한글 경로는 URL 인코딩·서비스워커 캐시에서
 *  조용히 깨진다.)
 */
var aptCache = {};
var aptCity = {};           // 시 → {n, key, sido} — 목차만 먼저 받아 목록에 적는다
async function loadAptCount(){
  if (Object.keys(aptCity).length) return aptCity;
  try {
    const r = await fetch('apt/index.json');
    if (r.ok) for (const c of (await r.json()).cities || [])
      aptCity[c.city] = { n: c.n, key: c.key, sido: c.sido || '경기' };
  } catch {}
  return aptCity;
}
async function loadAptList(city){
  if (aptCache[city]) return aptCache[city];
  try {
    const meta = aptCity[city];
    if (!meta || !meta.key) { aptCache[city] = []; return []; }
    const r = await fetch('apt/' + meta.key + '.json');
    aptCache[city] = r.ok ? await r.json() : [];
  } catch { aptCache[city] = []; }
  return aptCache[city];
}

let planIndex = null;
async function loadPlanIndex(){
  if (planIndex) return planIndex;
  try {
    const r = await fetch('plan-index.json');
    const j = await r.json();
    planIndex = Array.isArray(j.complexes) ? j.complexes : [];
  } catch { planIndex = []; }
  /* 도면에 인쇄된 방 이름도 함께 받아 둔다 — 단지를 고르는 동안이면 기다림이 안 보인다.
     실패해도 그냥 넘어간다(이름이 없으면 예전처럼 순서대로 붙인다). */
  loadPlanNames().catch(() => {});
  return planIndex;
}

/**
 * 단지 고르기 — **도시 → 단지 → 도면** 순으로 좁혀 간다(2026-08-10 사용자 결정).
 * 매장에서 고객에게 묻는 순서 그대로다("어느 지역이세요" → "어느 단지" → "몇 평형").
 *
 * 도면을 고르면 그 단지의 평면도가 화면에 올라오고 축척 맞추기부터 시작한다.
 * 그 타입의 방을 전에 저장해 두었다면 도면 없이 방까지 그대로 복원한다.
 */
async function openLibrary(){
  const [rawIdx, saved] = await Promise.all([loadPlanIndex(), libraryAll(), loadAptCount()]);
  /*
   * **도면이 아닌 이미지는 목록에서 뺀다**(2026-08-12 사용자 요청).
   *
   * 색인의 관문은 "방 이름이 3종류 이상 읽히는가"라, 아이소메트릭 렌더링 · 인테리어 사진 ·
   * 품목표 · 단지 배치도가 함께 들어와 있다(617장 중 46장). 그런 이미지를 고르면 글씨·범례가
   * 벽으로 잡혀 얇은 띠 같은 방이 나오고, 상담사는 그걸 확인하느라 시간을 버린다.
   * 색인이 실어 준 `axis`(선이 가로·세로에 몰린 정도)로 거른다 — 앱이 이미지를 열었을 때
   * 다시 재는 값과 같은 계산이라 목록 기준과 화면 경고가 어긋나지 않는다.
   *
   * **단, 그 단지의 도면이 전부 걸리면 하나도 빼지 않는다**(실측 4곳).
   * 도면 한 장을 빼는 것은 "이건 평면도가 아니다"라는 말이지만, 단지가 목록에서 통째로
   * 사라지면 **"우리는 그 단지 도면이 없다"**는 다른 말이 된다 — 그건 사실이 아니다.
   * 그런 단지는 그대로 두고 목록에 그 사실을 적는다(열면 화면이 다시 경고한다).
   * 실제로 두산위브더제니스는 큰 입체도 옆에 **쓸 수 있는 작은 평면도**가 함께 있었다.
   */
  const usable = (p) => p.axis == null || p.axis >= AXIS_MIN;
  const idx = rawIdx.map((c) => {
    const keep = (c.plans || []).filter(usable);
    return keep.length ? (keep.length === c.plans.length ? c : { ...c, plans: keep, hidden: c.plans.length - keep.length })
                       : { ...c, allTilted: true };
  });
  let lv = 'region', region = null, cx = null;
  /*
   * **시·도를 먼저 고르게 한다.**
   * 지역이 17곳이라 휴대폰에서는 한 화면에 안 들어가 계속 쓸어내려야 했다
   * (사용자 지적). 지역 이름이 "경기 평택"·"강원 원주" 꼴이라 앞 토막이 곧 시·도다.
   * 칩으로 걸러 두면 경기 14곳 / 강원 5곳이 되어 한 화면에 들어온다.
   */
  const sidoOf = (r) => (String(r).split(' ')[0] || '기타');
  let sido = null;

  const uniq = (a) => [...new Set(a)].sort((x, y) => x.localeCompare(y, 'ko'));
  // 도면이 있는 단지 + 방만 저장된 단지를 함께 보여 준다
  const savedOnly = saved.filter((e) => !idx.some((c) => c.complex === e.complex));
  /*
   * **도면이 한 장도 없는 시도 목록에 남긴다**(2026-08-15). 예전에는 도면 색인에서만
   * 도시를 뽑아 **하남이 통째로 사라졌다** — 관할 12개 시 중 도면 0장인 곳이 그렇다.
   * 도시가 목록에 없으면 상담사에게는 *"우리는 그 지역을 안 다룬다"* 로 읽히는데
   * 그건 사실이 아니다(단지 목록에 하남만 123곳이 있다). 도면 한 장을 빼는 것과
   * 단지가 목록에서 사라지는 것이 다른 말인 것과 같은 이유다.
   */
  const regions = () => uniq([...idx.map((c) => c.region), ...savedOnly.map((e) => e.region || '지역 미지정'),
    /* 색인 표기가 `경기 하남`·`강원 춘천`(시/군 없음)이라 그 꼴로 맞춘다 */
    ...Object.entries(aptCity).map(([c, m]) => m.sido + ' ' + c)]);
  const inRegion = () => idx.filter((c) => c.region === region);
  const savedIn = (complex) => saved.filter((e) => e.complex === complex);

  const render = () => {
    const body = $('#libbody'), crumb = $('#libcrumb');
    if (!body) return;
    /*
     * 경로는 **도시명 › 단지명 › 도면타입** 으로 부른다(2026-08-10 사용자 결정).
     * region 은 "경기 수원"처럼 도가 앞에 붙어 있는데, 도는 이미 위 칩에서 고른 것이라
     * 경로에 또 적으면 같은 말이 두 번이다. 시·군만 남겨 줄을 짧게 만든다.
     */
    const cityOf = (r) => { const sd = sidoOf(r); return r.startsWith(sd + ' ') ? r.slice(sd.length + 1) : r; };
    crumb.innerHTML = lv === 'region' ? '<b>도시</b>'
      : lv === 'complex' ? `<a href="#" data-go="region">도시</a> › <b>${esc(cityOf(region))}</b>`
      : `<a href="#" data-go="region">도시</a> › <a href="#" data-go="complex">${esc(cityOf(region))}</a> › <b>${esc(cx.complex)}</b>`;

    let items = [];
    // 시·도 칩은 지역 단계에서만 띄운다
    const chipBox = $('#libchips');
    if (chipBox) chipBox.innerHTML = '';
    if (lv === 'region') {
      /*
       * **기본 시·도는 지역 수가 아니라 단지 수로 고른다** (2026-08-18).
       *
       * 예전에는 시·군 개수로 정렬해 **강원(18곳)이 경기(12곳)를 이겨** 기본이 됐다.
       * 그런데 관할 단지는 **경기 2,969곳(78%) · 강원 860곳(22%)** 이라, 상담사가 열면
       * 대부분의 경우 칩을 한 번 더 눌러야 자기 단지를 봤다 — 실물 리허설에서
       * *"경기 단지를 못 찾는다"* 로 드러났다.
       */
      const sidoN = (sd) => regions().filter((r)=>sidoOf(r)===sd)
        .reduce((n,r)=> n + ((aptCity[cityOf(r)] || {}).n || 1), 0);
      const sidos = [...new Set(regions().map(sidoOf))].sort((a,b)=> sidoN(b) - sidoN(a));
      if (sido === null || !sidos.includes(sido)) sido = sidos[0] || null;
      if (chipBox && sidos.length > 1) {
        chipBox.innerHTML = sidos.map((sd)=>{
          const n = regions().filter((r)=>sidoOf(r)===sd).length;
