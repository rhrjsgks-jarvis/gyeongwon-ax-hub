<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>설치비용 · 사전준비</title>
<link rel="stylesheet" href="/vendor/fonts/pretendard-variable.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/vendor/fonts/pretendard-variable.css"></noscript>
<style>
  *{box-sizing:border-box}
  /* 한글은 어절 단위로 끊는다 — 좁은 칸에서 말이 반토막 나는 것을 막는다(다른 미니앱과 같은 규칙) */
  body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#f6f7fb;color:#16181b;-webkit-text-size-adjust:100%;
    word-break:keep-all;overflow-wrap:break-word}
  /* 헤더는 아홉 앱이 같은 남색 바다 — 넘겨 볼 때 머리가 같아야 한 제품으로 읽힌다 */
  .topbar{background:#1428A0;color:#fff;padding:14px 16px}
  .topbar-in{max-width:840px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .hd-ico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .hd-t{font-size:17px;font-weight:800;line-height:1.25}
  .hd-s{font-size:11.5px;color:#c7d2fe;margin-top:2px;line-height:1.4}
  .wrap{max-width:840px;margin:0 auto;padding:14px 14px 60px}
  @media(min-width:1024px){.topbar-in,.wrap{max-width:960px}}
  @media(min-width:1440px){.topbar-in,.wrap{max-width:1140px}}

  /* 검색이 주력이다 — 435행은 눈으로 훑을 양이 아니고, 상담사는 "사다리차"·"타공"처럼
     항목 이름으로 찾지 품목부터 고르지 않는다. 그래서 탭보다 위에 둔다. */
  .sbar{background:#fff;border-bottom:1px solid #ecedf1;padding:10px 14px;position:sticky;top:0;z-index:60}
  .sbar-in{max-width:840px;margin:0 auto;position:relative}
  @media(min-width:1024px){.sbar-in{max-width:960px}}
  @media(min-width:1440px){.sbar-in{max-width:1140px}}
  #sq{width:100%;border:1.5px solid #e5e7eb;border-radius:11px;padding:11px 34px 11px 12px;
    font-size:15px;font-family:inherit;background:#fafbfc}
  #sq:focus{outline:none;border-color:#1428A0;background:#fff}
  .sclr{position:absolute;right:6px;top:9px;border:0;background:none;
    font-size:17px;color:#9aa0a6;cursor:pointer;padding:6px}

  /*
   * 검색 결과는 **본문을 덮지 않고 검색창 아래로 내려온다**(2026-08-20 사장님 요청).
   * 예전에는 결과가 본문 자리를 통째로 차지해, 누르기 전에는 표를 볼 수가 없었다.
   * 지금은 목록이 늘 보이고 결과는 그 위에 잠깐 떴다가 누르면 **그 줄로 데려간다.**
   */
  .sdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:70;background:#fff;
    border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.14);
    max-height:min(62vh,460px);overflow:auto;padding:6px}
  .sdrop .shead{font-size:11px;color:#6b7280;padding:6px 8px 7px;line-height:1.5;
    border-bottom:1px solid #f1f3f6;margin-bottom:4px}
  .sr{border-radius:9px;padding:9px 10px;cursor:pointer;font-size:13px;line-height:1.55;color:#1f2937}
  .sr:hover,.sr:focus{background:#f3f5fb;outline:none}
  .sr .w{font-size:10.5px;font-weight:700;color:#1428A0;display:block;margin-bottom:2px}
  .sr mark{background:#FEF08A;color:inherit;padding:0 1px;border-radius:2px}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;
    border-bottom:1px solid #ecedf1;position:sticky;top:59px;z-index:55}
  .tab{padding:10px 4px 9px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:700;
    color:#9aa0a6;border:0;border-bottom:2px solid transparent;transition:all .15s;
    background:none;font-family:inherit}
  .tab.on{color:#1428A0;border-bottom-color:#1428A0}
  .tb-ico{display:block;font-size:15px;margin-bottom:2px;line-height:1}

  /* 품목 칩 — 좁은 화면에서는 가로로 밀어 고른다(줄바꿈하면 위쪽을 두 줄이나 먹는다) */
  /* 오른쪽에 옅은 그림자를 두어 "더 있다"를 알린다 — 잘린 칩만 보이면 끝인 줄 안다 */
  .chipwrap{position:relative;margin:12px 0 14px}
  .chipwrap::after{content:'';position:absolute;right:0;top:0;bottom:2px;width:26px;pointer-events:none;
    background:linear-gradient(90deg,rgba(246,247,251,0),#f6f7fb)}
  @media(min-width:600px){.chipwrap::after{display:none}}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;
    font-weight:600;cursor:pointer;color:#374151;font-family:inherit;transition:.12s;
    white-space:nowrap;flex:0 0 auto}
  .chip.on{background:#1428A0;border-color:#1428A0;color:#fff}
  @media(min-width:600px){.chips{flex-wrap:wrap;overflow:visible}}

  .src{font-size:12px;color:#6b7280;line-height:1.65;background:#fff;border:1px solid #eceef2;
    border-left:3px solid #1428A0;border-radius:11px;padding:11px 13px;margin-bottom:14px}
  .src a{color:#1428A0}
  .src b{color:#374151}

  /* 절은 **기본으로 펼쳐 둔다**(2026-08-20 사장님 요청) — 눌러야 열리면 상담 중에
     어디에 무엇이 있는지 알 수가 없다. 접는 손잡이는 남긴다(긴 표를 잠시 접을 때 쓴다). */
  /*
   * **넓은 화면에서는 절을 두 단으로 흘린다**(2026-08-20). 에어컨은 절이 16개라 한 단으로
   * 세우면 PC 에서 3,600px 이 되고, 정작 오른쪽 절반은 비어 있었다. 절은 서로 독립이라
   * 단으로 흘려도 읽는 순서가 깨지지 않는다. `break-inside` 로 카드가 잘리는 것만 막는다.
   */
  .secs{column-gap:12px}
  @media(min-width:900px){.secs{column-count:2}}
  .sec{background:#fff;border:1px solid #eceef2;border-radius:12px;margin-bottom:12px;overflow:hidden;
    break-inside:avoid;-webkit-column-break-inside:avoid;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .sec>summary{cursor:pointer;list-style:none;padding:12px 14px;font-size:14px;font-weight:800;
    color:#1f2937;display:flex;align-items:center;gap:8px;background:#fcfcfe;
    border-bottom:1px solid #f1f3f6}
  .sec:not([open])>summary{border-bottom-color:transparent}
  .sec>summary::-webkit-details-marker{display:none}
  /* 절 이름 왼쪽에 삼성 블루 짧은 바 — 무게를 주되 색을 늘리지 않는다 */
  .sec>summary::before{content:'';width:3px;height:14px;border-radius:2px;background:#1428A0;flex:0 0 auto}
  .sec>summary::after{content:'▾';color:#c3c7cf;font-size:11px;transition:.15s;margin-left:auto}
  .sec[open]>summary::after{transform:rotate(180deg)}
  /* 건수는 제목 바로 옆에 붙인다 — 가운데 떠 있으면 무엇의 개수인지 흐려진다 */
  .sec>summary .cnt{font-size:10.5px;font-weight:700;color:#6b7280;background:#f1f3f8;
    border-radius:999px;padding:2px 7px;flex:0 0 auto}

  /*
   * **표가 아니라 목록으로 그린다**(2026-08-20 사장님 요청 — *"전기레인지나 정수기 같은
   * 스타일"*). 그 두 표가 읽히는 이유는 칸이 적어서가 아니라 **「이름 → 금액」 두 덩어리로
   * 끝나기 때문**이다. 에어컨(4칸)·식기세척기(5칸)는 같은 자료인데 눈이 흩어진다.
   * 그래서 어느 표든 같은 모양으로 세운다 — 왼쪽에 이름, 오른쪽에 금액.
   */
  /*
   * **절이 하나뿐인 품목도 두 단을 쓰게 한다**(2026-08-20 사장님 지적 — 식기세척기만
   * 1열로 나와 통일성이 없었다). 에어컨·전기레인지는 절이 여럿이라 카드가 두 단으로
   * 흘렀지만, 식기세척기는 절이 하나(47행)라 흘릴 카드가 없어 오른쪽이 통째로 비었다.
   *
   * 그래서 **큰 절은 카드가 두 단을 가로지르고(`column-span`) 그 안의 줄을 두 단으로**
   * 나눈다. 값이 여럿인 표(이전설치·재설치·철거)는 값 상자가 넓어야 하므로 나누지 않는다.
   */
  .sec.wide{column-span:all;-webkit-column-span:all}
  @media(min-width:900px){
    .sec.wide .rows{column-count:2;column-gap:0}
    .sec.wide .r{break-inside:avoid;-webkit-column-break-inside:avoid}
    /* 가운데에 옅은 선 하나 — 두 단이 붙어 보이지 않게 */
    .sec.wide .rows{column-rule:1px solid #f1f3f6}
  }
  .rows{}
  .r{display:flex;align-items:baseline;gap:12px;padding:10px 14px;border-bottom:1px solid #f4f5f8;
    transition:background .12s}
  @media(hover:hover){.r:hover{background:#fafbff}}
  .r:last-child{border-bottom:0}
  .r .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#1f2937;line-height:1.5}
  .r .v{flex:0 0 auto;font-size:15px;font-weight:800;color:#111827;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .r .v .u{font-size:11px;font-weight:600;color:#9aa0a6;margin-left:2px}
  .r .v.free{color:#1428A0}
  .r .v.soft{font-size:13px;font-weight:700;color:#6b7280}
  /* 값이 여럿인 표(이전설치·재설치·철거 / 신제품·이전) — 이름 아래에 나란히 세운다 */
  .r.multi{display:block}
  .r.multi .nm{margin-bottom:7px}
  .vs{display:flex;flex-wrap:wrap;gap:8px}
  .vs>span{flex:1 1 96px;background:#f8f9fc;border:1px solid #eef0f4;border-radius:9px;
    padding:6px 9px;min-width:0}
  .vs i{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:#9aa0a6;
    margin-bottom:1px;letter-spacing:.02em}
  .vs b{font-size:14.5px;font-weight:800;color:#111827;font-variant-numeric:tabular-nums}
  .vs b.free{color:#1428A0}
  .vs b.soft{font-size:12.5px;font-weight:700;color:#6b7280}
  .r .nt{font-size:11.5px;color:#6b7280;line-height:1.6;margin-top:5px}
  .foot2{font-size:11.5px;color:#92400E;background:#FEF9E7;border-top:1px solid #f4ead0;
    padding:8px 13px;line-height:1.6;font-weight:600}
  .r.only{color:#6b7280;font-size:11.5px;background:#fbfcfe;line-height:1.6;display:block}
  /* 검색으로 찾아온 줄 — 잠깐 강조했다가 가라앉는다 */
  .hit{animation:hit 2.6s ease-out}
  @keyframes hit{0%,55%{background:#FEF08A}100%{background:transparent}}
  /*
   * 좁은 화면에서도 **금액은 오른쪽에** 둔다. 예전에는 420px 아래에서 금액을 이름 밑으로
   * 내렸는데, 그러면 "이름 → 금액" 대비가 사라지고 세로만 길어졌다. 이름이 길면 접히게
   * 두고 금액 칸만 안 접히게 하면 390px 에서도 한 줄에 들어간다(실측).
   */
  @media(max-width:420px){
    .r{padding:10px 12px;gap:9px}
    .r .nm{font-size:13px}
    .r .v{font-size:14.5px}
  }

  .safe{background:#fff;border:1px solid #eceef2;border-radius:12px;padding:14px;margin-bottom:12px}
  .safe h3{margin:0 0 4px;font-size:14.5px;color:#1f2937}
  .safe .tg{font-size:13px;color:#374151;line-height:1.7;margin-bottom:12px}
  .safe .tg b{color:#1428A0}
  .yn{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  @media(max-width:460px){.yn{grid-template-columns:1fr}}
  .yn>div{border-radius:10px;padding:11px 12px}
  .yn .y{background:#EEF2FF;border:1px solid #dbe3ff}
  .yn .n{background:#FEF2F2;border:1px solid #fde0e0}
  .yn h4{margin:0 0 6px;font-size:12.5px}
  .yn .y h4{color:#1428A0}
  .yn .n h4{color:#B91C1C}
  .yn ul{margin:0;padding-left:16px;font-size:13px;line-height:1.75;color:#374151}
  .yn .spec{margin-top:7px;font-size:13.5px;font-weight:800;color:#1428A0}
  .lines{margin:0;padding-left:16px;font-size:13px;line-height:1.85;color:#374151}
  .lines li::marker{color:#1428A0}
  .warnbox{margin-top:11px;background:#FEF3C7;border:1px solid #fde68a;border-radius:10px;
    padding:10px 12px;font-size:12.5px;color:#92400E;line-height:1.6;font-weight:600}
  .foot{font-size:11.5px;color:#6b7280;margin-top:10px;line-height:1.6}
  .foot a{color:#1428A0}
  /* 멀티탭 가능/불가 — 지면의 그림을 그대로 붙인다. 글보다 그림이 먼저 읽힌다 */
  .icl{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
  .icl li{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.72);
    border-radius:9px;padding:5px 9px 5px 5px;font-size:12.5px;color:#374151;font-weight:600}
  .icl .ic{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
  /* 설치 전 준비 카드 안의 항목 — 제목 · 설명 · 그림 순서로 세운다 */
  .pit{border-top:1px solid #f1f3f6;padding:11px 0 3px}
  .pit:first-of-type{border-top:0}
  .pt{font-size:13.5px;font-weight:800;color:#1f2937;line-height:1.5;margin-bottom:4px}
  .pd{font-size:12.5px;color:#4b5563;line-height:1.7}
  /* 그림은 누르면 원본 크기로 열린다 — 매장에서 고객에게 확대해 보여준다 */
  .shot{display:block;margin:9px 0 4px;border:1px solid #eef0f4;border-radius:10px;overflow:hidden;
    background:#fff;max-width:520px}
  .shot img{display:block;width:100%;height:auto}
  /* 넓은 화면에서는 설명 옆에 두 단으로 — 세로로만 쌓으면 스크롤이 끝없이 길어진다 */
  @media(min-width:900px){
    .safe{padding:16px 18px}
    .prepgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  }
  .empty{text-align:center;color:#9aa0a6;font-size:12.5px;padding:26px 10px;line-height:1.7}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="hd-ico">🧾</div>
    <div>
      <div class="hd-t">설치비용 · 사전준비</div>
      <div class="hd-s">신규 설치 추가비 · 이전설치 · 안전한 사용준비</div>
    </div>
  </div>
</div>

<!--
  검색을 탭보다 위에 둔다. 상담 중에 나오는 말은 "사다리차 얼마죠" · "타공비" · "멀티탭"
  인데, 그게 어느 탭에 있는지는 상담사가 알 이유가 없다. 고르면 **그 줄로 데려간다.**
-->
<div class="sbar">
  <div class="sbar-in">
    <input id="sq" type="search" placeholder="사다리차 · 타공 · 앵글 · 멀티탭 · 이전설치…" autocomplete="off">
    <button class="sclr" id="sclr" hidden aria-label="지우기">✕</button>
    <div class="sdrop" id="sdrop" hidden></div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab on" data-tab="new"><span class="tb-ico">🔧</span>신규 설치 추가비</button>
  <button class="tab" data-tab="care"><span class="tb-ico">🚚</span>이전 · 재설치 · 철거</button>
  <button class="tab" data-tab="prep"><span class="tb-ico">🔌</span>설치 전 준비</button>
</div>

<div class="wrap" id="body"><div class="empty">불러오는 중…</div></div>

<script src="share-kit.js"></script>
<script>
/*
 * 자료는 `public/install-cost.json` — `npm run build:installcost` 가 만든다.
 * 인라인으로 넣지 않은 이유는 145KB 라 미니앱 파싱 시간에 그대로 얹히기 때문이고,
 * 서비스워커가 SWR 로 잡아 매장 전파가 약해도 열린다.
 */
var D = null, TAB = 'new', CAT = {}, Q = '';

var esc = function (s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };

/* 검색 정규화는 만드는 쪽(build-install-cost)과 같아야 한다 — 한쪽만 쉼표를 지우면
   `36,300` 으로 색인해 놓고 `36300` 으로 찾아 영영 안 걸린다 */
var norm = function (s) { return String(s).toLowerCase().replace(/,(?=\d)/g, '').replace(/\s+/g, ' ').trim(); };

/*
 * **어느 칸이 금액인지는 머리글이 스스로 말해 준다.** 칸 수를 손으로 세면 표 모양이
 * 조금만 달라도 어긋난다 — 에어컨은 `구분|규격|금액`, 사다리차는 `구분|신제품 설치|이전설치`,
 * 식기세척기는 `구분|작업항목|고객단가|작업내용` 이다. 머리글로 판정하면 셋 다 같은
 * 목록으로 선다.
 */
var VAL_H = /금액|단가|비용|이전설치|재설치|철거|신제품|케어\+/;
var NOTE_H = /비고|작업내용|설명/;
/*
 * **`무상` 과 `해당 없음` 은 다른 말이다.** 무상은 "돈을 안 받는다", 해당 없음은
 * "그 서비스 자체가 없다" — 파랗게 같이 칠하면 상담사가 무상으로 읽는다.
 * (타사비교에서 `없음`·`미공개`·`비대상` 을 갈라 적는 것과 같은 규칙이다.)
 */
var MONEY = /^[\d,]+$/, FREE = /^(무상|무료)$/, NA = /^-?\s*해당\s*없음$/;
var SOFT = /^(실비|발생실비|견적가|견적 후 합의|상담필요)/;

function money(v) {
  if (!v) return '';
  if (NA.test(v)) return '<span class="v soft">해당 없음</span>';
  if (FREE.test(v)) return '<span class="v free">' + esc(v) + '</span>';
  if (MONEY.test(v)) return '<span class="v">' + esc(v) + '<span class="u">원</span></span>';
  if (SOFT.test(v) || v.length > 12) return '<span class="v soft">' + esc(v) + '</span>';
  return '<span class="v">' + esc(v) + '</span>';
}
function moneyIn(v) {
  if (NA.test(v)) return '<b class="soft">해당 없음</b>';
  if (FREE.test(v)) return '<b class="free">' + esc(v) + '</b>';
  if (MONEY.test(v)) return '<b>' + esc(v) + '<span class="u">원</span></b>';
  if (SOFT.test(v) || v.length > 12) return '<b class="soft">' + esc(v) + '</b>';
  return '<b>' + esc(v) + '</b>';
}

/*
 * 격자(신규 설치)와 이름+값 목록(이전설치)을 **같은 모양**으로 만든다.
 * → { vh:[값 칸 이름], rows:[{ name, vals:[], note }] }
 */
function normalizeGrid(sec) {
  var head = sec.grid.slice(0, sec.headRows);
  var last = head[head.length - 1] || [];
  var W = sec.grid[0].length;
  var vi = [], ni = [], ti = [];
  for (var i = 0; i < W; i++) {
    var h = last[i] || '';
    if (NOTE_H.test(h)) ti.push(i);
    else if (VAL_H.test(h)) vi.push(i);
    else ni.push(i);
  }
  /* 머리글이 값 칸을 안 밝히면 맨 오른쪽을 값으로 본다 — 그래야 빈손으로 끝나지 않는다 */
  if (!vi.length) { vi = [W - 1]; ni = ni.filter(function (x) { return x !== W - 1; }); }
  var uniq = function (a) { var o = [], p = null; a.forEach(function (x) { if (x !== p) { o.push(x); p = x; } }); return o; };
  return {
    vh: vi.map(function (i) { return last[i] || ''; }),
    rows: sec.grid.slice(sec.headRows).map(function (r) {
      return {
        name: uniq(ni.map(function (i) { return r[i]; }).filter(Boolean)).join(' · '),
        vals: vi.map(function (i) { return r[i] || ''; }),
        note: ti.map(function (i) { return r[i]; }).filter(Boolean).join(' '),
      };
    }),
  };
}
/*
 * 이전설치(케어플러스) 쪽은 만드는 쪽에서 이미 **이름 · 값 · 비고**로 갈라 둔다.
 * 예전에는 화면이 머리글 자리로 다시 잘랐는데, 행마다 칸 수가 달라 **한 칸씩 밀렸다**
 * (`앵글 → 규격 110,000원 / 금액 "설치비 + 자재비 기준…"`). 갈라 놓은 것을 그대로 쓴다.
 */
function normalizeRows(sec) {
  return {
    vh: sec.head.slice(1),
    rows: sec.rows.map(function (r) {
      if (r.note && !r.label) return { only: r.note };     // 표 끝의 `* …` 주석 줄
      return { name: r.label, vals: r.values || [], note: r.note || '' };
    }),
  };
}

/* 「이름 → 금액」 한 줄. 값이 여럿이면 이름 아래에 나란히 둔다. */
function listOf(n, pfx) {
  var multi = n.vh.length > 1;
  return '<div class="rows">' + n.rows.map(function (r, ri) {
    var id = ' data-id="' + pfx + ':' + ri + '"';
    if (r.only) return '<div class="r only"' + id + '>' + esc(r.only) + '</div>';
    if (!multi) {
      return '<div class="r"' + id + '><div class="nm">' + esc(r.name)
        + (r.note ? '<div class="nt">' + esc(r.note) + '</div>' : '') + '</div>'
        + money(r.vals[0]) + '</div>';
    }
    var seen = r.vals.filter(Boolean);
    return '<div class="r multi"' + id + '><div class="nm">' + esc(r.name) + '</div>'
      + (seen.length ? '<div class="vs">' + r.vals.map(function (v, i) {
          return v ? '<span><i>' + esc(n.vh[i]) + '</i>' + moneyIn(v) + '</span>' : '';
        }).join('') + '</div>' : '')
      + (r.note ? '<div class="nt">' + esc(r.note) + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}

/*
 * **두 단으로 나눌 절인가.** 값이 하나뿐이고(이름 → 금액) 줄이 많은 절이 대상이다.
 * 값이 여럿인 표(이전설치·재설치·철거)는 값 상자 셋이 나란해야 해서 나누면 짓눌린다.
 */
function isWide(n) { return n.vh.length <= 1 && n.rows.length >= 14; }

/* 절은 기본으로 펼친다 — 눌러야 열리면 무엇이 있는지 알 수가 없다 */
function section(title, n, inner, foot, wide) {
  return '<details class="sec' + (wide ? ' wide' : '') + '" open><summary><span>' + esc(title) +
    '</span><span class="cnt">' + n + '건</span></summary>' + inner
    + (foot ? '<div class="foot2">※ ' + esc(foot) + '</div>' : '') + '</details>';
}

function chips(list, cur, tab) {
  return '<div class="chipwrap"><div class="chips">' + list.map(function (c) {
    return '<button class="chip' + (c.key === cur ? ' on' : '') + '" data-tab="' + tab +
      '" data-cat="' + c.key + '">' + esc((c.icon ? c.icon + ' ' : '') + c.name) + '</button>';
  }).join('') + '</div></div>';
}

function render() {
  var el = document.getElementById('body');
  if (!D) { el.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }

  if (TAB === 'new') {
    var cats = D.newInstall.categories, key = CAT.new || cats[0].key;
    var c = cats.filter(function (x) { return x.key === key; })[0] || cats[0];
    el.innerHTML = chips(cats, c.key, 'new')
      + '<div class="src"><b>' + esc(D.newInstall.title) + '</b> — ' + esc(D.newInstall.note)
      + '<br>' + esc(c.note) + ' · 확인 ' + esc(D.collectedAt)
      + ' · <a href="' + esc(c.url) + '" target="_blank" rel="noopener">원문 보기</a></div>'
      + '<div class="secs">' + c.sections.map(function (s, i) {
          var n = normalizeGrid(s);
          return section(s.title, n.rows.length, listOf(n, 'new:' + c.key + ':' + i), s.foot, isWide(n));
        }).join('') + '</div>';
    return;
  }

  if (TAB === 'care') {
    var gs = D.careplus.groups, k = CAT.care || gs[0].key;
    var g = gs.filter(function (x) { return x.key === k; })[0] || gs[0];
    el.innerHTML = chips(gs, g.key, 'care')
      + '<div class="src"><b>' + esc(D.careplus.title) + '</b> — ' + esc(D.careplus.note)
      + '<br>출처 삼성닷컴 케어플러스 · 확인 ' + esc(D.careplus.collectedAt)
      + ' · <a href="' + esc(D.careplus.source) + '" target="_blank" rel="noopener">원문 보기</a></div>'
      + '<div class="secs">' + g.sections.map(function (s, i) {
          var n = normalizeRows(s);
          return section(s.title, n.rows.length, listOf(n, 'care:' + g.key + ':' + i), s.foot, isWide(n));
        }).join('') + '</div>';
    return;
  }

  /*
   * 설치 전 준비 — 원문 지면의 **그림과 글을 함께** 싣는다(2026-08-20 사장님 요청).
   * 예전에는 멀티탭 글만 있고 나머지 두 지면은 "그림이라 못 옮겼습니다"로 링크만 뒀는데,
   * 그 두 지면이 **설치 불가 조건·필요 공간·타공 기준**을 담고 있어 상담에서 바로 쓰인다.
   * 그림은 펼쳐 보여주고, 글은 옮겨 적어 검색에 걸리게 한다.
   */
  var sf = D.safety, ico = function (x) {
    return x.img ? '<img class="ic" src="' + esc(x.img) + '" alt="" loading="lazy">' : '';
  };
  el.innerHTML = '<div class="safe"><h3>' + esc(sf.title) + '</h3>'
    + '<div class="tg" data-id="prep:targets">대상제품 <b>' + sf.targets.map(esc).join(' · ') + '</b></div>'
    + '<div class="yn"><div class="y" data-id="prep:ok"><h4>' + esc(sf.ok.label) + '</h4><ul class="icl">'
    + sf.ok.items.map(function (i) { return '<li>' + ico(i) + '<span>' + esc(i.t) + '</span></li>'; }).join('')
    + '</ul><div class="spec">' + esc(sf.ok.spec) + '</div></div>'
    + '<div class="n" data-id="prep:no"><h4>' + esc(sf.no.label) + '</h4><ul class="icl">'
    + sf.no.items.map(function (i) { return '<li>' + ico(i) + '<span>' + esc(i.t) + '</span></li>'; }).join('')
    + '</ul></div></div>'
    + '<ul class="lines">' + sf.lines.map(function (l, i) {
        return '<li data-id="prep:line:' + i + '">' + esc(l) + '</li>'; }).join('') + '</ul>'
    + '<div class="warnbox">멀티탭 정격용량을 넘겨 쓰면 화재 위험이 있습니다. 전원은 벽면 콘센트에 제품 단독으로 꽂는 것이 원칙입니다.</div>'
    + '<div class="foot">확인 ' + esc(D.collectedAt)
    + ' · <a href="' + esc(sf.url) + '" target="_blank" rel="noopener">원문 보기</a></div></div>'
    + (D.prepMore || []).map(function (c) {
        return '<div class="safe" data-id="prep:' + esc(c.key) + '"><h3>' + esc(c.title) + '</h3>'
          + '<div class="tg">' + esc(c.lead) + '</div>'
          + (c.img ? '<a class="shot" href="' + esc(c.img) + '" target="_blank" rel="noopener">'
              + '<img src="' + esc(c.img) + '" alt="' + esc(c.imgAlt || c.title) + '" loading="lazy"></a>' : '')
          + '<div class="prepgrid">' + c.items.map(function (x, i) {
              return '<div class="pit" data-id="prep:' + esc(c.key) + ':' + i + '">'
                + '<div class="pt">' + esc(x.t) + '</div>'
                + '<div class="pd">' + esc(x.d) + '</div>'
                + (x.img ? '<a class="shot" href="' + esc(x.img) + '" target="_blank" rel="noopener">'
                    + '<img src="' + esc(x.img) + '" alt="' + esc(x.t) + '" loading="lazy"></a>' : '')
                + '</div>';
            }).join('') + '</div>'
          + '<div class="foot">확인 ' + esc(D.collectedAt)
          + ' · <a href="' + esc(c.url) + '" target="_blank" rel="noopener">원문 보기</a></div></div>';
      }).join('');
}

/* ── 검색 ────────────────────────────────────────────────
 * 한 글자는 조건으로 쓰지 않는다(어디에나 걸린다). 모든 토큰을 포함해야 한다(AND).
 * 결과는 본문을 덮지 않고 검색창 아래로 내려오고, 고르면 **그 줄로 데려간다.**
 */
function runSearch() {
  var drop = document.getElementById('sdrop');
  var toks = norm(Q).split(' ').filter(function (t) { return t.length > 1; });
  if (!toks.length) { drop.hidden = true; drop.innerHTML = ''; return; }

  var hit = D.index.filter(function (r) {
    return toks.every(function (t) { return r.k.indexOf(t) >= 0; });
  });
  /* 0건이면 안 걸린 말을 빼고 다시 찾고, 뺀 말을 밝힌다 — 조용히 빼지 않는다 */
  var dropped = [];
  if (!hit.length && toks.length > 1) {
    var live = toks.filter(function (t) { return D.index.some(function (r) { return r.k.indexOf(t) >= 0; }); });
    dropped = toks.filter(function (t) { return live.indexOf(t) < 0; });
    if (live.length) hit = D.index.filter(function (r) {
      return live.every(function (t) { return r.k.indexOf(t) >= 0; });
    });
  }

  var TABN = { new: '신규 설치 추가비', care: '이전 · 재설치 · 철거', prep: '설치 전 준비' };
  var head = hit.length
    ? '결과 ' + hit.length + '건 — 누르면 그 자리로 갑니다'
      + (dropped.length ? ' · 없는 말이라 뺐습니다: ' + dropped.map(esc).join(', ') : '')
    : '찾지 못했습니다. 사다리차 · 타공 · 앵글 · 멀티탭처럼 항목 이름으로 찾아보세요.';
  drop.innerHTML = '<div class="shead">' + head + '</div>'
    + (hit.length ? hit.slice(0, 80).map(function (r) {
        return '<div class="sr" tabindex="0" data-go="' + esc(r.tab) + '" data-cat="' + esc(r.cat)
          + '" data-target="' + esc(r.id || '') + '">'
          + '<span class="w">' + esc(TABN[r.tab]) + ' · ' + esc(r.sec) + '</span>' + hl(r.t, toks) + '</div>';
      }).join('') : '')
    + (hit.length > 80 ? '<div class="shead" style="border:0">앞의 80건만 보여줍니다. 검색어를 좁혀 보세요.</div>' : '');
  drop.hidden = false;
  drop.scrollTop = 0;
}
function hl(text, toks) {
  var out = esc(text);
  toks.forEach(function (t) {
    /* 정규식 특수문자를 그대로 넣으면 터진다 — 사용자가 치는 말이라 반드시 막아 둔다 */
    var safe = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>');
  });
  return out;
}

/*
 * 검색 결과를 누르면 **탭·품목·그 줄까지** 데려간다. 찾아 주기만 하고 두면 결국 다시 뒤진다.
 * 줄은 글자가 아니라 **키**로 찾는다 — 같은 금액이 여러 줄에 있어 글자로는 못 가른다.
 */
function go(tab, cat, target) {
  TAB = tab; if (cat) CAT[tab] = cat;
  [].forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('on', t.dataset.tab === tab); });
  closeDrop();
  render();
  if (!target) { window.scrollTo(0, 0); return; }
  var el = document.querySelector('[data-id="' + String(target).replace(/"/g, '') + '"]');
  if (!el) { window.scrollTo(0, 0); return; }
  /* 접어 둔 절 안이면 펼치고 나서 옮긴다 — 닫힌 채로는 스크롤이 엉뚱한 곳에 선다 */
  var d = el.closest ? el.closest('details') : null;
  if (d && !d.open) d.open = true;
  if (el.scrollIntoView) el.scrollIntoView({ block: 'center' });
  el.classList.remove('hit');
  void el.offsetWidth;                 // 같은 줄을 다시 눌러도 강조가 한 번 더 돌게
  el.classList.add('hit');
}
function closeDrop() {
  var d = document.getElementById('sdrop'); d.hidden = true; d.innerHTML = '';
}

/* ── 조작 ─────────────────────────────────────────────── */
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('.tab'); if (!b) return;
  go(b.dataset.tab, null, null);
});
document.getElementById('body').addEventListener('click', function (e) {
  var chip = e.target.closest('.chip');
  if (chip) { CAT[chip.dataset.tab] = chip.dataset.cat; render(); }
});
var drop = document.getElementById('sdrop');
var pick = function (e) {
  var sr = e.target.closest('.sr'); if (!sr) return;
  go(sr.dataset.go, sr.dataset.cat, sr.dataset.target);
};
drop.addEventListener('click', pick);
drop.addEventListener('keydown', function (e) { if (e.key === 'Enter') pick(e); });

var sq = document.getElementById('sq');
sq.addEventListener('input', function () {
  Q = this.value; document.getElementById('sclr').hidden = !Q; runSearch();
});
/* Enter 는 첫 결과로 — 폰에서 목록을 다시 누르지 않아도 되게 */
sq.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var first = drop.querySelector('.sr');
  if (first) { e.preventDefault(); go(first.dataset.go, first.dataset.cat, first.dataset.target); this.blur(); }
});
document.getElementById('sclr').addEventListener('click', function () {
  sq.value = ''; Q = ''; this.hidden = true; closeDrop(); sq.focus();
});
/* 바깥을 누르면 결과가 닫힌다 — 폰에서 목록이 화면을 계속 덮고 있으면 안 된다 */
document.addEventListener('click', function (e) {
  if (!e.target.closest('.sbar-in')) closeDrop();
}, true);

fetch('install-cost.json').then(function (r) { return r.json(); }).then(function (j) {
  D = j;
  var p = new URLSearchParams(location.search);
  var t = p.get('tab');
  if (t && ['new', 'care', 'prep'].indexOf(t) >= 0) { TAB = t; if (p.get('cat')) CAT[t] = p.get('cat'); }
  [].forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.toggle('on', x.dataset.tab === TAB); });
  render();
  /* 통합검색에서 `?q=` 로 들어오면 그 말로 바로 찾아 첫 결과로 데려간다 */
  var q = p.get('q');
  if (q) {
    sq.value = q; Q = q; document.getElementById('sclr').hidden = false; runSearch();
    var first = drop.querySelector('.sr');
    if (first) go(first.dataset.go, first.dataset.cat, first.dataset.target);
  }
  if (window.parent !== window) parent.postMessage({ type: 'share-state', on: true }, '*');
}).catch(function () {
  document.getElementById('body').innerHTML =
    '<div class="empty">자료를 불러오지 못했습니다.<br>연결을 확인하고 새로고침해 주세요.</div>';
});

/* 테스트가 들여다보는 손잡이 */
window.__cost = {
  get data() { return D; }, go: go,
  search: function (q) { sq.value = q; Q = q; runSearch();
    return [].map.call(document.querySelectorAll('#sdrop .sr'), function (e) { return e.textContent; }); },
  /* 검색 → 첫 결과로 이동했을 때 실제로 그 줄이 잡히는가 */
  jump: function (q) { this.search(q);
    var f = document.querySelector('#sdrop .sr'); if (!f) return null;
    go(f.dataset.go, f.dataset.cat, f.dataset.target);
    var el = document.querySelector('.hit'); return el ? el.textContent.replace(/\s+/g, ' ').trim() : null; },
};
</script>
</body>
